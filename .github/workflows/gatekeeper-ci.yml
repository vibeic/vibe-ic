name: Gatekeeper CI

# ---------------------------------------------------------------------------
# Gatekeeper CI — REQUIRED status checks that gate every landing onto `main`.
#
# This workflow runs the EXISTING governance programs that the core-agent loop
# already self-runs locally, but as enforced, branch-protected PR checks so the
# gatekeeper identity (and ONLY the gatekeeper identity) can land code. It is
# intentionally SEPARATE from ci.yml (the historical push/PR test workflow,
# which is NOT deleted): ci.yml proves "the tree builds and tests pass"; this
# workflow proves "this change is allowed to land per the governance doctrine".
#
# Doctrine enforced here (see vibe-ic-marketplace/plugins/vibe-ic/programs):
#   * source_chip_agnostic_check.py    — GENERAL / chip-AGNOSTIC source guard
#   * git_prohibition_guard.py         — no forbidden destructive git ops
#                                        (scans the PR's own commit messages)
#   * marketplace_version_sync_check.py— plugin.json == marketplace.json
#   * version_bump_monotonic_check.py  — new version strictly > base (no no-op
#                                        /plugin update, no regression)
#   * agent_checkin_scope_guard.py     — PR diff stays within an allowed zone
#   * plugin_full_audit.py             — D1 program-test + D2 step-checker audit
#   * pytest                           — the plugin suite the CI way
#
# CADENCE-AWARE (2026-06-17 policy):
#   * PATCH bump   (x.y.Z, Z>0)  → TARGETED subset: the governance gates +
#                                  plugin-tree pytest only (fast inner loop).
#   * MILESTONE    (x.y.0)       → FULL both-tree suite: governance gates +
#                                  plugin pytest + tools/ pytest + MCP smoke +
#                                  full JSON/YAML lint.
#   The cadence is decided ONCE by the `cadence` job from the version in this
#   PR's head vs its merge base, and fanned out to the other jobs.
#
# GITHUB MERGE-QUEUE FOOTGUN:
#   The native merge queue re-runs required checks on the `merge_group` event,
#   NOT on `pull_request`. If the required check job NAMES do not ALSO appear
#   for `merge_group`, the queue waits forever for a check that never fires and
#   stalls. We therefore wire BOTH triggers and the SAME job names so every
#   required check is satisfiable on the PR *and* in the queue.
# ---------------------------------------------------------------------------

on:
  pull_request:
    branches: [main]
  merge_group:            # native merge queue — MUST fire the same job names
    branches: [main]

# A second PR push / queue entry supersedes the first for the same ref.
concurrency:
  group: gatekeeper-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PLUGIN_ROOT: vibe-ic-marketplace/plugins/vibe-ic
  PROGRAMS: vibe-ic-marketplace/plugins/vibe-ic/programs
  MARKETPLACE_DIR: vibe-ic-marketplace/.claude-plugin

jobs:
  # -------------------------------------------------------------------------
  # cadence: decide PATCH (targeted) vs x.y.0 MILESTONE (full) ONCE, from the
  # plugin.json version in this change vs its merge base. Works for both the
  # pull_request and merge_group events (each provides a base sha we can diff).
  # -------------------------------------------------------------------------
  cadence:
    name: Cadence decision (patch vs milestone)
    runs-on: ubuntu-latest
    outputs:
      level: ${{ steps.decide.outputs.level }}
      version: ${{ steps.decide.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # need merge base for the version diff

      - name: Decide cadence from version
        id: decide
        run: |
          set -euo pipefail
          PJSON="$PLUGIN_ROOT/.claude-plugin/plugin.json"
          VERSION="$(python3 -c "import json;print(json.load(open('$PJSON'))['version'])")"
          # PATCH part of semver x.y.Z
          PATCH="$(printf '%s' "$VERSION" | awk -F. '{print $3}')"
          if [ "${PATCH:-0}" = "0" ]; then
            LEVEL=milestone
          else
            LEVEL=patch
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "level=$LEVEL" >> "$GITHUB_OUTPUT"
          echo "Resolved version=$VERSION -> cadence=$LEVEL" >&2

  # -------------------------------------------------------------------------
  # governance-gates: ALWAYS runs (patch AND milestone). These are the core
  # required checks. Names are stable so branch protection + the merge queue
  # can require them on both events.
  # -------------------------------------------------------------------------
  governance-gates:
    name: Governance gates (chip-AGNOSTIC + version + scope + git)
    needs: cadence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history for base..head diffs + git show

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pyyaml pytest-timeout

      # Resolve the merge base of this change for the diff-/range-based gates.
      # pull_request: github.event.pull_request.base.sha is the base commit.
      # merge_group:  github.event.merge_group.base_sha is the queue base.
      - name: Resolve base SHA
        id: base
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "merge_group" ]; then
            BASE="${{ github.event.merge_group.base_sha }}"
          else
            BASE="${{ github.event.pull_request.base.sha }}"
          fi
          # Fallback: merge-base against origin/main if the event field is empty.
          if [ -z "${BASE:-}" ]; then
            git fetch --no-tags --depth=1 origin main || true
            BASE="$(git merge-base origin/main HEAD || git rev-parse HEAD~1)"
          fi
          echo "sha=$BASE" >> "$GITHUB_OUTPUT"
          echo "Base SHA = $BASE" >&2

      # The repo-wide invariant gates, shared verbatim with ci.yml. This job is
      # the ONLY one that fires on `merge_group`, so anything missing here is
      # missing from the last check before a change lands. Four of these gates
      # (evidence-citation, flow-gate enforcement, L-doc field producer,
      # tracked-symlink portability) were CI-only and therefore absent from the
      # merge-queue path — the same asymmetry #394 found in the NDA guard.
      # Sharing the script makes the drift impossible rather than unlikely.
      # GH_TOKEN: the artefact-defect close gate (#381) reads the issue
      # tracker. Without a token it prints SKIPPED and passes, which is
      # exactly the "wired to nothing" state #381 is about — so give it the
      # corpus rather than let it be decoration.
      - name: repo-hygiene gates (shared with ci.yml)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash tools/ci/repo_hygiene_gates.sh

      # The source guard above scans FILES only. A commit whose MESSAGE names
      # the commercial foundry / SKU / process therefore passed every gate — and
      # one really did land on main after the full-history NDA rewrite. A commit
      # message is permanent and publicly mirrored, so scan the landing range.
      # The checker's output is MASKED (token ROLE, never the literal), so this
      # step's log is safe.
      - name: NDA guard — commit MESSAGES in this PR
        run: |
          set -euo pipefail
          BASE="${{ steps.base.outputs.sha }}"
          python3 "$PROGRAMS/commit_msg_nda_check.py" \
            --repo "$GITHUB_WORKSPACE" --rev-range "${BASE}..HEAD"

      # The step above scans the commit TEXT only. The same token is equally
      # permanent when it arrives as added CONTENT or as an added PATH, and
      # the path carrier is live: local run directories on this fleet carry a
      # commercial SKU in their NAME and no .gitignore rule covers them, so a
      # single `git add -A` would land one. ci.yml gained this scan in
      # v1.6.27; this workflow — the one that gates the MERGE — still had only
      # the message half, so the stricter gate was the weaker one.
      - name: NDA guard — added CONTENT and PATHS in this PR
        run: |
          set -euo pipefail
          BASE="${{ steps.base.outputs.sha }}"
          python3 "$PROGRAMS/nda_diff_scan_check.py" \
            --repo "$GITHUB_WORKSPACE" --rev-range "${BASE}..HEAD"

      - name: git prohibition guard (scan this PR's commit messages)
        run: |
          set -euo pipefail
          BASE="${{ steps.base.outputs.sha }}"
          # The guard scans command TEXT. The available textual record of the
          # commands run on this change is the PR's own commit subjects+bodies;
          # feed every commit in BASE..HEAD so a forbidden op recorded in a
          # commit message (e.g. "git push --force") fails the gate.
          git log --format='%s%n%b' "${BASE}..HEAD" > /tmp/pr_commit_text.txt || true
          # An empty range (no new commits) is an HONEST empty scan, not a pass
          # of N commits — the guard flags vacuous=true but exits 0.
          python3 "$PROGRAMS/git_prohibition_guard.py" /tmp/pr_commit_text.txt

      - name: marketplace ↔ plugin version sync
        run: |
          python3 "$PROGRAMS/marketplace_version_sync_check.py" \
            --marketplace-dir "$MARKETPLACE_DIR"

      - name: version bump is monotonic (version-less PR allowed)
        run: |
          # --version-by-gatekeeper: an authoring PR is VERSION-LESS by
          # DOCTRINE (skills/gatekeeper-loop) — the gatekeeper assigns the
          # monotonic version at merge, because two in-flight PRs that each
          # self-bumped would collide. So "no version change" is the happy
          # path here and MUST pass; without this flag the gate failed on
          # every single conforming PR and carried no information.
          # This does NOT weaken the gate: a version that goes BACKWARDS
          # still fails, here and everywhere. The bump itself is enforced
          # with the flag OFF at Step 3.5 of the merge queue, after
          # gatekeeper_assign_version.py writes the version.
          python3 "$PROGRAMS/version_bump_monotonic_check.py" \
            --plugin-json "$PLUGIN_ROOT/.claude-plugin/plugin.json" \
            --marketplace-json "$MARKETPLACE_DIR/marketplace.json" \
            --base "${{ steps.base.outputs.sha }}" \
            --version-by-gatekeeper

      - name: check-in scope guard (PR diff stays in an allowed zone)
        run: |
          # The gatekeeper lands work authored by ANY role, but the *diff* must
          # still fall inside a governed zone. core-agent is the only role
          # allowed to touch the whole tree, so the landing role is core-agent;
          # the per-author scope is enforced upstream at authoring time.
          python3 "$PROGRAMS/agent_checkin_scope_guard.py" \
            --role core-agent --base "${{ steps.base.outputs.sha }}"

  # -------------------------------------------------------------------------
  # plugin-audit-tests: the TARGETED subset that runs on EVERY cadence (patch
  # and milestone). On a milestone the additional full-suite jobs below also
  # run; on a patch ONLY this targeted job runs.
  # -------------------------------------------------------------------------
  plugin-audit-tests:
    name: Plugin audit + pytest (targeted)
    needs: cadence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # need base..HEAD history for the diff selector

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pyyaml pytest-timeout

      # Same EDA tool setup as ci.yml: the shape-C / port-rule gates compile
      # fixtures with iverilog, and the pnr.tcl emitter tests eval Tcl in tclsh.
      - name: Install EDA tools (iverilog + tclsh + yosys + verilator)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends iverilog tcl yosys verilator

      # Resolve the merge base of this change (same shape as governance-gates):
      # pull_request -> base.sha, merge_group -> base_sha, fallback merge-base.
      - name: Resolve base SHA
        id: base
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "merge_group" ]; then
            BASE="${{ github.event.merge_group.base_sha }}"
          else
            BASE="${{ github.event.pull_request.base.sha }}"
          fi
          if [ -z "${BASE:-}" ]; then
            git fetch --no-tags --depth=1 origin main || true
            BASE="$(git merge-base origin/main HEAD || git rev-parse HEAD~1)"
          fi
          echo "sha=$BASE" >> "$GITHUB_OUTPUT"
          echo "Base SHA = $BASE" >&2

      - name: plugin_full_audit (D1 program-test + D2 step-checker)
        run: |
          python3 "$PROGRAMS/plugin_full_audit.py" "$PLUGIN_ROOT"

      # benchmark-data evidence structure — enforce the canonical
      # benchmark-data/ic/<IC>/v<ver>_<PDK>/ layout on ANY evidence folder this
      # PR adds/modifies, so every FUTURE publish is correct by construction.
      # Diff-scoped (--changed-since BASE): pre-existing folders are grandfathered
      # and a plugin-only PR no-ops; fail-open if the base is undeterminable.
      - name: benchmark-data evidence structure (diff-scoped)
        run: |
          python3 "$PROGRAMS/benchmark_evidence_structure_check.py" \
            --tree benchmark-data --changed-since "${{ steps.base.outputs.sha }}"

      # PATCH cadence gate: the FULL both-tree suite is milestone-only (90+ min
      # on a 2-core hosted runner — unusable per-PR). Here we run only the FAST
      # targeted subset that covers this PR's changed files, plus a fixed
      # doctrine smoke set (the selector guarantees a non-empty floor). The full
      # suite still runs on the x.y.0 `full-suite-milestone` job below.
      - name: Select + run targeted pytest subset
        run: |
          set -euo pipefail
          BASE="${{ steps.base.outputs.sha }}"
          python3 "$PROGRAMS/ci_targeted_test_select.py" --base "$BASE" \
            > /tmp/targeted_tests.txt
          echo "----- selected targeted subset -----"
          cat /tmp/targeted_tests.txt
          echo "------------------------------------"
          cd "$PLUGIN_ROOT"
          # The selector prints plugin-root-relative paths; run them from here.
          # It never emits an empty list (smoke set is the floor), but guard
          # anyway so an unexpected empty file can't silently pass zero tests.
          if [ ! -s /tmp/targeted_tests.txt ]; then
            echo "::error::targeted selector produced no tests"; exit 1
          fi
          xargs pytest -q --maxfail=10 --timeout=180 --timeout-method=thread \
            < /tmp/targeted_tests.txt

  # -------------------------------------------------------------------------
  # full-suite-milestone: the EXTRA both-tree coverage that ONLY runs on an
  # x.y.0 milestone. Gated by the cadence output so a patch PR skips it, but
  # the job still REPORTS (and is required) on every event with a stable name
  # so the merge queue is never left waiting — when skipped it succeeds as a
  # no-op via the `if:` guard (GitHub reports skipped required jobs as neutral
  # success for the queue once they appear).
  # -------------------------------------------------------------------------
  full-suite-milestone:
    name: Full both-tree suite (milestone x.y.0 only)
    needs: cadence
    if: ${{ needs.cadence.outputs.level == 'milestone' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: vibe-ic-marketplace/plugins/vibe-ic/mcp-eda/package.json

      - name: Install python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pyyaml pytest-timeout

      - name: Install EDA tools (iverilog + tclsh + yosys + verilator)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends iverilog tcl yosys verilator

      - name: pytest (plugin tree)
        run: |
          cd "$PLUGIN_ROOT"
          pytest -q --maxfail=20 --timeout=300 --timeout-method=thread

      - name: pytest (tools tree, if present)
        run: |
          if [ -d tools ] && ls tools/test_*.py >/dev/null 2>&1; then
            pytest -q tools --maxfail=20 --timeout=300 --timeout-method=thread
          else
            echo "no tools/test_*.py — skipping second tree"
          fi

      - name: MCP server smoke import
        run: |
          if [ -d "$PLUGIN_ROOT/mcp-eda" ]; then
            cd "$PLUGIN_ROOT/mcp-eda"
            npm install
            node -e "import('./src/index.js').then(() => console.log('import OK')).catch(e => { console.error(e); process.exit(1); })"
          else
            echo "no mcp-eda — skipping MCP smoke"
          fi

      - name: Validate all JSON + YAML
        run: |
          python3 - <<'PY'
          import json, yaml, pathlib, sys
          bad = []
          for p in pathlib.Path(".").rglob("*.json"):
              # Source only — exclude generated benchmark-data/ result artifacts
              # and third-party */vendor/ (JSONC etc.), same as ci.yml.
              if any(x in p.parts for x in ("node_modules", ".git", "benchmark-data", "vendor")):
                  continue
              try:
                  json.load(open(p))
              except Exception as e:
                  bad.append(f"{p}: {e}")
          for p in list(pathlib.Path(".").rglob("*.yml")) + list(pathlib.Path(".").rglob("*.yaml")):
              # Source only — exclude generated benchmark-data/ result artifacts
              # and third-party */vendor/ (JSONC etc.), same as ci.yml.
              if any(x in p.parts for x in ("node_modules", ".git", "benchmark-data", "vendor")):
                  continue
              try:
                  yaml.safe_load(open(p))
              except Exception as e:
                  bad.append(f"{p}: {e}")
          if bad:
              print("INVALID (%d):" % len(bad))
              for b in bad:
                  print("  " + b)
              sys.exit(1)
          print("all JSON + YAML valid")
          PY

  # -------------------------------------------------------------------------
  # gatekeeper-required: single aggregating gate. Branch protection can require
  # JUST this one job name on both `pull_request` and `merge_group`; it passes
  # only when every upstream gate that actually ran succeeded. This keeps the
  # required-checks list stable even though some jobs are cadence-skipped.
  # -------------------------------------------------------------------------
  gatekeeper-required:
    name: Gatekeeper required (aggregate)
    if: ${{ always() }}
    needs:
      - cadence
      - governance-gates
      - plugin-audit-tests
      - full-suite-milestone
    runs-on: ubuntu-latest
    steps:
      - name: Verify all required upstream gates passed
        run: |
          set -euo pipefail
          echo "cadence              = ${{ needs.cadence.result }}"
          echo "governance-gates     = ${{ needs.governance-gates.result }}"
          echo "plugin-audit-tests   = ${{ needs.plugin-audit-tests.result }}"
          echo "full-suite-milestone = ${{ needs.full-suite-milestone.result }} (skipped on patch)"
          # A gate is acceptable iff it succeeded OR was legitimately skipped
          # (full-suite-milestone is skipped on a patch cadence). Any failure
          # or cancellation fails the aggregate.
          fail=0
          for r in \
            "${{ needs.cadence.result }}" \
            "${{ needs.governance-gates.result }}" \
            "${{ needs.plugin-audit-tests.result }}"; do
            if [ "$r" != "success" ]; then fail=1; fi
          done
          ms="${{ needs.full-suite-milestone.result }}"
          if [ "$ms" != "success" ] && [ "$ms" != "skipped" ]; then fail=1; fi
          if [ "$fail" -ne 0 ]; then
            echo "::error::one or more required gatekeeper gates did not pass"
            exit 1
          fi
          echo "ALL REQUIRED GATEKEEPER GATES PASSED"
