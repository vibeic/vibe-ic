name: Bug report
description: A reproducible bug in the plugin, the MCP server, or a deterministic check.
title: "[bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill out the
        fields below — concrete repro + version info is what unblocks us.

  - type: input
    id: plugin_version
    attributes:
      label: vibe-ic plugin version
      description: From `vibe-ic-marketplace/plugins/vibe-ic/.claude-plugin/plugin.json`
      placeholder: "0.1.0"
    validations:
      required: true

  - type: input
    id: server_version
    attributes:
      label: MCP server version
      description: From the bundled MCP server (vibe-ic-marketplace/plugins/vibe-ic/mcp-eda/package.json)
      placeholder: "0.1.0"
    validations:
      required: true

  - type: input
    id: env
    attributes:
      label: OS + Python + Node
      placeholder: "Ubuntu 22.04, Python 3.11.7, Node 20.10.0"
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: |
        Exact commands, exact prompts, exact input files. If the bug
        involves a doc shape, attach the smallest version of the doc
        that triggers it (sanitize private content first).
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
      description: "What did you expect? What happened instead?"
    validations:
      required: true

  - type: textarea
    id: compliance_check
    attributes:
      label: flow_compliance_check output (if relevant)
      description: "Paste the output of `flow_compliance_check.py --strict`"
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-flight
      options:
        - label: "I searched existing issues and did not find a duplicate"
          required: true
        - label: "I sanitised any private IC / vendor / customer names from the reproduction"
          required: true
