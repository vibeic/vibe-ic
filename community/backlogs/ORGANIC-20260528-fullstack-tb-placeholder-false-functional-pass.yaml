type: bug
severity: P1
component: program:full_stack_tb_gen + gate:bit_level_full_stack
plugin_version: "0.1.25"

title: >-
  Generic full-stack TB reports functional PASS with expected_bytes="XX" — it
  never checks the DUT's actual output, so a real RTL functional bug ships as
  "8/8 PASS"

pattern: |
  Fresh blind benchmark_clean v0.1.25 sha256 run: phase2 reported full-stack TB
  "8/8 vectors PASS" and the bit_level_full_stack gate PASSed. But
  phase2/stage1/sim_full_stack/results.json shows `expected_bytes: "XX"` for ALL
  8 vectors — the generated testbench drives stimulus and decodes a response byte
  but compares it against the placeholder "XX", so EVERY vector "passes"
  regardless of the DUT output. It is a connectivity/smoke test, not a functional
  check.

  Consequence: the GENERATED sha256 RTL carried a real SHA-256 message-schedule
  indexing bug (`new_w = sigma1(w_mem[1]) + w_mem[6] + sigma0(w_mem[14]) + w_mem[15]`
  instead of the correct forward-window
  `sigma1(w_mem[14]) + w_mem[9] + sigma0(w_mem[1]) + w_mem[0]`). The full-stack TB
  did not catch it; only an independent FIPS-180-4 KAT ("abc"→ba7816bf…,
  ""→e3b0c442…) exposed it. A benchmark that exists to measure doc→correct-silicon
  must not emit a green functional verdict from a TB with no golden reference.

suggested_fix: |
  1. The bit_level_full_stack gate must FAIL (or at minimum DOWNGRADE to
     "connectivity-only, functional UNVERIFIED") when results.json contains any
     `expected_bytes == "XX"` / placeholder / null golden. A PASS may only be
     claimed when every scored vector has a concrete expected value.
  2. full_stack_tb_gen should populate expected_bytes from a real golden source
     when the class/spec provides one:
       - L7 verification-plan reference vectors / KAT table, OR
       - for standard algorithms (hash/cipher/codec), the public standard's KAT
         (FIPS-180-4 for SHA-256), OR
       - a spec-derived behavioral golden model co-simulated alongside the DUT.
     For digital_arithmetic_primitive specifically, L7 almost always names a KAT
     or a reference function — wire it in.
  3. Emit an explicit `functional_coverage: {scored_with_golden: N, placeholder: M}`
     field so a downstream auditor can see at a glance whether the PASS is real.
  4. Regression: re-run sha256 — with golden KAT vectors the pre-fix RTL must
     FAIL (catching the W-schedule bug), and the corrected RTL must PASS bit-exact.

id: "ORGANIC-20260528-fullstack-tb-placeholder-false-functional-pass"
submitted_at: "2026-05-28T01:55:00+08:00"
session_context: >-
  Filed by the v0.1.25 benchmark_clean fresh four-IC real-case run + sha256 timing
  re-run (see benchmark_clean/RESULT_v0125_fresh.md). This is the most consequential
  finding of the run: the functional gate gave a false-positive PASS on
  functionally-WRONG RTL. The timing re-run agent caught it only because it ran an
  independent FIPS KAT. Until the gate refuses placeholder goldens, any "doc→silicon
  PASS" for this IC class is functionally unverified. Related: the same sha256 re-run
  also fixed real general phase3 gaps (L9 -period regex ignored 25.9ns→fell back to
  20.0; PnR ran no set_wire_rc / no repair_design / no repair_timing -setup, only
  hold) — those are validated in phase3_one_shot_runner.py (WNS -102.76→+10.95 MET).

status: resolved
resolved_at: "2026-06-03"
resolved_in: "vibe-ic 0.2.32"
resolution: >-
  All three requested fixes are now implemented and the false-functional-PASS
  hole is closed for EVERY IC class (not just protocol chips). The
  no-cheating property is enforced on BOTH sides: the runner refuses to claim
  a functional PASS without a concrete golden, and the gate refuses to PASS on
  placeholder goldens.

  FIX 1 (gate — programs/bit_level_full_stack_tb_oracle_check.py): new Rule 9
  `PLACEHOLDER_GOLDEN_NO_FUNCTIONAL_PASS`. The gate now classifies every
  scored vector's expected_bytes via classify_expected_bytes(): a value that
  is missing / null / empty, or that contains ANY placeholder token (XX / ?? /
  blank / non-hex — _is_placeholder_token, chip-AGNOSTIC) is NOT a golden. If
  ANY scored vector lacks a concrete golden the gate FAILs (a placeholder TB
  can never report a functional PASS). An explicit
  `functional_unverified_connectivity_only` waiver (>=40 chars) DOWNGRADES the
  FAIL to a loud "connectivity-only, functional UNVERIFIED" WARN — never a
  silent green.

  FIX 2 (TB-gen — programs/phase2_one_shot_runner.py): added module-level
  helpers _golden_bytes_from_l3_opcode (returns a concrete comma-hex golden
  ONLY when every byte of L3.opcodes[].response_payload_template is a concrete
  hex literal, else None) and _finalize_full_stack_results (assembles an honest
  results.json: functional_verified is True ONLY when every vector has a
  concrete golden AND its actual matches; vectors_passed reflects functional
  scoring). Both emission sites (step_full_stack_tb_gen skeleton path +
  step_reference_tb protocol-IP path) were reworked: NO site emits
  expected_bytes:"XX" + verdict:"PASS" anymore — vectors with no concrete
  golden are emitted UNVERIFIED (expected_bytes=null), and padding vectors are
  honest UNVERIFIED bring-up steps. step_full_stack_tb_gen now returns SKIP
  (connectivity-only) instead of a fabricated PASS when functional is
  unverified. Connectivity vs functional are reported as two orthogonal,
  never-conflated verdicts.

  FIX 3: results.json (runner) AND the gate's --json output now both emit
  functional_coverage:{scored_with_golden, placeholder} so a downstream
  auditor sees at a glance whether the green verdict is real.

  FIX 4 (regression): test_sha256_kat_regression_golden_pass_vs_buggy_fail
  models the SHA-256 KAT at the gate level — with concrete golden KAT bytes a
  buggy DUT (actual != golden, vectors_passed<total) FAILs while a correct DUT
  (actual==golden) PASSes bit-exact; a placeholder golden would have masked the
  bug and is refused by Rule 9.

  Tests (all green):
   - tests/test_bit_level_full_stack_tb_oracle_check.py — +7 cases:
     test_all_placeholder_golden_fails, test_partial_placeholder_golden_fails,
     test_null_expected_bytes_fails, test_functional_coverage_emitted,
     test_real_golden_pass_emits_coverage,
     test_placeholder_connectivity_waiver_downgrades,
     test_sha256_kat_regression_golden_pass_vs_buggy_fail (21 total pass).
   - tests/test_phase2_issue20_fixes.py — +2 cases:
     test_full_stack_tb_gen_populates_concrete_golden,
     test_full_stack_tb_gen_never_emits_placeholder_pass, plus the existing
     emit test now asserts no fabricated functional PASS.
   - tests/test_phase2_class_aware_gating.py — preconditions updated to accept
     the honest SKIP verdict (TB file still emitted).
   Full programs/tests suite + stage1/stage2/flow_compliance suites pass.
residual: >-
  OPTIONAL ENHANCEMENT (not a correctness/cheating hole — the false-PASS is
  closed): for standard algorithms (hash/cipher/codec) the runner does not yet
  AUTO-GENERATE a public-standard KAT (e.g. FIPS-180-4 SHA-256) or co-simulate
  a spec-derived behavioral golden model to POPULATE expected_bytes. Today a
  hash/cipher core whose L3 gives no concrete response template is honestly
  reported as functional-UNVERIFIED (SKIP/CONNECTIVITY_ONLY, deferred to
  gate-level synth + Phase 3 / an independent KAT) rather than falsely green —
  so the run's 'most consequential finding' (a wrong SHA core shipping as 8/8
  PASS) is no longer reproducible. Wiring an auto-KAT / behavioral-golden
  SOURCE is a larger capability (reference model authoring + co-sim harness)
  tracked as a follow-on enhancement; it would let those cores reach a real
  functional PASS in-runner instead of only an honest UNVERIFIED.
