type: enhancement
severity: P2
component: program:gold_cross_contamination_check
plugin_version: "0.2.13"

title: >-
  Ship a deterministic gold/generated cross-contamination check that reuses the
  protocol-detector library — Tier-G parallel-agent authoring left foreign-
  protocol content in benchmark golds (io_link gold carried SENT; mdio generated
  carried Ethernet EtherType/ARP), and gated-parity-0 is BLIND to it.

pattern: |
  The v0.1.94 Tier-G sweep authored 24 protocols in parallel agent waves. Two
  cross-contaminations surfaced only in the v0.2.13 phase1 close-loop:

  1. io_link/phase1/claude_extracted (the GOLD) carried SENT (SAE J2716)
     content — nibble_encoding / spc_variant / tick_nominal_us / CRC-4 / 56-tick
     calibration — across ~13 L-docs (36 spurious ABSENT_IN_PROGRAM findings).
     IO-Link (SDCI / IEC 61131-9) has NONE of that; the program was correct.

  2. mdio/phase1/generated_docs carried Ethernet-FRAME content (an
     ethertype_table with ARP 0x0806 / PTP 0x88F7, mac_frame_format,
     pause_frame_sequence, a SMBus/PMBus management-bus list) injected by the
     generic runner because MDIO is an IEEE-802.3 sub-clause.

  Why gated-parity-0 MASKS both:
    - When BOTH program and gold share the contamination (e.g. usb_pd's
      fabricated 0x11-0x1F opcodes) -> VALUE_MISMATCH = 0.
    - When the contamination is in the program only (mdio Ethernet tables) ->
      it is ABSENT_IN_AGENT, which the gated metric does not count.
    - When in the gold only (io_link SENT) -> it surfaces as ABSENT_IN_PROGRAM
      ONLY if the program never emits it; a contaminated program would hide it.
  So a clean gated number does NOT certify a contamination-free benchmark. Both
  defects were caught by an adversarial review + a bidirectional no-misfire
  matrix, NOT by parity. This is the v0.1.89 "force-overwrite-to-0 masks errors"
  lesson applied to benchmark-data fidelity.

suggested_fix: |
  Add programs/gold_cross_contamination_check.py:
    1. Discover every protocol detector (the AUTO_DISPATCH is_<x> drop-ins AND
       the hand-wired is_<x> in *_protocol_synth.py).
    2. For each benchmark <b> in benchmark_phase1/, build the gold blob
       (claude_extracted L1-L3) and the generated blob (generated_docs L1-L3),
       and run EVERY detector against both.
    3. FAIL if any FOREIGN detector (a protocol whose stem != <b>) fires on
       <b>'s gold or generated blob -> likely cross-contamination; emit the
       (foreign_detector, benchmark, which_blob) tuple for human review.
    4. Also scan for known-foreign distinctive token clusters (e.g. a doc whose
       L1 ic_name says protocol X but whose body carries protocol Y's signature
       tokens) as a second, detector-independent signal.
  Corpus sweep before shipping: run against all 87 phase1 benchmarks; after the
  v0.2.13 io_link + mdio cleanups it should report ZERO foreign fires. Any
  residual fire is another contaminated gold to clean (the Tier-G batch may have
  left more). The check reuses benchmark_phase1/_no_misfire_matrix.py logic —
  promote that scratch script into programs/ and add the gold direction.

