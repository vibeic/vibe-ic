hardening_v0_2_8:
  date: "2026-06-01"
  what: >-
    Real-pad-ring validation of the ESD presence sub-check. The v0.2.7 _ESD_CELL_HINTS
    (diode/_esd/ggnmos/ggnmof/antenna) detected only a SEPARATE discrete ESD cell and gave a FALSE
    "ESD missing" on a real sky130 ring (where ESD is INTEGRAL to the gpiov2/hvc/lvc/clamped pad
    cells). A 3-lens design panel + 3 adversarial critics vetted the sky130 IO ESD taxonomy; the
    hardened _classify_io_cell() uses IO-family gating + negation-before-esd + esd-before-structural
    ordering. Validated on the real Caravel chip_io.def: was ESD_MISSING / 811 false pads → now
    esd_presence=PRESENT, 10 signal pads, 10 ESD-bearing, 612 com_bus_slice fillers excluded.
  adversarial_resolved:
    - "negation hazard: 'unclamped'/'noclamp'/'declamp' no longer read as ESD-present (MISSING)"
    - "structural over-match: 'gpiov2_corner_pad'/'esd_clamp_slice' classed ESD before corner/_slice_"
    - "lvc AND hvc both = clamp = ESD-bearing (sky130 fact)"
    - "core-macro + std-cell antenna diode stays N/A (diode is not an IO-ring cell)"
  status: "ESD presence sub-check now real-ring-accurate; status stays MANUAL_REVIEW (per-pad discharge-path topology still needs commercial PERC / LVS-ESD). +6 edge-case tests."

automation_v0_2_9:
  date: "2026-06-01"
  what: >-
    Automated the CONNECTIVITY HALF of per-pad ESD discharge-path verification (the part that does
    NOT need device physics), shrinking the ESD MANUAL_REVIEW residual to exactly clamp HBM/CDM
    sizing. New _esd_discharge_topology() + _parse_def_net_terminals() emit a NEW AUTOMATED category
    "ESD discharge-path topology (connectivity)" in perc_equivalent: C2 domain-loop completeness
    (supply clamp with no matching vss return clamp = open loop), C3 clamp stitching (each ESD pad/
    clamp tied to BOTH a power and a ground net per DEF NETS), + rated-cell membership. A
    TOPOLOGY_GAP is a conclusive automated FAIL -> PERC_EQUIV_FAIL; TOPOLOGY_OK is
    necessary-but-not-sufficient. Designed + adversarially verified by a 7-agent workflow
    (3-angle design panel + 3 over-claim critics).
  honesty: >-
    An adversarial panel (3 critics, all NEEDS_FIX) proved a connectivity check CANNOT emit a clean
    "ESD safe" pass: connected != rated != sized (custom cells named to look rated, undersized rated
    cells). So TOPOLOGY_OK explicitly states necessary-but-not-sufficient, the presence category
    STAYS MANUAL_REVIEW, and clamps outside the sky130 IO rated family are flagged 'rating cannot be
    inherited'. The win is automating the conclusive FAILs (open loop / dangling clamp / unrated),
    not manufacturing a pass.
  validated_on: >-
    Real Caravel chip_io.def: 63 ESD-pad instances, all 3 domain loops closed (vddio/vssio, vccd/
    vssd, vdda/vssa), 0 dangling, 0 unrated -> TOPOLOGY_OK (sizing still MANUAL).
  residual_now: "ONLY device-physics: clamp HBM/CDM sizing (TLP/It2), inherited from the rated library-cell datasheet; + latch-up device topology + cross-domain device network. Commercial PERC/TLP."
  tests_added: "+11 (topology unit matrix + DEF net-terminal parser + 2 emitter-integration)."

latchup_v0_2_10:
  date: "2026-06-01"
  what: >-
    Automated the conclusive-FAIL half of the latch-up well-tap category. New
    _welltap_presence_check() emits a NEW AUTOMATED "Latch-up well-tap presence" category: a routed
    DEF with 0 valid well/substrate-tap cells is a conclusive WELLTAP_GAP FAIL -> PERC_EQUIV_FAIL.
    Tap match is whole-segment 'tap' token + sky130 rated-tap allowlist (bootstrap/captune/adaptor
    never count; foreign 'tap'-token masters reported unknown, not counted). The old MANUAL-only
    "Latch-up / well-tap" stub is renamed "Latch-up / well-tap (spacing + device-physics)" and STAYS
    MANUAL_REVIEW.
  real_bug_caught: >-
    The real spm/subservient/neorv32 routed DEFs in-container all ship 0 tap cells (302/4105/47503
    components, 0 taps) — a genuine v0.1.45-class tapcell-skip structural latch-up exposure that this
    check now flags conclusively, not a box-tick.
  honesty: >-
    A 6-agent workflow (3-angle design + 3 over-claim critics, BOTH critics NOT SOUND) proved the
    spatial density / max-tap-distance checks over-claim from DEF alone (degenerate DIEAREA,
    looser-than-foundry pitch, tapvgnd-only ties, fail-open unrecognized cells). So ONLY tap presence
    (the adversarially-bulletproof, conclusive-FAIL part) is shipped; WELLTAP_PRESENT is stated
    necessary-but-not-sufficient and never claims 'latch-up safe'. Spacing -> DRC deck; device
    physics (Vhold>Vdd, SCR beta product, guard-ring efficacy) -> MANUAL.
  residual_now: "tap SPACING (max-tap-distance — screened by the DRC deck) + device-physics latch-up (Vhold/SCR-beta/guard-ring efficacy — commercial PERC/TLP)."
  tests_added: "+7 (presence matrix incl. false-token + foreign-tap + the real-0-tap emitter-integration FAIL)."

xdomain_v0_2_11:
  date: "2026-06-01"
  what: >-
    Automated the conclusive-FAIL half of the cross-voltage-domain category + fixed a REAL
    domain-count bug surfaced by running the shipped functions on the real Caravel chip_io.def.
    (1) DOMAIN-COUNT FIX: new _discover_power_domains() counts distinct power/ground domain
    families from a UNION of NETS + SPECIALNETS USE POWER/GROUND, with a net-name-token fallback
    when no USE keyword exists. The old single_supply heuristic read ONLY SPECIALNETS, so Caravel
    chip_io.def (supplies declared as plain NETS, 0 SPECIALNETS) was WRONGLY classified
    single-supply -> x-domain auto-N/A (silent over-claim). Now correctly multi_domain=True.
    (2) +'vswitch' to _net_pg_class power tokens (sky130 IO power-switch rail was mis-classed
    signal). (3) CONCLUSIVE FAIL: new _xdomain_levelshifter_check() -> XDOMAIN_GAP when >=2 domains
    AND 0 level-shifter/isolation/IO-crossing cells (an inter-domain signal is guaranteed
    un-shifted) -> PERC_EQUIV_FAIL.
  honesty: >-
    A 6-agent workflow (3-angle design + 3 over-claim critics, BOTH critics UNSOUND/NOT-SOUND)
    proved (a) XDOMAIN_OK_PRESENCE over-claims ("a crossing cell exists somewhere" != "every
    crossing is shifted" — connect_vcchib is a power-bus slice, not necessarily a signal shifter),
    and (b) aggressive digit-strip family-collapse can UNDER-count (vdd1 1.8V + vdd2 1.2V merged ->
    false single-supply -> silent over-claim). So we ship ONLY the conservative bulletproof subset:
    presence keeps the category MANUAL_REVIEW (no structural OK emitted); family-collapse strips
    decoration only (_pad/_q/_h/_core/_net), NOT index digits, so voltage splits stay distinct;
    unresolved partitions -> INCOMPLETE, never silent N/A. Per-crossing direction / isolation
    efficacy stay device-physics MANUAL.
  validated_on: >-
    Real Caravel chip_io.def (in-container, shipped functions): 0 SPECIALNETS, supplies via NETS ->
    OLD code returned ([],[]) -> single-supply (WRONG); NEW _discover_power_domains -> power
    families {vccd1,vccd2,vcchib,vdda,vddio,vswitch}, ground {vssa,vssd1,vssio} -> multi_domain=True
    (correct). Synthetic edge matrix all pass (genuine single supply, conservative collapse,
    vswitch, zero-crossing GAP, LS-present MANUAL, iso whole-segment guard, unresolved INCOMPLETE).
  residual_now: "per-crossing level-shifter correctness (every crossing shifted? direction lo->hi/hi->lo?) + isolation-clamp efficacy under power-gating = device physics, commercial PERC."
  tests_added: "+10 (domain-count incl. the Caravel-NETS-only fix + conservative-collapse + vswitch + unresolved-not-NA; level-shifter zero-crossing GAP + present-MANUAL + iso whole-segment + single-supply-NA)."

