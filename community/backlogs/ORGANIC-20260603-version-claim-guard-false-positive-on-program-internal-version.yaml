type: tool-gap
severity: P3
component: tools/ci/staged_version_claim_check.py (Staged-diff version-claim guard)

plugin_version: "0.2.27"
status: resolved

title: >-
  The pre-commit "version-claim guard" false-positives on each program's INTERNAL
  `version` field, on filename-embedded doc versions, on spec-section source
  citations, and (the dominant residual) on historical `v1.6.x` provenance
  comments left over from the 1.6.x -> 0.2.x version-scheme RESET — all read as a
  plugin-version claim ahead of plugin.json.

pattern: |
  Surfaced syncing the public vibe-ic plugin tree into the AI_IC_design monorepo
  (which installs the guard as a git pre-commit hook; the public GitHub worktree
  does NOT install it, so public commits never ran it). The guard treats any
  X.Y.Z numerically greater than plugin.json.version as a forward plugin claim.
  Several DISTINCT namespaces collide with that assumption:
    (a) program-internal version constants:  VERSION = "1.0.0" / "version": "1.0.0"
    (b) dataclass-annotated version fields:   version: str = "1.1.0"
    (c) filename-embedded doc versions:       ALL_STEPS_v2.2.0.md / CANONICAL_FLOW_v2.2.0.pdf
    (d) spec-section source citations:        {"source": "A3.1.1"}  (letter-prefixed)
    (e) HISTORICAL provenance comments to the OLD 1.6.x scheme, e.g.
          # Per the v1.6.30 anti-fabrication doctrine (rule #5)
          # v1.6.607 — v2-rename cascade leftover
        The plugin RESET its version from 1.6.x to 0.2.x; every backward
        reference to a 1.6.x version now sorts ABOVE 0.2.27.
  A full-tree-as-additions sweep (initial AID import / large resync) raised
  ~4897 findings; a normal DELTA commit (e.g. the v0.2.27 sync) raised 10.

resolution: |
  PARTIALLY FIXED in vibe-ic 0.2.27 (public commits 0a64299 + 01c2193 + the
  follow-up that landed classes b/d; AID mirror 4c1972095). The guard now
  exempts, with GENERAL structural carve-outs (no keyword) + regression tests
  (27/27 pass):
    (a) VERSION / __version__ = "X.Y.Z" and "version": "X.Y.Z"   [FIXED]
    (b) version[: type] = "X.Y.Z" annotated/plain field          [FIXED]
    (c) filename-embedded version (X.Y.Z followed by a file ext)  [FIXED]
    (d) letter-prefixed numeric triple (A3.1.1 section anchor)    [FIXED]
  These remove the false-positives that block NORMAL delta commits (the v0.2.27
  sync's pre-commit now passes cleanly with NO --no-verify).

residual: |
  OPEN — class (e), historical v1.6.x provenance comments. This is the dominant
  remaining false-positive on a FULL-TREE resync (~4850 of the 4897). It cannot
  be closed by a structural carve-out because these lines ARE free-prose version
  mentions of the exact shape the guard exists to catch — the only thing that
  makes them benign is domain knowledge that 1.6.x PRE-DATES the 0.2.x reset.
  A correct fix needs a version-scheme-reset-aware heuristic (e.g. a configured
  "historical band" 1.0.0–1.6.999 that is always treated as backward when the
  plugin major is 0), designed carefully so it does NOT create a false-NEGATIVE
  hole for a genuine future 1.x claim. Deferred: the guard mis-fires ONLY on a
  full-tree resync (not normal commits), and the wrong heuristic would weaken
  the guard's core purpose, so this is left for a dedicated design pass.

suggested_fix: |
  Add an opt-in historical-band config to staged_version_claim_check.py:
  versions within a declared pre-reset range are always historical. Acceptance:
  re-stage the full plugin tree and confirm the guard raises ZERO findings
  while the 27 regression tests (incl. the forward-claim catches) still pass.

