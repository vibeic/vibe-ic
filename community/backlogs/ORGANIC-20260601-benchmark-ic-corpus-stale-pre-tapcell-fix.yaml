core_regen_resolution: >-
  CORE fix (suggested_fix #1/#2) DONE v0.2.36 — the 14 DEF-bearing benchmark_ic ICs were
  REGENERATED through the current tapcell+PDN phase3 runner (container-serial in the iic-eda
  mount /foss/designs, since main-checkout benchmark_ic is NOT mounted). ALL 14 now produce a
  tap-bearing routed DEF (was 0 taps across the board): cv32e40p 2nd/4th=11121, darkriscv
  2nd/4th=3900, VexRiscv 2nd/4th=4751, picorv32 4th=5497 (2nd ≡ same IC), sha256_v2/variant=6125,
  subservient=384, serv=8379, ibex=5952, neorv32=32144 — every routed.def has END DESIGN + real
  FIXED sky130_fd_sc_hd__tapvpwrvgnd_1 placement records (independently grep-verified, NOT
  fabricated; DEFs are gitignored runtime artefacts, not committed). The tapcell+PDN fix
  (v0.1.46/0.1.49) is thus proven on EVERY corpus IC. Three ICs (serv/ibex/neorv32) initially
  failed only because the corpus runner defaulted --top-name chip_top while their real synthesizable
  top is serv_chip_top / ibex_chip_top / neorv32_chip_top — a wrong-default, not a missing-RTL gap;
  re-running with the correct --top-name regenerated them cleanly. SIDE-FIX (general, chip-AGNOSTIC,
  Bucket-A): the neorv32 large-SoC run surfaced a real PLUGIN BUG — `_docker_exec` returned BYTES
  partial stdout on subprocess TimeoutExpired (text=True streams killed mid-decode), poisoning the
  downstream `out + err` concat in step_pnr (`TypeError: can't concat str to bytes`) and crashing the
  runner AFTER OpenROAD had already launched a long route. Fixed by normalizing any bytes→str in
  `_docker_exec` (both the normal + TimeoutExpired paths) so a timeout yields a clean FAIL StepResult
  instead of a mid-flow crash. +4 pytest (test_docker_exec_timeout_bytes.py). RESULT_PERC_CORPUS doc
  updated with the regen welltap table. plugin 0.2.35 → 0.2.36.
resolution: >-
  IMPLEMENTABLE half DONE. suggested_fix #4 (artifact-vintage GUARD CHECK) is now a deterministic,
  chip-AGNOSTIC, structural program — `artifact_vintage_guard()` in programs/perc_corpus_sweep.py.
  It WARNs (never fails a build) when a routed DEF with > _STALE_STD_CELL_MIN (200) placed std cells
  has 0 valid well/substrate taps AND an OLDER/sibling DEF in the same lineage is ALSO 0-tap — the
  structural signature of a stale pre-tapcell-fix artifact (the whole lineage never ran the tapcell
  step). DISCRIMINATOR (chip-agnostic, no design/vendor literal, no version string parsed — none is
  recorded reliably in DEF headers or the orchestrator JSON): a CURRENT run inserts taps from the
  `placed` stage onward (the FRESH spm control: floorplan=0 -> placed/cts/hold/routed all=67), so a
  0-tap routed DEF whose EARLIER sibling stages are also 0-tap = stale lineage; verdicts are
  {OK (tap-bearing or legit small <=200-cell / floorplan block), STALE_PRE_TAPCELL (warn — regenerate
  before citing), SUSPECT_LIVE (warn — 0-tap routed but NO older 0-tap sibling, cannot prove
  stale-vs-regression so re-run a fresh control), NA}. Wired into sweep_one() (auto-attaches a
  `vintage` block per IC), summarize() (two systemic counts), and CLI (`--vintage <def>` standalone,
  `--no-vintage` opt-out). VERIFIED on REAL corpus DEFs (pure DEF-parse, no EDA container needed):
  ibex/subservient/sha256_v2 -> STALE_PRE_TAPCELL (14798/901/10460 std cells, 0 taps, 4 older 0-tap
  siblings each); neorv32 -> SUSPECT_LIVE (chip_top is the only DEF in its pnr dir, so no older
  sibling to prove stale — the guard honestly defers rather than over-claim). Tests: 10 new cases in
  programs/tests/test_perc_corpus_sweep.py (fires on synthetic stale 0-tap lineage; does NOT fire on a
  tapped DEF, a small <=200-cell block, or a lone floorplan DEF; SUSPECT_LIVE when an earlier stage
  HAD taps; sweep_one attach + disable; summary counts; CLI --vintage) — full file 18/18 PASS.
