id: ORGANIC-20260530-incidental-crossref-synth-pollution
type: code-quality
severity: low
component: phase1_doc_one_shot_runner.py (protocol detectors) + *_protocol_synth.py
submitted_at: 2026-05-30
pattern: >
  A protocol detector fires when its wire-level signature appears ANYWHERE in the
  spec text, even as an incidental cross-reference rather than the doc's PRIMARY
  subject. Examples found in the v0.1.89 modern-protocol review:
   - usb4 detector fired on the PCIe-5.0 spec ("tunneled over USB4") — FIXED v0.1.89
     by a "32 GT/s" mutex + dropping the weak standalone "tunnel" clause.
   - JTAG + MIPI synths STILL fire on the pcie_gen5 spec (a PCIe card carries a JTAG
     TAP for boundary scan; the spec mentions MIPI). They plant additive JTAG-TAP /
     MIPI keys into pcie_gen5's L3/L6/L12. The pcie_gen5 synth (running last) force-
     overwrites the value-bearing keys, so PARITY IS 0, but the additive keys remain
     in SHAPE_MISMATCH (excluded from the gated total per R28).
  This is a pre-existing systemic property of EVERY benchmark whose spec mentions a
  sub-feature protocol (JTAG/MIPI/I2C/SPI debug sidebands). It does not move the
  parity number and does not corrupt value-keys (the most-specific synth overrides
  those), but it leaves cross-protocol keys in the deliverable L-docs.
suggested_fix: >
  Two options, neither blocking: (a) add a PRIMARY-SUBJECT weighting to detectors
  (fire only when the protocol's tokens DOMINATE, e.g. appear in L1.ic_name / the
  title, not merely in the body) — general but a larger change; or (b) have each
  protocol synth defensively .pop() the known sub-feature keys (JTAG TAP FSM, MIPI
  packet tables) the way lpddr5 pops DDR3-only keys and usb4 pops USB-2.0 keys.
  Tracked as low because parity = 0 and no value-key is corrupted.
session_context: >
  Found by the v0.1.89 C/D adversarial code-review workflow (finding M1, verified).
  usb4 instance fixed; JTAG/MIPI-on-pcie_gen5 instance documented here.

status: resolved
resolved_at: "2026-06-04"
resolved_in: "usb4 v0.1.89; JTAG PRIMARY-SUBJECT guard v0.1.90; MIPI residual closed via is_mipi FOREIGN-PRIMARY defer (companion ORGANIC-20260531-incidental-csi2 action 1) + stale pcie_gen5/ufs L-docs regenerated clean"
closure_note: >-
  All THREE documented instances now fixed. The MIPI-on-pcie_gen5/ufs instance
  (below residual) is closed: mipi_protocol_synth.is_mipi() adds a content-only
  FOREIGN-PRIMARY defer for PCIe/UFS/DisplayPort, verified to fire on EXACTLY
  {mipi, mipi_csi2, mipi_dsi} and defer on pcie_gen5/ufs/displayport/edp. The clean
  structural separator the residual said did not exist is PRIMARY-SUBJECT (foreign-
  primary) deferral, NOT packet structure — so the real mipi benchmark keeps firing.
  Stale committed pcie_gen5/ufs L-docs regenerated through the fixed deterministic
  runner: CSI-2 hits 25→0 / 21→0, gated parity preserved at 0, ufs SHAPE_MISMATCH 24→22.
resolution: >-
  Two of the three documented instances are fixed via suggested_fix option (a)
  PRIMARY-SUBJECT weighting. (1) usb4-on-pcie5 fixed v0.1.89 (32 GT/s mutex +
  dropped weak "tunnel" clause). (2) JTAG-on-pcie_gen5 fixed v0.1.90 in
  programs/phase1_doc_one_shot_runner.py lines 50130-50186 (commit/comment cites
  this exact backlog ORGANIC-20260530): the is_jtag detector now requires TAP
  STATE-MACHINE tokens (Capture-DR / Shift-IR/DR / Test-Logic-Reset /
  Run-Test-Idle / "TAP controller") read from an input_doc-augmented content blob,
  NOT merely the four TCK/TMS/TDI/TDO pins. Measured jtag=13, swd=87 such tokens
  vs pcie_gen5=0, so JTAG synth no longer pollutes pcie_gen5's L-docs; pcie_gen5
  synth line 491-495 documents it must now set byte_oriented itself because the
  guard suppresses JTAG.
residual: >-
  The MIPI-on-pcie_gen5 (and ufs) instance is STILL OPEN by an explicit, documented
  design decision. Lines 50194-50209 of phase1_doc_one_shot_runner.py record that a
  CSI-2-packet-structure PRIMARY-SUBJECT guard was ATTEMPTED and REVERTED: the real
  `mipi` benchmark's TI SLLA414 source is a D-PHY layout guide whose fresh extraction
  carries NO CSI-2 packet vocabulary (Long/Short Packet / Data Identifier = 0) and
  even raw MIPI/DPHY tokens are absent from its body — the firing signal comes from
  inferred L1/L2 content. Any packet-structure guard therefore suppresses MIPI synth
  on the real mipi benchmark and regresses it (mipi → 165 gated). No clean structural
  separator keeps mipi firing while stopping the incidental pcie_gen5/ufs M-PHY
  mention. Per doctrine the pollution is parity-NEUTRAL (additive keys land in
  SHAPE_MISMATCH, excluded from the gated total per R28/R32), so the v0.1.84 MIPI
  detector is deliberately kept unchanged and the MIPI half is left OPEN. Not
  quick-fixable: suggested_fix option (b) defensive .pop() in pcie_gen5 synth would
  also need to enumerate every sub-feature key per protocol and is the larger of the
  two options the item itself flagged.
