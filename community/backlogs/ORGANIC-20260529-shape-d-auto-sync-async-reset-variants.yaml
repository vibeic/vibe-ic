type: enhancement
severity: P3
component: program:phase2_one_shot_runner + skill:spec-to-rtl
plugin_version: "0.1.53"
id: ORGANIC-20260529-shape-d-auto-sync-async-reset-variants
submitted_at: 2026-05-29

title: >-
  For Shape-D digital-arithmetic-primitive projects whose spec declares
  synchronous reset, auto-emit a sync + async reset-variant pair so the
  hidden cocotb harness's reset_dut race doesn't force the AI to remember
  the v0.1.24 Cat-A workaround manually.

pattern: |
  CVDP-class Shape-D problems pose a recurring spec ↔ hidden-harness Cat-A
  inconsistency:

  - Spec says "Active-high synchronous reset (clears all outputs)" (e.g.
    Port Description line 54 of fixed_priority_arbiter).
  - The hidden cocotb harness's reset_dut(active=False) reads outputs
    immediately after `await RisingEdge(clk)` with no settle delay, racing
    the synchronous-reset NBA update → sync variant FAILs.
  - Async variant `always @(posedge clk or posedge reset)` makes the cleared
    state visible on reset assertion regardless of read timing → PASSes.

  Today this is encoded in:
    - benchmark-harness/blind_instructions_shape_d.md step 4 (instructs the
      AI to emit both variants)
    - skill:spec-to-rtl (lists the v0.1.24 doctrine)
    - benchmark_external/cvdp/run_v0153_runner/RESULT.md (re-justifies on
      this iteration)

  But it relies on the AI remembering the doctrine each session. Captured
  observation (v0.1.53 CVDP re-run): the AI DID remember, but only because
  it had just consumed the open-benchmark-methodology skill + the prior
  RESULT_v0125_fresh.md. A fresh agent without that priming would have
  shipped only the sync variant and reported FAIL.

suggested_fix: |
  Two complementary tracks:

  1. **Detect-and-emit in the runner**: when phase2_one_shot_runner's
     `step_rtl_gen` WAIVES with `fallback_skill=spec-to-rtl` AND
     `L4_REGMAP.json` (or L6_CONTROL_LOGIC) declares reset_kind="synchronous"
     AND `ic_class` is in {digital_arithmetic_primitive, digital_cmd_driven},
     surface a guidance line to the AI: "spec is sync; emit BOTH a sync and
     async variant under phase2/stage1/rtl/ and phase2/stage1/rtl_variants/".

  2. **Score-time fallback**: extend score_cocotb_mcp.py with a
     `--variant-fallback` flag (default ON for cvdp/* benchmarks) that, on
     a single-variant FAIL, scans `phase2/stage1/rtl_variants/` for a
     `<top>_async.sv` sibling and re-scores. Reports both verdicts in
     cocotb_score.json so the spec↔harness inconsistency is recorded.

  Risk: track 2 borders on "guess the harness expectation" — needs a
  corpus sweep across multiple CVDP problems (when access opens) to confirm
  the async fallback only ever turns sync-FAIL → async-PASS, never the
  reverse. Defer track 2 until corpus ≥ 5 CVDP problems are runnable.

session_context: |
  v0.1.53 CVDP N=1 Shape-D re-run produced fixed_priority_arbiter:
    sync variant:  TESTS=1 FAIL=1  (Cat-A floor reproduced)
    async variant: TESTS=1 PASS=1  (PASS via documented resolution)

  See benchmark_external/cvdp/run_v0153_runner/RESULT.md for the full
  re-justification and benchmark_external/cvdp/run_fresh_v0125/RESULT_v0125_fresh.md
  for the v0.1.24 origin of the Cat-A finding.
