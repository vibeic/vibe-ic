type: enhancement
severity: P1
component: program:phase3_one_shot_runner
plugin_version: "0.1.2"

title: >-
  Synth + reference-TB steps should auto-select an advanced-SystemVerilog
  frontend (slang / sv2v) instead of yosys built-in read_verilog -sv

pattern: |
  Phase 2 yosys-synth, Phase 3 synth, and the reference-TB step read RTL
  with yosys built-in `read_verilog -sv` and with iverilog respectively.
  Both frontends fail on advanced SystemVerilog constructs that are
  pervasive in production open-source CPU / SoC IP pulled by the catalog
  integrator path: packages with typed/parameterised members, package-scoped
  types used as port/parameter types, and named-field struct assignment
  patterns ('{field: value, ...}). For any catalog IP authored in modern
  SystemVerilog (a RISC-V core, a root-of-trust IP set, a parameterised
  bus fabric), every backend step fails at the first such construct even
  though the RTL is fully synthesizable.

  The EDA container already ships frontends that handle these constructs:
  a yosys slang plugin (yosys -m slang / read_slang) and a standalone
  sv2v converter. The deterministic runner does not detect the need for
  them and never invokes them, so a sound design is reported FAIL purely
  on a frontend-selection gap rather than any real RTL defect.

suggested_fix: |
  In the synth steps, when any input file has a .sv extension (or a quick
  probe of read_verilog -sv returns a parse error), fall through to
  `yosys -m slang` with read_slang (preferred — preserves hierarchy and
  needs no temp files) or to a sv2v pre-pass that emits Verilog-2005 the
  built-in frontend can read. Apply the same SV-capable-frontend
  selection to the reference-TB / simulation step (e.g. verilator or a
  slang-elaborated netlist) so .sv DUTs can be elaborated. Record which
  frontend was used in the step extras for provenance.

id: "ORGANIC-20260526-sv-synth-frontend"
submitted_at: "2026-05-26T11:54:09+08:00"
session_context: >-
  Fresh-agent full Vibe-IC run on a SystemVerilog RV32IMC CPU pulled via
  the catalog-glue integrator path. The genuine RTL elaborated cleanly
  through read_slang (hierarchy -check PASS) and synthesised to ~14.8k
  sky130 standard cells through OpenROAD, but the runner's built-in
  read_verilog -sv aborted at the first package named-field struct literal,
  and iverilog likewise rejected the same line, forcing a synth/ref-TB FAIL
  that was a frontend gap, not a design defect.

status: resolved
resolved_at: "2026-06-03"
resolved_in: "0.2.33"
resolution: >-
  CLOSED. The SV-frontend decision rule is now SHARED across all three
  named steps via a new sibling module programs/synth_frontend.py
  (SLANG_ERROR_SIGNATURES + IVERILOG_SV_ERROR_SIGNATURES +
  decide_synth_frontend() + decide_iverilog_sv_fallback()). No divergent
  copy — Phase-3 step_synth now DELEGATES to it: phase3_one_shot_runner.py
  re-exports `_decide_synth_frontend = _sf.decide_synth_frontend` and
  `_SLANG_ERROR_SIGNATURES = _sf.SLANG_ERROR_SIGNATURES`, so its byte-for-
  byte behaviour and the legacy
  test_phase3_backend_fixes.py::TestSynthFrontendSelection are preserved.

  (a) Phase-2 yosys-synth step (phase2_one_shot_runner.step_yosys_synth):
  after the default `read_verilog -sv` attempt, calls
  _sf.decide_synth_frontend(); on a positive decision runs the new
  _phase2_sv_synth_fallback() which invokes, in the iic-osic-tools
  container (where the SV frontends live — NOT on the host),
  `yosys -m slang` / read_slang (PREFERRED, preserves hierarchy) then an
  sv2v pre-pass emitting Verilog-2005, recording extras['synth_frontend']
  = read_verilog_v2005 | yosys_slang | sv2v_verilog2005. Container path
  translation + ephemeral /tmp staging (docker cp in/out) added so the
  fallback works whether or not the project sits under a bind-mount.

  (b) Phase-2 iverilog reference-TB step — BOTH compile sites
  (step_reference_tb AID-protocol path + _reference_tb_generic_full_stack)
  now route through the new _iverilog_compile_with_sv_fallback(): on an
  iverilog SV-construct failure it runs an sv2v pre-pass in the container
  (sv2v -> one Verilog-2005 file), swaps the .sv RTL for the converted .v,
  and re-compiles, recording extras['tb_frontend'] = iverilog_g2012 |
  iverilog_sv2v. `container` is threaded through step_reference_tb +
  _reference_tb_generic_full_stack (default 'iic-eda') and all 3 caller
  sites pass args.container.

  HONESTY PRESERVED: a genuine RTL defect with NO SV signature / NO .sv
  input does NOT trigger any fallback (decide_*_fallback returns False) —
  the real failure is reported unchanged. End-to-end verified against the
  live iic-eda container with a package-scoped struct-typed parameter +
  named-field struct literal that BOTH default frontends genuinely reject
  (read_verilog -sv: "syntax error, unexpected OP_CAST"; iverilog -g2012:
  "syntax error") and that read_slang (8 cells) / sv2v handle.

  Tests: programs/tests/test_synth_frontend_shared.py (22 tests: shared
  decision + iverilog decision + runner-share invariants + chip-AGNOSTIC
  signature hygiene + 3 docker-gated REAL container end-to-end tests
  exercising _phase2_sv_synth_fallback, _iverilog_compile_with_sv_fallback,
  and the real-defect-not-recovered honesty gate). Legacy phase3
  TestSynthFrontendSelection still green. INDEX.md regenerated for the new
  program. General (extension + tool-error-signature only), no chip/vendor
  literal, no-cheating, no-fabrication.
