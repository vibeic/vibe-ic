  frontend in extras['synth_frontend']. Tested in
  programs/tests/test_phase3_backend_fixes.py::TestSynthFrontendSelection.
  HOWEVER the backlog names THREE steps, and the other two are still on the
  built-in frontends with NO slang/sv2v/verilator fallback: (a) the Phase-2
  yosys-synth step in programs/phase2_one_shot_runner.py (line ~1862) still
