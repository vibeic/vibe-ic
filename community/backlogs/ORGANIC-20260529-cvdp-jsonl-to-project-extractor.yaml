type: enhancement
severity: P3
component: program:benchmark_dispatch
plugin_version: "0.1.53"
id: ORGANIC-20260529-cvdp-jsonl-to-project-extractor
submitted_at: 2026-05-29

title: >-
  benchmark_dispatch.py --setup cvdp produces an empty run dir (0 problems,
  0 batches) because the dataset ships as JSONL and the dispatcher has no
  schema-aware extractor that emits the Shape-D project layout
  (work/PROMPT.txt + work/docs/specification.md + score/src/*.py per problem).

pattern: |
  Captured from v0.1.53 CVDP run. The CVDP public example dataset at
  /home/reyerchu/AI_IC_design/_extbench/cvdp_benchmark/example_dataset/
  ships as 10 JSONL files (agentic + nonagentic × code-gen + code-comp ×
  commercial + no-commercial × with-solutions). Each JSONL row is a single
  problem with prompt, specification, hidden harness, and (if -with-solutions)
  the golden RTL.

  Running:
    python3 ${PLUGIN}/programs/benchmark_dispatch.py cvdp \
      --setup --dataset $DATASET --run $RUNDIR

  produces:
    Set up Shape-D run dir for cvdp:
      problems: 0
      batches:  0

  …because the dispatcher's setup function doesn't know how to walk JSONL
  rows and lay out the Shape-D contract per blind_instructions_shape_d.md:
    <project>/work/PROMPT.txt
    <project>/work/docs/specification.md
    <project>/score/src/test_<dut>.py
    <project>/score/src/harness_library.py
    <project>/score/src/test_runner.py

  As a workaround for v0.1.53 the CVDP project was hand-cloned from the
  prior run_fresh_v0125 scaffold; not reproducible by new users.

suggested_fix: |
  Add `programs/cvdp_jsonl_extract.py`:
    - Parse a JSONL row (schema: id, type, category, code_context,
      patch_files, reference_files, model_response,  ... per cvdp v1.1.0)
    - For each "agentic_code_generation" row, emit:
        $RUNDIR/<problem_id>/work/PROMPT.txt           ← prompt field
        $RUNDIR/<problem_id>/work/docs/specification.md ← spec field
        $RUNDIR/<problem_id>/score/src/test_*.py        ← hidden harness files
        $RUNDIR/<problem_id>/score/src/harness_library.py
        $RUNDIR/<problem_id>/score/src/test_runner.py
    - Append problem_id to $RUNDIR/problems.list
    - Wire benchmark_dispatch.py --setup cvdp to call this extractor.

  Corpus sweep: validate the extractor parses all 10 JSONL files in the
  public example dataset without dropping rows; per-row required-key check.

session_context: |
  v0.1.53 CVDP N=1 Shape-D run had to hand-stage from prior run_fresh_v0125.
  New users following the dispatcher's own setup workflow get an empty run
  dir and no error message pointing at the JSONL parsing gap.

  See benchmark_external/cvdp/run_v0153_runner/RESULT.md for the manual
  staging steps.

related:
  - ORGANIC-20260529-shape-d-auto-sync-async-reset-variants — both apply to
    the same CVDP run shape; this one is the dataset-ingest prerequisite.
