resolution: >-
  The permanent MCP-server fix LANDED in mcp-eda-server/src/index.js (eda_lvs, mode=netgen).
  The naive `result.output.match(/uniquely/i) || result.output.match(/match/i)` boolean and the
  `match != null && !fail` matched/success derivation are GONE. The netgen branch now:

  (1) REAL VERDICT PARSE via a new pure, unit-tested module src/lib/netgen_verdict.mjs
      (classifyNetgenVerdict). PASS only on a real netgen "Circuits/Netlists match uniquely"
      Final-result with NO fail signal. FAIL on "do not match" / "failed pin matching" /
      "*** MISMATCH ***" / "Property errors were found" / "match uniquely WITH property errors".
      The property-error case is the headline silent false-positive the backlog reports — the
      old `/match/i` token matched it AND the old `/mismatch|NOT match|FAIL/i` failure regex did
      NOT fire on "Property errors were found", so it returned matched=true. Empirically
      reproduced in-container (netgen 1.5.316, sky130A): a 2x-wide pfet pair OLD=matched:true
      vs NEW=FAIL/property_errors:true.

  (2) DID-NOT-RUN GUARD. "Cannot find cell" / "Both cells are in the same netlist: Cannot
      compare!" / no-report-written-and-no-Final-result ⇒ verdict=DID_NOT_RUN, matched:null
      (NEVER true), parse_error:true. The wrapper probes whether the report file was actually
      written and feeds reportWritten into the parser. Reproduced in-container: the wrong-top
      `<top>` vs `<top>_flat` run prints "Cannot find cell" and writes NO report — OLD code
      returned success:true (would write a PASS manifest); NEW returns DID_NOT_RUN.

  (3) AUTO-NAME-ALIGN for Magic's `_flat` top. resolveLayoutTop() greps the layout SPICE: if
      `.subckt <top>` is absent but `.subckt <top>_flat` exists, netgen is fed `<top>_flat`
      (the name Magic emits after `flatten`), so the run no longer aborts on "Cannot find cell".

  (4) STD-CELL-LIB LOAD. New params load_stdcell_lib + custom_stdcell_spice + schematic_top.
      When load_stdcell_lib=true the driver TCL does `readnet spice <stdcell.spice> $schCkt`
      (e.g. /foss/pdks/sky130A/.../sky130_fd_sc_hd/spice/sky130_fd_sc_hd.spice) BEFORE `lvs`, so
      a post-PnR GATE netlist's empty cell placeholders expand to transistors for a true
      device-level compare. Mechanism validated in-container: a `sky130_fd_sc_hd__inv_1` gate
      placeholder expanded to its 2-transistor cell after the lib load.

  The PASS manifest is now written ONLY when verdict.matched === true (a real clean match).

  Tests: src/lib/netgen_verdict.mjs is unit-tested by
  mcp-eda-server/test/test_eda_lvs_netgen_verdict_and_magic_ports.py (17 cases, incl. the EXACT
  in-container netgen phrasings + two regression cases proving the OLD logic false-positived the
  property-error and did-not-run cases). Full mcp-eda-server suite 153/153 green.

  Files: mcp-eda-server/src/index.js (eda_lvs netgen branch + import),
  mcp-eda-server/src/lib/netgen_verdict.mjs (new),
  mcp-eda-server/test/test_eda_lvs_netgen_verdict_and_magic_ports.py (new).
