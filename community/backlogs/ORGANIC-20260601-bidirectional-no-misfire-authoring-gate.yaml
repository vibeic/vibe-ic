type: enhancement
severity: P2
component: program:protocol_detector_no_misfire_matrix

plugin_version: "0.2.13"

title: >-
  Promote the bidirectional no-misfire matrix to a plugin program and make
  new-protocol authoring run it — a new family-sub-clause detector can be clean
  on existing benchmarks (the per-agent self-check) while EXISTING detectors
  fire on the NEW benchmark (caught only by the full superset-blob test).

pattern: |
  When adding protocols that are SUB-CLAUSES of a larger family (MDIO and SGMII
  are both inside IEEE 802.3), two distinct cross-fire directions exist:
    FORWARD  : new detector is_<new> fires on an existing benchmark.
    REVERSE  : an existing detector fires on the new benchmark.
  The v0.2.13 5-protocol authoring workflow instructed each agent to self-check
  only the FORWARD direction against a hand-picked sibling list. That passed,
  but the full-suite test_protocol_detector_no_misfire (which builds a SUPERSET
  blob = input_doc + every generated L-doc and runs ALL detectors x ALL
  benchmarks) caught three REVERSE fires the agents missed:
    (qspi_ospi -> espi)   eSPI genuinely has Quad I/O + Flash Access
    (smbus_pmbus -> espi) "PEC" substring matched inside "ADI_SPEC" + CRC-8
    (smbus_pmbus -> mdio) generic-runner Ethernet EtherType/ARP + PMBus tokens
  All three were resolved (eSPI MUTEX on qspi_ospi; \bPEC\b word boundary on
  smbus_pmbus; mdio Ethernet-frame purge), and the standard fix for the FORWARD
  family-sub-clause case is SUBJECT-DOMINANCE (name token must be in the blob
  HEAD; the runner now builds the auto-dispatch blob input_doc-first). But the
  authoring loop had no gate forcing the bidirectional check.

suggested_fix: |
  1. Promote benchmark_phase1/_no_misfire_matrix.py to
     programs/protocol_detector_no_misfire_matrix.py with a --direction flag
     {forward, reverse, both} (default both) and a --blob {input_doc, generated,
     superset} flag; reuse it from test_protocol_detector_no_misfire.
  2. Make the new-protocol authoring procedure (and the open-benchmark-
     methodology / phase1 protocol-add doctrine) REQUIRE running the BOTH-
     direction matrix on the full corpus before a protocol is declared done —
     not a hand-picked sibling subset.
  3. Document in open-benchmark-methodology: (a) gated-parity-0 must ALWAYS be
     paired with the bidirectional no-misfire matrix + an adversarial review,
     because parity is blind to cross-fires and shared-gold content errors
     (v0.1.89 lesson); (b) for a detector of a protocol that is a sub-clause of
     a larger family, the standard hardening is name-token-in-HEAD subject
     dominance (v0.1.94), and the runner blob must be input_doc-first so the
     head is the source-spec title.

id: "ORGANIC-20260601-bidirectional-no-misfire-authoring-gate"
submitted_at: "2026-06-01T14:34:00+00:00"
session_context: >-
  v0.2.13 phase1 close-loop, adding LPC/USB-PD/Interlaken/MDIO/SGMII via the
  generic AUTO_DISPATCH drop-in mechanism. The forward-only per-agent self-check
  passed but the full suite flagged 3 reverse cross-fires; all fixed and pinned
  with ethernet subject-dominance regression tests. Filed to make the
  bidirectional matrix a first-class program + authoring gate so future protocol
  adds catch both directions automatically.
