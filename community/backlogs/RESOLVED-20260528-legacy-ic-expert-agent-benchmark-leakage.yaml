title: >-
  Legacy ic-expert-agent.md sections leak benchmark Prob IDs and design names
  (predate v0.1.34 honesty rule)

pattern: |
  benchmark-enhancement-capture/SKILL.md § honesty rules (added in v0.1.34) state:
    "NEVER add a Bucket B skill section that names specific benchmark design
     identifiers. Skills are general patterns, not lookup tables."

  But agents/ic-expert-agent.md still contains explicit references to specific
  benchmark designs in "Worked example" sections captured before v0.1.34:
    - VerilogEval Prob067 / Prob070 / Prob078 / Prob089 / Prob092 / Prob113 /
      Prob145 / Prob149 / Prob150 / Prob154 / Prob042
    - RTLLM radix2_div / sequence_detector / freq_divbyeven
    (See line-number grep at v0.1.38 commit.)

  A new user who downloads the plugin and reads ic-expert-agent.md gets
  hints about WHICH specific benchmark problems are hard AND in which
  direction the answer leans — that's leakage from prior captured sweeps to
  their own blind run.

  The v0.1.38 sweep's NEW captures are anonymized ("from a 64-bit pipelined
  adder + 4-bit pipelined multiplier" instead of "adder_pipe_64bit + multi_pipe_4bit").
  The legacy entries need to be retroactively anonymized to the same standard.

suggested_fix: |
  Per-section rewrite each "Worked example" / "Worked miss" entry to:
    1. Remove all VerilogEval ProbNNN_ identifiers
    2. Remove all RTLLM design leaf-names (radix2_div, sequence_detector, etc.)
    3. Keep the worked pattern + the structural fix verbatim — just describe
       the design category instead ("a restoring-class divider", "a fixed-pattern
       sequence detector", etc.)
    4. Re-verify the pattern remains useful as a generalization (does it still
       teach the lesson without the specific reference?)

  Sweep the rewrite against a corpus of benchmarks to ensure no
  general-pattern degradation. Ship as v0.1.39 (separate PR — not blocking
  v0.1.38 commit since v0.1.38's own additions are clean).

