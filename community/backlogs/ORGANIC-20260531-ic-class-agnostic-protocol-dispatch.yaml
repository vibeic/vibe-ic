resolved_at: "2026-06-03"
resolved_in: "0.2.32"
resolution: >-
  ROOT-CAUSE CLOSED (Option A, made fail-closed). The silent-skip hazard is gone because the
  [14e/15] R55 dispatch gate no longer carries a hardcoded class TUPLE that could omit a class.
  Three changes:
  (1) programs/ic_class_profile.py adds the SINGLE source of truth: ALL_IC_CLASSES (the closed set
  of class strings detect_ic_class can return) + PROTOCOL_SYNTH_DISPATCH_CLASSES (== ALL_IC_CLASSES,
  so EVERY class reaches dispatch — the inline content-only detectors are the real gate, exactly as
  the suggested_fix Option A argues) + protocol_synth_dispatch_classes() + the diagnostic
  protocol_synth_unreachable_classes() (the silent-skip set, now provably empty). General: only
  class-taxonomy strings, never a chip/vendor/benchmark name.
  (2) programs/phase1_doc_one_shot_runner.py adds the pure, testable
  protocol_dispatch_decision(ic_class) helper and rewires the [14e/15] gate to delegate to it
  (replacing the old `if _ic_r55 in ("serial_peripheral_protocol", ...)` tuple). When a class is
  reachable the synth chain runs as before; when a class is NOT reachable (e.g. a FUTURE class added
  to detect_ic_class but left out of the dispatch set) the decision returns reachable=False WITH an
  explicit `signal` payload, which the runner writes to reports/phase1/protocol_dispatch_skipped.json
  and prints to stderr — fail-closed: the skip surfaces LOUDLY instead of being masked. This realizes
  Option B's intent (explicit-reachability surfacing) structurally rather than as a one-off assertion.
  (3) programs/tests/test_protocol_synth_dispatch_reachability.py (17 cases, all green) pins:
  the closed-state invariant (unreachable set empty); a SOURCE-DRIFT guard asserting ALL_IC_CLASSES
  exactly equals every `profile["ic_class"] = "<X>"` literal in ic_class_profile.py (a NEW class
  added to detect_ic_class but not registered = test FAIL, so it can never be silently unrouted);
  the regression that every valid class still dispatches (parametrized over ALL_IC_CLASSES); the
  no-longer-silent path (an unrouted class yields an explicit signal, not a silent skip) incl. the
  on-disk protocol_dispatch_skipped.json artifact; the no-cheating guards (the runner gate delegates
  to protocol_dispatch_decision and the helper derives its set from ic_class_profile, with an
  assertion that the old hardcoded tuple is gone); and a corpus-clean smoke proving a real serial-
  peripheral L-doc set classifies into a dispatch class (so it genuinely reaches the synth chain).
  NOT EDITED (other agent's scope): no *_protocol_synth.py was touched; the [14e2/15]
  bus_interconnect block and the harmless idempotent Avalon double-wiring are left as-is (both are
  fully reachable now that R55 covers bus_interconnect_protocol, so they are belt-and-suspenders, not
  a hazard). Two pre-existing, unrelated failures in test_protocol_detector_no_misfire*.py (gold
  cross-contamination across concurrently-edited detector modules) were verified to fail identically
  with this change reverted — they are NOT caused by and NOT in scope for this backlog.
