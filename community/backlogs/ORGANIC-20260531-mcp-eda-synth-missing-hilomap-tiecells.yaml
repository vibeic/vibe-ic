session_context: >-
  Surfaced by the SENT (SAE J2716) doc→GDS Shape-A pilot (v0.1.95, the 4th doc→GDS pilot).
  Recovery was deterministic (hilomap + splitnets re-synth), so this is a clean tool-gap
