type: enhancement
severity: P1
component: program:analog_real_corner_sweep
plugin_version: "0.1.34"

title: >-
  analog_real_corner_sweep needs SPICE deck templates for adc / delta_sigma / modulator block types

pattern: |
  analog_real_corner_sweep.py ships real-ngspice deck templates only for: ldo, bandgap, por, pull, trim, oscillator, esd, charge_pump. Block types adc, delta_sigma, modulator, comparator, quantizer all defer to a deterministic stub (provenance: deterministic_stub, simulator_run: false), which trips the A4 gate. Converter / modulator blocks need their own template family.

suggested_fix: |
  Add ngspice deck templates for the converter / modulator block-type family:
    - delta_sigma → 2nd-order SC CIFB with parametric Cs/Ci, transient on a swept input, measure integrator UGBW (OTA settling proxy) + quantizer toggling frequency.
    - adc (incremental wrapper) → modulator instance + transient over OSR cycles, optionally with simple decimation in TB.
    - comparator → standalone latched compare; measure resolve time + offset (Monte Carlo if available).
  Each template needs PVT corner stamping (ss/tt/ff × temp) using the documented IC sim corner names. Mark `simulator_run: true` + `_provenance: real_ngspice` when the deck actually runs.
  The authored topology.md from the analog-topology-select skill should be reusable as the template body — the manual deck the u_hawaii_adc rerun authored at /home/reyerchu/AI_IC_design/u_hawaii_adc_v0125_rerun/ is the canonical reference.

id: "ORGANIC-20260528-a4-converter-corner-template"
