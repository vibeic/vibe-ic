history: >-
  v0.1.13 first implemented it keyed on the bare substring "Moore" → rejected/reverted
  in v0.1.14 as overfit (fragile to "Moore's law" / "not a Moore machine", and Mealy is
  a valid design choice so a lint must not flag it unconditionally).
resolution: >-
  Re-implemented PROPERLY in v0.1.15 as a spec-CONFORMANCE check — the exact sibling of
  the existing reset-mode-spec-mismatch gate. The FSM output style is now a declared
  spec property: SpecContract.fsm_output_style, populated by _detect_fsm_output_style(),
  a SEMANTIC extractor that (a) requires "Moore"/"Mealy" to be used as an FSM descriptor
  (machine/FSM/state-machine in the local window), (b) is possessive-aware ("Moore's law"),
  (c) is negation-aware ("not a Moore machine" → reads the declared style, here Mealy),
  (d) returns None on ambiguity ("Moore or Mealy"). The gate (rule fsm-output-style-mismatch,
  WARN) fires ONLY when the spec genuinely declares Moore AND an output is combinationally
  input-dependent (Mealy). General for any chip whose spec declares an FSM output style;
  silent otherwise (Mealy stays a free choice). +4 tests incl. the possessive/negation cases.

title: >-
  Lint for Moore-vs-Mealy output discipline: when the spec declares a Moore FSM,
  the output must be a function of state only (registered), not of the inputs

pattern: |
  VerilogEval-v2 Prob089 (serial 2's complementer) declares a *Moore* state
  machine in its prompt, but a natural blind implementation wrote a Mealy output
  (`assign z = (state==A) ? x : ~x`) — z is a function of the current input x.
  This is functionally a valid 2's complementer but mis-times against a Moore
  reference (it leads by one cycle), so it failed ~half the vectors. The fix was
  a registered Moore output (`z` = f(state) only, updated on the clock).

  There is currently no gate that connects the word "Moore" in the spec to the
  structural requirement "output depends on state only / is registered". The
  reset-less power-up class from the same tuning loop was captured as
  rtl_hygiene_lint rule 5 (uninit-registered-output); this is the sibling
  output-timing discipline that was fixed by hand but not yet encoded.

suggested_fix: |
  Add an rtl_hygiene_lint rule (or extend reset_discipline_check) that, when the
  spec/prompt text contains "Moore", flags any top-level output assigned by a
  combinational `assign`/`always @(*)` whose RHS references a module INPUT port
  (i.e. a Mealy output). Conservative: only fire when (a) the spec says Moore and
  (b) the output's combinational cone includes an input port. Message: "spec
  declares a Moore FSM but output 'z' is combinationally dependent on input 'x'
  (Mealy) — register it as a function of state only." Keep it WARN. Add unit
  tests: a Moore (state-only registered output) passes; a Mealy output under a
  Moore spec is flagged.

related:
  - ORGANIC-20260527-conformance-function-arg-as-port

