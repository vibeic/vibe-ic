resolution: >-
  IMPORTABILITY GAP CLOSED (the filed title). All 86 programs/*_protocol_synth.py now export an
  importable module-level `def is_<stem>(blob: str) -> bool`. The ~46 detectors that lived INLINE
  in phase1_doc_one_shot_runner.py (spi/i2c/uart/can/usb/pcie/ddr/...) were lifted into their
  synth modules BYTE-FOR-BYTE (the inline boolean with `_spi_blob` -> `blob`); the 3 Tier-D ones
  (nvlink/ucie/ethernet_800g) re-export the canonical tier_d_interconnect_detect predicate
  (single source of truth, same callable the runner uses). Verified byte-identical to the inline
  logic across all 87 benchmark_phase1 benchmarks (0 mismatches), and empty/None-safe.
  The runner (phase1_doc_one_shot_runner.py — owned by another agent) was NOT edited, so its
  ordering + force-overwrite behaviour is unchanged. The v0.1.93 universal no-misfire guard now
  AUTO-DISCOVERS all 86 (count went 9 → 40 → 86). New registry coverage test
  programs/tests/test_all_protocol_synth_detectors_importable.py pins the 1:1
  <stem>_protocol_synth.py -> is_<stem> invariant (175 cases incl. a real-FAIL negative control
  and the missing-data honesty contract). Stale "~47 inline" notes in
  test_protocol_detector_no_misfire.py + test_all_protocol_synth_overlay.py updated.
residual: >-
  NOT a full resolve of suggested_fix's END-GOAL ("the universal guard covers all ~57 with ZERO
  foreign fire"). Lifting the 46 detectors SURFACED — exactly as the backlog predicted — that 36
  of them are ORDERING-DEPENDENT: as STANDALONE superset predicates they over-fire on foreign
  benchmarks (the runner's generic interface vocabulary injects sibling tokens into other docs'
  generated L-docs / gold), and they are runner-safe ONLY because a more-specific sibling synth
  runs AFTER them and FORCE-OVERWRITES (cross-protocol force-overwrite doctrine) and because the
  runner's actual L1+L2 blob is far narrower than the guard superset. The 36 (ace arinc429 ble
  can canfd cxl ddr ethercat ethernet ethernet_800g hbm3 hdlc hdmi i2c jtag lpddr5 milstd1553
  mipi_dsi modbus nvme pcie pcie_gen5 rs485 sata sdmmc soundwire spdif spi swd tilelink uart ucie
  ufs usb usb4 wishbone) are enumerated as the OPEN residual in
  test_protocol_detector_no_misfire.py::NEWLY_LIFTED_ORDERING_DEPENDENT (single canonical source;
  the gold matrix guard imports it). They are NOT silenced wholesale: they still get the
  callable/empty-safe + own-fire assertions, their cross-fires are reported, and ANY NEW
  regression among the 50 standalone-clean detectors still FAILS the strict sweep. To finish:
  harden each of the 36 standalone-clean with the is_mipi/is_avalon subject-dominance +
  sibling-MUTEX pattern, removing it from the set as it goes (set shrinks toward empty). Some of
  the over-fires originate in NON-assigned files this task could not touch — the canonical
  tier_d_interconnect_detect.is_ucie (bare "UCIe" token over-fires on jesd204's comparison
  mention) and the DERIVED_SIBLING_CROSS_FIRES allowlist in protocol_detector_lib.py — so the
  hardening must span those plus the runner-ordering model, not just programs/*_protocol_synth.py.

end_goal_resolution: >-
  v0.2.34 CLOSED the suggested_fix END-GOAL ("the universal guard covers all with
  ZERO foreign fire"). All 34 ordering-dependent detectors were hardened
  STANDALONE-CLEAN via a foreign-primary-defer (the is_mipi / is_avalon
  subject-dominance + sibling-MUTEX pattern), each keyed on the dominant subject's
  GENERAL structural signature — protocol tokens, frame/register/channel/field
  names, relative density counts — with ZERO benchmark-name / chip / SKU literals
  (adversarially grep-verified across all 34 changed files: every quoted-literal
  hit was a protocol standard name + structural token, e.g. EtherCAT+ESC+FMMU,
  nvlink-count>=20, jesd204 density, SoundWire+Data-Port). Each was edited only in
  its own programs/<stem>_protocol_synth.py (a local defer-gate wraps any shared
  predicate, so the "non-assigned files" concern in the residual above — is_ucie /
  the derived-sibling allowlist — was handled at the is_<stem> entry point without
  editing the shared libs). Two additional gold-model residuals that the empty-set
  strict sweep then surfaced were resolved correctly, not silenced: (ddr, ddr4) via
  a DDR4/DDR5 generation sibling-MUTEX using DOMINANT-DENSITY (count(ddr4|ddr5) >
  count(ddr3)) so an incidental "compared to DDR4/5" mention in the DDR3 spec still
  detects as DDR3; (cxl, ucie) via a UCIe-primary defer (chiplet + die-to-die +
  sideband/RDI/FDI) because a UCIe spec lists CXL.io/.cache/.mem as carried
  protocol layers; (ace, ace_chi) is a CORRECT same-subject gold fire (the ace_chi
  gold's subject IS the ACE coherency protocol — ACE + full AMBA AXI 5-channel
  baseline, CHI absent) and is allowlisted in
  protocol_detector_no_misfire_matrix.ACCEPTABLE_GOLD_SUBCLAUSE_FIRES, while the
  superset model (input_doc = the comprehensive AMBA AXI spec) correctly defers via
  is_ace's AXI-spec-primary guard. NEWLY_LIFTED_ORDERING_DEPENDENT is now EMPTY:
  EVERY discovered detector is held to the STRICT no-foreign-fire assertion on all
  three blob models (superset / generated / gold), 0 foreign fires on the real
  benchmark_phase1/ corpus (test_protocol_detector_no_misfire +
  test_protocol_detector_no_misfire_matrix, 9 passed). Verified by an INDEPENDENT
  re-sweep (not the agents' self-reports) + adversarial benchmark-name grep.
