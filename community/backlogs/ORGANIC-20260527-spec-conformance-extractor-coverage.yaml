session_context: >-
  Filed by the same session that shipped v0.1.4 eda_spec_conformance. The tool
  was validated end-to-end on the CVDP fixed_priority_arbiter spec (caught the
  "synchronous reset" spec vs asynchronous reference-RTL mismatch) and on
  VerilogEval-v2 prompts (auto-extracted the expected port list from
  "- input d (8 bits)" bullets and flagged the port-swap regressions). The two
  gaps above are the honest known-limitations of the extractor as shipped —
  recorded so a future iteration absorbs datasheet-table interfaces and richer
  reset phrasings rather than relying only on bullets / ANSI headers / JSON.
