# FIXTURE — the wiring shapes `d9_corpus_baseline.flow_driven_programs` must
# tell apart.  Not a runnable flow; it is the smallest document that carries
# every shape the real `flow/phase1_phase2_phase3.yaml` uses to MENTION a
# program name, exactly one of which is a WIRING.
#
# Every name below is invented for this fixture.  The expectations live beside
# them in `tools/test_d9_corpus_baseline.py::TestWiringIsStructuralNotTextual`,
# which reads THIS file — so the fixture and the assertion cannot drift.
#
#   WIRED   — the first token of a gate-clause command string, and nothing else.
#   UNWIRED — a comment, a description field, a doc string, a path ARGUMENT
#             inside a wired command, and a name that is merely a PREFIX of a
#             wired one.
version: fixture
flow_name: d9_wiring_shapes

steps:
  # ---------------------------------------------------------------- WIRED
  - id: 1
    name: "gate clauses — the only place wiring lives"
    stage: fixture
    gate:
      all_of:
        # bare command string
        - program_exit_zero: "fx_wired_bare_check ."
        # {command: ...} dict form
        - optional_program_exit_zero:
            command: "fx_wired_dict_check . --json reports/fx.json"
            condition_files_exist: ["reports/fx_precondition.json"]
        # advisory tier is still a wiring — it runs
        - advisory_program_exit_zero: "fx_wired_advisory_check ."
        - any_of:
            # nested one level deeper than the walk's entry point
            - program_exit_zero: "fx_wired_nested_check ."
            - files_exist: ["reports/fx_alt.json"]

  # -------------------------------------------------------------- UNWIRED
  - id: 2
    name: "every shape that MENTIONS a program without driving it"
    stage: fixture
    # vibe-ic#1012 verbatim shape: a comment written to explain why a checker is
    # NOT wired. `fx_comment_only_check` is held deliberately; saying so must
    # not make it disappear from the population that measures holds.
    #
    # PROMOTION CONDITION: repair the producer, re-measure, then wire it.
    description: >
      Prose that names fx_description_field_check while wiring nothing.
    notes:
      - "fx_notes_field_check is discussed here, never invoked."
    # A step-level roster is a declaration of what the step runs, NOT a gate
    # that can fail — and this instrument's output column is
    # "would redden if promoted to BLOCKING", a question about gates.
    programs:
      - fx_roster_only_check
    gate:
      all_of:
        # The path ARGUMENT names a program. Only token 0 is a program name.
        - program_exit_zero: "fx_wired_bare_check . --json reports/fx_path_arg_check.json"
        # `fx_wired_bare` is a strict PREFIX of the wired `fx_wired_bare_check`.
        # A substring test counts it; a token comparison does not.
        - files_exist: ["reports/fx.json"]

final_gate:
  program: fx_final_gate_check
  args: ". --strict"
  exit_zero_required: true
