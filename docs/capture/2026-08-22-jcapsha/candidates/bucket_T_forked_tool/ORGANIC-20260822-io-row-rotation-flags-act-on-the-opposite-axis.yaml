type: bug
severity: P2
component: program:pad_ring_gen
plugin_version: "1.11.68"

title: >-
  the io-row command applies each rotation flag to the axis the other one names

root_cause_layer: forked_tool
tool: "OpenROAD"
generating_step: "phase3.pad_ring"
golden_sample: "none -- there is no output in which the flags act on the axes they name, which is the finding. The expected behaviour is the one its consumer publishes: the consumer declares each variable as the rotation to apply to the sites of that axis, and passes each straight through to the matching flag."
bad_sample: "docs/capture/2026-08-22-jcapsha/evidence/rotation_axis/HV_MEASURED_raw.txt"
problem: |
  The command that creates the four io rows takes a rotation flag per axis. Measured across a two-by-two of separate processes: the two horizontal rows follow the flag named for the vertical axis and are unmoved by the one named for their own, and the two vertical rows do the exact opposite. Each flag has a real, reproducible effect, so neither is ignored -- each acts on the axis the other names.
tool_enhancement: |
  In the io-row construction of the pad module, the per-axis rotation arguments reach the row builder crossed relative to the axis their flag names. Either exchange them at the call so each flag drives the rows it names, or -- if the naming follows an unstated convention where the word describes the orientation a placed cell takes rather than the axis of the row it sits in -- state that convention in the command help, where a caller reads it, since the consumer that ships with this tool documents the opposite. The same crossing is present in the site-selection flag pair of the same command and is established there without measuring an orientation at all, so whichever way it is resolved must be applied to both pairs together.

pattern: |
  A tool accepts a per-axis flag and applies it to the other axis. Because both flags default to the identity rotation, every default run is correct and the crossing is invisible; the whole cost falls on the author who sets one deliberately, who then gets the rotation on the pair of sides they did not name. The tool's own help prints the flag names and no axis semantics, so nothing in the tool contradicts the reading its principal consumer publishes.

suggested_fix: |
  Exchange the per-axis rotation and site arguments at the io-row construction call so each flag drives the axis it names, or document the opposite convention in the command help; the fix must cover both flag pairs together.

id: "ORGANIC-20260822-io-row-rotation-flags-act-on-the-opposite-axis"
submitted_at: "2026-08-22T10:04:03+08:00"
session_context: >-
  Found while converging a capture over another lane's pad-ring recovery. That lane swept four values of one rotation flag with the other held at the identity, concluded the variable was inert, and recorded a second observation -- that a pad on a horizontal side tracked the vertical flag -- as an oddity it did not chase. Those are one fact. A two-by-two varying both flags, one process per cell, resolves it, and a positive control at the site-selection flag pair of the same command reproduces the same crossing with no orientation reasoning involved.
