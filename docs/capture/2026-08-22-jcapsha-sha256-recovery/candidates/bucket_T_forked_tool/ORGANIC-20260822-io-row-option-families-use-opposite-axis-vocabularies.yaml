session_context: >-
  Found while converging on a prior lane's conclusion that the vertical-rotation variable is inert. Four separate tool processes had shown the east/west orientation constant across every value of it. Sweeping the horizontal family instead moved east/west and left south/north still; a single call with two distinguishable sites and two different rotations then showed both families routing the same way, and the row bounding boxes confirmed the row names mean what they say. The data behind the inertness conclusion was correct; the conclusion was not.
