title: >-
  Reuse source-bound native structural proof in the existing repair lifecycle

pattern: |
  An implementation satisfies binary functional tests but violates an explicit implementation architecture, while a repair API accepts only simulation counterexamples and cannot admit the measured structural defect.

suggested_fix: |
  Reuse the upstream structural-proof work and its existing review lifecycle. Bind source obligation, parent RTL, tool identity, command, abstraction and graph evidence; retain all functional challenges and fresh independent review. An unconstrained equivalent circuit must remain valid; a constrained circuit must meet the declared structure. Verify minimum-count claims under a source-authorized model rather than generic synthesis cell counts alone.

