type: enhancement
severity: P2
component: flow artefact and output-declaration matrix
plugin_version: "1.11.66"

title: >-
  An artefact index that matches whole-path literals cannot tell a reader from a writer, nor see a reader that resolves the path at run time

pattern: |
  An index that maps an artefact to the programs whose source contains its full path cannot see a consumer that reaches the same artefact by basename or by recursive glob, and cannot separate a reader from a writer, so an artefact with several real readers is recorded as having none, and removing one accidental mention makes the gap look closed.

suggested_fix: |
  Build a read-versus-write aware source analyser for artefact paths that resolves basename and glob access, triage the eight measured occurrences individually before turning it on, and keep the current limit asserted by a test so that widening the index fails loudly instead of quietly outdating the comment that records the limit.

id: "ORGANIC-20260821-artefact-consumer-index-misses-runtime-resolved-readers"
submitted_at: "2026-08-21T22:08:47+08:00"
session_context: >-
  Found while establishing whether a sign-off artefact read by three programs and declared by none was a real gap; the index that was supposed to answer that question named a writer as a reader and missed all three real readers.
