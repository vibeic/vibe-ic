type: bug
severity: P1
component: flow:phase3
plugin_version: "1.11.69"

title: >-
  Post-route design-rule repair faults on a netlist shape after routing completes

root_cause_layer: forked_tool
tool: "OpenROAD"
generating_step: "phase3.pnr_setup_repair"
golden_sample: "ppa-crosslayer/records/trials/c02/ — a state-encoding-preserving arm of the same sweep, same tool build, same PDK, same script, which completes the post-route tail normally"
bad_sample: "ppa-crosslayer/records/trials/x03/ and x04, x11, x12, x13, y03, y04, y08, z24, z25 — ten reproductions of the same crash. EVIDENCE GAP, measured while re-reading this record and stated here because a fork maintainer will hit it first: the ten directories are committed and tracked, but each holds only objective.json, records.json and run.json. None carries a log, a report or an error file, and each records runner_rc 1 -- not the 139 this record cites. The golden records runner_rc 1 as well, so the committed artefacts do not distinguish the crashing arms from the passing one on the only status field they carry. The signal, the exit code and the router's completion line come from the originating lane's session output, which was never committed. This is exactly the defect A-15 records -- the producing step retained nothing from the tool -- appearing in this batch's own Bucket-T evidence. The correlation that IS supported by the tree stands: 10 of 10 arms with a non-redundant accumulator fail and 0 of 52 preserving arms do, which is a netlist property and is the lead. Before this is filed upstream it needs the crash artefacts attached: the tool's stderr tail, its exit status as the tool reported it, and the post-route netlist for one crashing arm"
problem: |
  OpenROAD is killed by signal 11 during post-route design-rule repair, AFTER detailed routing has printed its own completion line, on every arm whose accumulator is non-redundant. Ten of ten such arms crash; none of the fifty-two arms that preserve the state encoding crash. The process exit is 139, the route itself completed, and the crash is therefore in the post-route repair stage rather than in routing.
tool_enhancement: |
  Post-route design-rule repair must not fault on the netlist shape these arms produce; a repair pass that cannot proceed on a given instance is required to report that instance and continue or exit with a diagnostic, never to fault. The correlation is the lead: every crashing arm carries a non-redundant accumulator and no preserving arm crashes, so the reproduction is a netlist property rather than a floorplan or a random seed. Two properties the fix must hold: the ten samples above complete the post-route tail, and the tool exits non-zero with a named diagnostic rather than a signal on any instance it still cannot repair. FILING PRECONDITION: this cannot be filed as-is. The bad samples do not contain the crash, so a maintainer receiving them can reproduce nothing. Attach the tool's own exit status and stderr tail for at least one arm first; A-15 is the rule that stops the next Bucket-T record from being assembled this way. AND THE WINDOW HAS CLOSED, checked rather than assumed: the two run trees the provenance paths point at are both gone from this host, so the tool's exit status and output tail cannot be recovered by looking -- only by RE-RUNNING one crashing arm. Whoever files this should budget that run rather than go searching. AND THE EXISTING WORKAROUND IS ITSELF A FINDING ABOUT THE TOOL, which a fork maintainer should have before deciding how urgent this is. The flow already detects the fault and resumes: it re-reads the pre-antenna routed database and re-runs the post-route tail with the faulting repair pass omitted. That path fires, and it is not free. Of the 18 arms in the affected family, 10 hit the fault; a further 2 produced no number because the resume consumed the remainder of their hour-long per-trial budget. So the family's real loss is 12 of 18 rather than 10, and the two extra are attributable to the recovery rather than to the crash -- which means a fix that merely made the repair pass skip the offending instance faster would recover two arms on top of the ten, and that the current mitigation cannot be left in place as the answer. Nothing was done to make any of the 12 pass: no repair step was disabled by hand, no per-trial budget was raised for them, no routed database was patched.

pattern: |
  A tool stage that runs AFTER the stage whose success it depends on faults rather than diagnosing, so the flow sees a signal instead of a message. The flow can classify it and route around it, but every arm carrying the triggering netlist property pays the cost of the workaround, and on the slowest arms the workaround consumes the budget the arm needed to produce a number at all.

suggested_fix: |
  See the tool enhancement field: the faulting stage must degrade to a named diagnostic. The correlated netlist property in the samples is the reproduction path.

