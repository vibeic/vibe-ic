type: enhancement
severity: P2
component: program:gate_host_independence_check
plugin_version: "1.11.69"

title: >-
  An optional dependency needs a version matrix, because present-but-too-old is the arm nothing tests

pattern: |
  An optional dependency is handled for the case where it is ABSENT — the import is guarded, the fallback degrades, and that path is usually correct because it is the case the author imagined. The case that bites is PRESENT BUT TOO OLD: the import succeeds, the guard never runs, and an attribute added in a later release raises inside a program whose exit codes reserve a value for a finding about the subject under test. So a crash publishes itself as a verdict. Absent and too-old are different states and only the first is an import failure; every test that skips on importability covers the first and reports the second as an unexplained red.

suggested_fix: |
  Add a CI arm that installs each optional dependency at the oldest release the plugin claims to support, and run the suite there. That arm is the only thing that can distinguish the two states, and it is what turns a red on somebody's machine into a red on ours. Alongside it, the cheap half is worth having: where a guarded import is followed by an attribute the fallback cannot supply, the fallback should set an explicit capability flag rather than a None, and the test-side skip should route through the not-verified tier carrying the remedy command, so the roll-up shows an unanswered question rather than a pass or an unexplained failure. MEASURED, and the measurement is why this is not a program rule: a static screen over the tree gives 131 guarded imports, 79 using an attribute outside the handler, 56 with no capability guard, and 8 once sibling and standard-library imports are excluded — and of the 6 of those 8 that can be executed with the dependency blocked, 6 of 6 degrade with a message and none crashes. The static form does not work. The motivating defect was never the absent case at all: it was an attribute that arrived in the dependency's next major release, on a host that had the older one, costing 33 red test identifiers and one crash returned under the exit code reserved for a design finding. EXISTING PARTIAL COVERAGE, which this record failed to cite and which the implementing lane should build on rather than reinvent: the tests tree already carries a shared helper for exactly the too-old case, used by three test files. Its own header records the measurement -- on a host carrying the 3.2.0 release, 33 of the 46 shipped test files in this layer failed from that single cause, every one of them reporting as a FAILURE rather than as a skip. The helper degrades to the older draft AND pins that the degradation is honest: the schema must use no keyword the two drafts read differently, and every internal reference must be a local pointer, because a bare-name identifier is not a resolvable address and a remote reference would send the validator to a host that does not exist. What is still missing, and why this stays Bucket C, is the matrix: the helper handles the version this machine happens to have, and nothing exercises BOTH versions, so the next incompatibility is found the same way this one was.

