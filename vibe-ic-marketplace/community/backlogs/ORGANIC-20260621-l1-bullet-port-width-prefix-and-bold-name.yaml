type: enhancement
severity: P2
component: program:phase1_doc_one_shot_runner

title: >-
  L1 bullet-port extractor misses two structured-prose port forms —
  width-prefixed (`- [7:0] name: desc`) and markdown-bold-named
  (`- **name**: desc`) bullets under an Inputs:/Outputs: heading

pattern: |
  _l1_bullet_port_extract (phase1_doc_one_shot_runner.py:2802, strategy
  `markdown_bullet_under_heading`) extracts ports from a `<heading>:` +
  bullet-list block, but two common structured-prose shapes slip past it and
  yield ZERO ports — so the deterministic DOC->JSON track emits an L1 with an
  empty pin_table and the design falls entirely to the AI track.

  Measured on the unified-doc-mode sweep of all 302 CVDP prompts (2026-06-21):
  284/302 reach a deterministically-sufficient L1; the 18 residual all have
  port_count==0, and the recurring fixable forms are:

  (1) WIDTH-PREFIXED bullet — the bit-range precedes the name:
        - Inputs:
            - [7:0] in:  An 8-bit input vector ...
        - Output:
            - [2:0] out: A 3-bit output vector ...
      (cvdp_copilot_8x3_priority_encoder_0001). The name regex anchors on a
      leading identifier and the `[7:0]` prefix (plus the nested `- Inputs:`
      bullet-as-heading) defeats the current heading + name match.

  (2) MARKDOWN-BOLD name — the identifier is wrapped in `**...**`:
        #### Inputs (1-bit width each):
        - **i_S**: Set signal
        - **i_R**: Reset signal
        - **i_clk**: Clock signal
      (cvdp_copilot_flop_0001). The `**` emphasis is not stripped before the
      identifier scan, so no bare/backticked ident is found.

  Both forms state direction via the heading (Inputs/Output[s]) and width via
  the `[msb:lsb]` prefix or the heading parenthetical ("1-bit width each"),
  so they are fully deterministic — no LLM judgment is required.

suggested_fix: |
  Extend _l1_bullet_port_extract (Bucket A) with two narrowly-scoped, corpus-
  swept additions:
    - strip leading `[msb:lsb]` / `[N]` width prefixes off the bullet name
      region BEFORE the identifier scan, and capture the width into the port
      record (so `- [7:0] in:` -> {name: in, mode: input, width: 8});
    - strip markdown emphasis (`**name**`, `*name*`, `__name__`) to the bare
      identifier before matching (so `- **i_S**:` -> {name: i_S}).
  Recognise a bulleted `- Inputs:` / `- Outputs:` line as a port-heading (not
  only `####`/`**Inputs:**` heading shapes), and inherit a heading
  parenthetical width ("1-bit width each") as the per-bullet default width.
  MANDATORY corpus-sweep before ship: the function carries 4+ prior false-
  positive fixes (#116, #118, v1.6.257, v1.6.258) — run the full
  programs/tests suite AND re-sweep the 87-doc benchmark_phase1 corpus + the
  302 CVDP doc-mode run; the new patterns must ADD ports on the 18 residual
  designs with ZERO new phantom ports on the 284 already-passing ones.
  Add a dedicated test fixture for each of the two forms (PASS + the real
  defect it guards + an honest negative that must NOT scrape a phantom).

  EMPIRICAL FINDING (2026-06-21 prototype + 302 sweep — informs the real PR):
  a prototype directional pass (heading `Inputs:/Outputs:`, width-prefix + bold
  + colon, short-name accepted with a width bracket) extracted the CORRECT
  ports on the residual designs, but a NAIVE append into _l1_bullet_port_extract
  REGRESSED three designs whose ports come from a Verilog module region in the
  same doc — ahb_clk_counter 31->29, binary_search_tree_sorting 18->15,
  fibonacci_series 4->2 — and only recovered 3/18. Root cause is NOT the
  extractor: the width-LESS bullet ports collide BY NAME with the richer
  width-bearing ports another extractor (Verilog region) already produced, and
  the downstream pin_table MERGE drops entries on the collision. So the real fix
  lives at the MERGE SITE: dedup port sources by name preferring the
  width-bearing / richer record, and only let the directional bullet pass
  contribute a name no other source already covers. A Verilog-presence gate is
  NOT sufficient (flop_0001/0002 HAVE a Verilog region yet only the bold-bullet
  pass recovers their ports; fibonacci has NO Verilog yet still regressed). Ship
  the extractor + the merge-site dedup together, re-sweep all 302, and require
  ZERO design with a decreased port_count.

