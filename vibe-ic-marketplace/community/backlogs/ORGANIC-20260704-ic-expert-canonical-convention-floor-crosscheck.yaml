title: >-
  DUAL-TRACK FLOOR RULE + 10 chip-AGNOSTIC canonical-convention lesson candidates:
  before a benchmark answer is declared UNDER_SPEC_FLOOR it MUST first survive an
  IC-Expert canonical-convention cross-check — 10 of 18 hard-94 "floors" were in
  fact recoverable by textbook/industry convention and PASSED the official oracle
  (converged 76/94 → 86/94)

plugin_version: "1.3.7"

pattern: |
  A single-track floor rubric over-declares floors. The prior hard-94 converge
  loop classified 18 residual fails as floors using ONLY the oracle-evidence track
  (expected-vs-got shows a fact absent from prompt+context → UNDER_SPEC_FLOOR).
  Re-running those 18 through the IC-Expert canonical-convention track (textbook /
  IEEE / industry-default recognition + IC Expert DB, NO oracle read for the first
  pass) recovered 10 at the OFFICIAL docker oracle:

    1. cache_lru_0019        — canonical tree-PLRU hot/cold-bit form: each node bit
       follows the MRU branch; victim walks the COMPLEMENT; all-zero reset ⇒ first
       victim = way NWAYS-1. (IC Expert DB [cache] confirms the encoding.)
    2. config_lpf_0004       — flattened packed-array convention: slot i = bits
       [i*W +: W], slot 0 at LSB (SV packed-array / bus[i*W+:W] / AXIS lane-0-LSB).
    3. config_lpf_0011       — cocotb dut.<name> resolves ANY top-scope object, not
       only ports; the design's own _in/_out suffix system makes w_out/b_out the
       unique conventional observable alias of the state registers.
    4. fifo_async_0001       — unstated DATA_WIDTH on a bus-facing FIFO defaults to
       32 (AMBA/processor word); 0xDEADBEAF is intrinsically a 32-bit sentinel.
    5. image_rotate_0001     — embedding m×n into N×N is the textbook block form
       [[A,0],[0,0]] (trailing zero-pad); the 2'b11 "no rotation" mode forces it.
    6. perceptron_0006       — a testing unit that "extends the training microcode
       ROM" inherits the base sequencer's cadence (1 microinstruction / 2 clocks).
    7. perceptron_0013       — Fausett stopping criterion: stop iff the update
       deltas are ZERO (not "two consecutive EQUAL deltas", which fires on a held
       nonzero delta).
    8. interrupt_ctrl_0017   — the spec's own 6-state FSM + canonical Moore output
       convention pins every "missing" timing fact (valid asserts on entry to
       SERVICING = fixed FSM-depth latency, level-held to ack, ≥1 dwell before
       re-arm).
    9. 64b66b_encoder_0022   — mutually-exclusive 8-bit control decodes are one-hot,
       so a priority-mux payload net legally rewrites as one-hot AND-OR SOP with a
       thermometer terminate-mask → hits the harness's exact area threshold.
   10. sync_serial_0052      — a receiver's random-access indexed bit write
       (data_reg[bit_count]) is textbook-replaced by a ring-counter-addressed SIPO
       (one-hot write pointer + lap counter) → same semantics, meets area+latency.

  The remaining 8 resisted even a SECOND expert pass that was fed the oracle
  expected-vs-got (0/7 recovered), and are the genuine floors — most notably
  hebbian_0012 (whitebox TB pins internal w1/w2/bias that contradict the GIVEN
  gate_target sub-module) and rounding_0001 (expected output oscillates 0↔255
  between the two contradictory worked examples). See the companion
  harness-contradicts-given-context floor-class backlog.

suggested_fix: |
  (A) FLOOR RUBRIC (methodology): in open-benchmark-methodology §4, make
      UNDER_SPEC_FLOOR require BOTH tracks to fail — (1) oracle-evidence names a
      missing fact AND (2) the IC-Expert canonical-convention track cannot supply
      it from textbook/IEEE/industry default or the IC Expert DB. A fact that a
      competent IC designer would fill by convention is NOT a floor. This is the
      dual-track cross-check the knowledge-DB doctrine already mandates elsewhere.
  (B) IC-EXPERT LESSONS (skill:ic-expert-agent): append the 10 items above as
      chip-AGNOSTIC "### Skill:" canonical-recognition sections (behavioral pattern
      only — no design identifiers, no oracle values). Each is a general silicon
      convention (tree-PLRU encoding, packed-array LSB packing, cocotb top-scope
      observability, AMBA default widths, block zero-pad, microcode cadence
      inheritance, Fausett stop, Moore-FSM timing derivation, one-hot SOP area
      rewrite, ring-counter SIPO).
  (C) PROGRAM-FIRST RESIDUAL: items 1/2/9/10 are structural rewrites a
      deterministic pass could recognize; candidates for rtl_dispatch / synth-area
      helpers if a general rule proves stable. Items 4/6 (default-width /
      cadence-inheritance) are candidates for L-doc parameter defaulting.

  Absorption is program-first then skill-digest; this backlog carries the
  candidates only — the repo-gatekeeper/core-agent decides final placement and
  assigns the version. Benchmark-agent does not land plugin edits.

