session_context: >-
  Convergence rounds R25 and R26 of one design on a commercial process (the third and latest run directory was not read). Both rounds measured the identical partition: 246 registered structural-RTL gates, 210 returning a verdict, 13 FAIL. 7 of the 13 belong to the deferred-track suppression defect captured as a separate record; these 6 are the remainder. Nothing filed for either family.
