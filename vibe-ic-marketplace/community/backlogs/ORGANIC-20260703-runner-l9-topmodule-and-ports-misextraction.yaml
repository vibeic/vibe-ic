type: bug
severity: P1
component: program:phase1_one_shot_runner

title: >-
  Phase-1 L9 extraction picks a PARAMETER name (or an algorithm-step / interface
  section header) as `top_module` and promotes parameter names / submodule names
  to top-level ports — so the runner's generated full-stack / oracle TB
  instantiates a non-existent module and reference_tb FAILs on correct RTL

plugin_version: "1.2.96"

pattern: |
  Reproduced across the UNIFIED-ENTRY CVDP hard-94 run (RULE 0 path: each record
  driven through vibe_ic_one_shot_runner -> phase1 -> spec-to-rtl). The Phase-1
  L9_INTEGRATION_SPEC repeatedly mis-derives `top_module` and `top_ports` from the
  prompt prose instead of the design's real module header:

    * top_module set to a PARAMETER name: `DATA_WIDTH` (axi_register, config_lpf,
      cont_adder), `CLOCK_HZ` (sound_generator), `POLY_LENGTH` (prbs_gen),
      `Initialize_r_operand_1_r_operand_2` (apb_dsp_unit).
    * top_module set to an ALGORITHM-STEP / SECTION header: `Step_9`
      (gaussian_rounding_div), `Data_Latency` (modified_booth_mul),
      `Interface_Signals` (galois), `CLOCK_HZ` (sound_generator).
    * PARAMETER names promoted to ports: `nbw_beans`/`ns_beans` (coffee_machine —
      dropped 12 of 15 real ports); SUBMODULE names promoted to top ports:
      `stack_pointer`/`stack_ram`/`stack_mux` (microcode_sequencer),
      `control_register`/`train_history` (apb_history_shift_register),
      `reg_operand_b`/`reg_operand_o` (apb_dsp_op).

  DOWNSTREAM EFFECT: the runner's generated full-stack TB / arith-oracle TB
  instantiates the bogus top name (`chip_top` when top_module stays the sentinel,
  or the mis-extracted name) and/or binds the wrong/flattened ports, so
  reference_tb FAILs to elaborate on RTL that yosys_synth + determinism_gates all
  PASS. The CVDP scorer is UNAFFECTED (it binds the real module by filename
  rtl/<name>.sv), so this does not change the benchmark number — but it makes the
  runner's own reference_tb a false-negative on ~15-20 of 94 designs, and it would
  mislead a real general-design user whose L9/TB are the actual deliverable.

repro: |
  For any hard-94 project, `vibe_ic_one_shot_runner.py <proj> --skip-phase3
  --skip-analog --skip-hardware`; inspect phase1/generated_docs/L9_*.json
  top_module / top_ports vs the prompt's real `module <name>(...)` header.

suggested_fix: |
  In the L9 top_module / top_ports extractor:
    - NEVER accept a token that appears in a `parameter`/`localparam` declaration,
      an all-caps CONST-style identifier, or a prose section/step header
      ("Step N", "Data Latency", "Interface Signals") as `top_module`.
    - PREFER the design's own `module <name> ( ... )` header when the prompt/context
      contains one (bug-fix/modify problems always do; many completion problems do
      via a code skeleton) — that name and its port list are authoritative.
    - Distinguish PORTS from PARAMS (a `#(...)` list is params, a `(...)` list is
      ports) and from SUBMODULE instance names (a `<type> <inst> (` inside the body
      is not a top port) — reuse the same instantiation-grammar filter cvdp_gate's
      instantiated_module_names() already implements.
    - When top_module cannot be determined from a real header, keep the `chip_top`
      sentinel AND emit a chip_top pass-through wrapper (see the companion
      chip-top-auto-emit backlog) rather than promoting a guessed name.
  Add regression fixtures from coffee_machine / sound_generator / microcode_sequencer.

evidence:
  run: benchmark_external/cvdp/run_hard94_unified_20260703
  confirmations: ~15-20 independent spec-to-rtl authors reported the mis-extraction
  filed_by: benchmark-agent (unified-entry CVDP hard-94 on v1.2.96, RULE 0 path)

resolution:
  status: fix-landed
  landed_by: repo-gatekeeper (core-agent role)
  fix: |
    phase1_doc_one_shot_runner:
      * NEW `_doc_real_module_decl_name` + `_RE_DOC_TOP_MODULE_REAL_DECL` — an
        actual `module <name> ( <ports> );` declaration ANYWHERE in the docs
        (fenced OR unfenced), accepted only when the port body is a real port
        list (a direction keyword / `#(param)` form / clean identifier list, never
        a prose parenthetical), is AUTHORITATIVE and OUTRANKS every prose
        heuristic. Wired as top priority in `_extract_top_module_from_docs`.
      * `_is_valid_top_module_candidate` hardened to reject: SCREAMING_SNAKE
        parameter names (`DATA_WIDTH`/`CLOCK_HZ`/`POLY_LENGTH`), `Step_N` step
        headers, and Title_Case_Snake section headings (`Data_Latency`/
        `Interface_Signals`/`Register_Map`) — so with NO real declaration the
        extractor degrades to the `chip_top` sentinel, never a garbage name.
    Reproduced on v1.3.4 before the fix (prose-only doc returned `Data_Latency`;
    the filter passed `DATA_WIDTH`/`Step_9`). After: real header (fenced+unfenced)
    wins; param/step/section tokens rejected; prose-only -> None -> sentinel; real
    RTL names (coffee_machine/aes_core/microcode_sequencer/...) still accepted.
    Regression: programs/tests/test_organic_20260703_l9_topmodule_misextraction.py
    (8 tests). No regression across the phase1_doc/L9/chip_top family (622 green).
  annotated_at: "2026-07-04 (core-agent fix, post-#97)"
  triage_2026_07_06: verified — _doc_real_module_decl_name + hardened _is_valid_top_module_candidate; test_organic_20260703_l9_topmodule green
