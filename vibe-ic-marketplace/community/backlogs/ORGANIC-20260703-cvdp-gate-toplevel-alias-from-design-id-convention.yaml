type: enhancement
severity: P1
component: benchmark:cvdp_gate

title: >-
  CVDP gate does not alias the harness TOPLEVEL for no-context problems whose
  prompt states every port but NOT the module name, so a 100%-correct blind
  emit ELAB_ERRORs on the official scorer purely on a module-name mismatch

plugin_version: "1.2.96"

pattern: |
  cvdp_gate / cvdp_harness_toplevel_alias derive the alias-target module name
  ONLY from a verbatim `module <X>(` skeleton inside input.prompt
  (skeleton_module_name_from_prompt). A large class of CVDP copilot problems
  give the FULL port list + logic + worked examples in prose but never emit a
  code-fence skeleton and never state the module name — the toplevel lives ONLY
  in the hidden harness `.env` (TOPLEVEL) + golden `rtl/<name>.sv`, which are
  off-limits oracle. With no prompt skeleton the gate has nothing to alias to,
  so the blind emit ships under whatever name the author inferred from the
  design id, and the scorer's `iverilog -s <harness_top>` cannot bind its root:

      error: Unable to find the root module "encoder_64b66b" in the Verilog source.
      1 error(s) during elaboration.   -> every test fails

  MEASURED (canary v1.2.96, 10 problems): cvdp_copilot_64b66b_encoder_0001 was
  authored 100% correctly (both worked examples match, iverilog clean) but named
  `encoder` (design id `cvdp_copilot_64b66b_encoder_0001` has NO module-name
  cue in its prompt). Harness top = `encoder_64b66b`. Result: 0/1 on a fully
  correct design — a 100%-recoverable interface-naming fail, not a logic fail.

  NAMING TRAP: naive id-stripping of `cvdp_copilot_64b66b_encoder_0001` yields
  `64b66b_encoder`, but the real module is `encoder_64b66b` (multi-token stem in
  REVERSED order). Sibling problems 0005/0009/0022 only got the name right
  because their input.context RTL literally contained `module encoder_64b66b`.
  A no-context problem in the same family cannot.

repro: |
  Baseline: emit author RTL as `module encoder(...)` -> score -> FAIL
  (ELAB: root module encoder_64b66b not found).
  Fix-proof: append a byte-for-byte pass-through wrapper
  `module encoder_64b66b(<same ports>); encoder u(.*); endmodule` -> re-gate ->
  re-score -> Passed Problems 1/1 = 100.00%. Logic was always correct; the fail
  was purely the toplevel name. (verify dir:
  benchmark_external/cvdp/run_canary_v1296_20260703/verify_encoder0001/)

suggested_fix: |
  In cvdp_gate's emit path, when the author top does NOT match and the prompt
  carries NO `module <X>(` skeleton, ALSO derive candidate toplevel names from
  the DESIGN-ID convention (legal record metadata, NOT oracle) and synthesize a
  thin pass-through alias_wrapper for each candidate not already declared:
    - strip the `cvdp_copilot_` prefix and `_NNNN` suffix -> stem tokens
    - emit wrappers for BOTH the stem as-is (`64b66b_encoder`) AND the reversed
      multi-token ordering (`encoder_64b66b`), since the copilot naming flips the
      qualifier/head order
    - the wrapper leaves the author RTL byte-for-byte intact; unused wrappers are
      harmless (the scorer's `-s <top>` binds exactly the matching one)
  This is blindness-clean: the design id is the record KEY, never the hidden
  harness `.env`. It recovers every "correct-logic wrong-name" no-context fail
  without reading any oracle.
  ⚠ Do NOT read the harness `.env`/output.* to get the name — that would be an
  oracle leak. Derive ONLY from the id + prompt.

evidence:
  run: benchmark_external/cvdp/run_canary_v1296_20260703
  baseline_score: 6/10 (60%)
  recoverable_with_fix: 7/10 (encoder_0001 FAIL->PASS verified)
  filed_by: benchmark-agent (clean-room CVDP canary on v1.2.96)

