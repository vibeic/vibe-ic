type: bug
severity: P1
component: program:flow_compliance_check
plugin_version: "1.9.78"

title: >-
  Close the P0 structural-gate coverage hole: 36 of 246 registered checkers return no verdict on every run

pattern: |
  An umbrella that aggregates a registry of checks computes its verdict over only the
  checks that actually returned one, and publishes PASS without the denominator. A check
  that never ran is then indistinguishable, in the umbrella's output, from a check that
  ran and passed — so the aggregate never weakens as coverage decays: the registry grows,
  the invoked subset does not, and the same reported PASS covers less of the design each
  release. The usual cause is not a disabled check but a calling convention. The umbrella
  builds an argument list the checker's own argument parsing rejects, so the checker exits
  before it can reach a verdict and therefore also never produces a failure. Silence is
  the one outcome that costs nothing to emit, which is why it accumulates.

suggested_fix: |
  Work the never-invoked set down to zero one gate at a time, each with its own re-derived measurement rather than a bulk conversion. Per gate: build the argv from the umbrella's own builder (never a re-typed literal, which agrees with the umbrella only by coincidence), run it over the tracked corpus, and record three numbers — new failures introduced, how many projects see the gate disclose a non-empty denominator, and whether an injected defect of the kind the gate exists to catch still makes it exit non-zero. A gate clearing all three earns an adapter entry. A gate whose missing argument is a fact about the design earns a discovery mode that must report when its enumeration was incomplete, or stays explicitly driven from the step that owns the value. A gate whose subject occurs nowhere in the corpus is de-registered only alongside a written statement of what stopped being checked, so the denominator cannot shrink silently. The corpus-reddening gates are the real work and must be scheduled as such: measured at this record's base, the largest reddens 103 of 108 directories, the next 3 of 108, and each of those projects needs its own verdict on whether the gate or the project is wrong before the gate can be wired. An earlier draft of this sentence said 102 of 107 — the pre-correction figure the source itself records as superseded, and the third stale denominator found in this record. Re-read the row rather than quoting this number.

id: "ORGANIC-20260804-p0-umbrella-uninvoked-gate-coverage-hole"
submitted_at: "2026-08-04T23:55:17+08:00"
session_context: >-
  Five convergence runs across five distinct designs — three on a public open PDK, two cells on a commercial process — each disclosing 36 of 246 registered structural gates as never validly invoked (36 of 245 on the run whose registry was one smaller), at two plugin releases, with the step still reading PASS and counting toward the run's PASS tally. Re-measured against the base this record targets (e3aa9b126), because an earlier draft of this paragraph quoted a ratchet size that had already been superseded: 246 gates registered, and 36 — not 32 — names pinned in the invocability ratchet. The 32 was four releases stale and the source says so itself ("Measured 33 on 2026-07-30 at v1.8.58; 32 after the polluter gate converted; 36 at v1.9.74 ... it was pinning the WRONG SIZE"), the correction landing once the discriminator stopped re-typing the umbrella's rule and called the umbrella's own classifier. An earlier draft of this paragraph also claimed 4 of the 36 carry no decision-table row anywhere. That is FALSE, and the correction matters more than the count: every one of the 36 carries a row. The umbrella's licensing function unions six tables — the per-directory measurement table, the zero-denominator classification, the argv adapters, the design-value-undrivable set, the not-a-project-gate set, and the undrivable-by-this-umbrella set — 39 names in all, and the ratchet minus that union is EMPTY. The four that sit outside the narrower four-table set (`packet_length_check_present`, `pre_awake_silence_check`, `rtl_precheck_gate`, `testbench_exists_check`) are not orphans; they carry rows in the per-directory measurement table, which is what licenses their silence where the four narrower tables do not. An earlier draft called them "precisely its REDDENING rows"; that too was false, and it is the same defect one more time — a claim adjacent to the measurement rather than equal to it. FIVE rows redden, not four: the four above plus `bit_count_modulo_check`, which reddens 1 of 2 and is ALSO covered by the narrower tables, so it never appears in the ratchet-minus-four set. "The names only the measurement table covers" and "the names that redden" overlap in four places and are not the same set, and a sentence that names one while claiming the other is exactly what this record exists to describe. The figure 32 is how this stayed hidden so long, because it is simultaneously wrong and right about two different things: as the ratchet SIZE it is the stale pre-correction value, but as the count of ratcheted names appearing in those four narrower disposition tables it is a correct MEASURED 32 of the 36 at this base, the other 4 being the reddening rows just named. Neither reading is an inference; both are counts. All of these numbers are recoverable by a plain syntax-tree parse of the two files: the tables are module-level literals, and the only dynamic step is the CONSUMER reading them by name off the umbrella. Mistaking that dynamic dereference for a dynamic definition is what defeated three separate attempts to count them, including two of mine. The four deterministic rules captured alongside this entry fix how the hole is labelled, disclosed, ratcheted and prioritised; none of them closes it, and shipping them without this entry would imply otherwise. One last note, because this record is its own best evidence: every corrected value above — the copied generalization, the empty one, the stale ratchet size, the false row claim, the superseded reddening denominator — was a populated field that read as a measurement of the thing beside it and was not, each found by a different reader, and twice the same defect appeared inside the correction being written for it. That history is the argument for the separately authored emitter guard that refuses a missing or empty generalization at capture time and defines the field in the two places it is actually written, rather than leaving it to be filled from whatever was nearest to hand.
