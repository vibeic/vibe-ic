title: Admit and bind typed Phase 1 supplemental sources across actual producer and consumer paths
pattern: When original design documents are supplemented by delivery answers, feature provenance or
  block-local interface declarations, a fixed original-document census omits valid source facts and
  their hashes. The expert reader and canonical D1 input issuer can then disagree about which bytes
  were consumed. A source control must not itself become citable design authority.
suggested_fix: Introduce a closed source-kind admission contract with complete enumeration, exact hashes
  and explicit authority ceilings. Reuse it in the expert reader, metric census, actual frontend worker,
  producer identity and checkpoint/retry currentness. Preserve absent-control legacy behavior; refuse
  malformed, nonregular, unreadable, stale or partial typed sources before publication. Requirements
  approval remains independent.
