  # Complete reviewed typed Phase 1 facts through the ordinary producer with renewed source authority

  ## General gap

  An independently reviewed source may require supported port, reset, FSM or waveform facts that the current deterministic extractor cannot complete. A narrow authoring transaction should admit these typed facts through the ordinary producer, bind all original/typed-source/approval bytes, preserve unrelated producer-owned fields, and refuse stale, incomplete or unsupported facts. Updating a typed publication changes the authoring contract even when RTL bytes do not change; an earlier independent answer cannot automatically approve the new contract.

  This captures PLUGIN-002 plus PLUGIN-011's remaining independent-review requirement. It is not permission to hand-edit generated L documents or infer new circuit expectations from the candidate output.

  ## Neutral minimal reproduction

  Create a tiny visible specification and independently reviewed typed completion covering one supported interface/reset fact. Produce documents through the ordinary CLI. Then change the source bytes, the completion bytes or the consuming field assignment independently while retaining the old review. Each stale arm must refuse or require renewed review. A valid arm must preserve unrelated source metadata and emit the exact supported fact. Unsupported behavior must remain deferred rather than converted into arbitrary behavioral IR.

  ## Existing tracking and local evidence

  - Upstream owner: `programs/phase1_doc_one_shot_runner.py` and the existing producer-identity and signed-judgement consumers. The local module `programs/phase1_typed_facts.py` is absent at the filing base; it is a proposed port, not a shipped upstream defect location.
  - Local implementation candidates: `69c0a684f26bd703eacb8a6a9b1ecd9483a89751`, `9ccf137c7717ac6d05d15bf401ceb19739f3799a`. The retained capture reports ordinary CLI/scaffold/native-interface checks for the four supported domains only. Complete D1 and arbitrary semantic completion remain unmeasured.
  - #3775 admits and binds supplemental source kinds. That source census is related but does not itself publish these typed facts.
  - #3776 orders producer freshness before pending-answer retry. This completion must preserve that ordering.
  - #3777 preserves semantic-review limits and forbids treating local capture as upstream delivery. This issue supplies the separate program capability and the renewed independent-review requirement; it does not duplicate that documentation PR.

  ## 驗收

  Use tests-first neutral fixtures for all supported domains and the actual producer/consumer path. Bind complete source, typed completion and approval bytes; keep controls noncitable; reject stale approvals and unsupported values. Check that typed-field ownership, not text anywhere in the output, satisfies a fact. Preserve unrelated fields byte-for-byte where the producer contract requires it. Keep pending requirements authority pending.

  After porting the local focused suite, run from repository root:

  ```bash
  cd vibe-ic-marketplace/plugins/vibe-ic
  python3 -m pytest -q programs/tests/test_phase1_source_bound_completion.py
  ```

  This suite is absent on the filing base and is part of the requested implementation. The positive transaction must include independent expectations prepared before seeing candidate output. Replaying an old answer after changing the authoring contract is a negative control, not acceptance.

  ## Evidence and submission boundary

  This is a general enhancement backlog, not a benchmark result. Filing source: plugin 1.35.51, main `95a3be2b31bb3fe17c0e5bdbf3f654be020ee078`. The owning source presence and related public submissions were inspected at this snapshot. The behavioral findings below come from retained local capture metadata; the complete implementation has not been ported or freshly reproduced on this upstream snapshot. No benchmark solution, official reference, private transcript, or local machine path is included.

  Local candidate implementation and focused acceptance are distinct from upstream delivery. No new native run, full-suite result, source-semantic approval, or benchmark PASS is claimed by filing this issue. The commands under acceptance are implementation deliverables, not filing-time execution claims. Any named new test module must be added before its command can supply evidence; missing-module errors do not count as negative controls.
