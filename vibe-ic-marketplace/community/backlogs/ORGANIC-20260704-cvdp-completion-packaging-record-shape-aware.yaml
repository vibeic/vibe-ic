type: enhancement
severity: P1
component: benchmark:cvdp_gate

title: >-
  PROGRAM-FIRST: completion packaging must be record-shape-aware — single-output
  records need RAW SV (gate currently DOC-JSON-wraps some, scorer stages the blob
  verbatim); multi-output records REQUIRE {"code":[{path:content}]} (raw SV →
  JSONDecodeError → zero files staged). Deterministic rule proven +5 problems.

plugin_version: "1.3.4"

pattern: |
  Official scorer (public run_benchmark model_helpers.parse_model_response):
  files==1 → direct-text (raw SV); files>1 → json.loads(completion) expecting
  {"code":[{path:content}]}. MEASURED on hard-94 (v1.3.2 gate):
  * gate wrapped 3 SINGLE-file records (elevator_control_0009, manchester_enc_0005,
    scrambler_0018) in DOC-JSON envelopes → staged verbatim as .sv → syntax error
    line 1 → 0 tests for 3 rounds.
  * gate emitted RAW SV for 2 MULTI-file records (ping_pong_buffer_0001 [2 files],
    axis_border_gen_0014 [3 files]) → JSONDecodeError → nothing staged.
  MECHANICAL correction (raw SV for singles; envelope split by declared module →
  rtl/<module>.sv for multis, deps restored, empty entries omitted so context
  files are not clobbered) flipped ALL FIVE to staging correctly; 4 of 5 now PASS
  the official oracle outright.

suggested_fix: |
  Deterministic packaging stage in cvdp_gate emit (program-first, no AI):
  (1) derive the record's expected-output-file count (from --dataset record; the
  prompt names save-paths for multi-file problems); (2) files==1 → emit the bare
  Verilog text, NEVER a JSON envelope; (3) files>1 → emit json {"code":[{ "rtl/
  <module>.sv": <that module's source> }...]} split by declared module, omitting
  empty entries; (4) extend the #535 roundtrip to SIMULATE the scorer's
  materialization for BOTH shapes and iverilog the staged tree. Fixtures: the 5
  records above (archived resp/drafts in run_hard94_unified_20260703).

evidence:
  run: benchmark_external/cvdp/run_hard94_unified_20260703 (converge3/5/7)
  recovered: elevator+manchester+scrambler+ping_pong PASS after packaging alone/with fixes
  filed_by: benchmark-agent (converge rounds 3-7)

resolution:
  status: resolved
  date: "2026-07-06"
  by: repo-gatekeeper triage sweep
  note: >-
    cvdp_gate.py _emit_or_split shape-aware packaging live; test_cvdp_gate_multifile_split + flat_filemap_unwrap green
