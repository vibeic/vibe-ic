type: bug
severity: P1
component: program:flow_gate_enforcement_audit
plugin_version: "1.10.11"

title: >-
  ENFORCED still moves 16 to 17 when one DEAD module-level line is added, because the
  name-side live range cannot see a function-local that shadows it

pattern: |
  A liveness window that admits a binding from an ENCLOSING scope, but computes that
  binding's end-of-life using only the enclosing scope's own stores, cannot observe the
  inner-scope store that shadows it. The name is then treated as still carrying the
  outer value at every line of the inner scope, so any use of that name inside a function
  is credited to whatever the module-level binding happened to hold. The failure is
  invisible to single-scope fixtures: a window added to stop name coincidence WITHIN a
  scope reads as complete while the identical coincidence ACROSS scopes is untouched, and
  the coincidence is now cheaper to trigger than before, because it no longer needs a
  real call site - a dead assignment nothing ever reads is enough. Any analysis that
  reports "this artefact is reached by that mechanism" must close a binding's window
  against stores in EVERY scope that can shadow it, or state that it does not.

suggested_fix: |
  In `_live_here`, a taint entry whose scope is `_MODULE_SCOPE` must have its window
  closed by the FIRST store of that name in the QUERYING scope as well as by the next
  module-level store: a module binding is not live at any line of a function that binds
  the same name. Concretely, when `s == _MODULE_SCOPE and scope != _MODULE_SCOPE`, the
  window end becomes `min(_next_store(_MODULE_SCOPE, n, b, ()), first_store(scope, n))`,
  and when the querying scope stores the name at all before the queried line, the module
  entry must not match. Add the cross-scope case to the `_BEHAVIOUR_PRESERVING` fixture
  family, which today is entirely single-scope: none of the 22 existing fixtures, nor
  R23/R24/R25 added by the #884 fix, can express "the module binds this name too". The
  regression test that pins it should be the dead-line form, because that is the cheapest
  trigger and the one no refactor-shaped fixture would find.

