type: enhancement
severity: P2
component: program:rtl_hygiene_lint
plugin_version: "1.3.9"

title: >-
  rtl_hygiene_lint has no structural checks for six recurring arithmetic-datapath
  correctness traps distilled from proven-correct CVDP solved designs (divider
  final-correction, multi-operand width consistency, BCD borrow-chain priority,
  sequential-multiplier width, variable-base part-select legality, Booth
  sign-extend-before-shift order)

pattern: |
  Cross-checking benchmark_external/cvdp/solved_design_db/solved_design_index.json
  (94 proven-correct oracle-PASS CVDP designs, each carrying a distilled
  design-CLASS lesson) against rtl_hygiene_lint.py's existing rule set found six
  lessons that reduce to a deterministic, mechanical structural check but are not
  currently enforced by any program:

  1. non-restoring-divider final correction: after the last of exactly W
     iterations, a negative running remainder must receive a mandatory final
     `+= divisor` correction before being emitted; skipping it produces an
     off-by-divisor remainder that only shows on specific sign combinations.
  2. multi-operand GCD/LCM width consistency: every intermediate product must be
     widened to true algorithmic max width (e.g. 3*W for a 3-operand LCM
     product) and any divisor combined with it must be value-preservingly
     zero-extended to match, never left at input width.
  3. BCD/HH:MM:SS-style cascaded down-counter borrow chain: decrement must be
     evaluated in strict priority order (lowest unit first, cascading a borrow
     upward only when the lower unit is exhausted) — an if/else-if chain in the
     wrong order silently produces wrong wraparound.
  4. sequential shift-and-add multiplier: the accumulator and shifted
     multiplicand must both be pre-sized to 2*WIDTH before the shift, or
     high-order partial products truncate silently for large operands.
  5. variable data-dependent bit-window extraction: must use `expr -: WIDTH` /
     `expr +: WIDTH` (runtime base, CONSTANT width) — a `[hi:lo]` slice with
     variable bounds is illegal Verilog and either fails to elaborate or (worse)
     is silently misinterpreted by a permissive toolchain.
  6. radix-4 Booth multiplier: each 3-bit overlapping group's signed recoded
     term must be sign-extended to the FULL product width BEFORE the
     arithmetic left-shift (`<<<`) by 2*group_index — shifting at the narrow
     operand width truncates the sign/overflow bits.

  chip-AGNOSTIC: all six are structural RTL patterns independent of any
  design/benchmark/SKU literal.

  NOTE ON SCOPE (self-disclosed, not yet implemented): a 7th candidate — narrow
  bitwise-complement feeding a wider LHS (secure-ALU class) — was INITIALLY
  flagged by the cross-check but on verification is ALREADY covered by the
  existing `rule_bitwise_not_width` check (assign-form regex
  `wideLHS <= ~narrow;`) in rtl_hygiene_lint.py. Excluded from this backlog to
  avoid a duplicate rule.

suggested_fix: |
  Six new rtl_hygiene_lint.py rules (one per pattern above), each following the
  existing rule_* / Finding / _advisory conventions in that file:
  - rule_divider_missing_final_correction: structural — detect an iterative
    divide/remainder FSM (loop counter reaching a width-derived iteration
    count, a signed running-remainder register) whose terminal branch has no
    `if (<remainder> < 0) <remainder> <= <remainder> + <divisor>;`-shaped
    correction before the remainder is read out.
  - rule_multiop_arith_width_consistency: structural — for a chain of >=3
    arithmetic operands combined by mul/div, flag when an intermediate
    wire/reg's declared width equals a single operand's width rather than the
    width the operator chain requires (product width, etc).
  - rule_cascaded_decrement_priority_order: structural — for a down-counter FSM
    with >=2 chained if/else-if unit checks, flag when the checks are NOT in
    strict low-to-high (or high-to-low, whichever the reset/wrap direction
    requires) priority order.
  - rule_seq_multiplier_width: structural — for a shift-and-add multiply loop
    (accumulator += shifted-multiplicand pattern inside a counted loop), flag
    when accumulator/shifted-operand width < 2*operand-width.
  - rule_variable_partselect_illegal_range: structural — flag any `[<non-const-hi>:<non-const-lo>]`
    part-select (both bounds non-literal, non-parameter-constant) as almost
    certainly meant to be a `+:`/`-:` indexed part-select.
  - rule_booth_shift_before_signext: structural — for a Booth-recoded term
    (0/±X/±2X select) that is arithmetically shifted (`<<<`) by an iteration
    index, flag when the shifted operand is not already declared/cast at full
    product width before the shift.

  Each rule needs: a corpus-sweep verification recipe (run against
  benchmark_external/cvdp/solved_design_db/rtl/*.sv — all 94 designs are
  proven-correct, so the new rule must NOT fire on any of them; this is the
  built-in zero-false-positive regression set) plus a unit test with a PASS
  fixture, the real defect it guards (a deliberately-broken variant), and an
  honest FAIL/SKIP path when the structural precondition isn't recognizable.

  This is Bucket C (large engineering — six new regex/structural detectors each
  needing careful zero-FP tuning + corpus-sweep fixtures), not shipped directly
  in this session: rushing six untested structural lint rules straight into the
  live gate without corpus-sweep verification would risk false positives on
  legitimate passing designs, which the benchmark-enhancement-capture doctrine
  explicitly forbids ("NEVER auto-apply a Bucket A rule that triggers on the
  corpus-sweep set with any false-positives").

acceptance: |
  For each of the six rules:
  1. `python3 rtl_hygiene_lint.py` run across
     `benchmark_external/cvdp/solved_design_db/rtl/*.sv` (94 proven-correct
     designs) produces ZERO new findings from the new rule (zero-FP corpus
     sweep).
  2. A deliberately-broken fixture per pattern (the bug the lesson describes)
     DOES trigger the new rule.
  3. Existing rtl_hygiene_lint unit test suite still passes 100%.

