type: floor-defect
severity: P3
component: benchmark-dataset:RTLLM_v2.0

title: >-
  Five RTLLM v2.0 designs ship a design_description.txt whose stated interface or
  required parameter value contradicts / under-determines the hidden testbench.v
  (port name / missing handshake / missing parameter / positional-order / oracle-only
  default value), making them unrecoverable by any §4.05-blind author.

pattern: |
  A blind Shape-B author may read ONLY design_description.txt (§4.05); the hidden
  testbench.v is the oracle. In four RTLLM v2.0 designs the description's stated
  interface does not match what the testbench instantiates, so an author who
  faithfully implements the DESCRIPTION cannot elaborate against the TB. Confirmed
  in the v1.3.27/28 clean-room blind run (benchmark-data/evaluation/rtllm/run_v1.3.26):

  1. Arithmetic/Divider/radix2_div
     - Description output ports: res_valid, result. NO res_ready mentioned.
     - testbench.v drives an extra handshake INPUT `res_ready`
       -> "port `res_ready` is not a port of uut". The description omits a
       load-bearing input entirely.

  2. Control/Finite State Machine/sequence_detector
     - Description names the reset `reset_n` (and mislabels a state `S4` as an
       output port).
     - testbench.v instantiates `.rst_n(...)` -> "port `rst_n` is not a port of dut".
       reset_n vs rst_n name contradiction.

  3. Arithmetic/Adder/adder_pipe_64bit
     - Description names NO parameters.
     - testbench.v overrides `#(DATA_WIDTH, STG_WIDTH)` -> "parameter DATA_WIDTH
       not found". The module the description specifies has no such parameters.

  4. Memory/Shifter/LFSR
     - Description lists inputs (clk, rst) then output (out[3:0]); it does NOT
       dictate module-header port ORDER.
     - testbench.v instantiates POSITIONALLY, output-first: `LFSR DUT(out_tb,
       clk_tb,rst_tb)`. An author who declares ports in description order
       (clk,rst,out) gets width-mismatched positional binding ("clk expects 1
       got 4", "out expects 4 got 1"). The correct order is oracle-only.

  5. Miscellaneous/Frequency divider/freq_divbyeven  (VALUE defect, not interface)
     - Description: "The `NUM_DIV` parameter specifies the division factor, which
       must be an even number." It states NO default value.
     - testbench.v does NOT override the parameter — it relies on the module's
       DECLARED DEFAULT being exactly 6 (its expected waveform is a divide-by-6).
       A §4.05-blind author cannot know the default is 6 (any even default — 2,
       4, 8 — satisfies the description equally); only the hidden TB's expected
       waveform pins it to 6. Distinct sub-class: the interface elaborates, but
       the required parameter VALUE is oracle-only, so the functional check fails
       regardless of author quality. (The divider STRUCTURE — toggle at
       cnt==NUM_DIV/2-1, reset clk_div to 0 — is fully specified and correct;
       only the default value is under-determined.)

  Impact: each is an UNFIXABLE-BY-CONVENTION blind floor. Preserving the exact
  interface the description states (the correct blind behavior) fails against the
  TB; recovering them requires reading the hidden testbench = peeking at the
  oracle = cheating. They cap RTLLM blind pass@1 independent of author quality.

suggested_fix: |
  Genuine benchmark-dataset defects, NOT Vibe-IC plugin gaps — no chip-agnostic
  RTL-authoring rule can fix a description that names its own interface incorrectly
  relative to its hidden oracle (same class as
  ORGANIC-20260704-cvdp-skid-buffer-prompt-oracle-port-name-contradiction).
  Vibe-IC-side options:
  1. Waiver: the RTLLM scorer (score_rtllm.py) should recognize these four known
     defect ids and exclude them from "recoverable via plugin fix" framing, so they
     are never counted against blind-authoring quality.
  2. Upstream: report to the RTLLM maintainers (hkust-zhiyao/RTLLM) that these four
     designs' design_description.txt interfaces disagree with their own testbench.v.
     This repo has no direct upstream filing access; this entry is the durable record.
  NOTE the partial-recovery nuance for LFSR: IF a future run adopts the RTLLM
  "output-first positional instantiation" convention as an explicit thin-ADAPTER
  rule (benchmark-IO-only, not a general core rule), LFSR alone could be recovered —
  but that convention is not universal across RTLLM (most TBs use named binding), so
  it is recorded here as a defect rather than silently generalized.

acceptance: |
  No plugin code change is required to close this. Acceptance is: (a) this entry
  exists as the durable record; (b) any future RTLLM blind campaign that includes
  radix2_div / sequence_detector / adder_pipe_64bit / LFSR / freq_divbyeven
  references this entry rather than re-diagnosing the same elaboration/value
  errors as fresh plugin gaps.

