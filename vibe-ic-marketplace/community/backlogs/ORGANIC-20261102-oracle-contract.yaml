  # Bind arithmetic reference generation to complete affirmative source expressions and current schema

  ## General gap

  A reference generator must consume the complete supported expression and exact operand/result widths from the authoritative source. Matching an executable prefix, a prohibited example or a formula contradicted by unexplained residual narrative can produce a confident but unauthorized oracle. Its professional consumer must use the producer's current operand/result schema and explicitly supported combinational timing without inventing a clock.

  This groups PLUGIN-003, PLUGIN-004, PLUGIN-010 and RESUMED-003. PLUGIN-010's original open polarity finding is followed by RESUMED-003's locally accepted bounded authority repair, not silently discarded.

  ## Neutral minimal reproduction

  Use a new small combinational arithmetic specification with unequal operand/result widths and a complete supported expression. Compare a positive expression, the same expression in a prohibition, an incomplete expression followed by more syntax, and an affirmative expression followed by a functional caveat. Only the supported complete affirmative arm may supply an oracle. Unknown narrative or mixed unsupported semantics must defer. Exercise the ordinary professional hook on a clockless combinational interface and check the actual operand/result fields and observation timing.

  ## Current owner and retained evidence

  - Existing owners: `programs/arith_oracle_tb_gen.py`, `programs/professional_tb_gen.py`, `programs/design_one_shot_runner.py`.
  - The local helper `programs/_source_expression.py` does not exist on the filing base. This is a proposed scoped integration into existing owners.
  - Local candidates `a9d69671ff5a209c6e429c0f306270d88d2a9064` and `d35dc86317df4e75d93629bd72b7d4f59a67aad2` contain the earlier expression/schema work. The capture records two ordinary professional native hooks passing; an in-image suite had 20 passed and 19 NOT_VERIFIED, not complete qualification.
  - Later residual-authority candidates `ab67e67c5cd885942b7f010182bf1170ae31e428`, `424830f219a9ec31d0b71382a37614a88bd39005`, `06a9d519aba744e4dff799fb4487e44e653b3cbb` have bounded independent acceptance. Their AST/evaluation/signed-width domain did not expand. The broader host run stopped after 115 passes and was not a complete suite.
  - Merged #3771 already consumes current professional execution evidence. Preserve that implementation; it does not establish source-expression authority or broaden supported arithmetic semantics.
  - Mixed-signedness remains UNVERIFIED pending a precise source/language contract and native reference; no EDA engine defect is asserted.

  ## 驗收

  Test the complete AST, exact declared widths, output truncation according to the supported contract, positive authority, record boundaries and residual narrative refusal. Retain positive formal/prose controls and substantive wrong-function mutants. Exercise the existing professional consumer against the producer's real schema, including a clockless positive case. Do not infer functional completeness from a summary or from merely launching a native runner.

  After porting focused fixtures, run from repository root:

  ```bash
  cd vibe-ic-marketplace/plugins/vibe-ic
  python3 -m pytest -q programs/tests/test_source_bound_combinational_oracle.py programs/tests/test_source_expression_authority.py
  ```

  The new suites are implementation deliverables, absent on the filing base. Native receipt completeness belongs to the related verification-owner lifecycle enhancement rather than a second oracle-only acceptance path.

  ## Evidence and submission boundary

  This is a general enhancement backlog, not a benchmark result. Filing source: plugin 1.35.51, main `95a3be2b31bb3fe17c0e5bdbf3f654be020ee078`. The owning source presence and related public submissions were inspected at this snapshot. The behavioral findings below come from retained local capture metadata; the complete implementation has not been ported or freshly reproduced on this upstream snapshot. No benchmark solution, official reference, private transcript, or local machine path is included.

  Local candidate implementation and focused acceptance are distinct from upstream delivery. No new native run, full-suite result, source-semantic approval, or benchmark PASS is claimed by filing this issue. The commands under acceptance are implementation deliverables, not filing-time execution claims. Any named new test module must be added before its command can supply evidence; missing-module errors do not count as negative controls.
