component: program:vibe_ic_one_shot_runner
title: Check typed document producer freshness before selecting pending expert-answer retry
pattern: A pending expert answer is found beside a usable historical extraction summary and existing
  generated documents. The early retry branch selects expert_second_pass before checking document producer
  freshness, so the answer can be consumed while a changed typed source/control set requires document
  regeneration.
suggested_fix: For typed source admission with available design input and a usable historical first
  pass, consult the existing freshness assessor before pending-answer retry. REFUSE must preserve the
  existing refusal decision. REGENERATE plus historical PASS or PASS_WITH_WAIVERS must select document
  extraction. Keep known first-pass failures diagnostic, preserve current/checkpoint revalidation behavior,
  explicit skip controls, and absent-manifest legacy routing. Do not infer end-to-end halted-flow behavior
  from the decision alone.
