title: >-
  A macro obstruction believed to be respected was still being crossed by 45 supply segments

pattern: |
  A value that is populated, formatted like a measurement, and is not one.
  The reader cannot tell it from a measured field, and the error is silent.

suggested_fix: |
  Measure obstruction compliance from the routed geometry against the vendor abstract, not from the flow's declaration that it is honouring the abstract. Then decide, per design, which shipped metal-stack variant of the macro admits a legal power connection; if none does, that is a publishable finding and moves the problem to the vendor rather than to the router. Two portable reproduction scripts ship with public-PDK material and run standalone.

