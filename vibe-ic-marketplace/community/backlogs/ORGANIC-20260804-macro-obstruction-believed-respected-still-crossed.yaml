plugin_version: "1.9.78"

title: >-
  A macro obstruction believed to be respected was still being crossed by 45 supply segments

pattern: |
  A flow's declaration that it APPLIED a constraint is accepted as evidence that the
  constraint HOLDS in what the flow produced, so compliance is never measured against the
  produced geometry. Every later conclusion that assumes the constrained state then
  describes a state that was never reached. The damage is worst when the conclusion is a
  trade-off — "honouring this constraint costs us X" reads exactly the same whether the
  constraint was honoured or ignored, so an unapplied constraint yields a finding that
  looks substantive, survives review, and argues for relaxing a rule that was never
  actually tried. The check must consume the output artefact, never the flow's own
  report of its intent.

suggested_fix: |
  Measure obstruction compliance from the routed geometry against the vendor abstract, not from the flow's declaration that it is honouring the abstract. Then decide, per design, which shipped metal-stack variant of the macro admits a legal power connection; if none does, that is a publishable finding and moves the problem to the vendor rather than to the router. Two portable reproduction scripts ship with public-PDK material and run standalone.

id: "ORGANIC-20260804-macro-obstruction-believed-respected-still-crossed"
submitted_at: "2026-08-04T22:50:25+08:00"
session_context: >-
  2026-08-04. An earlier round concluded that respecting the obstruction disconnects the supply; the following round loaded the correct abstract and measured that the obstruction was still not being respected at all, so the earlier conclusion rested on a state that had not been reached. The later round also withdrew four of its own measurements before publishing, two of which were parser artefacts that would otherwise have corroborated a wrong conclusion.
