session_context: >-
  2026-08-04. An earlier round concluded that respecting the obstruction disconnects the supply; the following round loaded the correct abstract and measured that the obstruction was still not being respected at all, so the earlier conclusion rested on a state that had not been reached. The later round also withdrew four of its own measurements before publishing, two of which were parser artefacts that would otherwise have corroborated a wrong conclusion.
