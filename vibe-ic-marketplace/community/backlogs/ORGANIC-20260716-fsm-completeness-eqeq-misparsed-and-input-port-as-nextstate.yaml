type: bug
severity: P2
component: program:fsm_transition_completeness_check
plugin_version: "1.4.27"
title: >-
  fsm_transition_completeness_check false-BLOCKs a correct REGISTERED FSM: an
  `==` comparison is misparsed as an `=` assignment and its RHS scan crosses into
  the following `state <= STATE;`, sweeping a state constant onto an INPUT PORT
  (`dot_length_in`), which then ties with the real `state` var and — on the
  order-dependent max() tie-break — is picked as the next-state variable → false
  `fsm-inferred-latch`. Distinct from #138 (which swept PARAMETERS, not ports).
pattern: |
  check_text() votes for the next-state variable with
    re.findall(r"\b([A-Za-z_]\w*)\s*(?:<=|=)\s*([^;]+);", arm_body)
  crediting an LHS whose RHS text (scanned to the next `;`) contains a state value.

  THREE compounding defects turn a correct registered FSM into a false latch:

  1. `==` MISPARSED AS `=`. The `(?:<=|=)` alternation's `=` branch matches the
     FIRST `=` of a `==` comparison. So `if (dot_length_in == 8'd0)` is read as an
     assignment `dot_length_in = ...`.

  2. RHS SCAN CROSSES THE STATEMENT. An `if (COND)` header carries no terminating
     `;`, so `[^;]+;` runs from the bogus `=` straight through the guarded body to
     the first real `;`:
         if (dot_length_in == 8'd0)
             state <= OUTPUT;          // <- this ';' ends the bogus RHS
     The RHS text now contains the state constant `OUTPUT`, so the compared
     identifier `dot_length_in` is credited with a next-state vote.

  3. INPUT PORT AS NEXT-STATE VAR + ORDER-DEPENDENT TIE. `dot_length_in` is a
     module INPUT (`input [7:0] dot_length_in`) — it is NEVER assigned and can
     never be a next-state register. It ties the real `state` var 1-1 in the vote,
     and `max(counts, key=counts.get)` returns the FIRST-inserted key on a tie —
     the input port. next_var is mis-identified, and every arm that does not assign
     `dot_length_in` (all of them) is reported `fsm-inferred-latch`.

  SECONDARY (robustness): the inferred-latch rule does not distinguish a REGISTERED
  next-state block (`always @(posedge clk) ... state <= ...`) from a COMBINATIONAL
  one (`always @*`). In a registered FSM an arm that does not assign the state reg
  HOLDS it (a correct self-loop), which is not a latch; the rule is only sound for
  combinational next-state logic. (Not the trigger here — dot_product's COMPUTE arm
  does assign `state` — but it widens the false-positive surface.)

  Reproduced on CVDP cvdp_copilot_dot_product_0005 (a correct registered FSM
  IDLE/COMPUTE/OUTPUT/ERROR): gate emitted
  `fsm-completeness FAIL: fsm-inferred-latch(COMPUTE)` naming the INPUT PORT
  `dot_length_in` as the latched signal. Instrumented vote: counts={'dot_length_in':1,'state':1}, tie → max() picked 'dot_length_in'.
repro: |
  python3 -c "import fsm_transition_completeness_check as f; \
    print(f.check_text(open('cvdp_copilot_dot_product_0005.sv').read()))"
  # -> Finding(rule='fsm-inferred-latch', state='COMPUTE',
  #            detail=\"...'dot_length_in' latches...\")
  # Minimal shape: a state arm containing
  #   if (<input_or_any_ident> == <const>) <state_var> <= <STATE>;
  # where the compared ident is not the state var.

suggested_fix: |
  Any ONE of these kills the reported case; do 1+2 for defense in depth:
    1. Do NOT match `==`/`!=`/`>=`/`<=`-as-comparison as an assignment. Anchor the
       assignment scan so the operator is a real blocking `=` (not preceded by
       `< > = !`, not followed by `=`) or a nonblocking `<=` at a statement start,
       and stop the RHS at the first `)` / `begin` / statement break, not only `;`.
    2. Exclude declared module INPUT PORTS (and any signal never assigned as a bare
       LHS statement) from next_var candidates — an input can never be a next-state
       register.
    3. On a vote tie, prefer the case SELECTOR identifier (here `state`), which is
       by construction the FSM state variable.
    4. (robustness) Gate the inferred-latch rule to COMBINATIONAL next-state blocks
       (`always @*` / `always_comb`); in a clocked `always @(posedge clk)` block a
       non-assigning arm is a legal hold, not a latch.

  Regression test: the dot_product_0005 shape (registered FSM whose IDLE arm holds
  `if (in_port == 0) state <= OUTPUT; else state <= COMPUTE;`) must return
  ([], 'CHECKED'); a genuine combinational inferred latch must STILL be flagged
  (no-leak, as with #138).

integrity_note: |
  Surfaced by the v1.4.27 CVDP hard-100 converge clean-run (blind, §4.05). NOT
  hand-patched into the plugin (NO-MIX). The blocked draft was unblocked WITHOUT
  weakening the gate — the `dot_length_in == 8'd0` compare was hoisted to a module
  level `wire dot_length_is_zero = (dot_length_in == 8'd0);` (behavior-identical,
  moves the `==` out of the FSM arm) — so the published number never depended on a
  gate change. Related: ORGANIC-20260714-fsm-completeness-params-swept-as-states-false-latch (#138).

