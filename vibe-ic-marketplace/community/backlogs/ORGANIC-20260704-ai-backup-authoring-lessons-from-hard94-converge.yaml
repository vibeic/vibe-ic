pattern: |
  Each lesson recovered >=1 problem at the official oracle across rounds 3-8:
  1. STICKY STATUS FLAGS: error/ready flags observed by bus checkers must be
     REGISTERED and HELD after the transaction ends (sampled 1 clock after
     deassert) — pslverr/pready/error_out (apb_dsp_op, apb_history, dot_product).
  2. WHITEBOX DELIVERABLE: hidden harnesses read internals hierarchically —
     deliver ONE FLAT module under the real name; keep context-RTL internal
     signal names; never wrapper-nest the logic (14 fails implicated).
  3. ACK HOLDOFF: after an ack/handshake completes, deassert the request/valid
     output for >=1 full clock before re-asserting for the next item.
  4. PER-RUN RE-INIT: iterative/training designs must re-zero accumulators and
     state at EVERY run start (back-to-back runs without reset), not only at rst
     (hebbian_0017).
  5. RELEASE AT CAPTURE EDGE: block/active flags drop when the FINAL item is
     CAPTURED, not after downstream drain completes (fifo_to_axis).
  6. RESUME AFTER EXCEPTION: exception states (overload/fault) must LATCH the
     interrupted operation and RESUME it on recovery — "return to IDLE" prose
     still implies completing the pre-empted cycle (elevator_control).

