title: >-
  FLOOR-RECORD class for the triage rubric: the hidden harness's golden
  CONTRADICTS the GIVEN input.context — no spec-faithful completion can pass
  (hebbian_rule_0012: harness pins gate_select 2'b10=NAND / 2'b11=NOR while the
  PROVIDED gate_target module states the opposite mapping and the prose never
  mentions NAND/NOR)

pattern: |
  Terminal floor-proof (round 8, cross-round evidence table + own-TB replay):
  the hebbian_rule_0012 oracle trains/tests four gates with targets that require
  gate_select 2'b10=NAND (w=-2,-2,+2) and 2'b11=NOR (w=-2,-2,-2). The ONLY
  legal inputs — design_description.md + the given gate_target — define 2'b10/
  2'b11 as OR/AND duplicates and never mention NAND/NOR. A completion faithful
  to the given context necessarily fails; one matching the oracle necessarily
  contradicts the given RTL. This is a distinct FLOOR class: harness-vs-context
  CONTRADICTION (vs mere under-specification). Related same-run floors, cited
  with evidence in the run RESULT.md: interrupt_controller_0017 (TB pins a
  cycle-exact valid/ack protocol absent from spec), interrupt_controller_0014
  (TB ack-sampling race — an oracle-informed fix from the floor-proof round
  itself still fails).

suggested_fix: |
  (1) Add "harness-contradicts-given-context" as an explicit category in the
  open-benchmark-methodology triage rubric (§4) — it is the strongest floor
  evidence (provable from legal inputs alone) and should terminate convergence
  attempts immediately when detected, saving rounds.
  (2) The floor evidence protocol worked: cross-round expected-vs-got table +
  replaying the observed stimulus with the author's own TB. Encode that protocol
  as the rubric's floor-proof standard.

