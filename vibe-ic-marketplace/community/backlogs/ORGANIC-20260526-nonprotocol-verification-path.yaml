type: enhancement
severity: P0
component: program:phase2_one_shot_runner
plugin_version: "0.1.2"

title: >-
  Phase-2 runner needs a non-protocol verification path; CPU /
  arithmetic-primitive / datapath ICs must not be force-gated through
  the half-duplex AID reference testbench + USB-HID connect_test

pattern: |
  step_reference_tb unconditionally compiles the design under the
  half-duplex AID-class protocol reference testbench
  (tools/protocol_tb/aid_class_reference_tb.v), which instantiates the
  DUT expecting cable-side protocol ports (reset_n, id_bus, ...). For
  any IC that is NOT a half-duplex single-wire protocol IP — e.g. a
  RISC-V CPU core, a multiplier, a hash core, a filter, any
  digital_arithmetic_primitive / datapath / SoC class — the DUT port
  list (clk, i_rst, o_dbus_*, wishbone, AXI, ...) does not match the
  protocol TB, so iverilog fails with "port 'reset_n' is not a port of
  u_dut". The ECO loop then retries 3x against the same impossible
  gate and the run halts FAIL at phase2 even though the RTL is correct
  and synthesizes cleanly. Likewise the host-side USB-HID connect_test
  gate (the protocol tester's accept byte) is meaningless for these
  classes. There is no class-config flag or waiver path to substitute
  the generic L9.top_ports full-stack TB for the AID protocol TB, so
  whole IC families cannot complete phase2.

suggested_fix: |
  Add a protocol-class gate in step_reference_tb: when the IC class
  (or an L9 / class-config flag such as protocol_class == none /
  has_half_duplex_bus == false) indicates the design is not a
  half-duplex protocol IP, SKIP the AID reference TB and instead run
  the generic full-stack TB (step_full_stack_tb_gen output, driven
  from L9.top_ports) as the functional gate. Apply the same class
  predicate to usb_hid_tester_verify so non-protocol classes are not
  gated on a USB-HID connect_test. The ic_class_registry entry for
  digital_arithmetic_primitive (and any future cpu/soc class) should
  carry verification_track: generic_full_stack rather than
  aid_protocol.

id: "ORGANIC-20260526-nonprotocol-verification-path"
submitted_at: "2026-05-26T03:15:00+08:00"
status: resolved
resolved_at: "2026-06-05"
resolution: >-
  Re-verified against the current 0.2.42 plugin: the suggested fix is
  fully implemented. programs/ic_class_registry.json now carries a
  verification_track field per class (digital_arithmetic_primitive,
  processor_cpu and siblings = generic_full_stack; half-duplex protocol
  classes = aid_protocol). programs/phase2_one_shot_runner.py routes on
  it via _class_uses_aid_reference_tb (:1889) — any class whose
  verification_track != aid_protocol (or half_duplex_bus == false) SKIPs
  the protocol reference TB and runs the generic full-stack TB instead
  (_reference_tb_generic_full_stack, :1539), with the same class
  predicate applied to the host-tester connect_test gate. Reproduced the
  original scenario: _class_uses_aid_reference_tb returns use_aid=False
  for digital_arithmetic_primitive and processor_cpu, so CPU/datapath
  ICs no longer halt FAIL on an impossible protocol-TB port bind.
  Regression coverage: programs/tests/test_phase2_class_aware_gating.py
  — 57/57 PASS (combined with the memmap file) on 2026-06-05.
session_context: >-
  Fresh field-agent Vibe-IC run on a bit-serial RV32I CPU benchmark.
  Catalog-glue-author pulled the open-source core RTL and AI-authored a
  synthesizable chip-top wrapper (yosys: 105713 cells, iverilog parse
  clean). Phase 2 still halted FAIL because step_reference_tb forced
  the CPU through the half-duplex AID protocol testbench, which cannot
  bind a CPU port list. No waiver / class bypass exists.
