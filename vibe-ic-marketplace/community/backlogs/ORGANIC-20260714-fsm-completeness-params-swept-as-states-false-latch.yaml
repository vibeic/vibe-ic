type: bug
severity: P2
component: program:fsm_transition_completeness_check
plugin_version: "1.4.14"
title: >-
  fsm_transition_completeness_check false-BLOCKs a correct FSM when a module
  PARAMETER used as a loop bound / bit-width (N, WIDTH) is swept into the
  "declared states" set — a data loop-index is then mis-identified as the
  next-state variable and reported as an inferred latch
pattern: |
  cvdp_gate.py runs fsm_transition_completeness_check as a structural gate.
  check_text() builds the state set from parse_states(body), then picks the
  next-state variable as the LHS most-often assigned a "declared state" on its
  RHS across the case arms.

  BUG: parse_states() returns not just the case-item FSM constants but ALSO
  module parameters (e.g. `parameter N`, `parameter WIDTH`). When a state arm
  contains a data loop such as:

      for (k = 0; k < N; k = k + 1)
          arr[k] <= in_data[k*WIDTH +: WIDTH];

  the assignment `k = k + 1` has RHS text (scanned to the next `;`) that
  contains `WIDTH`, which is (wrongly) in the state set. So the loop index `k`
  is credited as a "next-state assignment" and TIES with the real `state`
  variable (both count 2). `max()` on the tie picks `k`, the next-state var is
  mis-identified, and every arm that does not assign `k` is reported as
  `fsm-inferred-latch` — a FALSE POSITIVE that BLOCKS a correct design.

  Reproduced on CVDP cvdp_copilot_sorter_0001 (a correct bubble-sort FSM,
  IDLE/SORTING/DONE): gate emitted
  `fsm-completeness FAIL: fsm-inferred-latch(SORTING)` with detail naming `k`
  (the loop index) as the latched signal. Instrumented parse_states returned
  {IDLE, SORTING, DONE, N, WIDTH}.

repro: |
  python3 -c "import fsm_transition_completeness_check as f; \
    print(f.check_text(open('cvdp_copilot_sorter_0001.sv').read()))"
  # -> Finding(rule='fsm-inferred-latch', state='SORTING', detail=\"...'k' latches...\")
  # A module with params N, WIDTH and a `for(k=0;k<N;k=k+1) x[k]<=y[k*WIDTH+:WIDTH]`
  # load loop inside a state arm triggers it.

suggested_fix: |
  Restrict the state set used by the next-state-var pick + latch scan to the
  case-item labels that are declared constants (the check's OWN docstring already
  states this intent: "NOT every UPPER_SNAKE constant ... which falsely swept in
  register addresses, bit indices and config widths"). Concretely: key the arm-body
  variable-count off `item_states` (the case-item state constants), NOT the broader
  `declared` set from parse_states(). Equivalently: exclude any declared name that
  never appears as a case-item label (parameters used as loop bounds/widths must
  not be treated as states).

  Regression test: the sorter_0001 shape (FSM + `for(k=0;k<N;...) arr[k]<=in[k*WIDTH+:WIDTH]`
  load loop) must return ([], 'CHECKED').

integrity_note: |
  Surfaced by the v1.4.14 CVDP clean-run (blind, §4.05). NOT hand-patched into the
  plugin during the run (NO-MIX). The blocked draft was unblocked WITHOUT weakening
  the gate — rewritten to a flat packed-array load (behavior-identical, no k loop) —
  so the published number never depended on a gate change.

github_issue: https://github.com/vibeic/vibe-ic/issues/138
