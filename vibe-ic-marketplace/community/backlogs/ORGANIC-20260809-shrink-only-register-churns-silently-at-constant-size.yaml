type: bug
severity: P2
component: program:flow_gate_enforcement_audit
plugin_version: "1.10.11"

title: >-
  The shrink-only registers ratchet on SIZE, not on membership, so 40 new entries enter
  with no reason recorded whenever 40 are paid down in the same write

pattern: |
  A debt register that "may only shrink" is enforced by comparing the count of the new set
  against the count of the old one. Count is not membership. Any write that removes as
  many entries as it adds passes the guard, so the register admits unlimited NEW debt at
  constant size, records nothing about it, and keeps a comment asserting it can only
  shrink. The bypass is not exotic - it is the normal workflow: the READ path is what
  fails and tells the developer to re-baseline, and the WRITE path they then run is the
  one that does not check membership. The guard is therefore weakest at the exact moment
  it is consulted. Any ratchet must diff the SETS and require a stated reason for each new
  member, independently of whether other members were paid down; and the escape hatch's
  "reason" must be checked for content, not length, or it degrades to a required
  keystroke count.

suggested_fix: |
  Compute `widened` from set difference, not `len`: a write is a widening if
  `set(now) - set(prev)` is non-empty, regardless of what left the register. Report the
  new members by name in the refusal, the way the read path already does, so the reason
  the author must supply is about specific entries rather than about a number. Consider
  requiring the reason to name at least one of the new entries (substring match against
  the added gate names), which is checkable and cannot be satisfied by padding; the
  present `len(reason.strip()) >= 30` test accepts 34 repetitions of a single character.
  Finally, `previous_size` / `scope_expanded` are written into the baseline but never read
  back by any later run - either read them (e.g. refuse a write whose recorded
  `previous_size` does not match the set actually loaded) or stop writing them, because a
  field nobody consumes reads to a reviewer as a control that exists.

id: "ORGANIC-20260809-shrink-only-register-churns-silently-at-constant-size"
