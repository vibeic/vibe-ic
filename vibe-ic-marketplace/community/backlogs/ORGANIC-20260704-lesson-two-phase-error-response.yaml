type: enhancement
severity: P2
component: skill:ic-expert-agent

title: >-
  AI-BACKUP lesson: user-facing error handling is TWO-PHASE — an error-flag
  cycle followed by a distinct recovery/refund cycle — when a checker samples
  the response at two consecutive points (proven by the round-9 vending recovery
  after 7 failed rounds)

pattern: |
  vending_machine_0001 failed 7 close-loop rounds on invalid-coin handling; every
  attempt asserted error and returned money in ONE state (or held error two
  cycles). The oracle samples TWICE: first expects error=1 (flag phase), next
  expects the refund behavior (return_money=1 with error still coherent). The
  round-9 fix — fork the error flow into two paced states (BADCOIN_1 flag,
  BADCOIN_2 refund mirroring the cancel path) — passed outright. Chip-AGNOSTIC
  pattern: when prose says "on error, signal the error and return the money/
  release the resource", realize it as a two-state sequence (flag, then recover),
  not a combined single-cycle response.

suggested_fix: |
  Append as a "### Skill:" section to agents/ic-expert-agent.md: "Two-phase error
  response — when a spec couples an error indication with a compensating action
  (refund/release/rollback), sequence them as consecutive states: first assert
  the error flag; in the NEXT state perform the compensation (mirroring the
  normal-path cadence, e.g. the cancel/return flow). Checkers commonly sample the
  flag and the compensation at successive points; a merged single-cycle response
  fails the second sample."

evidence:
  run: benchmark_external/cvdp/run_hard94_unified_20260703 (converge9 — vending PASS)
  filed_by: benchmark-agent (round-9 distillation)

resolution:
