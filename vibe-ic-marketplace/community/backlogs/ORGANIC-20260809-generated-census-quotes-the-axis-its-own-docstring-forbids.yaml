type: bug
severity: P1
component: program:gen_matrix_63x8_census
plugin_version: "1.10.11"

title: >-
  The generated census publishes 481 ENFORCED from state_census(), the axis its own
  docstring forbids quoting, and --check prints PASS while the guard test is RED

pattern: |
  Two fixes land the same day. The first splits a published figure into a strict axis and
  a lax one and writes, in the lax axis's docstring, that it must never be quoted. The
  second makes that figure GENERATED - the right structural move - and wires the
  generator to the lax axis, because that is the function whose name matches the number
  the artefact already carried. The artefact is now recomputed on every run, has a
  freshness test, prints PASS, and publishes exactly the number the first fix existed to
  retire. Making a number derived is not the same as making it true: a generator inherits
  the correctness of the source it reads, and "which function do I call" is the load-
  bearing decision, not "do I call one". Whenever a codebase declares one accessor
  authoritative and another unquotable, every renderer of that value must be checked
  against the declaration, and the freshness test must assert the SOURCE, not only that
  the committed text matches whatever the generator produced.

suggested_fix: |
  Point `census_rows()` at `enforcement_census()` / `enforcement_counter()` instead of
  `state_census()`, and render `ENFORCED-CONTRADICTED` as its own published column beside
  ENFORCED / WAIVED / NA so the four add to the cell total. Keep the substitution split,
  but compute it over cells whose predicate is actually green, otherwise a bucket is
  published for cells that are red. Second, make the freshness test assert WHICH accessor
  was read - a test that only diffs the rendered block against the committed one cannot
  distinguish a correct source from a plausible one, which is how this passed review.
  Third, `--check` must not print `[PASS]` while
  `test_no_cell_is_counted_enforced_while_its_predicate_is_red` is failing: a generator
  whose subject is a red suite should refuse, or state the contradiction count in its own
  PASS line, the way `--check` already refuses NOTHING_SCANNED.

