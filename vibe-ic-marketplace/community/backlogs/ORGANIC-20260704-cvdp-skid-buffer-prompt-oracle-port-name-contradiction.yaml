type: floor-defect
severity: P3
component: benchmark-dataset:cvdp_v1.1.0_nonagentic_code_generation_no_commercial

title: >-
  cvdp_copilot_skid_buffer_0001's prompt template names the top-level ports
  data_i/valid_i, but the hidden testbench and golden reference RTL both use
  i_data/i_valid — the prompt contradicts its own oracle

pattern: |
  The shipped prompt for cvdp_copilot_skid_buffer_0001 gives an explicit
  Verilog template to complete:

    module pipelined_skid_buffer(
        input wire clock,
        input wire rst,
        input wire [3:0] data_i,
        input wire valid_i,
        output wire ready_o,
        output wire valid_o,
        output wire [3:0] data_o,
        input wire ready_i
        );

  But the hidden cocotb testbench (src/test_pipelined_skid_buffer.py) drives
  `dut.i_data` / `dut.i_valid` — NOT `dut.data_i` / `dut.valid_i` as the
  template names them. The golden reference RTL (confirmed against
  benchmark_external/cvdp/solved_design_db/rtl/cvdp_copilot_skid_buffer_0001.sv)
  independently uses `i_data`/`i_valid` too, confirming the TEMPLATE (not the
  test or the golden answer) is the one that's wrong.

  Impact: a blind author who faithfully preserves the prompt's own given
  top-level port names (the correct, expected behavior — "preserve the exact
  interface a fixed testbench expects") gets an unfixable
  `AttributeError: pipelined_skid_buffer contains no child object named i_data`
  at simulation time. This cannot be recovered by any RTL-authoring skill or
  convention — the port name mismatch is baked into the prompt itself, before
  any author sees it.

  Confirmed independently in TWO separate sampled blind-authoring runs this
  session (both condition A and condition B of the ic-expert-agent 46-lesson
  A/B verification hit the identical AttributeError on this exact port name).

suggested_fix: |
  This is a genuine benchmark-dataset defect, not a Vibe-IC plugin gap — no
  chip-agnostic RTL-authoring rule can fix a prompt that names its own
  interface incorrectly relative to its hidden oracle. Two options for the
  Vibe-IC side:
  1. Waiver: cvdp_gate / benchmark harness should recognize this specific
     known-floor id and exclude it from "recoverable via plugin fix" framing
     in future CVDP campaign scoring (it should never be counted against
     blind-authoring quality).
  2. Upstream: report to the CVDP dataset maintainers (NVIDIA) that
     cvdp_copilot_skid_buffer_0001's prompt template port names
     (data_i/valid_i) don't match its own test harness / golden reference
     (i_data/i_valid) — this repo has no direct upstream issue-filing access,
     so this backlog entry is the durable record until someone with repo
     access files it externally.

acceptance: |
  No plugin code change required to close this — acceptance is: (a) this
  backlog entry exists as the durable record, (b) any future CVDP full-dataset
  blind-authoring campaign that includes cvdp_copilot_skid_buffer_0001 should
  reference this entry rather than re-diagnosing the same AttributeError as a
  fresh plugin gap.

