# Testability level (v0.50 hybrid strategy — see _shared/TESTING_STRATEGY.md)
testability: structured

# Auto-generated compliance spec for skill 'yield-diagnostic'
# Refines vibe-ic/skills/yield-diagnostic/SKILL.md output requirements.
skill: yield-diagnostic

requirements:
  - id: R_has_output_section
    description: "Output format/schema section present"
    pattern: '(##\s+(?:Output|Findings|Result|Report))'
    skill_section: 'Output/Handoff'
  - id: R_next_step
    description: "At least one 'Next:' handoff line"
    pattern: 'Next:\s*(?:run\s+)?/\w'
    skill_section: 'Output/Handoff'
  - id: R_status_or_summary
    description: "Has a Summary or STATUS block"
    pattern: '(##\s+Summary|\*\*STATUS\*\*:)'
    skill_section: 'Output/Handoff'
  - id: R_yield_analysis
    description: "Yield analysis results"
    pattern: '(yield|defect|fail.*map|wafer|systematic|random|ATE)'
    skill_section: 'Yield'

cross_checks:
  - id: X_text_only_skill
    description: "Pure analysis/planning skill — no verifiable artifact. Compliance via regex only."
    rule: text_only_report
