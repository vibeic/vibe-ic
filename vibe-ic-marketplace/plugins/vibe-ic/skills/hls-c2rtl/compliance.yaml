    description: "Has a Summary or STATUS block"
    pattern: '(##\s+Summary|\*\*STATUS\*\*:)'
    skill_section: 'Output/Handoff'
  - id: R_hls_output
    description: "HLS output RTL generated"
    pattern: '(generated.*RTL|output.*verilog|synthesized|HLS.*result)'
    skill_section: 'Output'

