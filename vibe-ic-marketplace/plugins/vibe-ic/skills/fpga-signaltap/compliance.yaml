# Testability level (v0.50 hybrid strategy — see _shared/TESTING_STRATEGY.md)
testability: structured

# Auto-generated compliance spec for skill 'fpga-signaltap'
# Refines vibe-ic/skills/fpga-signaltap/SKILL.md output requirements.
skill: fpga-signaltap

requirements:
  - id: R_next_step
    description: "At least one 'Next:' handoff line"
    pattern: 'Next:\s*(?:run\s+)?/\w'
    skill_section: 'Output/Handoff'
  - id: R_status_or_summary
    description: "Has a Summary or STATUS block"
    pattern: '(##\s+Summary|\*\*STATUS\*\*:)'
    skill_section: 'Output/Handoff'
  - id: R_probe_signals
    description: "Probe signal list defined"
    pattern: '(probe|signal.*tap|trigger|capture|sample.*depth)'
    skill_section: 'Probes'

cross_checks:
  - id: X_output_artifact_check
    description: "Verify SignalTap configuration output exists"
    rule: postcheck_pass_only
