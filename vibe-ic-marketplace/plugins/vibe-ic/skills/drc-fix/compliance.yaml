# Testability level (v0.50 hybrid strategy — see _shared/TESTING_STRATEGY.md)
testability: structured

# #2050. output_type MEASURED, not assumed. This skill's declared deliverable
# is a Markdown `# DRC fix plan` — `drc_fix_planner.py --out-md` output plus
# judgment sections. A document cannot carry the RTL `// Post-checks:` header
# that `postcheck_pass_only` looks for: it can only be TYPED into one, never
# measured on it. No SKILL.md in this plugin documents emitting that header
# (zero of 70, measured), and this skill's own required patterns are Markdown
# headings. The cross-checks below are therefore bound to their auditors' own
# receipts, exactly as #2048 did for rtl-review.
output_type: report

# Compliance spec for skill 'drc-fix' (v0.40)
# Enhanced: must categorize violations, provide fix strategies, and report counts
skill: drc-fix

requirements:
  - id: R_has_output_section
    description: "Output format/schema section present"
    pattern: '(##\s+(?:Output|Findings|Result|Report))'
    skill_section: 'Output/Handoff'
  - id: R_next_step
    description: "At least one 'Next:' handoff line"
    pattern: 'Next:\s*(?:run\s+)?/\w'
    skill_section: 'Output/Handoff'
  - id: R_status_or_summary
    description: "Has a Summary or STATUS block"
    pattern: '(##\s+Summary|\*\*STATUS\*\*:)'
    skill_section: 'Output/Handoff'
  - id: R_violation_categories
    description: "DRC violations grouped by rule family (spacing, width, density, antenna, etc.)"
    pattern: '(spacing|width|density|antenna|enclosure|via.*rule|metal.*rule|min.*area)'
    skill_section: 'Violation Classification'
  - id: R_fix_strategy
    description: "Each violation category has a fix strategy (move, widen, add fill, add diode, etc.)"
    pattern: '(fix.*strat|root.*cause|fix.*order|fix.*plan|remediat|widen|add.*fill|add.*diode)'
    skill_section: 'Fix Plan'
  - id: R_violation_count
    description: "Reports total violation count and per-rule breakdown"
    pattern: '(violation.*\d+|\d+.*violation|total.*\d+|count|DRC.*clean|0.*violation)'
    skill_section: 'Violation Count'

cross_checks:
  - id: X_gds_size_check
    description: "Verify GDS exists before DRC"
    rule: audit_receipt_evidence
    auditor: gds_size_check
  - id: X_mcp_execution_verify
    description: "Verify required MCP tools were actually executed (not just reported)"
    rule: audit_receipt_evidence
    auditor: mcp_execution_verify
  - id: X_drc_report_check
    description: "Verify DRC report has violation categories and counts"
    rule: audit_receipt_evidence
    auditor: drc_report_check
  # The other half of the output_type pairing (#2048). Repointing the audits
  # above removes the reason to paste the RTL header; this keeps pasting one a
  # failure, so a fabricated `// Post-checks:` line in this report cannot pass
  # unremarked now that nothing else reacts to it.
  - id: X_text_only_skill
    description: "drc-fix emits a report document, not RTL."
    rule: text_only_report
