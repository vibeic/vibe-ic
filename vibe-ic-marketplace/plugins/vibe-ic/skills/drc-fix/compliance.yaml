# Testability level (v0.50 hybrid strategy — see _shared/TESTING_STRATEGY.md)
testability: structured

# Review the native engineering results described in SKILL.md.
# Read the selected GDS using the native layout tool and run the applicable PDK deck.
# Use native violation locations, rule families and counts to classify and verify each fix.
output_type: report

# Compliance spec for skill 'drc-fix' (v0.40)
# Enhanced: must categorize violations, provide fix strategies, and report counts
skill: drc-fix

requirements:
  - id: R_has_output_section
    description: "Output format/schema section present"
    pattern: '(##\s+(?:Output|Findings|Result|Report))'
    skill_section: 'Output/Handoff'
  - id: R_next_step
    description: "At least one 'Next:' handoff line"
    pattern: 'Next:\s*(?:run\s+)?/\w'
    skill_section: 'Output/Handoff'
  - id: R_status_or_summary
    description: "Has a Summary or STATUS block"
    pattern: '(##\s+Summary|\*\*STATUS\*\*:)'
    skill_section: 'Output/Handoff'
  - id: R_violation_categories
    description: "DRC violations grouped by rule family (spacing, width, density, antenna, etc.)"
    pattern: '(spacing|width|density|antenna|enclosure|via.*rule|metal.*rule|min.*area)'
    skill_section: 'Violation Classification'
  - id: R_fix_strategy
    description: "Each violation category has a fix strategy (move, widen, add fill, add diode, etc.)"
    pattern: '(fix.*strat|root.*cause|fix.*order|fix.*plan|remediat|widen|add.*fill|add.*diode)'
    skill_section: 'Fix Plan'
  - id: R_violation_count
    description: "Reports total violation count and per-rule breakdown"
    pattern: '(violation.*\d+|\d+.*violation|total.*\d+|count|DRC.*clean|0.*violation)'
    skill_section: 'Violation Count'

# Existing native helper: programs/drc_report_check.py; use its actual CLI and report.
cross_checks: []
