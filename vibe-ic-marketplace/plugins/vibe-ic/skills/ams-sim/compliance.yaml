# Testability level (v0.50 hybrid strategy — see _shared/TESTING_STRATEGY.md)
testability: structured

# Compliance spec for skill 'ams-sim' (v0.35)
# Enhanced: mixed-signal ICs require SPICE-level simulation + corner sweep
skill: ams-sim

requirements:
  - id: R_has_output_section
    description: "Output format/schema section present"
    pattern: '(##\s+(?:Output|Findings|Result|Report))'
    skill_section: 'Output/Handoff'
  - id: R_next_step
    description: "At least one 'Next:' handoff line"
    pattern: 'Next:\s*(?:run\s+)?/\w'
    skill_section: 'Output/Handoff'
  - id: R_status_or_summary
    description: "Has a Summary or STATUS block"
    pattern: '(##\s+Summary|\*\*STATUS\*\*:)'
    skill_section: 'Output/Handoff'
  - id: R_spice_simulator
    description: "SPICE simulator specified (HSPICE, ngspice, Spectre, Xyce)"
    pattern: '(HSPICE|ngspice|Spectre|Xyce|SPICE.*sim|spice.*netlist)'
    skill_section: 'Simulation Setup'
  - id: R_corner_sweep
    description: "Corner sweep includes SS/TT/FF (not TT-only)"
    pattern: '(ss.*ff|SS.*FF|corner.*sweep|process.*corner|PVT.*sweep)'
    skill_section: 'Corner Coverage'
  - id: R_mixed_signal_method
    description: "Mixed-signal co-simulation methodology documented"
    pattern: '(mixed.signal|co.simul|analog.*digital|Verilog.A|AMS|real.number)'
    skill_section: 'Methodology'

cross_checks:
  - id: X_eda_log_check
    description: "Verify SPICE simulation log exists with expected results"
    rule: postcheck_pass_only
  - id: X_corner_coverage_audit
    description: "Verify corner sweep includes SS+FF (not TT-only)"
    rule: postcheck_pass_only
