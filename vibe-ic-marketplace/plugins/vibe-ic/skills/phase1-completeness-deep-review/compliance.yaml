# Testability level (v0.50 hybrid strategy — see _shared/TESTING_STRATEGY.md)
testability: structured

# Wave-on-fix v1.6.10 — strong AI completeness double-check.
# Pairs with phase1_doc_input_completeness_check.py.
skill: phase1-completeness-deep-review

requirements:
  - id: R_has_output_section
    description: "Output / completeness report section present"
    pattern: '(##\s+(?:Output|Findings|Verdict|Report|Review))'
    skill_section: 'Output/Handoff'
  - id: R_next_step
    description: "At least one 'Next:' handoff line"
    pattern: 'Next:\s*(?:run\s+)?/\w'
    skill_section: 'Output/Handoff'
  - id: R_status_or_summary
    description: "Has a Verdict / Summary / STATUS block"
    pattern: '(\*\*Verdict\*\*|##\s+Summary|\*\*STATUS\*\*:)'
    skill_section: 'Output/Handoff'
  - id: R_layer_check
    description: "Mentions L-layer (L1..L13) presence / coverage"
    pattern: '(L1|L2|L3|L4|L5|L6|L7|L8|L9|L10|L11|L12|L13|layer)'
    skill_section: 'Layer Coverage'
  - id: R_ai_patch_marker
    description: "Output records ai_deep_review_patch strategy marker"
    pattern: 'ai_deep_review_patch'
    skill_section: 'AI patches applied'

cross_checks:
  - id: X_text_only_skill
    description: "Phase 1 strong AI completeness double-check report skill."
    rule: text_only_report
  # v1.6.53 — surface volatile-storage path leaks in skill output before
  # they reach project_outputs_in_tree_check at burn time.
  - id: X_no_volatile_paths
    description: >-
      Deep-review report must not reference /tmp, /var/tmp, /dev/shm,
      or /run paths. Volatile-storage references trigger
      project_outputs_in_tree_check FAIL at burn time; catching them
      here lets the author fix the report before hand-off.
    rule: no_volatile_paths
