# Testability level (v0.50 hybrid strategy — see _shared/TESTING_STRATEGY.md)
testability: structured

# #2050. output_type MEASURED, not assumed. This skill's declared deliverable
# is `timing/hold_fix_report.md`, a Markdown before/after report. A document
# cannot carry the RTL `// Post-checks:` header that `postcheck_pass_only`
# looks for: it can only be TYPED into one, never measured on it. No SKILL.md
# in this plugin documents emitting that header (zero of 70, measured), and
# this skill's own required patterns are Markdown headings. The cross-checks
# below are therefore bound to their auditors' own receipts, exactly as #2048
# did for rtl-review.
output_type: report

# Auto-generated compliance spec for skill 'hold-fix'
# Refines vibe-ic/skills/hold-fix/SKILL.md output requirements.
skill: hold-fix

requirements:
  - id: R_has_output_section
    description: "Output format/schema section present"
    pattern: '(##\s+(?:Output|Findings|Result|Report))'
    skill_section: 'Output/Handoff'
  - id: R_next_step
    description: "At least one 'Next:' handoff line"
    pattern: 'Next:\s*(?:run\s+)?/\w'
    skill_section: 'Output/Handoff'
  - id: R_status_or_summary
    description: "Has a Summary or STATUS block"
    pattern: '(##\s+Summary|\*\*STATUS\*\*:)'
    skill_section: 'Output/Handoff'
  - id: R_hold_violations
    description: "Hold violation count and fix strategy"
    pattern: '(hold.*violation|hold.*slack|buffer.*insert|delay.*cell|fix.*hold)'
    skill_section: 'Hold Fix'

cross_checks:
  - id: X_eda_log_check
    description: "Verify hold fix log exists with expected content"
    rule: audit_receipt_evidence
    auditor: eda_log_check
  # The other half of the output_type pairing (#2048). Repointing the audits
  # above removes the reason to paste the RTL header; this keeps pasting one a
  # failure, so a fabricated `// Post-checks:` line in this report cannot pass
  # unremarked now that nothing else reacts to it.
  - id: X_text_only_skill
    description: "hold-fix emits a report document, not RTL."
    rule: text_only_report
