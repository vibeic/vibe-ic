skill: phase1-coverage-loop

# Compliance requirements for phase1-coverage-loop verify comments.
#
# The skill produces two kinds of output:
#   A. Backlog YAMLs   (delegated → community-backlog-submit compliance)
#   B. Verify comments (this file)
#
# Below applies to verify comments posted on GitHub issues by
# Step 4 of the loop. Verify comments must be unambiguous so the
# core-agent can act on them deterministically.

requirements:
  - id: R1_verdict_line
    description: >-
      Verify comment must open with "**VERIFIED at v<version>**" OR
      "**NOT VERIFIED at v<version>**" — no equivocation.
    pattern: '\*\*(VERIFIED|NOT VERIFIED) at v\d+\.\d+\.\d+\*\*'

  - id: R2_before_after_table
    description: >-
      Verify comment must cite the deterministic-gate verdict
      BEFORE the fix and AFTER the fix in a table or code block,
      with concrete captured_pct values from
      phase1_input_vs_generated_completeness.json.
    pattern: '(\|.*\|)|```'

  - id: R3_regression_spot_check
    description: >-
      Verify comment must name at least one OTHER IC from the
      rotation that was re-run as a regression spot-check, with
      its verdict. Use phrase "Regression spot-check:" before
      the IC name.
    pattern: 'Regression spot-check:'

  - id: R4_label_management
    description: >-
      Verify comment body MUST end with one of:
        - "Adding `field-verified`."   (VERIFIED — issue stays CLOSED)
        - "Reopening; removing `core-closed`."  (NOT VERIFIED — reopened)
    pattern: '(Adding `field-verified`\.|Reopening; removing `core-closed`\.)'
