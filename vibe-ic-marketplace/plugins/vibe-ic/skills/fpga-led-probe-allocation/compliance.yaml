# Testability level (v0.50 hybrid strategy)
testability: full_markdown

# Compliance spec for skill 'fpga-led-probe-allocation' (v0.99)
skill: fpga-led-probe-allocation

requirements:
  - id: R_when_to_use
    description: "Has a 'When to use' section"
    pattern: '##\s+When\s+to\s+use'
    skill_section: 'Routing'
  - id: R_four_modes
    description: "Lists the four probe modes (instantaneous / pulse-stretched / sticky / byte-display)"
    pattern: '(instantaneous.*pulse.?stretched.*sticky.*byte.?display|all\s+four\s+probe\s+modes)'
    skill_section: 'Probe modes'
  - id: R_table_template
    description: "Provides a comment-table template mapping LED → signal → behaviour"
    pattern: '(LED\s+PROBE\s+TABLE|LEDR\[\d.*\]\s+\w+\s+\w+)'
    skill_section: 'Top-template'
  - id: R_companion_tools
    description: "References device_camera_capture / device_camera_led_diff mcp tools"
    pattern: '(device_camera_capture|device_camera_led_diff)'
    skill_section: 'Companion tools'
  - id: R_anti_patterns
    description: "Has an Anti-patterns section enumerating common mistakes"
    pattern: '##\s+Anti.?patterns'
    skill_section: 'Anti-patterns'

cross_checks:
  - id: X_fpga_async_input_synchronizer_check
    description: "Cross-reference with input synchroniser gate"
    rule: postcheck_pass_only
  - id: X_fpga_pullup_lint
    description: "Cross-reference with pull-up lint"
    rule: postcheck_pass_only
