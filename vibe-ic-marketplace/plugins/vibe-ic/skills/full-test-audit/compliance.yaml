# Testability level (v0.50 hybrid strategy — see _shared/TESTING_STRATEGY.md)
testability: structured

# full-test-audit: "have full test" -> full test + D1 + D2 + D3. The audit
# report MUST give a verdict for all four dimensions, never just pytest.
skill: full-test-audit

requirements:
  - id: R_full_test
    description: "Part 1 — full test suite result reported (passed/failed/guard)"
    pattern: '(passed|FAILED|full test|pytest|guard)'
    skill_section: 'Part 1 — Full test'
  - id: R_d1_program_coverage
    description: "Part 2 — D1 program-test-coverage verdict reported"
    pattern: 'D1'
    skill_section: 'Part 2 — D1'
  - id: R_d2_step_checker
    description: "Part 3 — D2 step-compliance-checker verdict reported"
    pattern: 'D2'
    skill_section: 'Part 3 — D2'
  - id: R_d3_skill_residual
    description: "Part 4 — D3 skill-program-extractability verdict reported"
    pattern: 'D3'
    skill_section: 'Part 4 — D3'
  - id: R_overall_verdict
    description: "An overall PASS/FAIL/green verdict across the four dimensions"
    pattern: '(PASS|FAIL|green|all four)'
    skill_section: 'Synthesis'

# No postcheck_pass_only: full-test-audit is a DIAGNOSTIC — its report
# legitimately states FAIL when a dimension has a gap, so the verdict must not
# be forced to PASS-only. The deterministic dimensions (D1/D2) are pinned by
# plugin_full_audit + its test; this compliance spec only checks the report
# surfaces all four dimensions + an overall verdict.
cross_checks: []
