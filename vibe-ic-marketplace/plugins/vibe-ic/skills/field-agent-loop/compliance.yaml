skill: field-agent-loop

# Compliance requirements for field-agent-loop audit output.
#
# The skill produces two kinds of output:
#   A. Backlog YAMLs    (delegated → community-backlog-submit compliance)
#   B. Audit comments   (this file)
#
# Below applies to the audit comments posted on GitHub issues by the
# closed-audit rule + Step 4 of the loop. The core-agent now self-verifies
# and CLOSES issues (label `core-closed`); the field-agent AUDITS each
# closed issue on the real benchmark. Two terminal shapes:
#   - VERIFIED ok  → add label `field-verified` (issue stays CLOSED).
#   - NOT adequate → `gh issue reopen` + a 3-section reopen comment
#                    (複查對象 / 實機證據 / 建議修法) + remove `core-closed`.
# The `wait-for-verification` label is RETIRED — never required here.
#
# Schema matches skill_compliance_check.py (uses `skill:` +
# `requirements:` list). Save the candidate comment body to a
# file and run:
#     python3 plugins/vibe-ic/_shared/skill_compliance_check.py \
#         --requirements compliance.yaml <file>

requirements:
  - id: R1_verdict_line
    description: >-
      Audit comment must open with "**VERIFIED at v<version>**" OR
      "**NOT VERIFIED at v<version>**" — no equivocation.
    pattern: '\*\*(VERIFIED|NOT VERIFIED) at v\d+\.\d+\.\d+\*\*'

  - id: R2_reopen_target
    description: >-
      A reopen (NOT-adequate) comment must name the audit target with a
      "複查對象" line citing the issue number.
    pattern: '複查對象.*#\d+'

  - id: R3_field_evidence
    description: >-
      A reopen comment must cite concrete real-benchmark evidence under
      an "實機證據" line.
    pattern: '實機證據'

  - id: R4_suggested_fix
    description: >-
      A reopen comment must carry a concrete suggested-fix line under
      "建議修法".
    pattern: '建議修法'

  - id: R5_terminal_action
    description: >-
      Either VERIFIED → add `field-verified` (issue stays closed), OR
      NOT adequate → `gh issue reopen` + remove `core-closed`. The
      comment body MUST end with one of:
        - "Adding `field-verified`."
        - "已移除 core-closed 標籤；等待 core agent 重新處理。"
    pattern: '(Adding `field-verified`\.|已移除 core-closed 標籤；等待 core agent 重新處理。)'
