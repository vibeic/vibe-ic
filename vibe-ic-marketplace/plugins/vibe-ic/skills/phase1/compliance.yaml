# Testability level (v0.50 hybrid strategy — see _shared/TESTING_STRATEGY.md)
testability: structured

# Compliance for skill 'phase1', updated v0.74 G-implement.
# The phase1 skill is the single entry point to the Phase-1 fact-graph
# pipeline (v0.60). It replaces the v0.51 11-skill serial chain.
# Requirements below assert the SKILL.md documents the contracts the
# tools/phase1_engine/ implementation honours.
skill: phase1

requirements:
  # ---- Core pipeline contract (v0.58 baseline) -----------------------------
  - id: R_two_input_modes
    description: "SKILL.md documents natural language (prompt) + structured-YAML entry points"
    pattern: '(NL mode|natural.language|nl-ingest|structured YAML|spec\.yaml)'
    skill_section: 'Input modes'

  - id: R_fact_graph_output
    description: "Pipeline produces a single facts.yaml as the unified source of truth"
    pattern: '(facts\.yaml|fact[\- ]graph|FactGraph)'
    skill_section: 'Why This Supersedes The v0.51 Serial Pipeline'

  - id: R_layer_views
    description: "L1..L9 JSONs are described as render views, not authoring steps"
    pattern: '(render view|L1\.\.L9|L1 ?… ?L9|render views)'
    skill_section: 'Why This Supersedes The v0.51 Serial Pipeline'

  - id: R_deterministic_render
    description: "Render step is explicitly deterministic / no-LLM"
    pattern: '(pure[- ]Python|deterministic|No LLM|no LLM)'
    skill_section: 'Why This Supersedes The v0.51 Serial Pipeline'

  - id: R_provenance_per_fact
    description: "Every fact carries per-fact provenance (source / origin / UUID)"
    pattern: '(per[\- ]fact|provenance|source|UUID|auto_decided)'
    skill_section: 'Why This Supersedes The v0.51 Serial Pipeline'

  - id: R_core_gate_suite
    description: "Documents the four core gates run after render"
    pattern: '(phase1_doc_presence_check|phase1_consistency_check|phase1_quality_parity_check|json_schema_check)'
    skill_section: 'Gates'

  - id: R_ic_expert_agent_role
    description: "IC Expert Agent role spelled out — dialogue drives gaps, not layers"
    pattern: '(IC Expert Agent|ic-expert-agent)'
    skill_section: 'Agents'

  - id: R_ic_expert_role
    description: "IC Expert Agent role spelled out — reviews fact graph, fills gaps"
    pattern: '(IC Expert|ic-expert-agent)'
    skill_section: 'Agents'

  # ---- v0.60 additions (two entry points + extension layers) ---------------
  - id: R_two_entry_points
    description: "Documents Entry A (prompt) vs Entry B (existing design docs) — v0.60"
    pattern: '(Two entry points|Entry A|Entry B|entry points to the platform)'
    skill_section: 'Two entry points to the platform'

  - id: R_L10_extension
    description: "L10 test cases extension layer present in layer scope"
    pattern: '(L10_TEST_CASES|L10 test cases|L10.*CMD.*RSP|cmd_response_conformance)'
    skill_section: 'Layer scope'

  - id: R_L11_extension
    description: "L11 calibration extension — requires domain_clock/source_clock/scale_factor"
    pattern: '(L11_CALIBRATION|L11 calibration|domain_clock|source_clock|scale_factor)'
    skill_section: 'Layer scope'

  - id: R_L12_extension
    description: "L12 behavioral-sequences extension layer"
    pattern: '(L12_BEHAVIORAL_SEQUENCES|L12 behavioral|behavioral sequences|multi-step)'
    skill_section: 'Layer scope'

  - id: R_L13_contract_vs_evidence
    description: "L13 split: Phase 1 fills contract, Phase 2 appends evidence (v0.56 B4)"
    pattern: '(L13_LAB_CALIBRATION|L13.*contract|known_pass_bitstream|known_pass_transcript)'
    skill_section: 'Layer scope'

  - id: R_extension_gate_suite
    description: "Documents the 5 extension gates fired when extension layers present"
    pattern: '(layer_extension_presence_check|cmd_response_conformance_check|clock_scale_consistency_check|no_protocol_consistency_check|hardware_pass_attestation_check)'
    skill_section: 'Gates'

  - id: R_L3_protocol_sentinel
    description: "L3 `protocol_present:false` sentinel for memory/analog ICs (v0.57 D2)"
    pattern: '(protocol_present.*false|sentinel|no_protocol)'
    skill_section: 'Gates'

  # ---- v0.74 additions (bulk parsers + model-neutral NL ingest) ------------
  - id: R_bulk_parsers
    description: "Documents pin-table / regmap / OTP bulk ingest verbs (v0.74)"
    pattern: '(ingest-pins|ingest-regmap-csv|ingest-otp-hex|Intel HEX|raw hex)'
    skill_section: 'Input modes'

  - id: R_model_neutral_nl_ingest
    description: "NL ingest is model-neutral — caller must specify model (v0.74)"
    pattern: '(--model|PHASE1_NL_MODEL|model-neutral|no default model|caller to specify)'
    skill_section: 'Input modes'

  - id: R_provenance_artifact
    description: "PROVENANCE.md artifact emitted under output directory"
    pattern: 'PROVENANCE\.md'
    skill_section: 'Usage'

# #2050 — a `postchecks:` key used to sit here. `audit()` reads exactly
# `output_type`, `requirements` and `cross_checks`; it has never read
# `postchecks`, so the two entries under it were DEAD, not no-op-passing as
# the note beside them claimed, and they had never run once. The key is gone
# rather than moved, because neither obligation is a property of a DOCUMENT
# and `audit()` can only read the audited document's text. Both were carried
# to where they can actually be executed, and neither was dropped:
#
#   X_cli_importable            — already discharged, and was before this
#     change: `tools/phase1_engine/tests/` imports cli, ingest, render,
#     schema and gap_detect directly, so a broken module fails those tests.
#     `programs/tests/test_phase1_dead_postchecks_key.py` states the
#     obligation by name so it is findable from here.
#   X_round_trip_byte_identical — MEASURED, and it does NOT hold today.
#     `cli round-trip` over a checked-in 24-layer `generated_docs/` re-renders
#     14 files, identically on three separate fixtures. Cause, read off the
#     code and not guessed: `ingest.from_existing_docs` iterates
#     `schema.ALL_LAYER_CODES` (L1..L13, 14 codes) while `render_layers` can
#     write `GENERATABLE_LAYER_CODES` (28), so the opt-in advanced layers
#     L14..L27 are written by Phase 1 and then dropped by the reverse-extract
#     without a word. The same test file pins that shortfall by name, so it is
#     a number a reader can shrink rather than a claim in a key nobody read.
