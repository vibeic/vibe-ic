# Testability level (v0.50 hybrid strategy — see _shared/TESTING_STRATEGY.md)
testability: structured

# Compliance spec for skill 'testbench-gen'
# testbench-gen is PROGRAM-FIRST (professional_tb_gen.py generates the TB); the
# AI judgment layer must disclose the reference-model tier, never claim a
# vacuous pass, and hand off. These requirements refine that output contract.
skill: testbench-gen

requirements:
  - id: R_has_output_section
    description: "Output format/schema section present"
    pattern: '(##\s+(?:Output|Findings|Result|Report|Summary))'
    skill_section: 'Output/Handoff'
  - id: R_reference_model_tier
    description: "Discloses the reference-model tier (never a vacuous pass)"
    pattern: '(?i)(reference[- ]model|tier\s*[1-3]|golden|self-?check)'
    skill_section: 'reference-model strategy'
  - id: R_next_step
    description: "At least one handoff / Next line"
    pattern: '(?i)(Next:\s*(?:run\s+)?/?\w|hand(?:s| )?off)'
    skill_section: 'Output/Handoff'
