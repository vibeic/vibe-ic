# Testability level (v0.50 hybrid strategy — see _shared/TESTING_STRATEGY.md)
testability: structured

# Layer Contract Doctrine — the three judgements a program cannot make.
# Pairs with programs/l_doc_consumer_contract.py (the shared library that
# states the consuming-layer rule).
skill: layer-contract-doctrine

requirements:
  - id: R_producing_layer
    description: >-
      Names the PRODUCING layer explicitly — an L-digit, or `n/a` on the
      NOT_A_LAYER_FACT path (see X_na_layer_requires_not_a_layer_fact, which
      is what stops `n/a` being a way to skip the question).
    pattern: '[Pp]roducing layer:\s*(L\d|n/a)'
    skill_section: 'Output/Handoff'
  - id: R_consuming_layer
    description: >-
      Names the CONSUMING layer explicitly. The whole doctrine is that a fact
      landing SOMEWHERE is not the same as reaching the layer that consumes it,
      so a decision record that does not name the consumer has not made the
      decision. `n/a` is legal only on the NOT_A_LAYER_FACT path.
    pattern: '[Cc]onsuming layer:\s*(L\d|n/a)'
    skill_section: 'Output/Handoff'
  - id: R_consumer_program
    description: "Names the program file that actually dereferences the fact"
    pattern: '[Cc]onsumer program:\s*\S'
    skill_section: 'Output/Handoff'
  - id: R_boundary_class
    description: >-
      Classifies the fact as structural or behavioural — the test that decides
      whether a correct-by-construction program is even possible.
    pattern: '(structural|behavioural)'
    skill_section: 'The structural / behavioural boundary'
  - id: R_bucket_verdict
    description: "Records the A > B > C ladder verdict"
    pattern: 'Bucket\s+[ABC]'
    skill_section: 'Output/Handoff'
  - id: R_evidence
    description: >-
      Cites the measured evidence the decision rests on. A layer-assignment
      argument with no measured backing is a preference.
    pattern: 'evidence:\s*\S'
    skill_section: 'Output/Handoff'
  - id: R_status_or_summary
    description: "Has a Verdict / Summary block"
    pattern: '(\*\*Verdict\*\*|##\s+Summary)'
    skill_section: 'Output/Handoff'
  - id: R_next_step
    description: "At least one 'Next:' handoff line"
    pattern: 'Next:\s*/\w'
    skill_section: 'Output/Handoff'

cross_checks:
  # SKILL.md defines three legal verdicts, and a record taking the
  # NOT_A_LAYER_FACT path cannot name an L-digit on either layer line — the
  # fact belongs to no layer, that IS the verdict. Requiring `L\d`
  # unconditionally made one of the skill's own verdicts unreachable: a
  # fully-formed NOT_A_LAYER_FACT record scored 6/8 and exited 1. So the two
  # layer patterns admit `n/a`, and this cross-check is what keeps that from
  # becoming a way to skip the layer-assignment question: `n/a` is accepted
  # only in a record that actually reaches the NOT_A_LAYER_FACT verdict.
  - id: X_na_layer_requires_not_a_layer_fact
    description: >-
      `Producing/Consuming layer: n/a` is legal only on the NOT_A_LAYER_FACT
      path. A record that writes n/a without that verdict has dodged the
      decision rather than made it.
    rule: pattern_requires_tool
    if_phrase_matches: '(?:[Pp]roducing|[Cc]onsuming) layer:\s*n/a'
    tool_must_match: 'NOT_A_LAYER_FACT'

  # A decision record that cites a path under /tmp cites evidence that will not
  # exist tomorrow — and it trips project_outputs_in_tree_check at burn time.
  - id: X_no_volatile_paths
    description: >-
      Layer Contract Decision records must not reference /tmp, /var/tmp,
      /dev/shm or /run paths. Evidence must be citable in the tree.
    rule: no_volatile_paths
