# Testability level (v0.50 hybrid strategy — see _shared/TESTING_STRATEGY.md)
testability: structured

# Auto-generated compliance spec for skill 'equivalence-check'
# Refines vibe-ic/skills/equivalence-check/SKILL.md output requirements.
skill: equivalence-check

requirements:
  - id: R_has_output_section
    description: "Output format/schema section present"
    pattern: '(##\s+(?:Output|Findings|Result|Report))'
    skill_section: 'Output/Handoff'
  - id: R_next_step
    description: "At least one 'Next:' handoff line"
    pattern: 'Next:\s*(?:run\s+)?/\w'
    skill_section: 'Output/Handoff'
  - id: R_status_or_summary
    description: "Has a Summary or STATUS block"
    pattern: '(##\s+Summary|\*\*STATUS\*\*:)'
    skill_section: 'Output/Handoff'
  - id: R_lec_result
    description: "LEC result (EQUIVALENT/NOT_EQUIVALENT)"
    pattern: '(EQUIVALENT|NOT_EQUIVALENT|equivalent|match|mismatch)'
    skill_section: 'Result'

cross_checks:
  - id: X_eda_log_check
    description: "Verify LEC log exists with expected content"
    rule: postcheck_pass_only
