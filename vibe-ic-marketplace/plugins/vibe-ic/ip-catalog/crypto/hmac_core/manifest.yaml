ip_name: hmac_core
ip_version: "0.50"
ip_class: hmac_sha256_mac
license: BSD-2-Clause
canonical_url: https://github.com/secworks/hmac
canonical_commit: "master"
authors:
  - "Joachim Strömbergson <joachim@secworks.se>"
description: >
  RFC 2104 HMAC implementation wrapping SHA-256 (uses an external
  sha256_core instance). Memory-mapped key + message + digest registers.
  Useful for TLS / IPsec / token signing.

implements:
  algorithm: hmac_sha256
  standard: rfc_2104
  digest_width_bits: 256
  key_width_bits: 256
  underlying_hash: sha256

matches_when:
  - "L2.function == 'hmac' OR L2.function == 'hmac-sha256'"
  - "L2.crypto_family == 'mac' AND L2 contains 'sha-256'"
  - "L4 contains 'RFC 2104' OR L4 contains 'HMAC'"

interface:
  ports:
    - {name: clk,        dir: in,  width: 1}
    - {name: reset_n,    dir: in,  width: 1}
    - {name: cs,         dir: in,  width: 1}
    - {name: we,         dir: in,  width: 1}
    - {name: address,    dir: in,  width: 8}
    - {name: write_data, dir: in,  width: 32}
    - {name: read_data,  dir: out, width: 32}
  parameters: []

rtl_files:
  - src/rtl/hmac.v
  - src/rtl/hmac_core.v

synth:
  pdk_compatible: [sky130A]
  tested_clock_period_ns: 10
  area_ge: 3500
  openlane_tapeout_track_record: "secworks/hmac SKY130 OpenLane CI"

integration_notes: >
  Plugin should pair with crypto/sha256_core (this IP needs the SHA-256
  primitive instantiated by the wrapper that uses hmac_core).

depends_on:
  - sha256_core
