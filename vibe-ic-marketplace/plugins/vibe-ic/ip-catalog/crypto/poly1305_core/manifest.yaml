ip_name: poly1305_core
ip_version: "0.50"
ip_class: poly1305_mac
license: BSD-2-Clause
canonical_url: https://github.com/secworks/poly1305
canonical_commit: "master"
authors:
  - "Joachim Strömbergson <joachim@secworks.se>"
description: >
  RFC 7539 Poly1305 one-time authenticator. Commonly paired with
  ChaCha20 to form ChaCha20-Poly1305 AEAD. Memory-mapped key + nonce +
  message + tag registers.

implements:
  algorithm: poly1305
  standard: rfc_7539
  tag_width_bits: 128
  key_width_bits: 256

matches_when:
  - "L2.function == 'poly1305' OR L2.function == 'chacha20-poly1305'"
  - "L2.crypto_family == 'mac' AND L2 contains 'poly'"
  - "L4 contains 'RFC 7539' AND L4 contains 'Poly1305'"

interface:
  ports:
    - {name: clk,        dir: in,  width: 1}
    - {name: reset_n,    dir: in,  width: 1}
    - {name: cs,         dir: in,  width: 1}
    - {name: we,         dir: in,  width: 1}
    - {name: address,    dir: in,  width: 8}
    - {name: write_data, dir: in,  width: 32}
    - {name: read_data,  dir: out, width: 32}
  parameters: []

rtl_files:
  - src/rtl/poly1305.v
  - src/rtl/poly1305_core.v
  - src/rtl/poly1305_mulacc.v
  - src/rtl/poly1305_pblock.v
  - src/rtl/poly1305_final.v

synth:
  pdk_compatible: [sky130A]
  tested_clock_period_ns: 10
  area_ge: 5000

integration_notes: >
  For ChaCha20-Poly1305 AEAD, pair with crypto/chacha_core. Wrapper
  authors handle the AEAD framing (associated data + ciphertext +
  tag construction per RFC 7539 §2.8).

depends_on: []
