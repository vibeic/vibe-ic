ip_name: sha256_core
ip_version: "0.80"
ip_class: nist_sha256_hash
# v1.6.586 — corrected from ISC after upstream LICENSE audit. The
# LICENSE file is the standard secworks BSD-2-Clause boilerplate.
license: BSD-2-Clause
canonical_url: https://github.com/secworks/sha256
canonical_commit: "master"
authors:
  - "Joachim Strömbergson <joachim@secworks.se>"
description: >
  NIST FIPS-180-4 SHA-256 + SHA-224 hash accelerator. Memory-mapped
  register interface. Iterative single-cycle round, 66 cycles/block.
  Battle-tested in multiple ASICs + FPGAs.

implements:
  algorithm: sha256
  algorithm_variants: [sha256, sha224]
  standard: nist_fips_180_4
  round_implementation: iterative_single_cycle
  cycles_per_512bit_block: 66
  digest_width_bits: 256
  block_width_bits: 512

matches_when:
  - "L2.function == 'sha-256' OR L2.function == 'sha256'"
  - "L2.function == 'sha-224' OR L2.function == 'sha224'"
  - "L2.crypto_family == 'sha-2' AND L2.digest_width in [224, 256]"
  - "L4 contains 'NIST FIPS-180-4'"

interface:
  ports:
    - {name: clk,        dir: in,  width: 1, description: "system clock"}
    - {name: reset_n,    dir: in,  width: 1, description: "active-LOW synchronous reset"}
    - {name: cs,         dir: in,  width: 1, description: "chip select"}
    - {name: we,         dir: in,  width: 1, description: "write enable (1=write, 0=read)"}
    - {name: address,    dir: in,  width: 8, description: "register address (0x00-0x27 used)"}
    - {name: write_data, dir: in,  width: 32}
    - {name: read_data,  dir: out, width: 32}
    - {name: error,      dir: out, width: 1, description: "undefined address access flag"}
  parameters: []

rtl_files:
  - src/rtl/sha256.v
  - src/rtl/sha256_core.v
  - src/rtl/sha256_w_mem.v
  - src/rtl/sha256_k_constants.v

synth:
  pdk_compatible: [sky130A]
  tested_clock_period_ns: 25.9
  area_ge: 2500
  openlane_tapeout_track_record: "secworks/sha256 OpenLane SKY130 CI passes continuously"

integration_notes: >
  Padding is NOT performed by this core. Caller must pre-pad the
  message per NIST spec section 5.1 before writing to BLOCK0..15
  registers. Plugin should advise this in the integration wrapper's
  software example. For multi-block messages, set CTRL.NEXT=1
  instead of CTRL.INIT=1 for blocks 2+.

depends_on: []
