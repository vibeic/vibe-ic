ip_name: sha512_core
ip_version: "0.50"
ip_class: nist_sha512_hash
license: BSD-2-Clause
canonical_url: https://github.com/secworks/sha512
canonical_commit: "master"
authors:
  - "Joachim Strömbergson <joachim@secworks.se>"
description: >
  NIST FIPS-180-4 SHA-512 / SHA-384 / SHA-512/224 / SHA-512/256 hash
  accelerator. Memory-mapped register interface. Iterative single-cycle
  round, 80 cycles/block.

implements:
  algorithm: sha512
  algorithm_variants: [sha512, sha384, sha512_224, sha512_256]
  standard: nist_fips_180_4
  round_implementation: iterative_single_cycle
  cycles_per_1024bit_block: 80
  digest_width_bits_max: 512
  block_width_bits: 1024

matches_when:
  - "L2.function == 'sha-512' OR L2.function == 'sha512'"
  - "L2.function == 'sha-384' OR L2.function == 'sha384'"
  - "L2.crypto_family == 'sha-2' AND L2.digest_width in [384, 512]"
  - "L4 contains 'NIST FIPS-180-4' AND L2 contains 'sha-512'"

interface:
  ports:
    - {name: clk,        dir: in,  width: 1}
    - {name: reset_n,    dir: in,  width: 1}
    - {name: cs,         dir: in,  width: 1}
    - {name: we,         dir: in,  width: 1}
    - {name: address,    dir: in,  width: 8}
    - {name: write_data, dir: in,  width: 32}
    - {name: read_data,  dir: out, width: 32}
    - {name: error,      dir: out, width: 1}
  parameters: []

rtl_files:
  - src/rtl/sha512.v
  - src/rtl/sha512_core.v
  - src/rtl/sha512_w_mem.v
  - src/rtl/sha512_k_constants.v
  - src/rtl/sha512_h_constants.v

synth:
  pdk_compatible: [sky130A]
  tested_clock_period_ns: 10
  area_ge: 5000
  openlane_tapeout_track_record: "secworks/sha512 SKY130 OpenLane CI"

integration_notes: >
  Caller pre-pads messages per NIST spec. Mode register selects variant.

depends_on: []
