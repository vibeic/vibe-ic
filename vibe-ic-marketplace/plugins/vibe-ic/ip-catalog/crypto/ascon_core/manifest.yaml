ip_name: ascon_core
ip_version: "0.50"
ip_class: nist_lwc_ascon_aead
license: MIT
canonical_url: https://github.com/secworks/ascon
canonical_commit: "master"
authors:
  - "Joachim Strömbergson <joachim@secworks.se>"
description: >
  NIST Lightweight Cryptography (LWC) competition winner — Ascon AEAD +
  hash. Designed for low-area / IoT / smart card use. Memory-mapped
  register interface. Standardized by NIST SP 800-232 (final 2024).

implements:
  algorithm: ascon
  algorithm_variants: [ascon_aead_128, ascon_hash_256]
  standard: nist_sp_800_232
  permutation: ascon_p

matches_when:
  - "L2.function == 'ascon' OR L2.function == 'ascon-aead' OR L2.function == 'ascon-hash'"
  - "L2.crypto_family == 'lwc' OR L2.crypto_family == 'lightweight_crypto'"
  - "L4 contains 'NIST SP 800-232' OR L4 contains 'Ascon' OR L4 contains 'NIST LWC'"
  - "L1.target_area_ge < 5000 AND L2.crypto_family == 'aead'"

interface:
  ports:
    - {name: clk,        dir: in,  width: 1}
    - {name: reset_n,    dir: in,  width: 1}
    - {name: cs,         dir: in,  width: 1}
    - {name: we,         dir: in,  width: 1}
    - {name: address,    dir: in,  width: 8}
    - {name: write_data, dir: in,  width: 32}
    - {name: read_data,  dir: out, width: 32}
  parameters: []

rtl_files:
  - src/rtl/ascon.v
  - src/rtl/ascon_core.v
  - src/rtl/ascon_permutation.v

synth:
  pdk_compatible: [sky130A]
  tested_clock_period_ns: 10
  area_ge: 4500
  openlane_tapeout_track_record: "Ascon is the NIST-standardized LWC primitive; multiple academic + open-MPW implementations"

integration_notes: >
  AEAD mode requires careful nonce + associated-data handling per
  NIST SP 800-232. Wrapper authors the framing.

depends_on: []
