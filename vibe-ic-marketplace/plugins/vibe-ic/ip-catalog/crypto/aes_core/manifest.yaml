ip_name: aes_core
ip_version: "0.50"
ip_class: nist_aes_block_cipher
license: BSD-2-Clause
canonical_url: https://github.com/secworks/aes
canonical_commit: "master"
authors:
  - "Joachim Strömbergson <joachim@secworks.se>"
description: >
  NIST FIPS-197 AES-128 + AES-256 block cipher. Memory-mapped register
  interface (cs/we/addr/write_data/read_data). Iterative round implementation;
  ~10 cycles for AES-128 encrypt, ~14 cycles for AES-256.

implements:
  algorithm: aes
  algorithm_variants: [aes_128, aes_256]
  standard: nist_fips_197
  round_implementation: iterative
  cycles_per_block_aes128: 12
  cycles_per_block_aes256: 16
  block_width_bits: 128
  key_width_bits: [128, 256]
  modes_supported: [ecb]

matches_when:
  - "L2.function == 'aes' OR L2.function == 'aes-128' OR L2.function == 'aes-256'"
  - "L2.crypto_family == 'aes' AND L2.block_width == 128"
  - "L4 contains 'NIST FIPS-197'"

interface:
  ports:
    - {name: clk,        dir: in,  width: 1}
    - {name: reset_n,    dir: in,  width: 1, description: "active-LOW sync reset"}
    - {name: cs,         dir: in,  width: 1}
    - {name: we,         dir: in,  width: 1}
    - {name: address,    dir: in,  width: 8}
    - {name: write_data, dir: in,  width: 32}
    - {name: read_data,  dir: out, width: 32}
  parameters: []

rtl_files:
  - src/rtl/aes.v
  - src/rtl/aes_core.v
  - src/rtl/aes_encipher_block.v
  - src/rtl/aes_decipher_block.v
  - src/rtl/aes_key_mem.v
  - src/rtl/aes_sbox.v
  - src/rtl/aes_inv_sbox.v

synth:
  pdk_compatible: [sky130A]
  tested_clock_period_ns: 10
  area_ge: 12000
  openlane_tapeout_track_record: "secworks/aes is used in multiple chipIgnite designs; secworks crypto family consistently passes OpenLane SKY130 CI"

integration_notes: >
  Caller must handle padding per NIST mode requirements. The core
  exposes ENCDEC bit in CTRL register to select encrypt vs decrypt.
  For CBC/CTR/GCM modes, wrap with mode-handler at higher level (not
  in this IP).

depends_on: []
