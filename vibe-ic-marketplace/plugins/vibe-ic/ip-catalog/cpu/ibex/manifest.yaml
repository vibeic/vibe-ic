ip_name: ibex
ip_version: "0.91"
ip_class: rv32imc_2stage_in_order_cpu
license: Apache-2.0
canonical_url: https://github.com/lowRISC/ibex
canonical_commit: "master"
authors:
  - "lowRISC contributors (originally zero-riscy from PULP Platform)"
description: >
  Production-grade RV32IMC 2-stage in-order pipeline. Used as main CPU in
  OpenTitan silicon root of trust. Comprehensive UVM verification, formal
  property verification, multiple ASIC tape-outs.

implements:
  isa: rv32i
  isa_extensions_optional: [m, c, b, zicsr, zifencei]
  architecture: 2_stage_in_order_pipeline
  cycles_per_op_avg: 1.5
  has_branch_predictor: false
  has_memory_protection_unit: optional
  parameter_RV32M_options: [None, Slow, Fast, SingleCycle]
  parameter_RV32B_options: [None, Balanced, Full]

matches_when:
  # v1.6.574 — tightened from strict-blind sha256 pilot false-positive.
  # The original L1.application rule fired on every crypto chip whose
  # spec mentioned "security". Now requires explicit CPU-class signal
  # (L2.cpu_family OR L8 mentions "core") to avoid mismatching crypto
  # accelerators that happen to be in security applications.
  - "L2.cpu_isa starts with 'rv32' AND L2.cpu_arch contains 'pipelined' or '2-stage' or 'in-order'"
  - "L2.cpu_family == 'risc-v' AND L1.application contains 'security' or 'root of trust' or 'commercial-grade'"
  - "L2.cpu_family == 'risc-v' AND L1.target_area_ge > 8000"
  - "L2 contains 'OpenTitan' OR L2 contains 'Ibex'"

interface:
  ports:
    - {name: clk_i,                  dir: in,  width: 1}
    - {name: rst_ni,                 dir: in,  width: 1}
    - {name: test_en_i,              dir: in,  width: 1}
    - {name: ram_cfg_i,              dir: in,  width: "prim_pkg::ram_1p_cfg_t"}
    - {name: hart_id_i,              dir: in,  width: 32}
    - {name: boot_addr_i,            dir: in,  width: 32}
    - {name: instr_req_o,            dir: out, width: 1}
    - {name: instr_gnt_i,            dir: in,  width: 1}
    - {name: instr_rvalid_i,         dir: in,  width: 1}
    - {name: instr_addr_o,           dir: out, width: 32}
    - {name: instr_rdata_i,          dir: in,  width: 32}
    - {name: instr_err_i,            dir: in,  width: 1}
    - {name: data_req_o,             dir: out, width: 1}
    - {name: data_gnt_i,             dir: in,  width: 1}
    - {name: data_rvalid_i,          dir: in,  width: 1}
    - {name: data_we_o,              dir: out, width: 1}
    - {name: data_be_o,              dir: out, width: 4}
    - {name: data_addr_o,            dir: out, width: 32}
    - {name: data_wdata_o,           dir: out, width: 32}
    - {name: data_rdata_i,           dir: in,  width: 32}
    - {name: data_err_i,             dir: in,  width: 1}
    - {name: irq_software_i,         dir: in,  width: 1}
    - {name: irq_timer_i,            dir: in,  width: 1}
    - {name: irq_external_i,         dir: in,  width: 1}
    - {name: irq_fast_i,             dir: in,  width: 15}
    - {name: irq_nm_i,               dir: in,  width: 1}
    - {name: debug_req_i,            dir: in,  width: 1}
    - {name: crash_dump_o,           dir: out, width: "ibex_pkg::crash_dump_t"}
    - {name: fetch_enable_i,         dir: in,  width: 1}
    - {name: core_busy_o,            dir: out, width: 1}
    - {name: alert_minor_o,          dir: out, width: 1}
    - {name: alert_major_o,          dir: out, width: 1}
  parameters:
    - {name: PMPEnable,         default: "1'b0"}
    - {name: PMPGranularity,    default: 0}
    - {name: PMPNumRegions,     default: 4}
    - {name: MHPMCounterNum,    default: 0}
    - {name: MHPMCounterWidth,  default: 40}
    - {name: RV32E,             default: "1'b0"}
    - {name: RV32M,             default: "ibex_pkg::RV32MFast"}
    - {name: RV32B,             default: "ibex_pkg::RV32BNone"}
    - {name: RegFile,           default: "ibex_pkg::RegFileFF"}
    - {name: BranchTargetALU,   default: "1'b0"}
    - {name: WritebackStage,    default: "1'b0"}

rtl_files:
  - rtl/ibex_top.sv
  - rtl/ibex_core.sv
  - rtl/ibex_alu.sv
  - rtl/ibex_branch_predict.sv
  - rtl/ibex_compressed_decoder.sv
  - rtl/ibex_controller.sv
  - rtl/ibex_counter.sv
  - rtl/ibex_cs_registers.sv
  - rtl/ibex_csr.sv
  - rtl/ibex_decoder.sv
  - rtl/ibex_dummy_instr.sv
  - rtl/ibex_ex_block.sv
  - rtl/ibex_fetch_fifo.sv
  - rtl/ibex_icache.sv
  - rtl/ibex_id_stage.sv
  - rtl/ibex_if_stage.sv
  - rtl/ibex_load_store_unit.sv
  - rtl/ibex_lockstep.sv
  - rtl/ibex_multdiv_fast.sv
  - rtl/ibex_multdiv_slow.sv
  - rtl/ibex_prefetch_buffer.sv
  - rtl/ibex_register_file_ff.sv
  - rtl/ibex_wb_stage.sv

synth:
  pdk_compatible: [sky130A, gf180mcuD, commercial_28nm, commercial_22nm]
  tested_clock_period_ns: 10
  area_ge: 18000
  openlane_tapeout_track_record: "OpenTitan Earlgrey + Darjeeling (commercial tape-out), academic OpenLane runs"

integration_notes: >
  Ibex is SystemVerilog (.sv) — Plugin must ensure Yosys synthesis
  config uses -sv flag. Depends on lowRISC's `prim` library for
  primitives. Memory interface follows OpenTitan TL-UL convention
  (Plugin authors a TL-UL ↔ Wishbone or AXI bridge if needed).

depends_on:
  - prim_lowrisc
