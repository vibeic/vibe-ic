ip_name: picorv32
ip_version: "1.0.0"
ip_class: rv32imc_minimal_cpu
license: ISC
canonical_url: https://github.com/YosysHQ/picorv32
canonical_commit: "master"
authors:
  - "Claire Xenia Wolf <claire@yosyshq.com>"
description: >
  Compact RV32IMC implementation. Multi-cycle datapath (not pipelined).
  Optional M extension, IRQ controller, and CO-processor interface.
  Verified on Caravel MPW-1 (caravel_pico).

implements:
  isa: rv32i
  isa_extensions_optional: [m, c]
  architecture: multi_cycle
  cycles_per_op_typical: 5
  with_irq_controller: configurable
  parameter_PROGADDR_RESET: configurable

matches_when:
  - "L2.cpu_isa starts with 'rv32' AND L2.cpu_arch contains 'multi-cycle' or 'state-machine'"
  - "L2.cpu_family == 'risc-v' AND L1.target_area_ge in [3000, 8000]"
  - "L2 mentions 'PicoSoC' or 'picorv32'"

interface:
  ports:
    - {name: clk,           dir: in,  width: 1}
    - {name: resetn,        dir: in,  width: 1, description: "active-LOW reset"}
    - {name: trap,          dir: out, width: 1}
    - {name: mem_valid,     dir: out, width: 1}
    - {name: mem_instr,     dir: out, width: 1}
    - {name: mem_ready,     dir: in,  width: 1}
    - {name: mem_addr,      dir: out, width: 32}
    - {name: mem_wdata,     dir: out, width: 32}
    - {name: mem_wstrb,     dir: out, width: 4}
    - {name: mem_rdata,     dir: in,  width: 32}
    - {name: irq,           dir: in,  width: 32}
    - {name: eoi,           dir: out, width: 32}
  parameters:
    - {name: ENABLE_COUNTERS,      default: 1}
    - {name: ENABLE_COUNTERS64,    default: 1}
    - {name: ENABLE_REGS_16_31,    default: 1}
    - {name: ENABLE_REGS_DUALPORT, default: 1}
    - {name: LATCHED_MEM_RDATA,    default: 0}
    - {name: TWO_STAGE_SHIFT,      default: 1}
    - {name: BARREL_SHIFTER,       default: 0}
    - {name: TWO_CYCLE_COMPARE,    default: 0}
    - {name: TWO_CYCLE_ALU,        default: 0}
    - {name: COMPRESSED_ISA,       default: 0}
    - {name: ENABLE_MUL,           default: 0}
    - {name: ENABLE_FAST_MUL,      default: 0}
    - {name: ENABLE_DIV,           default: 0}
    - {name: ENABLE_IRQ,           default: 0}
    - {name: PROGADDR_RESET,       default: "32'h00000000"}

rtl_files:
  - picorv32.v

synth:
  pdk_compatible: [sky130A, ice40, ecp5]
  tested_clock_period_ns: 10
  area_ge: 5500
  openlane_tapeout_track_record: "Caravel MPW-1 (caravel_pico shuttle), multiple chipIgnite shuttles, many FPGA designs"

integration_notes: >
  Single-file IP (picorv32.v). PicoSoC ecosystem (picosoc.v + spimemio.v +
  simpleuart.v from same repo) provides a complete reference SoC.
  When Plugin matches PicoRV32 against a SoC spec, recommend pulling
  picosoc/picosoc.v as well for boot ROM + SRAM + SPI flash glue.

depends_on: []
