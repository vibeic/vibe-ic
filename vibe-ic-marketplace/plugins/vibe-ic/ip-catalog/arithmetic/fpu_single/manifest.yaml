ip_name: fpu_single
ip_version: "1.0.0"
ip_class: ieee754_single_precision_fpu
# v1.6.586 — license corrected after audit. No LICENSE/COPYING file in
# the repo; each .v carries an Usselmann custom permissive header that
# is functionally equivalent to BSD/MIT (use + redistribute freely
# provided copyright notice retained, no warranty). Marked as custom
# permissive — needs whitelist addition.
license: Usselmann-Permissive
canonical_url: https://github.com/freecores/fpu
canonical_commit: "master"
authors:
  - "Rudolf Usselmann <rudi@asics.ws>"
description: >
  Single-precision IEEE 754 floating-point unit. Supports +/-/*//
  operations + comparisons + rounding modes (RNE/RTZ/RUP/RDN).
  Reference: OpenCores fpu project.

implements:
  standard: ieee_754_single_precision
  operations: [add, sub, mul, div]
  rounding_modes: [round_nearest_even, round_to_zero, round_up, round_down]
  exception_flags: [inf, snan, qnan, inexact, overflow, underflow, zero, div_by_zero]
  width_bits: 32

matches_when:
  - "L2.function == 'fpu' OR L2.function == 'floating-point-unit'"
  - "L2.arithmetic_family == 'ieee_754' AND L2.precision == 'single'"
  - "L4 contains 'IEEE 754' OR L4 contains 'floating point'"
  - "L2.cpu_extensions contains 'F' AND L2.cpu_isa starts with 'rv32'"

interface:
  ports:
    - {name: clk,        dir: in,  width: 1}
    - {name: rmode,      dir: in,  width: 2, description: "rounding mode select"}
    - {name: fpu_op,     dir: in,  width: 3, description: "operation select (000=add, 001=sub, 010=mul, 011=div, ...)"}
    - {name: opa,        dir: in,  width: 32, description: "operand A"}
    - {name: opb,        dir: in,  width: 32, description: "operand B"}
    - {name: out,        dir: out, width: 32, description: "result"}
    - {name: inf,        dir: out, width: 1}
    - {name: snan,       dir: out, width: 1}
    - {name: qnan,       dir: out, width: 1}
    - {name: ine,        dir: out, width: 1, description: "inexact"}
    - {name: overflow,   dir: out, width: 1}
    - {name: underflow,  dir: out, width: 1}
    - {name: zero,       dir: out, width: 1}
    - {name: div_by_zero, dir: out, width: 1}
  parameters: []

rtl_files:
  - verilog/fpu.v
  - verilog/pre_norm.v
  - verilog/pre_norm_fmul.v
  - verilog/post_norm.v
  - verilog/except.v
  - verilog/primitives.v

synth:
  pdk_compatible: [sky130A, gf180mcuD]
  tested_clock_period_ns: 15
  area_ge: 10000
  openlane_tapeout_track_record: "OpenCores fpu; used in academic + open-MPW designs"

integration_notes: >
  For RISC-V F-extension integration, wrap with a small FSM that
  decodes the F-format instructions and dispatches operands to this
  FPU. Multi-cycle operation — caller must wait for ine/inf strobe.

depends_on: []
