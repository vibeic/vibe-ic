[pytest]
addopts = --import-mode=importlib
# HARD RULE: `testpaths` must list every tree bare `pytest` is expected to run,
# because bare `pytest` runs THESE AND NOTHING ELSE. A tree named in a comment
# but absent from this list is not collected, and its failures are invisible.
#
#   programs/tests/            unit tests for the deterministic programs
#   tools/phase1_engine/tests/ the Phase-1 gap/render engine
#
# The previous comment here named a second tree, `tests/`, that does not exist
# in this repo, and told the reader that bare `pytest` ran "BOTH" — while this
# very setting listed one. `tools/phase1_engine/tests/` was meanwhile collected
# by nothing at all (not here, not by run_tests.sh) and sat with two failing
# tests on main that no suite reported (#1391, fixed by #1390).
#
# Adding a tree here is not free: bare `pytest` is also the smoke floor for the
# targeted selector, so a tree listed here must be GREEN before it is added.
testpaths =
    programs/tests
    tools/phase1_engine/tests
