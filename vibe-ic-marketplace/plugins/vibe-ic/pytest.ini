[pytest]
addopts = --import-mode=importlib
# HARD RULE: `testpaths` must list every tree bare `pytest` is expected to run,
# because bare `pytest` runs THESE AND NOTHING ELSE. A tree named in a comment
# but absent from this list is not collected, and its failures are invisible.
#
#   programs/tests/            unit tests for the deterministic programs
#   tools/phase1_engine/tests/ the Phase-1 gap/render engine
#   mcp-eda/test/              the MCP EDA server (a sub-project, see below)
#
# The previous comment here named a second tree, `tests/`, that does not exist
# in this repo, and told the reader that bare `pytest` ran "BOTH" — while this
# very setting listed one. `tools/phase1_engine/tests/` was meanwhile collected
# by nothing at all (not here, not by run_tests.sh) and sat with two failing
# tests on main that no suite reported (#1391, fixed by #1390).
#
# Adding a tree here is not free: bare `pytest` is also the smoke floor for the
# targeted selector, so a tree listed here must be GREEN before it is added.
#
# `mcp-eda/test/` is the one entry that is a JUDGEMENT rather than a plain
# omission, so the reasoning is recorded instead of assumed. It is a
# sub-project — its own `package.json`, its own Node server — and the PR
# template and CONTRIBUTING both invoke it as a SEPARATE `pytest -q
# mcp-eda/test`, which is why it was never here. But prose in a checklist is
# not a runner: `git grep mcp-eda/test` over `*.yml *.yaml *.sh *.ini *.toml`
# matched NOTHING, so those 201 tests ran only when a human remembered. It is
# green (193 passed, 8 tool-gated skips, 5.4s) and has no conftest of its own,
# so it costs the smoke floor 201 tests and ~5s to stop depending on memory.
# If the maintainers want it kept out of bare `pytest` deliberately, this is
# the line to revert — and then `run_tests.sh` still covers it.
testpaths =
    programs/tests
    tools/phase1_engine/tests
    mcp-eda/test
