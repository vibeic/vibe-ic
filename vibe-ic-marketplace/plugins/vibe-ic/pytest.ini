[pytest]
addopts = --import-mode=importlib
# The full suite is ONE tree: programs/tests/. It holds the unit tests AND the
# integration/regression gates (INDEX freshness, every-skill-has-compliance,
# orchestrator branch regressions). Validate with bare `pytest`, no path filter.
#
# THIS COMMENT USED TO NAME A SECOND TREE, `tests`, WHICH HAS NEVER EXISTED IN
# THIS REPOSITORY. It read "the full suite is BOTH test trees ... never
# `pytest programs/tests/` alone (that misses the gates)", so obeying it meant
# running that missing directory as a second path. pytest does not fail on a
# path that is not there — it collects nothing. Measured on a38902d16:
#
#     pytest                       ->  32700 tests collected
#     pytest programs/tests <that> ->  no tests collected in 0.11s
#
# So the reader who followed the HARD RULE got a clean-looking ZERO, and the
# gates it warned about missing were in programs/tests/ the whole time. The
# instruction was more dangerous than the mistake it was written to prevent.
#
# programs/tests/test_pytest_ini_paths_exist.py now fails if any directory
# named in this file is absent, so it cannot rot back into a silent zero.
testpaths = programs/tests
