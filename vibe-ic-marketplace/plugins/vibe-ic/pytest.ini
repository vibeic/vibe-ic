[pytest]
addopts = --import-mode=importlib
# ONE TESTPATH, DELIBERATELY. `single_testpath_guard.py` and
# `test_single_testpath_guard.py::test_current_repo_is_single_tree` pin
# `testpaths == ["programs/tests"]` exactly, and the reason is named there: a
# second testpath is the green-local/red-CI footgun. Do not add one here.
#
# THE COMMENT THAT USED TO SIT HERE SAID THE OPPOSITE, and it was more dangerous
# than the mistake it was written to prevent. It called the full suite "BOTH
# test trees" and told the reader to validate with a bare `pytest` so "BOTH
# run" — while this setting listed one, and while the second tree it named,
# `tests`, HAS NEVER EXISTED in this repository. pytest does not fail on a path
# that is not there; it collects nothing. Measured on a38902d16:
#
#     pytest                        ->  32700 tests collected
#     pytest programs/tests <that>  ->  no tests collected in 0.11s
#
# So the reader who obeyed the HARD RULE got a clean-looking ZERO, and the gates
# it warned about missing were in programs/tests/ the whole time. Believing the
# comment over the guard also cost a real regression: a second testpath was
# added and it reddened `test_current_repo_is_single_tree` and
# `test_shipped_plugin_d2_clean` immediately (vibe-ic#1391).
#
# TWO GUARDS NOW HOLD THIS, and they answer different halves:
#   `single_testpath_guard.py`            no SECOND testpath may be added.
#   `test_pytest_ini_paths_exist.py`      no directory reference in this file,
#                                         in `testpaths` OR in prose, may name
#                                         a directory that does not resolve —
#                                         so it cannot rot back into a silent
#                                         zero.
#
# The coverage hole the old comment was papering over is fixed where it belongs:
# `run_tests.sh` discovers every tree, and THAT is the full suite. Trees not
# collected by bare `pytest`, by design, and covered there instead:
#
#   tools/phase1_engine/tests/   the Phase-1 gap/render engine
#   mcp-eda/test/                the MCP EDA server sub-project
#   skills/*/tests/              per-skill compliance
testpaths = programs/tests

# ONE MARKER, REGISTERED SO IT CANNOT BE A TYPO.
#
# `campaign_tier` is what the LANDING GATE deselects (`-m 'not campaign_tier'`,
# in tools/gatekeeper-land.sh) and what the CAMPAIGN TIER selects
# (`-m campaign_tier`, in tools/run_campaign_tier.sh). Registering it here is
# not decoration: an unregistered mark is a silent no-op, so a misspelt
# `@pytest.mark.campain_tier` would deselect nothing while looking exactly like
# a working exclusion — and this file already carries the scar of a comment
# that described a collection that was silently empty.
#
# The marker is NOT the record. Every node carrying it is declared, WITH ITS
# REASON, ITS SUBJECT AND ITS OWNER, in
# `vibe-ic-marketplace/plugins/vibe-ic/programs/landing_excluded_corpus.py`,
# whose `--audit` (wired blocking in tools/ci/repo_hygiene_gates.sh) fails in
# BOTH directions: a declared node without the marker, and a marked node
# without a declaration.
markers =
    campaign_tier: audits a PUBLISHED campaign artefact rather than this change; deselected by the landing gate, declared in programs/landing_excluded_corpus.py
