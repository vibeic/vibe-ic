[pytest]
addopts = --import-mode=importlib
# HARD RULE: the full suite is BOTH test trees. programs/tests/ holds unit tests;
# tests/ holds the integration/regression gates (INDEX freshness, every-skill-has-
# compliance, orchestrator branch regressions). Validate with bare `pytest` (no path
# filter) so BOTH run — never `pytest programs/tests/` alone (that misses the gates).
testpaths = programs/tests tests
