_comment: 're #495 Stage 3 — the declared disposition of every class-tree node and
  every template file. The issue asked whether the 20 nodes without a template should
  be POPULATED or DELETED. Measured answer: NEITHER. In an inheritance tree a node
  without its own template means ''adds nothing beyond my parent'' — which is what
  digital-ic.yaml already says of itself in prose and what gap_detect._spec_floor_from_chain
  has always done. What was broken is that the two single-template consumers substituted
  the ORPHAN generic-ic template instead of walking to an ancestor, silently, and
  not even in a consistent direction: looser than the taxonomy for the protocol-ic
  and crypto-engine children, stricter for the digital-ic children whose ancestors
  carry no floor at all. Since Stage 3 all three consumers walk. This file records
  the resulting disposition so ''no template'' is a declared state rather than an
  accident, and programs/tests/test_v1_7_72_issue495_template_hole_inheritance.py
  re-derives every entry from disk so it cannot drift.'
known_divergence:
  node: uart-peripheral
  rule: L3_opcode_count_min
  what: gap_detect._spec_floor_from_chain accumulates root->leaf with dict.update,
    so a rule a child OMITS is inherited from the parent anyway; there is no way
    in that scheme to say 'my parent floors this and I do not'. templates/uart-peripheral.yaml
    is the one template that tries, dropping L3_opcode_count_min with the reason
    on the line where it would have gone ('No L3 opcode floor — UART carries arbitrary
    bytes, not opcodes'), and gap_detect re-imposes protocol-ic's value of 4. The
    two single-template consumers honour the omission, so the semantics disagree
    on exactly this one node.
  not_fixed_here: Changing an inheritance rule is not a template hole, gap_detect's
    chain walk is the subject of the following stage, and gap_detect produces 0
    gaps corpus-wide today so nothing is currently mis-scored. Pinned by programs/tests/test_v1_7_72_issue495_template_hole_inheritance.py
    so it stays a decision rather than a rediscovery.
