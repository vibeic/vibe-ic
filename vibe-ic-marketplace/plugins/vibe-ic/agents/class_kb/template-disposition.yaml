orphan_templates:
  analog-front-end:
    disposition: keep_explicit_only
    reason: 'Reachable only by an explicit --class-path. It is a live class in the
      Q-bank taxonomy (agents/qbank/analog-front-end_L2.yaml and _L8.yaml) but has
      never been a node in class-tree.yaml. NOT promoted to a node here: its spec_floor
      carries L10_cmd_response_min and L11_calibration_tables_min, and both are
      unsatisfiable across all 201 tracked doc-sets (L10 test cases carry no `category`
      key at all, and `calibration_tables` is an empty list in every one of the
      106 doc-sets that emit it). Promoting it would give the data_converter / mixed_signal_otp
      classes a permanent 2-finding red that no design could clear. Promote it once
      those two rules have a producer, or once the floors can read an honest-absence
      sentinel.'
  cable-side-id-ic-maxim-style:
    disposition: keep_explicit_only
    reason: Reachable only by an explicit --class-path, and exercised that way by
      programs/tests/test_phase1_quality_parity_check.py. A tightened variant of
      the cable-side-id-ic floor (L6_required_submodules plus higher submodule /
      port minimums) for one implementation style; it is a profile a user opts into,
      not a class the classifier can detect, so it does not belong in the detection
      taxonomy.
  generic-ic:
    disposition: keep_non_node
    reason: 'Deliberately not a node. It is the NEUTRAL floor that phase1_quality_parity_check
      substitutes for a class the tree does not contain at all — an unregistered
      name, a third-party class, a typo — so that an unknown class can never inherit
      a protocol-specific floor. Making it a node would put it in the inheritance
      graph, where it has no meaningful parent or children. Since #495 Stage 3 it
      no longer also stands in for the 20 template-less NODES, which inherit from
      their ancestors instead, so its role is now exactly the one it was written
      for.'
