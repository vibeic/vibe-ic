# Vibe-IC Phase-1 IC Class Taxonomy (K1)
# -----------------------------------------
# Inheritance tree — each child inherits parent's fact requirements, then adds its own.
# Used by IC Expert to select the correct fact manifest for a given IC class.
# Used by the IC Expert Agent to pick appropriate Q-bank entries.
#
# v0.41 update: synthesised from 23 IC characterizations under
# /tmp/phase1_e2/characterizations/. New siblings and subclasses added:
#   - soc-harness (caravel)            — sibling of digital-ic / analog-mixed-ic
#   - crypto-engine subclasses         — block-cipher / hash-function / stream-cipher / rng
#   - apb-peripheral                   — sibling of i2c-peripheral (APB slaves)
#   - processor examples extended      — cv32e40p in feature-cpu; cva6 moved to feature-cpu
#                                        (scoreboarded in-order issue / in-order commit)

any-ic:
  description: Root class — every IC that enters Phase 1 pipeline.
  required_layers: [L1, L2, L3, L4, L5, L6, L7, L8, L8R, L9]
  children:
    digital-ic:
      description: Purely digital (no analog), synchronous, POR-reset.
      children:
        protocol-ic:
          description: Communicates via a defined SERIAL FRAMED protocol (framed bytes, CRC, commands). NOT for memory-mapped bus peripherals (APB/AXI) — those go under digital-ic directly.
          children:
            cable-side-id-ic:
              description: Lives in a cable/plug, identifies to host over single-wire ID.
              # Generic examples only — no vendor copy bundled in plugin.
              examples: [USB Type-C E-marker, 1-Wire ID ROM, generic single-wire ID controller]
            i2c-peripheral:
              description: I2C master/slave device with register map.
              examples: [i2c, sensor-style]
            spi-peripheral:
              description: SPI master/slave device.
              examples: [spi, core_spiflash]
            uart-peripheral:
              description: UART-framed control protocol / byte-stream endpoint.
              examples: [verilog-uart]
            # v0.79 (E1) — generic external-protocol-to-internal-bus bridge.
            # Differs from i2c/spi/uart-peripheral (which terminate the
            # bus on-chip): a protocol-bridge owns the full physical-layer
            # PHY for an external standard (USB / CAN / Modbus / Bluetooth /
            # PS2) and exposes a memory-mapped or stream interface inward.
            protocol-bridge:
              description: External-protocol PHY+MAC bridge to internal SoC bus (USB/CAN/Modbus/Bluetooth/PS2 endpoint or host).
              examples: [usb_cdc, freecores-bluetooth, freecores-can, freecores-modbus, freecores-ps2, freecores-usbhostslave, glasgow]
        # v0.62: apb-peripheral moved out from protocol-ic.children to direct
        # child of digital-ic. Bus-driven (memory-mapped registers via PSEL/
        # PENABLE/PWRITE/PADDR) and does NOT need serial protocol-ic facts
        # like frame_format / aid_bit_timing / wake_timing / CRC.
        apb-peripheral:
          description: APB3/APB4 slave with register window (GPIO, timer, misc). Memory-mapped, NOT a serial protocol.
          examples: [apb_gpio, apb_timer]
        bus-controller:
          description: On-chip bus fabric (APB, AXI, Wishbone, interconnect / crossbar).
          examples: [verilog-axi, verilog-wishbone, wb_intercon]
        processor:
          description: Instruction-fetching, register-file, pipelined compute core.
          children:
            simple-cpu:
              description: Single-issue in-order or multi-cycle (32-bit RISC-V minimal, bit-serial OK).
              examples: [picorv32, darkriscv, serv]
            feature-cpu:
              description: Multi-stage pipelined, feature-rich RISC-V (in-order issue, may writeback OoO via scoreboard).
              examples: [ibex, cv32e40p, cv32e40s, cv32e40x, neorv32, cva6]
            ooo-cpu:
              description: Out-of-order superscalar with register renaming / physical register file.
              examples: [riscv-boom]
        crypto-engine:
          description: Self-contained crypto block (no external protocol; register IO).
          examples: [aes, sha256, sha3, chacha, trng]
          children:
            block-cipher:
              description: Symmetric block cipher core (FIPS 197 / similar).
              examples: [aes]
            hash-function:
              description: Cryptographic hash primitive (FIPS 180 / FIPS 202 / RFC 1321 / RFC 7693).
              examples: [sha256, sha3, blake2s, md5, bitcoin-miner]
              children:
                hash-function-csr:
                  description: SecWorks-family memory-mapped CSR hash core (clk/cs/we/address bus, NAME/CTRL/STATUS/BLOCK/DIGEST registers).
                  examples: [blake2s, sha256, sha512]
                hash-function-streaming:
                  description: Per-byte / per-word streaming hash core; no addressable register file (data_in + data_vld + data_first/data_last dataflow).
                  examples: [md5, freecores-md5]
                hash-function-miner:
                  description: PoW miner combining hash datapath with nonce sweep + golden-nonce detector + vendor debug-window CSRs.
                  examples: [bitcoin-miner, fpgaminer]
            stream-cipher:
              description: Keystream generator (ChaCha / Salsa family).
              examples: [chacha]
            rng:
              description: True / pseudo RNG with entropy source + CSPRNG chain.
              examples: [trng]
        dsp-block:
          description: Fixed-function DSP (FFT, filter).
          examples: [dblclockfft]
        memory-controller:
          description: External memory access (DRAM, Flash, SDR/DDR/SPI-Flash).
          examples: [litedram, core_spiflash]
        network-controller:
          description: Ethernet/PCIe MAC or PHY block.
          examples: [liteeth, verilog-ethernet, verilog-pcie]
        peripheral-timer:
          description: Programmable counter/timer/PWM (APB-mapped).
          examples: [apb_timer]
        # v0.79 (E1) — added from k3_class_miner sweep of 234 open-source ICs.
        # crypto-miner candidate is intentionally NOT listed here because
        # bitcoin-miner is already covered by hash-function-miner (C1 split,
        # K1 line 77). The remaining 4 mined classes ARE distinct from any
        # existing K1 entry and earn their own tree position.
        debug-block:
          description: On-chip debug / trace infrastructure (logic analyzer, JTAG-DM, run-control). Operates on internal SoC signals; not a user-facing peripheral.
          examples: [litescope, riscv-dbg]
        display-controller:
          description: Frame-buffer + pixel pipeline driving HDMI/VGA/DisplayPort output. Includes scan-line generators, character ROM blitters, GPU shader pipelines.
          examples: [Xosera, vortex-gpu, hdmi-utils, vga-utils, litevideo]
        root-of-trust:
          description: Hardware root-of-trust SoC — key storage (OTP/PUF), crypto co-processors, secure boot enforcement, attestation. Sits adjacent to crypto-engine but adds boot/attestation policy.
          examples: [caliptra-rtl]
    analog-mixed-ic:
      description: Has analog front end (ADC, comparator, sense amp).
      # Not used by current benchmarks — kept for future.
    soc-harness:
      description: >
        Pre-hardened chip template — padframe, power routing, management SoC,
        housekeeping, and a pre-placed user-project slot ready for tape-out on
        a specific PDK. Not a controller/DSP/bus core in its own right: it is
        the carrier. Fact shape differs substantially from digital-ic.
      examples: [caravel, caravan, caravel_openframe]

# Class resolution order: when spawning subagents, IC Expert picks the most-specific
# class that matches the user's IC, then loads the union of fact templates from the
# root down to that class.
