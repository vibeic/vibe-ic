# analog-front-end — data converters, op-amps, comparators, voltage references.
# Added v0.56 (2026-04-24) after the v0.55 multi-IC validation campaign found
# that ADCs / DACs (e.g. ADS1115) fall through to `any-ic` because no fitting
# class existed. This template covers ICs whose primary function is bridging
# analog signals to a digital interface — sample-and-quantise (ADC), reverse
# (DAC), threshold-compare (comparator), or stable-reference (voltage ref).
class: analog-front-end
parent: any-ic

facts:
  L1:
    - {path: converter_type,                type: string,          required: true,  comment: "ADC | DAC | comparator | voltage_reference | pga | mux_only"}
    - {path: resolution_bits,               type: integer,         required: false, comment: "ADC/DAC: native resolution; comparator: omit"}
    - {path: channel_count,                 type: integer,         required: true,  defaultable: true, default_candidate: 1, comment: "single-ended channels"}
    - {path: differential_capable,          type: boolean,         required: true,  defaultable: true, default_candidate: false}
    - {path: input_voltage_range_v,         type: dict,            required: true,  keys: [min, max], comment: "absolute input range under nominal VREF"}

  L2:
    - {path: sample_rate_sps,               type: integer,         required: false, comment: "ADC: max conversion rate; DAC: max update rate; comparator: response time instead"}
    - {path: response_time_us,              type: number,          required: false, comment: "comparator/PGA: propagation delay; ADC: conversion latency"}
    - {path: power_modes,                   type: list_of_strings, required: true,  defaultable: true, default_candidate: ["normal","power-down"]}
    - {path: digital_interface,             type: string,          required: true,  comment: "I2C | SPI | parallel | none (analog-out)"}
    - {path: gain_stages,                   type: list_of_dicts,   required: false, schema: [stage_name, type, configurable_gains], comment: "PGA, AAF, etc."}
    - {path: comparator_channels,           type: integer,         required: false, comment: "ADCs may include a window comparator alongside the main path"}

  L3:
    # No command-protocol fields — analog-front-end ICs are register-pointer
    # driven (no opcode bytes, no CRC). Use the v0.56 no-protocol sentinel:
    # L3_CMD_PROTOCOL.json should set {"protocol_present": false,
    # "reason": "register-pointer access only — analog front-end"}.
    - {path: protocol_present,              type: boolean,         required: true,  defaultable: true, default_candidate: false, comment: "false for analog-front-end ICs whose digital interface is bus-driven register access (I2C/SPI), not command-protocol-driven"}

  L4:
    - {path: register_map,                  type: list_of_dicts,   required: true,  schema: [pointer, name, access, reset_value, description], comment: "Pointer-addressed registers (CONVERSION, CONFIG, LO_THRESH, HI_THRESH on ADS1115-style)"}
    - {path: pointer_register_present,      type: boolean,         required: true,  defaultable: true, default_candidate: true, comment: "ADS1115/MCP3xxx style: 8-bit pointer selects which register the next read/write hits"}
    - {path: i2c_address_pin_count,         type: integer,         required: false, comment: "ADS1115 has 4 selectable addresses via ADDR pin"}
    - {path: spi_chip_select_count,         type: integer,         required: false}

  L5:
    - {path: reference_source,              type: string,          required: true,  comment: "internal | external_pin | supply_ratio"}
    - {path: reference_voltage_v,           type: number,          required: false, comment: "internal Vref nominal value"}
    - {path: input_filter_type,             type: string,          required: false, defaultable: true, default_candidate: "none", comment: "none | RC-AAF | switched-cap | ΔΣ-modulator"}
    - {path: input_impedance_ohm,           type: number,          required: false, comment: "for high-impedance ADC inputs"}
    - {path: alert_pin_present,             type: boolean,         required: true,  defaultable: true, default_candidate: false, comment: "comparator-style alert/ready output (ADS1115 ALERT/RDY)"}
    - {path: alert_polarity,                type: string,          required: false, defaultable: true, default_candidate: "active-low", comment: "active-low | active-high | latching"}

  L6:
    - {path: submodule_control_logic,       type: list_of_dicts,   required: true,  schema: [name, role], comment: "input mux + reference + conversion engine + comparator + register file"}

  L7:
    - {path: factory_trim_modes,            type: list_of_strings, required: false, comment: "wafer-probe trim of internal Vref / offset"}
    - {path: built_in_self_test,            type: list_of_strings, required: false, defaultable: true, default_candidate: [], comment: "loopback test channel etc."}

  L8:
    - {path: conversion_timing,             type: dict,            required: true,  keys: [tcnv_min_us, tcnv_max_us], comment: "tCNV — analog conversion time at max sample rate"}
    - {path: settling_time_us,              type: number,          required: false, comment: "for full-scale step at PGA / mux change"}
    - {path: digital_interface_timing,      type: dict,            required: false, comment: "I2C: t_low/t_high; SPI: t_setup/t_hold (mirrored from L3 if present)"}

  L8R:
    - {path: clock_frequency_hz,            type: integer,         required: true,  comment: "internal oscillator or external SCK"}
    - {path: conversion_cycles,             type: integer,         required: false, derives_from: "L8.conversion_timing.tcnv_max_us * L8R.clock_frequency_hz / 1e6"}

  L9:
    - {path: pad_list,                      type: list_of_strings, required: true,  comment: "AINx (analog) + SDA/SCL or SDI/SDO/SCK + ADDR + ALERT/RDY + VDD/GND/VREF"}
    - {path: power_domains,                 type: list_of_strings, required: true,  defaultable: true, default_candidate: ["AVDD","DVDD","AGND","DGND"]}

# -----------------------------------------------------------------------------
# spec_floor — quantitative minimums enforced by phase1_quality_parity_check.py
# -----------------------------------------------------------------------------
spec_floor:
  # Analog-front-end ICs are usually register-driven not opcode-driven;
  # L3 opcode floor is intentionally omitted (use the no-protocol sentinel).
  L4_regmap_reg_count_min: 2           # at minimum: CONFIG + DATA / CONVERSION
  L6_submodule_count_min: 4            # mux + reference + converter + register-file
  L9_top_level_port_count_min: 8       # AIN0..3 + SDA/SCL + ADDR + ALERT + VDD/GND/VREF
  L9_internal_wire_count_min: 10

  # Phase 1 extension layers
  L10_test_cases_min: 5                # FS-input / zero / mid / threshold-cross / power-down
  L10_cmd_response_min: 3              # CONVERSION-read / CONFIG-write / threshold-write
  L11_calibration_tables_min: 1        # offset / gain trim table
  L12_sequences_min: 1                 # one-shot vs continuous mode entry
  L12_required_sequence_categories:
    - mode_switch_sequence

  # L13 attestation criterion is `monotonic_adc_sweep` (declared via the
  # generic L13 mechanism added in v0.56 B4) — reading 10 distinct
  # non-padding bytes is meaningless for an ADC reading a DC signal.

# -----------------------------------------------------------------------------
# sequence_naming — used by l12_tb_coverage_check.py
# -----------------------------------------------------------------------------
sequence_naming:
  strip_suffixes:
    - sequence
    - mode
    - entry
