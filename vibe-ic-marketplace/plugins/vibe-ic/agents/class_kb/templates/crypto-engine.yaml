# crypto-engine — register-mapped cryptographic primitive.
# Covers block-cipher (aes), hash-function (sha256, sha3), stream-cipher (chacha), rng (trng).
# Crypto cores typically have no L3 (no framed protocol) — L3 is OMITTED.
class: crypto-engine
parent: digital-ic

facts:
  L1:
    - {path: crypto_family,                 type: string,          required: true,  comment: "block-cipher | hash-function | stream-cipher | rng"}
    - {path: algorithm_name,                type: string,          required: true,  comment: "AES / SHA-256 / SHA-3 / ChaCha / HSM-TRNG"}
    - {path: standard_reference,            type: string,          required: false, comment: "FIPS-197 / FIPS-180-4 / FIPS-202 / Bernstein-2008 / NIST SP800-90"}
    - {path: block_width_bits,              type: integer,         required: true,  comment: "128 (AES), 512 (SHA-256 block), 512 (ChaCha keystream block), etc."}
    - {path: digest_width_bits,             type: integer,         required: false, comment: "Hash only: 224/256/384/512"}
    - {path: key_width_bits,                type: integer,         required: false, comment: "128/256 — omit for hash"}
    - {path: iv_nonce_width_bits,           type: integer,         required: false, comment: "Stream/RNG only"}

  L2:
    - {path: rounds,                        type: integer,         required: true,  comment: "AES-128=10, AES-256=14, SHA-256=64, ChaCha=8..32, Keccak=24"}
    - {path: mode_select,                   type: list_of_strings, required: false, comment: "ENC/DEC, SHA224/SHA256, SHA3-{224,256,384,512}"}
    - {path: hw_padding,                    type: boolean,         required: true,  comment: "True if core pads input; false means caller must pad (SHA-256 wrapper)"}

  L4:
    - {path: register_map,                  type: list_of_dicts,   required: true,  schema: [offset, name, access, width_bits, description], comment: "NAME/VERSION/CTRL/STATUS/KEY/BLOCK/RESULT…"}
    - {path: bus_interface_family,          type: string,          required: true,  comment: "custom-memory-bus | AXI4-Lite | streaming | wishbone"}
    - {path: ctrl_bits,                     type: list_of_strings, required: true,  comment: "e.g. INIT, NEXT, MODE, KEYLEN"}
    - {path: status_bits,                   type: list_of_strings, required: true,  comment: "READY, VALID, ERROR"}

  L5:
    - {path: datapath_style,                type: string,          required: true,  comment: "iterative | unrolled | pipelined"}
    - {path: throughput_cycles_per_block,   type: integer,         required: true,  comment: "AES=46, SHA-256=66, ChaCha=rounds+3"}
    - {path: parallelism_factor,            type: integer,         required: false, comment: "e.g. 4 S-boxes, 4 quarter-rounds"}
    - {path: interface_type,                type: string,          required: true,  comment: "single-buffered | double-buffered | streaming"}

  L8R:
    - {path: side_channel_protection,       type: dict,            required: true,  keys: [dpa_masking, fault_detection, constant_time], comment: "All three typically false for open-source AES/SHA/ChaCha"}
    - {path: implementation_status,         type: string,          required: true,  defaultable: true, default_candidate: "production", comment: "production | draft | incomplete — sha3 flagged INCOMPLETE"}
    - {path: entropy_sources,               type: list_of_dicts,   required: false, comment: "rng subclass only — {type, whitening, health_tests}"}
    - {path: reseed_policy,                 type: dict,            required: false, comment: "rng subclass only — {warmup_bits, reseed_interval_blocks}"}

spec_floor:
  L10_test_cases_min: 10
  L10_cmd_response_min: 4
  L11_calibration_tables_min: 1
  L12_sequences_min: 2
  L12_required_sequence_ids:
    - RESET_TO_READY
    - NORMAL_OPERATION
  L6_submodule_count_min: 3
  L9_top_level_port_count_min: 6

# -----------------------------------------------------------------------------
# sequence_naming — added v0.57 D5 for l12_tb_coverage_check
# -----------------------------------------------------------------------------
# Crypto-engine L12 sequences typically end in _ROUND / _SCHEDULE /
# _FINALIZE / _ZEROIZE / _KEYLOAD / _ENCRYPT / _DECRYPT. Stripping these
# lets a sequence named `AES_KEY_SCHEDULE` match `tb_aes_key.v` or
# `tb_key_schedule.v`.
sequence_naming:
  strip_suffixes:
    - schedule
    - round
    - finalize
    - zeroize
    - keyload
    - encrypt
    - decrypt
