# memory-controller — external memory access core (DRAM / Flash / EEPROM).
# Covers three sub-styles via memory_subclass:
#   dram-controller      — DDR/LPDDR/SDR (LiteDRAM-style)
#   flash-controller     — SPI-Flash / NOR / NAND (core_spiflash-style)
#   serial-eeprom        — I²C / SPI / Microwire EEPROM (24LC, 25LC, 93LC)
# v0.57 D3: facts: rewritten to support all three sub-styles. Previously
# the schema was DRAM-only and forced commodity I²C EEPROMs (24LC256,
# AT24Cxx) into nonsensical fields (refresh_scheme, bank_machine_count,
# phy_frequency_ratio). EEPROM-specific fields now first-class.
class: memory-controller
parent: digital-ic

facts:
  L1:
    - {path: memory_type,                   type: string,          required: true,  comment: "DDR | DDR2 | DDR3 | DDR4 | LPDDR | LPDDR4 | LPDDR5 | SDR | RPC | SPI-Flash | NOR | NAND | I2C-EEPROM | SPI-EEPROM | MICROWIRE-EEPROM"}
    - {path: memory_subclass,               type: string,          required: true,  defaultable: true, default_candidate: "auto", comment: "Derived from memory_type when 'auto': dram-controller | flash-controller | serial-eeprom"}
    - {path: memory_standard,               type: string,          required: false, comment: "JEDEC reference (DRAM/Flash) or vendor SPI/I2C protocol page (EEPROM)"}
    - {path: capacity_bits,                 type: integer,         required: true,  comment: "Total addressable bits — used to derive address_width and validate page_size_bytes"}
    - {path: phy_frequency_ratio,           type: string,          required: false, defaultable: true, default_candidate: "1:2", comment: "DRAM-only; 1:2 or 1:4 (LiteDRAM PHY). Set null for Flash/EEPROM."}

  L2:
    - {path: data_width,                    type: integer,         required: true,  comment: "User-side data bus width in bits (DRAM/Flash); 8 for byte-addressable EEPROM."}
    - {path: addr_width,                    type: integer,         required: true,  comment: "User-side address width in bits"}
    - {path: user_interface,                type: string,          required: true,  comment: "Native | AXI-MM | Wishbone | Avalon | bus-driven (EEPROM = bus-driven)"}
    - {path: phy_interface,                 type: string,          required: true,  comment: "DFI | SPI-pads | QSPI | I2C | Microwire | direct"}

  L4:
    # ----- DRAM-specific fields -----
    - {path: address_mapping,               type: string,          required: false, condition: "memory_subclass == dram-controller", defaultable: true, default_candidate: "ROW_BANK_COL", comment: "DRAM only: ROW_BANK_COL, BANK_ROW_COL, etc."}
    - {path: refresh_scheme,                type: dict,            required: false, condition: "memory_subclass == dram-controller", keys: [periodic, postponed_max, zq_short_calibration], comment: "DRAM only — set null for Flash/EEPROM"}
    - {path: bank_machine_count,            type: integer,         required: false, condition: "memory_subclass == dram-controller", comment: "DRAM only — per-bank FSMs"}
    - {path: command_depth,                 type: integer,         required: false, defaultable: true}
    # ----- Flash-specific fields -----
    - {path: sector_erase_size_bytes,       type: integer,         required: false, condition: "memory_subclass == flash-controller", comment: "NOR/NAND erase granularity"}
    - {path: erase_cycles_max,              type: integer,         required: false, comment: "Vendor-rated endurance (typ. 100k for EEPROM, 100k-1M for NOR)"}
    # ----- EEPROM-specific fields (v0.57 D3) -----
    - {path: page_size_bytes,               type: integer,         required: false, condition: "memory_subclass == serial-eeprom", comment: "EEPROM page size — write granularity. 24LC256 = 64 bytes, 24LC1024 = 128 bytes."}
    - {path: write_cycle_ms,                type: number,          required: false, condition: "memory_subclass == serial-eeprom", comment: "tWC — internal write cycle time. Used to derive ack_poll_timeout_ms."}
    - {path: ack_poll_semantics,            type: string,          required: false, condition: "memory_subclass == serial-eeprom", defaultable: true, default_candidate: "i2c-ack-polling", comment: "i2c-ack-polling | spi-status-poll | none — how host detects internal-write completion"}
    - {path: wp_pin_behavior,               type: string,          required: false, condition: "memory_subclass == serial-eeprom", defaultable: true, default_candidate: "active-high-blocks-write", comment: "Hardware write-protect pin behaviour"}
    - {path: addressing_scheme,             type: string,          required: false, condition: "memory_subclass == serial-eeprom", defaultable: true, default_candidate: "16-bit-word-addr", comment: "8-bit-word-addr (small EEPROMs) | 16-bit-word-addr (≥512Kbit) | combined-with-device-id"}
    - {path: device_address_pins,           type: integer,         required: false, condition: "memory_subclass == serial-eeprom", comment: "I²C: number of A0-A2 pins selectable on the bus (0-3); SPI: 0 (uses CS)"}

  L5:
    - {path: crossbar_frontend,             type: boolean,         required: false, condition: "memory_subclass == dram-controller", defaultable: true, default_candidate: false, comment: "DRAM-controller front-end multi-port crossbar"}
    - {path: ecc_support,                   type: boolean,         required: true,  defaultable: true, default_candidate: false, comment: "Single-bit ECC (DRAM) or per-page CRC (Flash/EEPROM); applies to all subclasses"}
    - {path: bist_support,                  type: boolean,         required: true,  defaultable: true, default_candidate: false}
    - {path: dma_frontend,                  type: boolean,         required: false, condition: "memory_subclass == dram-controller", defaultable: true, default_candidate: false}

  L8R:
    - {path: generator_framework,           type: string,          required: false, comment: "e.g. LiteX/Migen — emits Verilog per target board (DRAM/Flash); EEPROMs are typically hand-RTL or use a vendor IP"}
    - {path: supported_vendor_phys,         type: list_of_strings, required: false, comment: "Xilinx S7, Artix, Ultrascale, Lattice ECP5, Gowin G2A… (DRAM); SPI bridge cores (Flash); I²C master cores (EEPROM)"}


# -----------------------------------------------------------------------------
# spec_floor — quantitative minimums enforced by phase1_quality_parity_check.py
# -----------------------------------------------------------------------------
# Added v0.56 (2026-04-24) to fix the "vacuous PASS" bug found by the v0.55
# multi-IC validation campaign (24LC256). Numbers chosen as class-median
# across memory-controller training corpus (LiteDRAM, OpenSPIFlash, etc.),
# NOT derived from any single-vendor benchmark IC.
# Memory controllers are wide and shallow — many configurable ports, modest
# protocol opcode count (READ / WRITE / READMOD / REFRESH-class).
spec_floor:
  # Phase 1 extension layers (v0.50)
  L10_test_cases_min: 6                # READ / WRITE / page-cross / refresh / error / reset
  L10_cmd_response_min: 3              # READ-ack / WRITE-ack / status
  L11_calibration_tables_min: 1        # at least the timing-prescaler table
  L12_sequences_min: 1                 # init / training sequence
  L12_required_sequence_categories:
    - initialization_sequence
  # Original L1-L23 floors
  # v0.57 D1: removed L3_opcode_count_min — memory-controller ICs
  # (especially I²C/SPI EEPROMs) use the no-protocol sentinel; an
  # opcode-count floor contradicts that and is caught by
  # no_protocol_consistency_check. DRAM-controller projects that DO have
  # opcode-style commands should pick a more specific sub-class instead
  # of relying on the parent floor.
  # No L3_crc_poly_allowed either — most memory protocols use parity / ACK
  # / page CRC and there's no class-wide poly assumption.
  L4_regmap_reg_count_min: 2           # at minimum: status + control register
  L6_submodule_count_min: 5            # phy + bank_machine + crossbar + refresher + ctl_top
  L9_internal_wire_count_min: 20
  L9_top_level_port_count_min: 12      # data + addr + ctrl + clock + reset

# -----------------------------------------------------------------------------
# sequence_naming — per-class strip_suffixes for l12_tb_coverage_check.py
# -----------------------------------------------------------------------------
# Added v0.56 C2 — every class with L12_required_sequence_categories
# now ships its own strip_suffixes list, so the L12-tb-coverage gate
# can match `tb_<short>.v` files even when the canonical sequence id
# carries one of the conventional suffixes.
sequence_naming:
  strip_suffixes:
    - sequence            # *_SEQUENCE → *
    - chain               # *_CHAIN → *
    - entry               # *_ENTRY → *
    - exit                # *_EXIT → *
    - init                # *_INIT → *
