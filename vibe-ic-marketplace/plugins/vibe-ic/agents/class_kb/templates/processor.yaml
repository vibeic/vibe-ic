# processor — facts beyond any-ic for any instruction-fetching CPU core.
# Covers simple-cpu / feature-cpu / ooo-cpu subclasses.
# Fields synthesised from characterizations of: picorv32, darkriscv, serv,
# ibex, cv32e40p, neorv32, cva6, riscv-boom.
class: processor
parent: digital-ic

facts:
  L1:
    - {path: isa_base,                      type: string,          required: true,  comment: "e.g. RV32I, RV32E, RV32IMC, RV64GCB"}
    - {path: isa_extensions,                type: list_of_strings, required: true,  min_len: 0, comment: "M, C, A, F, D, B, Zicsr, Zifencei, Xcv, Zkn..."}
    - {path: privilege_modes,               type: list_of_strings, required: true,  comment: "M, S, U, H — any subset"}
    - {path: regfile_size,                  type: integer,         required: true,  comment: "32 (RV32I) or 16 (RV32E)"}
    - {path: regfile_width_bits,            type: integer,         required: true,  comment: "32 or 64"}
    - {path: endianness,                    type: string,          required: false, defaultable: true, default_candidate: "little"}

  L2:
    - {path: pipeline_depth,                type: integer,         required: true,  comment: "Stage count (e.g. 2, 3, 4, 6, 7, 10)"}
    - {path: pipeline_style,                type: string,          required: true,  comment: "in-order | scoreboarded | out-of-order | multi-cycle | bit-serial"}
    - {path: issue_width,                   type: integer,         required: true,  defaultable: true, default_candidate: 1}
    - {path: commit_width,                  type: integer,         required: false, defaultable: true}
    - {path: dispatch_order,                type: string,          required: false, comment: "in-order | out-of-order"}
    - {path: writeback_order,               type: string,          required: false, comment: "in-order | out-of-order"}

  L5:
    - {path: bus_interface,                 type: string,          required: true,  comment: "native-valid-ready | OBI | AXI4-Lite | Wishbone | AHB | Harvard-custom"}
    - {path: ibus_separate_from_dbus,       type: boolean,         required: true,  defaultable: true, default_candidate: true}
    - {path: cache_sizes,                   type: dict,            required: true,  keys: [icache_bytes, dcache_bytes, icache_ways, dcache_ways], comment: "Use 0 when absent"}
    - {path: branch_predictor,              type: string,          required: false, comment: "none | static | BHT | TAGE-L | bimodal | BTB+RAS"}
    - {path: rob_entries,                   type: integer,         required: false, comment: "OoO only; scoreboard depth for cva6"}
    - {path: physical_regfile_size,         type: integer,         required: false, comment: "Set only for renamed OoO cores (BOOM). Null for scoreboarded/in-order."}

  L8:
    - {path: reset_vector,                  type: string,          required: true,  defaultable: true, comment: "PROGADDR_RESET or equivalent"}

  L8R:
    - {path: pmp,                           type: dict,            required: true,  keys: [present, num_regions, granularity_bytes, smepmp], comment: "present=false for cv32e40p/picorv32/serv"}
    - {path: debug_spec_version,            type: string,          required: true,  comment: "none | 0.13.2 | 1.0 | custom"}
    - {path: interrupt_model,               type: string,          required: true,  comment: "CLINT | CLINT+fastIRQ | custom-ISA | Zicsr-only | none"}
    - {path: fast_irq_count,                type: integer,         required: false, defaultable: true, default_candidate: 0}

spec_floor:
  L10_test_cases_min: 12
  L10_cmd_response_min: 8
  L11_calibration_tables_min: 1
  L12_sequences_min: 3
  L12_required_sequence_ids:
    - RESET_TO_READY
    - FETCH_DECODE_EXECUTE
    - INTERRUPT_HANDLING
  L6_submodule_count_min: 4
  L9_top_level_port_count_min: 8

# -----------------------------------------------------------------------------
# sequence_naming — added v0.57 D5 for l12_tb_coverage_check
# -----------------------------------------------------------------------------
# Processor L12 sequences typically end in _BOOT / _INTERRUPT / _CONTEXT_SWITCH
# / _EXCEPTION / _FAULT / _RESET / _IDLE.
sequence_naming:
  strip_suffixes:
    - boot
    - interrupt
    - exception
    - fault
    - context_switch
    - idle
    - sequence
