  irq_count:
    expert:       ["IRQ output count?"]
    intermediate: ["How many interrupt outputs does the block drive?"]
    beginner:     []

  irq_type:
    expert:       ["IRQ type — level / pulse / edge?"]
    intermediate: ["Are the interrupt outputs level-sensitive, pulsed, or edge?"]
    beginner:     []

  irq_clear_mechanism:
    expert:       ["IRQ clear — W1C / W0C / implicit-on-read?"]
    intermediate: ["How does software clear a pending interrupt?"]
    beginner:     []

  set_clr_atomicity:
    expert:       ["Does the block expose set / clr shadow registers for atomic bit ops?"]
    intermediate: ["Are there separate set/clear addresses for atomic RMW-free access?"]
    beginner:     []
