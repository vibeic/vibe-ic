class: protocol-ic
layer: L4
qbank:
  # v0.74 A-implement Phase 1: control_registers_logical → registers
  registers:
    expert:       ["Logical control-register map — offset, name, access (R/W/RW/W1C), reset?"]
    intermediate: ["List every runtime register — address or index, name, read/write permission, and power-up value."]
    beginner:     ["What knobs can software tweak at runtime? Give each a name and say if it's read-only or writable."]
    follow_ups:
      - if_user_says: ["minimal", "basic"]
        respond_with_default: "CTRL/STATUS/CMD/DATA — 4 registers"
      - if_ambiguous: ["I don't know"]
        defer_to_default: true

  document_id:
    expert:       []
    intermediate: []
    beginner:     []
