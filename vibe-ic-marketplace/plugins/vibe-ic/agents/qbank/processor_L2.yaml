  issue_width:
    expert:       ["Issue width?"]
    intermediate: ["Instructions issued per cycle — 1 (scalar), 2 (dual-issue), more?"]
    beginner:     []
    follow_ups:
      - if_ambiguous: []
        defer_to_default: true   # 1

  commit_width:
    expert:       ["Commit width?"]
    intermediate: []
    beginner:     []

  dispatch_order:
    expert:       ["Dispatch order — in-order or out-of-order?"]
    intermediate: []
    beginner:     []

  writeback_order:
    expert:       ["Writeback order — in-order or out-of-order?"]
    intermediate: []
    beginner:     []
