class: bus-controller
layer: L2
qbank:
  data_width:
    expert:       ["Data-bus width (bits)?"]
    intermediate: ["Data path width — 32, 64, 128, 256, 512?"]
    beginner:     []
    follow_ups:
      - if_ambiguous: []
        defer_to_default: true   # 64

  addr_width:
    expert:       ["Address width (bits)?"]
    intermediate: ["Address space — how many bits? 32 = 4 GB."]
    beginner:     []
    follow_ups:
      - if_ambiguous: []
        defer_to_default: true   # 32

  strb_width:
    expert:       ["Strobe width (bits)?"]
    intermediate: []   # derived = data_width/8
    beginner:     []

  id_width:
    expert:       ["ID-tag width (AXI only, bits)?"]
    intermediate: ["AXI transaction-ID width — used for out-of-order completion."]
    beginner:     []

  slave_count:
    expert:       ["S_COUNT — how many downstream slaves?"]
    intermediate: ["Number of slave ports on the bus."]
    beginner:     ["How many end-points does the bus connect to?"]

  master_count:
    expert:       ["M_COUNT — how many upstream masters?"]
    intermediate: ["Number of master ports requesting through this fabric."]
    beginner:     ["How many traffic sources feed into this bus?"]
