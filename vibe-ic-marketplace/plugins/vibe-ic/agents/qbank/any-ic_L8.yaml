  # v0.74 A-implement Phase 1: key renamed to match benchmark
  reset_timing.por_to_first_wake_ready_us:
    expert:       ["POR → first-wake-ready delay (µs)?"]
    intermediate: ["After power-up, how long until the chip is ready to wake?"]
