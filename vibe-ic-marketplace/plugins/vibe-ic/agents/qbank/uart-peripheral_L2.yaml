class: uart-peripheral
layer: L2
qbank:
  oversampling:
    expert:       ["Oversampling factor?"]
    intermediate: ["Receiver oversampling — 8x (verilog-uart) or 16x (classic 16550)?"]
    beginner:     []
    follow_ups:
      - if_ambiguous: []
        defer_to_default: true   # 8

  baud_rate_calc:
    expert:       ["Baud-rate formula (e.g. prescale = Fclk / (baud × oversample))?"]
    intermediate: ["How is the baud prescale derived from the core clock and target baud rate?"]
    beginner:     []
    follow_ups:
      - if_user_says: ["standard"]
        respond_with_default: "prescale = Fclk / (baud * oversampling)"

  prescale_input_style:
    expert:       ["Prescale input style — wire-input / register / parameter?"]
    intermediate: ["Is the prescale fixed at elaboration (parameter), a run-time register, or a wire?"]
    beginner:     []
    follow_ups:
      - if_ambiguous: []
        defer_to_default: true   # wire-input
