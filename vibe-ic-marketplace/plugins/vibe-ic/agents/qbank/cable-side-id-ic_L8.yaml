class: cable-side-id-ic
layer: L8
qbank:
  break_timing.break_low_min_us:
    expert:       ["Break-pulse minimum low width (µs)?"]
    intermediate: ["What's the minimum low time on the bus that the chip treats as a BREAK?"]
    beginner:     []
    follow_ups:
      - if_user_says: ["standard", "IC-A"]
        respond_with_default: "1500 µs (1.5 ms low = BREAK)"
      - if_ambiguous: []
        defer_to_default: true

  reset_timing.por_to_first_wake_ready_us:
    expert:       ["POR → first wake-ready delay (µs)?"]
    intermediate: ["After VBUS powers up, how long until the chip can respond to a WAKE?"]
    beginner:     []
    follow_ups:
      - if_user_says: ["standard"]
        respond_with_default: "500 µs"
      - if_ambiguous: []
        defer_to_default: true
