class: any-ic
layer: L13
# L13 LAB CALIBRATION — has TWO sections:
#   • CONTRACT  (Phase 1 fills) — what counts as real-hardware PASS for THIS IC
#   • EVIDENCE  (Phase 2 fills) — actual hid_tool transcripts + bitstream sha256
# `hardware_pass_attestation_check.py` reads both. Phase 1 only collects the
# contract; the evidence block stays empty until real hardware is reachable.
#
# Path convention (Phase-1 contract part):
#   L13.criterion             — one of {distinct_non_padding_bytes, monotonic_adc_sweep,
#                                memory_readback_match, register_write_read_roundtrip,
#                                comparator_alert_on_threshold}
#   L13.criterion_params.*    — knobs for the chosen criterion
#   L13.tester                — name/model of the lab tester this IC is verified against
#
# Path convention (Phase 2 evidence — DO NOT ask in Phase 1):
#   L13.known_pass_bitstream.{sof_path, sha256, ...}
#   L13.known_pass_transcript.*
qbank:
  criterion:
    expert:       ["L13 criterion type — pick {distinct_non_padding_bytes (cable-side-id default), monotonic_adc_sweep (ADCs), memory_readback_match (EEPROM/Flash), register_write_read_roundtrip (register-driven ICs), comparator_alert_on_threshold (comparators/level-detect)}?"]
    intermediate: ["What 'PASS' looks like for this IC: a varied byte stream, an ADC ramp, a memory write+readback match, register roundtrip, or comparator alert?"]
    beginner:     ["How will you know the chip is working? (varied output / readback match / threshold trip / etc.)"]
    follow_ups:
      - if_user_says: ["adc", "analog-front-end", "analog"]
        respond_with_default: "monotonic_adc_sweep"
      - if_user_says: ["memory", "eeprom", "flash"]
        respond_with_default: "memory_readback_match"
      - if_user_says: ["protocol", "cable-side-id"]
        respond_with_default: "distinct_non_padding_bytes"

  criterion_params.padding_byte:
    expert:       ["For distinct_non_padding_bytes only: which byte is treated as 'no real data'? (e.g. 0x02 for AID-style protocols)"]
    intermediate: ["If using the byte-stream criterion: what byte does the bus default to when nothing's being sent?"]
    beginner:     []
    follow_ups:
      - if_user_says: ["aid", "single-wire id", "cable-id"]
        respond_with_default: "0x02"
      - if_user_says: ["i2c"]
        respond_with_default: "0xFF"

  criterion_params.min_distinct_non_padding:
    expert:       ["Minimum distinct non-padding bytes required to count as PASS? (default 4; cable-side-id-ic uses 10)"]
    intermediate: ["How many distinct non-padding bytes must appear in a single response to count as PASS?"]
    beginner:     []
    follow_ups:
      - if_ambiguous: []
        defer_to_default: true   # 4

  criterion_params.min_samples:
    expert:       ["For monotonic_adc_sweep only: minimum samples in a sweep (default 5)?"]
    intermediate: ["For an ADC: how many samples in a sweep at minimum?"]
    beginner:     []
    follow_ups:
      - if_ambiguous: []
        defer_to_default: true   # 5

  criterion_params.min_pages:
    expert:       ["For memory_readback_match only: minimum write-readback pairs (default 1)?"]
    intermediate: ["For memory: how many pages must round-trip cleanly?"]
    beginner:     []

  tester:
    expert:       ["Lab tester model / name (e.g. 'USB-HID tester protocol tester', 'Keysight 3458A', 'home-built loopback rig')?"]
    intermediate: ["Which physical test instrument verifies this IC?"]
    beginner:     ["What machine in the lab is used to test the chip?"]
    follow_ups:
      - if_ambiguous: []
        defer_to_default: true
