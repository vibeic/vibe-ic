class: any-ic
layer: L1
# v0.74 A-implement Phase 1: keys aligned to K1 any-ic.yaml
# (was: ic_name / overview.purpose / overview.package / overview.key_features / ...)
qbank:
  part_number:
    expert:       ["IC name / part number?"]
    intermediate: ["What is the name or part number of the IC?"]
    beginner:     ["What should we call this chip?"]

  description:
    expert:       ["One-line purpose?"]
    intermediate: ["In one sentence, what does the chip do?"]
    beginner:     ["Describe what the chip is for — imagine explaining to a friend."]

  package:
    expert:       ["Package?"]
    intermediate: ["What package are you targeting? (QFN, WLCSP, BGA, etc.)"]
    beginner:     ["How small does the chip need to be? Any size constraint?"]
    follow_ups:
      - if_user_says: ["small", "tiny", "minimum"]
        respond_with_default: "WLCSP"

  document_id:
    expert:       []  # always defaults
    intermediate: []
    beginner:     []

  source_documents:
    expert:       []   # defaults
    intermediate: []
    beginner:     []
