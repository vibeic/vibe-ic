class: any-ic
layer: L12
# L12 BEHAVIORAL_SEQUENCES — multi-step protocols (engineer-mode unlock,
# CC reset, TestMode HV entry, RX 9-step validation chain, etc.) Each
# sequence has an id, category, ordered steps, and optional pre/postconditions.
# `layer_extension_presence_check.py` enforces presence of required
# CATEGORIES per the class template's spec_floor.L12_required_sequence_categories.
# Path convention: L12.sequences[i].{id, category, description, steps, preconditions, postconditions}
qbank:
  sequences[0].id:
    expert:       ["First behavioural-sequence id (e.g. ENGR_MODE_UNLOCK, CC_RESET_700MS, RX_9_STEP_VALIDATION)?"]
    intermediate: ["Each multi-step protocol gets a short id — what's the first one called?"]
    beginner:     []
    follow_ups:
      - if_user_says: ["no sequences"]
        respond_with_default: "POR_INIT_SEQUENCE"

  sequences[0].category:
    expert:       ["Category — pick from the class template's required categories (validation_chain, host_stimulus_sequence, register_access_sequence, mode_switch_sequence, initialization_sequence, etc.)?"]
    intermediate: ["What kind of sequence is it? Validation chain, host stimulus, register access, mode switch, init?"]
    beginner:     []
    follow_ups:
      - if_user_says: ["init", "boot", "reset"]
        respond_with_default: "initialization_sequence"

  sequences[0].description:
    expert:       ["One-line description (what this sequence does, why it matters)?"]
    intermediate: ["In one sentence — what does this sequence do?"]
    beginner:     []

  sequences[0].steps:
    expert:       ["Ordered list of steps; each {action, args, timing, expected}? Use ≥ 2 steps to qualify as a 'sequence'."]
    intermediate: ["List the steps in order. Each step = `{action: ..., args: ..., timing_us: ..., expected: ...}`. At least 2 steps."]
    beginner:     []
    follow_ups:
      - if_ambiguous: []
        defer_to_default: true

  sequences[0].preconditions:
    expert:       ["Preconditions (state requirements before step 1)?"]
    intermediate: ["Anything that must be true before this sequence starts? (e.g. POR done, awake_state=1)"]
    beginner:     []
    follow_ups:
      - if_ambiguous: []
        defer_to_default: true   # []

  sequences[0].postconditions:
    expert:       ["Postconditions (verifiable state after the last step)?"]
    intermediate: ["What state should hold true once the sequence completes?"]
    beginner:     []
    follow_ups:
      - if_ambiguous: []
        defer_to_default: true   # []
