class: cable-side-id-ic
layer: L8R
# v0.74 E+F-implement: cable-side ID cycle-accurate constants
qbank:
  bit_period_cycles:
    expert:       ["Bit-period cycles = L8.aid_bit_timing.bit_period_us × L8R.clock_frequency_hz?"]
    intermediate: ["How many clock cycles per bit? (derived from bit period × clock)"]
    beginner:     []

  wake_low_min_cycles:
    expert:       ["Minimum wake-low pulse cycles?"]
    intermediate: ["How many cycles of wake-low does the chip need to see before wake is valid?"]
    beginner:     []

  wake_low_max_cycles:
    expert:       ["Maximum wake-low cycles before treating as break?"]
    intermediate: ["At what point does a long low pulse stop being a wake and start being a break?"]
    beginner:     []

  break_low_min_cycles:
    expert:       ["Minimum break-low pulse cycles?"]
    intermediate: ["How long must the break pulse be (in cycles)?"]
    beginner:     []

  rx_to_tx_delay_min_cycles:
    expert:       ["Minimum rx-to-tx turnaround cycles?"]
    intermediate: ["Minimum cycles between receiving the last byte and driving the response?"]
    beginner:     []

  rx_to_tx_delay_max_cycles:
    expert:       ["Maximum rx-to-tx turnaround cycles before host times out?"]
    intermediate: ["Maximum cycles allowed before the host gives up waiting for a response?"]
    beginner:     []

  por_to_ready_cycles:
    expert:       ["POR → ready cycles (OTP autoload + trim locking)?"]
    intermediate: ["How many cycles from power-on to ready?"]
    beginner:     []

  otp_load_cycles:
    expert:       ["OTP auto-load cycle count?"]
    intermediate: ["How many cycles does the OTP autoload take?"]
    beginner:     []
