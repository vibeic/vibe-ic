class: cable-side-id-ic
layer: L2
# v0.74 E+F-implement: cable-side ID specific functional requirements
qbank:
  requirements.wake_latency:
    expert:       ["Max wake latency after VBUS/ID_BUS stimulus (ms)?"]
    intermediate: ["How quickly must the chip wake up after being interrogated?"]
    beginner:     ["How fast does the chip need to respond when the host pokes it?"]

  requirements.authentication_flow:
    expert:       ["Authentication flow — challenge/response? key derivation? read-only vendor ID?"]
    intermediate: ["What makes the host trust this cable — a hardcoded ID, a challenge/response, or something else?"]
    beginner:     ["How does the host know the cable is genuine?"]

  requirements.passthrough_gate:
    expert:       ["CC-passthrough gating — fail-open / fail-closed / timeout-latched?"]
    intermediate: ["When authentication fails, does the cable still pass power/data?"]
    beginner:     ["What happens to the cable's power path if authentication fails?"]
