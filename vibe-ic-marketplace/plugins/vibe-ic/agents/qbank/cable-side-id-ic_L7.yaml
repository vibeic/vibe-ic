class: cable-side-id-ic
layer: L7
qbank:
  example_tester_test_sequence:
    expert:       ["EXAMPLE_TESTER test-sequence steps?"]
    intermediate: ["Is this chip EXAMPLE_TESTER-compatible? If so, list the validation sequence."]
    beginner:     ["Does the cable need to pass a standard test sequence?"]
    follow_ups:
      - if_user_says: ["example_tester", "apple", "mfi"]
        respond_with_default: "52-step sequence: WAKE→ID_QUERY→CAP_READ→AUTH_CHALLENGE→AUTH_RESPONSE→POWER_GRANT (see class_reference)"
      - if_user_says: ["no", "not compatible"]
        respond_with_default: "[]  (not applicable)"
      - if_ambiguous: []
        defer_to_default: true
