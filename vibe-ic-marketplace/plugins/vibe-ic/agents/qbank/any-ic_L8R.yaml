class: any-ic
layer: L8R
qbank:
  clock_frequency_hz:
    expert:       ["Core clock frequency (Hz)?"]
    intermediate: ["What's the core clock speed — in MHz or Hz?"]
    beginner:     ["How fast does the chip tick? (give a rough number, or say 'standard')"]
    follow_ups:
      - if_user_says: ["standard cable-id", "IC-A", "like BENCH-A"]
        respond_with_default: "5_000_000 (5 MHz RC)"
      - if_user_says: ["slow", "low power"]
        respond_with_default: "1_000_000 (1 MHz)"
      - if_user_says: ["fast"]
        respond_with_default: "100_000_000 (100 MHz)"
      - if_ambiguous: []
        defer_to_default: true

  document_id:
    expert:       []
    intermediate: []
    beginner:     []
