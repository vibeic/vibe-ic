class: soc-harness
layer: L1
qbank:
  harness_variant:
    expert:       ["Harness variant — caravel / caravan / caravel_openframe?"]
    intermediate: ["Which Caravel harness — standard caravel, analog-capable caravan, or openframe?"]
    beginner:     ["Is this a digital-only harness, or does it need analog pads?"]
    follow_ups:
      - if_user_says: ["analog"]
        respond_with_default: "caravan"
      - if_user_says: ["digital"]
        respond_with_default: "caravel"

  pdk_target:
    expert:       ["PDK target — sky130A / sky130B / sg13g2 / gf180mcuC?"]
    intermediate: ["Which PDK is the tape-out target — SkyWater 130, IHP 130, GlobalFoundries 180?"]
    beginner:     ["What fab process? (sky130 is most common for open silicon)"]
    follow_ups:
      - if_user_says: ["open", "sky", "google", "efabless"]
        respond_with_default: "sky130A"

  license:
    expert:       ["License?"]
    intermediate: []
    beginner:     []
    follow_ups:
      - if_ambiguous: []
        defer_to_default: true   # Apache-2.0
