class: apb-peripheral
layer: L1
qbank:
  apb_spec_version:
    expert:       ["APB spec version — APB2 / APB3 / APB4?"]
    intermediate: ["Which APB revision — APB3 (with PREADY/PSLVERR) or APB4 (adds PPROT/PSTRB)?"]
    beginner:     []
    follow_ups:
      - if_ambiguous: []
        defer_to_default: true   # APB3

  apb_addr_width:
    expert:       ["PADDR width (bits)?"]
    intermediate: ["How many bits of address does the slave decode? (12 = 4 KB window)"]
    beginner:     []
    follow_ups:
      - if_ambiguous: []
        defer_to_default: true   # 12

  apb_data_width:
    expert:       ["PWDATA/PRDATA width (bits)?"]
    intermediate: ["Data bus width — 32 is typical."]
    beginner:     []
    follow_ups:
      - if_ambiguous: []
        defer_to_default: true   # 32
