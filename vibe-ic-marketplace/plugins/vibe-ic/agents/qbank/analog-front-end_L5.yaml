class: analog-front-end
layer: L5
# v0.74 E+F-implement: AFE reference, impedance, alert pin
qbank:
  reference_source:
    expert:       ["Internal bandgap / external VREF / ratiometric to VDD?"]
    intermediate: ["Where does the voltage reference come from — internal or external?"]
    beginner:     ["Does the chip need an external reference voltage?"]

  reference_voltage_v:
    expert:       ["VREF nominal value (V)?"]
    intermediate: ["What reference voltage does it use — 1.024, 2.048, 4.096 V?"]
    beginner:     []

  input_impedance_ohm:
    expert:       ["Input impedance at DC (Ω)?"]
    intermediate: ["What's the input impedance of each analog pin?"]
    beginner:     []

  input_filter_type:
    expert:       ["Built-in input filter type (RC / switched-cap / sigma-delta / none)?"]
    intermediate: ["Any built-in anti-alias or input filter?"]
    beginner:     []

  alert_pin_present:
    expert:       ["ALERT/INT output pin present?"]
    intermediate: ["Does the chip have an alert or interrupt output pin?"]
    beginner:     ["Does the chip ever tell the host something — like 'threshold crossed'?"]

  alert_polarity:
    expert:       ["ALERT polarity — active-low / active-high / open-drain?"]
    intermediate: ["When the alert triggers, does the pin go low or high?"]
    beginner:     []
