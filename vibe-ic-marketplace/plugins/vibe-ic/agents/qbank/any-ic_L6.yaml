class: any-ic
layer: L6
qbank:
  submodule_control_logic:
    expert:       ["Submodule map — name → {purpose, FSM states, key signals}?"]
    intermediate: ["Break the chip into sub-blocks. For each, name it, describe what it does, and list its main states or modes."]
    beginner:     ["What are the big parts inside the chip? Give each a name and one-line purpose."]
    follow_ups:
      - if_user_says: ["standard", "typical", "IC-A"]
        respond_with_default: "Apply class_reference submodule list (see L6 class template)"
      - if_ambiguous: ["I don't know"]
        defer_to_default: true

  document_id:
    expert:       []
    intermediate: []
    beginner:     []
