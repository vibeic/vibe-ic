# K3 — Class-Reference Defaults
# ------------------------------
# Per-class "typical reference" values. Each entry cites a public reference IC
# or paper. Used when a default needs to match an IC class but isn't an
# open industry standard.

cable-side-id-ic:
  # Generic class. The plugin does NOT bundle any specific vendor's
  # datasheet — values below are common across multiple public single-wire
  # ID controllers (USB Type-C E-marker chips, 1-Wire ID ROMs, generic
  # cable-plug authentication ICs).
  reference: "Generic single-wire cable-plug ID controller"
  public_source: "Multiple public single-wire ID specs (USB Type-C E-marker, 1-Wire family); no vendor copy bundled."
  typical_otp_bytes: 128
  typical_pin_count: 14
  typical_osc_mhz: 5
  typical_package: "WLCSP or equivalent"
  typical_process: "180 nm"

  # v0.74 post-IC-A auto-run-loop feedback: generalised class structure
  # the loop surfaced. Values here are CLASS-TYPICAL CONCEPT NAMES, not
  # specific vendor numbers. IC Expert uses this block to default the
  # shape of a cable-side-id-ic design when the user / persona leaves
  # layers unspecified. NEVER record IC-specific values here — those go
  # to a subclass (e.g. cable-side-id-ic-maxim-style) or to the user's
  # own project facts.yaml.
  typical_structure:
    L1_datasheet:
      typical_pin_roles: [VBUS, GND, ID_BUS, CC_I, CC_O, TEST1, TEST2, NC]
      typical_package_families: [DFN-8, "WLCSP-6 to -14"]
      typical_supply_range_vbus: "single-input from cable power, wide 4-22 V"
      typical_supply_internal: "LDO-derived 1.8 V digital core"
      typical_esd_floor: "≥ 8 kV HBM on every exposed pad"
      typical_operating_temp_range: "-20 °C to +85 °C (consumer / phone)"
      typical_standby_current: "< 1 µA deep sleep"
      typical_active_current: "a few mA during authentication"

    L2_requirements:
      typical_functional_requirements:
        - {concept: "wake_latency_bound",   hint: "single-digit ms after ID_BUS stimulus"}
        - {concept: "authentication_flow",  hint: "challenge-response OR read-only vendor ID"}
        - {concept: "fault_handling",       hint: "silent-drop on CRC fail / framing error"}
        - {concept: "passthrough_gate",     hint: "CC line gated until auth succeeds"}
        - {concept: "sleep_when_unplugged", hint: "zero power when VBUS absent"}

    L3_cmd_protocol:
      typical_phy:
        encoding: "single-wire pulse-width modulated (bit0/bit1 differ in low-time duration)"
        byte_order: "LSB_first (1-Wire family) or MSB_first (AID family)"
        wake_prefix_required: true
        break_prefix_required: true
      typical_crc: "CRC-8, polynomial from L3_crc_poly_allowed whitelist (0x31 MAXIM, 0x07 CCITT, 0x1D SAE-J1850)"
      typical_command_count: "8-16 commands, read-dominant"
      typical_command_roles:
        - read_vendor_id
        - read_part_id
        - read_serial
        - read_status
        - write_control_or_reset
        - engineer_mode_entry
        - optional_otp_read
        - optional_test_mode_exit

    L4_regmap:
      typical_otp_size_bytes: "64-256; byte-addressable"
      typical_otp_autoload: "at POR, pre-populates runtime regs and trim codes"
      typical_runtime_reg_count: "2-8 (STATUS, CTRL, TEST_MODE, ENGR_KEY or similar)"
      typical_otp_sections:
        - vendor_id
        - part_id
        - serial_number
        - cable_capability_word
        - current_rating_word
        - trim_codes
        - lock_bits
        - otp_crc
      # v0.79 BENCH-A enhance-loop: canonical otp_regions[] + runtime_regs[]
      # ordering (typical 11-entry OTP map + 12-entry runtime reg file).
      typical_otp_regions_canonical_order:
        - {region: ID,        typical_addr_bytes: "[0x00..0x05]"}
        - {region: MSN,       typical_addr_bytes: "[0x06..0x0B]"}
        - {region: ASN,       typical_addr_bytes: "[0x0C..0x11]"}
        - {region: LK,        typical_addr_bytes: "[0x12..0x17]"}
        - {region: FCH,       typical_addr_bytes: "[0x18..0x1D]"}
        - {region: SMA,       typical_addr_bytes: "[0x1E..0x23]"}
        - {region: RESERVED,  typical_addr_bytes: "[0x24..0x2F]"}
        - {region: REG0,      typical_addr_bytes: "[0x30..0x37]"}
        - {region: IDINFO,    typical_addr_bytes: "[0x38..0x3F]"}
        - {region: DEV_INFO,  typical_addr_bytes: "[0x40..0x47]"}
        - {region: TAIL,      typical_addr_bytes: "[0x48..0x7F]"}
      typical_runtime_regs_canonical_order:
        - {reg: out1}        # output1 control bit
        - {reg: rd_enb}      # read-detect enable mirror
        - {reg: cc_en}       # CC passthrough enable
        - {reg: awake}       # awake-state observable
        - {reg: eng_mode}    # engineer-mode active
        - {reg: test_mode}   # test-mode active
        - {reg: ph}          # PHY-state (host visibility)
        - {reg: pt}          # pin-test mux index
        - {reg: rx_state}    # RX FSM observability
        - {reg: cc_rst_cnt}  # CC reset counter
        - {reg: ito_cnt}     # tITO inactivity timer counter
        - {reg: tsrs_cnt}    # tSRS inter-frame timer counter

    L6_control_logic:
      # ≥ 10 submodules typical; L6_submodule_count_min floor is 6.
      typical_submodules:
        - {name: pad_ctrl, purpose: "pin multiplexing + ESD + scan overlay"}
        - {name: dclk,     purpose: "digital clock gen / gating"}
        - {name: drst,     purpose: "digital reset tree"}
        - {name: rx_phy,   purpose: "bit-decode (pulse width → bit)"}
        - {name: tx_phy,   purpose: "bit-encode (bit → pulse)"}
        - {name: rx_chk,   purpose: "CRC + framing validation"}
        - {name: rx_cmd,   purpose: "opcode decode + dispatch"}
        - {name: mac,      purpose: "top-level command state machine"}
        - {name: otp_ctrl, purpose: "OTP autoload + protection"}
        - {name: gen_wake, purpose: "wake-pulse detector / timer"}
        - {name: cc_ctrl,  purpose: "CC passthrough gate (USB-C variant)"}
      # v0.79 BENCH-A enhance-loop: canonical fsms[].name ordering for L6.
      typical_fsms_canonical_order:
        - {name: rx_phy_fsm,        states: [IDLE, LOW, CLASSIFY, BIT_DONE], desc: "Watch id_bus_rx; LOW pulse duration counted in rx_clk; classify into H1/H0/BR by window thresholds"}
        - {name: rx_cmd_fsm,        states: [IDLE, LEN, OPCODE, PAYLOAD, CRC_RX, DONE, ERR], desc: "Frame-level command parser: assemble OPCODE + PAYLOAD + CRC bytes from rx_phy bit stream; gate on CRC verify"}
        - {name: mac_fsm,           states: [IDLE, DECODE, EXEC, RESPONSE, IBT_PAUSE], desc: "Top-level command state machine; dispatch by opcode group, sequence response packet, hold IBT before next command"}
        - {name: tx_phy_fsm,        states: [IDLE, START, BIT, IBT, DONE], desc: "Drive id_bus_tx with PWM bit pattern; IBT high cycles between bytes; encode H1/H0/BR per spec"}
        - {name: wake_ctrl_fsm,     states: [DEEP_SLEEP, WAKE_DETECTED, AWAKE, ITO_TIMEOUT], desc: "Wake-pulse detector + tITO inactivity timer; gate awake-only commands"}
        - {name: cc_reset_fsm,      states: [ARMED, COUNTING, RESET_DONE], desc: "Long CC_Reset timer (700 ms) when host initiates cable disable"}
        - {name: disc_detect_fsm,   states: [PLUGGED, BUS_HV_DROP, UNPLUGGED], desc: "Host-disconnect detector; transition to deep-sleep on VBUS removal"}
        - {name: eng_mode_fsm,      states: [LOCKED, KEY1_RX, KEY2_RX, ENG_UNLOCKED], desc: "Engineer-mode unlock state machine; gated on ENG_KEY1/ENG_KEY2 pair"}
        - {name: test_mode_fsm,     states: [LOCKED, ARMED, ACTIVE], desc: "Test-mode entry via CMD_EC + bit pattern; opens scan / ATPG / dft observation paths"}

    L8_timing:
      typical_timing_groups:
        - {group: "aid_bit_timing",  fields: "bit_period_us + bit0_low_us + bit1_low_us + IBT_us"}
        - {group: "wake_timing",     fields: "wake_low_min_us + wake_low_max_us"}
        - {group: "break_timing",    fields: "break_low_min_us + break_low_max_us"}
        - {group: "response_timing", fields: "rx_to_tx_delay_us_min + rx_to_tx_delay_us_max"}
        - {group: "reset_timing",    fields: "por_to_first_wake_ready_us + soft_reset_to_ready_us + break_to_ready_us"}

    L8R_rtl_constants:
      typical_constant_count: "30-50"
      # v0.79 BENCH-A enhance-loop: canonical L8R `constants` list ordering
      # for cable-side-id-ic. The agent's per-layer fill emits constants[]
      # in exactly this order. Names are universal (CRC-8/MAXIM idiom +
      # standard PWM bit-encoding nomenclature); specific cycle values
      # remain class-typical defaults that an IC may override.
      typical_constants_canonical_order:
        # CRC-8/MAXIM init + reflected polynomial (universal for cable-side-id with 1-Wire-style framing)
        - {name: CRC_INIT,       typical_value: "8'hFF",     desc: "CRC-8/MAXIM init"}
        - {name: CRC_POLY_REF,   typical_value: "8'h8C",     desc: "Reflected polynomial"}
        # Clock dividers (50 MHz extbus → 2.5 MHz rx / 5 MHz core is canonical)
        - {name: RX_CLK_DIV,     typical_value: "20",        desc: "50 MHz → 2.5 MHz rx clock divider"}
        - {name: CORE_CLK_DIV,   typical_value: "10",        desc: "50 MHz → 5 MHz core clock divider"}
        # RX bit-window thresholds (PWM low-time discrimination)
        - {name: H1_LOW_MIN,     typical_value: "8'd1",      desc: "RX H1 low count min @ 2.5 MHz"}
        - {name: H1_LOW_MAX,     typical_value: "8'd9",      desc: "RX H1 low count max"}
        - {name: H0_LOW_MIN,     typical_value: "8'd10",     desc: "RX H0 low count min"}
        - {name: H0_LOW_MAX,     typical_value: "8'd30",     desc: "RX H0 low count max"}
        - {name: BR_LOW_MIN,     typical_value: "8'd31",     desc: "RX BR low count min"}
        - {name: BR_LOW_MAX,     typical_value: "8'd100",    desc: "RX BR low count max (broad so RX is tolerant)"}
        - {name: IBT_HIGH_MIN,   typical_value: "16'd12",    desc: "RX IBT high count min"}
        - {name: WKP_LOW_MIN,    typical_value: "16'd37",    desc: "RX wake-pulse low count min"}
        # TX bit cycle counts (drive PWM out @ 5 MHz)
        - {name: TX_H1_LOW_CYC,  typical_value: "8'd9",      desc: "TX H1 low cycles @ 5 MHz (1.8μs)"}
        - {name: TX_H1_HIGH_CYC, typical_value: "8'd41",     desc: "TX H1 high cycles (8.2μs)"}
        - {name: TX_H0_LOW_CYC,  typical_value: "8'd35",     desc: "TX H0 low cycles (7.0μs)"}
        - {name: TX_H0_HIGH_CYC, typical_value: "8'd15",     desc: "TX H0 high cycles (3.0μs)"}
        - {name: TX_BR_LOW_CYC,  typical_value: "8'd69",     desc: "TX BR low cycles (13.8μs)"}
        - {name: TX_BR_HIGH_CYC, typical_value: "8'd18",     desc: "TX BR high cycles (3.6μs)"}
        - {name: TX_IBT_CYC,     typical_value: "8'd60",     desc: "TX IBT high cycles (12.0μs)"}
        # Spec-defined macro timers (ms-scale)
        - {name: TSRS_CYC,       typical_value: "16'd100",   desc: "tSRS 20μs @ 5 MHz"}
        - {name: TITO_CYC,       typical_value: "24'd25000", desc: "tITO 5 ms"}
        - {name: THD_CYC,        typical_value: "16'd224",   desc: "tHD 44.8μs"}
        - {name: TO2H_CYC,       typical_value: "24'd50000", desc: "tO2H 10 ms"}
        - {name: CC_RESET_CYC,   typical_value: "24'd3500000", desc: "CC_Reset 700 ms"}
        # Vendor opcode bytes (specific values are IC-specific; keep names
        # in canonical order so agents emit a placeholder list of correct
        # length). The 7x and Ex pages are universal cable-side-id idioms.
        - {name: CMD_70, typical_value: "8'h70", desc: "vendor opcode 0x70 (page-7 group)"}
        - {name: CMD_72, typical_value: "8'h72", desc: "vendor opcode 0x72"}
        - {name: CMD_74, typical_value: "8'h74", desc: "vendor opcode 0x74"}
        - {name: CMD_76, typical_value: "8'h76", desc: "vendor opcode 0x76"}
        - {name: CMD_78, typical_value: "8'h78", desc: "vendor opcode 0x78"}
        - {name: CMD_7A, typical_value: "8'h7A", desc: "vendor opcode 0x7A"}
        - {name: CMD_7C, typical_value: "8'h7C", desc: "vendor opcode 0x7C"}
        - {name: CMD_7E, typical_value: "8'h7E", desc: "vendor opcode 0x7E"}
        - {name: CMD_E0, typical_value: "8'hE0", desc: "vendor opcode 0xE0 (page-E group)"}
        - {name: CMD_E2, typical_value: "8'hE2", desc: "vendor opcode 0xE2"}
        - {name: CMD_E4, typical_value: "8'hE4", desc: "vendor opcode 0xE4"}
        - {name: CMD_E6, typical_value: "8'hE6", desc: "vendor opcode 0xE6"}
        - {name: CMD_E8, typical_value: "8'hE8", desc: "vendor opcode 0xE8"}
        - {name: CMD_EA, typical_value: "8'hEA", desc: "vendor opcode 0xEA"}
        - {name: CMD_EC, typical_value: "8'hEC", desc: "vendor opcode 0xEC"}
        # Engineer-mode unlock keys (vendor-specific values; keep names)
        - {name: ENG_KEY1_H, typical_value: "8'h27", desc: "engineer mode unlock key 1, high byte"}
        - {name: ENG_KEY1_L, typical_value: "8'h43", desc: "engineer mode unlock key 1, low byte"}
        - {name: ENG_KEY2_H, typical_value: "8'hA5", desc: "engineer mode unlock key 2, high byte"}
        - {name: ENG_KEY2_L, typical_value: "8'h89", desc: "engineer mode unlock key 2, low byte"}
      # Legacy field families (kept for back-compat with v0.74 callers)
      typical_constant_families:
        timing_cycles:
          - bit_period_cycles
          - bit0_low_cycles
          - bit1_low_cycles
          - wake_low_min_cycles
          - wake_low_max_cycles
          - break_low_min_cycles
          - break_low_max_cycles
          - rx_to_tx_delay_min_cycles
          - rx_to_tx_delay_max_cycles
          - por_to_ready_cycles
          - otp_load_cycles
        mirrors_from_l3:
          - crc8_polynomial   # mirrors L3.frame_format.crc.poly
          - crc8_init         # mirrors L3.frame_format.crc.init
        config_integers:
          - clock_frequency_hz
          - opcode_mask_hi
          - opcode_mask_lo
          - otp_size_bytes
          - regmap_reg_count

    L9_integration:
      typical_top_level_port_count: "≥ 16 (pad-level + test + scan)"
      typical_submodule_instance_count: "≥ 20 (matches L6 decomposition)"
      typical_internal_wire_count: "≥ 24 producer→consumer wires"
      # v0.79 BENCH-A enhance-loop: canonical top-level port ordering.
      # Names are universal cable-side-id snake_case nomenclature.
      typical_top_level_ports_canonical_order:
        - {name: clk_ext_50m,    direction: input,   width: 1,  desc: "External 50 MHz clock"}
        - {name: porb,           direction: input,   width: 1,  desc: "Power-on reset, active-low"}
        - {name: id_bus_rx,      direction: input,   width: 1,  desc: "ID_BUS receive (post-PHY input)"}
        - {name: id_bus_tx,      direction: output,  width: 1,  desc: "ID_BUS transmit (drives pad pull-down)"}
        - {name: id_bus_oe,      direction: output,  width: 1,  desc: "ID_BUS output-enable for tristate"}
        - {name: id_bus_pd,      direction: output,  width: 1,  desc: "ID_BUS weak pull-down enable"}
        - {name: cc_18,          direction: input,   width: 1,  desc: "CC line sense @ 1.8 V domain"}
        - {name: bus_hv,         direction: input,   width: 1,  desc: "VBUS high-voltage detect"}
        - {name: uvlo_18,        direction: input,   width: 1,  desc: "Under-voltage lockout signal"}
        - {name: cc_en,          direction: output,  width: 1,  desc: "CC passthrough gate enable"}
        - {name: rd_enb,         direction: output,  width: 1,  desc: "RX-detect / read-enable"}
        - {name: out1_do,        direction: output,  width: 1,  desc: "Output1 data (engineer mode)"}
        - {name: out2_do,        direction: output,  width: 1,  desc: "Output2 data (engineer mode)"}
        - {name: awake_dbg,      direction: output,  width: 1,  desc: "Awake state debug observability"}
        - {name: eng_mode_dbg,   direction: output,  width: 1,  desc: "Engineer-mode debug observability"}
        - {name: test_mode_dbg,  direction: output,  width: 1,  desc: "Test-mode debug observability"}
      # v0.79 BENCH-A enhance-loop: canonical submodule instance ordering
      # for L9.submodules[].name. Drives Yosys-friendly DTOP synthesis order.
      typical_submodules_canonical_order:
        - u_dclk          # digital clock gen
        - u_drst          # digital reset tree
        - u_pad_ctrl      # pad multiplexing + ESD overlay
        - u_rx_phy        # RX bit decode
        - u_rx_chk        # CRC + framing check
        - u_rx_cmd        # opcode dispatch
        - u_mac           # top-level command FSM
        - u_tx_phy        # TX bit encode
        - u_crc8_rx       # CRC-8 RX checker
        - u_crc8_tx       # CRC-8 TX generator
        - u_gen_wake      # wake pulse generator/detector
        - u_wake_ctrl     # wake state controller
        - u_cc_reset      # CC reset timer
        - u_disc_detect   # disconnect detector
        - u_pt_mux        # pin-test mux for engineer modes
        - u_otp_ctrl      # OTP autoload + protection
        - u_ram128x8      # 128×8 OTP/RAM macro instance
        - u_dis_cnt_ito   # ITO timer counter
        - u_dis_cnt_hd    # tHD timer counter
        - u_spare         # spare bay for late-stage additions
      # v0.79 BENCH-A enhance-loop: canonical L9.modules[] ordering
      # (declared module list, distinct from instance list).
      typical_modules_canonical_order:
        - bench_a_top
        - a3616_top
        - dclk
        - drst
        - pad_ctrl
        - our_dtop
        - rx_phy
        - rx_chk
        - rx_cmd
        - mac
        - tx_phy
        - crc8
        - gen_wake
        - wake_ctrl
        - cc_reset_ctrl
        - disc_detect
        - pt_mux
        - otp_ctrl
        - ram128x8
        - dis_cnt
        - spare
      # v0.79 BENCH-A enhance-loop: canonical L9.internal_wires[] ordering.
      typical_internal_wires_canonical_order:
        - {name: rx_clk,         width: 1,  desc: "2.5 MHz RX clock from dclk"}
        - {name: core_clk,       width: 1,  desc: "5 MHz core clock from dclk"}
        - {name: porb_sync,      width: 1,  desc: "Synchronised power-on reset"}
        - {name: id_bus_rx_msk,  width: 1,  desc: "RX masked during self-TX (prevents loopback)"}
        - {name: sym_valid,      width: 1,  desc: "rx_phy → rx_chk: bit-symbol valid pulse"}
        - {name: sym_kind,       width: 2,  desc: "rx_phy → rx_chk: symbol class (H1/H0/BR/IDLE)"}
        - {name: cmd_valid,      width: 1,  desc: "rx_cmd → mac: parsed command available"}
        - {name: cmd_op,         width: 8,  desc: "rx_cmd → mac: command opcode byte"}
        - {name: cmd_payload,    width: 256, desc: "rx_cmd → mac: command payload bytes"}
        - {name: cmd_payload_len, width: 8, desc: "rx_cmd → mac: payload length in bytes"}
        - {name: tx_req,         width: 1,  desc: "mac → tx_phy: byte-tx request"}
        - {name: tx_byte,        width: 8,  desc: "mac → tx_phy: byte to send"}
        - {name: tx_last,        width: 1,  desc: "mac → tx_phy: last-byte flag"}
        - {name: tx_done,        width: 1,  desc: "tx_phy → mac: byte-tx complete"}
        - {name: id_bus_tx,      width: 1,  desc: "tx_phy → pad: drive id_bus low"}
        - {name: id_bus_oe,      width: 1,  desc: "tx_phy → pad: drive enable for id_bus"}
        - {name: wake_req,       width: 1,  desc: "wake_ctrl → mac: wake event raised"}
        - {name: rd_enb_ovr,     width: 1,  desc: "test_mode override of rd_enb"}
        - {name: out2_do,        width: 1,  desc: "engineer-mode debug output 2"}
        - {name: otp_addr,       width: 7,  desc: "OTP address bus (128 bytes ≈ 7 bits)"}
        - {name: otp_rdata,      width: 8,  desc: "OTP read data byte"}
        - {name: otp_wdata,      width: 8,  desc: "OTP write data byte"}
        - {name: otp_we,         width: 1,  desc: "OTP write enable"}

    # v0.79 BENCH-A enhance-loop: canonical L5 analog_digital_interfaces[]
    # ordering. ID_BUS family first, then sense pads, then trim/test pads.
    L5_adi_spec:
      typical_analog_digital_interfaces_canonical_order:
        - {signal: ID_BUS_RX,        direction: "A->D"}
        - {signal: ID_BUS_TX,        direction: "D->A"}
        - {signal: ID_BUS_OE,        direction: "D->A"}
        - {signal: ID_BUS_PD,        direction: "D->A"}
        - {signal: EN_DET,           direction: "A->D"}
        - {signal: BUS_HV,           direction: "A->D"}
        - {signal: CLK5M,            direction: "A->D"}
        - {signal: OSC_ENB,          direction: "D->A"}
        - {signal: CC_18,            direction: "A->D"}
        - {signal: UVLO_18,          direction: "A->D"}
        - {signal: CC_EN,            direction: "D->A"}
        - {signal: RD_ENB,           direction: "D->A"}
        - {signal: OUT1_DO,          direction: "D->A"}
        - {signal: OTP_RW,           direction: "D->A"}
        - {signal: OTP_V,            direction: "A->D"}
        - {signal: PORB,             direction: "A->D"}
        - {signal: "BG_TRIM[7:0]",   direction: "D->A"}
        - {signal: "IBIAS_SET[1:0]", direction: "D->A"}
        - {signal: "OSC_TRIM[7:0]",  direction: "D->A"}
        - {signal: OVP,              direction: "A->D"}
        - {signal: OCP,              direction: "A->D"}

    # v0.79 BENCH-A enhance-loop: canonical L7 test_categories[] ordering.
    L7_test_debug:
      typical_test_categories_canonical_order:
        - {cat: per_command_happy_path,       desc: "Send each opcode with valid CRC + valid length; expect spec response"}
        - {cat: per_command_crc_fail,         desc: "Send each opcode with corrupted CRC byte; expect NO response"}
        - {cat: per_command_len_short,        desc: "Drop last byte before CRC; expect NO response"}
        - {cat: per_command_len_extra,        desc: "Append extra payload bytes; expect NO response"}
        - {cat: before_wake,                  desc: "Send commands before wake; only CMD_74 (wake) accepted, others silent"}
        - {cat: back_to_back,                 desc: "Send two valid commands within tIBT window; second must be received correctly"}
        - {cat: reset_recovery,               desc: "Inject soft reset mid-frame; chip recovers to IDLE within tSRS"}
        - {cat: phy_timing,                   desc: "Sweep H1/H0/BR pulse widths through window edges; verify classification"}
        - {cat: wake_suite,                   desc: "Wake-pulse stimulus with various low-time / IBT combinations"}
        - {cat: cc_reset,                     desc: "Long CC_Reset (700 ms) timer accuracy + behavior on early disable"}
        - {cat: disconnect,                   desc: "Host disconnect via VBUS removal; verify deep-sleep transition + leakage budget"}
        - {cat: engineer_mode,                desc: "ENG_KEY1+KEY2 unlock sequence; gated commands only available after"}
        - {cat: crc_unit,                     desc: "Standalone CRC-8/MAXIM unit test with known-answer vectors"}
        - {cat: self_rx_mask,                 desc: "Verify RX masked during self-TX so cable doesn't see its own response"}

    L10_L13_extensions:
      L10_test_cases: "≥ 8 cmd/response vectors; one per major opcode + CRC-fail + unknown-opcode"
      L11_calibration: "pulse_decoder_windows + response_byte1_sampling tables, keyed by clock domain"
      L12_sequences: "≥ 2 multi-step chains (engineer-mode unlock, cc-reset probe, etc.)"
      L13_lab_calibration: "criterion + tester spec; Phase 2 fills evidence"
      # v0.79 BENCH-A enhance-loop: canonical L10 test_cases[].name ordering.
      typical_l10_test_cases_canonical_order:
        # Per-opcode happy-path tests (page 7)
        - CMD_70_set_state
        - CMD_72_get_state
        - CMD_74_wake
        - CMD_74_wake_apple_seed
        - CMD_76_get_vid_pid
        - CMD_78_get_msn
        - CMD_7A_get_asn
        # Per-opcode happy-path tests (page E)
        - CMD_E0_set_eeprom_byte
        - CMD_E2_get_eeprom
        - CMD_E4_get_pwr_status
        - CMD_E6_get_sma
        - CMD_E8_get_factory_hash
        - CMD_EA_get_lockbits
        - CMD_EC_set_testmode_bits
        # Error-path tests
        - ERR_unknown_opcode
        - ERR_odd_opcode
        - ERR_bad_crc
        - ERR_length_short
        - ERR_length_extra
        - ERR_pre_awake_non_74
        - ERR_E2_len_zero
        - ERR_E2_len_32
        - ERR_E0_addr_out_of_range
        # Sequence + analog tests
        - SEQ_wake_from_power_on
        - SEQ_cc_reset_700ms
        - TIMING_tSRS_after_cmd
        - TIMING_TX_pulse_widths
        - ANALOG_host_disconnect
        - ANALOG_testmode_entry_pattern

  # Subclasses may tighten / specialise any of the above. The IC Expert
  # agent SHOULD pick a subclass first (from prompt clues + web search +
  # PM probe) before filling layers — subclass-level fields override the
  # base typical_* values above.
  applicable_subclasses:
    - cable-side-id-ic-apple-lightning   # Apple Lightning cable auth (reverse-eng public)
    - cable-side-id-ic-apple-usb-c-mfi   # Apple USB-C MFi 3.x cable auth
    - cable-side-id-ic-usb-pd-cc         # Pure USB PD e-marker (no proprietary auth)
    - cable-side-id-ic-generic-1wire     # Generic 1-Wire / Maxim-style ID ROM


cable-side-id-ic-apple-lightning:
  # Apple Lightning cable plug-side authenticator. BENCH-A / IC-A / "Vendor"
  # family of chips clone this protocol. Public details below come from
  # community reverse-engineering (e.g. nyansat/lightning, libimobiledevice).
  inherits_from: cable-side-id-ic
  reference: "Apple Lightning cable authenticator (reverse-engineered, MFi-licensed clones)"
  public_source: "Community reverse-engineering: nyansat/lightning-cable, libimobiledevice; NOT official Apple MFi"

  typical_protocol_summary: >
    Single-wire half-duplex on ID_BUS pin. Phone (host) issues WAKE low
    pulse → cable replies WAKE_ACK → host transmits 1-byte opcode (0x70-0x7E
    primary command space, 0xE0-0xEC engineer/debug space) + 0..N-byte
    payload + CRC-8/MAXIM. Cable returns response opcode + payload + CRC-8.
    Authentication must complete before chip releases cc_gate_en signal.

  typical_l3_opcodes_canonical:
    - {op: 0x70, name: SET_STATE,            role: "Drive OUT1/OUT2 latched outputs (payload[0] = AND-mask)"}
    - {op: 0x71, name: GET_STATE_RESPONSE,   role: "Cable→host response to opcode 0x70"}
    - {op: 0x72, name: READ_VENDOR_ID,       role: "Return 4-byte vendor identifier from OTP"}
    - {op: 0x74, name: WAKE_APPLE_SEED,      role: "Apple-specific wake/seed-fetch sequence"}
    - {op: 0x76, name: READ_OTP_BYTE,        role: "Read one OTP byte at payload[0] address"}
    - {op: 0x78, name: AUTH_CHALLENGE,       role: "Apple challenge bytes; cable computes signed response"}
    - {op: 0x7A, name: TEST_MODE_PROBE,      role: "Engineer test-mode probe (gated by ENG_KEY1/2)"}
    - {op: 0x7C, name: CC_PASSTHROUGH_CTRL,  role: "Enable/disable CC line passthrough"}
    - {op: 0x7E, name: STATE_QUERY,          role: "Query current FSM state for debug"}
    - {op: 0xE0, name: ENG_KEY1_PROBE,       role: "Engineer key 1 challenge (4 bytes)"}
    - {op: 0xE2, name: ENG_KEY2_PROBE,       role: "Engineer key 2 challenge (4 bytes)"}
    - {op: 0xE4, name: ENG_OTP_DUMP,         role: "Engineer-mode OTP dump (region-gated)"}
    - {op: 0xEC, name: ENG_RESET_COUNTERS,   role: "Reset disconnect/discovery counters"}

  typical_l8_crc:
    polynomial: "0x31"
    init: "0x00"
    width_bits: 8
    name: "CRC-8/MAXIM (Dallas/1-Wire)"

  typical_l8_timing_us:
    bit_period_us: 50           # 20 kHz ID_BUS PWM
    wake_low_min_us: 100
    wake_low_max_us: 1000
    break_low_min_us: 2000
    rx_to_tx_delay_min_us: 30
    rx_to_tx_delay_max_us: 200
    por_to_first_wake_ready_us: 500

  typical_l4_otp_regions:
    - {addr: 0x00, size: 4,  name: VENDOR_ID,       desc: "4-byte vendor identifier"}
    - {addr: 0x04, size: 4,  name: MODEL_SERIAL,    desc: "Per-cable model serial"}
    - {addr: 0x08, size: 8,  name: ASSEMBLY_SERIAL, desc: "Assembly batch serial"}
    - {addr: 0x10, size: 1,  name: LOCK_FLAGS,      desc: "Region lock bits"}
    - {addr: 0x20, size: 32, name: APPLE_PUBKEY,    desc: "Apple-side public key signature"}
    - {addr: 0x60, size: 1,  name: AND_MASK_OUT1,   desc: "AND-mask applied to opcode 0x70 payload"}
    - {addr: 0x70, size: 4,  name: ENG_KEY1,        desc: "Engineer key 1 (challenge for opcode 0xE0)"}
    - {addr: 0x78, size: 4,  name: ENG_KEY2,        desc: "Engineer key 2 (challenge for opcode 0xE2)"}

  prompt_clues:
    # Phrases in user prompt that strongly indicate this subclass. Used by
    # the layer-prompt builder + agent for subclass auto-detection.
    strong:
      - "iPhone"
      - "Apple"
      - "Lightning"
      - "fast charge"
      - "fake cable"
      - "real cable"
    weak:
      - "phone"
      - "cable"
      - "USB power"


cable-side-id-ic-apple-usb-c-mfi:
  inherits_from: cable-side-id-ic
  reference: "Apple USB-C MFi 3.x cable authenticator"
  public_source: "MFi 3.x is NDA-only; community RE notes only"

  typical_protocol_summary: >
    USB-C VDM (Vendor-Defined Message) over CC1/CC2 SOP'/SOP'' channels.
    Chip identifies via Discover_Identity then participates in Apple-specific
    VDM challenge/response (replaces the Lightning ID_BUS opcode set).

  typical_l3_opcodes_canonical:
    - {op: 0x8000, name: VDM_DISCOVER_IDENTITY, role: "USB PD VDM discover_identity"}
    - {op: 0x8001, name: VDM_DISCOVER_SVIDS,    role: "USB PD VDM discover supported VIDs"}
    - {op: 0xFF01, name: APPLE_VDM_CHALLENGE,   role: "Apple VID 0x05AC challenge VDM"}
    - {op: 0xFF02, name: APPLE_VDM_RESPONSE,    role: "Apple VID 0x05AC response VDM"}

  typical_l8_crc:
    polynomial: "0x07"
    init: "0xFF"
    width_bits: 8
    name: "CRC-8 over USB PD message header"

  prompt_clues:
    strong: ["USB-C MFi", "Apple USB-C cable", "MFi 3"]
    weak:   ["USB-C", "USB PD", "Type-C cable"]


cable-side-id-ic-usb-pd-cc:
  inherits_from: cable-side-id-ic
  reference: "USB PD 3.1 cable e-marker (no proprietary auth, public spec)"
  public_source: "USB PD 3.1 spec § 6.4.4 (public, USB-IF)"

  typical_protocol_summary: >
    Cable presents 5.1 kΩ pull-down on CC1 and CC2 (Type-C standard). When
    inserted, cable e-marker chip wakes, listens for SOP'/SOP'' Discover_
    Identity message from source, responds with VDO (Vendor Defined Object)
    declaring cable capabilities (max current, USB version, etc.). No
    proprietary authentication — entirely USB-IF public protocol.

  typical_l3_opcodes_canonical:
    - {op: 0x01, name: GoodCRC,             role: "Acknowledge any received message"}
    - {op: 0x07, name: Soft_Reset,          role: "Soft reset of PD state machine"}
    - {op: 0x0F, name: Vendor_Defined,      role: "Discover_Identity / Discover_SVIDs etc."}

  typical_l8_crc:
    polynomial: "0x07"
    init: "0xFF"
    width_bits: 8
    name: "CRC-8 over USB PD message"

  prompt_clues:
    strong: ["USB PD", "e-marker", "Type-C cable", "5.1k"]
    weak:   ["USB-C", "cable detection"]


cable-side-id-ic-generic-1wire:
  inherits_from: cable-side-id-ic
  reference: "Maxim DS1820 / DS28E10 1-Wire family ID ROM"
  public_source: "Maxim/Analog Devices public datasheet (DS1820, DS28E05, DS28E10)"

  typical_protocol_summary: >
    Generic 1-Wire single-conductor master/slave. Master sends RESET pulse,
    chip responds with PRESENCE pulse, then 1-byte command (e.g. READ_ROM,
    SKIP_ROM, MATCH_ROM) followed by data transfer. CRC-8/MAXIM (poly 0x31)
    over the entire ROM contents protects against bit errors.

  typical_l3_opcodes_canonical:
    - {op: 0x33, name: READ_ROM,        role: "Read 64-bit unique ROM ID"}
    - {op: 0x55, name: MATCH_ROM,       role: "Address specific device on bus"}
    - {op: 0xCC, name: SKIP_ROM,        role: "Address all devices (single-drop only)"}
    - {op: 0xF0, name: SEARCH_ROM,      role: "Multi-drop ROM enumeration"}
    - {op: 0xBE, name: READ_SCRATCHPAD, role: "Read device scratchpad memory"}

  typical_l8_crc:
    polynomial: "0x31"
    init: "0x00"
    width_bits: 8
    name: "CRC-8/MAXIM (Dallas/1-Wire)"

  prompt_clues:
    strong: ["1-Wire", "Maxim DS", "ROM ID"]
    weak:   ["unique ID", "serial number chip"]

i2c-peripheral:
  reference: "Texas Instruments PCF8574 / generic I2C GPIO expander; alexforencich/verilog-i2c"
  public_source: "https://github.com/alexforencich/verilog-i2c (master + slave cores)"
  typical_address_bits: 7
  typical_speed_max_khz: 400
  typical_package: "TSSOP / QFN"

  # v0.74 post-verilog-i2c benchmark: generalised class-typical structure.
  # NO specific opcode / register address values — those belong to the
  # specific IC's facts.yaml.
  typical_structure:
    L1_datasheet:
      typical_pins:
        - {role: "scl",        direction: "inout",  description: "I2C clock line (open-drain)"}
        - {role: "sda",        direction: "inout",  description: "I2C data line (open-drain)"}
        - {role: "clk",        direction: "input",  description: "host bus clock"}
        - {role: "rst_n",      direction: "input",  description: "active-low reset"}
        - {role: "irq",        direction: "output", description: "host-side interrupt (optional)"}
        - {role: "host_bus_*", direction: "varies", description: "AXI-Lite / Wishbone / native register port"}
      typical_pin_count: "10–25 (varies by host bus width)"
      typical_voltage: "1.8–3.3 V open-drain compatible"
    L2_requirements:
      - {concept: "speed_modes",     hint: "100 kHz standard, 400 kHz fast; optional 1 MHz fast-mode-plus"}
      - {concept: "addressing",      hint: "7-bit standard; 10-bit optional"}
      - {concept: "role",            hint: "master, slave, or both — pick per IC"}
      - {concept: "clock_stretching",hint: "support if slave; honor if master"}
      - {concept: "arbitration",     hint: "multi-master arbitration on SDA collision"}
      - {concept: "noise_filter",    hint: "simple glitch-suppression on SCL/SDA recommended"}
    L3_command_protocol:
      typical_phy:
        encoding:             "open-drain pull-down with external pull-up"
        bit_order:            "MSB first per byte"
        ack_polarity:         "low = ACK, high = NACK"
        start_condition:      "SDA falling while SCL high"
        stop_condition:       "SDA rising while SCL high"
        repeated_start_supported: true
      typical_frame:
        - "START + 7-bit address + R/W bit + ACK"
        - "data byte + ACK (repeated for N bytes)"
        - "STOP (or repeated START)"
    L4_register_map:
      typical_csrs:
        - {name: "CTRL",   purpose: "enable, master/slave mode, IRQ enable bits"}
        - {name: "STATUS", purpose: "busy, ack-received, arbitration-lost, error flags"}
        - {name: "PRESCALE", purpose: "clock divider for SCL frequency"}
        - {name: "ADDR",   purpose: "slave address (slave mode) or target address (master mode)"}
        - {name: "DATA",   purpose: "TX/RX FIFO or shift-register access"}
        - {name: "CMD",    purpose: "trigger START / STOP / restart / read / write actions (master)"}
      typical_fifo_depth: "0–32 bytes per direction (often parameterised)"
    L5_pad_layer:
      typical_io_buffers: "open-drain output, Schmitt-trigger input on SCL+SDA"
      typical_protection: "ESD diode pair on bus pins, optional 50ns digital filter"
    L6_submodule_control_logic:
      typical_submodules:
        - {name: "bit_ctrl",   purpose: "bit-level driver / sampler (drives SCL/SDA, samples bus)"}
        - {name: "byte_ctrl",  purpose: "byte-level FSM for START/STOP/READ/WRITE byte ops"}
        - {name: "cmd_fsm",    purpose: "high-level command sequencer"}
        - {name: "tx_fifo",    purpose: "TX FIFO (when present)"}
        - {name: "rx_fifo",    purpose: "RX FIFO (when present)"}
        - {name: "prescale",   purpose: "SCL clock divider"}
        - {name: "filter",     purpose: "glitch filter on SCL/SDA inputs"}
    L8_timing:
      typical_frequencies: "SCL 100 / 400 / 1000 kHz; bus clk 50 MHz–200 MHz typical"
      typical_setup_hold: "tHD;STA, tSU;STO, tHD;DAT, tSU;DAT per I²C-bus spec"
    L8R_rtl_constants:
      - {family: "scl_low_high_cycles", purpose: "clock cycles for SCL low and high half-periods (PRESCALE-derived)"}
      - {family: "filter_depth",        purpose: "glitch filter sample-count constants"}
      - {family: "fifo_depths",         purpose: "TX/RX FIFO depths as localparams"}
      - {family: "bus_widths",          purpose: "host data-bus width (AXIL / Wishbone), address width"}
    L9_integration:
      typical_top_level_port_count: "12–25 ports (host-bus + scl/sda/irq)"
      typical_internal_wires:       "20–60 (handshakes between bit_ctrl/byte_ctrl/cmd_fsm/fifos)"
    L10_L13_extensions:
      L10_test_cases:    "loopback master ↔ slave, multi-master arbitration, clock-stretching, NACK handling"
      L11_calibration:   "SCL frequency calibration via PRESCALE; pull-up timing tuning"
      L12_sequences:     "init → START → addr+R/W → ACK → data → STOP; repeated-start scenarios"
      L13_lab_calibration: "logic-analyzer waveform capture on SCL/SDA; bus-loading vs pull-up resistance sweep"

  applicable_subclasses:
    - i2c-peripheral
    - i2c-peripheral-advanced  # if multi-master + 10-bit + DMA features added

crypto-engine:
  # Class for register-mapped hardware crypto blocks (block cipher,
  # hash function, stream cipher, RNG). Plugin does not bundle any
  # specific vendor implementation; the block below captures class-
  # typical shape discovered from the secworks/aes reference and
  # equivalent open-source implementations.
  #
  # v0.79 (B11): merged the previously-duplicate `crypto-engine:`
  # entry at line 491 into this entry; the duplicate YAML key was
  # silently shadowing this richer entry — see B11 in v079_backlog.md.
  # The concrete-defaults half of that merge (typical_scaffolds) was
  # REMOVED in #493 — those defaults were AES-128 specific yet sat on
  # the PARENT of hash-function / stream-cipher / rng, so a SHA-256 or
  # an RNG inherited them. `typical_structure` below is the surviving
  # half: semantic shape, explicitly free of algorithm-specific values.
  reference: "Generic memory-mapped crypto engine (secworks/aes, sha256, chacha, trng families)"
  public_source: "NIST FIPS 197 (AES), FIPS 180 (SHA-2), FIPS 202 (SHA-3), RFC 7539 (ChaCha)"
  typical_interface: "Wishbone B4"
  side_channel_protection_default: "none"

  # v0.74 post-AES-refgen feedback: generalised class-typical structure.
  # NO specific opcode / round constant / S-box values — those belong to
  # subclass (block-cipher / hash-function / stream-cipher / rng).
  typical_structure:
    L1_datasheet:
      typical_role: "memory-mapped crypto primitive for embedded SoC / MCU"
      typical_package_families: [open-source IP, soft-core]
      typical_bus_attachment: "Wishbone / APB / AXI-Lite / native ready-valid"
      typical_block_width_bits: "128 (AES) / 512 (SHA-256) / 1600 (Keccak) — algorithm-dependent"
      typical_key_width_bits: "128, 192 or 256 (algorithm-dependent)"
      typical_throughput: "moderate; iterative (one round/cycle) common"

    L2_requirements:
      typical_functional_requirements:
        - {concept: "block_input",     hint: "accept an N-bit plaintext / ciphertext / message block"}
        - {concept: "key_input",       hint: "accept a secret key of supported width"}
        - {concept: "init_signal",     hint: "host triggers key schedule init"}
        - {concept: "next_signal",     hint: "host triggers next block processing"}
        - {concept: "ready_flag",      hint: "status output — 1 when idle and ready"}
        - {concept: "valid_flag",      hint: "status output — 1 when result block is valid"}
        - {concept: "encdec_mode",     hint: "mode select — encrypt vs decrypt (block-cipher only)"}

    L3_cmd_protocol:
      # Crypto cores typically DON'T have a serial protocol layer — they
      # have a memory-mapped interface. L3 in this class captures the
      # bus transaction shape + CSR-driven command pattern.
      typical_bus_family: "Wishbone B4 classic / APB4 / AXI4-Lite / native"
      typical_access_pattern: "write KEY → write BLOCK → write CTRL.init → poll STATUS.ready → write CTRL.next → poll STATUS.valid → read RESULT"
      # Serial-protocol fields are N/A for crypto-engine; set L3 sentinel
      # protocol_present=false when gap_detect surfaces them.
      protocol_present: false

    L4_regmap:
      # Canonical CSR layout in the secworks/aes reference. Subclass
      # may rename or add (e.g. SHA has a DIGEST window; ChaCha has
      # NONCE + COUNTER). Kept as role list, not vendor-specific offsets.
      typical_registers:
        - {role: "NAME0",   purpose: "ID string upper 32 bits (ASCII)"}
        - {role: "NAME1",   purpose: "ID string lower 32 bits (ASCII)"}
        - {role: "VERSION", purpose: "core version integer"}
        - {role: "CTRL",    purpose: "init bit + next bit + (encdec + keylen bits for block cipher)"}
        - {role: "STATUS",  purpose: "ready bit + valid bit"}
        - {role: "CONFIG",  purpose: "mode select + key-length select (block-cipher only)"}
        - {role: "KEY_n",   purpose: "N × 32-bit key words (block-cipher / hash IV)"}
        - {role: "BLOCK_n", purpose: "N × 32-bit input data block words"}
        - {role: "RESULT_n",purpose: "N × 32-bit output data block words"}

    L5_adi_spec:
      typical_interface: "standard memory-mapped bus (cs, we, address, write_data, read_data) — no analog pads"
      typical_clock_reset: "single clock domain + active-low async reset_n"

    L6_control_logic:
      typical_submodules:
        - {name: register_file, purpose: "bus-facing CSRs (KEY, BLOCK, CTRL, STATUS, CONFIG, RESULT)"}
        - {name: key_expansion, purpose: "expands key into round keys (block-cipher) or message schedule (hash)"}
        - {name: round_fsm,     purpose: "counts rounds + drives S-box / substitution / permutation path"}
        - {name: datapath,      purpose: "round-function combinational logic (S-box, MixColumns, etc.)"}
        - {name: io_handshake,  purpose: "handshake FSM managing init / next / ready / valid"}

    L8_timing:
      typical_timing_groups:
        - {group: "round_cadence",      fields: "cycles_per_round"}
        - {group: "key_schedule_cycles", fields: "total cycles to expand key before next block can start"}
        - {group: "block_latency",      fields: "cycles from CTRL.next=1 to STATUS.valid=1"}
        - {group: "reset_cycles",       fields: "cycles from reset_n=0 to STATUS.ready=1"}

    L8R_rtl_constants:
      typical_constant_count: "10-20"
      typical_constant_families:
        algorithm_params:
          - round_count         # 10/12/14 for AES-128/192/256; 64 for SHA-256; etc.
          - block_width_bits
          - key_width_bits
          - digest_width_bits   # hash subclass only
        cycle_budgets:
          - cycles_per_round
          - total_cycles_per_block
          - key_schedule_cycles
        bus_params:
          - addr_width
          - data_width
        ctrl_bit_positions:
          - CTRL_INIT_BIT
          - CTRL_NEXT_BIT
          - STATUS_READY_BIT
          - STATUS_VALID_BIT

    L9_integration:
      typical_top_level_port_count: "≥ 8 (clk + reset_n + cs + we + address + write_data + read_data + irq optional)"
      typical_submodule_instance_count: "≥ 5 (regfile + key_exp + round_fsm + datapath + io_hs)"
      typical_internal_wire_count: "≥ 20 (round-key buses, S-box in/out, handshake signals)"

    L10_L13_extensions:
      L10_test_cases: "NIST published test vectors per algorithm — FIPS 197 Appendix B/C for AES, FIPS 180-4 for SHA"
      L11_calibration: "typically N/A for deterministic crypto; may hold timing-safe-path selection for side-channel hardening"
      L12_sequences: "≥ 1 sequence for encrypt-many-blocks + 1 for key-reload (and decrypt cycle if block-cipher)"
      L13_lab_calibration: "power / EM side-channel measurement setup; criterion = NIST-vector PASS + timing invariance"

  applicable_subclasses:
    - block-cipher      # AES, DES, Camellia — has encdec_mode
    - hash-function     # SHA-2, SHA-3, Blake2 — no decrypt, has digest window
    - stream-cipher     # ChaCha, Salsa — has nonce + counter
    - rng               # TRNG / CSPRNG — has entropy source + reseed policy

  # typical_scaffolds — REMOVED in #493 (12 entries). Coverage was 0/201
  # doc-sets, and once connected the mechanism injected wrong facts. The
  # reason is recorded in tools/phase1_engine/gap_detect.py
  # `_RETIRED_MECHANISMS['typical_scaffolds']`; read it before re-adding.

simple-cpu:
  reference: "picoRV32 (claire xenia)"
  typical_pipeline_depth: 1
  typical_regfile_size_32bit: 32
  typical_memory_interface: "Wishbone B4 / AXI4-Lite"
  isa_extensions: ["I", "M (optional)", "C (optional)"]
  # typical_scaffolds — REMOVED in #493 (12 entries). Coverage was 0/201
  # doc-sets, and once connected the mechanism injected wrong facts. The
  # reason is recorded in tools/phase1_engine/gap_detect.py
  # `_RETIRED_MECHANISMS['typical_scaffolds']`; read it before re-adding.

  # v0.79 (A2) L10-L13 K3 typical_* blocks. Note: simple-cpu used to
  # carry typical_scaffolds for L1-L23 instead of typical_structure;
  # that block was REMOVED in #493 (see the pointer above), so L1-L23
  # now has no class-reference block at all for this class.
  # this typical_structure block carries ONLY the L10-L13 layer
  # extensions to anchor per-layer agent fills for the test/cal/seq/lab
  # tail. L10/L12 lean heavily on RISC-V compliance (riscof) and the
  # standard boot-then-IPL behavioural sequence; L11/L13 are mostly
  # n/a because picoRV32-class CPUs are deterministic logic with no
  # analog calibration.
  typical_structure:
    L1_datasheet:
      typical_isa: "RV32I base (optionally RV32IM, RV32IMC)"
      typical_data_width_bits: 32
      typical_address_width_bits: 32
      typical_register_file: "32 x 32-bit GPRs x0..x31 (x0 hardwired zero); RV32E variant: 16 GPRs"
      typical_pins:
        - {role: "clk",         direction: "input",  width: 1,  description: "System clock"}
        - {role: "resetn/res",  direction: "input",  width: 1,  description: "Reset (polarity implementation-dependent)"}
        - {role: "mem_addr",    direction: "output", width: 32, description: "Memory address bus"}
        - {role: "mem_wdata",   direction: "output", width: 32, description: "Memory write data"}
        - {role: "mem_wstrb/dbe", direction: "output", width: 4, description: "Byte write strobe/enable"}
        - {role: "mem_rdata",   direction: "input",  width: 32, description: "Memory read data"}
        - {role: "mem_valid/req", direction: "output", width: 1, description: "Memory transaction request"}
        - {role: "mem_ready/ack", direction: "input",  width: 1, description: "Memory transaction acknowledge"}
        - {role: "mem_instr",   direction: "output", width: 1, description: "Instruction fetch indicator (optional; absent in Harvard split-bus)"}
        - {role: "irq",         direction: "input",  width: "1-32", description: "External interrupt input(s)"}
        - {role: "trap",        direction: "output", width: 1, description: "Unrecoverable trap/halt indicator (optional)"}
      typical_pin_count: "12-30 (varies with coprocessor port, trace port, bus variant)"
    L2_requirements:
      - {concept: "isa_base",         hint: "RV32I (37 base instructions); RV32E variant with 16 GPRs"}
      - {concept: "m_extension",      hint: "optional MUL/MULH/MULHSU/MULHU; DIV/REM implementation-dependent"}
      - {concept: "c_extension",      hint: "optional compressed 16-bit instruction support"}
      - {concept: "pipeline_depth",   hint: "2-stage or 3-stage in-order (FETCH|DECODE|EXECUTE); single-issue"}
      - {concept: "memory_interface", hint: "valid/ready handshake or req/ack handshake; 32-bit data, 4-bit byte enable"}
      - {concept: "interrupt_support", hint: "at least 1 external IRQ line; trap vector configurable; entry saves PC, exit restores"}
      - {concept: "csr_support",      hint: "optional machine-mode CSRs (MSTATUS, MTVEC, MEPC, MCAUSE, MIE, MIP, MSCRATCH)"}
      - {concept: "coprocessor_interface", hint: "optional external accelerator port for custom opcodes (custom-0 opcode 0x0B)"}
      - {concept: "bus_variants",     hint: "native valid/ready, AXI4-Lite adapter, Wishbone adapter, or Harvard split I/D"}
      - {concept: "reset_vector",     hint: "configurable; typical default 0x00000000"}
    L3_command_protocol:
      typical_instruction_encoding:
        base: "RV32I — 6 instruction formats: R-type, I-type, S-type, B-type, U-type, J-type"
        opcode_map:
          - {mnemonic: "LUI",   opcode: "0110111", type: "U-type"}
          - {mnemonic: "AUIPC", opcode: "0010111", type: "U-type"}
          - {mnemonic: "JAL",   opcode: "1101111", type: "J-type"}
          - {mnemonic: "JALR",  opcode: "1100111", type: "I-type"}
          - {mnemonic: "BRANCH (BEQ/BNE/BLT/BGE/BLTU/BGEU)", opcode: "1100011", type: "B-type (funct3 selects condition)"}
          - {mnemonic: "LOAD (LB/LH/LW/LBU/LHU)",  opcode: "0000011", type: "I-type (funct3 selects width/sign)"}
          - {mnemonic: "STORE (SB/SH/SW)",           opcode: "0100011", type: "S-type (funct3 selects width)"}
          - {mnemonic: "ALU-imm (ADDI/SLTI/XORI/ORI/ANDI/SLLI/SRLI/SRAI)", opcode: "0010011", type: "I-type"}
          - {mnemonic: "ALU-reg (ADD/SUB/SLL/SLT/SLTU/XOR/SRL/SRA/OR/AND)", opcode: "0110011", type: "R-type"}
          - {mnemonic: "SYSTEM (ECALL/EBREAK/CSR*)",  opcode: "1110011", type: "I-type"}
      typical_memory_handshake:
        protocol: "valid/ready or req/ack — single outstanding transfer"
        data_width: 32
        address_width: 32
        byte_enable_width: 4
        handshake_sequence:
          - "Core asserts valid/req with address + wdata + wstrb stable"
          - "Memory may insert wait-states (ready/ack low)"
          - "On ready/ack, read data is captured (for loads) or write completes (for stores)"
      typical_branch_protocol:
        compare: "funct3 selects BEQ/BNE/BLT/BGE/BLTU/BGEU from rs1 vs rs2"
        flush: "taken branch/jump causes pipeline flush (1-2 cycles depending on pipeline depth)"
    L4_register_map:
      typical_gpr_file:
        count: "32 (RV32I) or 16 (RV32E)"
        width: 32
        x0_behavior: "hardwired to zero; writes discarded"
        x1_convention: "ra (return address; written by JAL/JALR)"
        x2_convention: "sp (stack pointer; optionally HW-initialized from parameter)"
        reset_state: "uninitialized by HW (x0=0 always); software boot initializes sp"
      typical_machine_csrs:
        - {address: "0x300", name: "MSTATUS",  access: "RW", description: "bit 3=MIE (global IRQ enable), bit 7=MPIE (saved MIE)"}
        - {address: "0x304", name: "MIE",      access: "RW", description: "per-source interrupt enable (bit 11=MEIE external)"}
        - {address: "0x305", name: "MTVEC",    access: "RW", description: "trap vector base address"}
        - {address: "0x340", name: "MSCRATCH", access: "RW", description: "scratch register for trap handler"}
        - {address: "0x341", name: "MEPC",     access: "RW", description: "exception/interrupt return PC"}
        - {address: "0x342", name: "MCAUSE",   access: "RW", description: "trap cause code (MSB=1 for interrupt)"}
        - {address: "0x344", name: "MIP",      access: "R",  description: "interrupt pending bits"}
      typical_performance_counters:
        - {address: "0xC00/0xC80", name: "mcycle/mcycleh",     access: "R", description: "64-bit cycle counter"}
        - {address: "0xC02/0xC82", name: "minstret/minstreth", access: "R", description: "64-bit retired-instruction counter"}
        - {address: "0xF14",       name: "mhartid",            access: "R", description: "hardware thread ID"}
      typical_addressing: "GPRs by 5-bit register index; CSRs by 12-bit address via CSRRW/CSRRS/CSRRC"
      notes: "simple-cpu class typically has NO memory-mapped register file; all state is architectural (GPR + CSR)."
    L5_adi_spec:
      pad_role: "CPU core is soft-IP; no off-chip pads. Memory interface, IRQ, and coprocessor ports route to top-level pads in parent SoC."
      typical_bus_variants:
        - {name: "native",     description: "valid/ready or req/ack handshake — lowest latency"}
        - {name: "AXI4-Lite",  description: "adapter wrapper converts native to AXI4-Lite master"}
        - {name: "Wishbone",   description: "adapter wrapper converts native to Wishbone classic master"}
        - {name: "Harvard",    description: "split instruction/data buses to separate memories"}
    L6_control_logic:
      typical_submodules:
        - {name: "cpu_core",    role: "instruction fetch + decode + execute + writeback pipeline"}
        - {name: "regfile",     role: "32x32-bit (or 16x32 for RV32E) GPR file; 2-read 1-write ports"}
        - {name: "alu",         role: "arithmetic-logic unit for R/I-type operations"}
        - {name: "mul_unit",    role: "optional M-extension multiplier (single-cycle or iterative)"}
        - {name: "div_unit",    role: "optional M-extension divider (iterative, ~32-40 cycles)"}
        - {name: "irq_ctrl",    role: "interrupt controller: pending/mask/entry/exit logic"}
        - {name: "mem_bridge",  role: "optional bus adapter (AXI4-Lite / Wishbone / Harvard bridge)"}
      typical_pipeline_fsm:
        description: "In-order pipeline; 2-stage (IF|EX) or 3-stage (IF|ID|EX)."
        states:
          - {name: "RESET",      description: "PC <- reset_vector; flush counter loaded; registers cleared"}
          - {name: "FETCH",      description: "Issue instruction memory request; wait for ack; latch instruction word"}
          - {name: "DECODE",     description: "(3-stage only) Latch decoded opcode predicates, immediates, register indices"}
          - {name: "EXECUTE",    description: "Read GPRs, compute ALU result / branch condition / memory address"}
          - {name: "MEM_ACCESS", description: "Wait for data memory ack on load/store; sign/zero-extend load data"}
          - {name: "WRITEBACK",  description: "Write result to GPR file (rd); advance PC"}
          - {name: "FLUSH",      description: "Pipeline flush after taken branch/jump/trap; squash in-flight ops"}
          - {name: "STALL",      description: "Pipeline frozen waiting for memory ack or coprocessor completion"}
          - {name: "TRAP",       description: "Unrecoverable error halt (illegal instruction / bus error)"}
      typical_irq_fsm:
        states: ["IRQ_DISABLED", "IRQ_IDLE", "IRQ_PENDING", "IRQ_ACTIVE"]
        entry_sequence: "save PC → save status → set cause → jump to trap vector → mask interrupts"
        exit_sequence: "restore status → restore PC → re-enable interrupts"
      typical_memory_interface_fsm:
        states: ["MI_IDLE", "MI_REQ", "MI_WAIT", "MI_ACK"]
        description: "Handshake FSM: assert request → wait for ack → capture read data → idle"
    L7_test_debug:
      typical_strategy: "RISC-V Architecture Tests (riscof) for ISA compliance + synthetic programs for pipeline hazards"
      typical_modes:
        - "instruction-level compliance (every RV32I opcode)"
        - "branch-heavy workload (pipeline flush stress)"
        - "load/store with wait-states (bus stall coverage)"
        - "IRQ entry/exit under various pipeline states"
    L8_timing_waveform:
      typical_clock_domains: 1
      typical_cpi_range: "1-6 CPI depending on instruction and pipeline config"
      typical_branch_flush_cycles: "1 (2-stage) to 2 (3-stage)"
      typical_load_latency_cycles: "1-5 (depends on memory response time)"
      typical_irq_latency_cycles: "3-10 cycles from IRQ assertion to first handler instruction"
    L8R_rtl_constants:
      typical_reset_vector: "0x00000000 (configurable via parameter)"
      typical_data_width: 32
      typical_addr_width: 32
      typical_gpr_count: 32
      typical_byte_enable_width: 4
      typical_parameters:
        - {name: "RESET_ADDR",  description: "PC reset value", typical_default: "0x00000000"}
        - {name: "ISA_EXT_M",   description: "enable M extension (mul/div)", typical_default: "0"}
        - {name: "ISA_EXT_C",   description: "enable C extension (compressed)", typical_default: "0"}
        - {name: "ENABLE_IRQ",  description: "enable interrupt controller", typical_default: "0"}
    L9_integration_spec:
      typical_dtops: ["simple_cpu_top"]
      typical_core_ports:
        - {name: "clk",         dir: "input",  width: 1,  group: "clock_reset"}
        - {name: "resetn",      dir: "input",  width: 1,  group: "clock_reset"}
        - {name: "mem_valid",   dir: "output", width: 1,  group: "native_mem"}
        - {name: "mem_instr",   dir: "output", width: 1,  group: "native_mem"}
        - {name: "mem_ready",   dir: "input",  width: 1,  group: "native_mem"}
        - {name: "mem_addr",    dir: "output", width: 32, group: "native_mem"}
        - {name: "mem_wdata",   dir: "output", width: 32, group: "native_mem"}
        - {name: "mem_wstrb",   dir: "output", width: 4,  group: "native_mem"}
        - {name: "mem_rdata",   dir: "input",  width: 32, group: "native_mem"}
        - {name: "irq",         dir: "input",  width: "1-32", group: "irq"}
        - {name: "trap",        dir: "output", width: 1,  group: "status"}
      typical_submodule_instantiation: "regfile + alu + decoder + pcu + memif; optional: mul_unit, div_unit, irq_ctrl"
      typical_internal_wires:
        - {name: "instr_word",   width: 32, description: "fetched instruction → decoder"}
        - {name: "rs1_idx/rs2_idx/rd_idx", width: 5, description: "decoder → regfile read/write addresses"}
        - {name: "rs1_data/rs2_data", width: 32, description: "regfile → ALU operands"}
        - {name: "alu_result",   width: 32, description: "ALU → regfile writeback / memory address"}
        - {name: "imm_value",    width: 32, description: "decoder → ALU sign-extended immediate"}
        - {name: "pc",           width: 32, description: "current program counter"}
        - {name: "next_pc",      width: 32, description: "computed next PC (branch target / PC+4)"}
        - {name: "branch_taken", width: 1,  description: "branch comparator result → PC update logic"}
        - {name: "flush",        width: "1-2", description: "pipeline flush counter"}
        - {name: "hlt/stall",    width: 1,  description: "pipeline stall from memory or coprocessor wait"}
        - {name: "irq_pending",  width: "1-32", description: "interrupt pending bits → IRQ controller"}
    L10_test_cases:
      typical_vectors:
        - {name: "riscv_compliance_rv32i",  description: "RISC-V Architecture Test (riscof) RV32I base — 50+ test programs covering every base ISA instruction"}
        - {name: "riscv_compliance_m_ext",  description: "(if M extension supported) MUL/MULH/DIV/REM single-cycle correctness — bypassed when M=0"}
        - {name: "riscv_compliance_c_ext",  description: "(if C extension supported) compressed-instruction decoder coverage"}
        - {name: "dhrystone_2_1",           description: "classic integer benchmark — verifies regfile/alu/memif under sustained load; reports DMIPS"}
        - {name: "coremark_1_0",            description: "EEMBC CoreMark — branch-heavy + list/matrix/state workload; reports CoreMark/MHz"}
        - {name: "irq_inject_recover",      description: "raise external IRQ during ALU op → verify trap, mret returns to interrupted PC"}
        - {name: "mem_alignment_traps",     description: "(if alignment trap enabled) misaligned LW/SW must trap; aligned passes through"}
      typical_test_count: "50–200 (RISC-V compliance dominates; benchmarks add cycle-count assertions)"
    L11_calibration:
      not_applicable: true
      reason: "Combinational + register CPU pipeline; clock period is the only knob and that's an STA constraint, not run-time calibration. No analog tuning, no per-die offsets."
    L12_behavioral_sequences:
      - {name: "cold_boot",          steps: "RESETN low ≥1 cycle → release → PC = reset_vector → fetch first instruction → run"}
      - {name: "load_program_then_run", steps: "host loads program image into instruction memory → asserts RESETN → CPU starts executing"}
      - {name: "irq_handler_entry_exit", steps: "IRQ_IN bit asserted → CPU saves PC + completes current instruction → jumps to trap_vector → executes handler → mret restores PC"}
      - {name: "ebreak_to_debug",    steps: "(if debug spec supported) EBREAK instruction halts CPU → debugger can read regfile / inspect PC → debugger resume"}
      - {name: "memory_handshake_stall", steps: "instruction fetch issued → mem_valid high → mem_ready low for N cycles → CPU stalls → mem_ready high + mem_rdata valid → CPU resumes"}
    L13_lab_calibration:
      typical_lab_equipment: ["FPGA dev board (DE10-Lite or larger; CPU + small memory + UART)", "host UART/JTAG to load programs and observe printf", "logic analyzer for memif handshake + IRQ latency"]
      typical_smoke_tests:
        - {name: "hello_world_uart",   instrument: "host UART terminal", criterion: "first program printf reaches host UART within 1 second of reset release"}
        - {name: "compliance_subset_pass", instrument: "RISC-V Architecture Test infra", criterion: "RV32I subset signature matches reference (>=95% pass rate; document any waivers)"}
        - {name: "fmax_at_target_freq", instrument: "Quartus / Vivado timing report", criterion: "≥ datasheet typical Fmax (e.g. ≥50MHz on Cyclone V; ≥100MHz on Artix-7)"}
        - {name: "irq_latency_cycles", instrument: "scope on IRQ_IN + first handler bus access", criterion: "≤10 cycles (single-issue in-order pipeline budget)"}

feature-cpu:
  reference: "ibex (lowRISC) / cv32e40p (OpenHW)"
  public_source: "github.com/lowRISC/ibex, github.com/openhwgroup/cv32e40p"
  typical_pipeline_depth: 3
  isa_extensions: ["I", "M", "C", "Zicsr", "Zifencei"]

  # v0.74 post-ibex benchmark: generalised feature-cpu typical structure.
  # Supplements the parent processor / digital-ic structure (which is
  # implicit). NO specific opcodes / register encodings / vendor IDs —
  # those belong to the IC's facts.yaml.
  typical_structure:
    L1_datasheet:
      typical_pins:
        - {role: "clk_i",          direction: "input",  description: "main clock"}
        - {role: "rst_ni",         direction: "input",  description: "active-low reset"}
        - {role: "test_en_i",      direction: "input",  description: "DFT scan enable"}
        - {role: "hart_id_i",      direction: "input",  width: 32, description: "hart identifier (mhartid CSR)"}
        - {role: "boot_addr_i",    direction: "input",  width: 32, description: "reset boot vector"}
        - {role: "instr_*",        direction: "varies", description: "instruction-fetch bus port (req/gnt/rvalid/addr/rdata)"}
        - {role: "data_*",         direction: "varies", description: "data-access bus port (req/gnt/rvalid/we/be/addr/wdata/rdata)"}
        - {role: "irq_*",          direction: "input",  description: "fast / external / software / timer interrupt lines"}
        - {role: "debug_req_i",    direction: "input",  description: "RISC-V debug halt request"}
        - {role: "core_busy_o",    direction: "output", description: "core-busy / sleep status"}
      typical_pin_count: "60–100 (most are bus + IRQ vectors, no off-chip)"
    L2_requirements:
      - {concept: "isa_base",         hint: "RV32I (mandatory) + RV32E option for tiny variants"}
      - {concept: "isa_extensions",   hint: "M (mul/div), C (compressed 16b), B (bitmanip), Zicsr (CSRs), Zifencei (fence.i)"}
      - {concept: "pipeline_style",   hint: "in-order; 2-stage (IF | ID/EX/WB) typical for embedded; 3-stage if IPC matters"}
      - {concept: "privilege_modes",  hint: "M-mode required; U-mode optional for OS"}
      - {concept: "memory_protection",hint: "PMP (physical memory protection) optional"}
      - {concept: "debug_support",    hint: "RISC-V debug spec — halt / step / breakpoint via debug_req_i"}
      - {concept: "interrupts",       hint: "CLINT-compatible (external / software / timer) + fast IRQ vector"}
    L3_command_protocol:
      typical_phy:
        encoding:                "register-mapped — no off-chip protocol; CPU drives memory + peripheral buses"
        bit_order:               "little-endian (RISC-V default)"
        wake_prefix_required:    false
      typical_frame:
        - "instruction fetch: req+addr → memory replies gnt → rvalid+rdata"
        - "data load:        req+addr+we=0+be → rvalid+rdata"
        - "data store:       req+addr+we=1+be+wdata → gnt"
    L4_register_map:
      access_mechanism: "CSR instructions (Zicsr: csrrw/csrrs/csrrc); 12-bit CSR address space"
      address_width_bits: 12
      data_width_bits: 32
      typical_csrs:
        # Machine Information
        - {name: "mvendorid",  addr: "0xF11", access: "RO",  purpose: "vendor ID (JEDEC); 0 if unimplemented"}
        - {name: "marchid",    addr: "0xF12", access: "RO",  purpose: "architecture ID"}
        - {name: "mimpid",     addr: "0xF13", access: "RO",  purpose: "implementation version"}
        - {name: "mhartid",    addr: "0xF14", access: "RO",  purpose: "hart identifier (driven by hart_id_i)"}
        # Machine Trap Setup
        - {name: "mstatus",    addr: "0x300", access: "RW",  purpose: "machine status — MIE, MPIE, MPP", fields: "MPP[12:11], MPIE[7], MIE[3]"}
        - {name: "misa",       addr: "0x301", access: "RO",  purpose: "ISA + extensions bitmap — MXL[31:30]=1 (RV32), Extensions[25:0]"}
        - {name: "mie",        addr: "0x304", access: "RW",  purpose: "interrupt-enable mask — MEIE[11], MTIE[7], MSIE[3]; fast IRQ bits[30:16] if vendor-extended"}
        - {name: "mtvec",      addr: "0x305", access: "RW",  purpose: "trap vector base + MODE — BASE[31:2], MODE[1:0] (0=direct, 1=vectored)"}
        # Machine Trap Handling
        - {name: "mscratch",   addr: "0x340", access: "RW",  purpose: "scratch register for M-mode trap handlers"}
        - {name: "mepc",       addr: "0x341", access: "RW",  purpose: "machine exception PC (bit[0] hardwired 0)"}
        - {name: "mcause",     addr: "0x342", access: "RW",  purpose: "trap cause — Interrupt[31], ExceptionCode[30:0]"}
        - {name: "mtval",      addr: "0x343", access: "RW",  purpose: "trap-value: faulting address or instruction bits"}
        - {name: "mip",        addr: "0x344", access: "RO",  purpose: "interrupt-pending status — MEIP[11], MTIP[7], MSIP[3]; fast IRQ bits[30:16]"}
        # Performance Counters
        - {name: "mcycle",     addr: "0xB00", access: "RW",  purpose: "cycle counter (low 32b)"}
        - {name: "mcycleh",    addr: "0xB80", access: "RW",  purpose: "cycle counter (upper 32b)"}
        - {name: "minstret",   addr: "0xB02", access: "RW",  purpose: "instructions-retired counter (low 32b)"}
        - {name: "minstreth",  addr: "0xB82", access: "RW",  purpose: "instructions-retired counter (upper 32b)"}
        - {name: "mcountinhibit", addr: "0x320", access: "RW", purpose: "counter inhibit — bit[0]=mcycle, bit[2]=minstret"}
        # PMP (optional)
        - {name: "pmpcfg0..3",   addr: "0x3A0..0x3A3", access: "RW", purpose: "(optional) PMP config — L[7], A[4:3] (OFF/TOR/NA4/NAPOT), X[2], W[1], R[0]"}
        - {name: "pmpaddr0..15", addr: "0x3B0..0x3BF", access: "RW", purpose: "(optional) PMP address registers; count = PMPNumRegions"}
        # Debug (Debug Mode only)
        - {name: "dcsr",       addr: "0x7B0", access: "DRW", purpose: "debug control/status — xdebugver[31:28], ebreakm[15], step[2], prv[1:0]"}
        - {name: "dpc",        addr: "0x7B1", access: "DRW", purpose: "debug PC (saved PC on debug entry)"}
        - {name: "dscratch0",  addr: "0x7B2", access: "DRW", purpose: "debug scratch register 0"}
        - {name: "dscratch1",  addr: "0x7B3", access: "DRW", purpose: "debug scratch register 1"}
      regfile: "32x 32-bit GPRs (x0..x31), x0 hardwired zero; 16 if RV32E"
      notes:
        - "All addresses are 12-bit RISC-V CSR addresses per Privileged Architecture v1.12"
        - "Unimplemented CSRs raise illegal-instruction exceptions"
        - "PMP CSR count is parameterized (PMPNumRegions)"
    L5_pad_layer:
      no_analog_content: true
      typical_io_buffers: "all signals are internal SoC bus connections"
    L6_submodule_control_logic:
      typical_submodules:
        - {name: "if_stage",           purpose: "instruction fetch front-end; drives instr_* bus, manages prefetch buffer or icache"}
        - {name: "id_stage",           purpose: "instruction decode + register-read + operand muxes; hosts controller FSM"}
        - {name: "decoder",            purpose: "combinational RV32 instruction decode — ALU op, operand selects, RF enables, branch/jump, CSR access, LSU op"}
        - {name: "compressed_decoder", purpose: "C-extension 16b → 32b expansion"}
        - {name: "controller",         purpose: "top-level core FSM — pipeline flush, branch redirect, exception/interrupt entry, debug halt/step, WFI sleep"}
        - {name: "ex_block",           purpose: "execute block: ALU + optional branch-target ALU + multiplier/divider"}
        - {name: "alu",                purpose: "arithmetic / logic / shift / compare operations"}
        - {name: "multdiv",            purpose: "M-extension iterative multiplier / divider (states: MD_IDLE → MD_ABS_A → MD_COMP → MD_LAST → MD_FINISH)"}
        - {name: "load_store_unit",    purpose: "data-bus LSU FSM — single + misaligned access, byte-enable, sign-extend (states: IDLE/WAIT_GNT/WAIT_RVALID/WAIT_GNT_MIS/WAIT_RVALID_MIS)"}
        - {name: "wb_stage",           purpose: "(optional, 3-stage) writeback stage — resolves WAW/RAW hazards"}
        - {name: "register_file",      purpose: "32x 32b GPRs (FF / latch / FPGA RAM variants)"}
        - {name: "cs_registers",       purpose: "CSR file — mstatus/mepc/mcause/mtvec, perf counters, PMP, debug CSRs"}
        - {name: "pmp",                purpose: "(optional) physical memory protection — combinational region match"}
        - {name: "prefetch_buffer",    purpose: "(when ICache=0) sequential prefetch FIFO (states: IDLE/FETCH)"}
        - {name: "icache",             purpose: "(optional) instruction cache (states: LOOKUP/ALLOCATE/INVALIDATE)"}
        - {name: "branch_predict",     purpose: "(optional) static / dynamic branch predictor"}
      primary_fsm:
        name: "controller_fsm"
        states:
          - {name: "RESET",       description: "held after reset; awaits fetch_enable"}
          - {name: "BOOT_SET",    description: "latches boot_addr + 0x80 as initial PC"}
          - {name: "FIRST_FETCH", description: "issues first instruction fetch"}
          - {name: "DECODE",      description: "steady-state: decode + issue; monitors branches/IRQ/debug"}
          - {name: "FLUSH",       description: "pipeline flush on branch/exception/mret/dret/debug"}
          - {name: "IRQ_TAKEN",   description: "vectored interrupt entry — updates mepc/mcause/mstatus"}
          - {name: "DBG_TAKEN_IF", description: "debug entry from IF → DmHaltAddr"}
          - {name: "DBG_TAKEN_ID", description: "debug entry from ID (ebreak/step) → updates dpc/dcsr"}
          - {name: "WAIT_SLEEP",  description: "drains pipeline after WFI"}
          - {name: "SLEEP",       description: "core_sleep_o asserted; wakes on IRQ/debug"}
      pipeline_stages:
        - {stage: "IF",    module: "if_stage"}
        - {stage: "ID/EX", module: "id_stage + ex_block"}
        - {stage: "WB",    module: "wb_stage", optional: true, enabled_by: "WritebackStage == 1"}
      exception_priority:
        - "debug single-step / external debug_req"
        - "non-maskable interrupt (irq_nm_i)"
        - "external / timer / software / fast interrupts (when mstatus.MIE=1)"
        - "synchronous exceptions (instr access fault, illegal instr, ebreak, ecall, load/store fault)"
    L8_timing:
      typical_frequencies: "50–200 MHz on FPGA, 200 MHz–1 GHz on ASIC"
      pipeline_hazards:    "load-use stall, branch-mispredict bubble, mul/div multi-cycle stall"
    L8R_rtl_constants:
      typical_constant_families:
        - {family: "boot_addr_default",   purpose: "default reset boot vector localparam"}
        - {family: "isa_string",          purpose: "MISA register encoding bits"}
        - {family: "regfile_size",        purpose: "32 GPRs (16 if RV32E)"}
        - {family: "csr_address_table",   purpose: "CSR offset definitions per spec"}
        - {family: "irq_vector_count",    purpose: "(optional) fast-IRQ count"}
        - {family: "pmp_region_count",    purpose: "(optional) PMP region count"}
      typical_parameters:
        - {name: "PMPEnable",       default: "0", purpose: "enable PMP + related CSRs"}
        - {name: "PMPNumRegions",   default: "4", purpose: "number of PMP regions (1..16)"}
        - {name: "RV32E",           default: "0", purpose: "RV32E (16 GPRs) vs RV32I (32 GPRs)"}
        - {name: "RV32M",           default: "RV32MFast", purpose: "multiplier variant (None/Slow/Fast/SingleCycle)"}
        - {name: "RV32B",           default: "RV32BNone", purpose: "bitmanip variant (None/Balanced/Full)"}
        - {name: "RegFile",         default: "RegFileFF", purpose: "register file implementation (FF/FPGA/Latch)"}
        - {name: "WritebackStage",  default: "0", purpose: "enable 3rd pipeline stage (WB)"}
        - {name: "ICache",          default: "0", purpose: "instruction cache (replaces prefetch buffer)"}
        - {name: "SecureIbex",      default: "0", purpose: "enable lockstep shadow core + dummy instructions"}
    L9_integration:
      typical_top_level_port_count: "60–120 (bus + IRQ + debug + DFT + optional lockstep/RVFI)"
      typical_internal_wires:       "200+ (pipeline registers, hazard signals, CSR connections, RF interface)"
      typical_top_level_port_groups:
        - {group: "clock_reset",     ports: "clk_i, rst_ni"}
        - {group: "dft",             ports: "test_en_i, scan_rst_ni"}
        - {group: "config",          ports: "hart_id_i[31:0], boot_addr_i[31:0]"}
        - {group: "instr_mem",       ports: "instr_req_o, instr_gnt_i, instr_rvalid_i, instr_addr_o[31:0], instr_rdata_i[31:0], instr_err_i"}
        - {group: "data_mem",        ports: "data_req_o, data_gnt_i, data_rvalid_i, data_we_o, data_be_o[3:0], data_addr_o[31:0], data_wdata_o[31:0], data_rdata_i[31:0], data_err_i"}
        - {group: "irq",             ports: "irq_software_i, irq_timer_i, irq_external_i, irq_fast_i[14:0], irq_nm_i"}
        - {group: "debug",           ports: "debug_req_i, crash_dump_o"}
        - {group: "cpu_ctrl",        ports: "fetch_enable_i, core_sleep_o"}
      typical_submodule_instances:
        - {instance: "core_clock_gate", module: "prim_clock_gating", role: "gates core clock on core_busy | debug_req | irq_pending"}
        - {instance: "u_core",          module: "ibex_core / cv32e40p_core", role: "main RISC-V core: IF/ID/EX(/WB) pipeline, RF interface, CSRs, controller"}
        - {instance: "register_file",   module: "register_file_ff/_fpga/_latch", role: "register file variant selected by RegFile parameter"}
    L10_L13_extensions:
      L10_test_cases:    "riscv-tests, riscv-arch-test, dhrystone / coremark, debug spec compliance"
      L11_calibration:   "n/a (deterministic; clock-tree / latency calibration is back-end)"
      L12_sequences:     "boot → reset → fetch → decode → execute → trap → mret; debug halt/step/resume"
      L13_lab_calibration: "FPGA bring-up: program flash, attach JTAG, run hello_world; verify mhartid / boot_addr"

  applicable_subclasses:
    - feature-cpu

peripheral-timer:
  reference: "PULP apb_timer / OpenTitan rv_timer / various APB timer cores"
  public_source: "github.com/pulp-platform/apb_timer"
  typical_counter_bits: 32
  typical_prescaler_bits: 8

  # v0.74 post-apb_timer benchmark: peripheral-timer specific structure.
  # (Previously described as supplementing the parent apb-peripheral
  # typical_scaffolds; that parent block was REMOVED in #493, so this
  # block now stands alone.)
  typical_structure:
    L1_datasheet:
      typical_pins:
        - {role: "HCLK / PCLK",  direction: "input",  description: "APB bus clock"}
        - {role: "HRESETn / PRESETn", direction: "input", description: "active-low reset"}
        - {role: "PSEL",         direction: "input",  description: "APB peripheral select"}
        - {role: "PADDR",        direction: "input",  width: 12, description: "APB address"}
        - {role: "PENABLE",      direction: "input",  description: "APB enable phase"}
        - {role: "PWRITE",       direction: "input",  description: "APB write strobe"}
        - {role: "PWDATA",       direction: "input",  width: 32, description: "APB write data"}
        - {role: "PRDATA",       direction: "output", width: 32, description: "APB read data"}
        - {role: "PREADY",       direction: "output", description: "APB ready (often tied 1)"}
        - {role: "PSLVERR",      direction: "output", description: "APB slave error (often tied 0)"}
        - {role: "irq",          direction: "output", width: "TIMER_CNT*2", description: "IRQ vector: {cmp, overflow} per timer instance"}
      typical_pin_count: "16-25 (APB + IRQ vector)"
    L2_requirements:
      - {concept: "counter_modes",   hint: "count-up; reload-on-compare; auto-restart"}
      - {concept: "prescaler",       hint: "small (typically 3-8 bits) host-clock divider"}
      - {concept: "irq_sources",     hint: "overflow (0xFFFFFFFF → 0) + compare-match"}
      - {concept: "instances",       hint: "1-N timers per peripheral (PULP uses 2)"}
      - {concept: "compare_behavior",hint: "auto-reset counter on compare-match (PULP convention)"}
    L3_command_protocol:
      typical_phy:
        encoding:                "AMBA APB v2 — 4-phase setup/access cycle"
        wake_prefix_required:    false
      typical_frame:
        - "setup phase: PSEL=1, PADDR/PWDATA stable, PENABLE=0"
        - "access phase: PENABLE=1, PREADY=1 → transaction completes"
        - "back-to-back transactions allowed (1-cycle setup + 1-cycle access)"
    L4_register_map:
      typical_csrs:
        - {name: "TIMER",      purpose: "current 32-bit count, R/W"}
        - {name: "TIMER_CTRL", purpose: "ENABLE bit, prescaler bits, mode select"}
        - {name: "CMP",        purpose: "compare-match target value"}
      address_map_style: "each timer instance occupies 0x10 bytes (3 registers + reserved)"
    L5_pad_layer:
      no_analog_content: true
      typical_io_buffers: "all signals are internal SoC bus connections"
    L6_submodule_control_logic:
      typical_submodules:
        - {name: "apb_decoder",   purpose: "address decode + instance select"}
        - {name: "timer_core",    purpose: "32-bit counter + prescaler + compare logic (×TIMER_CNT)"}
        - {name: "irq_assembly",  purpose: "concatenate per-instance overflow+cmp into top-level IRQ vector"}
        - {name: "register_bank", purpose: "TIMER + TIMER_CTRL + CMP per instance"}
    L8_timing:
      typical_frequencies:        "host APB clock 50-200 MHz typical"
      typical_apb_latency:        "1 setup + 1 access cycle per transaction (PREADY tied 1)"
      typical_prescale_period:    "(prescaler+1) × HCLK period per counter tick"
    L8R_rtl_constants:
      - {family: "counter_width_param",   purpose: "32 (typical)"}
      - {family: "prescaler_width_param", purpose: "3-8 bits"}
      - {family: "instance_count_param",  purpose: "TIMER_CNT (default 2 in PULP)"}
      - {family: "address_width_param",   purpose: "APB_ADDR_WIDTH (typically 12)"}
      - {family: "register_offsets",      purpose: "TIMER=0x00, CTRL=0x04, CMP=0x08"}
      - {family: "reset_values",          purpose: "all counters / CMP / CTRL = 0 at reset"}
    L9_integration:
      typical_top_level_port_count: "16-25 (APB + IRQ vector + clk/rst)"
      typical_internal_wires:       "TIMER_CNT × ~5 wires (per-instance counter, IRQ pair, ctrl)"
    L10_L13_extensions:
      L10_test_cases:    "basic count-up, prescale=N tick, compare-match IRQ, overflow IRQ, write priority during cycle"
      L11_calibration:   "prescale = (HCLK / desired_tick_Hz) - 1; deterministic, no per-chip cal"
      L12_sequences:     "APB write CTRL.ENABLE=1 → counter ticks → IRQ on overflow → host clears via CTRL"
      L13_lab_calibration: "program known prescale + compare, observe IRQ at expected cycle count via logic analyzer"

  applicable_subclasses:
    - peripheral-timer

memory-controller:
  reference: "LiteDRAM (EnjoyDigital) / OpenCores sdr_ctrl"
  public_source: "github.com/enjoy-digital/litedram + opencores.org/projects/sdr_ctrl"
  typical_interface: "LiteX CSR + Wishbone (host) / JEDEC SDRAM command bus (back-end)"
  typical_controllers: ["SDR-SDRAM", "DDR3", "DDR4", "HyperRAM"]
  typical_subfamilies: ["SDR-SDRAM (single-data-rate)", "DDRx (double-data-rate)", "HyperRAM (low-pin-count)"]

  # v0.74 post-sdr_ctrl benchmark: memory-controller (SDR-SDRAM
  # subfamily) specific structure. Models the OpenCores sdr_ctrl shape
  # (Wishbone-to-SDR-SDRAM bridge, 4 banks, programmable CAS/burst/refresh).
  typical_structure:
    L1_datasheet:
      typical_pins:
        # Host (Wishbone-classic) side
        - {role: "wb_clk_i",         direction: "input",  description: "host bus clock"}
        - {role: "wb_rst_i",         direction: "input",  description: "active-high synchronous reset"}
        - {role: "wb_adr_i",         direction: "input",  width: "APP_AW", description: "Wishbone address (typically 26 bits)"}
        - {role: "wb_dat_i",         direction: "input",  width: 32, description: "Wishbone write data"}
        - {role: "wb_dat_o",         direction: "output", width: 32, description: "Wishbone read data"}
        - {role: "wb_we_i",          direction: "input",  description: "Wishbone write enable"}
        - {role: "wb_sel_i",         direction: "input",  width: 4,  description: "Wishbone byte-select"}
        - {role: "wb_stb_i",         direction: "input",  description: "Wishbone strobe"}
        - {role: "wb_cyc_i",         direction: "input",  description: "Wishbone cycle"}
        - {role: "wb_ack_o",         direction: "output", description: "Wishbone acknowledge"}
        # SDRAM (back-end) side
        - {role: "sdram_clk",        direction: "input",  description: "SDRAM clock (typically 100-166 MHz)"}
        - {role: "sdr_clk_pad",      direction: "output", description: "phase-delayed SDRAM clock to chip"}
        - {role: "sdr_addr",         direction: "output", width: "ROW_BITS", description: "SDRAM address (multiplexed row/col)"}
        - {role: "sdr_data",         direction: "inout",  width: "SDR_DW",   description: "SDRAM data bus (typically 16 or 32 bits)"}
        - {role: "sdr_ba",           direction: "output", width: 2,  description: "SDRAM bank address (4 banks)"}
        - {role: "sdr_cs_n",         direction: "output", description: "SDRAM chip select (active-low)"}
        - {role: "sdr_ras_n",        direction: "output", description: "SDRAM RAS (active-low)"}
        - {role: "sdr_cas_n",        direction: "output", description: "SDRAM CAS (active-low)"}
        - {role: "sdr_we_n",         direction: "output", description: "SDRAM write enable (active-low)"}
        - {role: "sdr_dqm",          direction: "output", width: "SDR_BW",   description: "SDRAM data mask (byte enables)"}
        - {role: "sdr_cke",          direction: "output", description: "SDRAM clock enable"}
        # Configuration ingress (no host CSR; directly wired)
        - {role: "cfg_sdr_en",       direction: "input",  description: "controller enable (post-init)"}
        - {role: "cfg_sdr_mode_reg", direction: "input",  width: 13, description: "SDRAM mode register (CAS+burst+sequential/interleaved)"}
        - {role: "cfg_sdr_tras_d",   direction: "input",  width: 4,  description: "tRAS delay in cycles"}
        - {role: "cfg_sdr_trp_d",    direction: "input",  width: 4,  description: "tRP delay in cycles"}
        - {role: "cfg_sdr_trcd_d",   direction: "input",  width: 4,  description: "tRCD delay in cycles"}
        - {role: "cfg_sdr_cas",      direction: "input",  width: 3,  description: "CAS latency (typ 2 or 3)"}
        - {role: "cfg_req_depth",    direction: "input",  width: 2,  description: "request FIFO depth"}
        - {role: "cfg_sdr_dev_config", direction: "input", width: 2, description: "SDRAM device size (8M/16M/32M/64M)"}
        - {role: "cfg_colbits",      direction: "input",  width: 2,  description: "column-address width selector (8/9/10/11)"}
      typical_pin_count: "60-100 (host bus + SDRAM bus + config)"
    L2_requirements:
      - {concept: "host_protocol",   hint: "Wishbone-classic 32-bit slave (pipelined-OK)"}
      - {concept: "sdram_command_set", hint: "NOP / ACTIVE / READ / WRITE / PRECHARGE / AUTO_REFRESH / MODE_REGISTER_SET / BURST_TERMINATE"}
      - {concept: "bank_arbitration", hint: "4 independent banks, page-mode optimization (track open row per bank)"}
      - {concept: "auto_refresh",   hint: "background AUTO_REFRESH command at tREFI interval (typ ~7.8 µs at 64 ms / 8192 rows)"}
      - {concept: "burst_modes",    hint: "burst length 1/2/4/8/full-page, sequential or interleaved"}
      - {concept: "init_sequence",  hint: "100µs power-on wait → PRECHARGE-ALL → 8x AUTO_REFRESH → MODE_REGISTER_SET"}
    L3_command_protocol:
      typical_phy:
        host_bus: "Wishbone-classic"
        sdram_bus: "JEDEC SDR-SDRAM (4-bit command code: {cs_n, ras_n, cas_n, we_n})"
      typical_command_encoding:
        - {name: "DESELECT",   code: "1xxx", desc: "device unselected"}
        - {name: "NOP",        code: "0111", desc: "no operation (idle)"}
        - {name: "ACTIVE",     code: "0011", desc: "open row (RAS+address)"}
        - {name: "READ",       code: "0101", desc: "read with column address"}
        - {name: "WRITE",      code: "0100", desc: "write with column address"}
        - {name: "PRECHARGE",  code: "0010", desc: "close row (with A10=1 for all banks)"}
        - {name: "AUTO_REFRESH", code: "0001", desc: "refresh all banks (CKE high)"}
        - {name: "MODE_REGISTER_SET", code: "0000", desc: "load mode register (CAS, burst length, burst type)"}
        - {name: "BURST_TERMINATE", code: "0110", desc: "early-terminate burst"}
    L4_register_map:
      not_applicable: true
      reason: "sdr_ctrl-style controllers expose configuration via dedicated cfg_* input ports rather than a host CSR file. Higher-level wrappers (e.g., LiteDRAM with LiteX CSR) add a register file separately."
    L5_adi_spec:
      pad_role: "SDRAM command/address/control are off-chip single-ended LVCMOS; data is bidirectional with byte-mask qualified writes; clock is forwarded with 1ns nominal pad delay"
    L6_control_logic:
      typical_submodules:
        - {name: "sdrc_top",        role: "top wrapper (instantiates core + Wishbone bridge)"}
        - {name: "sdrc_core",       role: "main controller integrating req_gen + bank_ctl + xfr_ctl + bs_convert"}
        - {name: "sdrc_req_gen",    role: "request generator: extract bank/row/col from address, push to req FIFO"}
        - {name: "sdrc_bank_ctl",   role: "bank arbiter: select which of 4 banks to service next"}
        - {name: "sdrc_bank_fsm",   role: "per-bank FSM (one instance per bank): IDLE/ACTIVE/READ/WRITE/PRECHARGE/REFRESH"}
        - {name: "sdrc_xfr_ctl",    role: "transfer controller: drive READ/WRITE to selected bank, manage burst counter"}
        - {name: "sdrc_bs_convert", role: "byte-strobe / burst convert (Wishbone byte_sel ↔ SDRAM dqm)"}
        - {name: "wb2sdrc",         role: "Wishbone front-end wrapper"}
        - {name: "async_fifo",      role: "async FIFO for host-clk ↔ sdram-clk crossing (cmd 4-deep, wr 8-deep, rd 4-deep)"}
        - {name: "sync_fifo",       role: "sync FIFO for in-clock-domain queueing"}
      typical_fsm:
        bank_states: ["IDLE", "ACTIVE", "READ", "WRITE", "PRECHARGE", "REFRESH"]
        mgm_states:  ["INIT_WAIT", "INIT_PRECHARGE", "INIT_REFRESH", "INIT_MRS", "READY", "ARBITRATE", "ISSUE", "REFRESH"]
        xfr_states:  ["IDLE", "READ", "WRITE", "BURST_TERM"]
    L7_test_debug:
      typical_strategy: "Wishbone-side BIST patterns (walking-1, address-as-data); SDRAM model loopback in bench"
      typical_modes: ["normal SDRAM access (R/W/refresh interleaved)", "init-sequence playback", "BIST scrub"]
    L8_timing_waveform:
      typical_clock_domains: 2
      typical_clocks: ["wb_clk_i (host)", "sdram_clk (SDRAM)"]
      typical_jedec_ac_parameters:
        - {name: "tRC",   typical_ns: 60, desc: "ACTIVE→ACTIVE same bank"}
        - {name: "tRP",   typical_ns: 20, desc: "PRECHARGE→ACTIVE"}
        - {name: "tRCD",  typical_ns: 20, desc: "ACTIVE→READ/WRITE"}
        - {name: "tRAS",  typical_ns: 45, desc: "ACTIVE→PRECHARGE min"}
        - {name: "tCAS",  typical_cycles: "2 or 3", desc: "READ→data-out latency"}
        - {name: "tRFC",  typical_ns: 70, desc: "AUTO_REFRESH→next command"}
        - {name: "tREFI", typical_us: 7.8, desc: "refresh interval (64ms / 8192 rows)"}
    L8R_rtl_constants:
      typical_default_widths:
        - {name: "SDR_DW",     value: 16,  desc: "SDRAM data width"}
        - {name: "SDR_BW",     value: 2,   desc: "SDRAM byte enables"}
        - {name: "APP_AW",     value: 26,  desc: "Wishbone address width"}
        - {name: "APP_DW",     value: 32,  desc: "Wishbone data width"}
        - {name: "ROW_BITS",   value: 13,  desc: "SDRAM row width"}
        - {name: "COL_BITS",   value: "8/9/10/11 selectable via cfg_colbits"}
        - {name: "BANK_BITS",  value: 2,   desc: "4 banks (2-bit bank address)"}
      typical_command_codes_4bit: "{cs_n, ras_n, cas_n, we_n}"
      typical_init_wait_us: 100
      typical_init_refresh_count: 8
      typical_async_fifo_depths:
        - {name: "cmd_fifo",   depth: 4}
        - {name: "wr_fifo",    depth: 8}
        - {name: "rd_fifo",    depth: 4}
    L9_integration_spec:
      typical_dtops: ["sdrc_top"]
      typical_submodule_instantiation: "1 × sdrc_core, 1 × sdrc_req_gen, 1 × sdrc_bank_ctl, 4 × sdrc_bank_fsm, 1 × sdrc_xfr_ctl, 1 × sdrc_bs_convert, 1 × wb2sdrc, 3 × async_fifo (cmd/wr/rd)"
      typical_internal_wires: "open_row[4][12:0], bank_open[4], bank_busy[4], xfr_active, refresh_pending"
    L10_test_cases:
      typical_vectors:
        - {name: "sequential write+read", expect: "host writes 16 words, reads back 16 words, data matches"}
        - {name: "bank-interleaved",      expect: "writes alternating bank0/bank1 issue page-mode without re-PRECHARGE"}
        - {name: "refresh interleaved",   expect: "AUTO_REFRESH fires every tREFI without losing host transactions"}
        - {name: "init sequence",         expect: "POWER_ON → 100µs wait → PRECHARGE-ALL → 8x AUTO_REFRESH → MODE_REGISTER_SET → READY"}
    L11_calibration:
      typical_lookup: "CAS latency table (2 or 3), burst-length encoding (1/2/4/8/full-page = mode_reg[2:0]), refresh interval table (tREFI vs sdram_clk frequency)"
      typical_mode_register_layout: "mode_reg[2:0]=burst_length, [3]=burst_type (sequential/interleaved), [6:4]=CAS latency, [8:7]=test mode, [12:9]=reserved"
    L12_behavioral_sequences:
      - {name: "init sequence",            steps: "power-on → 100µs wait → CKE high → PRECHARGE-ALL → 2x AUTO_REFRESH → MODE_REGISTER_SET → READY"}
      - {name: "single read",              steps: "ACTIVE bank+row → wait tRCD → READ col → wait CAS cycles → data on bus → PRECHARGE if auto"}
      - {name: "single write",             steps: "ACTIVE bank+row → wait tRCD → WRITE col + data → PRECHARGE if auto"}
      - {name: "page-mode burst (4-word)", steps: "ACTIVE → 4 back-to-back WRITEs in same row, no re-ACTIVATE between"}
      - {name: "refresh interleave",       steps: "any active bank PRECHARGE → AUTO_REFRESH (all banks) → wait tRFC → resume"}
    L13_lab_calibration:
      typical_smoke_tests: ["loopback memtest from FPGA: write counter pattern → read back → CRC match", "scope SDRAM CMD/ADDR/DATA pins for setup/hold relative to sdr_clk_pad"]
      typical_lab_equipment: ["100MHz logic analyzer on SDRAM bus", "off-chip SDRAM test board (Micron MT48LC or equivalent)"]



# -----------------------------------------------------------------------------
# Protocol-IC subclasses (below cable-side-id-ic, sibling APB/UART/SPI peripheral)
# -----------------------------------------------------------------------------
apb-peripheral:
  reference: "PULP apb_gpio / apb_timer"
  public_source: "github.com/pulp-platform/apb_gpio"
  typical_apb_version: "APB3"
  typical_addr_width: 12
  typical_data_width: 32
  typical_irq_count: 1
  typical_wait_states: 0
  # typical_scaffolds — REMOVED in #493 (17 entries). Coverage was 0/201
  # doc-sets, and once connected the mechanism injected wrong facts. The
  # reason is recorded in tools/phase1_engine/gap_detect.py
  # `_RETIRED_MECHANISMS['typical_scaffolds']`; read it before re-adding.

uart-peripheral:
  reference: "alexforencich/verilog-uart"
  public_source: "github.com/alexforencich/verilog-uart"
  applicable_subclasses: ['uart-peripheral-16550']
  typical_data_width_bits: 8
  typical_frame_format: "8N1"
  typical_oversampling: 8
  typical_fifo_depth: {tx: 0, rx: 0}
  # typical_scaffolds — REMOVED in #493 (13 entries). Coverage was 0/201
  # doc-sets, and once connected the mechanism injected wrong facts. The
  # reason is recorded in tools/phase1_engine/gap_detect.py
  # `_RETIRED_MECHANISMS['typical_scaffolds']`; read it before re-adding.

spi-peripheral:
  reference: "darkriscv spi core / core_spiflash / OpenCores simple_spi"
  public_source: "github.com/freecores/simple_spi (OpenCores)"
  typical_modes: ["Mode 0", "Mode 1", "Mode 2", "Mode 3"]
  typical_max_clock_mhz: 50
  typical_data_width: 8

  # v0.74 post-simple_spi benchmark: spi-peripheral specific structure.
  # Models the OpenCores simple_spi shape (Wishbone-classic 8-bit master
  # with 4-deep TX/RX FIFO and 12-bit clock divider).
  typical_structure:
    L1_datasheet:
      typical_pins:
        - {role: "wb_clk_i / clk", direction: "input",  description: "Wishbone bus clock"}
        - {role: "wb_rst_i / rst", direction: "input",  description: "active-high synchronous reset"}
        - {role: "wb_adr_i",       direction: "input",  width: 2,  description: "register address (2 bits → 4 regs)"}
        - {role: "wb_dat_i",       direction: "input",  width: 8,  description: "Wishbone write data"}
        - {role: "wb_dat_o",       direction: "output", width: 8,  description: "Wishbone read data"}
        - {role: "wb_we_i",        direction: "input",  description: "Wishbone write enable"}
        - {role: "wb_stb_i",       direction: "input",  description: "Wishbone strobe"}
        - {role: "wb_cyc_i",       direction: "input",  description: "Wishbone cycle"}
        - {role: "wb_ack_o",       direction: "output", description: "Wishbone acknowledge"}
        - {role: "inta_o",         direction: "output", description: "interrupt to host (registered SPIF & SPIE)"}
        - {role: "sck_o",          direction: "output", description: "SPI clock to slave"}
        - {role: "mosi_o",         direction: "output", description: "Master Out Slave In (MSB-first; treg[7])"}
        - {role: "miso_i",         direction: "input",  description: "Master In Slave Out"}
      typical_pin_count: "13-15 (Wishbone classic + SPI master)"
    L2_requirements:
      - {concept: "spi_modes",       hint: "all 4 modes (CPOL/CPHA = 00/01/10/11) via SPCR[3:2]"}
      - {concept: "fifo_depth",      hint: "4-deep TX and RX (parametric fifo4 submodule)"}
      - {concept: "clock_divider",   hint: "12-bit prescaler with 12-entry case statement (factors 2,4,16,32,...)"}
      - {concept: "interrupt",       hint: "SPIF (transfer complete) & WCOL (write collision); registered output"}
      - {concept: "slave_select",    hint: "no built-in SS_n; controller is master-only with software SS handling"}
      - {concept: "data_order",      hint: "MSB-first (mosi_o = treg[7])"}
    L3_command_protocol:
      typical_phy:
        signals: ["sck_o", "mosi_o", "miso_i"]
        framing: "8-bit transfers; clock idle/active per CPOL; sample/setup edge per CPHA"
      typical_modes_table:
        - {mode: 0, cpol: 0, cpha: 0, idle: "low",  data_change: "falling edge", data_sample: "rising edge"}
        - {mode: 1, cpol: 0, cpha: 1, idle: "low",  data_change: "rising edge",  data_sample: "falling edge"}
        - {mode: 2, cpol: 1, cpha: 0, idle: "high", data_change: "rising edge",  data_sample: "falling edge"}
        - {mode: 3, cpol: 1, cpha: 1, idle: "high", data_change: "falling edge", data_sample: "rising edge"}
    L4_register_map:
      typical_registers:
        - {offset: 0, name: "SPCR", access: "R/W", reset: "0x10", bits: "SPIE[7], SPE[6], DWOM[5], MSTR[4 read-only=1], CPOL[3], CPHA[2], SPR[1:0]"}
        - {offset: 1, name: "SPSR", access: "R/W (W1C)", reset: "0x05", bits: "SPIF[7 W1C], WCOL[6 W1C], 0[5:4], TIRQ[3 W1C], TFE[2], MODF[1 unused], 0[0]"}
        - {offset: 2, name: "SPDR", access: "R/W", reset: "undefined", bits: "shift register / FIFO data port"}
        - {offset: 3, name: "SPER", access: "R/W", reset: "0x00", bits: "ICNT[7:6], 0[5:3], 0[2], ESPR[1:0]"}
      typical_address_width_bits: 2
      typical_data_width_bits: 8
    L5_adi_spec:
      pad_role: "no off-chip pads at controller; sck_o/mosi_o/miso_i route to top-level pads in parent SoC"
    L6_control_logic:
      typical_submodules:
        - {name: "fifo4",    role: "4-deep parametric (dw) FIFO; wp/rp+gb full/empty"}
        - {name: "treg",     role: "8-bit shift register (mosi_o = treg[7])"}
        - {name: "clkcnt",   role: "12-bit clock divider with 12-entry case decode"}
      typical_fsm:
        states: ["IDLE (00)", "LOAD (01)", "SHIFT (11)", "DEFENSIVE (10)"]
        encoding: "2-bit; 00→01→11→back; 10 is unused but defensively coded"
    L7_test_debug:
      typical_strategy: "loop {4 modes} × {4 divisors} × {fill 8 bytes → verify 8 bytes}; loopback miso=mosi"
      typical_modes: ["loopback transfer self-check", "FIFO empty/full edge", "WCOL trigger"]
    L8_timing_waveform:
      typical_clock_domains: 1
      typical_max_sck_freq: "wb_clk / 2 (when ESPR=00 and SPR=00)"
      typical_sck_divisor_table_count: 12
    L8R_rtl_constants:
      typical_fifo_depth: 4
      typical_address_width_bits: 2
      typical_data_width_bits: 8
      typical_clkcnt_width_bits: 12
      typical_register_offsets:
        - {name: "SPCR", offset: 0}
        - {name: "SPSR", offset: 1}
        - {name: "SPDR", offset: 2}
        - {name: "SPER", offset: 3}
      typical_reset_values:
        - {reg: "SPCR", reset_hex: "0x10", reason: "MSTR forced to 1 always"}
        - {reg: "SPSR", reset_hex: "0x05"}
        - {reg: "SPER", reset_hex: "0x00"}
    L9_integration_spec:
      typical_dtops: ["simple_spi_top"]
      typical_submodule_instantiation: "1 × fifo4 (TX), 1 × fifo4 (RX), shift register, clock divider"
    L10_test_cases:
      typical_vectors: ["mode-X loopback fill 0x55 → 0x55", "mode-X loopback fill 0xAA → 0xAA"]
    L11_calibration:
      not_applicable: false
      typical_calibration: "host writes ESPR + SPR to select SCK divisor from 12-entry table; no analog calibration"
    L12_behavioral_sequences:
      - {name: "single byte transfer", steps: "host writes SPDR → fifo4 push → load treg → 8 SCK edges → SPIF set → IRQ → host reads SPDR (RX FIFO pop)"}
      - {name: "FIFO burst",            steps: "host writes 4 bytes back-to-back → all 4 shifted out → 4 received → host reads 4"}
      - {name: "WCOL trigger",          steps: "host writes SPDR while busy → WCOL bit set in SPSR"}
    L13_lab_calibration:
      not_applicable: true
      reason: "Soft-IP; no analog trim or OTP. Lab bringup uses logic analyzer on sck/mosi/miso."



i2c-peripheral-advanced:
  reference: "OpenCores i2c_master"
  typical_address_bits_7bit: 7
  typical_address_bits_10bit: 10
  typical_speed_max_khz: 400
  supports_clock_stretching: true

# -----------------------------------------------------------------------------
# Bus fabric / interconnect
# -----------------------------------------------------------------------------
bus-controller:
  reference: "alexforencich/verilog-axi (AXI crossbar) / OpenCores `can` (CAN/SJA1000)"
  public_source: "github.com/alexforencich/verilog-axi + opencores.org/projects/can"
  typical_protocol: "AXI4 (memory) / CAN 2.0B (network) / I2C / SPI"
  typical_data_widths: [32, 64, 128, 256, 512]
  typical_topology: "crossbar (memory bus) / arbitrated single-wire (CAN)"
  typical_id_width: 4
  # typical_scaffolds — REMOVED in #493 (5 entries). Coverage was 0/201
  # doc-sets, and once connected the mechanism injected wrong facts. The
  # reason is recorded in tools/phase1_engine/gap_detect.py
  # `_RETIRED_MECHANISMS['typical_scaffolds']`; read it before re-adding.
  typical_subfamilies: ["memory-bus (AXI/AHB/Wishbone)", "network-bus (CAN/LIN)", "serial (I2C/SPI master)"]

  # v0.74 post-can benchmark: bus-controller (network-bus subfamily,
  # SJA1000-compatible CAN 2.0B variant) specific structure.
  typical_structure:
    L1_datasheet:
      typical_pins:
        - {role: "clk_i / wb_clk_i", direction: "input",  description: "host bus clock (typically 8/16/24 MHz)"}
        - {role: "rst_i / wb_rst_i", direction: "input",  description: "active-high synchronous reset"}
        - {role: "wb_adr_i / addr",  direction: "input",  width: 8,  description: "register address (host bus side)"}
        - {role: "wb_dat_i / data_in",  direction: "input",  width: 8, description: "host write data (8-bit; SJA1000 register access)"}
        - {role: "wb_dat_o / data_out", direction: "output", width: 8, description: "host read data"}
        - {role: "wb_we_i / cs_can_i",  direction: "input", description: "write enable (Wishbone) or chip select (8051 mode)"}
        - {role: "wb_cyc_i / port_0_di",  direction: "input", description: "Wishbone cycle / 8051 port_0 data"}
        - {role: "wb_stb_i / port_0_oe",  direction: "input", description: "Wishbone strobe / 8051 port_0 output enable"}
        - {role: "wb_ack_o",         direction: "output", description: "Wishbone acknowledge"}
        - {role: "irq_n",            direction: "output", description: "active-low interrupt to host"}
        - {role: "rx_i",             direction: "input",  description: "CAN bus RX (from external transceiver)"}
        - {role: "tx_o",             direction: "output", description: "CAN bus TX (to external transceiver)"}
        - {role: "bus_off_on",       direction: "output", description: "1=node not in bus-off state"}
        - {role: "clkout_o",         direction: "output", description: "divided/forwarded clock (configurable)"}
      typical_pin_count: "12-16"
    L2_requirements:
      - {concept: "modes",            hint: "BasicCAN + PeliCAN (SJA1000-compatible mode-multiplexed register layout)"}
      - {concept: "frame_formats",    hint: "Standard 11-bit + Extended 29-bit identifiers (CAN 2.0B)"}
      - {concept: "bit_timing",       hint: "BTR0 (BRP[5:0] + SJW[7:6]) + BTR1 (TSEG1[3:0] + TSEG2[6:4] + SAM[7])"}
      - {concept: "rx_fifo",          hint: "64 bytes + 64 length entries (typical SJA1000 RX FIFO)"}
      - {concept: "acceptance_filter", hint: "Single (1×ACR + 1×AMR) or Dual (2×ACR + 2×AMR)"}
      - {concept: "error_management", hint: "TEC + REC counters; 96 warning / 127 passive / 255 bus-off thresholds"}
      - {concept: "test_modes",       hint: "Listen-only (no TX), Self-test (loopback)"}
    L3_command_protocol:
      typical_phy:
        bus_signals: ["rx_i", "tx_o"]
        framing: "ISO 11898-1 frame: SOF + ID(11/29) + RTR + IDE + r0/r1 + DLC(4) + DATA(0-8 bytes) + CRC(15) + ACK + EOF(7) + IFS(3)"
      typical_arbitration: "non-destructive bit-wise (lower ID wins)"
      typical_bit_stuffing: "after 5 same-polarity bits, insert 1 opposite"
      typical_error_signaling: "active error frame (6 dominant bits) when error detected"
    L4_register_map:
      typical_modes: ["BasicCAN (mode bit MOD[0]=1)", "PeliCAN (mode bit MOD[0]=0)"]
      typical_address_width_bits: 5
      typical_register_examples:
        - {name: "MODE",         basic_offset: 0,  peli_offset: 0,  reset: "0x01", access: "R/W", desc: "MOD[0]=mode select"}
        - {name: "COMMAND",      basic_offset: 1,  peli_offset: 1,  reset: "0x00", access: "W",   desc: "TR/AT/RRB/CDO/SRR (transmit/abort/release/clear-overrun/self-rx)"}
        - {name: "STATUS",       basic_offset: 2,  peli_offset: 2,  reset: "0x0C", access: "R",   desc: "BS/ES/TS/RS/TCS/TBS/DOS/RBS"}
        - {name: "INTERRUPT",    basic_offset: 3,  peli_offset: 3,  reset: "0x00", access: "R-clear-on-read", desc: "BEI/ALI/EPI/0/DOI/EI/TI/RI"}
        - {name: "BTR0",         basic_offset: 6,  peli_offset: 6,  reset: "0x00", access: "R/W", desc: "BRP[5:0] + SJW[7:6]"}
        - {name: "BTR1",         basic_offset: 7,  peli_offset: 7,  reset: "0x00", access: "R/W", desc: "TSEG1[3:0] + TSEG2[6:4] + SAM[7]"}
        - {name: "ACR",          basic_offset: 4,  peli_offset: 16, reset: "0x00", access: "R/W (in reset mode)", desc: "Acceptance Code Register"}
        - {name: "AMR",          basic_offset: 5,  peli_offset: 20, reset: "0xFF", access: "R/W (in reset mode)", desc: "Acceptance Mask Register"}
        - {name: "TX_BUFFER",    basic_offset: 10, peli_offset: 16, reset: "—",     access: "W (in operating mode)", desc: "transmit buffer (10-19 BasicCAN; 16-28 PeliCAN)"}
        - {name: "RX_BUFFER",    basic_offset: 20, peli_offset: 16, reset: "—",     access: "R", desc: "receive buffer view (auto-pops on RRB)"}
        - {name: "EWLR",         basic_offset: null, peli_offset: 13, reset: "96", access: "R/W (in reset mode)", desc: "Error Warning Limit Register"}
        - {name: "TEC",          basic_offset: null, peli_offset: 14, reset: "0x00", access: "R", desc: "Transmit Error Counter"}
        - {name: "REC",          basic_offset: null, peli_offset: 15, reset: "0x00", access: "R", desc: "Receive Error Counter"}
    L5_adi_spec:
      pad_role: "rx_i / tx_o connect to external transceiver (e.g., TJA1042) — single-wire differential at the bus level"
    L6_control_logic:
      typical_submodules:
        - {name: "can_top",       role: "top wrapper: host bus + register access + submodule wiring"}
        - {name: "can_registers", role: "all CSRs incl. mode-multiplexed BasicCAN/PeliCAN layout"}
        - {name: "can_btl",       role: "Bit Timing Logic: SYNC + TSEG1 + TSEG2 quanta, hard sync, resync"}
        - {name: "can_bsp",       role: "Bit Stream Processor: TX/RX FSM, bit stuffing, error states"}
        - {name: "can_acf",       role: "Acceptance Code Filter: single + dual filter modes"}
        - {name: "can_crc",       role: "CRC15 generator (polynomial 0x4599)"}
        - {name: "can_fifo",      role: "RX FIFO (64-byte buffer + 64-entry length)"}
        - {name: "can_register_*", role: "register helper macros (sync/asyn variants)"}
      typical_fsm:
        bsp_states: ["IDLE", "SOF", "ID", "RTR", "IDE", "r0", "DLC", "DATA", "CRC", "CRC_DELIM", "ACK", "ACK_DELIM", "EOF", "IFS", "ERROR_FRAME", "OVERLOAD_FRAME"]
        btl_states: ["sync_seg", "tseg1", "tseg2"]
    L7_test_debug:
      typical_strategy: "transmit/receive frames at programmed bit rate; force bit error → check TEC/REC; force bus-off recovery"
      typical_modes: ["Listen-only (RM bit)", "Self-test loopback", "Sleep mode"]
    L8_timing_waveform:
      typical_clock_domains: 1
      typical_bit_rates_kbps: [10, 20, 50, 125, 250, 500, 800, 1000]
      typical_segments: "SYNC_SEG (1 quantum) + TSEG1 (PROP+PHASE1; 2-16 quanta) + TSEG2 (PHASE2; 1-8 quanta)"
      typical_quanta_per_bit: "8-25"
    L8R_rtl_constants:
      typical_crc_polynomial: "15'h4599"
      typical_rx_fifo_depth_bytes: 64
      typical_rx_fifo_length_entries: 64
      typical_ewlr_default: 96
      typical_passive_threshold: 127
      typical_bus_off_threshold: 255
      typical_btl_preset_calc: "(BRP+1) << 1 (1-quantum = 2*(BRP+1) clk_i ticks)"
      typical_btr0_layout: "BRP[5:0] | SJW[7:6]"
      typical_btr1_layout: "TSEG1[3:0] | TSEG2[6:4] | SAM[7]"
    L9_integration_spec:
      typical_dtops: ["can_top"]
      typical_submodule_instantiation: "1 × can_registers, 1 × can_btl, 1 × can_bsp, 1 × can_acf, 1 × can_crc, 1 × can_fifo"
      typical_internal_wires: "tx_state[2:0] (BSP→TX), rx_state[2:0] (BSP→RX), data_in_fifo (BSP→FIFO), tip (transmit-in-progress), rx_idle (BSP→ALL)"
    L10_test_cases:
      typical_vectors:
        - {name: "transmit standard frame", expect: "ID=0x123, data=8 bytes, no error, TI=1 after EOF"}
        - {name: "receive extended frame",  expect: "29-bit ID matches ACR/AMR, frame appears in RX FIFO, RI=1"}
        - {name: "bit timing 500kbps @ 16MHz", expect: "BRP=1, TSEG1=4, TSEG2=3, SJW=1 → 8 quanta/bit @ 1µs/bit"}
    L11_calibration:
      typical_bit_rate_table:
        - {bit_rate_kbps: 1000, clk_mhz: 16, btr0_hex: "0x00", btr1_hex: "0x14", quanta: 8}
        - {bit_rate_kbps: 500,  clk_mhz: 16, btr0_hex: "0x01", btr1_hex: "0x14", quanta: 8}
        - {bit_rate_kbps: 250,  clk_mhz: 16, btr0_hex: "0x03", btr1_hex: "0x14", quanta: 8}
        - {bit_rate_kbps: 125,  clk_mhz: 16, btr0_hex: "0x07", btr1_hex: "0x14", quanta: 8}
        - {bit_rate_kbps: 100,  clk_mhz: 16, btr0_hex: "0x09", btr1_hex: "0x14", quanta: 8}
    L12_behavioral_sequences:
      - {name: "arbitration loss",   steps: "two nodes start TX simultaneously → lower-ID wins → loser becomes receiver mid-frame"}
      - {name: "error frame",        steps: "stuff error or CRC mismatch → 6 dominant bits → error delim → IFS"}
      - {name: "bus-off recovery",   steps: "TEC > 255 → bus-off → 128 × 11 bits of recessive → re-enter active state"}
      - {name: "bit stuffing",       steps: "5 same-polarity bits → insert opposite → receiver removes inserted bit"}
    L13_lab_calibration:
      typical_smoke_tests: ["loopback self-test (Listen-only off, internal RX of own TX)", "two-node bringup with TJA1042 transceivers + 120Ω terminator"]
      typical_lab_equipment: ["CAN bus analyzer (PCAN-USB or similar)", "scope on rx/tx with 120Ω terminator"]


    L4.address_decode_regions:
      - {master_index: 0, base: "0x00000000", size_bytes: 268435456, description: "Region 0: main memory"}
      - {master_index: 1, base: "0x10000000", size_bytes: 4096,      description: "Region 1: peripheral block"}
      - {master_index: 2, base: "0x20000000", size_bytes: 16384,     description: "Region 2: debug block"}
      - {master_index: 3, base: "0xF0000000", size_bytes: 1048576,   description: "Region 3: system control"}
    L4.decode_error_policy: "DECERR"
    L5.read_write_paths_split: true
    L5.ordering_model: "per-ID"
    L6.submodule_control_logic:
      addr_decoder:   {purpose: "Master→slave address-region decoder",           states: []}
      arbiter:        {purpose: "Round-robin arbiter for contending masters",    states: [IDLE, GRANT]}
      mux_write:      {purpose: "M×S write-channel multiplexer",                 states: []}
      mux_read:       {purpose: "M×S read-channel multiplexer",                  states: []}
      data_resize:    {purpose: "Width adapter for heterogeneous buses",         states: []}
      ordering_unit:  {purpose: "Per-ID ordering / in-order commit control",     states: []}
    L8R.cdc_support: false
    L9.dtop_top_level:
      module_name: "bus_intercon_top"
      ports:
        - {name: clk,     direction: input,  width: 1}
        - {name: resetn,  direction: input,  width: 1}
        - {name: m_valid, direction: input,  width: 1,  description: "Master request valid"}
        - {name: m_addr,  direction: input,  width: 32}
        - {name: m_wdata, direction: input,  width: 32}
        - {name: m_we,    direction: input,  width: 1}
        - {name: m_be,    direction: input,  width: 4}
        - {name: m_rdata, direction: output, width: 32}
        - {name: m_ready, direction: output, width: 1}
        - {name: s_valid, direction: output, width: 4,  description: "Per-slave select (4 slaves)"}
        - {name: s_addr,  direction: output, width: 32}
        - {name: s_wdata, direction: output, width: 32}
        - {name: s_we,    direction: output, width: 1}
        - {name: s_be,    direction: output, width: 4}
        - {name: s_rdata, direction: input,  width: 128, description: "4 slaves × 32b concat"}
        - {name: s_ready, direction: input,  width: 4}
    L9.submodules: {addr_decoder: wb_decoder, arbiter: wb_arbiter, mux_write: wb_mux_mm, mux_read: wb_mux_ms, data_resize: wb_data_resize, ordering_unit: wb_order}
    L9.instantiation_order:
      order:
        - "u_addr_decoder (ADDR_DECODER) - M→S region decoder"
        - "u_arbiter (ARBITER) - round-robin arbitration"
        - "u_mux_write (MUX_WRITE) - write-channel mux"
        - "u_mux_read (MUX_READ) - read-channel mux"
        - "u_data_resize (DATA_RESIZE) - width adapter"
        - "u_ordering_unit (ORDERING_UNIT) - per-ID ordering"
    L9.internal_wires:
      - {name: slave_select,  width: 4,  description: "addr_decoder → arbiter per-slave hit"}
      - {name: grant,         width: 4,  description: "arbiter → mux grant vector"}
      - {name: write_sel,     width: 4,  description: "grant → mux_write channel select"}
      - {name: read_sel,      width: 4,  description: "grant → mux_read channel select"}
      - {name: w_data_wide,   width: 128, description: "mux_write → data_resize wide data"}
      - {name: w_data_narrow, width: 32, description: "data_resize → slave narrow data"}
      - {name: r_data_wide,   width: 128, description: "slave → data_resize read return"}
      - {name: r_data_narrow, width: 32, description: "data_resize → mux_read"}
      - {name: order_tag,     width: 4,  description: "ordering_unit → arbiter tag"}
      - {name: decode_err,    width: 1,  description: "addr_decoder → master DECERR"}
      - {name: active_id,     width: 4,  description: "arbiter → ordering_unit active ID"}
      - {name: bus_busy,      width: 1,  description: "arbiter → master bus_busy"}

# -----------------------------------------------------------------------------
# SoC harness
# -----------------------------------------------------------------------------
soc-harness:
  reference: "efabless/caravel"
  public_source: "github.com/efabless/caravel"
  typical_variant: "caravel"
  typical_pdk: "sky130A"
  mprj_io_pad_count: 38
  mprj_pwr_pad_count: 4
  la_width: 128
  user_irq_count: 3
  includes_management_soc: true

soc-harness-caravan:
  reference: "efabless/caravan"
  notes: "Analog-capable variant of caravel with analog pads in user area"

# -----------------------------------------------------------------------------
# Processor subclasses (expanded)
# -----------------------------------------------------------------------------
ooo-cpu:
  reference: "riscv-boom"
  typical_issue_width: 2
  typical_rob_entries: 32
  typical_physical_regfile_size: 64
  privilege_modes: ["M", "S", "U"]
  isa_extensions: ["I", "M", "A", "C", "F", "D"]

# -----------------------------------------------------------------------------
# Crypto engine subclasses
# -----------------------------------------------------------------------------
block-cipher:
  reference: "SecWorks AES / asicsws DES (OpenCores)"
  public_source: "github.com/secworks/aes, opencores.org/projects/des"
  typical_block_width_bits: "64 (DES) or 128 (AES)"
  typical_key_widths: "56 (DES), 168 (3DES), 128/192/256 (AES)"
  typical_rounds: {des: 16, des3: 48, aes128: 10, aes192: 12, aes256: 14}
  typical_throughput_cycles: "16-48 (iterative) or 1/cycle (pipeline)"

  # v0.79 (C-half-2) typical_large_tables — see hash-function-csr for schema.
  typical_large_tables:
    - {layer: L8R, path: "sbox",            count: 256, source_spec: "FIPS 197 §5.1.1 — AES SubBytes lookup table (multiplicative inverse in GF(2^8) under affine transform); 16 × 16 hex entries", member_shape: "8-bit hex value (0x00..0xFF)"}
    - {layer: L8R, path: "inv_sbox",        count: 256, source_spec: "FIPS 197 §5.3.2 — AES InvSubBytes (inverse of sbox)",                                                                          member_shape: "8-bit hex value"}
    - {layer: L8R, path: "rcon",             count: 15, source_spec: "FIPS 197 §5.2 — round-constant words for key expansion: Rcon[i] = (x^(i-1) mod GF(2^8)) || 0x000000; 10 entries needed for AES-128, 15 for AES-256", member_shape: "32-bit hex word (only top byte non-zero)"}
    - {layer: L8R, path: "des_sbox1..8",    count: 64,  source_spec: "FIPS 46-3 — 8 DES S-boxes (S1..S8); each is 64-entry 4-bit lookup (6-bit input)", member_shape: "4-bit value"}
    - {layer: L8R, path: "des_ip_fp_e_p",   count: "64+64+48+32", source_spec: "FIPS 46-3 — IP, FP, E-expansion, P-permutation bit-index tables", member_shape: "bit index"}

  typical_structure:
    L1_datasheet:
      typical_pins:
        - {role: "clk",       direction: "input",  width: 1,  description: "positive-edge system clock"}
        - {role: "block_in / desIn",  direction: "input",  width: "64 (DES) or 128 (AES)", description: "input block (plaintext or ciphertext)"}
        - {role: "key",       direction: "input",  width: "56 (DES) / 168 (3DES) / 128-256 (AES)", description: "cipher key; parity bits stripped at boundary for DES"}
        - {role: "decrypt / encdec",  direction: "input",  width: 1,  description: "0 = encrypt, 1 = decrypt"}
        - {role: "roundSel",  direction: "input",  width: "4 (DES) / 6 (3DES)", description: "round counter (iterative variant only; host-driven 0..N-1); absent in pipeline variant"}
        - {role: "block_out / desOut", direction: "output", width: "64 (DES) or 128 (AES)", description: "output block"}
      typical_interface_variants:
        - {variant: "signal-level (no bus)", description: "dedicated ports for key, block_in, decrypt, roundSel; no address space, no handshake; timing is fixed cycle-count contract"}
        - {variant: "bus-wrapped (Wishbone / APB)", description: "CTRL/STATUS/KEY/BLOCK registers; standard bus handshake; init/next strobes"}
    L2_requirements:
      - {concept: "block_size",       hint: "64 bits (DES/3DES), 128 bits (AES) — fixed per algorithm"}
      - {concept: "key_size",         hint: "56 bits (DES), 168 bits (3DES key1+key2+key3), 128/192/256 (AES)"}
      - {concept: "round_count",      hint: "16 (DES), 48 (3DES = 3x16), 10/12/14 (AES-128/192/256)"}
      - {concept: "feistel_structure", hint: "DES/3DES use Feistel network (L/R halves); AES uses SPN (SubBytes/ShiftRows/MixColumns/AddRoundKey)"}
      - {concept: "encrypt_decrypt",  hint: "same datapath with key schedule reversal (Feistel) or separate inverse datapath (SPN)"}
      - {concept: "implementation_variant", hint: "area-opt (single round unit, iterative N cycles/block) vs perf-opt (N-stage pipeline, 1 block/cycle throughput)"}
    L3_command_protocol:
      typical_interface_variants:
        - variant: "signal-level (no bus)"
          description: "dedicated ports for key, block_in, decrypt, roundSel; no address space, no handshake"
          typical_of: "bare crypto IP cores (OpenCores DES, FPGA-targeted)"
        - variant: "bus-wrapped"
          description: "CTRL register (init/next bits), STATUS register (ready/valid bits), KEY/BLOCK registers"
          typical_of: "SoC-integrated crypto engines (secworks AES)"
      timing_contracts:
        des_ao:  {latency_cycles: 16, throughput: "1 block / 16 cycles"}
        des_po:  {latency_cycles: 18, throughput: "1 block / cycle (after pipeline fill)"}
        des3_ao: {latency_cycles: 48, throughput: "1 block / 48 cycles"}
        des3_po: {latency_cycles: 54, throughput: "1 block / cycle (after pipeline fill)"}
    L4_register_map:
      typical_variants:
        - variant: "signal-level (DES-style)"
          registers: "none — all control via dedicated ports; no address space"
          internal_state:
            - {name: "L / R", width: 32, desc: "left/right Feistel half (area-opt)"}
            - {name: "L0..L15 / R0..R15", width: 32, depth: 16, desc: "per-stage pipeline registers (perf-opt)"}
            - {name: "FP_R",  width: 64, desc: "stage-boundary register (3DES area-opt, captures FP between stages)"}
        - variant: "bus-wrapped (AES-style)"
          typical_registers:
            - {offset: "0x00", name: "CTRL",    access: "R/W", bits: "init[0], next[1]"}
            - {offset: "0x04", name: "STATUS",  access: "RO",  bits: "ready[0], valid[1]"}
            - {offset: "0x08", name: "CONFIG",  access: "R/W", bits: "encdec[0], key_len[2:1]"}
            - {offset: "0x10", name: "KEY[0..N]",  access: "WO",  desc: "key words"}
            - {offset: "0x40", name: "BLOCK[0..3]", access: "R/W", desc: "input/output block words"}
    L5_adi_spec:
      pad_role: "typically no off-chip pads — crypto core is instantiated inside SoC"
      typical_datapath_styles:
        - {style: "iterative / area-opt",  description: "single round function unit reused N times; smallest area"}
        - {style: "pipeline / perf-opt",   description: "N round function units in series; 1 block/cycle throughput"}
    L6_control_logic:
      typical_submodules:
        - {name: "crp / round_function",  role: "single Feistel round: E-expansion (32->48 bit), XOR with sub-key, 8 parallel S-box substitutions (6->4 bit each), P-permutation (32->32 bit); purely combinational"}
        - {name: "sbox1..sbox8",          role: "8 combinational 64x4 ROM lookup tables implementing FIPS 46-3 S1..S8"}
        - {name: "key_sel / key_schedule", role: "sub-key generator; AO: combinational mux from (key, roundSel, decrypt); PO: emits all 16 sub-keys in parallel"}
        - {name: "key_sel3",              role: "3DES key selector: decodes roundSel[5:4] to pick key1/key2/key3"}
      typical_fsm:
        area_opt: "no FSM — control is the externally-driven roundSel counter"
        perf_opt: "no FSM — implicit pipeline advancement every clock"
        bus_wrapped: "IDLE -> KEY_INIT -> ROUND (iterates) -> DONE -> IDLE"
      typical_mux_logic:
        - {selector: "roundSel == 0", purpose: "first-round IP load vs feedback mux"}
        - {selector: "decrypt",       purpose: "key schedule direction reversal"}
    L7_test_debug:
      typical_strategy: "NIST / FIPS published test vectors; encrypt known plaintext -> compare ciphertext; decrypt -> compare"
    L8_timing_waveform:
      typical_clock_domains: 1
      note: "DES cores typically have NO reset; timing starts from first valid roundSel=0"
    L8R_rtl_constants:
      typical_constant_families:
        algorithm_params:
          - {name: "BLOCK_WIDTH",  value: "64 (DES) / 128 (AES)"}
          - {name: "KEY_WIDTH",    value: "56 (DES) / 128-256 (AES)"}
          - {name: "ROUND_COUNT",  value: "16 (DES) / 10-14 (AES)"}
          - {name: "SBOX_COUNT",   value: "8 (DES) / 1 shared (AES)"}
        cycle_budgets:
          - {name: "AO_CYCLES_PER_BLOCK", value: "16 (DES) / 10-14+overhead (AES)"}
          - {name: "PO_PIPELINE_DEPTH",   value: "16 (DES) / 10-14 (AES)"}
        permutation_tables:
          - {name: "IP[1..64]",  note: "initial permutation bit indices (FIPS 46-3)"}
          - {name: "FP[1..64]",  note: "final permutation (IP inverse)"}
          - {name: "E[1..48]",   note: "expansion permutation (32->48 bits)"}
          - {name: "P[1..32]",   note: "round output permutation"}
          - {name: "PC1[1..56]", note: "permuted choice 1 (key schedule)"}
          - {name: "PC2[1..48]", note: "permuted choice 2 (sub-key extraction)"}
    L9_integration_spec:
      typical_dtops:
        - {name: "des",  variant: "area-opt",  note: "single CRP + key_sel; roundSel-driven"}
        - {name: "des",  variant: "perf-opt",  note: "16x CRP pipeline + key_sel; 1 block/cycle"}
        - {name: "des3", variant: "area-opt",  note: "single CRP + key_sel3; 48 cycles/block"}
        - {name: "des3", variant: "perf-opt",  note: "3x perf-opt des chained; key alignment shift registers"}
      typical_submodule_hierarchy:
        des_ao:
          - {instance: "u0", module: "crp",     children: "sbox1..sbox8 (8 instances)"}
          - {instance: "u1", module: "key_sel", children: "none (combinational)"}
        des_po:
          - {instance: "u0..u15", module: "crp", count: 16, children: "each crp instantiates sbox1..sbox8"}
          - {instance: "uk",      module: "key_sel", note: "emits all 16 sub-keys in parallel"}
      typical_internal_wires:
        - {name: "K_sub",    width: 48, description: "round sub-key from key_sel to crp"}
        - {name: "out / P",  width: 32, description: "crp round output (P-permutation result)"}
        - {name: "Lout",     width: 32, description: "left-half mux output (IP or feedback)"}
        - {name: "Rout",     width: 32, description: "Xin XOR crp output (new right half)"}
        - {name: "IP[1:64]", width: 64, description: "initial-permutation wires"}
        - {name: "FP[1:64]", width: 64, description: "final-permutation wires (desOut = FP)"}
    L10_test_cases:
      typical_vectors:
        - {name: "fips_197_kat_aes128",    description: "FIPS 197 Appendix A KAT — single-block plaintext/key/ciphertext triples for AES-128"}
        - {name: "fips_197_kat_aes256",    description: "FIPS 197 Appendix B / C KAT for AES-192 and AES-256 (when supported)"}
        - {name: "nist_cavp_ecb_kat",      description: "NIST CAVP ECB known-answer vectors — covers all key/data combinations the spec mandates"}
        - {name: "nist_cavp_cbc_mct",      description: "(if CBC mode supported) Monte-Carlo Test from CAVP — chained 1000-iteration encrypt to catch state leaks"}
        - {name: "encrypt_decrypt_inverse", description: "encrypt(K, P) → C, then decrypt(K, C) must equal P — catches inv_sbox/inv_mixcol direction bugs"}
        - {name: "all_zero_key",           description: "key = 0…0 with non-zero plaintext — common smoke test from CAVP regression suites"}
        - {name: "back_to_back_distinct_keys", description: "two encrypts with different keys back-to-back — catches stale key-schedule state"}
      typical_test_count: "20–60 vectors per supported (cipher × mode × key-length) combination"
    L11_calibration:
      not_applicable: true
      reason: "Bit-exact deterministic cipher — output ciphertext is uniquely determined by (key, plaintext) per spec. No analog tuning, no per-die offset trim. Any per-die variation would be a defect."
    L12_behavioral_sequences:
      - {name: "ecb_single_block",   steps: "WRITE KEY (4-8 words) → WRITE PLAINTEXT (4 words) → PULSE CTRL.start → WAIT STATUS.ready → READ CIPHERTEXT (4 words)"}
      - {name: "key_schedule_then_encrypt", steps: "WRITE KEY → PULSE CTRL.key_init → WAIT key_ready → WRITE PLAINTEXT → CTRL.start → READ CIPHERTEXT (key schedule cached for subsequent blocks)"}
      - {name: "cbc_chain",          steps: "load IV → for each block: PT XOR previous CT → encrypt → emit; final CT becomes IV for next message"}
      - {name: "encrypt_then_decrypt_roundtrip", steps: "encrypt(K, P0)→C0; decrypt(K, C0)→P_check; assert P_check == P0"}
    L13_lab_calibration:
      typical_lab_equipment: ["FPGA dev board (DE10-Lite or similar)", "host driver via UART/USB", "logic analyzer for cycle-count / throughput verification"]
      typical_smoke_tests:
        - {name: "cycle_count_per_block",  instrument: "scope on STATUS.ready", criterion: "≈10–46 cycles per block depending on round-unrolling (10 rounds × 1 cycle/round + handshake for AES-128 fully-pipelined; 46 typical for SecWorks reference)"}
        - {name: "kat_first_vector",       instrument: "host driver compares CIPHERTEXT", criterion: "exact match against FIPS 197 Appendix A first vector"}
        - {name: "encrypt_decrypt_inverse_lab", instrument: "host driver chained call", criterion: "decrypt(encrypt(P)) == P over 100 random P values"}
        - {name: "key_init_settle_time",   instrument: "scope on key_ready", criterion: "key-schedule completes within datasheet-stated cycle budget (typical: same as block cycle count)"}

hash-function:
  # v0.79 (B/C1) split: the original hash-function K3 block was shaped for
  # the SecWorks CSR family (clk/cs/we/address bus, NAME/VERSION/CTRL/STATUS
  # registers). Real-data exercise on md5 + blake2s + bitcoin_miner showed
  # ZERO cross-IC convergence on pin/register names — they use 3 distinct
  # interface idioms despite same algorithmic family. See SUMMARY.md +
  # v079_backlog.md C1 for the data. Parent block now holds only family-
  # level invariants; sub-classes hold interface-specific typical_structure.
  reference: "Cryptographic hash family (SHA-2 / SHA-3 / BLAKE2 / MD5)"
  public_source: "FIPS 180 (SHA-2), FIPS 202 (SHA-3), RFC 7693 (BLAKE2), RFC 1321 (MD5)"
  typical_digest_width_bits: "128 (MD5) / 256 (SHA-256, BLAKE2s) / 512 (SHA-512, BLAKE2b) / 1600 state (Keccak)"
  typical_rounds: "64 (SHA-256) / 80 (SHA-512) / 24 (Keccak) / 10 (BLAKE2s) / 64 (MD5)"

  applicable_subclasses:
    - hash-function-csr        # SecWorks-family memory-mapped CSR (blake2s, sha256, sha512)
    - hash-function-streaming  # per-byte/per-word streaming dataflow (md5, freecores-md5)
    - hash-function-miner      # PoW miner with header-load + nonce-sweep (bitcoin_miner)

# -----------------------------------------------------------------------
hash-function-csr:
  # SecWorks-family memory-mapped CSR hash core. Originally the v0.74
  # blake2s-derived hash-function K3 block; renamed in v0.79 enhance-loop.
  reference: "SecWorks SHA-256 / SecWorks BLAKE2s"
  public_source: "github.com/secworks/sha256, github.com/secworks/blake2s"
  typical_block_width_bits: 512
  typical_digest_width_bits: 256
  typical_rounds: 64
  typical_throughput_cycles: 66

  typical_structure:
    L1_datasheet:
      typical_pins:
        - {role: "clk",        direction: "input",  description: "host bus clock"}
        - {role: "reset_n",    direction: "input",  description: "active-low reset"}
        - {role: "cs",         direction: "input",  description: "chip-select for register access"}
        - {role: "we",         direction: "input",  description: "write-enable"}
        - {role: "address",    direction: "input",  description: "register address bus (8 bits typical)"}
        - {role: "write_data", direction: "input",  description: "32-bit register write data"}
        - {role: "read_data",  direction: "output", description: "32-bit register read data"}
        - {role: "ready",      direction: "output", description: "ready/busy status"}
      typical_pin_count: "8–12 (mostly host-bus signals, no off-chip I/O)"
      crypto_family: "hash function (one-way digest, no key)"
    L2_requirements:
      - {concept: "block_size",     hint: "fixed per algorithm (512b SHA-2/BLAKE; 1088b SHA-3 default)"}
      - {concept: "digest_size",    hint: "fixed per algorithm (256/224/512 bits typical)"}
      - {concept: "padding",        hint: "spec-defined (length-encoded; 1-bit + zeros + bit-length suffix)"}
      - {concept: "throughput",     hint: "iterative datapath, ~64–80 cycles per block"}
      - {concept: "side_channel",   hint: "no defenses required for hash (no secret); optional uniform-time"}
    L3_command_protocol:
      typical_phy:
        encoding:                "register-mapped — no off-chip protocol"
        bit_order:               "MSB first per byte (network byte order, common for SHA / BLAKE)"
        ack_polarity:            "n/a (synchronous bus)"
        wake_prefix_required:    false
      typical_frame:
        - "host writes BLOCK words (16 × 32-bit) into BLOCK_IN registers"
        - "host pulses CTRL.init for first block, CTRL.next for subsequent blocks (BLAKE/SHA streaming)"
        - "host polls STATUS.ready or takes IRQ when block hash completes"
        - "host reads DIGEST words (8 × 32-bit) from RESULT registers"
    L4_register_map:
      typical_csrs:
        - {name: "NAME0/NAME1",    purpose: "core-name identification (e.g. 'sha2', '56  ')"}
        - {name: "VERSION",        purpose: "core version string"}
        - {name: "CTRL",           purpose: "init/next pulse bits to start hashing"}
        - {name: "STATUS",         purpose: "ready / valid / digest_valid status flags"}
        - {name: "BLOCK_IN[0..15]", purpose: "16 × 32b input block words (512b)"}
        - {name: "DIGEST[0..7]",   purpose: "8 × 32b digest output words (256b SHA-256/BLAKE2s)"}
        - {name: "CONFIG",         purpose: "(BLAKE only) personalization / digest length config"}
      address_map_style: "byte-aligned with 8-bit address; ~32 word CSRs total"
    L5_pad_layer:
      typical_io_buffers: "all signals are internal SoC bus connections; no off-chip pads"
      no_analog_content: true
    L6_submodule_control_logic:
      typical_submodules:
        - {name: "core_fsm",       purpose: "top FSM coordinating init / round / next / done"}
        - {name: "round_datapath", purpose: "per-round compression: G-function / sigma / Sigma operations"}
        - {name: "message_select", purpose: "(BLAKE m_select / SHA W-array) message-word permutation per round"}
        - {name: "round_counter",  purpose: "tracks current round (0..63 SHA-2; 0..9 BLAKE2s)"}
        - {name: "iv_const",       purpose: "initial-vector / round constants ROM (h0..h7, k[]) "}
        - {name: "padding_logic",  purpose: "(optional) message padding + length encoding"}
    L8_timing:
      typical_frequencies:        "host clk 50–200 MHz typical; iterative datapath limited by S-box-equivalent path"
      typical_latency_per_block:  "60–100 cycles (algorithm-dependent: SHA-256 ~66, BLAKE2s ~10 rounds × ~1 cycle)"
    L8R_rtl_constants:
      - {family: "round_count_param",     purpose: "AES_ROUNDS-equivalent localparam (e.g. NUM_ROUNDS=10 BLAKE2s, =64 SHA-256)"}
      - {family: "block_word_count",      purpose: "BLOCK words count (16 typical)"}
      - {family: "digest_word_count",     purpose: "DIGEST words count (8 typical)"}
      - {family: "iv_constants",          purpose: "spec-defined initial-vector words"}
      - {family: "round_constants",       purpose: "spec-defined per-round constants"}
      - {family: "sigma_or_w_table",      purpose: "(BLAKE/SHA) message-word permutation table"}
    L9_integration:
      typical_top_level_port_count: "8–14 (host-bus only)"
      typical_internal_wires:       "20–50 (round_datapath ↔ message_select ↔ core_fsm handshakes)"
    # v0.79 (A2): expanded L10-L13 from a 4-line summary block into
    # individual L10/L11/L12/L13 entries matching the dsp-block /
    # memory-controller schema. Each entry now has typical_vectors
    # (L10), typical_calibration (L11), typical_sequences (L12),
    # typical_lab_calibration (L13) so the per-layer agent has
    # concrete shapes to anchor against.
    L10_test_cases:
      typical_vectors:
        - {name: "nist_cavp_kat_short",   description: "NIST CAVP MsgKAT short messages (e.g. 0/1/2-byte input) — verify digest exactly matches reference"}
        - {name: "nist_cavp_kat_long",    description: "NIST CAVP MsgKAT multi-block messages spanning 1-3 input blocks — verify CTRL.next chaining works"}
        - {name: "rfc_7693_kat",          description: "RFC 7693 §B.1/B.2 BLAKE2 vectors (BLAKE family) — covers personalization + digest-length config"}
        - {name: "all_zero_block",        description: "all-zeros input block — catches H-state leakage from previous run"}
        - {name: "all_one_block",         description: "all-FF input block — catches XOR/constant pollution"}
        - {name: "back_to_back_init",     description: "two consecutive CTRL.init pulses (no read in between) — must produce same digest as single hash"}
      typical_test_count: "10–30 vectors per algorithm (NIST CAVP minimum + corner cases)"
    L11_calibration:
      not_applicable: true
      reason: "Deterministic combinational + register pipeline; output digest is bit-exact per spec. No analog tuning, no per-die offset trim."
    L12_behavioral_sequences:
      - {name: "single_block_hash",   steps: "WRITE 16 × BLOCK_IN → PULSE CTRL.init → WAIT STATUS.ready → READ 8 × DIGEST"}
      - {name: "multi_block_hash",    steps: "WRITE block 0 → CTRL.init → wait ready → WRITE block 1 → CTRL.next → wait ready → ... → READ DIGEST after final block"}
      - {name: "back_to_back_session", steps: "complete one hash → immediately start next CTRL.init for new message (no soft-reset needed; init clears H-state)"}
      - {name: "irq_driven_completion", steps: "host enables ready-IRQ → writes block + CTRL → waits on IRQ instead of polling STATUS"}
    L13_lab_calibration:
      typical_lab_equipment: ["FPGA dev board (DE10-Lite or similar)", "logic analyzer / scope (1+ MHz)", "host UART/USB to drive register writes"]
      typical_smoke_tests:
        - {name: "cycle_count_per_block", instrument: "scope on STATUS.ready", criterion: "≈64 (SHA-256) / 80 (SHA-512) / 10 (BLAKE2s) cycles between CTRL.init and ready"}
        - {name: "kat_one_vector",        instrument: "host driver compares DIGEST read-back", criterion: "exact match against NIST CAVP first vector"}
        - {name: "throughput_at_max_freq", instrument: "Fmax + cycle count", criterion: "≥ datasheet typical (e.g. 100MHz × 1block/64cyc ≈ 1.5MB/s for SHA-256)"}

  # v0.79 (C-half-1) typical_large_tables: spec-defined enumerable tables that
  # the per-layer agent must EMIT IN FULL (not extrapolate from 2 examples).
  # Consumed by tools/training/auto_run_loop/loop_3agent.py:_build_per_layer_expert_input
  # which injects a "do NOT truncate" rule into the L8R prompt.
  typical_large_tables:
    - {layer: L8R, path: "round_constants_K",   count: 64, source_spec: "FIPS 180-4 §4.2.2 — first 32 bits of fractional parts of cube roots of first 64 primes",      member_shape: "32-bit hex value"}
    - {layer: L8R, path: "iv_constants_H",       count: 8, source_spec: "FIPS 180-4 §5.3.3 (SHA-256) / §5.3.4 (SHA-512); BLAKE2 spec §2.6 (RFC 7693)",                  member_shape: "32-bit hex word (H0..H7) — square-root primes for SHA, IV table for BLAKE"}

  applicable_subclasses:
    - hash-function-csr

# -----------------------------------------------------------------------
hash-function-streaming:
  # Per-byte / per-word streaming hash core. NO addressable register file —
  # input arrives as a dataflow of valid+data signals; digest emerges as
  # multi-cycle output stream. Pattern observed in freecores-md5.
  reference: "freecores/md5 (Verilog), historic streaming hash designs"
  public_source: "github.com/freecores/md5"
  typical_block_width_bits: 512
  typical_digest_width_bits: 128
  typical_rounds: 64

  typical_structure:
    L1_datasheet:
      typical_pins:
        - {role: "clk",            direction: "input",  description: "core clock"}
        - {role: "reset_n",        direction: "input",  description: "active-low async reset"}
        - {role: "data_in",        direction: "input",  description: "32-bit message data word (one chunk per cycle when data_vld=1)"}
        - {role: "data_vld",       direction: "input",  description: "valid strobe for data_in (host asserts when feeding the next chunk)"}
        - {role: "data_first",     direction: "input",  description: "first-chunk-of-message marker; resets internal length counter"}
        - {role: "data_last",      direction: "input",  description: "last-chunk-of-message marker; tells padding FSM to insert spec-defined padding + bit-length suffix"}
        - {role: "data_numb",      direction: "input",  description: "valid-bit count in the last data_in word (0..32) for partial-word terminations"}
        - {role: "init_vec",       direction: "input",  description: "init-vector strobe — successive data_in words are latched as A/B/C/D state init when high"}
        - {role: "digest_out",     direction: "output", description: "serially emitted digest, one 32-bit word per cycle"}
        - {role: "digest_vld",     direction: "output", description: "asserted while digest_out is being driven (multi-cycle)"}
        - {role: "busy",           direction: "output", description: "core-busy flag (high during padding, rounds, or digest emission)"}
      typical_pin_count: "10–14 (no off-chip I/O; pure dataflow ports)"
      crypto_family: "hash function (one-way digest, no key)"
    L2_requirements:
      - {concept: "block_size",     hint: "fixed per algorithm (512b for MD5 / SHA-1)"}
      - {concept: "digest_size",    hint: "fixed per algorithm (128b MD5; 160b SHA-1)"}
      - {concept: "padding",        hint: "spec-defined; padding FSM uses data_last + data_numb to insert 0x80 + zero-fill + 64-bit length suffix"}
      - {concept: "streaming",      hint: "host streams arbitrary-length message; core absorbs one 32b word per cycle when data_vld=1"}
      - {concept: "no_register_file", hint: "no addressable CSRs — interface IS the dataflow ports"}
    L3_command_protocol:
      typical_phy:
        encoding:                "internal dataflow (data_in + data_vld); no off-chip protocol"
        bit_order:               "spec-defined per algorithm (MD5 little-endian)"
        ack_polarity:            "n/a (host gates data_vld; core's busy flag back-pressures)"
        wake_prefix_required:    false
      typical_frame:
        - "(optional) host pulses init_vec + drives 4 successive data_in words to set A/B/C/D init state"
        - "host drives data_first=1 with first message chunk; resets internal length counter"
        - "host streams remaining chunks with data_vld=1, one 32-bit word per cycle, watching busy"
        - "host drives data_last=1 + data_numb on the final partial chunk; padding FSM inserts spec padding"
        - "core asserts digest_vld and emits 4 successive digest_out words (MD5: 4 × 32b = 128b digest)"
    L4_register_map:
      typical_csrs: []
      address_map_style: "n/a — no addressable register file; control via top-level dataflow ports"
      no_register_file: true
    L5_pad_layer:
      typical_io_buffers: "all signals are internal dataflow connections; no off-chip pads"
      no_analog_content: true
    L6_submodule_control_logic:
      typical_submodules:
        - {name: "padding_fsm",     purpose: "insert 0x80 + zero-fill + 64-bit message-length suffix at data_last"}
        - {name: "round_datapath",  purpose: "per-round compression (MD5 F/G/H/I auxiliary functions; SHA-1 ROL/ROR/MAJ)"}
        - {name: "round_counter",   purpose: "tracks current round (0..63 MD5 = 4 × 16; 0..79 SHA-1)"}
        - {name: "state_register",  purpose: "A/B/C/D (or A/B/C/D/E for SHA-1) chaining-variable register"}
        - {name: "length_counter",  purpose: "64-bit message-length accumulator (in bits)"}
    L8_timing:
      typical_frequencies:        "core clk 50–200 MHz; one round per cycle typical"
      typical_latency_per_block:  "~64–80 cycles per 512-bit block (one round per cycle + setup)"
    L8R_rtl_constants:
      - {family: "round_count_param",     purpose: "NUM_ROUNDS = 64 (MD5) / 80 (SHA-1) / 64 (SHA-256)"}
      - {family: "block_word_count",      purpose: "BLOCK words count (16 = 512b/32b)"}
      - {family: "digest_word_count",     purpose: "DIGEST words count (4 MD5 / 5 SHA-1 / 8 SHA-256)"}
      - {family: "round_constants_T",     purpose: "(MD5) T[i] = floor(2^32 * |sin(i+1)|), 64 entries"}
      - {family: "shift_schedule",        purpose: "per-round S[i] left-rotate amount (16 per round-group typical)"}
      - {family: "iv_constants",          purpose: "spec-defined initial A/B/C/D (MD5: 0x67452301 / 0xEFCDAB89 / 0x98BADCFE / 0x10325476)"}
    L9_integration:
      typical_top_level_port_count: "10–14 (dataflow only)"
      typical_internal_wires:       "15–30 (padding ↔ round_datapath ↔ state_register handshakes)"
    L10_L13_extensions:
      L10_test_cases:    "RFC 1321 / NIST CAVP known-answer vectors (e.g. MD5('abc') = 0x900150983CD24FB0D6963F7D28E17F72)"
      L11_calibration:   "n/a (deterministic core, no calibration)"
      L12_sequences:     "(optional init_vec) → data_first → stream chunks → data_last + data_numb → wait digest_vld → read 4× digest_out"
      L13_lab_calibration: "verify cycle-count per block on FPGA scope; confirm digest matches RFC 1321 vectors"

  # v0.79 (C-half-1) typical_large_tables — see hash-function-csr for schema.
  typical_large_tables:
    - {layer: L8R, path: "round_constants_T",   count: 64, source_spec: "RFC 1321 §3.4 — T[i] = floor(2^32 × |sin(i+1)|) for i = 0..63 (radians)",                     member_shape: "32-bit hex value"}
    - {layer: L8R, path: "shift_schedule_S",    count: 16, source_spec: "RFC 1321 §3.4 — per-round-group left-rotate amounts; 4 distinct values per F/G/H/I round-group", member_shape: "small int (3..23 typical)"}
    - {layer: L8R, path: "iv_constants_ABCD",    count: 4, source_spec: "RFC 1321 §3.3 — A=0x67452301, B=0xEFCDAB89, C=0x98BADCFE, D=0x10325476",                       member_shape: "32-bit hex word"}

  applicable_subclasses:
    - hash-function-streaming

# -----------------------------------------------------------------------
hash-function-miner:
  # PoW (proof-of-work) miner core. Combines hash datapath with nonce-sweep
  # logic + golden-nonce detector. Often paired with vendor-specific debug
  # interface (e.g. Altera virtual_jtag) for host-side polling. Pattern
  # observed in fpgaminer's bitcoin-miner.
  reference: "fpgaminer's Open-Source FPGA Bitcoin Miner (teknohog community fork)"
  public_source: "github.com/fpgaminer/Open-Source-FPGA-Bitcoin-Miner"
  typical_block_width_bits: 512   # double-SHA-256 of 80-byte block header
  typical_digest_width_bits: 256
  typical_rounds: 64              # SHA-256 round count; pipelined twice for double-SHA
  hash_algorithm: "double SHA-256 (SHA-256 of SHA-256 of 80-byte header)"

  typical_structure:
    L1_datasheet:
      typical_pins:
        - {role: "clk",            direction: "input",  description: "miner clock"}
        - {role: "reset_n",        direction: "input",  description: "active-low reset"}
        # Host-debug interface ports (often via virtual_jtag / altsource_probe;
        # exposed as register-window ports at the K3 view level)
      typical_pin_count: "2–4 native + vendor-specific debug interface (Altera virtual_jtag / altsource_probe)"
      crypto_family: "hash-based PoW miner (SHA-256 of SHA-256 for Bitcoin)"
    L2_requirements:
      - {concept: "header_input",       hint: "host supplies block header pre-image (midstate + last 256b half) via debug-window registers"}
      - {concept: "nonce_sweep",        hint: "core continuously increments NONCE_COUNTER; computes hash(header || nonce) every cycle"}
      - {concept: "golden_nonce_detect", hint: "compare top 32 bits of digest against zero (Bitcoin difficulty floor); when met, latch NONCE → GOLDEN_NONCE"}
      - {concept: "host_polling",       hint: "host periodically reads GOLDEN_NONCE and submits work to pool; no core-side IRQ typical"}
      - {concept: "pipelined_datapath", hint: "two SHA-256 transform blocks pipelined (one per SHA pass) for 1-hash-per-cycle throughput"}
    L3_command_protocol:
      typical_phy:
        encoding:                "vendor debug interface (Altera virtual_jtag / altsource_probe / Xilinx ChipScope-style)"
        bit_order:               "spec-defined (Bitcoin: little-endian on the wire after PoW)"
        ack_polarity:            "n/a (continuous mining; no per-transaction handshake)"
        wake_prefix_required:    false
      typical_frame:
        - "host loads HEADER_MIDSTATE (256b SHA-256 midstate after first 64 header bytes)"
        - "host loads HEADER_DATA2 (last 96 bits of block header: timestamp + nbits + 32b nonce-position)"
        - "core continuously sweeps nonce, double-SHA-256 each candidate"
        - "on golden-nonce detection (digest top 32b == 0), latch nonce → GOLDEN_NONCE"
        - "host polls GOLDEN_NONCE; if non-zero, submit + reload header for next work"
    L4_register_map:
      typical_csrs:
        - {name: "HEADER_MIDSTATE", purpose: "256b SHA-256 midstate computed by host from first 64 header bytes (8 × 32b words)"}
        - {name: "HEADER_DATA2",    purpose: "last 96b of block header (timestamp + nbits + nonce-position; ~3 × 32b)"}
        - {name: "GOLDEN_NONCE",    purpose: "32b nonce value of the last hash whose top 32 bits were zero (host polls)"}
        - {name: "NONCE_COUNTER",   purpose: "(optional debug) current candidate nonce; host can read for hashrate estimation"}
      address_map_style: "vendor-specific debug-window addressing (4–8 word window typical)"
    L5_pad_layer:
      typical_io_buffers: "no off-chip pads in the core itself; debug-interface IPs handle JTAG/USB-Blaster pad ring at top"
      no_analog_content: true
    L6_submodule_control_logic:
      typical_submodules:
        - {name: "sha256_transform_1", purpose: "first SHA-256 pass: hash(header || nonce); pipelined N stages"}
        - {name: "sha256_transform_2", purpose: "second SHA-256 pass: hash(first-pass-digest); pipelined N stages"}
        - {name: "nonce_counter",      purpose: "continuously increments candidate nonce each cycle"}
        - {name: "golden_compare",     purpose: "compares top 32 bits of second-pass digest to zero; latches nonce on hit"}
        - {name: "header_register",    purpose: "stores host-supplied midstate + last header chunk"}
        - {name: "debug_iface",        purpose: "vendor debug bridge (e.g. Altera virtual_jtag) exposing the 4 CSRs to host"}
    L8_timing:
      typical_frequencies:        "core clk 50–250 MHz on FPGA (Spartan-6/Cyclone-IV-class); ASIC variants reach GHz"
      typical_throughput:         "ideally 1 hash per cycle (fully pipelined double-SHA); ramp-up = pipeline depth (~128 cycles)"
    L8R_rtl_constants:
      - {family: "sha256_round_count",   purpose: "NUM_ROUNDS = 64 per SHA-256 pass"}
      - {family: "sha256_iv_constants",  purpose: "8 × 32b H[0..7] initial hash values (H0=0x6A09E667, H1=0xBB67AE85, ...)"}
      - {family: "sha256_round_constants_K", purpose: "64 × 32b K[0..63] round constants (cube-root primes)"}
      - {family: "golden_threshold",     purpose: "Bitcoin difficulty: top 32 bits of double-SHA digest must be zero (compare-to-zero of bits 224..255)"}
      - {family: "header_word_count",    purpose: "block header is 80 bytes = 20 × 32b; first 16 are pre-hashed by host into midstate"}
    L9_integration:
      typical_top_level_port_count: "2–4 native + N debug-interface ports (vendor-specific; Altera virtual_jtag adds tdi/tdo/tck/tms)"
      typical_internal_wires:       "30–80 (deep pipeline: header → SHA1 → SHA2 → compare; many intermediate stage registers)"
    L10_L13_extensions:
      L10_test_cases:    "Known-block test: feed historical Bitcoin block N's header pre-image, verify GOLDEN_NONCE matches the recorded nonce"
      L11_calibration:   "n/a — pipeline is fully deterministic; calibration via clock frequency only"
      L12_sequences:     "host: load HEADER_MIDSTATE + HEADER_DATA2 → poll GOLDEN_NONCE every K seconds → if non-zero, submit + reset for new work"
      L13_lab_calibration: "measure hashrate (= clk_freq × pipeline_efficiency) on real FPGA; verify against known-block test"

  # v0.79 (C-half-1) typical_large_tables — see hash-function-csr for schema.
  typical_large_tables:
    - {layer: L8R, path: "sha256_round_constants_K", count: 64, source_spec: "FIPS 180-4 §4.2.2 — first 32 bits of fractional parts of cube roots of first 64 primes (same K[] as SHA-256; pipelined twice for double-SHA-256)", member_shape: "32-bit hex value"}
    - {layer: L8R, path: "sha256_iv_constants_H",     count: 8, source_spec: "FIPS 180-4 §5.3.3 — first 32 bits of fractional parts of square roots of first 8 primes (H0..H7)",                                                  member_shape: "32-bit hex word"}

  applicable_subclasses:
    - hash-function-miner

stream-cipher:
  reference: "SecWorks ChaCha / Bernstein ChaCha20 RFC 7539"
  public_source: "github.com/secworks/chacha; RFC 7539"
  typical_block_width_bits: 512
  typical_key_width_bits: 256
  typical_iv_width_bits: 96
  typical_rounds: 20

  # v0.74 post-chacha benchmark: stream-cipher specific structure.
  # Supplements the parent crypto-engine typical_structure. NO specific
  # K-constants / round table values — those belong to the IC's facts.
  typical_structure:
    L1_datasheet:
      typical_pins:
        - {role: "clk",        direction: "input",  description: "host bus clock"}
        - {role: "reset_n",    direction: "input",  description: "active-low reset"}
        - {role: "cs",         direction: "input",  description: "chip-select for register access"}
        - {role: "we",         direction: "input",  description: "write-enable"}
        - {role: "address",    direction: "input",  width: 8, description: "register address bus"}
        - {role: "write_data", direction: "input",  width: 32, description: "register write data"}
        - {role: "read_data",  direction: "output", width: 32, description: "register read data"}
      typical_pin_count: "7-12 (host-bus only, no off-chip I/O)"
      crypto_family: "stream cipher (keystream XOR)"
    L2_requirements:
      - {concept: "key_size",    hint: "128 or 256 bits (KEYLEN bit selects)"}
      - {concept: "iv_size",     hint: "64 bits (Bernstein) or 96 bits (RFC 7539)"}
      - {concept: "block_size",  hint: "512-bit keystream block (16 × 32-bit words)"}
      - {concept: "round_count", hint: "20 rounds (ChaCha20), 12, or 8"}
      - {concept: "throughput",  hint: "ChaCha20 ~20-25 cycles/block; ChaCha8 ~10 cycles"}
      - {concept: "side_channel", hint: "no defenses required for keystream gen alone"}
    L3_command_protocol:
      typical_phy:
        encoding:                "register-mapped — no off-chip protocol"
        bit_order:               "little-endian (Bernstein convention)"
        wake_prefix_required:    false
      typical_frame:
        - "host writes KEY words (8 × 32b)"
        - "host writes IV words (2 × 32b for 64b IV; 3 × 32b for 96b)"
        - "host writes BLOCK_COUNTER (1-2 × 32b)"
        - "host pulses CTRL.init (new key) or CTRL.next (continuation block)"
        - "host polls STATUS.ready, then reads keystream from DATA_OUT"
    L4_register_map:
      typical_csrs:
        - {name: "NAME0/NAME1",   purpose: "core identifier strings"}
        - {name: "VERSION",       purpose: "version string"}
        - {name: "CTRL",          purpose: "init/next pulse + encrypt/decrypt"}
        - {name: "STATUS",        purpose: "ready / data_valid"}
        - {name: "KEYLEN",        purpose: "key length select (128/256)"}
        - {name: "ROUNDS",        purpose: "round count override (8/12/20)"}
        - {name: "KEY[0..7]",     purpose: "key words (256b max)"}
        - {name: "IV[0..2]",      purpose: "nonce words"}
        - {name: "BLOCK_CTR[0..1]", purpose: "block counter words"}
        - {name: "DATA_IN[0..15]",  purpose: "input block (16 × 32b)"}
        - {name: "DATA_OUT[0..15]", purpose: "output keystream / ciphertext"}
    L5_pad_layer:
      no_analog_content: true
      typical_io_buffers: "all signals are internal SoC bus connections"
    L6_submodule_control_logic:
      typical_submodules:
        - {name: "core_fsm",      purpose: "FSM coordinating init/rounds/finalize/done"}
        - {name: "qr_columns",    purpose: "4 parallel quarter-round (column) ARX blocks"}
        - {name: "qr_diagonals",  purpose: "4 parallel quarter-round (diagonal) ARX blocks"}
        - {name: "init_const",    purpose: "TAU/SIGMA initial-state constants ROM"}
        - {name: "round_counter", purpose: "tracks current round (0..NUM_ROUNDS)"}
        - {name: "state_regs",    purpose: "16 × 32-bit state register bank"}
    L8_timing:
      typical_frequencies:        "host clk 50-200 MHz typical"
      typical_latency_per_block:  "20-25 cycles (ChaCha20); 10-15 cycles (ChaCha8)"
    L8R_rtl_constants:
      - {family: "round_count_param",  purpose: "NUM_ROUNDS localparam (8/12/20)"}
      - {family: "state_word_count",   purpose: "16 (fixed)"}
      - {family: "key_word_count",     purpose: "8 (256-bit max)"}
      - {family: "init_constants",     purpose: "TAU0..3 + SIGMA0..3 32-bit values"}
      - {family: "qr_rotation_amounts", purpose: "16, 12, 8, 7 (Bernstein QR)"}
    L9_integration:
      typical_top_level_port_count: "8-14 (host-bus only)"
      typical_internal_wires:       "30-80 (state ↔ qr ↔ core_fsm)"
    L10_L13_extensions:
      L10_test_cases:    "RFC 7539 KAT vectors; Bernstein original test vectors"
      L11_calibration:   "n/a (deterministic core)"
      L12_sequences:     "key-load → init pulse → 20-round expansion → block read; multi-block via next pulse"
      L13_lab_calibration: "verify cycle-count per block on FPGA scope; confirm keystream matches RFC 7539"

  applicable_subclasses:
    - stream-cipher

rng:
  reference: "SecWorks TRNG (entropy-source) / alexforencich verilog-lfsr (deterministic PRBS)"
  public_source: "github.com/secworks/trng + github.com/alexforencich/verilog-lfsr"
  typical_entropy_sources: ["ring-oscillator", "metastability-latch", "deterministic-LFSR"]
  typical_whitening: "XOR-reduction + von-Neumann (entropy-source); none (deterministic-LFSR)"
  typical_reseed_interval_blocks: 64
  typical_subfamilies: ["true-rng (entropy)", "deterministic-PRBS (LFSR)", "scrambler (LFSR)", "CRC (LFSR)"]

  # v0.74 post-lfsr benchmark: rng (LFSR-PRBS-scrambler-CRC variant)
  # specific structure. The LFSR-based subfamily dominates open-source IP
  # because TRNG cores are usually proprietary; this block focuses on the
  # parameterizable LFSR primitive shape.
  typical_structure:
    L1_datasheet:
      typical_pins:
        - {role: "clk",       direction: "input",  description: "single clock domain"}
        - {role: "rst",       direction: "input",  description: "synchronous reset"}
        - {role: "data_in",   direction: "input",  width: "DATA_WIDTH", description: "stream input (PRBS check / scrambler / CRC)"}
        - {role: "data_in_valid", direction: "input", description: "qualify data_in (gating wrappers)"}
        - {role: "data_out",  direction: "output", width: "DATA_WIDTH", description: "stream output"}
        - {role: "data_out_valid", direction: "output", description: "valid output sample"}
        - {role: "state_in",  direction: "input",  width: "LFSR_WIDTH", description: "LFSR state seed (config-time or live-load)"}
        - {role: "state_out", direction: "output", width: "LFSR_WIDTH", description: "next LFSR state (combinational)"}
      typical_pin_count: "6-12 (streaming, no bus)"
      typical_parameters:
        - {name: "LFSR_WIDTH",         hint: "polynomial order (e.g., 31 for PRBS31, 32 for CRC32)"}
        - {name: "LFSR_POLY",          hint: "feedback polynomial (e.g., 32'h04C11DB7 for CRC32, 31'h10000001 for PRBS31)"}
        - {name: "LFSR_CONFIG",        hint: "GALOIS or FIBONACCI"}
        - {name: "LFSR_FEED_FORWARD",  hint: "0 = additive scrambler / PRBS gen / PRBS check; 1 = self-synchronizing scrambler / descrambler / CRC accumulate"}
        - {name: "REVERSE",            hint: "bit-order; 1 = MSB-first (most CRC standards)"}
        - {name: "DATA_WIDTH",         hint: "bits per cycle (typically 8/16/32/64)"}
        - {name: "STYLE",              hint: "REDUCTION (uses XOR-reduce) or LOOP (explicit loop) — implementation choice"}
    L2_requirements:
      - {concept: "polynomial_unrolling", hint: "matrix expansion of LFSR next-state DATA_WIDTH steps per clock; combinational"}
      - {concept: "wrapper_modes",        hint: "PRBS gen, PRBS check, additive scramble, self-sync scramble/descramble, CRC accumulate"}
      - {concept: "lock_behavior",        hint: "self-sync descrambler converges in ~LFSR_WIDTH cycles after stream alignment"}
      - {concept: "throughput",           hint: "1 sample of DATA_WIDTH bits per clock"}
    L3_command_protocol:
      typical_phy: "streaming — no bus protocol"
      typical_handshake: "data_in_valid / data_out_valid (ready-less; producer paces)"
    L4_register_map:
      not_applicable: true
      reason: "LFSR primitive is a streaming combinational/sequential block. No host bus. State_in / state_out are pin-level signals, not memory-mapped registers."
    L5_adi_spec:
      pad_role: "no off-chip pads — purely SoC-internal datapath"
    L6_control_logic:
      typical_submodules:
        - {name: "lfsr",            role: "combinational LFSR matrix expander (the math kernel)"}
        - {name: "lfsr_prbs_gen",   role: "wrapper: state register + lfsr() core; outputs DATA_WIDTH PRBS bits/cycle"}
        - {name: "lfsr_prbs_check", role: "wrapper: state register + XOR with input → accumulates error count"}
        - {name: "lfsr_scramble",   role: "wrapper: additive scrambler (data XOR PRBS sequence)"}
        - {name: "lfsr_descramble", role: "wrapper: self-sync descrambler with lock state machine"}
        - {name: "lfsr_crc",        role: "wrapper: feed-forward LFSR accumulator (CRC computation)"}
      typical_fsm: "wrapper-specific gate (idle / running) + descrambler lock FSM (unlocked → locking → locked)"
    L7_test_debug:
      typical_strategy: "self-checking testbenches per polynomial; known-good check values from CRC Catalogue (e.g., CRC32 of '123456789' = 0xCBF43926, CRC16-CCITT = 0xE5CC)"
      typical_modes: ["loopback PRBS gen → PRBS check (zero error count)", "scramble → descramble round-trip (data integrity)", "CRC accumulate → final XOR-out (golden value)"]
    L8_timing_waveform:
      typical_clock_domains: 1
      typical_latency_cycles: "0 (combinational lfsr core); 1 (wrapper register stage)"
      typical_throughput: "1 sample / clock"
    L8R_rtl_constants:
      typical_polynomials:
        - {name: "PRBS6",       poly: "6'h21",       feedforward: 0}
        - {name: "PRBS7",       poly: "7'h41",       feedforward: 0}
        - {name: "PRBS9",       poly: "9'h21",       feedforward: 0}
        - {name: "PRBS11",      poly: "11'h402",     feedforward: 0}
        - {name: "PRBS13",      poly: "13'h300",     feedforward: 0}
        - {name: "PRBS15",      poly: "15'h6000",    feedforward: 0}
        - {name: "PRBS17",      poly: "17'h12000",   feedforward: 0}
        - {name: "PRBS23",      poly: "23'h420000",  feedforward: 0}
        - {name: "PRBS31",      poly: "31'h10000001", feedforward: 0}
        - {name: "CRC8",        poly: "8'h07",       feedforward: 1}
        - {name: "CRC16-CCITT", poly: "16'h1021",    feedforward: 1}
        - {name: "CRC16-IBM",   poly: "16'h8005",    feedforward: 1}
        - {name: "CRC32",       poly: "32'h04C11DB7", feedforward: 1}
        - {name: "CRC32C",      poly: "32'h1EDC6F41", feedforward: 1}
      typical_init_states:
        - {use_case: "PRBS",        init: "all-ones"}
        - {use_case: "CRC32",       init: "all-ones (0xFFFFFFFF)"}
        - {use_case: "CRC16-CCITT", init: "all-ones (0xFFFF) or zero (variant)"}
      cordic_gain_constant: null  # not applicable
    L9_integration_spec:
      typical_dtops: ["lfsr (core)", "lfsr_prbs_gen", "lfsr_prbs_check", "lfsr_scramble", "lfsr_descramble", "lfsr_crc"]
      typical_instantiation: "parent design instantiates the wrapper with the right (LFSR_WIDTH, LFSR_POLY, DATA_WIDTH) parameter triple"
      typical_example: "PRBS31 generator on a 64-bit data path: lfsr_prbs_gen #(.LFSR_WIDTH(31), .LFSR_POLY(31'h10000001), .DATA_WIDTH(64))"
    L10_test_cases:
      typical_vectors:
        - {name: "CRC32 of '123456789'", expect: "0xCBF43926 (CRC Catalogue check value)"}
        - {name: "CRC16-CCITT of '123456789'", expect: "0xE5CC"}
        - {name: "PRBS9 first sequence", expect: "deterministic from all-ones init"}
        - {name: "Scramble-descramble loopback", expect: "data_in == data_out after lock"}
    L11_calibration:
      not_applicable: true
      reason: "Deterministic LFSR; no analog calibration. (TRNG variants would have entropy-source bias calibration, but not the LFSR-PRBS subfamily.)"
    L12_behavioral_sequences:
      - {name: "scramble→descramble lock chain", steps: "scrambler emits N cycles of XOR-mixed stream → descrambler latches LFSR_WIDTH cycles → locked → output equals scrambler input"}
      - {name: "PRBS round-trip",                steps: "PRBS gen sequence S → PRBS check on S → error count = 0"}
      - {name: "CRC accumulate-XOR-out",         steps: "init state to 0xFFFFFFFF → feed message bytes → final XOR with 0xFFFFFFFF → reverse if REVERSE=1 → golden value"}
    L13_lab_calibration:
      not_applicable: true
      reason: "No lab calibration story for deterministic LFSR primitives."

  # v0.79 (C-half-2) typical_large_tables — see hash-function-csr for schema.
  # LFSR / CRC variants carry per-PRBS-N polynomial tables + per-CRC-variant
  # reflected-bit tables. Tables are spec-defined; agent should emit ALL
  # entries from training knowledge of common standards.
  typical_large_tables:
    - {layer: L8R, path: "prbs_polynomial_table",   count: 6, source_spec: "ITU-T O.150 / common PRBS variants — PRBS9 (x^9+x^5+1), PRBS13 (x^13+x^12+x^2+x+1), PRBS15 (x^15+x^14+1), PRBS17 (x^17+x^14+1), PRBS23 (x^23+x^18+1), PRBS31 (x^31+x^28+1)", member_shape: "{name, taps_list, primitive_poly_hex}"}
    - {layer: L8R, path: "crc_polynomial_table",    count: 5, source_spec: "Common CRC standards — CRC32 (0x04C11DB7, IEEE 802.3), CRC32C (0x1EDC6F41, Castagnoli), CRC16-IBM (0xA001), CRC16-CCITT (0x1021), CRC8 (0x07)",                                                                      member_shape: "{name, polynomial_hex, init, xor_out, reflect_in, reflect_out}"}

# -----------------------------------------------------------------------------
# Additional typical values
# -----------------------------------------------------------------------------
dsp-block:
  reference: "dblclockfft (Gisselquist) / OpenCores cordic / dawsonjon-fpu"
  public_source: "github.com/ZipCPU/dblclockfft + opencores.org/projects/cordic"
  typical_fft_sizes: [64, 256, 1024, 4096]
  typical_data_width: 16
  typical_subfamilies: ["FFT", "CORDIC (rect↔polar)", "FIR/IIR filter", "FPU"]

  # v0.74 post-cordic benchmark: dsp-block-specific structure for the
  # pipelined DSP primitive subfamily (CORDIC variant). FFT/filter
  # variants share most of this scaffolding but with different stage math.
  typical_structure:
    L1_datasheet:
      typical_pins:
        - {role: "clk",       direction: "input",  description: "single clock domain"}
        - {role: "ena",       direction: "input",  description: "clock enable / pipeline gate"}
        - {role: "rst",       direction: "input",  description: "synchronous reset (optional — many pipelined DSP blocks omit it)"}
        - {role: "x_in",      direction: "input",  width: "WIDTH", description: "datapath input (rect2polar) — signed fixed-point"}
        - {role: "y_in",      direction: "input",  width: "WIDTH", description: "datapath input (rect2polar) — signed fixed-point"}
        - {role: "magnitude", direction: "output", width: "WIDTH+EXT_PRECISION", description: "computed magnitude (rect2polar)"}
        - {role: "angle",     direction: "output", width: "WIDTH", description: "computed angle (rect2polar)"}
      typical_pin_count: "5-15 (streaming, no bus)"
      typical_parameters:
        - {name: "WIDTH",          hint: "datapath fixed-point word width (typically 16)"}
        - {name: "PIPELINE",       hint: "number of CORDIC stages (typically 15-16 for 16-bit precision)"}
        - {name: "EXT_PRECISION",  hint: "extra LSBs for intermediate precision (typically 4)"}
        - {name: "FORMAT",         hint: "input/output number format (signed fixed-point)"}
    L2_requirements:
      - {concept: "primary_function", hint: "vector-rotation iterations: per-stage rotation by atan(2^-i)"}
      - {concept: "directions",       hint: "rect→polar (vectoring mode) and polar→rect (rotation mode)"}
      - {concept: "throughput",       hint: "1 sample per clock (pipelined)"}
      - {concept: "latency",          hint: "PIPELINE + 2 cycles (pre + N stages + post)"}
      - {concept: "shift_add_only",   hint: "no multipliers; only adders + barrel shifts"}
    L3_command_protocol:
      typical_phy: "streaming — no bus protocol"
      typical_handshake: "ena (single-bit pipeline gate); ready-less"
    L4_register_map:
      not_applicable: true
      reason: "dsp-block primitive is a streaming pipeline. No host bus. All control is via parameters at elaboration time and the ena pin at runtime."
    L5_adi_spec:
      pad_role: "no off-chip pads — purely SoC-internal datapath"
    L6_control_logic:
      typical_submodules:
        - {name: "pre",       role: "quadrant fold / pre-rotation (maps any input quadrant into [-π/4, π/4])"}
        - {name: "CordicPipe", role: "single CORDIC stage (1 iteration of rotation by atan(2^-i)); instantiated PIPELINE times"}
        - {name: "corproc",   role: "per-stage processor: shift-add and sign-driven AddSub"}
        - {name: "post",      role: "post-rotation / output formatting"}
      typical_fsm: "no FSM — purely combinational per stage with pipeline registers between"
    L7_test_debug:
      typical_strategy: "golden-vector self-checks (sin/cos at 0/30/45/60/90 degrees, all 4 quadrants, swap path, ena freeze)"
      typical_modes: ["pipeline fill (latency cycles)", "back-to-back streaming", "quadrant edge cases", "inverse-pair check (rect2polar then polar2rect → identity)"]
    L8_timing_waveform:
      typical_clock_domains: 1
      typical_latency_cycles: "PIPELINE + 2 (e.g., 17 for 15 stages)"
      typical_throughput: "1 sample / clock"
      typical_fmax_mhz: "60-120 (depends on PIPELINE depth + FPGA)"
    L8R_rtl_constants:
      cordic_gain_constant_K: "0.6072529350088812... (product of cos(atan(2^-i)) for i=0..∞; for finite N stages, K → 0.6073)"
      cordic_gain_inv_compensation: "0x4DBA in 16-bit fixed-point (= 0.6072529 × 2^15)"
      atan_table_format: "atan(2^-n) scaled by 2^WIDTH or by π/2 — implementation-specific"
      typical_atan_table_n0_to_n7:
        - {n: 0, atan_rad: 0.7853981633974483, comment: "atan(1) = π/4"}
        - {n: 1, atan_rad: 0.4636476090008061, comment: "atan(0.5)"}
        - {n: 2, atan_rad: 0.24497866312686414, comment: "atan(0.25)"}
        - {n: 3, atan_rad: 0.12435499454676144}
        - {n: 4, atan_rad: 0.06241880999595735}
        - {n: 5, atan_rad: 0.031239833430268277}
        - {n: 6, atan_rad: 0.015623728620476831}
        - {n: 7, atan_rad: 0.007812341060101111}
      typical_pi_constants:
        - {name: "PI",  scaling: "2^WIDTH or angle full-scale"}
        - {name: "PI2", scaling: "PI/2"}
        - {name: "2PI", scaling: "2*PI"}
    L9_integration_spec:
      typical_dtops: ["r2p_cordic (rect2polar top)", "p2r_cordic (polar2rect top)", "sc_corproc (sin/cos generator from angle)"]
      typical_instantiation: "parent design instantiates the relevant top entity with WIDTH and PIPELINE generics"
      typical_internal_wires: "x[0..N-1], y[0..N-1], z[0..N-1] arrays — registered between stages"
    L10_test_cases:
      typical_vectors:
        - {name: "sin/cos at 30°",   expect: "sin=0.5, cos=√3/2 (in fixed-point: 0x4000, 0x6EDA in 16-bit Q1.15)"}
        - {name: "sin/cos at 45°",   expect: "sin=cos=√2/2"}
        - {name: "rect→polar of {1,0}", expect: "magnitude=1, angle=0"}
        - {name: "rect→polar of {0,1}", expect: "magnitude=1, angle=π/2"}
        - {name: "inverse identity",  expect: "rect2polar then polar2rect → input within LSB tolerance"}
    L11_calibration:
      typical_lookup: "atan(2^-n) table for n=0..PIPELINE-1 (the per-stage rotation angles)"
      typical_gain_compensation: "multiply final magnitude by cordic_gain_inv_compensation (~0.6072529)"
      not_applicable_for_lab: false
    L12_behavioral_sequences:
      - {name: "pipeline fill",        steps: "PIPELINE+2 cycles of don't-care output, then 1-cycle latency to first valid"}
      - {name: "back-to-back samples", steps: "1 sample/cycle steady-state throughput"}
      - {name: "quadrant fold",        steps: "input from any quadrant → pre-rotates into Q1 → main pipeline → post adds back the quadrant"}
      - {name: "ena freeze",           steps: "ena=0 holds pipeline state; ena=1 resumes"}
    L13_lab_calibration:
      not_applicable: true
      reason: "Pure-digital DSP primitive; no analog trim or OTP-driven calibration."

  # v0.74 post-fpu benchmark: FPU subfamily of dsp-block (sibling of
  # CORDIC subfamily above). Models the dawsonjon-fpu IEEE 754
  # binary32 collection (separate add/sub/mul/div/cvt modules with
  # 4-phase handshake, multi-cycle iterative implementations).
  typical_structure_fpu:
    L1_datasheet:
      typical_pins:
        - {role: "clk",          direction: "input",  description: "single clock domain"}
        - {role: "rst",          direction: "input",  description: "synchronous active-high reset (FSM only — datapath regs not reset)"}
        - {role: "input_a",      direction: "input",  width: 32, description: "IEEE 754 binary32 operand A"}
        - {role: "input_a_stb",  direction: "input",  description: "operand A valid strobe"}
        - {role: "input_a_ack",  direction: "output", description: "operand A acknowledge (handshake)"}
        - {role: "input_b",      direction: "input",  width: 32, description: "IEEE 754 binary32 operand B (add/sub/mul/div only — not for cvt modules)"}
        - {role: "input_b_stb",  direction: "input",  description: "operand B valid strobe"}
        - {role: "input_b_ack",  direction: "output", description: "operand B acknowledge"}
        - {role: "output_z",     direction: "output", width: 32, description: "result (IEEE 754 binary32)"}
        - {role: "output_z_stb", direction: "output", description: "result valid strobe"}
        - {role: "output_z_ack", direction: "input",  description: "result acknowledge from downstream"}
      typical_pin_count: "9-11 per DTOP (no operand_b for converter modules)"
      typical_parameters:
        - {name: "WIDTH",       hint: "32 bits (binary32)"}
        - {name: "FRAC_WIDTH",  hint: "23 bits (mantissa)"}
        - {name: "EXP_WIDTH",   hint: "8 bits (exponent)"}
        - {name: "EXP_BIAS",    hint: "127"}
    L2_requirements:
      - {concept: "format",            hint: "IEEE 754 binary32: 1 sign + 8 exponent + 23 mantissa, bias 127"}
      - {concept: "operations",        hint: "separate modules: adder/subtractor, multiplier, divider, float→int, int→float"}
      - {concept: "rounding_mode",     hint: "round-to-nearest-even (RNE) only — no other modes"}
      - {concept: "special_cases",     hint: "NaN propagation (canonical 0xFFC00000), ±Inf (0x7F800000/0xFF800000), ±0, subnormals (gradual underflow)"}
      - {concept: "exception_flags",   hint: "no flag outputs in typical OpenCores FPU; downstream interprets results"}
    L3_command_protocol:
      typical_phy: "streaming — no bus protocol"
      typical_handshake: "4-phase request/ack on each operand and result (chips-2.0 physical interface convention)"
    L4_register_map:
      not_applicable: true
      reason: "FPU primitive is a streaming pipeline. No host bus. All control is via the 4-phase input/output handshakes."
    L5_adi_spec:
      pad_role: "no off-chip pads — purely SoC-internal datapath"
    L6_control_logic:
      typical_submodules:
        - {name: "adder",        role: "add/sub: 12-state FSM (GET_A → GET_B → UNPACK → SPECIAL → ALIGN → ADD/SUB → NORMALISE → ROUND → PACK → PUT_Z)"}
        - {name: "multiplier",   role: "13-state FSM with 24×24 multiply step"}
        - {name: "divider",      role: "15-state FSM with 50-iteration restoring division"}
        - {name: "float_to_int", role: "5-state conversion FSM"}
        - {name: "int_to_float", role: "7-state conversion FSM"}
      typical_fsm_pattern: "GET_OPERANDS → UNPACK → SPECIAL_CASES (NaN/Inf/zero) → COMPUTE → NORMALISE → ROUND → PACK → PUT_Z"
    L7_test_debug:
      typical_strategy: "per-module testbenches in own subdir; each driven by file_reader_a/b feeding hex operand pairs → file_writer captures result for diff against software golden"
      typical_modes: ["per-op directed tests", "random vector regression", "edge-case sweep (NaN/Inf/0/subnormal)"]
    L8_timing_waveform:
      typical_clock_domains: 1
      typical_latency_cycles_adder: "10 (state-machine traversal, no datapath pipelining within one op)"
      typical_latency_cycles_multiplier: "10"
      typical_latency_cycles_divider: "30+ (50-iteration restoring division)"
      typical_throughput: "1 result per output handshake (no internal pipelining within one op)"
    L8R_rtl_constants:
      typical_format_constants:
        - {name: "FRAC_WIDTH",       value: 23}
        - {name: "EXP_WIDTH",        value: 8}
        - {name: "EXP_BIAS",         value: 127}
        - {name: "TOTAL_WIDTH",      value: 32}
      typical_special_case_patterns:
        - {name: "canonical_NaN",   hex: "0xFFC00000", desc: "quiet NaN with sign=1, exp=all-1s, frac MSB=1"}
        - {name: "positive_infinity", hex: "0x7F800000", desc: "sign=0, exp=all-1s, frac=0"}
        - {name: "negative_infinity", hex: "0xFF800000", desc: "sign=1, exp=all-1s, frac=0"}
        - {name: "positive_zero",    hex: "0x00000000"}
        - {name: "negative_zero",    hex: "0x80000000"}
        - {name: "float_to_int_overflow_sentinel", hex: "0x80000000", desc: "returned by float_to_int when result doesn't fit in int32"}
      typical_known_bugs:
        - {name: "adder_zero_sign", file: "adder.v:254-256", desc: "fix for `-a + a = +0.0` (sign-bit corner case)"}
        - {name: "divider_typo",    file: "divider.v:122",    desc: "Verilog typo `$signed(b_e == -127)` — works due to comparison eval but lints flag"}
    L9_integration_spec:
      typical_dtops: ["adder", "multiplier", "divider", "float_to_int", "int_to_float"]
      typical_instantiation: "instantiate the relevant FPU module per operation; chain via 4-phase handshakes for compound expressions"
    L10_test_cases:
      typical_vectors:
        - {name: "1.0 + 1.0",           expect: "2.0 (0x40000000)"}
        - {name: "1.0 - 1.0",           expect: "+0.0 (0x00000000)"}
        - {name: "1.0 * 1.0",           expect: "1.0 (0x3F800000)"}
        - {name: "1.0 / 0.0",           expect: "+Inf (0x7F800000)"}
        - {name: "0.0 / 0.0",           expect: "NaN (0x7FC00000 or 0xFFC00000)"}
        - {name: "NaN + 1.0",           expect: "NaN (propagation)"}
        - {name: "Inf - Inf",           expect: "NaN"}
        - {name: "subnormal + subnormal", expect: "subnormal (gradual underflow)"}
        - {name: "float_to_int(2.5)",   expect: "2 (truncate toward zero) or 2/3 RNE depending on RTL"}
    L11_calibration:
      not_applicable: true
      reason: "Deterministic IEEE 754 arithmetic; no calibration. RNE rounding is hardcoded."
    L12_behavioral_sequences:
      - {name: "adder full chain",    steps: "GET_A → GET_B → UNPACK (sign/exp/frac) → SPECIAL_CASES (NaN/Inf/0) → ALIGN (shift smaller exp) → ADD or SUB (mantissa) → NORMALISE → ROUND (RNE) → PACK → PUT_Z"}
      - {name: "multiplier chain",    steps: "GET_A → GET_B → UNPACK → SPECIAL_CASES → MULTIPLY (24×24) → NORMALISE → ROUND → PACK → PUT_Z"}
      - {name: "divider chain",       steps: "GET_A → GET_B → UNPACK → SPECIAL_CASES → DIVIDE (50-iter restoring) → NORMALISE → ROUND → PACK → PUT_Z"}
    L13_lab_calibration:
      not_applicable: true
      reason: "Pure-digital primitive; IEEE 754 results are deterministic. Lab bringup uses Berkeley TestFloat or equivalent vector regression."

  # v0.79 (C-half-2) typical_large_tables — see hash-function-csr for schema.
  # CORDIC needs the full atan(2^-n) table for n=0..PIPELINE-1 (typically 16).
  # K3 already documents first 8 (typical_atan_table_n0_to_n7) but the full
  # table extends to n=15 for 16-bit precision. K = 0.6072529350088812 etc.
  # are scalars, not tables — only atan_table is enumerable + truncated.
  typical_large_tables:
    - {layer: L8R, path: "atan_table",       count: 16, source_spec: "atan(2^-n) for n = 0..PIPELINE-1; atan(1)=π/4, atan(0.5)≈0.4636, atan(0.25)≈0.2450, atan(0.125)≈0.1244, ... atan(2^-15)≈3.05e-5; emit per-stage values in radians (or scaled by 2^WIDTH for fixed-point integration)", member_shape: "{n: int, atan_rad: float, comment?: str}"}

network-controller:
  reference: "liteeth (EnjoyDigital) / alexforencich/verilog-ethernet / OpenCores tri_mode_ethernet_mac"
  public_source: "github.com/enjoy-digital/liteeth + opencores.org/projects/ethernet_tri_mode"
  typical_mac_rates_mbps: [10, 100, 1000]
  typical_interface: "MII / GMII / RGMII / SGMII"
  typical_buffer_depth_frames: 4

  # v0.74 post-ethernet_tri_mode benchmark: network-controller (Ethernet
  # MAC subfamily) specific structure. Models the OpenCores
  # tri_mode_ethernet_mac shape (10/100/1000 Mbps with GMII+MII PHY).
  typical_structure:
    L1_datasheet:
      typical_pins:
        - {role: "Reset",       direction: "input",  description: "system reset, active-low or active-high"}
        - {role: "Clk_125M",    direction: "input",  description: "125MHz clock for 1G mode (GMII GTX_CLK source)"}
        - {role: "Clk_user",    direction: "input",  description: "user-side FIFO clock"}
        - {role: "Clk_reg",     direction: "input",  description: "host CSR clock"}
        - {role: "MCrs_dv",     direction: "input",  description: "PHY RX_DV / RX_CRS"}
        - {role: "MRxD",        direction: "input",  width: 8,  description: "PHY RX data (4-bit MII / 8-bit GMII)"}
        - {role: "MRxErr",      direction: "input",  description: "PHY RX error"}
        - {role: "MTxD",        direction: "output", width: 8,  description: "PHY TX data (4-bit MII / 8-bit GMII)"}
        - {role: "MTxEn",       direction: "output", description: "PHY TX enable"}
        - {role: "MTxErr",      direction: "output", description: "PHY TX error"}
        - {role: "GTX_CLK",     direction: "output", description: "1G PHY transmit clock (125MHz)"}
        - {role: "Mdo / Mdi",   direction: "in/out", description: "MIIM management data (tristate at pad)"}
        - {role: "Mdc",         direction: "output", description: "MIIM management clock"}
        - {role: "CSB / WRB",   direction: "input",  description: "host CSR strobe + write-strobe"}
        - {role: "CD_in / CD_out", direction: "in/out", width: 16, description: "host CSR data"}
        - {role: "CA",          direction: "input",  width: 8, description: "host CSR address"}
        - {role: "Tx_user / Rx_user FIFO", direction: "in/out", width: 32, description: "user-side packet FIFO with sop/eop/be"}
      typical_pin_count: "60-100 (GMII + MII fallback + MIIM + host CSR + user FIFO)"
    L2_requirements:
      - {concept: "rates",           hint: "10 / 100 / 1000 Mbps tri-mode (mode select via host CSR)"}
      - {concept: "duplex",          hint: "full-duplex + half-duplex (CSMA/CD for 10/100)"}
      - {concept: "phy_interface",   hint: "GMII for 1G; MII for 10/100; auto-switch via Speed[1:0]"}
      - {concept: "frame_features",  hint: "preamble/SFD strip on RX; FCS gen+check; 802.3x PAUSE on full-duplex"}
      - {concept: "mac_filter",      hint: "perfect-match dest MAC + multicast hash table + broadcast leaky-bucket"}
      - {concept: "vlan_tagging",    hint: "802.1Q-aware (28-byte min frame for VLAN-tagged); jumbo frames optional"}
      - {concept: "rmon_counters",   hint: "RFC2819/RFC2233 statistics (~30 counters)"}
      - {concept: "miim_management", hint: "Clause-22 MDC/MDIO interface to PHY; programmable clock divider"}
      - {concept: "source_mac_insert", hint: "optional source-MAC insertion on TX (FrameType[1])"}
    L3_command_protocol:
      typical_phy:
        gmii_signals: ["GTX_CLK", "TXD[7:0]", "TX_EN", "TX_ER", "RX_CLK", "RXD[7:0]", "RX_DV", "RX_ER"]
        mii_signals:  ["TX_CLK (from PHY)", "TXD[3:0]", "TX_EN", "RX_CLK (from PHY)", "RXD[3:0]", "RX_DV", "RX_ER"]
      typical_host_protocol: "CSB+WRB+CA+CD strobed CSR access (latency-1 read)"
      typical_user_fifo_protocol: "32-bit data + sop + eop + be[3:0] handshake"
      typical_miim_frame: "32-bit Clause-22: ST(2)+OP(2)+PHYAD(5)+REGAD(5)+TA(2)+DATA(16)"
    L4_register_map:
      typical_csr_count: 35
      typical_rmon_count: 30-40
      typical_register_examples:
        - {name: "MAC_TX_CTRL",     access: "R/W", desc: "TX enable / pad / FCS / source-MAC insert"}
        - {name: "MAC_RX_CTRL",     access: "R/W", desc: "RX enable / promiscuous / accept_broadcast"}
        - {name: "MAC_ADDR_LSB",    access: "R/W", desc: "lower 32 bits of station MAC"}
        - {name: "MAC_ADDR_MSB",    access: "R/W", desc: "upper 16 bits + flags"}
        - {name: "FLOW_CTRL",       access: "R/W", desc: "PAUSE enable / PAUSE quanta / send PAUSE"}
        - {name: "TX_HWMARK",       access: "R/W", desc: "TX FIFO high watermark"}
        - {name: "TX_LWMARK",       access: "R/W", desc: "TX FIFO low watermark"}
        - {name: "IFG_SET",         access: "R/W", desc: "IFG (Inter-Frame Gap) in byte-times"}
        - {name: "MIIM_CONFIG",     access: "R/W", desc: "MIIM clock divider"}
        - {name: "MIIM_OP",         access: "R/W", desc: "MIIM operation: read/write/PHYAD/REGAD/data"}
        - {name: "MIIM_RD_DATA",    access: "R",   desc: "MIIM read result"}
        - {name: "RMON_CTRL",       access: "R/W", desc: "RMON enable + per-counter read addr"}
        - {name: "RMON_RD_DATA",    access: "R",   desc: "RMON counter read"}
    L5_adi_spec:
      pad_role: "GMII/MII go to off-chip PHY (single-ended, 2.5V/3.3V LVCMOS); MDIO is open-drain tristate"
    L6_control_logic:
      typical_submodules:
        - {name: "MAC_top",     role: "top wrapper"}
        - {name: "MAC_tx",      role: "TX path: preamble→SFD→DATA→PAD→FCS→IFG"}
        - {name: "MAC_rx",      role: "RX path: PREAMBLE_DETECT→DATA→FCS_CHECK→length filter"}
        - {name: "Phy_int",     role: "GMII↔MII multiplexer; speed-dependent"}
        - {name: "RMON",        role: "RMON statistics counters (~30)"}
        - {name: "reg_int",     role: "host CSR access + MIIM bridge"}
        - {name: "eth_miim",    role: "Clause-22 MDC/MDIO master"}
        - {name: "Clk_ctrl",    role: "1G/100M/10M clock muxing (GTX_CLK or PHY-sourced TX_CLK)"}
        - {name: "afifo",       role: "async FIFO (user-clk ↔ MAC-clk)"}
      typical_fsm:
        mac_tx_states: ["IDLE", "PREAMBLE", "SFD", "DATA", "PAD", "FCS", "IFG"]
        mac_rx_states: ["IDLE", "PREAMBLE_DETECT", "DATA", "FCS_CHECK", "ERROR"]
        miim_states:   ["IDLE", "PREAMBLE_32", "ST_OP_PHY_REG_TA", "DATA_16", "DONE"]
    L7_test_debug:
      typical_strategy: "verification plan VP-1.1..VP-1.7 (Tx/Rx good frame, length filter, broken FCS, PAUSE, MIIM, RMON)"
      typical_modes: ["line loopback (Tx→Rx through PHY pads)", "internal loopback"]
    L8_timing_waveform:
      typical_clock_domains: 5
      typical_clocks: ["Clk_125M (1G)", "Tx_clk (PHY-sourced for 10/100)", "Rx_clk (PHY-sourced)", "Clk_user", "Clk_reg"]
      typical_ifg_byte_times: 12
      typical_preamble_octets: 7
      typical_sfd: "0xD5"
    L8R_rtl_constants:
      typical_fcs_polynomial: "32'h04C11DB7 (CRC-32 / 802.3)"
      typical_min_frame_bytes: 64
      typical_max_frame_bytes_no_jumbo: 1518
      typical_max_frame_bytes_jumbo: 9000
      typical_pause_quantum_bit_time: 512
      typical_tx_fifo_depth_words: 256-2048
      typical_rx_fifo_depth_words: 256-2048
      typical_rmon_addr_width_bits: 6
      typical_miim_clock_max_hz: 2500000
    L9_integration_spec:
      typical_dtops: ["MAC_top"]
      typical_submodule_instantiation: "1 × MAC_tx, 1 × MAC_rx, 1 × Phy_int, 1 × RMON, 1 × reg_int, 1 × eth_miim, 1 × Clk_ctrl, 2 × afifo"
    L10_test_cases:
      typical_vectors:
        - {name: "TX small frame", expect: "host writes 64-byte frame to user FIFO → MAC adds preamble+SFD+FCS → PHY pin sees full 84+ bytes including IFG"}
        - {name: "RX good frame",  expect: "PHY drives 64-byte frame → MAC strips preamble+SFD, checks FCS, lands payload in user FIFO with sop/eop"}
        - {name: "MIIM read",      expect: "host writes MIIM_OP{op=10, phyad=0x1F, regad=0x02} → wait → read MIIM_RD_DATA"}
    L11_calibration:
      typical_speed_to_clock:
        - {speed: "1Gbps",  tx_clk: "125 MHz GTX_CLK from MAC", phy_int: "GMII"}
        - {speed: "100Mbps", tx_clk: "25 MHz from PHY",         phy_int: "MII"}
        - {speed: "10Mbps",  tx_clk: "2.5 MHz from PHY",        phy_int: "MII"}
      typical_pause_quanta_table:
        - {quanta: 1,    bit_time_us: 0.512,  unit: "1G"}
        - {quanta: 65535, bit_time_ms: 33.5,  unit: "1G"}
    L12_behavioral_sequences:
      - {name: "TX chain",         steps: "user FIFO write → afifo cross → MAC_tx FSM IDLE→PREAMBLE→SFD→DATA→PAD→FCS→IFG → PHY pins"}
      - {name: "RX chain",         steps: "PHY pins → MAC_rx FSM PREAMBLE_DETECT→DATA→FCS_CHECK → length+addr filter → afifo cross → user FIFO"}
      - {name: "PAUSE TX",         steps: "host sets FlowControl[SendPause] → MAC_tx generates PAUSE frame with quanta value"}
      - {name: "PAUSE RX",         steps: "MAC_rx detects PAUSE frame → blocks MAC_tx for quanta × 512 bit-times"}
      - {name: "CSMA/CD backoff",  steps: "half-duplex collision → jam → exp backoff → retry"}
    L13_lab_calibration:
      typical_smoke_tests: ["FPGA bring-up: ping local PHY → ARP request → reply", "Wireshark capture frames → verify MAC + FCS"]
      typical_lab_equipment: ["Wireshark + USB Ethernet sniff", "PHY eval board with TJA1101 or similar"]

# -----------------------------------------------------------------------
# v0.79 (E1) — minimal K3 stubs for the 4 new K1 classes added by the
# k3_class_miner sweep (234 open-source ICs). These are intentionally
# THIN: the proposer can deepen them later as benchmark ICs land for
# each class. Each stub establishes class identity + canonical reference
# corpus + a single-line typical_* hint per available L-layer so the
# per-layer agents have something to anchor against from day 1.
#
# (5th miner candidate "crypto-miner" is intentionally NOT added —
# bitcoin-miner is already covered by hash-function-miner from the C1
# split. See class-tree.yaml comment.)

debug-block:
  reference: "litescope (LiteX) / riscv-dbg (PULP)"
  public_source: "github.com/enjoy-digital/litex (litescope), github.com/pulp-platform/riscv-dbg"
  typical_role: "On-chip debug / trace infrastructure — NOT a user-facing peripheral; observes internal SoC signals + drives JTAG-DM run-control."
  typical_pin_count: "8–20 (mostly internal probe + JTAG/wishbone)"
  typical_top_module_name_convention: "snake_case suffix _dm (debug-module) or _scope"

  typical_structure:
    L1_datasheet:
      typical_pins:
        - {role: "clk",           direction: "input",  description: "core domain clock"}
        - {role: "rstn",          direction: "input",  description: "active-low reset"}
        - {role: "tck/tms/tdi/tdo", direction: "mixed", description: "JTAG (riscv-dbg) — replaced by Wishbone for litescope"}
        - {role: "dmi_*",         direction: "mixed",  description: "Debug Module Interface (RISC-V Debug Spec 0.13.2)"}
        - {role: "probe_in[N]",   direction: "input",  description: "internal signal probes (litescope)"}
    L4_register_map:
      typical_csrs: "RISC-V Debug spec DM registers (DMCONTROL/DMSTATUS/HARTINFO/COMMAND/DATA0-DATA11) + abstract command interface"
    L9_integration_spec:
      typical_top_level_port_count: "10–25"

  applicable_specs: ["RISC-V External Debug Support 0.13.2 / 1.0", "ARM CoreSight DAP (analogous)"]

display-controller:
  reference: "Xosera (retro 16-bit GPU) / vortex-gpu (RISC-V GPGPU) / litevideo"
  public_source: "github.com/XarkLabs/Xosera, github.com/vortexgpgpu/vortex, github.com/enjoy-digital/litevideo"
  typical_role: "Frame-buffer + pixel pipeline driving HDMI/VGA/DisplayPort output. Includes scan-line generators, blitters, optional shader pipelines."
  typical_top_module_name_convention: "snake_case (litevideo, hdmi_*) or PascalCase (Xosera)"
  typical_pin_count: "20–60 (host bus + memory + 4-12 video output pins)"

  typical_structure:
    L1_datasheet:
      typical_pins:
        - {role: "pixel_clk",     direction: "input",  description: "pixel clock (25.2 MHz / 74.25 MHz / 148.5 MHz typical)"}
        - {role: "memory_clk",    direction: "input",  description: "frame-buffer memory domain clock"}
        - {role: "host_bus_*",    direction: "mixed",  description: "host write/read interface (Wishbone / AXI / direct ROP)"}
        - {role: "vsync/hsync",   direction: "output", description: "frame-sync outputs (VGA family)"}
        - {role: "tmds_data[3:0]", direction: "output", description: "HDMI/DVI TMDS pairs (encoded outside core)"}
    L8_timing_waveform:
      typical_clock_relations: "pixel_clk ≪ memory_clk; CDC required for any host writes during active line"
    L9_integration_spec:
      typical_submodules: "hcounter / vcounter / scanline_fetch / blitter / palette_lut / sync_generator / output_serializer"

  applicable_specs: ["VESA DMT (timing tables)", "HDMI 1.4/2.0", "DisplayPort 1.2 (vortex-gpu only)"]

protocol-bridge:
  reference: "freecores/usbhostslave / usb_cdc / glasgow"
  public_source: "github.com/freecores/usbhostslave, github.com/cdc/usb_cdc, github.com/GlasgowEmbedded/glasgow"
  typical_role: "External-protocol PHY+MAC bridge to internal SoC bus. Owns the full physical-layer encoder/decoder for an external standard (USB / CAN / Modbus / Bluetooth / PS2) and exposes memory-mapped or stream interface inward."
  typical_top_module_name_convention: "snake_case <protocol>_<host|slave|bridge> (e.g. usbhostslave, can_top, modbus_slave)"
  typical_pin_count: "15–40 (host bus + 2-4 external PHY pins, typically differential pair + power-enable)"

  typical_structure:
    L1_datasheet:
      typical_pins:
        - {role: "clk",           direction: "input",  description: "internal SoC bus clock"}
        - {role: "rstn",          direction: "input",  description: "active-low reset"}
        - {role: "phy_clk",       direction: "input",  description: "external-protocol bit clock (e.g. 48 MHz USB, 1 MHz CAN)"}
        - {role: "phy_data_*",    direction: "mixed",  description: "external-protocol data line(s) — DP/DM, CANH/CANL, etc."}
        - {role: "host_bus_*",    direction: "mixed",  description: "internal host-side memory-mapped interface"}
        - {role: "irq",           direction: "output", description: "frame-complete / error interrupt"}
    L3_command_protocol:
      typical_phy: "external-protocol PHY (USB Full-Speed differential / CAN dominant-recessive / Modbus RS-485 / etc.)"
    L4_register_map:
      typical_csrs: "TX/RX FIFO registers + control/status + IRQ-mask + protocol-specific config (e.g. USB device address, CAN bit timing)"

  applicable_specs:
    - "USB 2.0 (usb_cdc, usbhostslave)"
    - "ISO 11898 (freecores-can)"
    - "Modbus RTU / TCP (freecores-modbus)"
    - "Bluetooth Baseband (freecores-bluetooth)"
    - "PS/2 keyboard/mouse (freecores-ps2)"

root-of-trust:
  reference: "Caliptra (OCP / Microsoft / Google / AMD)"
  public_source: "github.com/chipsalliance/caliptra-rtl"
  typical_role: "Hardware root-of-trust SoC — key storage (OTP / PUF), embedded crypto co-processors, secure boot enforcement, attestation. Sits adjacent to crypto-engine but adds boot/attestation policy + lifecycle management."
  typical_top_module_name_convention: "snake_case caliptra_top, _wrapper suffix for SoC integration"
  typical_pin_count: "100–400 (full SoC: AHB/AXI fabric + JTAG-DM + boot interface + key-vault SRAM ports)"

  typical_structure:
    L1_datasheet:
      typical_pins:
        - {role: "clk / rstn",     direction: "input",   description: "system clock / active-low reset"}
        - {role: "ahb_*",          direction: "mixed",   description: "AHB-Lite system bus (caliptra)"}
        - {role: "jtag_*",         direction: "mixed",   description: "JTAG debug interface (lifecycle-gated)"}
        - {role: "fuse_*",         direction: "input",   description: "factory-provisioned UDS / field entropy / lifecycle bits"}
        - {role: "boot_*",         direction: "mixed",   description: "secure-boot interface to host SoC (image fetch + measurement)"}
        - {role: "key_vault_*",    direction: "internal", description: "shared key-vault SRAM ports to crypto engines (ECC/SHA/AES/HMAC)"}
    L4_register_map:
      typical_csrs: "Caliptra register map per OCP/Caliptra spec — MFG-mode + DEBUG-mode + PROD-mode lifecycle gates + per-engine command/status windows"
    L9_integration_spec:
      typical_submodules: "PUF/UDS source / SHA-256 / SHA-384 / ECC-384 / HMAC-DRBG / AES (key-wrap) / DOE / RV-microcontroller (Caliptra uses VeeR EL2)"

  applicable_specs:
    - "OCP Caliptra Specification 1.0"
    - "DICE / RIoT (TCG Device Identifier Composition Engine)"
    - "FIPS 140-3 (target)"
    - "TCG DPE (DICE Protection Environment)"

# ---------------------------------------------------------------------------
# UART 16550 subclass (NS16550A-compatible)
# ---------------------------------------------------------------------------
uart-peripheral-16550:
  reference: "OpenCores UART16550 (NS16550A-compatible)"
  public_source: "github.com/freecores/uart16550 (OpenCores)"
  parent_class: "uart-peripheral"
  typical_data_width_bits: 8
  typical_frame_format: "configurable 5N1..8E2 via LCR"
  typical_oversampling: 16
  typical_fifo_depth: {tx: 16, rx: 16}
  typical_bus_interface: "Wishbone B3 slave"
  typical_interrupt: true
  typical_modem_control: true
  typical_dlab_banking: true

  prompt_clues:
    - "16550"
    - "NS16550"
    - "UART with FIFO"
    - "DLAB"
    - "RBR THR IER IIR FCR LCR MCR LSR MSR"
    - "modem control"

  typical_structure:
    L1_datasheet:
      typical_pins:
        - {role: "wb_clk_i",    direction: "input",  width: 1,  description: "Wishbone / system clock"}
        - {role: "wb_rst_i",    direction: "input",  width: 1,  description: "active-high asynchronous reset"}
        - {role: "wb_adr_i",    direction: "input",  width: 5,  description: "register address (5-bit for 32-bit bus, 3-bit for 8-bit bus)"}
        - {role: "wb_dat_i",    direction: "input",  width: 32, description: "Wishbone write data (or 8 in 8-bit mode)"}
        - {role: "wb_dat_o",    direction: "output", width: 32, description: "Wishbone read data (or 8 in 8-bit mode)"}
        - {role: "wb_we_i",     direction: "input",  width: 1,  description: "Wishbone write enable"}
        - {role: "wb_stb_i",    direction: "input",  width: 1,  description: "Wishbone strobe"}
        - {role: "wb_cyc_i",    direction: "input",  width: 1,  description: "Wishbone bus cycle"}
        - {role: "wb_sel_i",    direction: "input",  width: 4,  description: "Wishbone byte-lane select (32-bit mode)"}
        - {role: "wb_ack_o",    direction: "output", width: 1,  description: "Wishbone transfer acknowledge"}
        - {role: "int_o",       direction: "output", width: 1,  description: "interrupt request to host (active high)"}
        - {role: "stx_pad_o",   direction: "output", width: 1,  description: "serial transmit data (RS-232 TX)"}
        - {role: "srx_pad_i",   direction: "input",  width: 1,  description: "serial receive data (RS-232 RX)"}
        - {role: "rts_pad_o",   direction: "output", width: 1,  description: "Request To Send (modem)"}
        - {role: "dtr_pad_o",   direction: "output", width: 1,  description: "Data Terminal Ready (modem)"}
        - {role: "cts_pad_i",   direction: "input",  width: 1,  description: "Clear To Send (modem)"}
        - {role: "dsr_pad_i",   direction: "input",  width: 1,  description: "Data Set Ready (modem)"}
        - {role: "ri_pad_i",    direction: "input",  width: 1,  description: "Ring Indicator (modem)"}
        - {role: "dcd_pad_i",   direction: "input",  width: 1,  description: "Data Carrier Detect (modem)"}
      typical_pin_count: "18-20 (Wishbone classic + serial + modem)"
    L2_requirements:
      - {concept: "16550_compatibility", hint: "NS16550A register-compatible; FIFO-only"}
      - {concept: "dual_bus_width",      hint: "compile-time 8-bit or 32-bit Wishbone data bus via DATA_BUS_WIDTH_8 define"}
      - {concept: "fifo_depth",          hint: "16-deep TX and RX FIFOs"}
      - {concept: "dlab_banking",        hint: "LCR[7] switches addr 0-1 between RBR/THR/IER and DLL/DLM"}
      - {concept: "baud_rate_divisor",   hint: "16-bit divisor latch; DL = Fclk / (16 * baud)"}
      - {concept: "configurable_frame",  hint: "5-8 data bits, none/odd/even/stick parity, 1/1.5/2 stop bits via LCR"}
      - {concept: "interrupt_system",    hint: "4-source priority encoder: RLS > RDA/CTI > THRE > MS; single int_o line"}
      - {concept: "modem_control",       hint: "DTR/RTS outputs, CTS/DSR/RI/DCD inputs with delta detection"}
      - {concept: "loopback_mode",       hint: "MCR[4] ties TX→RX internally; modem signals loop"}
      - {concept: "rx_trigger_levels",   hint: "FCR[7:6] sets RDA interrupt trigger at 1, 4, 8, or 14 bytes"}
      - {concept: "character_timeout",   hint: "CTI interrupt after 4 character times of RX FIFO inactivity"}
    L3_command_protocol:
      typical_bus:
        type: "Wishbone B3 slave"
        register_read: "Host drives wb_adr_i, asserts wb_cyc_i+wb_stb_i with wb_we_i=0; UART returns register on wb_dat_o"
        register_write: "Host drives wb_adr_i+wb_dat_i+wb_sel_i, asserts wb_cyc_i+wb_stb_i+wb_we_i=1"
        fifo_access: "Read addr 0 pops RX FIFO (RBR); write addr 0 pushes TX FIFO (THR)"
      typical_serial_frame:
        idle_state: "logic 1 (mark)"
        frame_order: ["start_bit (0)", "data_bits (LSB first, 5-8)", "optional parity", "stop_bit(s) (1)"]
        oversampling: "16x; receiver samples at mid-bit"
      typical_init_sequence:
        - "Write LCR with frame format + DLAB=1"
        - "Write DLM (addr 1) with divisor MSB"
        - "Write DLL (addr 0) with divisor LSB"
        - "Write LCR with DLAB=0"
        - "Write FCR to set RX trigger level"
        - "Write IER to enable desired interrupts"
      typical_interrupt_protocol:
        sources_by_priority:
          - {priority: 1, iid: "011", name: "Receiver Line Status",         clear: "read LSR"}
          - {priority: 2, iid: "010", name: "Received Data Available",      clear: "read RBR until below trigger"}
          - {priority: 2, iid: "110", name: "Character Timeout Indication", clear: "read RBR"}
          - {priority: 3, iid: "001", name: "Transmitter Holding Empty",    clear: "write THR or read IIR"}
          - {priority: 4, iid: "000", name: "Modem Status",                 clear: "read MSR"}
    L4_register_map:
      typical_registers:
        - {offset: 0, name: "RBR", access: "R",  reset: "0x00", dlab: 0, description: "Receiver Buffer — RX FIFO output (read pops)"}
        - {offset: 0, name: "THR", access: "W",  reset: "0x00", dlab: 0, description: "Transmitter Holding — TX FIFO input (write pushes)"}
        - {offset: 1, name: "IER", access: "RW", reset: "0x00", dlab: 0, bits: "EDSSI[3], ELSI[2], ETBEI[1], ERBFI[0]", description: "Interrupt Enable"}
        - {offset: 0, name: "DLL", access: "RW", reset: "0x00", dlab: 1, description: "Divisor Latch LSB"}
        - {offset: 1, name: "DLM", access: "RW", reset: "0x00", dlab: 1, description: "Divisor Latch MSB"}
        - {offset: 2, name: "IIR", access: "R",  reset: "0xC1", bits: "FIFOEN[7:6], IID[3:1], IPEND_N[0]", description: "Interrupt Identification"}
        - {offset: 2, name: "FCR", access: "W",  reset: "0xC0", bits: "RX_TRIGGER[7:6], TXFIFO_RESET[2], RXFIFO_RESET[1], FIFO_EN[0]", description: "FIFO Control"}
        - {offset: 3, name: "LCR", access: "RW", reset: "0x03", bits: "DLAB[7], BREAK[6], STICK[5], EPS[4], PEN[3], STB[2], WLS[1:0]", description: "Line Control"}
        - {offset: 4, name: "MCR", access: "W",  reset: "0x00", bits: "LOOP[4], OUT2[3], OUT1[2], RTS[1], DTR[0]", description: "Modem Control"}
        - {offset: 5, name: "LSR", access: "R",  reset: "0x60", bits: "ERR_IN_FIFO[7], TEMT[6], THRE[5], BI[4], FE[3], PE[2], OE[1], DR[0]", description: "Line Status"}
        - {offset: 6, name: "MSR", access: "R",  reset: "0x00", bits: "DCD[7], RI[6], DSR[5], CTS[4], DDCD[3], TERI[2], DDSR[1], DCTS[0]", description: "Modem Status"}
        - {offset: 7, name: "SCR", access: "RW", reset: "0x00", description: "Scratch Register (no hardware effect)"}
      typical_dlab_banking: "LCR[7] switches addr 0-1 between normal (RBR/THR/IER) and divisor (DLL/DLM)"
    L5_adi_spec:
      pad_role: "stx_pad_o/srx_pad_i route to RS-232 transceiver pads; modem signals optional"
    L6_control_logic:
      typical_submodules:
        - {name: "uart_wb",          role: "Wishbone bus interface — cycle/strobe/ack, byte-lane select"}
        - {name: "uart_regs",        role: "Register file — IER, IIR, FCR, LCR, MCR, LSR, MSR, DLL/DLM; hosts interrupt logic"}
        - {name: "uart_transmitter", role: "TX datapath — TX FIFO + shift register + TX FSM driving stx_pad_o"}
        - {name: "uart_receiver",    role: "RX datapath — start detection + shift register + RX FIFO + error flags + timeout"}
        - {name: "uart_tfifo",       role: "16-deep 8-bit transmit FIFO (instantiates raminfr)"}
        - {name: "uart_rfifo",       role: "16-deep receive FIFO with per-entry error flags (instantiates raminfr)"}
        - {name: "raminfr",          role: "Generic inferrable dual-port RAM, shared by both FIFOs"}
        - {name: "uart_sync_flops",  role: "2-stage synchronizers for async inputs (srx_pad_i, CTS, DSR, RI, DCD)"}
      typical_fsm:
        tx_fsm:
          states: ["TX_IDLE", "TX_LOAD", "TX_START", "TX_DATA", "TX_PARITY", "TX_STOP"]
          encoding_bits: 3
        rx_fsm:
          states: ["RX_IDLE", "RX_START", "RX_DATA", "RX_PARITY", "RX_STOP", "RX_PUSH"]
          encoding_bits: 4
    L7_test_debug:
      typical_strategy: "loopback mode (MCR[4]=1) self-test; sweep baud divisors; test all frame formats"
    L8_timing_waveform:
      typical_oversampling_factor: 16
      typical_baud_divisor_formula: "DL = Fclk / (16 * baud_rate)"
      typical_rx_sample_point: "mid-bit (sample 8 of 16)"
    L8R_rtl_constants:
      typical_fifo_depth: 16
      typical_address_width_bits: 3
      typical_register_offsets:
        - {name: "RBR/THR", offset: 0, dlab: 0}
        - {name: "IER",     offset: 1, dlab: 0}
        - {name: "DLL",     offset: 0, dlab: 1}
        - {name: "DLM",     offset: 1, dlab: 1}
        - {name: "IIR/FCR", offset: 2}
        - {name: "LCR",     offset: 3}
        - {name: "MCR",     offset: 4}
        - {name: "LSR",     offset: 5}
        - {name: "MSR",     offset: 6}
        - {name: "SCR",     offset: 7}
      typical_reset_values:
        - {reg: "IER",     reset_hex: "0x00"}
        - {reg: "IIR",     reset_hex: "0xC1"}
        - {reg: "LCR",     reset_hex: "0x03", reason: "8N1, DLAB=0"}
        - {reg: "MCR",     reset_hex: "0x00"}
        - {reg: "LSR",     reset_hex: "0x60", reason: "THRE+TEMT set (TX empty at reset)"}
    L9_integration_spec:
      typical_dtops: ["uart_top"]
      typical_submodule_instantiation:
        - {instance: "wb_if",       module: "uart_wb",          role: "Wishbone bus interface"}
        - {instance: "regs",        module: "uart_regs",        role: "Register file + interrupt logic"}
        - {instance: "transmitter", module: "uart_transmitter", role: "TX FIFO + shift register + TX FSM"}
        - {instance: "receiver",    module: "uart_receiver",    role: "RX shift register + RX FIFO + error/timeout"}
        - {instance: "baud_gen",    module: "uart_baud_gen",    role: "16-bit divisor → 16x baud tick"}
        - {instance: "sync_flops",  module: "uart_sync_flops",  role: "2-stage synchronizers for async inputs"}
      typical_internal_wires:
        - {name: "enable",      width: 1,  description: "16x baud tick from baud_gen"}
        - {name: "dl",          width: 16, description: "16-bit divisor latch {DLM,DLL}"}
        - {name: "lcr",         width: 8,  description: "line control (frame format)"}
        - {name: "mcr",         width: 5,  description: "modem control (DTR,RTS,OUT1,OUT2,LOOP)"}
        - {name: "stx_o_int",   width: 1,  description: "internal TX serial line"}
        - {name: "srx_i_int",   width: 1,  description: "internal RX (srx_pad_i or stx_o_int in loopback)"}
        - {name: "tf_push",     width: 1,  description: "push to TX FIFO"}
        - {name: "rf_pop",      width: 1,  description: "pop from RX FIFO"}
        - {name: "tf_count",    width: 5,  description: "TX FIFO occupancy"}
        - {name: "rf_count",    width: 5,  description: "RX FIFO occupancy"}
        - {name: "loopback",    width: 1,  description: "loopback mode enable (MCR[4])"}
    L10_test_cases:
      typical_vectors:
        - "loopback 8N1 TX 0x55 → RX 0x55"
        - "RX FIFO trigger level sweep (1/4/8/14)"
        - "character timeout after 4 char times"
        - "overrun: fill 16-byte RX FIFO + 1 extra"
        - "DLAB banking: DLL/DLM with DLAB=1, RBR/IER with DLAB=0"
        - "modem loopback: MCR[0..3] → MSR[4..7]"
    L11_calibration:
      not_applicable: false
      typical_calibration: "host programs DLM:DLL = Fclk/(16*baud); no analog calibration"
    L12_behavioral_sequences:
      - {name: "initialization", steps: "set LCR (frame+DLAB=1) → write DLM → write DLL → set LCR (DLAB=0) → write FCR → write IER"}
      - {name: "transmit byte",  steps: "poll LSR[5] THRE=1 → write THR → TX FSM: START→DATA→[PARITY]→STOP"}
      - {name: "receive byte",   steps: "RDA/CTI interrupt → read LSR → read RBR → repeat until DR=0"}
      - {name: "loopback test",  steps: "set MCR[4]=1 → write THR → TX→RX internal → RDA interrupt → read RBR → verify"}
    L13_lab_calibration:
      not_applicable: true
      reason: "Soft-IP; no analog trim. Lab bringup uses logic analyzer on stx_pad_o/srx_pad_i."

