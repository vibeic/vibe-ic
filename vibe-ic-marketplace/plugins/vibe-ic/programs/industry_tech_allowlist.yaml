# industry_tech_allowlist.yaml — v0.1.44
#
# General-convention IC technical identifiers that legitimately appear in
# Vibe-IC skill text WITHOUT backtick wrapping. The enhancement-capture
# honesty rule says skill content should describe GENERAL patterns; this
# list is the small exception for industry vocabulary so common it would
# be noise to backtick every occurrence.
#
# Membership rule (STRICT): each entry MUST be either
#   (a) An industry-standard signal / parameter / convention name
#       (rst_n, always_ff, data_width) — universal across designs, or
#   (b) A foundry / PDK / tool name (skywater, sky130, gf180, tsmc) —
#       proper-noun reference, not a benchmark or this-plugin-specific
#       name.
#
# NEVER add:
#   - Benchmark design leaf-names (radix2_div, freq_divbyeven, asyn_fifo) —
#     the whole point of the honesty rule is to keep these out.
#   - This-plugin's program names (phase1_engine, eda_cocotb, etc.) — they
#     should be backtick-wrapped in skill text (markdown best practice).
#     Plugin renames invalidate skill content; backticks are stable.
#   - General English words that happen to have underscores (none come to
#     mind; this rule is here for completeness).
#
# To propose an addition: open a PR adding the term + a one-line citation
# of an industry standard (IEEE 1364, OpenROAD doc, foundry datasheet,
# Wikipedia) showing the term is universal vocabulary.
#
# When loaded by programs/enhancement_emit.py, this YAML's `entries` list
# is normalized to lowercase and frozenset-ed. The list itself is sorted
# alphabetically within each category for review.

categories:
  reset_clock_convention:
    description: "Active-low reset, clock naming, FF type qualifiers — universal SV style."
    entries:
      - always_comb
      - always_ff
      - always_latch
      - chip_top
      - clk
      - clk_n
      - clk_p
      - reset_n
      - rst
      - rst_n

  fsm_convention:
    description: "Standard FSM state-variable naming."
    entries:
      - current_state
      - next_state

  handshake_protocol:
    description: "Universal valid/ready handshake (any AXI-style stream interface)."
    entries:
      - din_valid
      - dout_valid
      - res_ready
      - res_valid

  rtl_parameter_convention:
    description: "Conventional Verilog parameter names; industry-universal RTL."
    entries:
      - addr_width
      - data_width
      - fifo_depth

  scorer_verdict_category:
    description: "Compile / sim verdict categories used by the open-benchmark scorer."
    entries:
      - compile_error
      - functional_mismatch
      - sim_timeout
      - work_dir

  pdk_foundry:
    description: "PDK / foundry names; proper-noun reference."
    entries:
      - gf180
      - sky130
      - skywater
      - tsmc

  python_exception:
    description: "Python exception names referenced in tool-integration skills."
    entries:
      - module_not_found_error

  rf_analog_unit:
    description: "Standard RF/analog unit suffixes (refused otherwise by camelCase rule)."
    entries:
      - dbm
      - ghz
      - khz
      - mah
      - mhz

  sta_timing_name:
    description: "Universal STA timing-path constraint names."
    entries:
      - t_cyc
      - t_h
      - t_hold
      - t_recovery
      - t_removal
      - t_setup
      - t_su
