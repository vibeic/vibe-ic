# Vibe-IC Phase 1+2+3 Canonical Flow Definition
# =============================================
# Machine-readable enumeration of the canonical Phase 1+2+3 steps;
# see the active CANONICAL_FLOW doc under docs/architecture/.
#
# Phase 1 owns the doc-extraction track (single D-class step that
# wraps all 17 doc-gen skills + A1 analog spec extract). Phase 2
# covers Steps 1-13 + A2-A4 analog frontend. Phase 3 covers
# Steps 14-40 + A5-A9 analog backend + M1-M4 mixed-signal.
#
# Wave 91 / v1.6.15 — Option D restructure:
# the legacy `Step -1` (structural-RTL umbrella) is renamed `P0` to align
# with A*/M* stage-class markers, and the synthetic `Step 0` (pre-PnR
# Yosys gate) is promoted into the canonical integer track as Step 14
# (sits between stage2 Equivalence Check and stage3 Floorplan).
#
# Design-for-ECO (this revision) inserts a PROACTIVE Step 18
# (Spare-cell + ECO-prep insertion) between Placement (17) and CTS
# (now 19), and renumbers every numeric step id >= 18 by +1 — the main
# flow integer track is now 1..41 (Foundry Handoff is 36, FPGA final
# sign-off is 37, manufacturing 38-41).
# Analog A1..A9 and mixed-signal M1..M4 are unchanged.
#
# This file is the single source of truth. Any agent given a phase 2+3
# task MUST follow this order and pass every gate. The programs/
# flow_compliance_check.py script parses this file and produces a
# PASS/FAIL matrix. Declaring "PASS" without compliance_check exit 0
# is a process violation — see flow-orchestrate/SKILL.md.
#
# Skipping a step requires a machine-readable waiver in
# <project>/waivers.json with a documented justification; waivers still
# appear in the compliance report as SKIPPED and must be reviewed by a
# human before tape-out.

version: 2
flow_name: phase1_phase2_phase3
# total_steps counts the canonical integer main-track steps (1..44, v2.3).
# Design-for-ECO added Step 18 (Spare-cell + ECO-prep insertion) as a
# proper integer step between Placement (17) and CTS (19); every numeric
# step id >= 18 was renumbered +1, growing the track from 40 to 41.
total_steps: 44
analog_steps: 9

# When a step maps to a plugin skill, use the `skill:` field with the
# SKILL.md directory name (relative to vibe-ic/skills/).
# When a step maps to a deterministic program, use `program:` with the
# .py filename (relative to vibe-ic-d/programs/).
# Multiple entries imply sequence; all must succeed.
#
# gate_predicate options:
#   files_exist: <list of glob patterns, all must match at least one file>
#   program_exit_zero: <program name + args; must exit 0>
#   json_field_true: {file: <path>, field: <dotted.key>, expect: true}

# STAGE MEMBERSHIP IS DECLARED ONCE, ON THE STEP (vibe-ic#923)
# ------------------------------------------------------------
# A `stages[]` entry declares a stage's IDENTITY (id, name) and its
# CONDITION. It does NOT list its members. Membership is declared exactly
# once, by the `stage:` field on each entry of `steps:` below.
#
# This block used to carry a second, hand-maintained membership roster
# (`steps: [...]` per stage). Nothing derived either declaration from the
# other and nothing reconciled them, so they drifted: as committed they
# disagreed for 12 of the 63 steps — 4 outright contradictions (14, 32, 38
# and 39, each of which the roster placed one stage LATER than the step
# itself did) and 8 steps (42, 43, 44, DT1, DT2, DT3, FS1, P0) the roster
# had never been updated to mention at all. The roster's own comments record
# the drift: they still called Foundry Handoff "step 36" and manufacturing
# "38-41" while the steps had long since become 38 and 40-44.
#
# The roster lost because it was never the live declaration. Every shipped
# consumer that places a step in a stage reads the per-step `stage:` field —
# `flow_compliance_check`, `final_report_generate`,
# `flow_step_execution_coverage_check`, `flow_dashboard_data` — and the one
# program that loads this block at all,
# `phase1_planned_consumer_starved_check`, reads only `id` and `condition`
# from it and resolves the stage of a step through the step field. So
# deleting the roster moved no step for any program: it deleted a copy that
# had been wrong about four of them without consequence, because no code was
# listening.
#
# `flow_stage_membership_single_declaration_check.py` fails if a second
# membership declaration reappears here, if a step names a stage that is not
# declared below, or if a declared stage ends up with no members.
stages:
  # v2 — Phase 1 doc-extraction stage. Unified entry that wraps the
  # 17 doc-gen skills (Path A: input_doc/) + 1 dialogue skill
  # (Path B: input_prompt/). Output is L1-L27 JSON in
  # phase1/generated_docs/ — the universal handoff to Phase 2.
  # SKIP allowed when phase1/generated_docs/ already populated by an
  # external authoring path (e.g. the runner's dialogue mode).
  - id: stage_phase1
    name: "Phase 1 - Spec Extraction (input → L1-L27 structured JSON)"
    # ON-PASS REVIEW (the verification tier, second stage wired — stage1 was
    # first, v1.12.87; stage2 v1.13.2; stage3 v1.13.4)
    # ------------------------------------------------------------------
    # THE GAP THIS CLOSES WAS RECORDED IN THIS FILE, at step D1:
    # "`phase1-output-verify` and `phase1-completeness-deep-review` both ship,
    # both say in their own descriptions that they run 'After
    # phase1_one_shot_runner emits L*.json', and neither is named by any stage
    # -- so stage_phase1 has no declared on-pass review ... They belong in an
    # `on_pass_review:` block on stage_phase1." This is that block.
    #
    # WHY THIS STAGE. Its artefact is the flow's FIRST translation: every
    # later stage transforms an upstream artefact and is checked against it
    # (stage2 checks the netlist against the RTL, stage3 checks the layout
    # against the netlist and the PDK), but the L-docs are checked against a
    # DOCUMENT, and a document is not machine-comparable. So a value that
    # phase 1 gets wrong is not wrong anywhere downstream: the RTL implements
    # it, the oracle is derived from the same L-doc, and spec-conformance
    # compares the design with the same number and passes. The wrong value is
    # carried to GDS by every gate doing its job correctly.
    #
    # WHAT THIS REVIEW READS. The INTENT is the design INPUT — the input
    # documents, and the text of them the flow itself ingested. The ARTEFACT
    # is `phase1/generated_docs/`. It re-derives NOTHING: it does not re-run
    # the extractor, opens no tool and starts no process. It reads a claim the
    # artefact makes ABOUT the input, and checks it against the input.
    #
    # THREE RULES, THREE CLAIMS, ONE BLOCK. The doctrine is one `on_pass_review`
    # per stage, so the three rules that were authored for this stage in two
    # separate PRs (#1845 and #1854) are declared here together. They read
    # disjoint claims: R1_CITED_CONSTANT_NOT_IN_ITS_SOURCE asks whether a
    # quoted hexadecimal CONSTANT occurs in the document cited for it;
    # R2_TOP_MODULE_PROVENANCE_REFUTED asks whether the declared TOP MODULE
    # NAME came from the input or its declared source; R1_CITED_INPUT_ABSENT
    # asks whether the cited SOURCE FILE is a file this run contains at all.
    #
    # WHY `phase1/input_doc/` IS INTENT AND NOT ARTEFACT. It is the input
    # document's text as `doc_extract` produced it, and it is the ONLY
    # readable form of an input shipped as a PDF. The plugin's anti-fabrication
    # program `phase1_evidence_grounding_check` already reads exactly this
    # ladder for exactly this purpose — by hand: MEASURED on v1.12.99, it
    # appears in no gate clause in this file, so the only mention of it here is
    # this sentence. The scope limit that follows from reading an extracted
    # text is stated rather than implied: if the extraction is wrong, this
    # review cannot see it — that belongs to `doc_extract` and
    # `binary_doc_low_extraction_warn`, not here.
    #
    # BLOCKING vs ADVISORY, declared here and not by the reviewer. ADVISORY:
    # the review reports and exits 1 on a rejection; the executable test it
    # emits into the run is what blocks. Flipping this to `blocking` is a
    # one-word edit here and needs no reviewer change.
    on_pass_review:
      skill: phase1-output-verify
      fires_on: stage_pass
      verdict: advisory
      # THE DESIGN INPUT, at every staged entry point this flow's own D1 step
      # declares under `from: external`. It is the INTENT: what the L-docs are
      # a translation OF, and the set a provenance claim has to resolve into.
      # Path A (`input_doc/`) and Path B (`input_prompt/`) are BOTH named —
      # a citation into the dialogue path is a citation into the design input.
      # Path A (`input_doc/`) and Path B (`input_prompt/`) are BOTH named —
      # a citation into the dialogue path is a citation into the design input,
      # and R1_CITED_INPUT_ABSENT resolves a claimed source against this list.
      intent:
        - "input/docs/"
        - "phase1/input_doc/"
        - "input_doc/"
        - "phase1/input_prompt/"
        - "input/phase1_prompt.md"
        - "input/phase1_structured.yaml"
      intent_deny: ["oracle", "harness", "golden", "reference_output", "solution"]
      artefact:
        - "phase1/generated_docs/"
      rejection_requires: [intent, artefact, contradiction, test]
      # The run's own regression, written beside phase 1's other evidence —
      # red until the run is repaired. See stage1's block for why a test that
      # must fail today cannot live in the plugin's own suite.
      emit_test_dir: "reports/phase1/gates/on_pass_review"
      # DISPATCHED FROM `steps:`, WHICH IS THE ONLY SECTION THE ENGINE READS.
      # `flow_compliance_check.main` reads `steps = flow.get("steps", [])`; a
      # clause declared here was dispatched by NOTHING (v1.13.32, and still
      # measured at v1.13.54: 6 clauses under `stages:`, 0 dispatchable). The
      # command now lives on the step named below -- ONE declaration, in the
      # section the engine reads -- and this back-pointer says where.
      dispatched_by: "2"

  - id: stage1
    name: "RTL Generation + Verification"
    # ON-PASS REVIEW (vibe-ic — the verification tier's first wiring)
    # ------------------------------------------------------------------
    # `skills/_classification.json` declares a `verification` tier — "run
    # AFTER program PASS to spot-check the deterministic output" — with EIGHT
    # members. Measured on v1.12.83: all eight appear ZERO times in this file,
    # and `on_pass` / `after_pass` / `review_on` / `verify_artefact` /
    # `artefact_review` appear zero times too. Every `skills:` array below
    # hangs on a FAILURE trigger ("Lint error above threshold", "Setup
    # violation", "DRC/LVS/ERC fail") or on a `condition:`. So the AI was
    # wired as an AUTHOR (when no program can) and as a REPAIRER (when a
    # program failed), and NOWHERE as a reviewer of a program that PASSED.
    #
    # WHY THE FIELD IS NEW AND `skills:` COULD NOT CARRY IT. `skills:` is a
    # STEP field, and its meaning at every one of its sites is "invoke this
    # when the step could not, or when the step failed" — step 2's
    # `skills: [rtl-review]` sits directly beneath `closed_loop.trigger:
    # "Lint error/warning above threshold"`. Re-using the key for the
    # opposite trigger would give one key two contradictory meanings with
    # nothing to tell them apart. It is declared on the STAGE, not the step,
    # because 76 steps is the wrong granularity for eight skills and because
    # `stage:` is ALREADY the flow's coarse axis (eight values, already
    # separating analog and mixed-signal from digital, already enforced by
    # flow_compliance_check). This adds no grouping field: membership is
    # still declared exactly once, by the per-step `stage:` field
    # (flow_stage_membership_single_declaration_check P1 is unaffected — the
    # value here is a MAPPING and names no step id).
    #
    # WHY STAGE 1. Its artefact is the only one in the flow that is a
    # TRANSLATION of the intent rather than a transformation of an upstream
    # artefact: stage2 checks the netlist against the RTL (equivalence),
    # stage3 checks the layout against the netlist (LVS) and against the PDK
    # (DRC). Nothing checks the RTL against what the design was asked to be.
    # A wrong-but-passing stage-1 artefact is therefore carried faithfully to
    # GDS by every downstream gate doing its job correctly.
    #
    # WHAT THE REVIEW READS. The INTENT (`phase1/generated_docs/L*.json`, the
    # §4.05 design input — never the oracle, the harness or the golden) and
    # the ARTEFACT this stage produced. It NEVER re-derives the artefact: it
    # does not regenerate RTL and runs no tool. `intent_deny` is enforced, not
    # documentation — a declared intent path under any of those segments makes
    # the review refuse (rc 2) instead of reading it.
    #
    # BLOCKING vs ADVISORY, declared here and not by the reviewer. ADVISORY:
    # the review reports evidence and exits 1 on a rejection, and the runner
    # surfaces it; it does not stop the flow. A rejection's evidence is
    # required to include an executable test, and it is that test — an
    # ordinary repo test, in the ordinary suite — that blocks.
    #
    # `verdict:` IS REQUIRED, and flipping it is no longer a one-word edit. A
    # stage that declares this block and omits `verdict:` is NOT CHECKED
    # (rc 2): the review does not choose a policy the flow declined to state,
    # and `flow_gate_enforcement_audit` cannot catch the omission, because it
    # populates by gate PROGRAM and every stage's clause names the same one —
    # stage 3 (v1.13.4) and the analog stage (v1.13.8) each added one without moving its gate count.
    # And `blocking` now costs more than this line: `stage_on_pass_review`
    # declares `ENFORCEMENT: advisory` about itself (vibe-ic#1858) and no
    # runner spawns it inline, so the two would disagree — the program refuses
    # (rc 2) and `test_every_on_pass_review_stage_declares_its_verdict` fails.
    # Wire it where its rc can stop a step and re-declare it there, or leave it
    # advisory; the pair moves together or not at all.
    on_pass_review:
      skill: phase2-rtl-verify
      fires_on: stage_pass
      verdict: advisory
      intent:
        - "phase1/generated_docs/L9_INTEGRATION_SPEC.json"
      intent_deny: ["oracle", "harness", "golden", "reference_output", "solution"]
      artefact:
        - "phase2/stage1/rtl/"
        - "reports/phase2/"
      rejection_requires: [intent, artefact, contradiction, test]
      # WHERE THE REJECTION'S TEST IS WRITTEN. A rejection must be proven by an
      # executable test that FAILS TODAY and passes when repaired — which
      # cannot be a test in the plugin's own suite, since that would be a
      # permanent red about somebody else's design. The review WRITES the test
      # into the run it is reviewing: the run's own regression, red until the
      # run is fixed.
      emit_test_dir: "reports/phase2/gates/on_pass_review"
      # DISPATCHED FROM `steps:`, WHICH IS THE ONLY SECTION THE ENGINE READS.
      # `flow_compliance_check.main` reads `steps = flow.get("steps", [])`; a
      # clause declared here was dispatched by NOTHING (v1.13.32, and still
      # measured at v1.13.54: 6 clauses under `stages:`, 0 dispatchable). The
      # command now lives on the step named below -- ONE declaration, in the
      # section the engine reads -- and this back-pointer says where.
      dispatched_by: "7"

  - id: stage2
    name: "Synthesis + DFT"
    # THE ON-PASS REVIEW FOR STAGE 2 — the second wiring of the `verification`
    # tier, on the field v1.12.87 added for stage 1. Same program, same
    # contract, one stage-specific rule; see stage1 above for why the field
    # exists at all and why `skills:` could not carry it.
    #
    # WHAT NO STAGE-2 GATE READS. MEASURED on this file at v1.12.100: stage 2
    # declares twelve steps and every gate on them reads the ARTEFACT or
    # another artefact — `synth_netlist_check` and `provenance_check` (step 9)
    # ask whether the netlist is technology-mapped and whether Yosys produced
    # it, `lec_equivalence_check` (step 13) asks whether it matches the RTL,
    # `dft_*_coverage_check` (11 / DT1 / DT2 / DT3) ask what ATPG reached, and
    # steps 7 / 8 / 14 read the SDC and the Yosys script. Exactly ONE of them
    # opens `phase1/generated_docs/` at all: `sdc_validator_check --l8`, for
    # the clock. NOTHING in this stage compares the netlist to the design's
    # own declared INTERFACE. So the stage transforms and signs off the thing
    # stage 3 will build without once asking whether it is the thing that was
    # asked for.
    #
    # WHY THAT IS NOT STAGE 1's QUESTION ALREADY. Stage 1's R1 compares the
    # intent's top-module NAME against the staged RTL. The netlist is where
    # the interface first becomes CONCRETE — parameters resolved, the wrapper
    # chosen, widths fixed — and it is the artefact place-and-route consumes.
    # MEASURED on the published cell `ic/opentitan_aes`: R1 DISARMS (that
    # intent discloses `no_top_module_in_input: true`), every stage-2 gate
    # passes, and the netlist's top carries NONE of the six pins the design
    # input's own interface table declares.
    #
    # WHAT THE REVIEW READS. The INTENT (L9's promoted pin table — the §4.05
    # design input, never the oracle, the harness or the golden) and the
    # netlist step 9 produced. It re-derives nothing: it runs no synthesis and
    # rebuilds no netlist.
    #
    # BLOCKING vs ADVISORY, declared here and not by the reviewer. ADVISORY,
    # for the same reason stage 1 is: the review reports evidence and exits 1
    # on a rejection, and it is the executable test the rejection is required
    # to carry — an ordinary test, in the run's own tree — that blocks.
    #
    # WHO OWNS THE RESIDUE, and the one skill that was ruled out. The residue a
    # rejection here leaves is "L9 declares this interface and phase 2 did not
    # build it", which is `phase2-rtl-verify`'s own stated subject: "AI
    # spot-checks RTL quality and L9-contract conformance". The obvious
    # alternative, `full-test-audit`, is NOT named: it is a verification-tier
    # skill, but `skills/_classification.json` declares it `off_flow` with the
    # reason "its subject is the plugin tree", and `off_flow` is falsifiable by
    # what a skill reads. Naming it here would have forced the removal of that
    # declaration (skill_stage_membership_check P4, DOUBLE DECLARATION) and
    # asserted that a plugin health check reviews a design's netlist.
    on_pass_review:
      skill: phase2-rtl-verify
      fires_on: stage_pass
      verdict: advisory
      intent:
        - "phase1/generated_docs/L9_INTEGRATION_SPEC.json"
      intent_deny: ["oracle", "harness", "golden", "reference_output", "solution"]
      artefact:
        - "phase2/stage2/synth/netlist.v"
      rejection_requires: [intent, artefact, contradiction, test]
      emit_test_dir: "reports/phase2/gates/on_pass_review"
      # DISPATCHED FROM `steps:`, WHICH IS THE ONLY SECTION THE ENGINE READS.
      # `flow_compliance_check.main` reads `steps = flow.get("steps", [])`; a
      # clause declared here was dispatched by NOTHING (v1.13.32, and still
      # measured at v1.13.54: 6 clauses under `stages:`, 0 dispatchable). The
      # command now lives on the step named below -- ONE declaration, in the
      # section the engine reads -- and this back-pointer says where.
      dispatched_by: "15"

  - id: stage_analog
    name: "Analog Design Pipeline (parallel with digital stages 1-2)"
    # Wave 90 / v1.6.14 — analog track integerised to A1..A9. A6 is
    # per-block Physical Verification; A7/A8/A9 are Resim / Hardmacro
    # / Cosim respectively.
    condition:
      files_exist: ["phase1/analog/analog_block_list.json"]
    # THE ON-PASS REVIEW OF THE ANALOG TRACK, and the one question the A-gates
    # cannot ask. A1 reads the intent (L5_ADI_SPEC.json) ONCE and writes
    # `phase3/analog/<block>/spec.json`. From A2 to A9 that file IS the spec:
    # the topology is chosen against it, the deck sized against it, the PVT
    # sweep graded against it (`corner_yield_vs_spec_check` is explicit —
    # "parse yield table vs spec.json limits"), and the layout and hardmacro
    # signed off on the result.
    #
    # MEASURED on this tree: of the 54 `analog_*` programs, SEVEN open
    # L5_ADI_SPEC.json. FIVE are PRODUCERS (analog_a1_spec_emit,
    # analog_a2_topology_emit, analog_a3_netlist_emit, analog_real_corner_sweep,
    # analog_one_shot_runner). The other two are checkers asking a different
    # question: `analog_a0_skip_forbidden_check` uses
    # `analog_blocks_detected=false` as a waiver for a forbidden skip file and
    # never reads a block's requirements, and
    # `analog_content_detected_must_emit_l5_check` grades L5 against the input
    # DOCS and never opens a spec.json. NO A1-A9 GATE READS A BLOCK'S
    # REQUIREMENTS OUT OF L5 AT ALL; the one A-gate that opens an L doc does it
    # for an unrelated layer (analog_netlist_pdk_check reads
    # L19_CONSTRAINTS_PDK). So nothing in the flow compares the
    # spec the stage grades against with the spec the design asked for, and
    # every A-gate is green on a short or wrong copy because each of them
    # compares the artefact with the artefact.
    on_pass_review:
      skill: analog-output-verify
      fires_on: stage_pass
      verdict: advisory
      intent:
        - "phase1/generated_docs/L5_ADI_SPEC.json"
      intent_deny: ["oracle", "harness", "golden", "reference_output", "solution"]
      # BOTH spellings, canonical first — the same OR the A1..A9 steps declare
      # for every one of their own artefacts, and for the same reason: every
      # producer writes `phase3/analog/`, and `migrate_to_layout_p` moves a
      # project-root analog/ tree to `phase1/analog/`. The review resolves
      # `<dir>/<block>/spec.json` in the order written here and adds no third
      # spelling of its own.
      artefact:
        - "phase3/analog/"
        - "phase1/analog/"
      rejection_requires: [intent, artefact, contradiction, test]
      # See the stage1 note: a rejection must be proven by a test that FAILS
      # TODAY, which cannot live in the plugin's own suite. It is written into
      # the run being reviewed.
      emit_test_dir: "reports/analog/on_pass_review"
      # DISPATCHED FROM `steps:`, WHICH IS THE ONLY SECTION THE ENGINE READS.
      # `flow_compliance_check.main` reads `steps = flow.get("steps", [])`; a
      # clause declared here was dispatched by NOTHING (v1.13.32, and still
      # measured at v1.13.54: 6 clauses under `stages:`, 0 dispatchable). The
      # command now lives on the step named below -- ONE declaration, in the
      # section the engine reads -- and this back-pointer says where.
      dispatched_by: "14"

  - id: stage3
    name: "Physical Design + Sign-off"
    # Design-for-ECO inserted Step 18 (Spare-cell + ECO-prep insertion)
    # between Placement (17) and CTS (19); all later ids were +1.
    on_pass_review:
      skill: phase3-backend-verify
      fires_on: stage_pass
      verdict: advisory
      # THE INTENT IS THE DESIGN INPUT. L8 is the design-owned source of the
      # STA clock period (`l8_sta_clock_period_design_owned_check`); L9 is the
      # fallback the same precedence walk uses when L8 carries no scalar.
      intent:
        - "phase1/generated_docs/L8_TIMING_WAVEFORM.json"
        - "phase1/generated_docs/L9_INTEGRATION_SPEC.json"
      intent_deny: ["oracle", "harness", "golden", "reference_output", "solution"]
      # THE ARTEFACT IS THE DECK STAGE 3 ACTUALLY RAN AGAINST, plus the
      # sign-off evidence produced under it. `pnr.tcl` read_sdc's the first
      # entry; steps 16/17/19/20/23 all grade against it.
      artefact:
        - "phase3/stage3/pnr/constraint.sdc"
        - "phase3/stage3/cts/"
        - "phase3/stage3/sta/"
        - "reports/phase3/"
      rejection_requires: [intent, artefact, contradiction, test]
      emit_test_dir: "reports/phase3/gates/on_pass_review"
      # DISPATCHED FROM `steps:`, WHICH IS THE ONLY SECTION THE ENGINE READS.
      # `flow_compliance_check.main` reads `steps = flow.get("steps", [])`; a
      # clause declared here was dispatched by NOTHING (v1.13.32, and still
      # measured at v1.13.54: 6 clauses under `stages:`, 0 dispatchable). The
      # command now lives on the step named below -- ONE declaration, in the
      # section the engine reads -- and this back-pointer says where.
      dispatched_by: "37"

  # v1.6.13 Wave 88 — Mixed-Signal Integration (M1-M4) inserted
  # between digital stage3 and stage4. Required when analog blocks
  # are present (A7 hardmacros must be merged, power domains
  # crossed, level shifters / isolation cells inserted, top-level
  # PV repeated on the merged GDS, A+D interface signals validated).
  # SKIP if no analog_block_list.json (pure digital).
  - id: stage_mixed_signal
    name: "Mixed-Signal Integration (A+D top-level merge + sign-off)"
    condition:
      files_exist: ["phase1/analog/analog_block_list.json"]

  - id: stage4
    name: "Output + Validation"
    # THE ON-PASS RUNG FOR THE SHIP STEP (the `verification` tier, member 2 of
    # 8). Stage 2 checks the netlist against the RTL; stage 3 checks the layout
    # against the netlist and the PDK. Both are INTERNAL comparisons -- each
    # asks whether an artefact agrees with the artefact one rung below it.
    # Stage 4 is where the run stops comparing and starts SHIPPING: step 37
    # streams `phase3/stage4/gds/*.gds` and step 38 hands it to a foundry. The
    # question that appears exactly here is whether the file in the die slot is
    # the design the INTENT asked for, and no gate in this flow asks it --
    # step 37's four blocking clauses (size, substance, port labels,
    # provenance) are satisfied by any well-formed layout of any design, and
    # `gds_topcell_name_check` must be TOLD the name it matches and is named in
    # no gate at all.
    #
    # MEASURED, which is why this is a rung and not an opinion:
    # `ic/u_hawaii_adc/v1.9.86_sky130A` publishes `Verdict: PASS` with
    # `flow_compliance_check --strict -> Overall PASS, exit 0` while its die
    # slot holds a layout whose hierarchy root is a sub-block, byte-identical
    # to that run's own block deliverable. The first party to notice was an
    # external shuttle's precheck.
    #
    # ADVISORY, same reading as stage1: the review reports evidence and exits 1
    # on a rejection; the executable test it emits into the run is what blocks.
    on_pass_review:
      skill: compliance-gate-spot-check
      fires_on: stage_pass
      verdict: advisory
      intent:
        - "phase1/generated_docs/L9_INTEGRATION_SPEC.json"
      intent_deny: ["oracle", "harness", "golden", "reference_output", "solution"]
      # TWO ARTEFACT PATHS, AND THEY ARE NOT READ THE SAME WAY. The `gds` dir is
      # the DIE SLOT -- the subject. The `hardmacro` dir holds this run's BLOCK
      # deliverables and is read only to CORROBORATE a rejection already proven
      # on the die's own hierarchy root: when the two carry identical bytes, the
      # finding stops being a naming quibble and becomes "the mask shop was sent
      # a copy of one block". A run that publishes no hardmacro is judged
      # identically.
      artefact:
        - "phase3/stage4/gds/"
        - "phase3/analog/hardmacro/"
      # THE FLOW'S OWN WRAPPER NAME, declared here rather than assumed in the
      # program. A die's hierarchy root is legitimately either the module the
      # intent names or this wrapper -- the module `design_one_shot_runner`
      # auto-emits around a design, and the placeholder the
      # `canonical_chip_top_sentinel` strategy publishes. Measured over the 10
      # published cells that carry a stage-4 die: 3 roots equal the intent's
      # `top_module`, 6 are this wrapper, 1 is neither. Dropping this line would
      # reject 5 of 10, four of them ordinary flattened runs.
      canonical_top_wrapper: "chip_top"
      rejection_requires: [intent, artefact, contradiction, test]
      emit_test_dir: "reports/phase3/gates/on_pass_review"
      # DISPATCHED FROM `steps:`, WHICH IS THE ONLY SECTION THE ENGINE READS.
      # `flow_compliance_check.main` reads `steps = flow.get("steps", [])`; a
      # clause declared here was dispatched by NOTHING (v1.13.32, and still
      # measured at v1.13.54: 6 clauses under `stages:`, 0 dispatchable). The
      # command now lives on the step named below -- ONE declaration, in the
      # section the engine reads -- and this back-pointer says where.
      #
      # 40 -> 39. Being in `steps:` was necessary and not sufficient: step 40's
      # `condition:` names phase3/stage5_manufacturing/silicon_received.json, a
      # path no run tree and no commit in this repository's history has ever
      # carried, so the clause was SKIPPED-CONDITION and its gate never ran.
      # Declared where the engine looks, on a step the engine never reaches, is
      # the same silence one indirection further out. Step 39 is the last step
      # in the flow that declares no `condition:`.
      dispatched_by: "39"

  # v1.6.13 Wave 88 — Manufacturing & Test (post-fab silicon stage).
  # Optional: only fires when project sets manufacturing.enabled = true
  # OR a fabricated-silicon report exists. Most benchmark projects
  # SKIP this stage entirely.
  - id: stage5_manufacturing
    name: "Manufacturing & Test (fab → wafer-sort → packaging → ATE final)"
    condition:
      files_exist: ["phase3/stage5_manufacturing/silicon_received.json"]
    # DECLARED AND NOT ENABLED, on purpose. Read this before wiring it.
    #
    # WHAT IT WOULD ASK. Steps 40-44 record what the foundry, the assembly
    # house and the test floor sent back. All five of their gates
    # (manufacturing_fab_intake_check, wafer_sort_yield_check,
    # packaging_intake_check, final_test_attestation_check,
    # htol_attestation_check) check each artefact against ITSELF — measured at
    # v1.12.100, they carry ZERO references to phase1/ or to any L document.
    # So no gate anywhere asks whether the package that was assembled can bond
    # out the design the intent describes. Stage 2 checks the netlist against
    # the RTL and stage 3 checks layout against netlist and PDK; a package too
    # small for its own die passes every one of them.
    #
    # WHY IT HAS NEVER FIRED. There is no artefact. MEASURED 2026-08-30: of the
    # 105 published run roots, 0 carry a phase3/stage5_manufacturing/
    # directory, 0 carry silicon_received.json, and no commit in the history of
    # either repository ever added a file under that path. The published
    # steps/manufacturing/stage5_manufacturing/** files are D3 AUDIT LEDGERS
    # recording n_produced: 0 — the record that the step made nothing, not a
    # stage-5 artefact.
    #
    # AND THE STAGE STILL REPORTS GREEN: on
    # ic/sha256/clean_run_v1427_20260715/_logs/flow_compliance_strict.json all
    # five stage-5 rows are SKIPPED-CONDITION, which stage_on_pass_review's
    # stage_passed() holds in its green set. A review declared here fires on
    # every real subject and finds nothing to read.
    #
    # SO IT CARRIES NO `gate:` KEY. Nothing invokes it, `enabled: false` says
    # so, and stage5_manufacturing is registered in the program's
    # _DECLARED_NOT_ENABLED rather than its _RULES, so `--stage
    # stage5_manufacturing` reports the declaration and returns 2. Enabling it
    # needs ONE real known-good and ONE real known-bad packaging_log.json that
    # the rule's author did not create; a rule proven on its author's own
    # fixture has never been tested. The half that IS provable — the intent
    # reading itself — is exercised on the live corpus by
    # `test_stage5_on_pass_review_declared_not_enabled.py`, and it finds the
    # intent self-contradictory on 7 of the 7 roots that state a package.
    on_pass_review:
      enabled: false
      not_enabled_reason: >-
        No run has ever produced a stage-5 artefact (0 of 105 published run
        roots, measured 2026-08-30), so both halves of the control would have
        to be authored. Declared here so the gap is visible; not wired, so
        nothing reports a review it did not perform.
      skill: benchmark-verify
      fires_on: stage_pass
      verdict: advisory
      rule: R5_PACKAGE_CANNOT_BOND_DESIGN
      intent:
        - "phase1/generated_docs/L1_DATASHEET.json"
      intent_deny: ["oracle", "harness", "golden", "reference_output", "solution"]
      artefact:
        - "phase3/stage5_manufacturing/packaging_log.json"
      rejection_requires: [intent, artefact, contradiction, test]
      emit_test_dir: "reports/manufacturing/on_pass_review"
      # WHAT WOULD ENABLE IT, as files rather than as an intention. R5 moves
      # out of the program's _DECLARED_NOT_ENABLED when a run tree carries
      # BOTH phase3/stage5_manufacturing/silicon_received.json (step 40's
      # intake declaration — without it every stage-5 step is
      # SKIPPED-CONDITION and the review has no subject) and
      # phase3/stage5_manufacturing/packaging_log.json (step 42's declared
      # output, stating package_type and pin_count), and that pair exists
      # TWICE: once known-GOOD, whose pin count covers the design's external
      # pin population, and once known-BAD, whose does not. ONE of each is the
      # minimum, and neither may be authored by whoever enables the rule.
      enable_requires:
        - "phase3/stage5_manufacturing/silicon_received.json"
        - "phase3/stage5_manufacturing/packaging_log.json"
      enable_requires_note: >-
        One known-GOOD and one known-BAD real artefact, neither authored by
        whoever enables the rule. A reviewer proven on its author's own fixture
        has never been tested.

steps:
  # v2 — Phase 1 doc-extraction single-gate step. Wraps the 17
  # doc-gen skills + dialogue entry. Gate passes when all 13 L docs
  # (L1..L13) exist as JSON under phase1/generated_docs/.
  - id: D1
    name: "Phase 1 Doc Extraction (17 skills + dialogue entry → L1-L27)"
    stage: stage_phase1
    # ── required_inputs: the DATA half of the step contract ──────────────
    # `blocks_on` is an ORDERING edge and says nothing about data; this says
    # what the step READS. `from:` names the producing step and `path:` is
    # COPIED VERBATIM from that step's own `required_outputs`, so a
    # mis-attribution cannot land silently — `step_required_inputs_check.py`
    # exits 2 when a declared input is not one of the named step's declared
    # outputs. `outputs: all` = every declared output of that step.
    # `from: external` = not produced inside the flow (user prompt, PDK,
    # bench hardware); `check: none` marks one with no project-relative path
    # to probe, declared so it is VISIBLE rather than silently absent.
    # A step with NO required_inputs is UNDECLARED, never "has none" — see
    # docs and the check's --json `undeclared` list.
    required_inputs:
      # THE FIRST TWO ENTRIES ARE DERIVED, NOT STAGED — measured, not assumed.
      # `phase1/input_doc/` is WRITTEN BY THIS STEP: `phase1_doc_one_shot_runner`
      # extracts `input/docs/*` into `_path_layout.input_doc_dir()` (its own
      # `src_dir` / `dst_dir` pair), and `extraction_coverage_check` no-ops when
      # it already holds `*.txt`. So a declaration naming ONLY those two says D1
      # reads its own intermediate output, and is satisfiable only AFTER D1 has
      # run. Measured on pristine trees, `step_preflight.decide` returned REFUSED
      # for BOTH front doors — a Path-A tree holding only `input/docs/*.md` and a
      # Path-B tree holding only `input/phase1_prompt.md` — i.e. wiring the
      # pre-flight to the old declaration would have bricked every first run.
      # The three STAGED entry points below are the ones the runner's own
      # `_detect_input_mode` / `step_ingest_render` / `_run_docs_mode` read. The
      # two derived ones are KEPT because a caller may stage them directly (the
      # Layout-P canonical entry) and because published cells carry
      # `phase1/input_doc/` with no `input/docs/` — measured on
      # benchmark-data/ic/spm/v1.5.65_sky130A.
      - from: external
        path: "phase1/input_prompt/* OR phase1/input_doc/* OR input/docs/* OR input/phase1_prompt.md OR input/phase1_structured.yaml"
        what: >-
          the user's natural-language prompt or dialogue fact-graph (Path B)
          or the supplied datasheets / specs (Path A), at any of the staged
          entry points this runner reads
    # THE SEVENTEEN PER-LAYER DOC-GEN NAMES ARE GONE, AND THEY WERE THE
    # LARGEST GHOST CLUSTER IN THIS FILE. This list used to name 18 skills --
    # datasheet-gen, frs-gen, cmd-protocol-gen, regmap-gen, adi-spec-gen,
    # control-logic-gen, test-debug-gen, timing-waveform-gen, rtl-constants-gen,
    # integration-spec-gen, test-cases-gen, calibration-gen,
    # behavioral-sequences-gen, lab-calibration-gen, otp-content-gen,
    # doc-consistency-check, schematic-gen -- of which exactly ONE (`phase1`)
    # ships. The other seventeen describe the OLD per-layer "Entry B" chain that
    # was unified into the single DOC->JSON track this step's own runner
    # (`phase1_doc_one_shot_runner`) now executes. They were invisible to the
    # v1.12.76 guard because that guard matched `"fallback_skill": "..."` and
    # this list is neither -- see unbuilt_skills in skills/_classification.json.
    #
    # ONLY `phase1` REMAINS, and the two obvious additions are DELIBERATELY NOT
    # MADE HERE. `phase1-output-verify` and `phase1-completeness-deep-review`
    # both ship and both say in their own descriptions that they run "After
    # phase1_one_shot_runner emits L*.json". `phase1-output-verify` is now named
    # by stage_phase1's `on_pass_review:` block above; neither belongs in this
    # failure-triggered list. They are VERIFICATION-tier reviewers, and
    # v1.12.87 ruled on exactly this key:
    # "`skills:` is a STEP field, and its meaning at every one of its sites is
    # 'invoke this when the step could not, or when the step failed' ...
    # Re-using the key for the opposite trigger would give one key two
    # contradictory meanings with nothing to tell them apart." Adding them here
    # would be that re-use. They belong in an `on_pass_review:` block on
    # stage_phase1, the field v1.12.87 added for them on stage1.
    skills:
      - phase1
    programs:
      - l22_analog_verification_plan_emit
    program_outputs:
      - program: l22_analog_verification_plan_emit
        path: "phase1/generated_docs/L22_VERIFICATION_PLAN.json"
        verdict_field: extraction_status
    required_outputs:
      - "phase1/generated_docs/L1_DATASHEET.json"
      - "phase1/generated_docs/L2_FRS.json"
      - "phase1/generated_docs/L3_CMD_PROTOCOL.json"
      - "phase1/generated_docs/L4_REGMAP.json"
      - "phase1/generated_docs/L5_ADI_SPEC.json"
      - "phase1/generated_docs/L6_CONTROL_LOGIC.json"
      - "phase1/generated_docs/L7_TEST_DEBUG.json"
      - "phase1/generated_docs/L8_TIMING_WAVEFORM.json"
      # The SECOND L8 document. `phase1_all_l_docs_present_check` matches L-docs
      # by `L<n>_` PREFIX, so L8_TIMING_WAVEFORM alone satisfies the L8 slot and
      # this file's absence was invisible to every gate in the flow. It is not
      # optional and it is not incidental: Step 2 both READS it
      # (`threshold_range_contiguity_check phase1/generated_docs/L8_RTL_CONSTANTS.json`,
      # `internal_vs_external_timing_check --layer …`, `spec_response_delay_check
      # --spec …`) and GATES on it through `condition_files_exist`, so when D1
      # failed to write it the Step-2 clause SKIPPED silently instead of failing
      # — the artefact's absence removed the check that would have reported it.
      # BLAST RADIUS: present in 106 of the 106 tracked roots that carry
      # L1_DATASHEET.json (`git ls-files benchmark-data`), so declaring it
      # changes no published verdict.
      - "phase1/generated_docs/L8_RTL_CONSTANTS.json"
      - "phase1/generated_docs/L9_INTEGRATION_SPEC.json"
      - "phase1/generated_docs/L10_TEST_CASES.json"
      - "phase1/generated_docs/L11_OTP_CONTENT.json"
      - "phase1/generated_docs/L12_BEHAVIORAL_SEQUENCES.json"
      # L13's suffix is IC-class-dependent, which is why this flow's own
      # enforcing gate (`phase1_all_l_docs_present_check`) matches L-docs by
      # `L13_` PREFIX and explicitly does not constrain the suffix. The literal
      # `L13_OTP.json` written here matched no producer anywhere in the plugin
      # (93 program files write `L13_LAB_CALIBRATION.json`; zero write
      # `L13_OTP.json`), so it was a declaration that could never be satisfied.
      - "phase1/generated_docs/L13_*.json"
      # L19 is emitted by this same Phase-1 runner's L19-L23 skeleton pass,
      # then refined by its SDC/floorplan hooks.  D1's own gates consume it;
      # the run write ledger exposed that the producer contract omitted it.
      - "phase1/generated_docs/L19_CONSTRAINTS_PDK.json"
      # vibe-ic#1043-adjacent (d7 W2): PRODUCED BY THE FLOW, READ BY A GATE,
      # DECLARED BY NOBODY. `l21_macro_supply_rail_declared_check` is one of
      # D1's own advisory clauses and M2's gate reads it too, yet no step's
      # `required_outputs` named it — which is exactly the shape dimension 7
      # exists to report, and it was charging the finding to step M2 (the
      # CONSUMER) because there was no producer to charge it to.
      #
      # D1 is the producer: this step's own name is "Phase 1 Doc Extraction
      # (17 skills + dialogue entry -> L1-L27)", and it declared L1-L13 only.
      #
      # BLAST RADIUS, measured the same way as L8_RTL_CONSTANTS above: present
      # in 104 of the 105 tracked roots that carry L1_DATASHEET.json, and it
      # RESOLVES in an admissible run root
      # (benchmark-data/ic/caravel_user_project, 531 B), so declaring it closes
      # the d7 finding without opening a d3 one. Declaring an artefact d3
      # cannot then evidence would move the gap between dimensions rather than
      # close it — the failure mode M1's own d7 waiver names.
      - "phase1/generated_docs/L21_POWER_INTENT.json"
      # MOVED HERE FROM STEP 1 (63x9 d4/step1, issue #1219). The Phase-1
      # extraction-coverage REPORT: a per-doc diagnostic of which verbatim
      # literals from `extraction_patterns.json` reached
      # `generated_docs/L*.json`; companion to the LL-38 gate.
      #
      # It is declared HERE because every writer of it is a PHASE-1 program.
      # `test_coverage_report_producer_provenance.py` names both:
      # `phase1_doc_one_shot_runner.py` and `phase1_coverage_report_gen.py`
      # (write site: `phase1_coverage_report_gen.py:905-906`). Step 1 is the
      # spec-to-RTL step; it CONSUMES L-docs and writes no coverage report, so
      # declaring the artefact there was a mis-filed obligation, not a missing
      # gate clause. The obligation MOVED, it was not dropped — the clause
      # `phase1_coverage_report_present_check` below reads it.
      #
      # AND MEASURED ON THE PUBLISHED CORPUS, independently of the
      # provenance argument above — the two supports do not overlap:
      # Phase 1 extraction-coverage REPORT (companion to LL-38 gate);
      # per-doc diagnostic of which verbatim literals from
      # extraction_patterns.json reached generated_docs/L*.json.
      # MOVED HERE FROM STEP 1 (Spec-to-RTL): measured on the published
      # corpus, 75 of the 107 run roots that carry this report carry NO
      # RTL at all, and 105 of 107 carry D1's own L1_DATASHEET.json --
      # so it is produced by Phase 1 doc extraction, not by Spec-to-RTL.
      - "reports/phase1/extraction_coverage_report.md"
      - "reports/phase1/extraction_coverage_report.json"
      # The SECOND TRACK's own report (#312), declared under #1215.
      #
      # WHY IT REACHED W2 AND THE AST COULD NOT SEE IT.
      # `phase1_expert_parse_track.py:980` writes it as
      # `_pl.report_path(project, "phase1/expert_parse_track.json")`, which the
      # auto-router places under `reports/audit/`. That is
      # `matrix_d7_artifact_graph.RESOLUTION_LIMITS` entry 1 verbatim — a write
      # whose path root is a `_pl.report_path(...)` call — so no Python write
      # POSITION names the literal and the AST oracle answered "no producer,
      # externally supplied by design". The write ledger of
      # `benchmark-data/ic/spm/v1.10.18_sky130A` observed the run writing it,
      # which is what made the claim decidable rather than assumed.
      #
      # IT IS THIS STEP'S OWN ARTEFACT, not a cross-step attribution.
      # `phase1_expert_parse_track` is D1's own gate clause below, and
      # `phase1_expert_track_evidence_check._TRACK_REPORT_RELS` names exactly
      # this path FIRST ("canonical first"). Producer step == consumer step ==
      # D1, so declaring it charges nothing to a step that only reads it.
      #
      # BLAST RADIUS, measured with `flow_compliance_check.check_step` on each
      # of the 10 manifest run roots that resolve in this repository, with and
      # without this entry: **5 move, all VACUOUS_PASS -> MISSING**
      # (`phase1_parity/espi`, `ic/caravel_user_project`, `ic/sha256`,
      # `spm/v1.5.58_ihp-sg13g2`, `ic/subservient`) — the widest of #1215's
      # four, because D1 runs on every design while the other three are
      # phase-3 steps. All five are already FAIL overall before this change
      # (28, 23, 48, 25 and 40 FAIL/MISSING steps across the 63), so no root
      # the flow currently calls whole is reddened.
      #
      # HOW THAT NUMBER WAS GOT, because the first attempt got 0 and 0 was
      # wrong. `check_step` RUNS the step's gate, and this step's gate WRITES
      # this artefact — so measuring both arms against the same tree lets the
      # control arm manufacture the evidence the treatment arm is then
      # credited with. Each arm here is a fresh `copytree` of the run root,
      # discarded after one `check_step`. A/B over a shared tree is not an A/B
      # when the probe is also a producer.
      #
      # It RESOLVES in three admissible run roots
      # (caravel_user_project/v1.9.43_sky130A, spm/v1.9.96_gf180mcuD,
      # u_hawaii_adc/v1.9.86_sky130A), so declaring it closes the d7 finding
      # without opening a d3 one.
      - "reports/audit/phase1/expert_parse_track.json"
      # The extraction-pattern CATALOGUE this step's own gate reads (#1348).
      #
      # WHY IT REACHED W2 AND THE AST COULD NOT SEE IT — the same shape as the
      # entry above, one resolution limit further out. `phase1_doc_one_shot_
      # runner.py` binds `canonical = _pl.phase1_extraction_patterns_file(
      # project)` and then hands the VARIABLE to
      # `_seed_canonical_from_backfilled_subset(project, auto, canonical)`, so
      # no Python write POSITION in `programs/` names the literal path and the
      # AST oracle answered "no producer, externally supplied by design". The
      # write ledger of `benchmark-data/ic/spm/v1.10.18_sky130A` observed a run
      # writing it, which is what made the claim decidable rather than assumed.
      #
      # IT IS THIS STEP'S OWN ARTEFACT, not a cross-step attribution.
      # `extraction_coverage_check` is D1's own LL-38 gate and it LOADS this
      # file as the denominator of the coverage it reports
      # (`_load_explicit_patterns` -> `_pl.phase1_extraction_patterns_file`).
      # Producer step == consumer step == D1, so declaring it charges nothing
      # to a step that only reads it.
      #
      # THE FLOW ALREADY REQUIRED IT SOMEWHERE THE YAML DID NOT SAY SO.
      # `flow_compliance_check`'s completion audit already lists
      # `extraction_patterns.json` under `missing_required_artifacts` when it
      # is absent — pinned, in both directions, by
      # `test_flow_compliance_check.py::test_missing_required_hint_resolves_
      # phase1_layout` and `::test_missing_required_hint_flags_genuinely_
      # absent`. Declaring it here makes the yaml state an obligation the
      # checker was already enforcing; it does not create a new one.
      #
      # UNCONDITIONALLY PRODUCED — MEASURED, not assumed, because
      # `required_outputs` is unconditional and a conditional artefact must not
      # enter it. Of the 105 project trees in this repository that carry D1's
      # own `phase1/generated_docs/L1_DATASHEET.json`, **105** carry
      # `phase1/extraction_patterns.json`. 105 of 105, and the population
      # includes the four prompt-driven CVDP runs, which stage no `input/docs`
      # of their own and are the shape most likely to skip the seeder.
      #
      # BLAST RADIUS, measured with `flow_compliance_check.check_step` on each
      # of the 10 manifest run roots that resolve in this repository, with and
      # without this entry: **0 move.** Nine of the ten already carry the
      # artefact, so it cannot make them MISSING; the tenth
      # (`benchmark-data/ic/u_hawaii_adc`, a container directory) is already
      # MISSING in the control arm on other entries. Each arm is a fresh
      # `copytree` of the run root, discarded after ONE `check_step`, for the
      # reason stated above the previous entry: `check_step` RUNS the gate and
      # this step's gate WRITES, so A/B over a shared tree is not an A/B when
      # the probe is also a producer.
      #
      # It RESOLVES in nine admissible run roots, tracked at HEAD, non-empty
      # and not symlinked, so declaring it closes the d7 finding without
      # opening a d3 one.
      - "phase1/extraction_patterns.json"
    gate:
      all_of:
        - program_exit_zero: "phase1_all_l_docs_present_check ."
        # #312 — the SECOND track. Findings are advisory (a divergence between
        # the two tracks needs converging, not an automatic stop); running is
        # not. A missing/unparseable report exits 1 here, because a second
        # track that can quietly not run is the same as no second track.
        - program_exit_zero: "phase1_expert_parse_track ."
        # The CLAUSE that reads the two extraction-coverage entries moved here
        # from step 1 (#1219). Without it, moving the declaration alone would
        # only RELOCATE d4's "declared by no clause" finding from step 1 to D1.
        #
        # `phase1_coverage_report_present_check.py` shipped and was wired
        # NOWHERE — verified on a38902d1: the program exists and
        # `grep -c phase1_coverage_report_present_check` over this file returned
        # 0. That is the #725 shape this flow keeps finding.
        - program_exit_zero: "phase1_coverage_report_present_check ."
        # vibe-ic#693 — the forbidden-artefact rule from
        # `skills/analog-spec-extract/SKILL.md`: `analog/A0_skip_decision.json`
        # may not encode a top-level analog skip. Wired HERE, at the
        # UNCONDITIONAL Phase-1 step, and not at A1: every A-step carries
        # `condition: files_exist [phase1/analog/analog_block_list.json]`, so
        # an A-step placement would only ever judge projects that already
        # declared analog blocks. D1 has no `condition:` and runs on all 17
        # published roots — the whole population that could write the
        # forbidden artefact.
        #
        # POSITION IS LOAD-BEARING. `_evaluate_gate` short-circuits `all_of`
        # at the first failing sub-gate and re-runs only LATER entries that
        # are `advisory_program_exit_zero` — measured. Appended at the END of
        # this block the gate would execute ZERO times on any project whose
        # D1 was already red. Placed here, after the two existing blocking
        # sub-gates and before the advisories, it runs on 16 of 17 published
        # roots; the 17th (a rerun with no `generated_docs/` at all) is
        # already red on `phase1_all_l_docs_present_check`, a strictly deeper
        # cause.
        #
