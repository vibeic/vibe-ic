              -- MEASURED on an empty project root, `rom_init_lint: missing
              file: phase2/stage1/rtl/*.sv`, rc 2 -- which
              flow_compliance_check reads as a disclosed vacuity, so the step
              reports VACUOUS_PASS and not PASS.
        # Slow-corner arithmetic-architecture ADVISORY (a risk predictor from
        # RTL, not a proof). A wide single-cycle ripple add/accumulate/compare
        # chain closes at TT and blows SS, forcing a carry-save / carry-select /
        # pipelined rebuild — today discovered only after a full multi-corner
        # STA round trip. It declares `ENFORCEMENT: advisory` and was wired
        # NOWHERE; its only automatic caller was an MCP tool that nothing in
        # the flow invokes.
        #
        # The `advisory_program_exit_zero` slot RUNS it and RECORDS the verdict
        # and can never fail the step. `--strict` is present because that slot
        # judges by EXIT CODE ONLY: without it the program always exits 0 and
        # the compliance record reads the single word `ok` whether the design
        # has 0 findings or 85 — the disclosure would be discarded at the
        # moment of recording. rc=1 is the only channel that emits a FINDING
        # line, and it still cannot block. It is a sub-gate of `all_of` rather
        # than a sibling key, because `_evaluate_gate` returns inside the
        # blocking branch and an advisory beside a blocking key never runs.
        #
        # DISCLOSED FINDING COUNT, measured over all 40 published RTL roots
        # (every `phase2/stage1/rtl` under benchmark-data): 11 roots emit at
        # least one HIGH, 85 HIGH findings in total; 0 roots block, by
        # construction. WHAT WOULD MAKE IT BLOCKING, in order: a per-design
        # waiver channel (3 of the 11 are third-party vendor RTL the flow does
        # not author), then a re-measure, then a per-step promotion with the
        # new number stated.
        - advisory_program_exit_zero:
              command: "arith_ss_corner_risk_check --strict phase2/stage1/rtl --json reports/phase2/gates/arith_ss_corner_risk.json"
              advisory_reason: "NOT-YET-CLEAN: this gate CAN refuse and is wired advisory as a ratchet position, not as a verdict. Notch measured rc 0 on a real spm run (2026-08-31): it is already clean on real input, so blocking would cost nothing today; the only thing holding it advisory is that no other run has been measured."
        # RTL BUG DENSITY — the count half of this step's RTL-bug accounting.
        # `rtl_bug_report_schema_check` above grades the SHAPE of each claimed
        # RTL bug; nothing counted how many the candidate RTL actually needed.
        # The metric walks git log over this project's own RTL paths and counts
        # commits whose subject begins `fix:` / `bug:` / `hotfix:`, so the trend
        # across releases says whether spec-to-rtl is stabilising.
        #
        # ADVISORY, on the program's own written instruction: "This is an
        # ADVISORY tool -- it does NOT participate in flow_compliance verdicts."
        # A count is not a verdict and there is no threshold to block on.
        # rc 2 (project not in a git repo / no RTL) is the disclosed-skip tier
        # and records `n/a (input not present)`, never a clean result.
        #
        # `--no-learning-log` is load-bearing: without it the program appends a
        # row to `docs/design/BENCHMARK_PLUGIN_LEARNING.md` in the REPOSITORY
        # root, so a flow run would mutate a tracked doc outside the project it
        # is grading. No `--json` sink, so the clause declares no artefact.
        - advisory_program_exit_zero:
              command: "fresh_agent_rtl_bug_density_metric . --no-learning-log"
              advisory_reason: "NOT A GATE: this is a producer/classifier, not a predicate. Every exit path is 0 (produced) or 2 (no input), so there is nothing here that could refuse. It is wired in a gate slot and counted as gate coverage; move it to a step output."
        # D9 Phase 1 — every submodule L9 DECLARES exists as a `module` in the
        # RTL this flow generated, and is instantiated by something.
        #
        # WHY HERE AND NOT AT D1, where the other L-layer gates live: this one
        # needs BOTH sides. `collect_rtl()` resolves `phase2/stage1/rtl` (then
        # `rtl`, `asic_rtl`), which does not exist until Step 1 authors it. Wired
        # at D1 it would return `VACUOUS_PASS: L9 missing or carries no
        # submodules` on every project forever — measured, rc 0 — i.e. the
        # permanent `__VACUOUS_HINT__` this file warns about for `spec_review_lint`.
        # Step 2 is the first step whose gate block already reads
        # `phase2/stage1/rtl`, so it is the earliest step where the question is
        # answerable at all.
        #
        # BLAST RADIUS, re-measured on 2ec8fc2f with `tools/d9_corpus_baseline.py
        # --only l9_submodule_conformance_check`: 8 of 107 red, 3 CLEAN,
        # 96 NO-INPUT. Identical to the Phase-0 baseline.
        #
        # ADVISORY, and this one is a SPLIT VERDICT — all 8 reds were opened by
        # hand, not sampled:
        #   * 6 roots red because L9 declares a token that is NOT A MODULE and
        #     never could be: `signed` (edge_llm_accel — a Verilog RESERVED
        #     KEYWORD; `module signed` does not parse), `Checks` (an English
        #     word), `min_distance` (x3 spm variants), `k28p5_special_char` +
        #     `k27p7_special_char` (sgmii — 8b/10b comma characters, whose own
        #     L9 `type` field reads "SATA state literal (Bug 9 L9 picker)" and
        #     whose evidence is a PROSE LINE NUMBER). The finding is TRUE, but
        #     its label — SUBMODULE_FILE_MISSING — points at the RTL for a
        #     defect in the L9 EXTRACTOR. Blocking would tell an author to add
        #     `module signed`.
        #   * 1 REAL design-side gap: usb_pd. L9 declares `protocol_layer` and
        #     `policy_engine`, each with a spec-section citation; the generated
        #     RTL is a flat 694-line `chip_top` + `usb_pd_bmc_phy`. Filed.
        #   * 1 WRONG RULER: edge_llm_matmul_accel. Its 8 declared submodules
        #     carry NO evidence and NO confidence, and the RTL implements the
        #     same function under a different, valid decomposition (`mac_pe`
        #     instantiated, a generic `sram_sp` reused for the three memories).
        #     Demanding a literal name match against an un-evidenced
        #     decomposition is over-strict.
        # 1 of 8 reds being a demonstrable wrong ruler is on its own enough to
        # keep this out of the blocking slot.
        #
        # PROMOTION CONDITION: repair the L9 submodule extractor so a prose
        # token cannot become a declared submodule, decide whether the
        # decomposition is a CONTRACT or a SUGGESTION (layer-contract-doctrine),
        # then re-run the command above.
        #
        # WIRED BARE (no `--json`) DELIBERATELY. Measured: with `--json` this
        # program writes `{"verdict": "FAIL"}`, which Step 36's
        # `step_internal_fail_bubble_up_check` reads as an unacknowledged
        # step-internal FAIL. See the cascade recorded at Step 36.
        - advisory_program_exit_zero:
              command: "l9_submodule_conformance_check ."
              advisory_reason: "NOT-YET-CLEAN: this gate CAN refuse and is wired advisory as a ratchet position, not as a verdict. Notch measured rc 1 on a real spm run (2026-08-31): it REFUSES TODAY on real input; the advisory slot is currently swallowing a live finding. Promote to blocking once this run is clean. It reported: [SUBMODULE_FILE_MISSING] min_distance: L9 declares submodule 'min_distance' but no `module min_distance` declaration found under rtl/."
        # THE RTL WAS NEVER COMPARED TO THE SPEC. `spec_conformance_check`
        # exists, has existed, and appeared NOWHERE in this flow — measured on
        # 2026-08-26 by driving a 4-channel PWM with an SPI register interface
        # from `/vibe-ic-phase1` through `design_one_shot_runner`: the program
        # ran ZERO times, and the only other caller of it,
        # `phase2_verify_aggregate.py`, is likewise absent from this yaml. The
        # runner names it in two COMMENTS and calls it in neither.
        #
        # WHAT THAT COST, measured rather than argued. Two spec-violating
        # mutations were made to a correct RTL — the ID register changed from
        # the 0x2A that L4 declares to 0x2B, and the duty-shadow register
        # dropped so a mid-period write takes effect immediately, violating the
        # glitch-free-update requirement L2 states in as many words. Both
        # mutants produced gate verdicts IDENTICAL to the clean design across
        # all 26 steps that ran. Nothing in the flow could tell them apart.
        #
        # ADVISORY AND NOT BLOCKING, and the reason is a measurement, not
        # caution. Run over the five project trees in this account that carry
        # BOTH an L9 and an RTL directory: 1 PASS, 4 FAIL. Neither failure mode
        # is "the RTL is wrong" — `ibex_e2e_v1272` reports spec ports=47 vs rtl
        # ports=4 because no `--top` is supplied and the gate takes the first
        # module it finds, and `subservient_509r4verify` reports three
        # `RTL=8 vs spec=1` width mismatches because its L9 predates the
        # width-loss repair in this same change. Wiring it blocking today would
        # redden four of five designs over their SPEC's age and over an
        # argument this clause does not pass.
        #
        # WHAT THIS CLAUSE DOES NOT DO, stated here because the measurement
        # above invites the wrong conclusion. It compares PORTS — names,
        # directions, widths, reset polarity. Run against both mutants it
        # returns rc=0 on each, because neither is a port defect: one is a
        # register CONSTANT and one is a sequential BEHAVIOUR. Closing those
        # needs a functional testbench, and on this IC class all three TB
        # producers declined — `full_stack_tb_gen` emitted a connectivity-only
        # skeleton ("0 L3 opcodes driven"), `reference_tb` WAIVED on
        # `half_duplex_bus=False`, and `l10_unit_tb_gen` skipped on "L10 carries
        # 0 case(s)". That gap is NOT closed by this change and is not claimed
        # to be.
        #
        # ALSO NOT CLOSED: this clause is executed by `flow_compliance_check`,
        # which reads this file. `design_one_shot_runner` walks its own step
        # sequence and does not, so a `/vibe-ic-all` run still does not invoke
        # it — measured, 0 occurrences in the runner's log against
        # `GATE_RAN spec_conformance_check rc=0 PASS` in the compliance run.
        # The two paths are separate and only one of them reads this yaml.
        #
        # WHAT WOULD PROMOTE IT TO BLOCKING, so the next person does not have
        # to re-derive it: a `--top` that carries the runner's own top-name
        # rather than defaulting, and a re-measurement over the same five trees
        # after their L9s are regenerated. When that reads 5 of 5, this becomes
        # `program_exit_zero`.
        #
        # The `--json` sink is deliberately NOT in `required_outputs`:
        # `required_outputs` is UNCONDITIONAL and this clause is conditional on
        # an L9 existing, so declaring it would demand the file from a project
        # whose gate never ran. Steps 6 and 7 carry the same note for the same
        # reason.
        - advisory_program_exit_zero:
            command: "spec_conformance_check --rtl-dir phase2/stage1/rtl --spec phase1/generated_docs/L9_INTEGRATION_SPEC.json --json reports/phase2/gates/spec_conformance.json"
            advisory_reason: "NOT-YET-CLEAN: this gate CAN refuse and is wired advisory as a ratchet position, not as a verdict. Notch measured rc 0 on a real spm run (2026-08-31): it is already clean on real input, so blocking would cost nothing today; the only thing holding it advisory is that no other run has been measured."
            condition_files_exist:
              - "phase1/generated_docs/L9_INTEGRATION_SPEC.json"
            absent_condition_reason: >-
              no L9 integration spec was emitted, so there is no declared port
              contract to compare the RTL against; the comparison is not
              skipped for convenience, it has no left-hand side
        # CAN THIS INTERFACE BE BONDED OUT AT ALL (vibe-ic#1347).
        #
        # WHY HERE. The measured failure this program exists to end is an
        # arithmetic fact learned by BUILDING: five of nine benchmark ICs on
        # the chip path cannot be bonded out on any purchasable slot, and each
        # was discovered by running synthesis, placement and routing until it
        # hit a wall. Both inputs exist long before that wall — step 0.5ic
        # ingests the operator's slot files with their per-side pad lists, and
        # step 1 writes the RTL whose top-level port list is the other half.
        # This is the FIRST step where both are on disk, and it sits ahead of
        # synthesis (9), DFT (11) and the whole of PnR.
        #
        # WHY NOT 15.5ic, WHICH IS THE STEP ABOUT PADS. Because 15.5ic runs
        # after the floorplan, which is after synthesis — on the far side of
        # exactly the hours this gate exists to refuse to spend. A pad-ring
        # step is where a pin-out is BUILT; this is whether one can exist.
        #
        # BLOCKING, and the two non-fitting tiers are kept apart: rc 1 is
        # DOES_NOT_FIT, a real answer that fails the step; rc 2 is UNDECIDED —
        # no slots ingested (the cell/IP path, which has no operator and no
        # slot) or no top module found — which the flow reads as its disclosed
        # VACUOUS_PASS tier. A design that simply does not fit never reaches
        # rc 2, so a refusal can never be mistaken for a skip.
        #
        # WIRED WITH `--json`, unlike `l9_submodule_conformance_check` two
        # clauses up. That one is wired bare because its report declares
        # `verdict: FAIL`, which Step 36's `step_internal_fail_bubble_up_check`
        # reads as an unacknowledged step-internal FAIL. This program's verdict
        # vocabulary is FITS / FITS_AFTER_FOLD / DOES_NOT_FIT / UNDECIDED —
        # neither FAIL nor MISSING — so that cascade is not reachable and the
        # evidence artefact is kept.
        #
        # NO GLOB IN THIS CLAUSE, DELIBERATELY. `_resolve_program_cmd` expands
        # a clause glob into separate argv tokens, `--rtl` takes one, and the
        # rest land as extra positionals, which the program rejects.
        #
        # That rejection is now rc 3 and this runner reads an unsentinelled 3
        # as FAIL, so a glob here would break the step LOUDLY. It was not always
        # so: until the rc-3 tier was adopted (#712) the rejection was argparse's
        # default exit 2 — this flow's VACUOUS_PASS — and the gate would have
        # skipped on every multi-file design, indistinguishably from the honest
        # "no slots ingested" skip. The clause still carries no glob, because a
        # loud break is still a break; the program discovers
        # `phase2/stage1/rtl` itself instead. See `_discover_rtl`.
        - program_exit_zero: "slot_pad_budget_check . --json reports/phase2/gates/slot_pad_budget.json"
    # 0.5ic ingests the slot files whose pad lists are one of this gate's two
    # inputs. Without the edge the graph permits lint to run before the slot
    # geometry exists, and the gate would read "no slots" and disclose a skip
    # on a chip-path design that HAS an operator (D5-MISSING-EDGE, 2026-08-20).
    blocks_on: [1, 0.5ic]

  - id: 3
    name: "🔁 CDC / RDC check"
    stage: stage1
    # prose credits Step 2, but Step 2 declares no RTL output — the path it
    #  names is Step 1's.
    required_inputs:
      - from: 1
        path: "phase2/stage1/rtl/*.sv OR phase2/stage1/rtl/*.v"
    closed_loop:
      fallback_to: 1
      trigger: "CDC/RDC violation requires RTL change"
    # SKILLS: NONE. The AI half of this step was named and never built --
    # see `unbuilt_skills` in skills/_classification.json for the record and
    # the evidence. The names that used to sit here (cdc-check, rdc-check) ship
    # nowhere under skills/, so an agent told to invoke one cannot, and
    # hand-authors instead. The deterministic half below is what this step
    # actually has; declaring the gap is honest, an empty stub is not.
    programs:
      - cdc_crossing_check
      - cdc_async_input_check
      - clock_domain_reg_crossing_check
      - reset_dependency_check
    required_outputs:
      - "reports/phase2/cdc/crossing.json"
      - "reports/phase2/cdc/async_input.json"
      - "reports/phase2/cdc/reset_dep.json"
    gate:
      all_of:
        # v1.6.36 — gate-output JSON paths moved under reports/phase2/gates/
        # to avoid clobbering the runner-emitted canonical JSONs at
        # reports/phase2/cdc/{crossing,async_input,reset_dep}.json.
        # The substance check (cdc_crossing_check) reads the runner's
        # canonical JSON and confirms verdict=PASS + populated
        # crossings/async/reset fields.
        - program_exit_zero: "cdc_crossing_check . --json reports/phase2/gates/cdc_crossing.json"
        - program_exit_zero: "cdc_async_input_check . --json reports/phase2/gates/cdc_async_input.json"
        # RTL-level crossing screen. `cdc_crossing_check` above reads the CDC
        # REPORT and may accept a disclosed SKIPPED-CONDITION for a multi-clock
        # design; this one reads the RTL itself, so a multi-clock design can no
        # longer clear Step 3 with zero crossing analysis performed.
        - program_exit_zero: "clock_domain_reg_crossing_check . --json reports/phase2/gates/cdc_reg_crossing.json"
        - program_exit_zero: "reset_dependency_check . --json reports/phase2/gates/cdc_reset_dep.json"
    blocks_on: [1]

  - id: 4
    name: "🔁 Simulation (testbench-based + L10/L12 coverage + Verilator coverage)"
    stage: stage1
    required_inputs:
      - from: 1
        path: "phase2/stage1/rtl/*.sv OR phase2/stage1/rtl/*.v"
      - from: D1
        path: "phase1/generated_docs/L10_TEST_CASES.json"
      - from: D1
        path: "phase1/generated_docs/L12_BEHAVIORAL_SEQUENCES.json"
    closed_loop:
      fallback_to: 1
      trigger: "Test fail traceable to RTL"
    skills: [testbench-gen]
    mcp_tools: [eda_simulate, eda_professional_tb]
    programs:
      # 2026-07-11 — PROFESSIONAL testbench generator (deterministic, combines
      # cocotb + cocotb-coverage + Verilator/Icarus + an SVA bind). Derives a
      # complete, high-coverage TB directly from the L-docs: interface (L1/L9),
      # clock/reset (L8/L9), a reference model (closed-form for arithmetic
      # primitives; a bounded-latency + bit-order STREAMING scoreboard that
      # closes the serial-datapath DEFER, e.g. the spm bit-serial multiplier —
      # 208/208 vs (x*y) mod 2^N), functional coverage (L28 covergroups), and
      # SVA (L29). Emits under phase2/stage1/sim_professional/<top>/. Runs
      # BEFORE the L10 scaffolder so a class with a derivable reference gets a
      # real functional TB, not just a skeleton.
      - professional_tb_gen          # deterministic professional cocotb TB + coverage + SVA
      - professional_tb_check         # gate: the professional TB never silently
                                      # passes a real cocotb functional mismatch
      - testbench_gen                # scaffolds phase2/stage1/sim/tb/*.v from L10
      # The scaffolder above emits a PLACEHOLDER TB (prints a pass, DUT
      # instantiation commented out) that is MEANT to be replaced with real
      # stimulus. This gate fails the run when it never was — otherwise
      # functional verification is vacuous while every log reads PASS.
      # Discovery is DIRECTORY+STRUCTURE driven (portless module under the sim
      # tree), never a filename glob: the scaffolder names one TB per L10
      # scenario (case_3.v, corner_operand.v, rv32i_40.v), so `tb_*.v`/`*_tb.v`
      # patterns match none of them and a filename-driven audit sees 0 hits.
      - vacuous_testbench_check      # gate: a TB must actually drive the DUT
      # `coverage_closure` reports which measured coverage categories miss the
      # closure GOAL. It is wired ADVISORY in the `gate:` block below — being
      # named in this list executes nothing (nothing in the plugin reads
      # `programs:` to run it; flow_dashboard_data and
      # flow_step_executor_coverage_check only read the tokens).
      - coverage_closure              # gap analysis from coverage_actual.json
      # v0.53/v0.54 byte-level coverage gates (replace agent self-reports
      # of "≥ 95 % covered" with machine-measured numbers).
      - l10_tb_conformance_check     # every L10 test case must be
                                      # exercised by a real per-case oracle.
      # The executor writes reports/phase2/sim/l10_execution.json only after
      # running the unit TB population.  This gate consumes that record and
      # never infers a verdict from testbench text.  PASS, FAIL and
      # NOT_EXECUTED stay distinct; FAIL and NOT_EXECUTED both block Step 4.
      - l12_tb_coverage_check         # every L12 behavioural sequence must
                                      # have a matching sim/tb/tb_*.v
      - verilator_coverage_measure    # real verilator --coverage replaces
                                      # agent-estimated %. The `check`
                                      # subcommand is invoked by the gate
                                      # below; the MEASUREMENT is taken by
                                      # design_one_shot_runner.step_verilator_coverage,
                                      # which runs `measure-tb` — verilator
                                      # --binary --timing --coverage-line
                                      # --coverage-toggle over the project's
                                      # own testbench. It used to be left to
                                      # "the agent before this gate", which is
                                      # to say nobody ran it and no run in the
                                      # corpus ever carried a measurement.
    required_outputs:
      # ONE requirement — "a simulation ran and left a transcript" — in the
      # three shapes the supported TB paths actually emit, not three
      # independent requirements. A cocotb run writes results.xml/pass.flag and
      # no *.log; an iverilog/verilator transcript run writes *.log; the
      # professional TB (#171) writes under sim_professional/<top>/ and is the
      # path `_sim_files_superseded_by_professional_tb` exists to honour. Listed
      # as separate entries these were ALL-of-required, so every real run was
      # missing at least one and no run could satisfy them together.
      - "phase2/stage1/sim/*.log OR phase2/stage1/sim/results.xml OR phase2/stage1/sim/pass.flag OR phase2/stage1/sim_professional/**/results.xml"
      # DECLARATION — ONE PRODUCER PER PATH (the collision is untangled).
      # `coverage_actual.json` used to be written by TWO producers:
      # design_one_shot_runner, which writes a FUNCTIONAL-verification verdict
      # payload (verdict / evidence / verification_track / scenarios_covered,
      # with NO `totals` container), and `verilator_coverage_measure measure`,
      # which writes the line/toggle/branch measurement. On every real run the
      # functional payload landed there first, so the coverage gate correctly
      # reported that line/toggle/branch was never measured — the artefact at
      # the declared coverage path was somebody else's.
      #
      # The two now have their OWN paths, and each reader follows the artefact
      # it actually reads:
      #   coverage_actual.json     — functional verdict. Producers:
      #       design_one_shot_runner.step_emit_phase2_manifests, phase3
      #       step_canonicalize_artefacts (#609 re-emit). Reader:
      #       flow_compliance_check's coverage self-skip supersession.
      #   coverage_verilator.json  — the MEASUREMENT. Producer:
      #       design_one_shot_runner.step_verilator_coverage (which runs
      #       `verilator_coverage_measure measure-tb`). Readers: the gate
      #       below, coverage_closure, fpga_verification_audit --coverage.
      - "reports/phase2/coverage/coverage_actual.json"
      - "reports/phase2/coverage/coverage_verilator.json"
    gate:
      all_of:
        - files_exist: ["phase2/stage1/sim/results.xml", "phase2/stage1/sim/pass.flag"]
          any_of: true
        # vibe-ic#1975 — connectivity is CONNECTIVITY ONLY. The runner keeps
        # the reviewable CONNECTIVITY_PASS record + transcript pointer, but it
        # cannot release the functional-oracle requirement. A real professional
        # or oracle TB PASS makes this clause rc=0. A substantiated connectivity-
        # only run is INCOMPLETE/rc=1, just like a forged/broken record is rc=1;
        # there is no waiver-by-class. professional_tb_gen acts first, and an
        # unsupported design-specific reference hook is handed to the shipped
        # testbench-gen expert fallback before Step 4 can pass.
        - optional_program_exit_zero:
            command: "cpu_functional_oracle_waiver_check . --json reports/phase2/gates/cpu_functional_oracle_waiver.json"
            condition_files_exist: ["phase2/stage1/sim/results.xml"]
            absent_condition_reason: >-
              Scoped to a run that produced simulation results. This clause
              judges a connectivity record filed IN PLACE OF a functional
              result; with no phase2/stage1/sim/results.xml there is no
              connectivity-vs-functional claim to judge, and a forged one is
              impossible because there is nothing to forge it against. The
              absence of simulation evidence is step 4's own
              subject and is carried by the UNCONDITIONAL
              vacuous_testbench_check clause and the coverage clauses beside
              this one.
        # VACUOUS-TB gate. Unconditional: the program self-reports
        # NOT_APPLICABLE (exit 0) when there is no sim tree or no testbench in
        # it, so it can never raise a false FAIL — and, being unconditional, it
        # can never be silently skipped either. exit 1 = a testbench prints a
        # pass without driving the design (three independent detectors: the
        # scaffolder's placeholder marker, a commented-out DUT instantiation,
        # and a sim tree in which NOTHING is instantiated live). The JSON report
        # carries the offending file/line/text as cross-checkable evidence.
        - program_exit_zero: "vacuous_testbench_check . --json reports/phase2/gates/vacuous_testbench.json"
        # L10 tb-conformance: run only when L10_TEST_CASES.json exists.
        - optional_program_exit_zero:
            command: "l10_tb_conformance_check --l10 phase1/generated_docs/L10_TEST_CASES.json --tb-dir phase2/stage1/sim/tb --out reports/phase2/gates/l10_tb_conformance.json"
            condition_files_exist: ["phase1/generated_docs/L10_TEST_CASES.json"]
            absent_condition_reason: >-
              Scoped to a Phase-1 DECLARATION. This clause holds the testbench
              against the L10 test-case list; a design whose Phase 1 authored
              no L10_TEST_CASES.json has no declared case list to conform to.
              Whether L10 SHOULD have been authored is the D1
              layer-completeness gate's question, not this clause's.
        # L12 tb-coverage: run only when L12_BEHAVIORAL_SEQUENCES.json exists.
        # Agents pointing at a class template gain better candidate matching
        # via the optional --ic-class arg.
        - optional_program_exit_zero:
            command: "l12_tb_coverage_check . --json reports/phase2/gates/l12_tb_coverage.json"
            condition_files_exist: ["phase1/generated_docs/L12_BEHAVIORAL_SEQUENCES.json"]
            absent_condition_reason: >-
              Scoped to a Phase-1 DECLARATION. This clause measures testbench
              coverage against the L12 behavioural sequences; a design whose
              Phase 1 authored no L12_BEHAVIORAL_SEQUENCES.json has no
              declared sequence set to cover. Whether L12 SHOULD have been
              authored is the D1 layer-completeness gate's question.
        # Verilator coverage: UNCONDITIONAL (vibe-ic#220).
        #
        # This gate used to fire only when the project had already produced
        # coverage_actual.json — but an absent coverage_actual.json is the
        # defect, not the exemption. A run that measured no coverage at all
        # skipped the coverage gate and Step 4 reported nothing wrong, and
        # nothing else enforced it: `required_outputs` is ANY-of (check_step
        # marks MISSING only when NO pattern matched), so a bare
        # `phase2/stage1/sim/*.log` satisfied the step while the coverage
        # artefact was gone, and the only unconditional program in this gate is
        # vacuous_testbench_check, which judges TB-drives-DUT structure rather
        # than coverage.
        #
        # `verilator_coverage_measure check` reports on an absent or
        # untrustworthy artefact rather than staying silent, so running it
        # unconditionally converts an INVISIBLE skip into a DISCLOSED one, and
        # a below-threshold measurement still exits 1.
        #
        # COVERAGE-CREDIT SPLIT — that disclosure used to be rc=2 ->
        # VACUOUS_PASS for BOTH "no artefact" and "an artefact that is
        # not a coverage measurement",
        # and VACUOUS_PASS rolls into `pass_count`, so the step collected PASS
        # credit with no coverage behind it (MEASURED: the reference spm run
        # reported Step 4 VACUOUS-PASS off a functional-verdict payload). The
        # two meanings are now split:
        #   rc=1  the artefact at the declared path is corrupt / mislabelled /
        #         forged, OR no measurement exists on a host that HAS Verilator
        #   rc=3  no measurement AND no Verilator on PATH -> WAIVED-DEFERRED,
        #         a named `cap:verilator_coverage_toolchain` deferral that is
        #         review_required and NOT counted as executed-PASS
        # This is deliberately redder: on a host without Verilator this step
        # can no longer reach PASS.
        # POINTED AT THE MEASUREMENT, not at the other producer's payload.
        # The standard is unchanged — corrupt/mislabelled/forged is still rc=1,
        # below-threshold is still rc=1, and an absent measurement on a host
        # that HAS Verilator is still rc=1. What changed is that the artefact
        # at this path is now written by the coverage producer alone, so the
        # gate is reading the thing it audits.
        - program_exit_zero: "verilator_coverage_measure check --coverage-json reports/phase2/coverage/coverage_verilator.json"
        # ORPHANED, RE-HOMED (2026-08-25). The clause above MEASURES coverage;
        # this one asks whether the state TRANSITIONS the design declares were
        # each exercised, which a line/toggle percentage cannot answer. Its
        # input is coverage_actual.json, the FUNCTIONAL-verdict payload this
        # step's own design_one_shot_runner writes, so the producer is this
        # step and the condition is exact. (Before the one-producer-per-path
        # split above, that path also carried the line/toggle measurement; the
        # measurement has moved to coverage_verilator.json and this clause
        # keeps the functional payload it always read.)
        # The checker now has an executable applicability contract. A typed
        # L3 declaration of no opcodes returns DESIGN_DECLARED_NA and does not
        # deduct this step; any declared opcode without transition evidence is
        # a real refusal. Keep this blocking so a populated protocol cannot be
        # hidden by the historical advisory ratchet.
        - program_exit_zero: "functional_state_transition_coverage_check phase2/stage1/sim/tb --coverage reports/phase2/coverage/coverage_actual.json --json reports/phase2/gates/functional_state_transition_coverage.json"
        # NEW TB PATH gate — the professional cocotb TB (professional_tb_gen)
        # must never silently pass a real functional mismatch. UNCONDITIONAL
        # (vibe-ic#236, resolving the #220 known-open ownership question): the
        # producer is design_one_shot_runner.step_professional_tb_gen, which
        # ALWAYS writes reports/phase2/gates/professional_tb.json whenever it
        # runs — INCLUDING the failure case (functional_mismatch=true). So the
        # failure this gate exists to catch always materialises the trigger; the
        # old condition_files_exist could never disarm the gate on its actual
        # failure mode — an absent report means only that the step did not run
        # (correct scoping), never a lost mismatch. professional_tb_check
        # self-reports NOT_APPLICABLE (exit 0) on an absent report, so running
        # it UNCONDITIONALLY can never raise a false FAIL and — being
        # unconditional — can never be silently skipped either (same shape as
        # vacuous_testbench_check / verilator_coverage_measure above, which are
        # unconditional for exactly this reason: an invisible skip was never a
        # pass). exit 1 = a recorded functional_mismatch (real RTL bug ->
        # close-loop).
        - program_exit_zero: "professional_tb_check . --json reports/phase2/gates/professional_tb_check.json"
        # TWO ORPHANED SIMULATION-SIDE GATES, RE-HOMED (2026-08-25).
        #
        # `behavioral_evidence_per_spec_item_check` asks the question step 4
        # exists to answer and does not currently ask: does EVERY item the spec
        # declares have behavioural evidence behind it, rather than the suite
        # merely being green. It reads L9, which D1 emits.
        #
        # `dispatcher_awake_gate_check` is scoped to wake-required protocols
        # declared in L2/L9 and self-skips cleanly otherwise — measured on a
        # real project: `[PASS] (skip — no dispatcher)`. A clean self-skip is
        # what makes it safe here; it is advisory because a skip on every
        # project this tree has is also proof it has never been exercised
        # against a design that does declare one.
        # Same contract as the state-transition gate: an L9 with no declared
        # per-item behavioural population returns typed DESIGN_DECLARED_NA;
        # once L9 declares an item, missing evidence is a blocking failure.
        - program_exit_zero: "behavioral_evidence_per_spec_item_check . --json reports/phase2/gates/behavioral_evidence_per_spec_item.json"
        - advisory_program_exit_zero:
              command: "dispatcher_awake_gate_check ."
              advisory_reason: "NOT-YET-CLEAN: this gate CAN refuse and is wired advisory as a ratchet position, not as a verdict. Notch measured rc 0 on a real spm run (2026-08-31): it is already clean on real input, so blocking would cost nothing today; the only thing holding it advisory is that no other run has been measured."
        # ORPHANED, AND UNREACHABLE BY CONSTRUCTION until this change (2026-08-25).
        # `--clock-period-ns` was `required=True`, so the only caller that could
        # exist was one that had already computed a period — and none did. A
        # declarative clause can test whether a file exists; it cannot open one
        # and divide. The program now derives the period from L8 when the flag is
        # omitted, which is not a new source of truth:
        # `l8_sta_clock_period_design_owned_check` states L8 is "the ONLY
        # design-owned source of the STA clock period" and `sdc_gen` resolves it
        # the same way. Verified numerically both ways — clock_mhz 50 -> 20.0 ns,
        # clock_domains[] freq_mhz 125 -> 8.0 ns, explicit --clock-period-ns still
        # wins — and it REFUSES with rc=2 rather than guessing when the design
        # owns no period, because a turnaround budget against a fabricated clock
        # looks like a measurement and is not one.
        #
        # CONDITIONAL ON THE LAYER IT READS, and the condition is not
        # decoration. `audit_rtl_dir` opens `--l2-json` behind
        # `if l2_json.exists()` and falls through to `l2_data = {}` when it
        # does not — the three timing parameters then resolve to None,
        # `min_safe_cycles` becomes the -1 unknown sentinel, and every finding
        # is emitted against a budget that was never computed. Wired
        # unconditionally, a project with no L2 got a printed turnaround report
        # and an advisory `ok` over a comparison that did not happen. The other
        # ten clauses in this flow that name a `phase1/generated_docs/L*.json`
        # are each conditioned on that very file for this reason, and
        # `phase1_planned_consumer_starved_check` reads exactly that
        # declaration to decide whether a layer is PLANNED for a project: an
        # unconditional clause claims every project plans this read, so a
        # project with no L2 was recorded as a planned read of an ABSENT layer.
        - advisory_program_exit_zero:
            command: "protocol_turnaround_audit --rtl-dir phase2/stage1/rtl --l2-json phase1/generated_docs/L2_FRS.json"
            advisory_reason: "DEMOTED from optional_program_exit_zero in 0291e92f1 (2026-08-25): the optional slot REFUSES when its inputs are present, and an unmet condition there still denied the step its PASS tier (test_matrix_d8). Enforcement was traded for the tier, not for a reason about this gate."
            condition_files_exist:
              - "phase1/generated_docs/L2_FRS.json"
            absent_condition_reason: "The turnaround budget is computed from the L2 timing layer — delimiter_max, delimiter_detect_threshold and t_turnaround_min. A design whose Phase 1 emitted no L2 owns none of the three, and the program answers that by auditing the RTL against an unknown-sentinel budget rather than refusing, which reads as a measurement and is not one. Scoped to the runs that carry the layer."
        # vibe-ic#306 slot — ADVISORY coverage GAP ANALYSIS.
        #
        # `coverage_closure` has been declared in this step's `programs:` list
        # since v0.53 and NOTHING ever executed it: not a gate entry, not a
        # runner, not `_STRUCTURAL_RTL_GATES`. Being unreachable, its reader
        # also drifted off the artefact's real schema — it read
        # `coverage_pct`/`pct`, which the only producer of a MEASUREMENT at
        # that path (`verilator_coverage_measure measure`, totals.<cat>.pct)
        # never writes — so it FAILED a genuine 95/92/91 % artefact at "0%"
        # and PASSED a bare `{"coverage_pct": 95}` claim. Both directions are
        # fixed in the program.
        #
        # DENOMINATOR, so neither direction is oversold: over ALL 27 tracked
        # `coverage_actual.json` in benchmark-data, the FAIL-a-measurement
        # direction is witnessed 27/27 (all classify `foreign`; all gave
        # `0% < 80%` rc=1 before this change). The PASS-a-forgery direction is
        # witnessed 0/27 — not one carries a `coverage_pct`/`pct` key — so it
        # is fixture-only evidence, not a corpus finding.
        #
        # ADVISORY, not blocking, for a stated reason: the coverage FLOOR for
        # this step is `verilator_coverage_measure check` above, wired
        # unconditionally with its own thresholds and its own
        # capability-gap/defect split. A second, HIGHER threshold on the same
        # artefact wired blocking would fail the step twice for one root cause.
        # Wired advisory, the per-category gap is recorded and printed on every
        # run without changing what any run stops on.
        - advisory_program_exit_zero:
              command: "coverage_closure ."
              advisory_reason: "NOT-YET-CLEAN: this gate CAN refuse and is wired advisory as a ratchet position, not as a verdict. Notch measured rc 2 on a real spm run (2026-08-31): NOT CHECKED on that run — no input reached it, so the notch is unmeasured and this clause is not yet evidence of anything."
        # ORPHANED, RE-HOMED (2026-08-25). Step 4 owns simulation coverage,
        # and this asks whether each RTL module has a unit testbench at all —
        # the question `coverage_closure` above does not ask. ADVISORY: it has
        # never run on a real project from the flow, and its first run should
        # not be a landing's.
        - advisory_program_exit_zero:
              command: "rtl_unit_test_coverage_check ."
              advisory_reason: "NOT-YET-CLEAN: this gate CAN refuse and is wired advisory as a ratchet position, not as a verdict. Notch measured rc 0 on a real spm run (2026-08-31): it is already clean on real input, so blocking would cost nothing today; the only thing holding it advisory is that no other run has been measured."
    blocks_on: [2]

  - id: 5
    name: "🔁 Formal verification (assertions proved + bit-level full-stack phase2/stage1/tb)"
    stage: stage1
    required_inputs:
      - from: 1
        path: "phase2/stage1/rtl/*.sv OR phase2/stage1/rtl/*.v"
    closed_loop:
      fallback_to: 1
      trigger: "SVA assertion fail"
    # assertion-gen REMOVED: skills/_classification.json records it under
    # deprecated_skills (archived on purpose) and it shipped nowhere. Same
    # route v1.12.76 already corrected in ic_class_registry.json, for the
    # same reason. formal-verify ships and is this step's AI half.
    skills: [formal-verify]
    mcp_tools: [eda_formal]
    programs:
      - assertion_property_check
      # Program-first authoring floor: derives construction-safe reset
      # properties, enumerates every applicable L3/L6/L8 obligation, and writes
      # property_contract.json + an INCOMPLETE formal_authoring_request.json for
      # anything that still needs formal-verify. Silence is never inapplicable.
      - formal_harness_gen
      # Real SymbiYosys proof runner (chip-AGNOSTIC): emits the .sby, runs
      # `sby` in the container with the built-in ABC engines (abc pdr =
      # UNBOUNDED safety prove; abc bmc3 = disclosed BOUNDED functional BMC —
      # no external SMT solver needed), parses the transcript, and writes
      # formal/results.json + <top>_report.md. Fires when a formal harness
      # (phase2/stage1/formal/formal_<top>.sv, authored by the deterministic
      # floor / formal-verify) exists. Without a sound property the row is
      # INCOMPLETE with exact obligation IDs, never SKIPPED-CONDITION.
      # SUPPLEMENTARY datapath tier (--invariant-harness / a formal_<top>_
      # inductive.sv beside the standard one): a strengthened INDUCTIVE
      # INVARIANT over the internal datapath state lets `abc pdr` prove
      # product-correctness UNBOUNDED (the output-stream property alone is not
      # inductive). Written to a SEPARATE formal_<top>_inductive_results.json —
      # never clobbers the canonical results.json. An honesty guard forbids a
      # BMC being dressed as unbounded; a wide datapath that does not converge
      # is reported PARTIAL/bounded with the depth DISCLOSED (a genuine OSS
      # solver-reach limit — btormc/AMulet2 do not cross it for sequential
      # multipliers), never a fake full proof.
      - formal_property_run
      # v0.52 Rule D: a synth-able full-stack tb must drive the chip top
      # bit-by-bit through the single-wire pad before FPGA compile, so
      # bit-level integration bugs surface in sim (~30 s) instead of in
      # the 15-min Quartus + JTAG cycle.
      - bit_level_full_stack_tb_check
    required_outputs:
      - "phase2/stage1/formal/*.sby OR phase2/stage1/formal/formal_authoring_request.json OR phase2/stage1/formal/formal_not_applicable.json"
      - "phase2/stage1/formal/results.json OR phase2/stage1/formal/formal_authoring_request.json OR phase2/stage1/formal/formal_not_applicable.json"
      - "phase2/stage1/sim_full_stack/results.json"   # produced by Rule-D phase2/stage1/tb
    gate:
      all_of:
        - files_exist: ["phase2/stage1/formal/results.json"]
        # ORGANIC-20260606 #448 — all_proved is a CLAIM, not a proof:
        # the evidence-chain gate verifies an elaboratable .sby + a
        # SymbiYosys PASS transcript + a dereferenceable evidence
        # pointer before accepting it (replaces the bare
        # json_field_true field trust).
        - program_exit_zero: "formal_proof_evidence_check . --json reports/phase2/gates/formal_evidence.json"
        # Bit-level full-stack tb is mandatory before FPGA compile.
        # The check resolves the top module from L9 if present; the
        # tb file pattern is sim_full_stack/tb_<top>_full.v.
        - program_exit_zero: "bit_level_full_stack_tb_check . --json reports/phase2/gates/bit_level_full_stack.json"
        # DFT_FCC / 5-d1 — `assertion_property_check` was DECLARED in this
        # step's `programs:` list since v0.x but NOTHING ever invoked it:
        # a whole-tree grep found it in no runner, no gate and no MCP tool,
        # so the header's own contract ("when a step maps to a
        # deterministic program, use `program:` … all must succeed") was
        # broken by an orphan declaration. On the reference run
        # (spm × ihp-sg13g2) the program exits 1 —
        # {files_checked: 4, valid_files: 0, errors: 9} — while step 5
        # resolved to VACUOUS_PASS. Fixing the GATE (not the declaration)
        # is the honest half: the program encodes a check nothing else
        # performs, and its subject (does an assertion file actually
        # DECLARE and ASSERT a property, or is it a stub?) is real.
        # Wired UNCONDITIONALLY, not via condition_files_exist — the
        # conditional form is the invisible-skip antipattern this file
        # calls out elsewhere. A project with no assertion candidate exits 2
        # → VACUOUS_PASS at this sub-gate; the preceding evidence gate still
        # reports the Step-5 row INCOMPLETE unless L22 explicitly declared
        # formal inapplicable.
        - program_exit_zero: "assertion_property_check . --json reports/phase2/gates/assertion_property.json"
    blocks_on: [2]

  - id: 6
    name: "FPGA early prototype + verification report audit"
    stage: stage1
    required_inputs:
      - from: 1
        path: "phase2/stage1/rtl/*.sv OR phase2/stage1/rtl/*.v"
    # fpga-test-harness never shipped (see unbuilt_skills). The shipped skill
    # this step's own programs cite is fpga-led-probe-allocation -- the
    # `fpga_led_probe_lint` entry below says it "Enforces the four LED-probe
    # anti-patterns of skills/fpga-led-probe-allocation".
    skills: [fpga-led-probe-allocation]
    mcp_tools: [eda_synth]
    programs:
      # DECLARATION CORRECTION (2026-07-27). This entry used to read: "emit
      # the FPGA test-harness wrapper before Quartus picks it up.
      # `fpga_test_harness_gen` reads chip_top + L9 ports and writes fpga/*.sv
      # (top wrapper + pin map glue)." Every clause of that was false:
      #   * NOTHING runs it — not design_one_shot_runner's Step 6 (which only
      #     reads the fpga_compile status and writes quartus_map_audit.json),
      #     not phase3_one_shot_runner, not a gate entry, not an MCP tool.
      #     Being named in this `programs:` list executes nothing: the only
      #     readers of the list (flow_dashboard_data,
      #     flow_step_executor_coverage_check) inspect tokens, they do not
      #     invoke. So "before Quartus picks it up" describes an ordering that
      #     never happens.
      #   * it reads NEITHER chip_top NOR L9 — it takes a project path and
      #     writes a FIXED DE10-Lite template with a hardcoded `chip_top`
      #     instance (.clk/.reset_n/.id_bus/.state_reg_dbg) and a hardcoded
      #     GPIO_0[0]/KEY/LEDR pin assignment.
      #   * it writes ONE file, <rtl_dir>/fpga_test_harness.sv — not `fpga/*.sv`
      #     — and emits no pin-map glue.
      # It is an AGENT-INVOKED board bring-up helper (skill `fpga-test-harness`
      # above), registered here for discoverability, in the same shape as
      # `debug_first_pass` below. It is NOT wired, and must not be auto-wired
      # as-is: on a design whose top is not a `chip_top` with exactly those
      # four ports the emitted wrapper does not elaborate. (Measured on the
      # reference spm x ihp-sg13g2 run: phase2/stage1/rtl/ contains only
      # spm.v — there is no chip_top in the project at all.)
      - fpga_test_harness_gen
      # Wave 82 — `debug_first_pass` runs the deterministic first-pass
      # debug dispatcher when sim/HW disagree (called interactively by
      # the agent in step 6 fallback path; kept registered here for
      # discoverability + reachability).
      - debug_first_pass
      - quartus_map_audit
      # v0.53 audit: every pass-count + coverage-% claim in the
      # human-written FPGA verification report must be traceable to
      # a tool-generated artefact (sim summary + coverage_actual.json).
      - fpga_verification_audit
      # vibe-ic#693 — WIRED BELOW as `advisory_program_exit_zero`. Enforces the
      # four LED-probe anti-patterns of skills/fpga-led-probe-allocation. See
      # the gate leg for why it is advisory and what would make it blocking.
      - fpga_led_probe_lint
      # ORPHANED, RE-HOMED HERE, AND IT IS THE PRODUCER SIDE OF THE CLAUSE
      # ABOVE. `fpga_led_probe_lint` JUDGES an LED allocation that already
      # exists; `auto_diagnostic_led_synth` PROPOSES one for a wrapper whose
      # FSM has no LED at all — the case the lint is silent about, because a
      # state register nothing drives an LED from breaks none of the four
      # anti-patterns. Wired below as `advisory_program_exit_zero`.
      - auto_diagnostic_led_synth
    required_outputs:
      - "phase2/stage1/fpga/output_files/*.sof"
      - "phase2/stage1/fpga/output_files/*.map.rpt"
      - "reports/phase2/fpga/quartus_map_audit.json"
    gate:
      all_of:
        - files_exist: ["phase2/stage1/fpga/output_files/*.sof"]
        - files_exist: ["reports/phase2/fpga/quartus_map_audit.json"]
        # `quartus_map_audit` has been declared in this step's `programs:` list
        # since Wave 82, and NOTHING ever executed it. The audit JSON was
        # hand-written by design_one_shot_runner as
        # `"PASS" if fpga_compile.status == "PASS" else "SKIP"` — a verdict
        # restated from another step's status, on a *.map.rpt the scanner never
        # opened. Requiring only that the JSON EXISTS meant nothing on disk
        # could contradict it.
        #
        # Gate mode re-scans every *.map.rpt itself, so a hand-written
        # `audited: true, findings: []` cannot buy a PASS either. It exits 0
        # with a `no-build` disclosure when there is no .sof at all: this leg
        # audits a build, it never certifies that one happened — the .sof
        # requirement stays with the files_exist leg above and the #607/#663
        # board-absent capability-gap waiver, both unchanged.
        - program_exit_zero: "quartus_map_audit --project . --json reports/phase2/gates/quartus_map_audit.json"
        # fpga_verification_audit only fires when the human report exists;
        # not all projects ship one (FPGA-skip projects, sub-agent runs
        # without a board). Skips harmlessly via condition_files_exist.
        - optional_program_exit_zero:
            command: "fpga_verification_audit --report reports/fpga_verification_report.md --summary phase2/stage1/sim/work/summary.txt --coverage reports/phase2/coverage/coverage_verilator.json --out reports/phase2/gates/fpga_verification_audit.json"
            condition_files_exist: ["reports/fpga_verification_report.md"]
            absent_condition_reason: >-
              Scoped to a HUMAN deliverable on a hardware-bearing run. The
              audit judges the honesty of a hand-authored FPGA verification
              report; a headless doc-to-GDS run has no board and authors no
              such report. The board-absent case is carried elsewhere rather
              than here: --skip-hardware routes the FPGA-board steps to an
              explicit WAIVED with review_required at board bring-up, and step
              6 still hard-requires the .sof glob plus the unconditional
              quartus_map_audit clause.
        # ── vibe-ic#693 — `fpga_led_probe_lint`, wired for the first time ────
        #
        # WHAT IT ASSERTS. The four deterministic anti-patterns of
        # skills/fpga-led-probe-allocation/SKILL.md over the FPGA top RTL:
        # instantaneous-on-pulse, sticky-without-reset-clear,
        # mode-mix-without-table, and — the one no other wired gate covers —
        # per-BIT shared-pin-vs-QSF. (`fpga_port_qsf_consistency_check` IS
        # wired, in _STRUCTURAL_RTL_GATES, but it normalises bus indices to the
        # base name `LEDR`; measured on the corpus's only real FPGA top it does
        # not even reach that code, because `find_fpga_top` requires an `inout`
        # port and that top has none, so it prints "no FPGA top module found"
        # and exits 0. Per-bit LED allocation is covered by nothing.)
        #
        # WHY `advisory_`, NOT `optional_`. Two separate reasons, both measured
        # on the published sha256 run in its as-shipped state:
        #   1. `optional_program_exit_zero` NEVER EXECUTES here. `_evaluate_gate`
        #      short-circuits `all_of` on the first failing leg and re-runs ONLY
        #      `advisory_program_exit_zero` legs afterwards. Leg 1 is
        #      `files_exist: phase2/stage1/fpga/output_files/*.sof`, and ZERO
        #      .sof files exist anywhere in benchmark-data — the FPGA build has
        #      never run in the published corpus (28/28 run roots report
        #      quartus_map_audit verdict=SKIP). Wired as `optional_`, no
        #      reports/phase2/gates/fpga_led_probe_lint.json was written at all:
        #      a gate wired somewhere it never runs is the same defect moved.
        #      Wired as `advisory_`, it executes and writes its JSON.
        #   2. `optional_program_exit_zero` is BLOCKING — `_evaluate_gate`
        #      returns its `passed` verbatim into `all_of`. With a forged .sof
        #      + .map.rpt + audit JSON to reach the leg, step 6 went from
        #      WAIVED-DEFERRED to a hard FAIL. "Non-blocking" and that slot are
        #      incompatible; `advisory_` is the slot that records without
        #      blocking.
        #
        # BLAST RADIUS, MEASURED (28 published run roots: 16 under
        # benchmark-data/ic + 12 under benchmark-data/evaluation).
        #   executes on  1  — ic/sha256, the only run with a .qsf
        #   RED          0  — after the repairs in this change; it reports
        #                     1 WARNING (`test_done`, a held handshake level)
        #   silent      27  — condition_files_exist has no match, so the leg
        #                     returns without running: no vacuous PASS is
        #                     credited anywhere
        #
        # WHAT WOULD MAKE IT BLOCKING. A run where Quartus genuinely built (so
        # legs 1-3 pass and the step is not already WAIVED-DEFERRED), plus a
        # second FPGA top in the corpus to measure against. Today there is one.
        - advisory_program_exit_zero:
            command: "fpga_led_probe_lint phase2/stage1/fpga --qsf phase2/stage1/fpga/*.qsf --json reports/phase2/gates/fpga_led_probe_lint.json"
            advisory_reason: "NOT-YET-CLEAN: this gate CAN refuse and is wired advisory as a ratchet position, not as a verdict. Notch measured rc 2 on a real spm run (2026-08-31): NOT CHECKED on that run — no input reached it, so the notch is unmeasured and this clause is not yet evidence of anything."
            condition_files_exist: ["phase2/stage1/fpga/*.qsf"]
            absent_condition_reason: >-
              Scoped to a run that Quartus actually built: with no .qsf there
              is no FPGA top and no LED probe allocation to lint. MEASURED and
              stated in the skill that owns the lint: over the 28 published
              run roots this clause executes on 1 and is silent on 27, which
              is why the silence had to become a NAMED not-applicable rather
              than nothing at all. The clause RECORDS; it never blocks, so a
              design with a board is judged on the finding and one without is
              judged on nothing and says so.
        # ── `auto_diagnostic_led_synth`, wired for the first time ────────────
        #
        # THE QUESTION THIS STEP OWNS, AND THE HALF OF IT NOTHING ASKED. Step 6
        # is board bring-up: a .sof is programmed and the only visibility a
        # DE10-Lite-class board gives back is eight LEDs. `fpga_led_probe_lint`
        # (the clause above) judges an allocation that EXISTS against the four
        # anti-patterns of skills/fpga-led-probe-allocation. It has nothing to
        # say about a wrapper whose FSM drives NO LED — no instantaneous-on-
        # pulse, no sticky-without-clear, no mode mix, no shared pin. A stuck
        # FSM with every LED spare is clean by that lint and invisible on the
        # bench, which is the exact failure the LED probes exist to catch.
        #
        # This program scans the wrapper for FSM state registers and for LED
        # indices nothing already drives, and EMITS A PROPOSAL — a .patch plus
        # the rationale behind it. It never edits RTL.
        #
        # WHY `advisory_`, AND WHY IT COULD NOT BE ANYTHING ELSE. It is a
        # CODE-GEN HELPER, not a gate: its own contract is "exit 0 always
        # (advisory tool, never fails CI)", including the three no-proposal
        # outcomes (no wrapper found / no FSM state regs / no spare LED), each
        # of which prints its reason. A program that cannot reach a
        # content-earned failure must never occupy a blocking slot —
        # `program_exit_zero` and `optional_program_exit_zero` are both
        # BLOCKING (`_evaluate_gate` returns the latter's `passed` verbatim
        # into `all_of`), so wiring it there would install a permanently green
        # leg that reads like a check. `advisory_` is the slot that EXECUTES an
        # emitter and records what it produced without pretending to judge.
        #
        # THE OUTPUT IS NOT IN `required_outputs`, DELIBERATELY. Same footing
        # as the lint's `--json` above: the proposal is written only when there
        # is something to propose, nothing else in the flow reads it, and
        # `required_outputs` is UNCONDITIONAL — declaring a conditional emit
        # there would assert a production this clause's own condition denies.
        - advisory_program_exit_zero:
            command: "auto_diagnostic_led_synth . --out-dir reports/phase2/fpga/led_synth"
            advisory_reason: "NOT A GATE: this is a producer/classifier, not a predicate. Every exit path is 0 (produced) or 2 (no input), so there is nothing here that could refuse. It is wired in a gate slot and counted as gate coverage; move it to a step output."
            condition_files_exist: ["phase2/stage1/fpga/*.qsf"]
            absent_condition_reason: >-
              Scoped to the same population as the LED-probe lint beside it: a
              run Quartus actually built. With no .qsf there is no FPGA top,
              no board, and no LED budget to allocate, so a proposal would be
              advice about hardware this run does not have. The clause EMITS;
              it never blocks, so a run with a board gets the proposal and one
              without gets a NAMED not-applicable rather than silence.
    blocks_on: [2, 4, 5]

  - id: 7
    name: "Constraint setup (SDC + PVT matrix)"
    stage: stage2
    required_inputs:
      - from: D1
        path: "phase1/generated_docs/L8_TIMING_WAVEFORM.json"
      - from: 1
        path: "phase2/stage1/rtl/*.sv OR phase2/stage1/rtl/*.v"
    # SKILLS: NONE. The AI half of this step was named and never built --
    # see `unbuilt_skills` in skills/_classification.json for the record and
    # the evidence. The names that used to sit here (constraint-gen) ship
    # nowhere under skills/, so an agent told to invoke one cannot, and
    # hand-authors instead. The deterministic half below is what this step
    # actually has; declaring the gap is honest, an empty stub is not.
    required_outputs:
      - "phase2/stage2/constraints/*.sdc"
      - "phase2/stage2/constraints/pvt_matrix.json"
      # NOT DECLARED, and the clause below says why in its own words:
      # `l21_to_upf_emit` is "measured rc=2 SKIP whenever L21 declares no
      # power_domains". `required_outputs` is UNCONDITIONAL — the same rule
      # already written out at step 6 — so a design with no power intent would
      # be asked for a `.upf` nothing produced. The emit still writes
      # `phase2/stage2/constraints/<top>.upf` and still self-validates it; what
      # is refused is the unconditional CLAIM, not the artefact.
    gate:
      all_of:
        # ── ON-PASS REVIEW of stage1 ─────────────────────────────────
        # Declared on the stage (`stages[].on_pass_review`), DISPATCHED here:
        # the step that already carries `stage1_compliance .`.
        # `advisory_`, NOT `program_exit_zero`, and that is the whole point:
        # the block declares `verdict: advisory` and the program declares
        # `DECLARED_ENFORCEMENT = "advisory"`. The blocking slot would make a
        # rejection stop the step -- turning "unverified" into "blocking",
        # which #1253 refuses -- and would additionally read the program's
        # rc=2 NOT CHECKED as VACUOUS_PASS. The advisory slot RUNS it and
        # RECORDS the verdict without changing the step's tier.
        # THE VERDICT SOURCE, PRODUCED HERE AND READ ON THE NEXT LINE.
        # It used to be `--compliance reports/flow_compliance.json`, which
        # ONLY the flow's `final_gate:` block declares -- and NOTHING
        # EXECUTES `final_gate`. Both runners invoke this program without
        # `--json` (design_one_shot_runner._build_final_audit_cmd,
        # phase3_one_shot_runner), `--json` has no default, and even when a
        # caller does pass it the report is written AFTER the step loop that
        # hosts these clauses. MEASURED: the review returned rc=2 NOT CHECKED
        # -- "[Errno 2] No such file or directory" -- on every real run, which
        # is v1.13.42's outcome reached through a different door.
        # A scoped pass run as the clause BEFORE the review is a verdict
        # source with an executed producer AND a defined order: `_evaluate_gate`
        # walks `all_of` in sequence, so the report exists when the next
        # clause reads it.
        # `stage1_compliance` was ALREADY in this `all_of`, last, with no `--json`.
        # It is the same clause, moved to the front and asked to write what
        # it measured. Nothing new runs.
        - advisory_program_exit_zero:
              command: "stage1_compliance . --json reports/phase2/gates/stage1_compliance.json"
              advisory_reason: "NOT-YET-CLEAN: this gate CAN refuse and is wired advisory as a ratchet position, not as a verdict. Notch measured rc 0 on a real spm run (2026-08-31): it is already clean on real input, so blocking would cost nothing today; the only thing holding it advisory is that no other run has been measured."
        - advisory_program_exit_zero:
              command: "stage_on_pass_review . --stage stage1 --json reports/phase2/gates/stage1_on_pass_review.json --compliance reports/phase2/gates/stage1_compliance.json"
              advisory_reason: "DEMOTED, not designed advisory: wired blocking until da6fcd7fe (2026-08-30), moved here in the change that made the declared command actually execute; that push used --no-verify because the full tier did not stamp. Restore blocking once the six on-pass stage commands run green. Re-pointed at the per-stage compliance report in v1.13.78; notch re-measured rc 2 on that invocation, unchanged in class."
        - files_exist: ["phase2/stage2/constraints/*.sdc", "phase2/stage2/constraints/pvt_matrix.json"]
        - program_exit_zero: "sdc_syntax_check . --json reports/phase2/gates/sdc_syntax.json"
        # ORGANIC-20260606 #442 — pvt_matrix.json with corners=[] is not
        # a PVT matrix; single-corner must be disclosed, never presented
        # as multi-corner.
        - program_exit_zero: "pvt_matrix_check . --json reports/phase2/gates/pvt_matrix.json"
        # ORPHANED, RE-HOMED, AND IT CLOSES A LOOP THIS FLOW LEFT OPEN. Step
        # 33 carries the consumer — a UPF syntax gate scoped to
        # `phase2/stage2/constraints/*.upf` — and until this clause existed
        # nothing in the flow wrote that file, so the consumer's condition
        # could never be met on any project. Wiring the producer is what turns
        # a permanently-silent clause into one that can fire.
        #
        # Step 7 owns constraints, which is what power intent is. ADVISORY, not
        # optional: measured rc=2 SKIP whenever L21 declares no power_domains,
        # and an unmet `optional` condition denies the step its PASS tier. It
        # writes `phase2/stage2/constraints/<top>.upf` — NOT declared in this
        # step's `required_outputs`, for the reason written out there — and
        # self-validates the file it wrote.
        - advisory_program_exit_zero:
              command: "l21_to_upf_emit . --top chip_top"
              advisory_reason: "NOT-YET-CLEAN: this gate CAN refuse and is wired advisory as a ratchet position, not as a verdict. Notch measured rc 2 on a real spm run (2026-08-31): NOT CHECKED on that run — no input reached it, so the notch is unmeasured and this clause is not yet evidence of anything."
        # vibe-ic#762 — a staged hard macro's own Liberty may declare a
        # NON-SEQUENTIAL stability window (`timing_type : non_seq_hold_*`)
        # between two SIGNAL pins. Measured: a 9.00 ns address-around-strobe
        # requirement reached NOTHING until Step 20 reported it as
        # `HOLD_SLACK_NEGATIVE ... -8.68` — a verdict that points at the
        # router, while the repair is at the integration level and has to land
        # before synthesis (Step 9).
        #
        # POSITION. Step 7 is the FIRST step at which both halves of the
        # reconciliation exist: the macro Liberty is a staged INPUT, and Step
        # 7's `blocks_on: [1]` guarantees the design's own RTL + clock period
        # exist, so the finding can name the instantiated macro, the pin pair,
        # the window AND what the integration must do. Wired at D1 it would run
        # before any integration existed and could only restate the input.
        # Wired later than 7 it would land after synthesis, which is exactly
        # the round the gate exists to save. It is the LAST entry of this
        # `all_of` deliberately: `_evaluate_gate` re-runs advisory sub-gates
        # that follow a failed one, so the disclosure survives a red step.
        #
        # ADVISORY. The finding is a DISCLOSURE that a requirement is
        # unrecorded, not a proof that it is violated — proving violation early
        # needs a pre-synthesis structural trace from the constrained pin to
        # its driver's enable, which this gate does not do and must not pretend
        # to. BLAST RADIUS: 0 of 9 published roots — exactly three
        # design-staged macro Liberties exist in benchmark-data and none
        # declares a non_seq_* arc, so every published cell SKIPs.
        - advisory_program_exit_zero:
              command: "macro_non_seq_arc_contract_check . --json reports/phase2/gates/macro_non_seq_arcs.json"
              advisory_reason: "NOT-YET-CLEAN: this gate CAN refuse and is wired advisory as a ratchet position, not as a verdict. Notch measured rc 2 on a real spm run (2026-08-31): NOT CHECKED on that run — no input reached it, so the notch is unmeasured and this clause is not yet evidence of anything."
        # ── `stage1_compliance`, wired for the first time ────────────────────
        #
        # THE STAGE-1 EXIT QUESTION, ASKED AT THE STAGE BOUNDARY. Step 7 is the
        # FIRST stage-2 step, so its gate is the moment "Stage 1 is closed"
        # stops being someone's assumption and becomes a recorded answer. That
        # is the question this program was written for and it says so in its
        # own usage line: "run this after completing Steps 01-06 and before
        # starting Stage 2 synthesis". It had no caller, so the boundary it
        # names was never checked by anything.
        #
        # WHY NOT STEP 6, the last stage-1 step, which is the other candidate
        # for owning a stage-1 exit gate: `stage1_compliance` IS
        # `flow_compliance_check --stage 1 --strict`, and `--stage 1` evaluates
        # every stage-1 step's gate. Wired into a stage-1 step it would
        # re-enter itself without bound. Wired here it cannot: this step is
        # stage2, so the nested `--stage 1` pass filters it out and terminates.
        #
        # WHY `advisory_`, NOT `optional_`. `optional_program_exit_zero` is
        # BLOCKING — a finding there denies step 7 the pass tier, which would
        # make an incomplete Stage 1 fail the CONSTRAINTS step and send the
        # reader after the wrong artefact. The verdict belongs on the record,
        # not in step 7's tier. It writes no artefact, so nothing is added to
        # `required_outputs`.
    blocks_on: [1]

  - id: 8
    name: "🔁 SDC validation"
    stage: stage2
    required_inputs:
      - from: 7
        path: "phase2/stage2/constraints/*.sdc"
      - from: 7
        path: "phase2/stage2/constraints/pvt_matrix.json"
      - from: D1
        path: "phase1/generated_docs/L8_TIMING_WAVEFORM.json"
    closed_loop:
      fallback_to: 7
      trigger: "SDC syntax/semantic error"
    # SKILLS: NONE. The AI half of this step was named and never built --
    # see `unbuilt_skills` in skills/_classification.json for the record and
    # the evidence. The names that used to sit here (sdc-validator) ship
    # nowhere under skills/, so an agent told to invoke one cannot, and
    # hand-authors instead. The deterministic half below is what this step
    # actually has; declaring the gap is honest, an empty stub is not.
    programs:
      - sdc_syntax_check
      # Wave 82 — `sdc_validator_check` cross-checks the SDC against
      # L8_TIMING_WAVEFORM constraints; complements sdc_syntax_check
      # which only validates SDC syntax.
      - sdc_validator_check
      # flow v2.3.2 (review B-1) — register-divided / manually-gated
      # clocks must declare create_generated_clock in the SDC.
      - derived_clock_sdc_required_check
    required_outputs:
      - "reports/phase2/sdc_check.json"
    gate:
      all_of:
        - program_exit_zero: "sdc_syntax_check . --json reports/phase2/sdc_check.json"
        # v2.3 — exception-justification screen (advisory): every
        # false_path/multicycle must correlate with the design's own
        # CDC/L8 async evidence; wildcards + large multipliers flagged.
        - optional_program_exit_zero:
            command: "sdc_exception_correlation_check . --json reports/phase2/gates/sdc_exceptions.json"
            condition_files_exist: ["phase2/stage2/constraints"]
            absent_condition_reason: >-
              Scoped to the presence of a constraints directory: with no SDC
              there is no timing EXCEPTION to justify against the design's own
              CDC/L8 async evidence. A constraints-free run does not pass step
              8 through this silence -- MEASURED on an empty project root, the
              step's UNCONDITIONAL sdc_syntax_check clause exits rc 1 and
              FAILs the step.
        # sdc_validator_check fires only when L8 timing exists.
        # The positional is the PROJECT ROOT — the program resolves
        # `_path_layout.constraints_dir()` (= phase2/stage2/constraints) and
        # `fpga_early_dir()` itself, exactly as its own unit tests call it.
        # This gate used to pass `phase2/stage2/constraints`, so the effective
        # search root became phase2/stage2/constraints/phase2/stage2/constraints
        # — a directory that never exists. The program then reported
        # `[SKIP] no .sdc files` and exit 0 on EVERY project since v1.6.18, and
        # per flow_compliance_check the optional gate is only optional on its
        # TRIGGER: once triggered, rc 1 fails step 8's all_of. So this was a
        # BLOCKING gate that had been silently disarmed, not an advisory one.
        # Measured on the real spm x ihp-sg13g2 run: the yaml-literal form
        # SKIPped at rc=0 while the project-root form FAILed the same SDC.
        # The program now speaks the three-value contract — rc 2 (NOT CHECKED)
        # for every path that reads no file, which reaches this step as
        # VACUOUS-PASS rather than as a bare PASS indistinguishable from a
        # real read. Only rc 1 blocks.
        - optional_program_exit_zero:
            command: "sdc_validator_check . --l8 phase1/generated_docs/L8_TIMING_WAVEFORM.json --json reports/sdc_validator.json"
            condition_files_exist: ["phase1/generated_docs/L8_TIMING_WAVEFORM.json"]
            absent_condition_reason: >-
              Scoped to a Phase-1 DECLARATION: the clause validates the SDC
              against the L8 timing layer, and with no L8_TIMING_WAVEFORM.json
              there is no declared timing intent to validate against. Once the
              condition IS met this clause blocks -- rc 1 fails step 8's
              all_of -- and every path in the program that reads no file
              returns rc 2 (NOT CHECKED), which reaches the step as
              VACUOUS-PASS rather than as a bare PASS indistinguishable from a
              real read.
        # flow v2.3.2 (review B-1) — manual ICG / register-divided clocks
        # need a create_generated_clock in the SDC; otherwise STA
        # mis-reports every crossing path and CTS will not balance the
        # divider's tree. Vacuous PASS when no derived clock exists.
        - optional_program_exit_zero:
            command: "derived_clock_sdc_required_check phase2/stage1/rtl --sdc phase2/stage2/constraints --json reports/phase2/gates/derived_clock_sdc.json"
            condition_files_exist: ["phase2/stage1/rtl", "phase2/stage2/constraints"]
            absent_condition_reason: >-
              Scoped to a run that has RTL or constraints to compare: the
              clause asserts that a manual ICG or register-divided clock in
              the RTL has a matching create_generated_clock in the SDC, and
              with neither tree present there is no such pair to reconcile. A
              constraints-free run is already refused by the step's
              UNCONDITIONAL sdc_syntax_check clause (MEASURED rc 1 on an empty
              root).
    # `3` is a DATA dependency, not a stylistic one. `sdc_exception_correlation_check`
    # reads `reports/phase2/cdc/crossing.json` — step 3's declared required_output —
    # to build the known-async clock-pair set every `set_false_path` is justified
    # against. With `blocks_on: [7]` alone the closure was {7, 1, D1}: step 8 could
    # be marked done before step 3 ever ran, and on a RESUMED project the read then
    # picked up the PREVIOUS run's crossing.json and justified this run's exceptions
    # against last run's CDC evidence. Declaring the edge is what lets
    # `flow_step_execution_coverage_check` see the violation (a step-8 PASS whose
    # ancestor 3 is MISSING/FAIL is now an ordering violation, rc=1) instead of it
    # being invisible.
    blocks_on: [7, 3]

  - id: 9
    name: "Synthesis (Yosys → mapped netlist)"
    stage: stage2
    # THE AREA AXIS HAD NEITHER A COMPARISON NOR AN EDGE — it had no metric at
    # all. This step emitted `area.rpt` / `stats.json` and no step in the
    # canonical flow read the number; the four steps that dominate area (9, 12,
    # 17, 34) were all terminal.
    #
    # THE FALLBACK WAS 1 UNTIL THE ACTUATOR EXISTED, and the argument for it was
    # this, in full: "Step 9 IS the synthesis step, so re-synthesise is not an
    # upstream move for it — a self-edge here would re-run the same recipe on the
    # same input and spin."
    #
    # Every word of that was true when it was written and none of it is true now.
    # `phase3_one_shot_runner.step_synth` re-enters ITSELF on an area overflow at
    # `AREA_RETRY_PERIOD_RELAX`, which is NOT the same recipe; it re-measures
    # `chip_area` and adopts the result only when it is BOTH smaller than the
    # first attempt AND inside the budget (`area_retry_is_worth_adopting`); and it
    # cannot spin, because `period_relax != 1.0` is what stops the recursion, so
    # the loop is bounded at one by construction rather than by a counter.
    #
    # 1 WAS NEVER REACHABLE, and the runner already says so at the site, in the
    # only place that could know:
    #
    #     CLC-ACTUATION-NOT-FALLBACK-REENTRY: edge 9 falls back to step 1,
    #     but its actuator calls step_synth; expected one of [step_rtl_gen]
    #
    # with three measurements behind it — no RTL producer can see an area budget,
    # `step_rtl_gen` is deterministic so the same L docs give the same RTL, and
    # the one remediation path that can change a regeneration accepts only wiring
    # hints. Re-entering step 1 on an area overflow returns byte-identical RTL,
    # which the RTL repair loop already names `FAIL_RTL_REPAIR_INERT`.
    #
    # So this is not a new claim about what the flow could do. It is the
    # declaration catching up with what the flow HAS BEEN DOING, and the actuator
    # is the reason, not the trigger text — which is unchanged, and already names
    # the metric and the ceiling.
    #
    # See the gate clause below for what happens when no design declares one.
    closed_loop:
      fallback_to: 9
      trigger: "design__instance__area above the design's DECLARED ceiling (L19.die_area_budget_um); the structure has to change"
    # prose says lint/sim/formal-clean RTL; the RTL artefact is Step 1's.
    required_inputs:
      # #1982 — the area gate reads the typed design declaration directly to
      # distinguish an explicit NOT_APPLICABLE from an unset budget. A
      # design-extracted L19 ceiling is the alternate Phase-1 authority; neither
      # path is inferred from the synthesis measurement.
      - from: 0.5ic
        path: "input/submission_template/tapeout_declaration.json"
      - from: 1
        path: "phase2/stage1/rtl/*.sv OR phase2/stage1/rtl/*.v"
      - from: 7
        path: "phase2/stage2/constraints/*.sdc"
    skills: [synth-doctor]
    mcp_tools: [eda_synth]
    programs:
      # `synth_wrapper_gen` generates a synthesis wrapper for inout-port
      # designs (it splits each inout into in/out/oen nets so Yosys can map
      # them cleanly).
      #
      # NOT AUTO-INVOKED. This entry used to end "Run before Yosys", which
      # reads as a statement that something in the flow runs it. Nothing does:
      # `grep -rn synth_wrapper_gen` over the whole plugin outside tests/ hits
      # only this list, programs/INDEX.md, two docs tables and the program
      # itself. `phase3_one_shot_runner.step_synth` (the real Step-9 executor)
      # contains no reference to it, `design_one_shot_runner` none, and the
      # `eda_synth` MCP tool none. The program's own docstring named two
      # trigger keys — `L9.synth_wrapper_required` and `needs_synth_wrapper`
      # in ic_class_registry — that exist nowhere else in the tree; that claim
      # has been corrected in the program.
      #
      # So it is an OPERATOR-INVOKED helper: an inout-bearing design must run
      # `python3 programs/synth_wrapper_gen.py <project> --top <top>` by hand
      # before synthesis. `flow_step_executor_coverage_check` cannot catch
      # this — it classifies Step 9 as WIRED because the step's
      # required_outputs (netlist.v) do get produced, and it has no per-program
      # granularity. Wiring it automatically is a separate change and needs the
      # generator's own correctness fixed first (its emitted wrapper drives
      # every inout from the `_i` leg only and never connects the `_o`/`_oe`
      # legs it declares), so auto-running it today would inject a wrapper that
      # does not preserve the design.
      - synth_wrapper_gen
    required_outputs:
      # THE PRE-MAP ARM, and it is named as such deliberately (vibe-ic#984).
      # This step emits TWO netlists and this entry is the technology-GENERIC
      # one, kept for LEC/equivalence where the abstract gate view is wanted.
      # It is generic BY CONSTRUCTION: the phase-2 recipe is
      # `techmap; opt; dffunmap; abc -g cmos2` with NO Liberty loaded, and that
      # recipe cannot emit a standard cell.
      #
      # RE-MEASURED across every published run tree carrying this file
      # (16 discovered, 2026-08-11): all 16 netlist.v hold 100% generic Yosys
      # primitives and ZERO standard cells; the 9 trees that also carry the
      # mapped arm hold ZERO generic primitives and 100% standard cells there.
      # The split is total, not incidental.
      #
      # A dimension reading THIS entry is therefore making a statement about
      # the pre-map netlist ONLY. It is NOT a statement about the netlist that
      # PnR, area/stats and scan/ATPG consume — those bind the mapped arm named
      # below, which is why `synth_netlist_check` emits
      # AREA_ARTEFACT_DESCRIBES_ANOTHER_NETLIST rather than deciding for itself
      # which netlist step 9 should account for.
      - "phase2/stage2/synth/netlist.v"
      - "phase2/stage2/synth/area.rpt OR phase2/stage2/synth/stats.json"
      # THE MAPPED ARM — `<top>_synth.v` — is DELIBERATELY NOT DECLARED HERE,
      # and that is a measured decision, not an oversight (vibe-ic#984).
      #
      # It is a real, deliberate artefact: PnR and streamout consume it first,
      # `stats.json` records it as `"netlist"`, and `resolve_mapped_netlist`
      # switches scan/ATPG onto it because iverilog cannot elaborate `$_NAND_`
      # and the generic file yields zero fault sites.
      #
      # But it is written by PHASE 3's `step_synth`, not by this stage-2 step:
      # of the 16 published trees carrying netlist.v, the 9 carrying the mapped
      # arm ALL ran phase 3 and the 7 without it did not, with no exceptions.
      # `required_outputs` is ALL-of-N and its only any-of spelling is ` OR `
      # between paths, so an unconditional entry here cannot be satisfied by a
      # phase-2-only run. MEASURED on a published tree that PASSes step 9
      # today: deleting its mapped netlist to stand in for a converged
      # `--skip-phase3` run turns check_step from PASS into MISSING with the
      # entry declared, while the shipped declaration still returns PASS.
      # (Across the published corpus as it stands the change is inert — 0 of 16
      # trees move — because no phase-2-only tree PASSes step 9 today anyway.
      # The cost lands on future phase-2-only runs, not on the census.)
      #
      # WHAT WOULD CLOSE THIS: a conditional spelling for `required_outputs`
      # (per-entry `condition:`, which the grammar does not have today), or
      # splitting step 9's mapped half onto the phase-3 step that produces it.
      # Until one of those exists, the arms are LABELLED here rather than both
      # declared, so a dimension can state which netlist it measured — which is
      # what vibe-ic#984 asked for — without making a stage-2 step
      # unsatisfiable without phase 3.
    # Provenance required (2026-04-22): the netlist MUST appear as a
    # logged `yosys` output in provenance.jsonl with matching hash.
    # To satisfy, wrap Yosys like:
    #   provenance_logger.py --project . --tool yosys \
    #     --version-cmd "yosys -V" --output synth/netlist.v \
    #     -- yosys -s synth.ys
    gate:
      all_of:
        - files_exist: ["phase2/stage2/synth/netlist.v"]
        - program_exit_zero: "synth_netlist_check --netlist phase2/stage2/synth/netlist.v --json reports/phase2/synth_netlist.json"
        - program_exit_zero: "provenance_check . --output phase2/stage2/synth/netlist.v --tool yosys,yosys-abc --require-measured"
        # THE AREA FIGURE WAS NEVER COMPARED TO ANYTHING. The clauses above
        # establish that the netlist is a real synthesis product and that yosys
        # produced it; none of them reads the AREA the same invocation reported.
        # That is the identical shape `power_total_vs_budget_check` was written
        # for one axis over, and the ledger entry that names it —
        # ART-POWER-FIGURES-X1000, a 1000x rewrite of every power figure staying
        # green — applies verbatim to a 1000x area figure here.
        #
        # This clause carries the comparison: synthesised cell area against
        # L19's `die_area_budget_um`. The ONLY bound it applies is
        # utilisation <= 1.0, which is what the two quantities MEAN and not a
        # number anybody picked; it deliberately does NOT apply the 40-70% a
        # real floorplan targets, because no design in this corpus declares one.
        #
        # MEASURED over the published corpus (benchmark-data @ 146d665,
        # 2026-08-20): 177 L19 copies, ONE declaring `die_area_budget_um`, TWO
        # runs carrying a synth `chip_area`, and ZERO overlap between them. So
        # on today's corpus this clause REFUSES on every published run: it
        # prints `INCOMPLETE:` naming the authority it lacks and exits 2, which
        # `flow_compliance_check` records as VACUOUS_PASS — explicitly not a
        # clean result. Corpus blast radius: 0 PASS->FAIL, and every run that
        # PASSes step 9 today moves to VACUOUS_PASS, which is the honest verdict
        # for a step whose area was never compared to anything.
        #
        # It refuses in THREE distinguishable ways — no declared ceiling, no
        # readable area figure, and a figure whose producing artefact declines
        # to name its unit as um^2 (`stats.json` says "cell-library area unit",
        # deliberately). "I could not read it" and "I read it and it was fine"
        # must not produce the same artefact.
        - program_exit_zero: "area_total_vs_budget_check . --json reports/phase2/gates/area_budget.json"
        # EVERY CELL THE MAPPED NETLIST INSTANTIATES MUST EXIST IN THE STAGED
        # PDK'S LIBERTY. This is step 9's own question and no other step's: the
        # netlist is step 9's required output, and it is the last point before
        # PnR at which a cell from the wrong library can still be traced to the
        # synthesis that emitted it.
        #
        # IT IS NOT THE QUESTION `declared_pdk_is_the_pdk_used_check` (step 36)
        # ASKS, and the two are not substitutes. That gate compares the process
        # the design DECLARED against the libraries the tool LOGS name; this one
        # compares the cells the netlist actually CONTAINS against the cells the
        # staged liberty actually DEFINES. A log naming the right library while
        # the netlist carries a cell from somewhere else — a hand-edited netlist,
        # a merged macro, a library swapped between runs — is invisible to the
        # first and is exactly what the second reads.
        #
        # ADVISORY, and the reason is the program's argv rather than a
        # preference: `--pdk-lib` is REQUIRED and unmatched paths are WARNED and
        # skipped, so a run whose liberty is staged somewhere this pattern does
        # not reach would compare its cells against an EMPTY cell set and report
        # every one of them missing. `condition_files_exist` keeps it from
        # running on that zero denominator at all, and the advisory tier keeps
        # the remaining unknown — whether this pattern finds a project's whole
        # library — from deciding a landing until it has been measured across
        # the corpus.
        #
        # No `--json`: an advisory that writes an artefact would have to be
        # declared in `required_outputs`, and its finding would then cascade
        # into the report-reading gates as though it had been wired blocking.
        - advisory_program_exit_zero:
            command: "pdk_consistency_check --netlist phase2/stage2/synth/netlist.v --project-json input/project.json --pdk-lib input/pdk/liberty/*.lib"
            advisory_reason: "NOT-YET-CLEAN: this gate CAN refuse and is wired advisory as a ratchet position, not as a verdict. Notch measured rc 1 on a real spm run (2026-08-31): it REFUSES TODAY on real input; the advisory slot is currently swallowing a live finding. Promote to blocking once this run is clean. It reported: WARNING: Liberty file not found: input/pdk/liberty/*.lib"
            condition_files_exist: ["input/pdk/liberty/*.lib"]
            absent_condition_reason: "No liberty is staged under input/pdk/liberty/, so there is no cell set to compare the netlist against. Whether a run may reach synthesis with no staged PDK at all is `declared_pdk_is_the_pdk_used_check`'s question at step 36, and it is BLOCKING there; this clause would only be able to report every cell missing against an empty library, which is a zero-denominator FAIL this repo refuses."
    blocks_on: [0.5ic, 2, 3, 8]

  - id: 10
    name: "🔁 Pre-layout STA (multi-corner)"
    stage: stage2
    required_inputs:
      - from: 9
        path: "phase2/stage2/synth/netlist.v"
      - from: 7
        path: "phase2/stage2/constraints/*.sdc"
      - from: 7
        path: "phase2/stage2/constraints/pvt_matrix.json"
    closed_loop:
      fallback_to: 7
      trigger: "Setup violation; constraint or phase2/stage2/synth opt re-do"
    skills: [sta-review]
    mcp_tools: [eda_sta]
    required_outputs:
      - "phase3/stage3/sta/pre_pnr_timing.rpt"
      - "reports/phase3/sta/pre_pnr_summary.json"
    # DISCLOSED, deliberately NOT declared above: step 10 also emits
    # `phase3/stage3/sta/pre_pnr_power_preview.rpt` (present, 2321 B, on the
    # real spm x ihp-sg13g2 run). It is ADVISORY by construction —
    # phase3_one_shot_runner emits it inside a try/except only when the
    # container-backed OpenSTA `report_power` succeeds, and appends a note when
    # it does not ("Best-effort; never gates."). required_outputs is ALL-of-N,
    # so declaring it would report step 10 MISSING on every host where the
    # container is unavailable even though the two artefacts step 10 actually
    # signs off on are both present. Named here so that "what does step 10
    # produce" is answerable from this file, without asserting the step is
    # incomplete when an advisory preview is absent.
    gate:
      all_of:
        - files_exist: ["phase3/stage3/sta/pre_pnr_timing.rpt"]
        # `--mode` names an eda_report_audit report CLASS, not a directory.
        # This declared `--mode phase3/stage3/sta`, which is not one of the
        # seven choices (drc/lvs/power/em/ir_drop/sta/antenna) and would have
        # been an argparse error — it only ever "worked" because
        # `sta_report_check` rebuilt argv and threw the caller's flags away.
        # That same discard is why `reports/phase3/sta/pre_pnr_summary.json`
        # above — a required_output whose ONLY declared producer is this line
        # — was never written by anything, on any run.
        #
        # STEP-SCOPED, for the same reason and by the same mechanism as step
        # 21's router-DRC gate below. `eda_report_audit` discovers reports by
        # project-wide rglob with no relationship to the step asking, and STA
        # mode globs `*sta*.rpt`/`*timing*.rpt`/`*STA*.rpt`/`*timing*.log` —
        # which matches EVERY STA artefact the whole flow ever writes. The
        # `--under` seam that ends this landed with the DRC fix and was wired
        # for DRC only: before this change all 10 `--under` occurrences in this
        # file were DRC, and both STA call sites were project-wide.
        #
        # MEASURED, on the published run `benchmark-data/ic/sha256/
        # clean_run_v1427_20260715`: this PRE-LAYOUT gate discovered 13 files
        # and reported STA_REAL_VIOLATION_FOUND — sourced from
        # `phase3/stage3/sta/sta_mcorner_ocv.rpt` (step 23's sign-off corner
        # report, setup -67.61 ns), `sta_mcorner_ocv_postrepair.rpt` (step 32's
        # POST-REPAIR artefact) and `reports/phase3/aging_sta.rpt`. Step 10's own
        # declared report is clean. A pre-layout gate was being failed by a
        # post-repair artefact, and `pre_pnr_summary.json` and
        # `post_route_summary.json` came out BYTE-IDENTICAL because both gates
        # read the same 13 files. Scoped, this gate reads 2 (the declared
        # report and the `steps/10_*/` symlink to it) and rc goes 1 -> 0.
        #
        # The scope names the ONE artefact this step declares. The canonical
        # per-step mirror `steps/10_*/pre_pnr_timing.rpt` is a symlink to it and
        # `_in_scope` resolves before comparing, so it needs no second `--under`
        # (this is why files_found is 2, not 1). `pre_pnr_power_preview.rpt` is
        # deliberately out: it is advisory (see required_outputs above) and STA
        # mode excludes `power`-named reports anyway.
        #
        # BLAST RADIUS, measured over the 52 phase-3 roots under
        # `benchmark-data` (every directory carrying a `phase3/`, the same
        # enumeration shape step 21 used): 13 roots change this gate's rc.
        # 11 move 0 -> 1 and 2 move 1 -> 0.
        #   * The 11 are roots that carry NO `phase3/stage3/sta/
        #     pre_pnr_timing.rpt` at all and passed today on ANOTHER step's STA
        #     report. rc 1 with SCOPE_NOT_FOUND is the honest verdict, and it
        #     changes no step verdict: the `files_exist` clause immediately
        #     above already fails on the same absent file, so step 10 is
        #     already MISSING/FAIL on all 11.
        #   * The 2 are `benchmark-data/ic/sha256/clean_run_v142{2,7}_20260715`,
        #     whose step 10 moves FAIL -> PASS. That is the correct verdict and
        #     it launders nothing: their step 23 stays FAIL on the real corner
        #     violations (`post_route_signoff_corner_check` -8.830 / -1.710 ns,
        #     `sta_corner_record_completeness_check` -67.610 / -51.460 ns) and
        #     both runs stay `overall: FAIL`.
        #
        # SECOND SCOPE, `phase3/stage3/sta/per_corner`: this step is named
        # "Pre-layout STA (MULTI-CORNER)" and, unlike step 23 (which has
        # `post_route_signoff_corner_check` and
        # `sta_corner_record_completeness_check` below it), has no dedicated
        # corner gate at all — so this clause's own STA_SINGLE_CORNER_ONLY
        # advisory is its ONLY multi-corner statement. With the single-file
        # scope above, the step declared as its evidence a summary report that
        # by construction can never hold two corners, while the corner reports
        # it is COMPOSED FROM (`step_prelayout_signoff` writes per_corner/
        # first, then copies the setup-worst corner into pre_pnr_timing.rpt)
        # were outside the declared scope. MEASURED over the 54 tracked
        # phase-3 roots: all 7 that resolve a step-10 report emitted
        # STA_SINGLE_CORNER_ONLY, every one of them on `corner_dirs_found: 0`.
        # A warning that is always on is a warning nobody reads.
        #
        # This does NOT reintroduce what #778 removed. The scope admits only
        # this step's OWN pre-layout corner directory, and a corner report
        # inside it that discloses `STA_BASIS: POST_ROUTE_*` now FAILs the
        # clause (STA_BASIS_CONTRADICTS_SCOPE) rather than carrying it. Step
        # 23's scope is deliberately NOT widened the same way: its corner
        # responsibility already sits on the two dedicated gates, and adding
        # per_corner/ there would let a PRE-layout corner report's negative
        # slack fail the post-route clause — exactly the cross-step
        # contamination #778 exists to prevent.
        - program_exit_zero: "sta_report_check . --mode sta --under phase3/stage3/sta/pre_pnr_timing.rpt --under phase3/stage3/sta/per_corner --json reports/phase3/sta/pre_pnr_summary.json"
    blocks_on: [9]

  - id: 11
    name: "DFT insertion (scan chain + ATPG + at-speed + BSDL)"
    stage: stage2
    required_inputs:
      - from: 9
        path: "phase2/stage2/synth/netlist.v"
    # SKILLS: NONE. The AI half of this step was named and never built --
    # see `unbuilt_skills` in skills/_classification.json for the record and
    # the evidence. The names that used to sit here (dft-insert, atpg) ship
    # nowhere under skills/, so an agent told to invoke one cannot, and
    # hand-authors instead. The deterministic half below is what this step
    # actually has; declaring the gap is honest, an empty stub is not.
    mcp_tools: [eda_dft]
    programs:
      # Fault (cloudv-io/fault) for open-source stuck-at ATPG.
      # Integrated 2026-04-22 to eliminate the "no commercial ATPG" waiver
      # per LL feedback_plugin_usage_discipline.md.
      # 2026-07 DFT-depth raise to a foundry / ATE bar:
      #   * fault_atpg_run now defaults the stuck-at target to 95 % (foundry)
      #     and emits a transition (at-speed / launch-off-capture) fault-model
      #     record — a real number if the OSS engine can do it, otherwise an
      #     honest engine_limited note (never a fabricated transition number).
      #   * bsdl_emit emits a 1149.1 BSDL + boundary-scan-cell-per-pad plan
      #     for a padded design (bare core → honest N/A).
      #   * dft_signoff_check aggregates stuck-at + transition + BSDL.
      - fault_atpg_run
      - dft_atpg_coverage_check
      - bsdl_emit
      - dft_signoff_check
    required_outputs:
      - "phase2/stage2/dft/scan_netlist.v"
      - "phase2/stage2/dft/atpg_coverage.rpt"
      # PRODUCED BY STEP 11 BUT DELIBERATELY *NOT* DECLARED. Named here so
      # that "what does step 11 write" is answerable from this file without
      # any of these becoming a new way for the step to go red.
      #   * phase2/stage2/dft/tv.json — the ATPG test vectors (287 KB on the
      #     real spm x ihp-sg13g2 run). Declaring it was PROPOSED and is
      #     WITHDRAWN, on two independent grounds:
      #       (a) The stated basis — "satisfied by every run that satisfies
      #           the two entries above it" — is FALSE. tv.json is written by
      #           the ENGINE (`fault atpg -o /work/<tv>`), so it exists only
      #           if that subprocess succeeded. atpg_coverage.rpt and
      #           scan_netlist.v are written by fault_atpg_run.run_fault in
      #           PYTHON, AFTER that subprocess returns, with NO `if ec`
      #           guard (the only early return is the earlier `fault cut`
      #           failure). On the cut-ok / atpg-failed shape the two declared
      #           entries are present and tv.json is absent — exactly the new
      #           red the basis denied.
      #       (b) RETIRED BY DATA, recorded so the withdrawal is not read as
      #           resting on it. When written, no snapshot in benchmark-data/ic
      #           carried tv.json, scan_netlist.v or atpg_coverage.rpt, so the
      #           proposal had no evidence base (vibe-ic#439 — this repo does
      #           not build for a population of one, let alone zero). That is
      #           no longer true: caravel_user_project x sky130A now carries
      #           all three. The co-occurrence is NOT evidence for declaring
      #           tv.json — that snapshot is a SUCCESSFUL run, and (a) is about
      #           the failure path, which no passing artefact can speak to.
      #           Ground (a) alone carries the withdrawal.
      #     Declaring tv.json needs the producer's failure path handled first
      #     (write the two Python-side artefacts only when the engine ran, or
      #     declare all three together), not a declaration added on its own.
      #   * scan_netlist_prelim.v — exists ONLY on the disclosed-skip path
      #     (design_one_shot_runner renames scan_netlist.v to it when the
      #     engine measured nothing). MEASURED: on a successful step 11 the
      #     declaration resolves 5/5 today and 5/6 with prelim added, i.e. it
      #     would report every PASSING run MISSING.
      #   * cell_model_combined.v — a concatenated copy of the PDK's own
      #     stdcell + UDP models, a tool INPUT this step derives, not a result
      #     of it.
      #   * tv.json.raw_tv.json — an 18 MB engine-internal dump written by
      #     Fault itself; no code in this plugin reads or names it.
      - "phase2/stage2/dft/transition_atpg_plan.md"
      - "reports/phase2/dft/coverage.json"
      - "reports/phase2/dft/bsdl_plan.json"
      # vibe-ic#1241-adjacent (d7 W2): PRODUCED BY THE FLOW, READ BY THIS
      # STEP'S OWN GATE, DECLARED BY NOBODY. `dft_atpg_coverage_check` and
      # `fault_atpg_run` both write it and step 11's gate reads it, yet no
      # step's `required_outputs` named it — so d7 had a load-bearing artefact
      # with no declared producer.
      #
      # BLAST RADIUS, measured against the RIGHT population. "3 of 105 tracked
      # roots" is the wrong reading: 102 of those never ran phase2/stage2/dft
      # at all. Of the roots where step 11 ACTUALLY RAN — i.e. that carry its
      # five already-declared outputs — this artefact is present in 2 of 2.
      # The one root that reaches the stage directory without it,
      # `edge_llm_matmul_accel`, carries NONE of step 11's five declared
      # outputs either, so step 11 never ran there and it is not a
      # counter-example.
      #
      # It RESOLVES in an admissible run root (spm/v1.9.96_gf180mcuD, 28797 B)
      # and is recorded in the dimension-3 manifest, so declaring it closes the
      # d7 finding without opening a d3 one.
      - "phase2/stage2/dft/coverage.yml"
    # NOTE on invocation: flow-orchestrate/SKILL.md directs the agent to
    # invoke `fault_atpg_run` with the design's clock name and the
    # already-synthesised netlist. FOUNDRY BAR: stuck-at must reach the
    # foundry floor (95 %); an open-flow design that only reaches 55-75 %
    # (no real scan chain insertion) now FAILs honestly instead of passing
    # a lenient 80 % — this is the intended DFT-depth raise, not a defect.
    gate:
      all_of:
        - files_exist: ["phase2/stage2/dft/scan_netlist.v", "phase2/stage2/dft/atpg_coverage.rpt"]
        # Anti-fab: do NOT trust the self-produced `stuck_at_ge_target`
        # boolean. dft_atpg_coverage_check independently parses the real
        # measured stuck-at coverage % + target from coverage.json (both
        # the fault_atpg_run and runner/skill schemas) — falling back to
        # atpg_coverage.rpt — and recomputes measured >= max(written_target,
        # foundry_floor=95%). FAILs on measured < the foundry floor (e.g. the
        # sha256 0%-coverage no-scan-chain DESIGN_DEFICIT), on a fabricated
        # boolean that contradicts the recomputed number, and on
        # UNDISCLOSED absent/insufficient evidence (honest FAIL).
        # ONE disclosed exception, which this comment used to deny by saying
        # "never a vacuous pass": when there is no measurable coverage AND the
        # runner left a `phase2/stage2/dft/dft_atpg_not_run.json` sentinel
        # naming the capability gap, the program exits 2 / SKIPPED-CONDITION,
        # which this file's own `program_exit_zero` handler scores as
        # passed=True in the VACUOUS_PASS tier. Measured on the real
        # spm x ihp-sg13g2 run: all three step-11 gate programs return rc=2
        # there, not rc=1. Absence alone is still never enough — the producer
        # has to have disclosed it.
        - program_exit_zero: "dft_atpg_coverage_check . --json reports/phase2/dft/atpg_coverage_gate.json"
        # BSDL: emit + gate the boundary-scan-cell-per-pad plan. A padded
        # design (pad ring / inout pads) must ship a BSDL; a bare core is a
        # honest N/A (exit 0). A padded design that cannot be parsed FAILs.
        - program_exit_zero: "bsdl_emit . --json reports/phase2/dft/bsdl_plan.json"
        # Aggregate DFT sign-off (foundry bar): stuck-at >= floor AND
        # transition >= target (or DOCUMENTED engine-limited) AND BSDL
        # present for a padded design (bare core SKIP). UNDISCLOSED absent
        # evidence FAILs honestly (§4.05); an absence the producer disclosed
        # via the dft_atpg_not_run.json sentinel exits 2 / SKIPPED-CONDITION
        # — see the dft_atpg_coverage_check note above.
        - program_exit_zero: "dft_signoff_check . --json reports/phase2/dft/dft_signoff.json"
    blocks_on: [10]

  # v1.3.96 — FS1: ISO-26262 FMEDA diagnostic-coverage. A LETTERED step (not an
  # integer id — keeps the 1..44 contiguity intact) that is CONDITIONAL by
  # construction: the producer returns NOT_APPLICABLE (rc 0) for any design with
  # no declared safety mechanism, so it is inert on the non-safety majority and
  # only bites on ECC/parity/lockstep safety designs.
  #
  # THAT INERTNESS IS DISCLOSED, NOT SILENT. Both gate programs print a
  # LINE-START `VACUOUS_PASS:` token on their rc-0 inapplicability branches, so
  # the step resolves to the VACUOUS_PASS tier — its own label and its own
  # counter — instead of the plain PASS bucket. Before that token existed the
  # DEFAULT outcome for every non-safety chip was a bare PASS on an FMEDA that
  # measured nothing, indistinguishable from a design whose diagnostic coverage
  # had been graded against the ASIL floor.
  #
  # And inapplicability is now EARNED from RTL that was actually read: an
  # absent or source-free `--rtl-dir` exits 1, because "no safety mechanism
  # found" must not be inferred from an input nobody opened.
  - id: FS1
    name: "ISO-26262 FMEDA diagnostic-coverage (fault-injection; safety designs only)"
    stage: stage2
    # no flow.html prose exists for FS1. Resolved instead from this step's
    #  OWN gate command, which names its input verbatim:
    #  `fmeda_fault_injection_coverage . --rtl-dir phase2/stage1/rtl`.
    required_inputs:
      - from: 1
        path: "phase2/stage1/rtl/*.sv OR phase2/stage1/rtl/*.v"
    condition:
      files_exist: ["phase2/stage1/rtl"]
    programs:
      - fmeda_fault_injection_coverage
      - fmeda_coverage_check
    # NO required_outputs — DELIBERATE, and REOPENED 2026-07-28 with a sharper
    # reason than the one it carried. FS1 is the only step in this file whose
    # artefact's ONLY producer anywhere in the plugin is the FIRST command of
    # its own gate: `fmeda_fault_injection_coverage` is invoked here and nowhere
    # else (no runner calls it; `grep -rn fmeda_fault_injection_coverage
    # programs/` hits only the program itself and `fmeda_coverage_check`, which
    # imports it as a library).
    #
    # A declaration was attempted and WITHDRAWN, because the only thing that
    # made it appear to work was an auditor certifying its own output.
    # `flow_compliance_check` returns MISSING before the gate runs when every
    # declared entry is absent, so declaring these paths stops the gate — and
    # therefore the producer — from ever running: MEASURED on a fixture holding
    # only phase2/stage1/rtl, check_step returns MISSING "no required_outputs
    # found" and the tree still holds NO file under reports/ afterwards. The
    # withdrawn change suppressed that early return for this shape so the gate
    # would run and a post-gate probe would find the file. That probe can only
    # ever find a file THE AUDIT ITSELF JUST WROTE, and the suppression applied
    # to every step of the same shape, not to FS1: MEASURED on a copy of
    # benchmark-data/ic/ibex it turned step 8 (SDC validation) from a correct
    # MISSING into PASS on `reports/phase2/sdc_check.json` — a file 12 other
    # tracked roots really do carry and ibex does not.
    #
    # WHAT WOULD CLOSE THIS, exactly one thing: wire
    # `fmeda_fault_injection_coverage` into a runner — the same way
    # `phase3_one_shot_runner._DECLARED_SIGNOFF_GATES` (2026-07-27) wired the
    # four sign-off gates the flow declared and no runner ran — so the artefact
    # EXISTS BEFORE the audit looks. Then, and only then, declaring both paths
    # here measures the run instead of the auditor. Until that wiring lands the
    # entries would be satisfied by nobody but `flow_compliance_check`, which is
    # what the 7 tracked roots carrying `reports/phase2/safety/fmeda_coverage.json`
    # already are: every one holds the vacuous-skip verdict
    # `{"program": "fmeda_fault_injection_coverage", "verdict": "NOT_APPLICABLE"}`
    # — audit output committed as run evidence, not a fault-injection result.
    #
    # RE-MEASURED 2026-08-11 (vibe-ic#983 ruling 1 asked for exactly the
    # declaration withdrawn above). Every load-bearing fact still holds, so the
    # declaration is still NOT made:
    #   * PRODUCER: still exactly one. `fmeda_fault_injection_coverage` is
    #     reached only by this gate line; everything else that names it imports
    #     it as a library (`fmeda_coverage_check`,
    #     `result_md_audit_provenance_check`) or names it in prose/INDEX.
    #   * THE BREAKAGE, reproduced on this tree: two check_step runs on a fresh
    #     fixture holding only phase2/stage1/rtl. As shipped -> VACUOUS_PASS and
    #     the gate WRITES both JSON files. With both paths declared -> MISSING,
    #     "no required_outputs found", and the tree holds NO file under reports/
    #     afterwards. Declaring stops the gate, and the gate is the producer.
    #   * THE EVIDENCE, re-counted: 15 files across 8 published run trees, so
    #     #983's count is right. But 7 of the 8 `fmeda_coverage.json` still hold
    #     the vacuous NOT_APPLICABLE document; exactly ONE carries a real
    #     fault-injection roll-up (injected/detected counts, DC vs the ASIL
    #     floor) and its verdict is FAIL. A count of files is not a count of
    #     measurements.
    # #983's count held; its inference that "the step produces judgeable output"
    # did not — the AUDITOR produces it. Unchanged until the wiring above lands.
    gate:
      all_of:
        - program_exit_zero: "fmeda_fault_injection_coverage . --rtl-dir phase2/stage1/rtl --asil D --json reports/phase2/safety/fmeda_coverage.json"
        - program_exit_zero: "fmeda_coverage_check . --json reports/phase2/safety/fmeda_coverage_gate.json"
    blocks_on: [11]
    notes: |
      Real iverilog fault-injection: inject single stuck-at bit-flips on a
      declared safety mechanism's (ECC/parity) protected data path; measure
      diagnostic coverage DC = detected/injected vs the ASIL floor (default D).
      An independent gate RE-COMPUTES DC from raw counts to catch a fabricated
      verdict. Full FMEDA SPFM/LFM/PMHF roll-up needs a FIT/lambda reliability
      database (commercial/methodology input) -> ADVANCED_NODE_EXTENSION.md.

  # v1.3.97 — DT1: transition-delay-fault (at-speed LOC) ATPG. A LETTERED step
  # (keeps 1..44 contiguity) that CLOSES the "OSS has no delay-fault ATPG" gap:
  # a transition fault = a stuck-at on a 2-time-frame launch-on-capture unroll,
  # solved by vibeic/yosys `sat -prove` (real launch-capture 2-patterns). Self-
  # skips (NOT_APPLICABLE, rc 0) on a combinational / no-flop / no-scan-cut
  # design. HONEST scope: this is TDF LOGIC coverage (the transition is launched
  # + observed via SAT); true at-speed TIMING grading (path-delay-fault via
  # OpenSTA K-longest-path sensitization) is the deferred harder tier.
  - id: DT1
    name: "Transition-delay-fault (at-speed LOC) ATPG"
    stage: stage2
    condition:
      # ANY of these three, not just the cut netlist. Gating DT1 solely on its
      # INPUT meant that whenever the scan cut was missing the step vanished by
      # condition — no artefact, no gate, no row — which is indistinguishable
      # from a step that ran and self-skipped. The producer/runner now always
      # leaves either a coverage artefact or a not-run record saying why, and
      # either one is enough to reach the gate, so an unmeasured at-speed step
      # reports BLOCKED with its reason instead of disappearing.
      any_of: true
      files_exist: ["phase2/stage2/dft/cut_netlist.v",
                    "reports/phase2/dft/transition_coverage.json",
                    "phase2/stage2/dft/transition_atpg_not_run.json"]
    programs:
      - transition_fault_atpg_run
      - transition_coverage_check
    # DT1/DT2/DT3 declared NO required_outputs at all, so the artefact each
    # step exists to produce was invisible to every tool that enumerates a
    # step's evidence through this field (flow_dashboard_data._resolve_outputs
    # returns n_total=0 and falls back to the loose umbrella token scan used
    # for true umbrellas like P0; final_report_generate shows no artefact row).
    # The producer already NAMES this exact path — `atpg_disclose_not_run`
    # writes `skips_required_output: reports/phase2/dft/<x>_coverage.json` into
    # its not-run record — so the claim existed on the producer side with no
    # declaration to match it.
    #
    # ONE pattern, ONE branch, and deliberately NOT
    # `<coverage>.json OR <x>_atpg_not_run.json`. The OR spelling was tried
    # first and `flow_condition_reachability_check` rejected it, correctly, on
    # two counts:
    #   * R1 SELF-GATE — DT1's own condition names both branches, and `A OR B`
    #     is any-of at the branch level, so the not-run record would keep DT1
    #     green while the measurement it is conditioned on was gone.
    #   * FALSE T3 BACKSTOP — `_build_backstop_index` indexes every branch of a
    #     single pattern, so the OR made DT3's baselined self-disabling hole
    #     LOOK closed (transition/path_delay coverage "backstopped" by DT1/DT2
    #     going MISSING) when the record would in fact have satisfied the
    #     declaration and kept them green. With one branch the backstop is real
    #     and DT3's hole genuinely closes.
    # COST, measured and DELIBERATELY NOT REPAID: on the disclosed not-run path
    # the early required_outputs return fires before the gate, so the step
    # reports MISSING "no required_outputs found" instead of the gate's BLOCKED
    # verdict quoting the recorded reason — `_declared_sibling_self_skip_for_
    # missing` returns None here because it scans the MISSING path's directory
    # (reports/phase2/dft/) and the record lives under phase2/stage2/dft/.
    # Both outcomes are red and neither is a pass; the reason text is the price
    # of a real backstop.
    #
    # The obvious repair — mirror the record into reports/phase2/dft/ so the
    # promoter finds it — was TRIED and REVERTED. It does buy the reason text,
    # but the promoter's verdict is SKIPPED-CONDITION and `total_required`
    # SUBTRACTS SKIPPED-CONDITION, so DT1/DT2/DT3 left the executed-PASS
    # denominator and the flow verdict went FAIL -> PASS on a tree where all
    # three at-speed grades were missing. A step that did not run must not
    # become free by being disclosed twice. See
    # `phase3_one_shot_runner._ATPG_NOT_RUN_LEGACY_COLOCATED_REL`.
    required_outputs:
      - "reports/phase2/dft/transition_coverage.json"
    gate:
      # produce/validate split (mirrors Step 11): the RUNNER produces
      # transition_coverage.json (design_one_shot_runner, with the discovered
      # clock); the flow GATE only VALIDATES it (independent recompute).
      program_exit_zero: "transition_coverage_check . --json reports/phase2/dft/transition_coverage_gate.json"
    blocks_on: [11]
    notes: |
      Full-scan LOC transition ATPG: cut netlist (Step-11 `fault cut`) ->
      gate-levelise (`read_liberty -ignore_miss_func`) -> enumerate STR/STF
      faults -> explicit 3-instance 2-frame LOC miter -> Yosys `sat -prove`
      generates the launch-capture 2-pattern (UNSAT = redundant, not counted).
      The gate RE-COUNTS detected/redundant/aborted from the per-fault list so a
      redundant/aborted fault can never inflate coverage. Primary metric = ATPG
      test coverage = detected/(sampled - redundant); fault coverage also
      reported. At-speed timing grading -> step DT2.


  - id: 12
    name: "Post-DFT optimization (resynth / buffering)"
    stage: stage2
    required_inputs:
      - from: 11
        path: "phase2/stage2/dft/scan_netlist.v"
    # AUDIT NOTE (narrowed 2026-08-08, was "files_exist-only ON PURPOSE"): the
    # post-DFT netlist's FUNCTIONAL correctness is still verified at Step 13
    # (lec_equivalence_check: RTL == post-DFT netlist) — that half of the old
    # note still holds. But scan insertion is designed to be functionally
    # TRANSPARENT (scan mode is not exercised in mission-mode simulation), so
    # a post-DFT netlist whose scan chain was silently dropped is STILL
    # equivalent to the RTL — LEC has nothing to disagree with and would not
    # catch it. dft_post_optimization_scan_survival_check below closes
    # exactly that gap (empty file / pre-DFT netlist substituted / scan chain
    # vanished), and only that — it does not duplicate Step 13's functional
    # equivalence question.
    programs:
      - dft_post_optimization_scan_survival_check
    skills: [synth-doctor]
    required_outputs:
      - "phase2/stage2/synth/post_dft_netlist.v"
    gate:
      all_of:
        - files_exist: ["phase2/stage2/synth/post_dft_netlist.v"]
        - program_exit_zero: "dft_post_optimization_scan_survival_check . --json reports/phase2/gates/dft_post_optimization_scan_survival.json"
    blocks_on: [11]

  - id: 13
    name: "🔁 Equivalence check (RTL ≡ post-DFT netlist)"
    stage: stage2
    required_inputs:
      - from: 1
        path: "phase2/stage1/rtl/*.sv OR phase2/stage1/rtl/*.v"
      - from: 12
        path: "phase2/stage2/synth/post_dft_netlist.v"
    closed_loop:
      fallback_to: 9
      trigger: "Non-equivalence: phase2/stage2/synth or DFT changed netlist semantics"
    skills: [equivalence-check]
    programs:
      - lec_equivalence_check
    required_outputs:
      - "reports/lec.rpt"
      - "reports/lec.json"
    gate:
      program_exit_zero: "lec_equivalence_check . --json reports/lec_equivalence_check.json"
    blocks_on: [12]

  # ── Analog Design Pipeline (A1-A8) ─────────────────────────────
  # Runs in parallel with digital stages 1-2. All steps are conditional
  # on analog/analog_block_list.json existing (pure-digital ICs skip).
  # A7 (hardmacro) must complete before Step 14 (floorplan) so that
  # LEF abstracts are available for mixed-signal floorplanning.

  - id: A1
    name: "Analog Spec Extraction"
    stage: stage_analog
    required_inputs:
      - from: D1
        path: "phase1/generated_docs/L1_DATASHEET.json"
      - from: D1
        path: "phase1/generated_docs/L5_ADI_SPEC.json"
    skills: [analog-spec-extract]
    condition:
      files_exist: ["phase1/analog/analog_block_list.json"]
    # PATH: the canonical location comes FIRST because it is the only one any
    # producer writes. `analog_one_shot_runner` and `phase1_doc_one_shot_runner`
    # both write through `_path_layout.analog_dir()` = phase3/analog/, and
    # `analog_a1_spec_extract_check` reads phase3/analog/<block>/spec.json.
    # This entry used to declare ONLY phase1/analog/*/spec.json, a path nothing
    # writes; it appeared to work solely because `flow_compliance_check._glob_first`
    # carries a hidden phase{1,2,3}/analog → canonical remap. Tools without that
    # remap (flow_dashboard_data._resolve_spec) resolved the declared path to
    # "absent" on a run that had in fact produced the artefact. The legacy
    # phase1/ spelling is kept as an OR-alternative because
    # `migrate_to_layout_p` moves a project-root analog/ tree there.
    required_outputs:
      - "phase3/analog/*/spec.json OR phase1/analog/*/spec.json"
    gate:
      all_of:
        - files_exist: ["phase3/analog/*/spec.json OR phase1/analog/*/spec.json"]
        - program_exit_zero: "analog_a1_spec_extract_check . --json reports/analog/a1_spec.json"
    blocks_on: [D1]

  - id: A2
    name: "Analog Topology Selection"
    stage: stage_analog
    required_inputs:
      - from: A1
        path: "phase3/analog/*/spec.json OR phase1/analog/*/spec.json"
    skills: [analog-topology-select]
    condition:
      files_exist: ["phase1/analog/analog_block_list.json"]
    # PATH: canonical first — see the A1 note. The producer and
    # `analog_a2_topology_select_check` both use phase3/analog/<block>/.
    required_outputs:
      - "phase3/analog/*/topology.md OR phase2/analog/*/topology.md"
    gate:
      all_of:
        - files_exist: ["phase3/analog/*/topology.md OR phase2/analog/*/topology.md"]
        - program_exit_zero: "analog_a2_topology_select_check . --json reports/analog/a2_topology.json"
    blocks_on: [A1]

  - id: A3
    name: "Analog Netlist Generation"
    stage: stage_analog
    required_inputs:
      - from: A2
        path: "phase3/analog/*/topology.md OR phase2/analog/*/topology.md"
      - from: external
        check: none
        what: >-
          the PDK device models / tech decks (PDK_ROOT — outside the project
          tree)
    skills: [analog-netlist-gen]
    mcp_tools: [eda_xschem_netlist]
    condition:
      files_exist: ["phase1/analog/analog_block_list.json"]
    # PATH: canonical first — see the A1 note.
    required_outputs:
      - "phase3/analog/*/*.sp OR phase2/analog/*/*.sp"
    gate:
      all_of:
        - files_exist: ["phase3/analog/*/*.sp OR phase2/analog/*/*.sp"]
        - program_exit_zero: "analog_netlist_pdk_check . --json reports/phase2/gates/analog_netlist_pdk.json"
        # `analog_netlist_pdk_check` judges MODEL INCLUDES + BODY CONNECTIONS
        # by iterating device cards, so a `.subckt` shell with ZERO devices
        # gives it nothing to find and it emits NETLIST_PDK_OK. The A3
        # substance gate owns the complementary question — does the deck
        # instantiate a circuit at all, and does every DECLARED block have a
        # netlist — and it was never invoked by any step. Wire it here,
        # unconditionally: A3 must not be certifiable by a program that
        # measured nothing.
        - program_exit_zero: "analog_a3_netlist_gen_check . --json reports/analog/a3_netlist.json"
    blocks_on: [A2]

  - id: A4
    name: "Analog Corner Sweep (PVT)"
    stage: stage_analog
    required_inputs:
      - from: A3
        path: "phase3/analog/*/*.sp OR phase2/analog/*/*.sp"
      - from: A1
        path: "phase3/analog/*/spec.json OR phase1/analog/*/spec.json"
    skills: [analog-sizing-loop]
    mcp_tools: [eda_spice_corner]
    condition:
      files_exist: ["phase1/analog/analog_block_list.json"]
    # PATH: canonical first — see the A1 note.
    required_outputs:
      - "phase3/analog/*/corner_results.json OR phase2/analog/*/corner_results.json"
    gate:
      all_of:
        - files_exist: ["phase3/analog/*/corner_results.json OR phase2/analog/*/corner_results.json"]
        # v0.2.55 — use the HARDENED anti-stub A4 gate. The legacy
        # `analog_corner_sweep_check` exits 0 on a deterministic-stub
        # corner_results.json (no SPICE ran), which let the SOLE-
        # ACCEPTANCE gate report A4 PASS on fabricated corner data. The
        # `analog_a4_corner_sweep_check` enforces _provenance != stub
        # (real ngspice required), matching the analog runner's own
        # per-step gate. chip-AGNOSTIC.
        - program_exit_zero: "analog_a4_corner_sweep_check . --json reports/phase2/gates/analog_corner_sweep.json"
        # vibe-ic#693 — corner-lib realism. A corner sweep is only as
        # trustworthy as the device models it ran on; this lint catches a
        # deck that silently stands in an analytic LEVEL=1 MOSFET for the
        # foundry corner library, which is how a PVT sweep "passes" on a
        # process that was never modelled. Its unique coverage vs the gates
        # already wired: `analog_netlist_pdk_check` (A3) iterates DEVICE
        # cards, and a `.model` card is not a device instantiation, so a deck
        # that includes a real PDK lib AND inlines a LEVEL=1 override is
        # invisible to it — measured (netlist_pdk rc 0, this lint rc 1).
        #
        # ADVISORY, and that is not a softening — it is the only slot at A4
        # that FIRES. Measured with an instrumented copy on a fixture where
        # both gates FAIL: appended blocking at the end of this block it ran
        # 0 times (`_evaluate_gate` short-circuits `all_of`); inserted
        # blocking before the incumbent it ran once but ERASED the
        # incumbent's `A4_DESIGN_CONTENT_UNDECLARED` finding from the step's
        # reasons; advisory-last it ran once with BOTH findings visible.
        #
        # BLAST RADIUS: 0 red over the 5 in-scope published roots (2 PASS,
        # 1 WARN, 2 VACUOUS). The single WARN is a real finding on a run that
        # disclosed honestly — an open PDK with no public ngspice corner lib,
        # documented in the deck and repeated per-corner in the artefact.
        # WOULD BECOME BLOCKING when A4's incumbent gate is green on the
        # corpus (today it is red on both roots that carry corner data, for
        # an unrelated and fixable producer reason), so that a blocking
        # placement would actually execute.
        # These two sit ABOVE the realism lint deliberately. `_evaluate_gate`
        # re-runs only the advisory entries that come AFTER the sub-gate that
        # failed, and the lint has to stay LAST for its own wiring test; both
        # of these still follow every blocking sub-gate, so both are still
        # re-run. Order here is a re-run contract, not a preference.
        - advisory_program_exit_zero:
              command: "analog_adc_enob_corner_check . --json reports/analog/analog_adc_enob_corner_check.json"
              advisory_reason: "NOT-YET-CLEAN: this gate CAN refuse and is wired advisory as a ratchet position, not as a verdict. Notch measured rc 0 on a real spm run (2026-08-31): it is already clean on real input, so blocking would cost nothing today; the only thing holding it advisory is that no other run has been measured."
        - advisory_program_exit_zero:
              command: "analog_sigma_delta_gain_floor_check ."
              advisory_reason: "NOT-YET-CLEAN: this gate CAN refuse and is wired advisory as a ratchet position, not as a verdict. Notch measured rc 0 on a real spm run (2026-08-31): it is already clean on real input, so blocking would cost nothing today; the only thing holding it advisory is that no other run has been measured."
        - advisory_program_exit_zero:
              command: "analog_corner_lib_realism_lint ."
              advisory_reason: "NOT-YET-CLEAN: this gate CAN refuse and is wired advisory as a ratchet position, not as a verdict. Notch measured rc 2 on a real spm run (2026-08-31): NOT CHECKED on that run — no input reached it, so the notch is unmeasured and this clause is not yet evidence of anything."
        # THREE ORPHANED ANALOG GATES, RE-HOMED HERE (2026-08-25). Each was
        # authored with tests and then reachable from nothing — no flow clause,
        # no runner, no tools/ci line. A4 is the step that owns a PVT sweep, and
        # A4 already carries `condition: files_exist:
        # [phase1/analog/analog_block_list.json]`, so these run for an analog
        # design and are not reached at all for a digital one — which is the
        # honest scoping, not a silent skip.
        #
        # ADVISORY, not blocking, and the reason is measured rather than
        # cautious: run against a real completed project each returns [SKIP] or
        # VACUOUS_PASS because that project has no analog block list. That is
        # the correct answer and it is also proof that nothing here has been
        # exercised against a real analog corpus yet. A gate whose first
        # blocking run would be its first run at all is not something to put in
        # front of a landing; it reports until an analog design has answered it.
        # A FOURTH gate of this family is deliberately absent, and this
        # comment cannot name it: the test that keeps it out of the flow is a
        # raw substring scan of this whole file, so a comment naming it reads
        # as wiring. Its reason lives where a machine reads it instead —
        # `checker_execution_wiring_baseline.json`, whose triage entry states
        # which two of its rules are unreachable through the blocking gate
        # above. That is what `test_the_margin_gate_is_recorded_as_unwired_
        # with_a_reason` asserts, and this file's SILENCE is the other half.
    blocks_on: [A3]

  - id: A5
    name: "Analog Layout"
    stage: stage_analog
    # prose credits A4, but A4 declares corner_results.json — the netlist
    #  artefact is A3's.
    required_inputs:
      - from: A3
        path: "phase3/analog/*/*.sp OR phase2/analog/*/*.sp"
    skills: [analog-layout]
    mcp_tools: [eda_analog_layout]
    condition:
      files_exist: ["phase1/analog/analog_block_list.json"]
    required_outputs:
      - "phase3/analog/*/layout.mag OR phase3/analog/*/*.gds"
    gate:
      all_of:
        - files_exist: ["phase3/analog/*/layout.mag", "phase3/analog/*/*.gds"]
          any_of: true
        - program_exit_zero: "analog_a5_layout_check . --json reports/analog/a5_layout.json"
    blocks_on: [A4]
    notes: |
      RESOLVED (was: KNOWN UNRESOLVED COUPLING). Resolution (a) of the two
      options previously recorded here was taken; the record is kept so the
      decision is auditable rather than silent.

      THE CYCLE. `analog_a5_layout_check` used to ALSO require
      `phase3/analog/<block>/drc_clean.flag` and `lvs_match.flag`
      (A5_DRC_FLAG_MISSING / A5_LVS_FLAG_MISSING). Those two files are A6's
      OWN declared required_outputs and A6 declares `blocks_on: [A5]`, so the
      declared ordering ran A6 -> A5 while the real read ran A5 -> A6. No
      `blocks_on` value can express that: `blocks_on: [A4, A6]` is a literal
      cycle.

      WHICH SIDE WAS WRONG, AND HOW IT WAS DECIDED — not by preference:
        * A6 cannot run without A5's artefact. `analog_a6_block_pv_check`
          emits `A6_PV_BLOCK_DIR_MISSING` ("A5 layout did not run for this
          block"); DRC and LVS are run ON the layout. A5 -> A6 is the DATA
          dependency.
        * A5 does not need PV evidence to PRODUCE a layout. The flag reads
          were a verification-SCOPE choice, not a data need.
        * The flags are physically written by the A6 STEP:
          `analog_one_shot_runner._emit_deterministic_stub` writes
          `layout.mag` under `step_name == "A5_layout"` and both flags under
          `"A6_block_pv"`, and the runner executes A5 before A6. With the flag
          rules in place A5 reported FAIL on every correct single-pass run,
          for a condition A5 itself cannot satisfy — a false red.

      WHAT MOVED, AND WHY NO DEFECT CLASS WAS LOST. The PV verdict is now
      A6's alone, over A6's own richer evidence (drc.report / *.lyrdb /
      drc.rpt / comp.json / lvs.report before the flags), which rejects a
      bare or verdict-less flag and FAILs — never SKIPs — on a block dir with
      no evidence. Every input A5 used to reject is re-run through the A6
      gate and asserted rc=1 in
      `programs/tests/test_analog_a5_layout_check.py`, section
      "A5 -> A6 PV OWNERSHIP".

      ONE PRECONDITION HAD TO BE FIXED FIRST. `analog_a6_block_pv_check`
      probed only `phase3/analog/` and the legacy `analog/` for the block
      list, NOT `phase1/analog/` — the root THIS STEP'S OWN `condition`
      names. On a project carrying the block list only there, A6 returned
      `SKIP (no analog blocks)` with rc=2, which `flow_compliance_check`
      credits as VACUOUS_PASS, while A5's flag rules were still catching the
      gap. That reader now probes the same roots as the shared
      `_analog_a_check_common.block_list_path`, so the move does not open a
      hole. Do NOT re-add the flag rules to A5.

  # ── A6 DECLARATION ORDER (d5) ──────────────────────────────────
  # A6 is declared HERE, between A5 and A7, because A7 declares
  # `blocks_on: [A6]`. A6's block used to sit after step 39 (declaration
  # index 52 against A7's 23), which made it the flow's ONLY forward edge:
  # `flow_compliance_check` evaluates steps in canonical declaration order
  # (:7046-7055) and its #503 cascade attribution walks each TRACK in that
  # same order taking the first FAIL as the cut point (:6672-6690), so an A6
  # FAIL was positioned AFTER A7 and could never be attributed as A7's root
  # cause — A7 reported an independent gap instead of a downstream
  # consequence. Nothing about A6 changed; only where it is declared. Keep
  # any new A-track step in dependency order for the same reason.
  - id: A6
    name: "Analog Physical Verification (per-block DRC + LVS before merge)"
    stage: stage_analog
    required_inputs:
      - from: A5
        path: "phase3/analog/*/layout.mag OR phase3/analog/*/*.gds"
    condition:
      files_exist: ["phase1/analog/analog_block_list.json"]
    skills: [drc-fix, lvs-triage]
    programs:
      - analog_a6_block_pv_check
    # EVIDENCE: these entries must name every artefact the A6 gate accepts,
    # because `flow_compliance_check.check_step` treats required_outputs as a
    # CHEAP PRE-CHECK and returns MISSING **without ever running the gate**
    # when no entry resolves. `analog_a6_block_pv_check` treats the DRC/LVS
    # REPORTS as its primary evidence (drc.report / *.lyrdb / drc.rpt;
    # comp.json / lvs.report / lvs.rpt) and the .flag files as a lesser
    # fallback that must itself carry a count/verdict line. Measured on a
    # synthetic block carrying only drc.report ("Total DRC violations: 0") and
    # lvs.report ("LVS match: true"): the gate ran standalone and returned
    # PASS (rc=0, "1/1 block(s) DRC-0 + LVS-match") while check_step returned
    # MISSING and never invoked it. Each entry below is one artefact with
    # several accepted names, so this widens what SATISFIES A6, never what
    # the gate accepts — the substantive verdict is still the program's.
    required_outputs:
      - "phase3/analog/*/drc_clean.flag OR phase3/analog/*/drc.report OR phase3/analog/*/*.lyrdb OR phase3/analog/*/drc.rpt"
      - "phase3/analog/*/lvs_match.flag OR phase3/analog/*/lvs.report OR phase3/analog/*/comp.json OR phase3/analog/*/lvs.rpt"
    gate:
      program_exit_zero: "analog_a6_block_pv_check . --json reports/phase2/gates/analog_block_pv.json"
    blocks_on: [A5]
    notes: |
      Each analog block must have DRC-clean + LVS-match BEFORE A7
      post-layout resim runs. Catches per-block layout errors that
      top-level PV (Step 31) would otherwise mask via merge.

  - id: A7
    name: "🔁 Post-Layout Resimulation"
    stage: stage_analog
    # prose credits A5 / A6; A6 declares the clean FLAGS, the layout
    #  artefact is A5's.
    required_inputs:
      - from: A5
        path: "phase3/analog/*/layout.mag OR phase3/analog/*/*.gds"
    closed_loop:
      fallback_to: A3
      trigger: "Performance degradation > 10% post-extraction"
    skills: [analog-extraction-resim]
    mcp_tools: [eda_spice_corner]
    condition:
      files_exist: ["phase1/analog/analog_block_list.json"]
    required_outputs:
      - "phase3/analog/*/pre_vs_post.json"
    gate:
      all_of:
        - files_exist: ["phase3/analog/*/pre_vs_post.json"]
        - program_exit_zero: "analog_pre_vs_post_layout_check . --json reports/phase2/gates/pre_vs_post.json"
    blocks_on: [A6]

  - id: A8
    name: "Hardmacro Generation (LEF + Liberty + GDS + Verilog)"
    stage: stage_analog
    skills: [analog-hardmacro-gen]
    condition:
      files_exist: ["phase1/analog/analog_block_list.json"]
    programs:
      # A8-d3 — the GDS PRODUCER was missing from this step and from every
      # runner. Of A8's four declared required_outputs the .lef/.lib/.v are
      # emitted by the `analog-hardmacro-gen` skill (and by the
      # deterministic-stub tier in analog_one_shot_runner); the .gds was
      # emitted by NOTHING. `magic_port_extract_emit.build_gds_write_tcl()`
      # — the deterministic `load / select top cell / gds write` template —
      # has shipped since v0.1.114 and was referenced only by its own unit
      # test and by the skill's prose: no gate, no runner and no MCP tool
      # ever called it. So A8 declared a physical layout it never produced,
      # and M1 — whose merge globs phase3/analog/hardmacro/**/*.gds — could
      # never find one.
      #
      # DECLARED HERE, INVOKED BY THE RUNNER — NOT BY THE GATE. It was
      # briefly wired into the gate below as an `advisory_program_exit_zero`
      # and that was withdrawn on 2026-07-28: `flow_compliance_check` is the
      # phase-2+3 ACCEPTANCE AUDITOR, and an auditor that writes a declared
      # required_output into the project it is auditing certifies its own
      # output — the two blocking clauses below then read a `.gds` that the
      # audit itself had just created. Measured: on a copy of the reference
      # analog run tree with no hardmacro GDS, `flow_compliance_check
      # <proj>` created delta_sigma.gds (2042 B) and ldo.gds (1706 B); with
      # the clause removed it creates none. Production belongs to
      # `analog_one_shot_runner.step_for_block("A8_hardmacro_gen")`, which is
      # the path a real analog run takes, and the audit then measures a tree
      # it did not touch.
      - analog_hardmacro_gds_emit
    required_outputs:
      - "phase3/analog/hardmacro/*/*.lef"
      - "phase3/analog/hardmacro/*/*.lib"
      - "phase3/analog/hardmacro/*/*.gds"
      - "phase3/analog/hardmacro/*/*.v"
    gate:
      all_of:
        # NO PRODUCER CLAUSE HERE, ON PURPOSE. `analog_hardmacro_gds_emit` is
        # declared in `programs:` above and invoked by
        # `analog_one_shot_runner`; it must NOT be invoked from this gate.
        # Every clause below is read by `flow_compliance_check`, the sole
        # phase-2+3 acceptance auditor, and an auditor may not accept as
        # evidence an artefact it caused to exist during its own run. With
        # the producer in the gate, `analog_hardmacro_check` and
        # `analog_lef_gds_outline_check` were reading a `.gds` written
        # moments earlier by the same audit — a step certifying its own
        # output. Re-adding it is measurable: `flow_compliance_check <copy of
        # the reference analog run tree>` then creates
        # phase3/analog/hardmacro/*/*.gds, which
        # test_d3_the_compliance_audit_does_not_create_declared_outputs
        # reddens on.
        - program_exit_zero: "analog_hardmacro_check . --json reports/phase2/gates/hardmacro.json"
        # `analog_lef_gds_outline_check` was WRITTEN, TESTED and never WIRED:
        # it appeared only in skills/analog-output-verify/SKILL.md, in
        # programs/INDEX.md and in its own unit test — in NO flow gate. It is
        # the numeric half of A8 (does the LEF `SIZE w BY h ;` the digital
        # floorplan reserves actually match the GDS bounding box?), and it
        # already FAILs `A8_GDS_NO_GEOMETRY` on the exact artefact
        # analog_hardmacro_check used to accept. Measured: 500 bytes of
        # non-GDS noise + a valid LEF/LIB/V -> analog_hardmacro_check
        # `[PASS]`, analog_lef_gds_outline_check rc=1. Wiring it costs a
        # SECOND, separate class of newly-red: a REAL GDS paired with a
        # hand-written LEF outline can now FAIL on a numeric mismatch that
        # was never measured before. That is the intended cost.
        # VACUOUS_PASS on projects with no analog_block_list.json, so the
        # pure-digital track is untouched; a deterministic-stub hardmacro
        # with no .gds is a disclosed STUB_NOT_PACKAGED skip, so the
        # PASS_WITH_STUB tier survives.
        - program_exit_zero: "analog_lef_gds_outline_check . --json reports/phase2/gates/a8_lef_gds_outline.json"
        # `analog_macro_rtl_interface_check` — the DIGITAL side of the macro's
        # interface, which nothing above compares. `analog_hardmacro_check`
        # and `analog_hardmacro_pinname_consistency_check` assert LEF == macro
        # `.v` == spec, all three on the ANALOG side, and pass. Nothing
        # compared those pins against the module the digital netlist actually
        # INSTANTIATES, and on the campaign design the two sides disagreed
        # about every block (a `vss` PG pin no RTL blackbox declares — a macro
        # that floats in silicon; `vin` on one side and `vdd` on the other;
        # a modulator the RTL drives as clocked and the analog block built as
        # forward-path only). OpenROAD reports it, as STA-0201 WARNINGS, and
        # only after A8 has cleared ORD-2013. The checker shipped with
        # v1.15.49 wired to nothing but its own test — `checker_execution_
        # wiring_audit` and `gate_is_wired_check` both named it (vibe-ic#2010
        # items 1-2) — so it is declared here, at the step that produces the
        # LEF it reads.
        #
        # BLOCKING, on purpose: a supply pin the digital top never connects
        # has no legitimate reading. It never renames anything and never
        # decides which side is right — it names the disagreement in both
        # directions and refuses. rc 2 (no packaged LEF / no topology port
        # list, or no module of the block's name in any RTL or netlist) is a
        # DESIGN absence the auditor promotes to VACUOUS_PASS. MEASURED before
        # wiring, over every corpus cell that declares an analog block list
        # (12 protocol_parity cells) and the mixed-signal campaign tree it
        # was written from:
        # VACUOUS on all of them, zero newly red. It reads
        # phase3/analog/hardmacro/<block>/<block>.lef (this step's own
        # required_output) plus phase3/analog/<block>/topology.json and the
        # RTL/netlist under phase2/, and writes only its own report.
        - program_exit_zero: "analog_macro_rtl_interface_check . --json reports/phase2/gates/a8_macro_rtl_interface.json"
        # `analog_topology_behaviour_check` — DOES THE CIRCUIT DO WHAT ITS OWN
        # TOPOLOGY SAYS IT IS FOR? Every clause above answers a different
        # question and all of them pass on a block that converts nothing:
        # `analog_hardmacro_check` certifies the LEF/LIB/V triple,
        # `analog_lef_gds_outline_check` the numeric outline,
        # `analog_macro_rtl_interface_check` the digital pin agreement. None
        # asks whether the block works. MEASURED (u_hawaii_adc, ihp-sg13g2,
        # 2026-09-02) on the `delta_sigma` library entry: a complete CIFB
        # modulator that renders, passes every static netlist check, converges
        # in ngspice and drives `bit_out` rail to rail at a bitstream density
        # of 0.51 — which moved by 0.0012 across a 0.40/0.60/0.80 V input
        # sweep whose ideal densities are 0.30/0.50/0.70. It does not convert,
        # and A5 through A9 would each have signed it off correctly.
        #
        # WIRED HERE BECAUSE IT WAS WIRED NOWHERE. It shipped (21247ff50) run
        # by `analog_one_shot_runner` INLINE at A8 and by nothing else, so
        # `flow_gate_enforcement_audit` reported it
        # `orphan::analog_topology_behaviour_check` — "declares an intent it is
        # not wired for" — against its own `ENFORCEMENT: blocking` docstring.
        # That audit reads the flow definition, `tools/ci/*.sh`,
        # `gatekeeper_review.py`, the transitive closure the flow SEEDS, and
        # `skills/**/*.md`; a one-shot runner is in none of them. This is the
        # SAME repair `analog_macro_rtl_interface_check` above already got for
        # the same reason (vibe-ic#2010 items 1-2): declared as a clause of the
        # step that produces what it reads, AND run inline by the runner, so
        # its verdict can stop the step as well as fail the audit.
        #
        # AT A8 AND NOT AT A3, for the reason `analog_one_shot_runner` states
        # at its inline call site: asked at A3 it refuses to EMIT the netlist
        # and the flow loses the layout, the extraction and the macro along
        # with the green. Refusing to SIGN OFF is not refusing to BUILD.
        #
        # NOT NEWLY RED ANYWHERE. A block whose `topology.json` states no
        # `behaviour_record` is SKIPPED by name — every shipped library entry
        # but one is in that state — and a project with no analog block list
        # exits 2 `VACUOUS_PASS: ... (reason: no_analog_block_declared)`, which
        # the auditor promotes to VACUOUS_PASS exactly as it does for the
        # clause above. It reads `phase3/analog/<block>/topology.json` and
        # writes only its own report.
        - program_exit_zero: "analog_topology_behaviour_check . --json reports/phase2/gates/a8_topology_behaviour.json"
    blocks_on: [A7]

  - id: A9
    # Renamed. The old name was "Co-Simulation / HW Verification", but the gate
    # never required a hardware measurement of any kind: a run with cosim
    # results and ZERO hw_measurements.json reported a bare PASS, byte-identical
    # in the report to a bench-verified close. Not mandating hardware is the
    # deliberate documented decision (see the A9 entry in
    # flow_condition_reachability_check's allowlist) — claiming to VERIFY it was
    # not. The name now states what the step enforces; the HW half is real when
    # bench data exists and DISCLOSED when it does not.
    name: "🔁 Co-Simulation (+ HW correlation when bench data exists)"
    stage: stage_analog
    closed_loop:
      fallback_to: A3
      trigger: "HW mismatch; netlist or analog/hardmacro fix"
    skills: [mixed-signal-cosim, analog-hw-tuning-loop]
    mcp_tools: [eda_spice, eda_simulate]
    condition:
      files_exist: ["phase1/analog/analog_block_list.json"]
    # EVIDENCE: `mixed_signal_cosim_check` — the gate this step runs — reads
    # `phase3/mixed_signal/cosim/mixed_signal_results.json` as its
    # authoritative aggregate report (the file its own anti-fabrication pass
    # cites). That filename does not end in `_cosim_results.json`, so it never
    # matched the declared glob, and a project whose ONLY cosim evidence was
    # the aggregate short-circuited to MISSING in
    # `flow_compliance_check.check_step` before the gate ran. The hw-measurement
    # alternative is also spelled with its real prefix here: the bare
    # `analog/` form resolved only through `_glob_first`'s hidden analog remap
    # and read as absent to every tool without it (e.g. the dashboard), while
    # A9's own optional_program_exit_zero condition already says
    # `phase3/analog/*/hw_measurements.json`.
    required_outputs:
      - "phase3/mixed_signal/cosim/*_cosim_results.json OR phase3/mixed_signal/cosim/mixed_signal_results.json OR phase3/analog/*/hw_measurements.json"
    gate:
      all_of:
        - program_exit_zero: "mixed_signal_cosim_check . --json reports/phase2/gates/cosim.json"
        - optional_program_exit_zero:
            command: "analog_hw_spice_correlation_check . --json reports/phase2/gates/hw_spice_corr.json"
            condition_files_exist: ["phase3/analog/*/hw_measurements.json"]
            absent_condition_reason: >-
              Scoped to bench-hardware availability, the analog analogue of
              --skip-hardware. The clause correlates MEASURED silicon against
              SPICE; with no lab measurement there are not two things to
              correlate. Simulation-only closure stays legal and is no longer
              silent: A9 is in _ANALOG_BENCH_STEP_IDS so --skip-hardware
              waives it the way it waives step 6, and the same gate runs
              analog_a9_hw_verify_check, whose rc 2 surfaces a simulation-only
              close as VACUOUS_PASS rather than PASS.
        # The DISCLOSURE half. analog_a9_hw_verify_check already existed and
        # already judges hw_measurements.json substance correctly — it was just
        # wired only into analog_one_shot_runner, never into this gate, so the
        # flow verdict could not see it. Its three outcomes are exactly the
        # tiers this step needs: every block measured and sane -> rc 0 PASS; a
        # block measured but with no evidence keys / no numeric measurement ->
        # rc 1 FAIL; no block measured at all -> rc 2, which check_step surfaces
        # as VACUOUS_PASS. That last tier is the point: a simulation-only close
        # stays legal (headless and CI analog runs must remain possible) but
        # stops being reported as an undifferentiated PASS.
        - program_exit_zero: "analog_a9_hw_verify_check . --json reports/phase2/gates/a9_hw_verify.json"
        # ── The HIL discipline half (#693 family `analog-hil`) ─────────────
        # Four gates were WRITTEN, TESTED and never WIRED: they appeared only
        # in skills/analog-hw-tuning-loop/SKILL.md, in
        # skills/analog-hw-testbench-gen/SKILL.md, in programs/INDEX.md and in
        # their own unit tests — in NO flow gate and in no CI script. One line
        # of prose in a SKILL.md is also what kept them out of
        # `checker_execution_wiring_baseline.json`, whose audit counts a SKILL
        # mention as a runner.
        #
        # They are ADVISORY, and both halves of that choice are measured:
        #
        #   * NOT `program_exit_zero`. `_evaluate_gate` short-circuits an
        #     `all_of` at the first failing sub-gate and only re-runs the
        #     ADVISORY siblings after it. A9's first sub-gate
        #     (`mixed_signal_cosim_check`) FAILs on the ONE published run that
        #     reaches this gate tree at all; appending blocking sub-gates here
        #     executes them on 0 of 17 published runs — the same defect moved,
        #     not fixed. Wired advisory they execute once bench evidence exists.
        #
        #   * NON-BLOCKING, for now. NOTHING IN THIS REPO WRITES
        #     `hw_tuning_report.json` OR `hw_sizing_history.json` — 0 files
        #     repo-wide, no producer program; the skill documents them as
        #     agent-authored. A blocking gate over an artefact with no producer
        #     certifies nothing. Before bench evidence exists, the clauses do
        #     not run and publish a typed EXTERNAL non-verdict. Once any block
        #     has hw_measurements.json, all five HIL clauses run and retain
        #     their existing refusal / incomplete contracts.
        #
        # PROMOTION CONDITION, so this does not sit advisory forever: when
        # `analog-hw-tuning-loop` (or a runner step) emits
        # `phase3/analog/<block>/hw_tuning_report.json` and
        # `hw_sizing_history.json`, move the first three to
        # `program_exit_zero`. They already return 1 for every defect,
        # including a malformed report.
        - advisory_program_exit_zero:
              command: "analog_hil_report_schema_check . --json reports/phase2/gates/hil_report_schema.json"
              advisory_reason: "NOT-YET-CLEAN: this gate CAN refuse and is wired advisory as a ratchet position, not as a verdict. Notch measured rc 2 on a real spm run (2026-08-31): NOT CHECKED on that run — no input reached it, so the notch is unmeasured and this clause is not yet evidence of anything."
              condition_files_exist: ["phase3/analog/*/hw_measurements.json"]
              absent_condition_reason_class: "EXTERNAL"
              absent_condition_reason: "This HIL schema gate consumes hardware-bench output. When no block has hw_measurements.json, the lab campaign is external to this headless run and there is no tuning report to validate."
        - advisory_program_exit_zero:
              command: "analog_hil_iteration_cap_check . --json reports/phase2/gates/hil_iteration_cap.json"
              advisory_reason: "NOT-YET-CLEAN: this gate CAN refuse and is wired advisory as a ratchet position, not as a verdict. Notch measured rc 2 on a real spm run (2026-08-31): NOT CHECKED on that run — no input reached it, so the notch is unmeasured and this clause is not yet evidence of anything."
              condition_files_exist: ["phase3/analog/*/hw_measurements.json"]
              absent_condition_reason_class: "EXTERNAL"
              absent_condition_reason: "This iteration-cap gate consumes hardware-bench tuning history. With no hw_measurements.json, the lab campaign is external to this headless run and no hardware iteration denominator exists."
        - advisory_program_exit_zero:
              command: "analog_hil_single_knob_check . --json reports/phase2/gates/hil_single_knob.json"
              advisory_reason: "NOT-YET-CLEAN: this gate CAN refuse and is wired advisory as a ratchet position, not as a verdict. Notch measured rc 2 on a real spm run (2026-08-31): NOT CHECKED on that run — no input reached it, so the notch is unmeasured and this clause is not yet evidence of anything."
              condition_files_exist: ["phase3/analog/*/hw_measurements.json"]
              absent_condition_reason_class: "EXTERNAL"
              absent_condition_reason: "This single-knob gate consumes hardware-bench sizing history. With no hw_measurements.json, the lab campaign is external to this headless run and there are no hardware iterations to compare."
        # The DE10-Lite board gate is pointed at its DECLARED SUBJECT —
        # `analog/<block>/hw_test/pin_assignments.qsf`, per
        # skills/analog-hw-testbench-gen/SKILL.md — not at the project root.
        # It is ALSO registered in `flow_compliance_check._STRUCTURAL_RTL_GATES`
        # for the digital side, and that is not redundant: the structural
        # umbrella resolves an `rtl_dir` first and returns
        # `_P0_NO_RTL_NOTE` without dispatching ANY gate when there is none —
        # measured, that is 0 of the 3 pure-analog published runs. So the
        # umbrella alone would never let this gate see the analog QSF it was
        # written for.
        - advisory_program_exit_zero:
              command: "analog_hw_tb_de10lite_budget_check phase3/analog --json reports/phase2/gates/a9_de10lite_budget.json"
              advisory_reason: "NOT-YET-CLEAN: this gate CAN refuse and is wired advisory as a ratchet position, not as a verdict. Notch measured rc 2 on a real spm run (2026-08-31): NOT CHECKED on that run — no input reached it, so the notch is unmeasured and this clause is not yet evidence of anything."
              condition_files_exist: ["phase3/analog/*/hw_measurements.json"]
              absent_condition_reason_class: "EXTERNAL"
              absent_condition_reason: "This board-budget gate applies to a hardware-bench campaign. With no hw_measurements.json, the DE10-Lite work is external to this headless run and no board build is claimed."
        # ORPHANED, RE-HOMED (2026-08-25). A9 is the step that owns HW
        # correlation, and this reads the convergence log that correlation
        # produces. ADVISORY: measured on a real completed project it returns
        # `VACUOUS_PASS: phase3/analog/analog_block_list.json missing or empty`,
        # which is the right answer for a digital design and also means it has
        # never been exercised against a real analog bench. It reports until one
        # has answered it.
        - advisory_program_exit_zero:
              command: "analog_hil_convergence_log_check ."
              advisory_reason: "NOT-YET-CLEAN: this gate CAN refuse and is wired advisory as a ratchet position, not as a verdict. Notch measured rc 0 on a real spm run (2026-08-31): it is already clean on real input, so blocking would cost nothing today; the only thing holding it advisory is that no other run has been measured."
              condition_files_exist: ["phase3/analog/*/hw_measurements.json"]
              absent_condition_reason_class: "EXTERNAL"
              absent_condition_reason: "This convergence gate consumes a real SPICE-to-hardware tuning campaign. With no hw_measurements.json, the hardware bench is external to this headless run and absence of a HIL log is not a design defect."
    blocks_on: [A8]

  # ── Step 14 (Wave 91 / v1.6.15): pre-PnR Yosys gate ──────────────
  # Promoted from synthetic Step 0 (legacy v0.70 in-process gate). Sits
  # between stage2 Equivalence Check (Step 13) and stage3 PnR proper
  # (Floorplan, Step 15). Verifies the Yosys synth script template
  # contains the required tokens (-sv, -flatten, hilomap) and that the
  # synth output has no zero_ ghost-net residue — failures here indicate
  # the Yosys flow needs to be re-run with proper flags before PnR
  # consumes the netlist. Implementation: aggregated by
  # `flow_compliance_check.py:_run_yosys_gates` (combines
  # yosys_hilomap_required_check + yosys_script_template_check).
  # v2.3 — Step 14 belongs to Stage 2: it is the synthesis→PnR
  # handoff QA (synth-script + netlist audit), i.e. the synthesis
  # stage's closing gate, NOT a physical-design step. Open-source-flow
  # specific (Yosys); commercial flows (Genus/DC) have no equivalent.
  - id: 14
    name: "🔁 Synthesis handoff gate (pre-PnR Yosys script + netlist audit; open-source-flow specific)"
    # Wave 91 / v1.6.15 — promoted from synthetic Step 0. It is the PRE-PnR
    # gate, which is why it sits in Synthesis and not in Physical Design; the
    # per-stage roster deleted in vibe-ic#923 had it the other way round.
    stage: stage2
    required_inputs:
      - from: 9
        path: "phase2/stage2/synth/netlist.v"
    closed_loop:
      fallback_to: 9
      trigger: "Yosys phase2/stage2/synth script missing -sv/-flatten/hilomap or unresolved zero_ nets"
    programs:
      - yosys_hilomap_required_check
      - yosys_script_template_check
      - yosys_tiecell_recipe_order_check
    required_outputs:
      - "phase2/stage2/synth/netlist.v"
      - "reports/analog/stage_analog_compliance.json"
    gate:
      all_of:
        # ── ON-PASS REVIEW of stage_analog ─────────────────────────────────
        # Declared on the stage (`stages[].on_pass_review`), DISPATCHED here:
        # the synthesis-handoff step, after A1..A9 have finished.
        # `advisory_`, NOT `program_exit_zero`, and that is the whole point:
        # the block declares `verdict: advisory` and the program declares
        # `DECLARED_ENFORCEMENT = "advisory"`. The blocking slot would make a
        # rejection stop the step -- turning "unverified" into "blocking",
        # which #1253 refuses -- and would additionally read the program's
        # rc=2 NOT CHECKED as VACUOUS_PASS. The advisory slot RUNS it and
        # RECORDS the verdict without changing the step's tier.
        # THE VERDICT SOURCE, PRODUCED HERE AND READ ON THE NEXT LINE.
        # It used to be `--compliance reports/flow_compliance.json`, which
        # ONLY the flow's `final_gate:` block declares -- and NOTHING
        # EXECUTES `final_gate`. Both runners invoke this program without
        # `--json` (design_one_shot_runner._build_final_audit_cmd,
        # phase3_one_shot_runner), `--json` has no default, and even when a
        # caller does pass it the report is written AFTER the step loop that
        # hosts these clauses. MEASURED: the review returned rc=2 NOT CHECKED
        # -- "[Errno 2] No such file or directory" -- on every real run, which
        # is v1.13.42's outcome reached through a different door.
        # A scoped pass run as the clause BEFORE the review is a verdict
        # source with an executed producer AND a defined order: `_evaluate_gate`
        # walks `all_of` in sequence, so the report exists when the next
        # clause reads it.
        - advisory_program_exit_zero:
              command: "flow_compliance_check . --stage-id stage_analog --strict --json reports/analog/stage_analog_compliance.json"
              advisory_reason: "NOT-YET-CLEAN: this gate CAN refuse and is wired advisory as a ratchet position, not as a verdict. Notch measured rc 0 on a real spm run (2026-08-31): it is already clean on real input, so blocking would cost nothing today; the only thing holding it advisory is that no other run has been measured."
        - advisory_program_exit_zero:
              command: "stage_on_pass_review . --stage stage_analog --json reports/analog/stage_analog_on_pass_review.json --compliance reports/analog/stage_analog_compliance.json"
              advisory_reason: "DEMOTED, not designed advisory: wired blocking until da6fcd7fe (2026-08-30), moved here in the change that made the declared command actually execute; that push used --no-verify because the full tier did not stamp. Restore blocking once the six on-pass stage commands run green. Re-pointed at the per-stage compliance report in v1.13.78; notch re-measured rc 0 on that invocation, unchanged in class."
        - optional_program_exit_zero:
            command: "yosys_hilomap_required_check . --json reports/phase2/gates/yosys_hilomap.json"
            condition_files_exist: ["phase2/stage2/synth"]
            absent_condition_reason: >-
              Scoped to the presence of a synthesis directory. Step 14
              declares phase2/stage2/synth/netlist.v as its SOLE
              required_outputs pattern, so a run with no synth tree resolves
              the step MISSING before this clause could hide anything -- the
              absence is loud one level up, not swallowed here.
        - optional_program_exit_zero:
            command: "yosys_script_template_check . --json reports/phase2/gates/yosys_script_template.json"
            condition_files_exist: ["phase2/stage2/synth"]
            absent_condition_reason: >-
              Scoped to the presence of a synthesis directory. Step 14
              declares phase2/stage2/synth/netlist.v as its SOLE
              required_outputs pattern, so a run with no synth tree resolves
              the step MISSING before this clause could hide anything -- the
              absence is loud one level up, not swallowed here.
        # v1.9.62+ — the third tie-cell ordering rule pair, ADVISORY.
        # The two gates above assert hilomap PRESENCE and token presence.
        # Neither checks `setundef -zero` BEFORE hilomap, nor `opt_clean` /
        # `clean -purge` AFTER it, which is why the canonical Phase-3 runner's
        # own recipe drifted from the one `skills/synth-doctor/SKILL.md`
        # documents without anything noticing.
        #
        # ADVISORY, not optional_program_exit_zero, and the reason is measured:
        # `phase3_one_shot_runner` never emits `setundef -zero`, so a BLOCKING
        # wiring would redden EVERY future real-PDK run it produces, plus the
        # one published run that is judgeable today
        # (`benchmark-data/ic/caravel_user_project`). Fixing the producer
        # changes how don't-care chip-top OUTPUT / OUTPUT-ENABLE bits resolve
        # and needs a functional re-verification, so it is not bundled here.
        # `advisory_program_exit_zero` RUNS the gate and RECORDS the verdict
        # without failing the step — the slot that exists precisely so a gate
        # that declares itself advisory can be wired at all.
        - advisory_program_exit_zero:
            command: "yosys_tiecell_recipe_order_check . --json reports/phase2/gates/yosys_tiecell_recipe_order.json"
            advisory_reason: "NOT-YET-CLEAN: this gate CAN refuse and is wired advisory as a ratchet position, not as a verdict. Notch measured rc 0 on a real spm run (2026-08-31): it is already clean on real input, so blocking would cost nothing today; the only thing holding it advisory is that no other run has been measured."
            condition_files_exist: ["phase2/stage2/synth"]
            absent_condition_reason: >-
              Scoped to the presence of a synthesis directory: the rule is
              about the ORDER of setundef/hilomap/opt_clean inside a yosys
              script, and with no synth tree there is no script to order. Step
              14 declares phase2/stage2/synth/netlist.v as its SOLE
              required_outputs pattern, so a run with no synth tree resolves
              the step MISSING one level up.
    blocks_on: [9, 13]

  - id: 15
    name: "Floorplan + PDN"
    stage: stage3
    required_inputs:
      - from: 12
        path: "phase2/stage2/synth/post_dft_netlist.v"
      - from: 7
        path: "phase2/stage2/constraints/*.sdc"
    mcp_tools: [eda_pnr]
    programs:
      # Wave 82 — `phase3_backend_step` is the per-step dispatcher
      # that wraps each backend invocation (synth → PnR → STA → DRC)
      # with a single deterministic entry point. Registered at the
      # entry to stage3 so the agent can call it for every backend
      # step. The dispatcher itself is an internal coordinator;
      # individual gate logic stays in the dedicated checks below.
      - phase3_backend_step
      - floorplan_pdn_check
    required_outputs:
      - "phase3/stage3/pnr/floorplan.def"
      - "phase3/stage3/pnr/pdn.tcl OR phase3/stage3/pnr/pdn.done"
      - "reports/phase2/gates/stage2_compliance.json"
    gate:
      all_of:
        # ── ON-PASS REVIEW of stage2 ─────────────────────────────────
        # Declared on the stage (`stages[].on_pass_review`), DISPATCHED here:
        # the step that already carries `stage2_compliance .`.
        # `advisory_`, NOT `program_exit_zero`, and that is the whole point:
        # the block declares `verdict: advisory` and the program declares
        # `DECLARED_ENFORCEMENT = "advisory"`. The blocking slot would make a
        # rejection stop the step -- turning "unverified" into "blocking",
        # which #1253 refuses -- and would additionally read the program's
        # rc=2 NOT CHECKED as VACUOUS_PASS. The advisory slot RUNS it and
        # RECORDS the verdict without changing the step's tier.
        # THE VERDICT SOURCE, PRODUCED HERE AND READ ON THE NEXT LINE.
        # It used to be `--compliance reports/flow_compliance.json`, which
        # ONLY the flow's `final_gate:` block declares -- and NOTHING
        # EXECUTES `final_gate`. Both runners invoke this program without
        # `--json` (design_one_shot_runner._build_final_audit_cmd,
        # phase3_one_shot_runner), `--json` has no default, and even when a
        # caller does pass it the report is written AFTER the step loop that
        # hosts these clauses. MEASURED: the review returned rc=2 NOT CHECKED
        # -- "[Errno 2] No such file or directory" -- on every real run, which
        # is v1.13.42's outcome reached through a different door.
        # A scoped pass run as the clause BEFORE the review is a verdict
        # source with an executed producer AND a defined order: `_evaluate_gate`
        # walks `all_of` in sequence, so the report exists when the next
        # clause reads it.
        # `stage2_compliance` was ALREADY in this `all_of`, last, with no `--json`.
        # It is the same clause, moved to the front and asked to write what
        # it measured. Nothing new runs.
        - advisory_program_exit_zero:
              command: "stage2_compliance . --json reports/phase2/gates/stage2_compliance.json"
              advisory_reason: "NOT-YET-CLEAN: this gate CAN refuse and is wired advisory as a ratchet position, not as a verdict. Notch measured rc 0 on a real spm run (2026-08-31): it is already clean on real input, so blocking would cost nothing today; the only thing holding it advisory is that no other run has been measured."
        - advisory_program_exit_zero:
              command: "stage_on_pass_review . --stage stage2 --json reports/phase2/gates/stage2_on_pass_review.json --compliance reports/phase2/gates/stage2_compliance.json"
              advisory_reason: "DEMOTED, not designed advisory: wired blocking until da6fcd7fe (2026-08-30), moved here in the change that made the declared command actually execute; that push used --no-verify because the full tier did not stamp. Restore blocking once the six on-pass stage commands run green. Re-pointed at the per-stage compliance report in v1.13.78; notch re-measured rc 2 on that invocation, unchanged in class."
        # flow v2.3.1 (review R3) — IP integration checklist: hard-macro
        # LEF/GDS/Liberty file-set alignment + lib corner coverage +
        # L21 power-domain consistency, before the macros enter
        # floorplan. Only fires when macros are present.
        - optional_program_exit_zero:
            command: "ip_integration_check . --json reports/phase2/gates/ip_integration.json"
            condition_files_exist: ["input/pdk_local", "phase3/analog/hardmacro"]
            absent_condition_reason: >-
              Scoped to the presence of hard macros. Both triggers are
              DECLARATIONS -- a user-supplied local PDK tree and the analog
              hardmacro handoff -- and a design that integrates no macro has
              no macro LEF/GDS/Liberty file set, no lib-corner coverage and no
              L21 power-domain consistency to check. Nothing this step does
              can delete a declaration that a macro exists.
        - files_exist: ["phase3/stage3/pnr/floorplan.def"]
        - program_exit_zero: "floorplan_pdn_check . --json reports/phase3/pnr/floorplan_pdn.json"
        # vibe-ic — WHAT THE LEF DECLARES vs WHAT A READER CAN LOAD.
        # A macro OBS section naming a layer the tech LEF does not declare is
        # discarded IN FULL — MEASURED 64 declared OBS rects -> 0 loaded,
        # including the rects on layers that ARE declared — while `read_lef`
        # returns success. The macro then carries the right outline, intact
        # pins and NO obstruction on any layer, so every later stage treats a
        # sealed footprint as free area. Wired HERE because it is a LEF-LOAD
        # property: this is the first step that reads the macro abstracts, and
        # catching it at floorplan costs one gate instead of a whole route.
        #
        # UNCONDITIONAL, and that is deliberate. The obvious wiring is
        # `optional_program_exit_zero` + `condition_files_exist: ["**/*.lef"]`,
        # which keeps a LEF-less project's step at PASS instead of demoting it
        # to VACUOUS-PASS. `flow_condition_reachability_check` classifies that
        # exact form as SELF-DISABLING — the trigger is a file nothing in the
        # flow guarantees, so a project could silently never run the gate. A
        # gate that can be skipped by the absence of the thing it looks for is
        # the orphan this whole change exists to end. rc=2 -> VACUOUS_PASS is
        # the flow's honest encoding of "could not measure", and a step whose
        # evidence is partly vacuous SHOULD read that way.
        - program_exit_zero: "macro_obs_load_parity_check . --json reports/phase3/pnr/macro_obs_load_parity.json"
        # THE STAGE-2 BOUNDARY, ASKED BY THE STEP THAT CROSSES IT.
        # `stage2_compliance` is the end-of-stage gate the README and
        # AGENT_USAGE_GUIDE both name for stage2, and its own docstring says
        # exactly where it belongs: "Run this after completing Steps 07-13 and
        # before starting Stage 3 floorplan/placement." This IS that step —
        # 15 is stage3's first step and already declares `blocks_on: [13, 14,
        # A8]`, i.e. it is the place the flow already admits stage2 must be
        # finished. Until now nothing invoked the wrapper, so the boundary was
        # asserted in prose and measured nowhere.
        #
        # ADVISORY, not blocking, for two reasons. (a) A blocking clause here
        # would re-litigate every stage2 step's own verdict from inside a
        # stage3 step, so one stage2 finding would refuse the PASS tier twice.
        # (b) The wrapper hardcodes `--strict`, which is a stricter reading
        # than the run's own invocation may have chosen; a stricter opinion is
        # a finding worth printing, not a second veto.
        #
        # NO RECURSION: the wrapper runs `flow_compliance_check --stage 2`,
        # which evaluates stage2 steps ONLY. This clause lives on a stage3
        # step, so it is outside that filter and cannot re-enter itself. The
        # same reasoning is why stage3's wrapper is wired on a stage4 step and
        # stage4's on a stage5 step, and why none of the three may ever be
        # wired inside its own stage.
    blocks_on: [13, 14, A8]

  # ── chip/IC path only ────────────────────────────────────────────────
  # THE FLOW HAS ALWAYS BEEN A cell/IP FLOW AND NEVER SAID SO. Steps 1-38
  # take RTL to a bare die: no pad ring, no seal ring, no die identification.
  # That is exactly right for an IP handed to somebody else to place, and it
  # is not a submittable chip. MEASURED 2026-08-19: wafer.space's own
  # precheck container, run against our published GDS, refused at stage 3 of
  # 16 with "Layer 'GUARD_RING_MK' is not used"; stages 4-16 have never run.
  #
  # Upstream draws the same line. LibreLane has TWO flows: `Classic`, whose
  # steps write a LEF because "this is a macro", and `Chip`, which deletes
  # `Magic.WriteLEF` with the comment "This is not a macro, there's no need
  # to write a LEF" and adds PadRing / SealRing / Filler / Density. The `ic`
  # suffix marks the steps that belong only to the chip path; `ip` marks the
  # one that terminates the cell/IP path.
  - id: 15.5ic
    name: "Pad Ring (chip/IC path only)"
    stage: stage3
    condition:
      # THE CHIP PATH, NOT THE SHUTTLE TEMPLATE — and the difference is the
      # whole of vibe-ic#1410/cpath. This condition used to read
      # `files_exist: [input/submission_template/slots/*.yaml]`, which is the
      # SHUTTLE OPERATOR'S template. A chip doing its own tape-out has no
      # operator and therefore no such file, so this step was skipped as "not
      # applicable" and the design shipped WITH NO PAD RING. A chip with no
      # pads cannot be bonded or probed. That is not a property of being on a
      # shuttle; it is a property of being a DIE. The operator's template
      # supplies the GEOMETRY this step needs, so its absence must change
      # WHERE the geometry comes from and never WHETHER the step runs.
      #
      # `any_of`, not the default ALL-of, and the two entries are the SAME
      # chip-path marker step 37.5ic already carries: they are MUTUALLY
      # EXCLUSIVE router files and no tree ever holds both
      # (`tapeout_declaration_check` refuses the tree that does), so an ALL-of
      # reading would make this step unreachable for every design.
      any_of: true
      files_exist:
        - "input/submission_template/slots/*.yaml"
        - "input/submission_template/SELF_TAPEOUT.txt"
    # D6 (vibe-ic#1744). `design_dependent`, not `setup_required`: this
    # condition tests WHICH PATH the design is on, and step 0.5ic's
    # required_outputs is the OR of exactly the three router artefacts, so on
    # any run where 0.5ic itself passed, precisely one of them exists. The two
    # named above are the CHIP ones; the third (`NO_TEMPLATE.txt`) is the
    # IP/hardmacro terminal 37.5ip owns, and an IP is delivered as a hardmacro
    # somebody else places — it has no die edge, so no pad ring — a design-
    # derived N/A is the correct reading ONLY after 0.5ic passed. The explicit
    # owner link below keeps the "someone forgot" / failed-owner state hard
    # MISSING rather than rendering it like that legitimate opposite path.
    condition_kind: design_dependent
    condition_owner:
      step: 0.5ic
      declaration: delivery_route
    required_inputs:
      - from: 15
        path: "phase3/stage3/pnr/floorplan.def"
      # WHERE THE GEOMETRY COMES FROM WHEN THERE IS NO OPERATOR. 0.5ic writes
      # this declaration on EVERY route, including the one with no operator, so
      # it exists wherever this step runs. Its section 2B is
      # `_pad_ring.REQUIRED_VARS` grouped into the 8 things a human decides,
      # and `_tapeout_declaration.py` names `pad_ring_gen` as the `consumer` of
      # every one of those 8. Until this edge, nothing read them.
      - from: 0.5ic
        path: "input/submission_template/tapeout_declaration.json"
    # BEFORE ROUTING, NOT AFTER. The pads are the design's BTerms once a pad
    # ring exists, so routing must already see them. OpenROAD places its pad
    # ring immediately after the power connections are set, for the same
    # reason, and LibreLane's Chip flow then deletes IOPlacement outright:
    # "No pin placement necessary -> pads are the BTerms".
    programs:
      # THE AUTHOR OF THIS STEP'S OWN INPUT, and it did not exist until
      # vibe-ic#1410/cpath. `pad_ring_gen` reads
      # `phase3/stage3/pnr/pad_assignment.json`; measured by grep over the
      # whole repository, that path had TWO references and both were readers.
      # Nothing wrote it, so `pad_ring_gen` took its SKIP branch on the shuttle
      # path and on the self-tape-out path alike — a step that can only skip is
      # not a step. `pad_assignment_gen` composes the config from the
      # operator's slot geometry WHERE THE SLOT SPEAKS and from the design's own
      # tape-out declaration everywhere else, derives nothing, and stamps every
      # variable with which source it came from.
      # THE PRODUCER OF THE PAD INSTANCES, and the reason the two below could
      # only ever refuse. `pad_assignment_gen` recorded one half in its own
      # words — `PAD_SOUTH`/`EAST`/`NORTH`/`WEST` and `SIGNAL_MAP` name NETLIST
      # INSTANCES and "no document can name an instance the netlist does not
      # contain" — and `_pad_ring` recorded the other: "the flow's synthesis
      # emits a bare core; NO STEP INSTANTIATES AN IO CELL". Together those are
      # a closed loop, and every design on the chip path sat inside it.
      # MEASURED on spm x gf180mcuD at plugin 1.15.65: `pad_assignment_gen`
      # rc=1, 3 of 8 answered, 10 of the 13 variables owed; and with all eight
      # answered BY HAND, `pad_ring_gen` rc=1 `PAD_INSTANCE_NOT_IN_BLOCK` for
      # every pad, because the floorplan was elaborated from the bare core.
      #
      # `io_pad_chip_top_gen` closes it from the producer side: the design's
      # own per-side PORT partition, the port directions from its L9
      # integration spec, and the master that serves each direction from the IO
      # library's own LEF `CLASS PAD <subtype>` record. It emits
      # `chip_top_io.v`, which the floorplan step elaborates, and records the
      # die the ring needs — without which the ring is built against a
      # core-sized die and every side computes negative.
      #
      # It runs FIRST and, in `phase3_one_shot_runner`, BEFORE the floorplan:
      # its chip top is what that floorplan links, and its `die_required_um` is
      # an input to the die resolution. It derives no geometry — `pad_ring_gen`
      # still places the ring and every one of its refusals stays reachable.
      - io_pad_chip_top_gen
      - pad_assignment_gen
      - pad_ring_gen
    required_outputs:
      - "phase3/stage3/pnr/padring.def"
      - "reports/phase3/padring.json"
      # THE HONEST HALF, and unlike `padring.def` it is written on EVERY path
      # this step takes — including the two that produce no ring. A run that
      # was never asked for a pin-out and a run whose declaration is half
      # written are different facts, and this is the artefact that keeps them
      # apart where a reader can see them.
      - "reports/phase3/pad_assignment.json"
    gate:
      all_of:
        # FIRST, because it is the one that can say WHY there is no ring.
        # Its three outcomes are the three states this step actually has:
        #   rc 0  every one of the 13 variables resolved from a declared source
        #   rc 2  NOT_ASKED — no slot pins a per-side pad list and section 2B
        #         of the declaration is entirely NOT_DETERMINED. The flow reads
        #         rc=2 as its disclosed-skip tier, which is the correct reading:
        #         nobody was asked, `pad_assignment.json` is deliberately NOT
        #         written, and `pad_ring_gen`'s own SKIP is left exactly as it
        #         is today. This is the state every tree in this repository is
        #         in, so wiring this clause changes no existing verdict.
        #   rc 1  REFUSE — a source could not be READ, two slot files pin the
        #         same side differently, a slot pad list names no die side, or
        #         a source spoke and the contract is still incomplete. That
        #         last one has two shapes and the message says which: the
        #         DESIGN answered some of section 2B and not the rest, or the
        #         OPERATOR's slot pinned the four per-side pad lists while the
        #         design answered nothing — which is NOT "nobody was asked",
        #         and a slot file can supply nothing else, so the other nine
        #         variables are owed by the design whatever the operator
        #         published. Either way the owed fields are NAMED. It never
        #         guesses a pad site, an edge spacing, a rotation or a filler,
        #         so every one of `pad_ring_gen`'s own refusals
        #         (PAD_SITE_NOT_FOUND, PAD_SITE_CLASS_NOT_PAD,
        #         PAD_CORNER_SPACING_NOT_SITE_MULTIPLE and the other three)
        #         stays reachable and still fires.
        - program_exit_zero: "pad_assignment_gen . --json reports/phase3/pad_assignment.json"
        - program_exit_zero: "pad_ring_check . --json reports/phase3/padring.json"
    # 0.5ic writes the template this step's condition reads; without the
    # edge the graph says the pad ring may run before the slot geometry
    # that decides its size exists (D5-MISSING-EDGE, 2026-08-20).
    blocks_on: [15, 0.5ic]
  - id: 16
    name: "Clock planning"
    stage: stage3
    required_inputs:
      - from: 15
        path: "phase3/stage3/pnr/floorplan.def"
      - from: 7
        path: "phase2/stage2/constraints/*.sdc"
    # SKILLS: NONE. The AI half of this step was named and never built --
    # see `unbuilt_skills` in skills/_classification.json for the record and
    # the evidence. The names that used to sit here (cts-plan) ship
    # nowhere under skills/, so an agent told to invoke one cannot, and
    # hand-authors instead. The deterministic half below is what this step
    # actually has; declaring the gap is honest, an empty stub is not.
    programs:
      - clock_plan_check
    required_outputs:
      - "phase3/stage3/cts/clock_plan.json"
    gate:
      # Substance gate: clock_plan_check.py parses the real
      # phase3/stage3/cts/clock_plan.json and verifies SUBSTANCE — it does NOT
      # trust file presence. It FAILs honestly (rc=1) on an absent / empty /
      # unparseable plan, on an empty plan (no clock defined), on any clock with
      # no positive period (or non-positive period/frequency), on any clock with
      # no source pin/port, and on any SDC create_clock that is dropped from the
      # plan. So a single program_exit_zero subsumes the file-presence
      # precondition (the checker's first FAIL is CLOCK_PLAN_MISSING).
      program_exit_zero:
        command: "clock_plan_check . --json reports/phase2/gates/clock_plan.json"
    blocks_on: [15]

  - id: 17
    name: "Placement (global + detailed)"
    stage: stage3
    required_inputs:
      - from: 15
        path: "phase3/stage3/pnr/floorplan.def"
      - from: 15
        path: "phase3/stage3/pnr/pdn.tcl OR phase3/stage3/pnr/pdn.done"
    # placement-optimize never shipped. ppa-optimize does, and its own
    # description is this step's job: "bounded, reversible actuator moves
    # ... placement density, clock period, synthesis effort, buffering,
    # floorplan aspect".
    skills: [ppa-optimize]
    programs:
      - placement_legality_check
      - pnr_timing_repair_completeness_check
    mcp_tools: [eda_pnr]
    required_outputs:
      - "phase3/stage3/pnr/placed.def"
    gate:
      all_of:
        # The DECLARED INVERSE of `openroad_tcl_deprecation_check` (which flags
        # the PRESENCE of removed tokens; this flags the ABSENCE of required
        # ones), and it was wired NOWHERE — its own unit test was the only
        # thing that had ever run it. It asserts the P&R script carries
        # `set_wire_rc` + `repair_design` + `repair_timing -setup`. Without
        # set_wire_rc OpenSTA has no per-layer R/C, so STA is optimistic and
        # `repair_timing -setup` aborts; a script that runs ONLY
        # `repair_timing -hold` ships unbuffered high-fanout nets. That is a
        # measured silicon-DOA shape, not a hypothetical: on one published
        # benchmark run post-route WNS was -102.76 ns and was mis-attributed to
        # the algorithm; adding the chain gave +10.95 ns on the SAME RTL.
        #
        # THREE deliberate wiring choices, each measured:
        #   * FIRST in the `all_of`, not last. `_evaluate_gate` SHORT-CIRCUITS:
        #     it returns on the first failing sub-gate and only later ADVISORY
        #     sub-gates still run. Wired last, this gate ran on 0 of 5 sampled
        #     published runs; wired first it runs whenever step 17 is evaluated
        #     (measured in-flow: rc=0 PASS on a real published pnr.tcl). It
        #     carries an rc=2 NOT-CHECKED tier and measures 0 red over the
        #     whole corpus, so ordering it first cannot turn a green run red.
        #     NOTE, separately: step 17 declares `phase3/stage3/pnr/placed.def`
        #     as a required_output, it is on 0 of the 34 published run roots,
        #     so on the PUBLISHED tree this step is MISSING and `check_step`
        #     evaluates no gate here at all. That is a property of the corpus,
        #     not of the wiring; on a live run the DEF exists.
        #     THE CAUSE IS NOT "`.gitignore` excludes `*.def` under
        #     benchmark-data/ic/**" — an earlier revision of this comment said
        #     that, and it is backwards. Root line 84 ignores `*.def`
        #     GLOBALLY; root line 173 is `!benchmark-data/ic/**/*.def`, an
        #     explicit RE-inclusion. Measured with git itself:
        #       git check-ignore --no-index -q \
        #         benchmark-data/ic/spm/v1.5.65_sky130A/phase3/stage3/pnr/placed.def
        #         -> rc=1  NOT ignored (last match is the line-173 negation)
        #       git check-ignore --no-index -q somewhere/else/placed.def
        #         -> rc=0  ignored, by line 84
        #     and 3 `.def` ARE tracked under benchmark-data/ic today
        #     (spm/*/phase3/stage3/pnr/routed.def). That negation is not
        #     incidental either: `size_policy_drift_check` FAILs with
        #     `GITIGNORE_REVERTED` if it is ever removed, and prints "the ROOT
        #     .gitignore negates *.gds and *.def under benchmark-data/ic/**"
        #     on every PASS. The comment contradicted a shipped, ratcheted
        #     gate.
        #     THE REAL MECHANISM IS PUBLICATION SCOPE, in two parts:
        #       * `benchmark_evidence_publish` copies phase1/, phase2/,
        #         phase3/reports/ and reports/, and states in its own docstring
        #         that "raw PnR scratch under phase3/stage3 … [is] still not
        #         staged … a decision about what counts as evidence, which is
        #         separate from how big a file is". `placed.def` is in exactly
        #         that subtree; the 3 tracked `routed.def` are the hand-staged
        #         reference cells the same docstring names.
        #       * where a published cell DOES exclude its DEFs the rule is a
        #         whole-DIRECTORY one, not an extension one: root line 153
        #         `benchmark-data/ic/*/clean_run_*/` plus a per-cell nested
        #         `.gitignore` carrying `phase3/stage3/*`.
        #     Git would track a published `placed.def` in the reference-cell
        #     layout; no run publishes one.
        #   * UNCONDITIONAL. `condition_files_exist: [phase3/stage3/pnr/pnr.tcl]`
        #     is the self-disabling shape `flow_condition_reachability_check`
        #     refuses — measured: patching it in makes that gate FAIL with
        #     "step 17 predicate pnr_timing_repair_completeness_check: no
        #     trigger survives". The rc=2 tier does the same job without a hole.
        #   * the argument is the P&R DIRECTORY, because the published run
        #     whose defect this gate was written for names its script
        #     `pnr_fixed.tcl`. On the literal `pnr.tcl` the gate reached 5 of
        #     34 run roots and MISSED exactly that one; on the directory it
        #     reaches 6 and includes it.
        # BLAST RADIUS, measured over all 34 published phase-3 run roots:
        # 0 FAIL / 6 PASS / 28 rc=2 NOT CHECKED. No published run turns red.
        - program_exit_zero: "pnr_timing_repair_completeness_check phase3/stage3/pnr --json reports/phase3/pnr/timing_repair_completeness.json"
        - files_exist: ["phase3/stage3/pnr/placed.def"]
        - program_exit_zero: "placement_legality_check . --json reports/phase3/placement_legality.json"
    blocks_on: [16]

  # ── Step 18: Spare-cell + ECO-prep insertion (Design-for-ECO) ──
  # PROACTIVE Design-for-ECO. After detailed placement (Step 17) and
  # BEFORE CTS (Step 19), insert a DISTRIBUTED pool of spare standard
  # cells (inverter / nand2 / nor2 / dff / mux2 / aoi-oai mix) tied to
  # a known state via the PDK's tie-hi / tie-lo cells, plus reserve
  # spare/ECO IO pads when a pad ring exists. Every spare instance is
  # marked with a preserve attribute (yosys `keep` / OpenROAD
  # `set_dont_touch`) so NO optimization pass — opt_clean, remove_buffers,
  # repair_design, detailed-placement legalization, or metal fill —
  # removes or overlaps it. Spares are the late-stage ECO budget: a
  # metal-only fix can re-wire them without a full re-spin. Inserting
  # them here (post-place, pre-CTS) keeps them out of reach of logical
  # synth optimization while still letting CTS + route stitch around
  # them. Chip-AGNOSTIC: spare cell types + tie cells are discovered
  # from the PDK liberty, no chip-class literal.
  - id: 18
    name: "Spare-cell + ECO-prep insertion (Design-for-ECO)"
    stage: stage3
    required_inputs:
      - from: 17
        path: "phase3/stage3/pnr/placed.def"
    mcp_tools: [eda_pnr]
    programs:
      - spare_cell_coverage_check
    required_outputs:
      # `spare_cells.json` is the eda_pnr step's MEASUREMENT of the spare
      # pool it inserted. `spare_cell_coverage.json` is the GRADE of that
      # measurement, and `spare_cell_coverage_check` is its sole declaring
      # producer — the runner used to write it too, against the run's own
      # `--spare-density` instead of the gate's readiness floor, so one
      # path carried two verdicts and the last writer won. The insertion
      # step does not grade its own insertion.
      # docs/decisions/2026-08-22-spare-cell-coverage-declaring-producer.md
      - "phase3/stage3/pnr/spare_cells.json"
      - "reports/spare_cell_coverage.json"
    gate:
      all_of:
        - files_exist: ["phase3/stage3/pnr/spare_cells.json"]
        # Readiness: actual_density >= target, spares distributed across
        # core regions (not clustered), and all tied off.
        - optional_program_exit_zero:
            command: "spare_cell_coverage_check . --json reports/phase2/gates/spare_cell_coverage.json"
            condition_files_exist: ["phase3/stage3/pnr/spare_cells.json"]
            absent_condition_reason: >-
              The same gate OPENS with a hard `files_exist:
              [phase3/stage3/pnr/spare_cells.json]` clause, so an absent
              spare-cell manifest FAILs step 18 at that predicate before this
              clause is reached. The condition removes a duplicate failure; it
              hides none.
        # d5 — `spare_cell_preservation_check` USED TO BE WIRED HERE, with the
        # comment "fires only when a final artefact exists so the gate is a
        # no-op mid-flow". It did not: its trigger was `spare_cells.json`, THIS
        # STEP'S OWN output, so it fired at insertion time and then resolved
        # "the final artefact" by name — preferring `phase3/stage3/pnr/filled.def`
        # (step 34's declared output) and falling back to
        # `phase3/stage3/pnr/routed.def` (step 21's). Neither is in step 18's
        # closure and neither CAN be: 21 and 34 are step 18's descendants, so the
        # edge would close a cycle. On a fresh run there was no such artefact at
        # all; on a RESUMED run both survive from the previous run, so step 18 —
        # spare INSERTION, which runs before CTS, routing and fill — reported
        # spare-cell survival that this run had never established.
        #
        # Preservation is a property of the artefacts produced AFTER the passes
        # that can strip a spare, so the check now runs ONLY at step 34, where it
        # was already wired with the same trigger and where the closure contains
        # 19/20/21/32/34 — every pass whose optimisation the spares must survive.
        # Nothing was dropped: at step 18 this clause could only ever have read
        # steps 21/34's artefacts, which is precisely what step 34 reads, from a
        # position where the ordering is declared and enforced. The program also
        # now FAILs (RECORD_ARTEFACT_MISMATCH) when the name-bearing final
        # artefacts DISAGREE about which recorded spares they contain, so a
        # leftover `filled.def` can no longer vouch — through the survived-iff-
        # named-anywhere union — for a spare the shipped netlist has lost. That
        # test is on CONTENT, not mtime: the runner writes routed.def /
        # <top>.def / <top>_pnr.v from the OpenROAD tcl and only then
        # serialises spare_cells.json in the same step, so an
        # older-than-the-record rule would condemn every correct run.
        # Step 18 keeps its own question —
        # `spare_cell_coverage_check` (were enough spares inserted, distributed,
        # tied off) — which reads only step 18's own artefacts.
    blocks_on: [17]
    notes: |
      Spare-cell-array insertion is the cornerstone of Design-for-ECO:
      it pre-budgets unused, distributed, tied-off standard cells so a
      late-stage functional bug can be fixed with a metal-only ECO
      (re-wiring existing spares) instead of a full base-layer re-spin.
      The cells look like dead logic and WILL be stripped by any
      optimizer unless protected — the runner marks every spare with a
      keep / dont_touch attribute and excludes them from opt_clean /
      clean -purge / remove_buffers / repair_design, and Step 34 metal
      fill is constrained not to overlap or delete them.

  - id: 19
    name: "CTS (Clock Tree Synthesis)"
    stage: stage3
    required_inputs:
      - from: 17
        path: "phase3/stage3/pnr/placed.def"
      - from: 16
        path: "phase3/stage3/cts/clock_plan.json"
    mcp_tools: [eda_pnr]
    programs:
      - cts_quality_check
    required_outputs:
      - "phase3/stage3/pnr/post_cts.def"
      - "phase3/stage3/cts/clock_tree.rpt"
    gate:
      all_of:
        # File presence is a precondition (the checker also FAILs honestly
        # on absence, but keeping files_exist matches sibling Step 18 style).
        - files_exist: ["phase3/stage3/pnr/post_cts.def", "phase3/stage3/cts/clock_tree.rpt"]
        # Substance: clock_tree.rpt carries real clock-tree metrics (a parsed
        # latency/path-depth and, when present, a numeric skew), clock buffers
        # were actually inserted (count > 0, cross-checked report vs DEF),
        # every post_cts.def instance is PLACED/FIXED, and skew <= target when
        # the report/clock_plan states one. FAILs on the vacuous "CTS not
        # invoked" stub or zero buffers; never fabricates a skew limit.
        - program_exit_zero: "cts_quality_check . --json reports/phase3/gates/cts_quality.json"
    blocks_on: [18]

  - id: 20
    name: "🔁 Post-CTS hold fixing"
    stage: stage3
    required_inputs:
      - from: 19
        path: "phase3/stage3/pnr/post_cts.def"
    closed_loop:
      fallback_to: 19
      trigger: "Hold violation; insert delay cell or re-CTS"
    skills: [hold-fix]
    programs:
      - hold_closure_check
      - hold_area_budget_check
    program_outputs:
      - program: hold_area_budget_check
        path: "reports/phase3/pnr/hold_area_budget.json"
        verdict_field: verdict
    required_outputs:
      - "phase3/stage3/pnr/post_hold.def"
    gate:
      all_of:
        # The hold-area classifier currently has no reachable refusal path:
        # no producer writes the two area metrics it needs. Issue #1980 keeps
        # its structured NOT-CHECKED output visible as a program output above,
        # but excludes it from this gate denominator until a predicate exists.
        # File-presence precondition (kept, consistent with sibling Steps 21/23).
        - files_exist: ["phase3/stage3/pnr/post_hold.def"]
        # Substance: prove the Step-20 hold-FIXING step did real work — either a
        # parsed hold report with worst hold slack >= 0, OR (no report) the
        # post_hold.def provably differs from its pre-hold input post_cts.def
        # with a non-negative inserted-instance delta (hold buffers/delay cells
        # inserted). FAILs honestly on a negative-slack hold report, on a
        # post_hold.def byte-identical to post_cts.def (no fixing happened), and
        # on a missing/empty/garbage DEF. The canonical final hold sign-off is
        # Step 23 post-route STA — this gate only confirms Step-20 did real work.
        - program_exit_zero: "hold_closure_check . --json reports/phase3/pnr/hold_closure.json"
    blocks_on: [19]

  - id: 21
    name: "Routing (global + detailed)"
    stage: stage3
    required_inputs:
      - from: 20
        path: "phase3/stage3/pnr/post_hold.def"
    mcp_tools: [eda_pnr]
    required_outputs:
      - "phase3/stage3/pnr/routed.def"
      # OpenROAD's own provenance records this as the route invocation's
      # output, and Step 21 gates read it.  It is route evidence, not an
      # external input and not a Step-37.4 aggregation artefact.
      - "phase3/stage3/pnr/openroad.log"
      # The router-DRC report the phase-3 runner actually emits is
      # `routed.drc.rpt` (phase3_one_shot_runner.py, Step-21 emitter). Nothing
      # in the plugin has ever written `phase3/stage3/pnr/drc.rpt` — that
      # literal named a file no producer creates.
      - "phase3/stage3/pnr/routed.drc.rpt"
      # The canonicalised MIRROR of the line above, and this step's own gate
      # names it: `drc_report_check … --under reports/phase3/drc_router.rpt`.
      # That `--under` is what scopes the router-DRC audit to THIS step's
      # artefacts instead of letting Step 31's sign-off DRC carry it (see the
      # gate comment below), so if the mirror is silently not written the gate
      # loses half the evidence it was scoped to read and reports files_found
      # over the remainder — no error, less evidence. The runner writes it
      # inside the SAME `if openroad.log exists` block as the declared
      # `routed.drc.rpt`, two statements apart with no further condition
      # (phase3_one_shot_runner.py — `routed_drc.write_text(body)` then
      # `(rpt_phase3 / "drc_router.rpt").write_text(body)`).
      #
      # CORRECTED 2026-07-28. That paragraph was first written up as "this
      # entry is satisfiable exactly whenever the entry above is", which is
      # true of the CODE AT HEAD and false of the SHIPPED ROOTS — a claim
      # derived from the producer source without sweeping the evidence base.
      # MEASURED over all 6 tracked roots carrying
      # `phase3/stage3/pnr/routed.drc.rpt` (routed.drc.rpt / mirror):
      # espi Y/Y, lpc/phase3 Y/N, mdio Y/Y, sgmii Y/Y, caravel_user_project
      # Y/Y, subservient Y/Y. `benchmark-data/evaluation/phase1_parity/lpc/
      # phase3` carries the 19138-byte routed.drc.rpt and no mirror, so the
      # two are NOT co-satisfied on the shipped evidence. Step 21 is FAIL on
      # that root today for an unrelated reason (its gate's
      # `files_exist: [phase3/stage3/pnr/routed.def]` clause), so the entry
      # changes no verdict there — but the day that root's step 21 is fixed,
      # this entry turns it MISSING, and that is the honest reading: the
      # mirror the gate's own `--under` scopes to really was not written.
      - "reports/phase3/drc_router.rpt"
      # DECLARED because it became LOAD-BEARING, and D7 is what noticed.
      # `drc_report_check` has always written this JSON here — the gate below
      # names it with `--json reports/phase3/drc_router.json` — but nothing
      # outside step 21 read it, so an undeclared output stayed latent.
      # `general_precheck` delegates its KLayout-DRC rung to exactly this
      # report, and the moment it did,
      # `test_d7_required_outputs_list_is_complete[step21]` went red with
      # `[W1:gate_output_read_elsewhere] ... written by drc_report_check; read
      # by program:general_precheck`. The remedy for a load-bearing artefact a
      # step does not declare is to DECLARE it — not to stop reading it, and
      # not to waive the dimension that caught it.
      - "reports/phase3/drc_router.json"
    gate:
      all_of:
        - files_exist: ["phase3/stage3/pnr/routed.def"]
        # STEP-SCOPED. `eda_report_audit` discovers reports by project-wide
        # rglob, with no relationship to the step asking. Measured on the real
        # completed run campaign_pr427/spm/converge_ihp-sg13g2, this gate
        # reported files_found=5 and cited
        # `steps/31_physical_verification_drc_lvs_erc_density/drc_signoff.rpt`
        # — STEP 31's KLayout sign-off DRC — as the report its verdict was
        # reached over, with real_violation_total summed across all five. Both
        # directions are wrong: step 31's report can carry this gate when the
        # router's own is absent, and step 31's violations can fail routing.
        # `--under` restricts discovery to THIS step's own router-DRC
        # artefacts: the emitter's `phase3/stage3/pnr/routed.drc.rpt` (declared
        # above) and the canonicalised copy `reports/phase3/drc_router.rpt`,
        # both written by phase3_one_shot_runner's Step-21 emitter. Scoped, the
        # real run reports files_found=1 on routed.drc.rpt and still rc=0.
        #
        # BLAST RADIUS, measured over the 26 phase-3 roots under
        # benchmark-data/ic: 7 move rc 0 -> 1. Six are `<root>/reports`
        # pseudo-roots the enumeration produced (a gate is invoked with the
        # project root, not its reports/ subdir). The seventh,
        # `benchmark-data/ic/sha256`, is a genuine root holding NO router-DRC
        # report of its own — its PASS was earned entirely by the DRC reports
        # of the nested clean_run_* snapshots underneath it. rc=1 there is the
        # correct verdict, and it is the rc=1 path having been SEEN to execute.
        - program_exit_zero: "drc_report_check . --mode drc --under phase3/stage3/pnr --under reports/phase3/drc_router.rpt --json reports/phase3/drc_router.json"
        # Anti-fabrication: all 5 stage DEFs must be byte-distinct,
        # size-monotone, instance-count growing, and routed.def must
        # contain `+ ROUTED` geometry. Added 2026-04-22 after bench-a
        # pilot copied a3616_top.def to all 5 stage names.
        - program_exit_zero: "def_stage_progression_check . --json reports/phase3/pnr/def_progression.json"
        # Provenance required: routed.def must appear as a logged
        # openroad output (wrap OpenROAD invocation with provenance_logger).
        - program_exit_zero: "provenance_check . --output phase3/stage3/pnr/routed.def --tool openroad --require-measured"
        # vibe-ic#306/#297 — ADVISORY. This gate DISCLOSES a routability-for-
        # clock-quality trade (GRT-0273: clock NDR quietly dropped to let
        # routing close). It declares itself advisory, so before the advisory
        # slot existed it could not be wired at ALL — the only slots ran it as
        # blocking, contradicting its own declaration. It now RUNS on every
        # route and its verdict is printed and carried into the JSON report;
        # a finding does NOT fail the step.
        - advisory_program_exit_zero:
              command: "route_congestion_trade_disclosure ."
              advisory_reason: "CENSUS, correct permanently: it counts the nets from which global routing removed a non-default rule (GRT-0273) and how many are clock nets. A trade the router made is a disclosure about the run, not a defect the run introduced."
        # vibe-ic#828 part 2 — THIS GATE WAS NEVER WIRED. Its own header said
        # so: "It is not registered in flow/phase1_phase2_phase3.yaml and no
        # runner invokes it; its only caller is tools/ci/repo_hygiene_gates.sh".
        # A gate whose verdict is blocking and that no flow step runs
        # enforces nothing on a real design — it reproduces the defect in
        # seconds on a routed DEF and was never asked to. Wired on the step
        # that PRODUCES routed.def, so the metal it examines exists.
        #
        # BLOCKING and UNCONDITIONAL. Not `advisory_*`: that slot RECORDS a
        # finding and never fails the step (`_evaluate_gate`), and this gate's
        # rc=1 is a real defect in the emitted metal, so its verdict has to
        # decide step 21's. That is a DIFFERENT AXIS from the gate's own
        # `ENFORCEMENT:` line, which answers whether a RUNNER spawns it inline
        # and can stop the step as it happens: no runner does, the gate says so
        # in its header with the measurement behind the decision, and
        # `flow_gate_enforcement_audit` records that answer as advisory. The
        # two are one word apart and reading them as one is how a gate gets
        # moved into the advisory slot and silently defanged. MEASURED on this
        # tree: FOUR other gates already sit in this blocking slot while their
        # program declares advisory enforcement, so the slot has never followed
        # the declaration.
        #
        # Not condition-gated either, for the reason spelled out at step 15: the
        # reachability checker calls a `**/*.lef` trigger self-disabling, and a
        # gate skippable by the absence of its own subject is an orphan with
        # extra steps. Its refusals — an incomplete LEF set, discarded OBS
        # evidence, a truncated read, no LEF at all — arrive as rc=2 ->
        # VACUOUS_PASS and are disclosed, never a bare pass.
        - program_exit_zero: "macro_obs_geometry_intersect_check . --json reports/phase3/pnr/macro_obs_geometry.json"
    blocks_on: [20]

  # ── Step 22: Parasitic Extraction ──────────────────────────
  # Industry standard ⑪: RC extraction produces SPEF for accurate
  # post-layout STA, power, and SI analysis. Without SPEF, post-route
  # STA uses wire-load estimates — not real parasitics.
  - id: 22
    name: "Parasitic Extraction (RC → SPEF)"
    stage: stage3
    required_inputs:
      - from: 21
        path: "phase3/stage3/pnr/routed.def"
    mcp_tools: [eda_extraction]
    programs:
      - spef_extraction_check
    required_outputs:
      - "phase3/stage3/extracted/parasitic.spef OR phase3/stage3/extracted/*.spef"
    gate:
      all_of:
        - files_exist: ["phase3/stage3/extracted/*.spef"]
          any_of: true
        - program_exit_zero: "spef_extraction_check . --json reports/phase2/gates/spef_extraction.json"
        - program_exit_zero: "provenance_check . --output phase3/stage3/extracted/*.spef --tool magic,openroad --require-measured"
    blocks_on: [21]
    notes: |
      Coupling tiers (increasing accuracy, all DISCLOSED, none foundry-calibrated):
      (1) grounded-cap — OpenRCX v2 `-lef_rc` from tech-LEF R + area + fringe.
      (2) analytical lateral coupling — `_spef_coupling` parallel-plate Cc from
          routed DEF geometry + generic 180nm dielectric (the default augment).
      (3) FIELD-SOLVED coupling — `pdk_dielectric_fit` inverts the PDK's own
          area+fringe cap to a fitted dielectric stack, then `fastercap_extract`
          runs the OSS 3D BEM solver FasterCap on the routed geometry (lateral
          + inter-layer crossover the analytical model misses). Opt-in
          (eda_extraction field_solve); self-reports NOT_APPLICABLE if the
          solver is absent — never a fabricated matrix. Foundry field-solve
          (`rules.C`/`.nxtgrd`) + crosstalk-SI sign-off remain a foundry-data gap.
  # ── DT2 / DT3 DECLARATION ORDER (d5) ───────────────────────────
  # DT2 and DT3 are declared HERE, after Step 22 (Parasitic Extraction), and
  # not next to DT1 in the stage-2 block where they used to sit. They are
  # PHASE-3-TIME steps wearing a stage-2 label: DT2's own condition names
  # `phase3/stage3/extracted/*.spef` — Step 22's declared required_output —
  # plus the routed netlist, its notes describe OpenSTA on "the ROUTED netlist
  # + SPEF", and its producer is `phase3_one_shot_runner`. Declared at index
  # 14 against Step 22's 34, the true upstream could not be written down:
  # `blocks_on: [DT1, 22]` would have been a FORWARD edge. The condition made
  # DT2 self-skip when the SPEF was absent, which prevented a crash but NOT a
  # stale read — on a RESUMED project a SPEF left by the previous run made DT2
  # grade at-speed path delays against last run's parasitics, silently.
  # `stage:` is left at stage2 deliberately: the artefacts stay under
  # reports/phase2/dft/ and every consumer keyed on the stage label is
  # unaffected. Declaration ORDER is what carries the dependency.
  - id: DT2
    name: "Path-delay-fault (at-speed, timing-graded) ATPG"
    stage: stage2
    # A missing trigger is N/A only when the design's own DFT layer says so.
    # Otherwise these are declared dependency artefacts: their absence means
    # the upstream step did not deliver what DT2 consumes, and the compliance
    # report resolves it to MISSING + blocked-by-upstream with the step and
    # artefact named. This separates a no-DFT design from attempted/pre-route
    # DFT instead of making both SKIPPED-CONDITION (vibe-ic#1976).
    condition_kind: dependency_required
    condition_not_applicable:
      l_doc: L20
      applicability: [NOT_APPLICABLE, N/A, NA]
    condition:
      # TWO triggers, and they are exactly this step's own `blocks_on: [DT1, 22]`
      # written as artefacts: DT1's at-speed grade, and step 22's post-route
      # timing model. Self-skips (NOT_APPLICABLE) on a design with no DFT track,
      # and before Phase 3 has extracted parasitics.
      #
      # THIS WAS THE FLOW'S LAST BASELINED SELF-DISABLING CONDITION
      # (flow/flow_condition_reachability_baseline.json, owner vibe-ic#235).
      # It read
      #     files_exist: ["phase2/stage2/dft/cut_netlist.v",
      #                   "phase3/stage3/extracted/*.spef",
      #                   "phase3/stage3/pnr/*_pnr.v"]
      # as an ALL-of, so ANY one of the three going missing disarmed the step —
      # and `flow_condition_reachability_check` named exactly which two could go
      # missing SILENTLY: `cut_netlist.v` and `*_pnr.v`. Both are artefacts a
      # producer really writes that NO step in this file declares, so neither
      # absence is loud anywhere. `*.spef` was never part of the hole: it is
      # step 22's SOLE required_output and already carried a T3 backstop.
      #
      # THE ROOT CAUSE WAS DECLARATION-vs-PRODUCER, AND IT IS FIXED BY NAMING
      # DECLARED ARTEFACTS, NOT BY DECLARING THE UNDECLARED ONES. Both
      # declare-them alternatives were written, measured and REFUSED:
      #   * declare `*_pnr.v` as a hard files_exist on step 21 — REFUSED on the
      #     corpus sweep: the artefact is absent from 29 of 41 published routed
      #     run roots (it is not gitignored; the published cells simply do not
      #     carry it), so the declaration would newly FAIL 29 shipped cells.
      #   * declare `cut_netlist.v` at step 11, as a hard `any_of` of the cut
      #     netlist OR `dft_atpg_not_run.json` (the shape step 11's producer
      #     really guarantees) — REFUSED on measurement: over 491 dft dirs on a
      #     working host, 37 carry `scan_netlist.v` with NEITHER, and at least
      #     one of those is a real run root (`_scan/T1`) that disclosed only at
      #     the DT level (`transition_atpg_not_run.json`,
      #     `path_delay_atpg_not_run.json`, `sdd_atpg_not_run.json`) and never
      #     wrote a step-11 record. That predicate would fail a real run.
      #
      # WHY THIS SPELLING IS RIGHT AND NOT MERELY WHAT PASSES THE GUARD:
      #   * The two triggers ARE this step's `blocks_on: [DT1, 22]`, written as
      #     the artefacts those two steps DECLARE. Steps chaining on each
      #     other's declared outputs instead of each other's intermediates is
      #     the same repair DT1's own required_outputs note describes, and DT3
      #     one step later already uses exactly this spelling.
      #   * `*.spef` is step 22's SOLE required_output and step 22
      #     `blocks_on: [21]`, so a SPEF cannot exist unless routing PASSED.
      #     `*_pnr.v` therefore added no scoping — only a third way for DT2 to
      #     vanish. The missing-netlist case is guarded BY THE PRODUCER and
      #     better: `path_delay_fault_atpg_run._timing_inputs_present` returns
      #     NOT_APPLICABLE naming WHICH of (routed netlist, SDC, SPEF) is gone.
      #     The condition's silence names nothing.
      #   * `cut_netlist.v` is a REGENERABLE step-11 intermediate, not a timing
      #     input: `path_delay_fault_atpg_run` calls `_tdf._ensure_cut(...)`,
      #     which CREATES the cut from the netlist when it is absent. DT1 owns
      #     that input and already handles its absence properly (any_of +
      #     `transition_atpg_not_run.json`).
      #
      # WHY `reports/phase2/dft/transition_coverage.json` AND NOT
      # `cut_netlist.v`. Both express "the DFT at-speed track really ran", and
      # only one of them is backstopped: `transition_coverage.json` is DT1's
      # SOLE required_output, so if it disappears DT1 itself goes MISSING and
      # says so, while `cut_netlist.v` is declared nowhere and can vanish in
      # silence. It is also the SAME spelling DT3 already uses one step later
      # (DT3's condition is path_delay_coverage.json + transition_coverage.json),
      # so the three DT steps now chain on each other's declared grades rather
      # than on each other's undeclared intermediates.
      # This trigger is what keeps a NO-DFT design out of DT2: a routed and
      # extracted design that never ran scan has no `transition_coverage.json`,
      # DT1 self-skips, and DT2 self-skips beside it instead of taking a hard
      # MISSING for a grade nobody asked for
      # (`test_a_routed_extracted_design_with_no_dft_does_not_arm_dt2`).
      #
      # THE 2026-07-28 WITHDRAWAL IS NOT RE-RUN HERE. That change replaced this
      # ALL-of with an any-of over the PRODUCER'S OWN OUTPUTS and was correctly
      # withdrawn for moving the self-disable to the output side. This change
      # adds no arm at all: removing paths from an ALL-of can only make the
      # condition arm LATER, never earlier, so the output-side self-disable it
      # was withdrawn for cannot arise. MEASURED, single-step DT2 flow, 8
      # fixtures + 3 real run roots, stock vs this spelling:
      #   pre_route (DT1 graded, nothing routed)
      #                                    SKIPPED-CONDITION -> unchanged
      #       <- the exact case the 2026-07-28 withdrawal was protecting
      #   no_dft_routed / routed_no_cut (routed+extracted, NO DFT at all)
      #                                    SKIPPED-CONDITION -> unchanged
      #       <- no false alarm on a design that never asked for at-speed ATPG
      #   routed_full (everything + grade)  PASS             -> unchanged
      #   routed_nograde (everything, no DT2 grade)
      #                                     MISSING rc 1     -> unchanged
      #   cut_lost (DT1 graded, routed+extracted, cut netlist gone, no DT2 grade)
      #                                    SKIPPED-CONDITION -> MISSING rc 1
      #   routed_no_pnrv_nog (DT1 graded, no *_pnr.v, no DT2 grade)
      #                                    SKIPPED-CONDITION -> MISSING rc 1
      #   routed_no_pnrv (DT1 graded, no *_pnr.v, DT2 GRADED)
      #                                    SKIPPED-CONDITION -> PASS
      #   benchmark-data/ic/spm/v1.5.58_ihp-sg13g2 (a PUBLISHED converged cell
      #       carrying a genuine 16-of-16 robust at-speed PASS)
      #                                    SKIPPED-CONDITION -> PASS
      #   benchmark-data/ic/spm/v1.10.18_sky130A (DT1 graded, never routed)
      #                                    SKIPPED-CONDITION -> unchanged
      #   benchmark-data/evaluation/phase1_parity/sgmii (routed+extracted, no DFT)
      #                                    SKIPPED-CONDITION -> unchanged
      # Nothing went PASS -> FAIL. Two silent skips became loud, two real
      # at-speed grades the old condition threw away are now reported, and every
      # legitimately-inapplicable tree still self-skips.
      files_exist: ["reports/phase2/dft/transition_coverage.json",
                    "phase3/stage3/extracted/*.spef"]
    programs:
      - path_delay_fault_atpg_run
      - path_delay_coverage_check
    # See the DT1 note: the measurement alone, single-branch, so its absence is
    # loud and can back DT3's condition.
    required_outputs:
      - "reports/phase2/dft/path_delay_coverage.json"
    gate:
      # produce/validate split (mirrors Step 11 / DT1): the RUNNER produces
      # path_delay_coverage.json (phase3_one_shot_runner, once the routed
      # netlist + SPEF exist); the flow GATE only VALIDATES it (independent
      # per-path recount — a false/held/aborted path can never count as
      # sensitised; the RECOMPUTED coverage governs).
      program_exit_zero: "path_delay_coverage_check . --json reports/phase2/dft/path_delay_coverage_gate.json"
    # `22` is a DATA dependency: the condition above names Step 22's declared
    # `phase3/stage3/extracted/*.spef`, and the whole point of DT2 is grading
    # path delays against REAL post-layout parasitics. Declaring it is what
    # lets `flow_step_execution_coverage_check` refuse a DT2 PASS whose
    # ancestor 22 never passed (rc=1) — previously the only protection was
    # DT2's self-skip condition, which a PREVIOUS run's SPEF satisfies.
    blocks_on: [DT1, 22]
    notes: |
      At-speed timing-graded PDF ATPG: OpenSTA reports the K longest
      LOC-launchable max-delay paths on the ROUTED netlist + SPEF + SDC (real
      post-layout timing), then per path a 2-frame LOC miter on the DT1
      flat core asserts start-flop-launch AND endpoint-capture via yosys
      `sat -prove` (the 2-pattern = DET; proven-none = false/held, excluded).
      Robust grade = single-input-change miter (only the start flop toggles).
      DISCLOSED residuals: top-K only (exhaustive PDF is exponential);
      PI-launched paths are not LOC-testable (held PIs) and are excluded,
      never counted; SIC reconvergent-fanout is the known robustness residual.

  - id: DT3
    name: "Small-delay-defect (SDD) at-speed grade"
    stage: stage2
    # Same explicit-N/A/dependency split as DT2. If DT2 fails or never emits
    # its grade, DT3 is blocked by DT2; it is not silently inapplicable.
    condition_kind: dependency_required
    condition_not_applicable:
      l_doc: L20
      applicability: [NOT_APPLICABLE, N/A, NA]
    condition:
      # Fuses DT1 transition faults + DT2 per-path slack. It self-skips only
      # for the explicit design declaration above; a missing upstream grade is
      # a named dependency block.
      files_exist: ["reports/phase2/dft/path_delay_coverage.json",
                    "reports/phase2/dft/transition_coverage.json"]
    programs:
      - sdd_atpg_run
      - sdd_coverage_check
    # See the DT1 note: the measurement alone, single-branch.
    required_outputs:
      - "reports/phase2/dft/sdd_coverage.json"
    gate:
      # produce/validate split (mirrors DT1/DT2): the RUNNER produces
      # sdd_coverage.json (phase3_one_shot_runner, after DT2); the flow GATE
      # only VALIDATES it. DESCRIPTIVE grade with NO floor — a slack-rich
      # design honestly scores low (small delays masked by margin); the gate
      # independently RE-DERIVES margin=period*fraction and the strong/weak
      # buckets so a doctored margin or a strong-with-high-slack fabrication
      # FAILs. It never fails on a low coverage number.
      program_exit_zero: "sdd_coverage_check . --json reports/phase2/dft/sdd_coverage_gate.json"
    blocks_on: [DT2]
    notes: |
      Small-delay-defect grade: each DT2 top-K sensitisable path is one
      at-speed transition fault graded by its REAL OpenSTA post-layout SLACK
      (strong = detected through a path whose slack <= a DISCLOSED margin =
      margin_fraction*clock_period, default 0.10; weak = detected but
      slack > margin; undetected-at-speed = not sensitisable). Slack-weighted
      coverage = mean sdd_weight. Anchored at the scan-flop endpoint (the only
      namespace common to the routed-STA and gate-SAT worlds). DISCLOSED
      residual: STA-slack-graded, NOT a per-defect-size SPICE credit like a
      full commercial SDD flow.


  - id: 23
    name: "🔁 Post-route STA (multi-corner multi-mode sign-off)"
    stage: stage3
    required_inputs:
      - from: 22
        path: "phase3/stage3/extracted/parasitic.spef OR phase3/stage3/extracted/*.spef"
      - from: 7
        path: "phase2/stage2/constraints/*.sdc"
      - from: 7
        path: "phase2/stage2/constraints/pvt_matrix.json"
    closed_loop:
      fallback_to: 32
      trigger: "Setup/Hold violation; post-route timing repair required"
    skills: [sta-review]
    mcp_tools: [eda_sta]
    required_outputs:
      - "phase3/stage3/sta/post_route_timing.rpt"
      # Emitted by Step 23's SPEF-backed STA pass and mirrored here.  Step
      # 37.4 consumes it when aggregating metrics, but consumption does not
      # transfer producer ownership to that later step.
      - "reports/phase3/sta_spef_based.rpt"
      - "reports/phase3/sta/post_route_summary.json"
      # The timing RECORD-completeness verdict. Like post_route_summary.json
      # above it is BOTH this step's own unconditional gate `--json` target AND
      # a `_DECLARED_SIGNOFF_GATES` output `phase3_one_shot_runner` runs inline
      # and blocks on — so it is read by a program other than its writer, and
      # nothing declared it. `check_step` re-probes a step's own gate `--json`
      # target after the gate has run, and this clause is a plain
      # `program_exit_zero` (no condition), so the gate always gets its chance.
      #
      # WHAT THE ENTRY DOES AND DOES NOT DO, corrected 2026-07-28 after a
      # sweep over ALL 29 tracked roots carrying a runner marker instead of
      # only the 8 anchored on post_route_timing.rpt. On those 8 the verdict is
      # byte-identical with and without it (5 PASS -> PASS, 3 FAIL -> FAIL) —
      # that part held. It is NOT verdict-neutral overall: the three spm roots
      # carry this json and no post_route_timing.rpt, so declaring it supplies
      # the evidence that lets step 23's gate run at all and they move
      # MISSING -> FAIL, from "nothing to say" to a named STA defect. And it
      # does NOT make the artefact's absence red on a run that lacks it: the
      # post-gate re-probe credits the copy this step's OWN gate wrote during
      # the audit. That self-certification is pre-existing and flow-wide. The
      # checker now tags the recreated file audit_created, excludes it by
      # default, and reports the missing pre-audit producer as a wiring gap.
      - "reports/phase3/sta/sta_corner_record_completeness.json"
      # The post-route SIGN-OFF CORNER verdict — same shape as the entry above
      # and declared with it under #1215.
      #
      # `post_route_signoff_corner_check . --json reports/phase3/sta/
      # post_route_signoff_corner.json` is this step's own gate clause below,
      # so the path exists only as an `--json` ARGUMENT: no Python write
      # position names it, the AST oracle reported "no producer", and W2
      # dropped it as externally supplied. The write ledger observed the run
      # writing it. The step's own comment at the gate already names
      # `post_route_signoff_corner_check` as the clause that keeps step 23 FAIL
      # on a real violation, so this is a verdict the flow reads and did not
      # declare.
      #
      # THIS ONE CHANGES NO CELL COLOUR AND IS DECLARED ANYWAY. Step 23's
      # dimension-7 cell is already red and WAIVED, so the promotion moves that
      # cell's finding count (13 -> 14) and not its state. Leaving it as the
      # one undisposed promotion would have left the #1215 pin unmovable for a
      # finding nobody would ever see — the exact "discovered later from a cell
      # that quietly changed colour" failure the pin exists to prevent, in its
      # other direction.
      #
      # BLAST RADIUS, `check_step` over the 10 manifest run roots that resolve
      # here, with and without: **2 move, both VACUOUS_PASS -> MISSING**
      # (`phase1_parity/espi`, `ic/caravel_user_project`). Neither is a root
      # the flow calls whole — measured over all 63 steps BEFORE this change,
      # espi already reports 28 FAIL/MISSING steps and caravel_user_project 23,
      # so no Overall verdict moves. VACUOUS_PASS -> MISSING is the direction
      # this dimension exists to produce: a step that passed while evidencing
      # nothing now names what it did not produce. It RESOLVES in three
      # admissible run roots (caravel_user_project/v1.9.43_sky130A,
      # sha256/clean_run_v1427_20260715, spm/v1.9.96_gf180mcuD).
      - "reports/phase3/sta/post_route_signoff_corner.json"
      # WITHDRAWN, NOT FORGOTTEN — the two multi-corner STANCE files
      # (`reports/phase3/multi_corner_spef_stance.json`,
      # `reports/phase3/mcorner_ocv_stance.json`) belong here on the merits:
      # this step's own sub-gate `sta_corner_record_completeness_check` reads
      # them, and nothing in the flow declares them. They are held back from
      # THIS change because the cost was mis-scoped, and the honest cost is
      # large enough to need its own decision. Re-measured over every tracked
      # root (`git ls-files benchmark-data`), not just `benchmark-data/ic`:
      #
      #   post_route_timing.rpt (already declared)  8 roots
      #   both stance files present                 7 roots
      #   newly MISSING if declared here            6 roots
      #     benchmark-data/ic/caravel_user_project
      #     benchmark-data/ic/subservient
      #     benchmark-data/evaluation/phase1_parity/espi
      #     benchmark-data/evaluation/phase1_parity/lpc/phase3
      #     benchmark-data/evaluation/phase1_parity/mdio
      #     benchmark-data/evaluation/phase1_parity/sgmii
      #
      # i.e. 6 of the 8 roots that carry this step's already-declared artefact
      # would start reporting MISSING — a majority, and four of them were
      # excluded from the original count only because it stopped at
      # `benchmark-data/ic`. `phase1_parity/*` is equally tracked and carries
      # real phase-3 artefacts. See the PR body for the split-out item.
      #
      # NOT declared, deliberately:
      #   phase3/stage3/sta/sta_mcorner_ocv.rpt — written only when the PDK's
      #     ss and ff process libraries genuinely differ; a single-liberty PDK
      #     legitimately produces none, and its absence is DISCLOSED in
      #     mcorner_ocv_stance.json (`report: null`).
      #   phase3/stage3/sta/sta_spef_based.rpt — conditional on a non-empty
      #     SPEF, and extraction has a documented tool-unavailable waiver path.
    gate:
      all_of:
        # vibe-ic#1097 S8 — "asked" and "reached" must BOTH be on disk.
        #
        # The period a design is ASKED for arrives through a four-tier
        # precedence walk whose last tier is fabricated
        # (`l8_sta_clock_period_design_owned_check`); every tier is a REQUEST.
        # The achieved period is the only MEASUREMENT in that set. This step is
        # where the slack that yields it exists, so this is where its absence is
        # decidable.
        #
        # ADVISORY, and not out of timidity: a run whose STA produced no setup
        # slack has nothing to record and returns rc 2 (VACUOUS_PASS) rather
        # than a verdict. rc 1 is reserved for the one implication this gate
        # asserts — a slack EXISTS and the achieved period does not. MEASURED at
        # f9c13443 over the published corpus: 13 roots reached post-route STA,
        # 2 carried `achievable_fmax.json`, and four cells ship a real headroom
        # (caravel 17.22 ns, spm/gf180mcuD 15.83, spm/ihp-sg13g2 6.81,
        # spm/sky130A 5.24) with no achieved period beside it. Those four go
        # ADVISORY-red here and are repaired going forward by the runner change
        # that emits on PASS as well as on FAIL.
        - advisory_program_exit_zero:
              command: "achieved_period_recorded_check . --json reports/phase2/gates/achieved_period_recorded.json"
              advisory_reason: "NOT-YET-CLEAN: this gate CAN refuse and is wired advisory as a ratchet position, not as a verdict. Notch measured rc 1 on a real spm run (2026-08-31): it REFUSES TODAY on real input; the advisory slot is currently swallowing a live finding. Promote to blocking once this run is clean."
        # HOLD IS WORST AT THE FAST CORNER. `sta_corner_record_completeness_check`
        # below judges each declared corner "for the ROLE it was declared to
        # serve" — it never asks whether assigning the HOLD role to a non-fast
        # corner is legitimate in the first place. Nothing wired did, and this
        # gate — which asks exactly that — had never run outside its own unit
        # test. Measured consequence on a real published run: the runner's
        # fallback `hold_label = "FF" if "FF" in corner_libs else "TT" if "TT"
        # ...` resolved to TT on a PDK with no fast liberty, the run recorded
        # `hold_process_corner: "TT"`, and every wired gate accepted the role.
        #
        # UNCONDITIONAL, for the reason this step's own comment already gives
        # about its sibling: gating a corner gate on the corner artefact is how
        # an unreported corner became indistinguishable from a met one. The
        # gate carries an rc=2 NOT-CHECKED tier for a run that produced no hold
        # sign-off record at all, so the unconditional wire costs nothing;
        # without that tier an unconditional wire reddened 31 of 33 roots for
        # INPUT_MISSING, which is why the tier was added in the same change.
        # It judges BOTH the DECLARED stance
        # (reports/phase3/mcorner_ocv_stance.json) and the run's hold STA
        # script, and takes the WORST. The stance alone is not enough: it is
        # durable when the Tcl is pruned from a published run, but it is a
        # LABEL, and the first wiring of this gate returned the moment the
        # label existed and never opened the script. Demonstrated — a stance
        # reading `hold_process_corner: "FF"` beside a script whose only
        # liberty is `…__ss_…` and whose own banner reads `process=SS` gave
        # rc=0 PASS on the project directory and rc=1 FAIL on the identical
        # Tcl. See the program docstring's "A DECLARED FIELD DOES NOT OUTRANK
        # THE EVIDENCE IT CLAIMS TO SUMMARISE". The worst-of repair leaves the
        # corpus radius below UNCHANGED: the 2 roots that publish BOTH
        # artefacts (sha256/clean_run_v1422…, …v1427…) are honest — stance FF,
        # script FF — and still PASS.
        #
        # FIRST in the `all_of`, deliberately, and this one HAS a cost worth
        # stating: `_evaluate_gate` short-circuits on the first failing
        # sub-gate, so wired last this gate did not execute on 4 of 5 sampled
        # published runs. Wired first it executes whenever step 23 is evaluated
        # at all. On every root where it PASSes or returns rc=2 each sibling
        # still runs exactly as before; only on a root where it FAILs do the
        # siblings stop reporting, and there the step is FAIL either way.
        #
        # BLAST RADIUS, two numbers because they answer two questions:
        #   * invoked directly on all 34 published phase-3 run roots:
        #     1 FAIL / 7 PASS / 26 rc=2 NOT CHECKED. The single FAIL is
        #     benchmark-data/ic/edge_llm_accel (hold_process_corner "TT").
        #   * inside flow_compliance_check over the same corpus: 0 red. Only
        #     11 of the 34 roots carry any of step 23's declared
        #     required_outputs, so `check_step` marks the step MISSING on the
        #     rest and never evaluates this gate there — and edge_llm_accel is
        #     one of the 23 that do not. On the 11 that ARE evaluated this gate
        #     returns 6 PASS and 5 rc=2.
        # So no published run changes its step VERDICT, and the one true
        # finding surfaces on a live run rather than on the pruned tree.
        - program_exit_zero: "hold_corner_coverage_check . --json reports/phase3/sta/hold_corner_coverage.json"
        - files_exist: ["phase3/stage3/sta/post_route_timing.rpt"]
        # `--mode` is a report CLASS, not a directory — see step 10. The
        # declared `phase3/stage3/sta` is not an eda_report_audit choice and
        # survived only because the wrapper discarded the caller's argv, which
        # is also why the `reports/phase3/sta/post_route_summary.json`
        # required_output above had no producer anywhere in the plugin.
        #
        # STEP-SCOPED — see step 10 for the mechanism and the measurement.
        # This clause is the NOMINAL-corner gate; the comment directly below
        # says so in its own words ("the nominal-corner gate above never
        # consumes the ABSOLUTE worst-setup / worst-hold slack across ALL
        # sign-off corners"). Unscoped it was silently doing the multi-corner
        # job too, by accident, over every STA report in the project —
        # including step 10's pre-layout report and step 32's POST-REPAIR
        # `sta_mcorner_ocv_postrepair.rpt`. That is why this gate and step 10's
        # produced byte-identical summaries on a real run.
        #
        # WHAT THIS LICENSES, stated before the change and then verified:
        # the multi-corner responsibility moves entirely onto the two clauses
        # below, which is where the flow already declared it. VERIFIED per
        # root, not assumed — on both `benchmark-data/ic/sha256/
        # clean_run_v142{2,7}_20260715` this clause moves rc 1 -> 0 and step 23
        # STAYS FAIL, because `post_route_signoff_corner_check` returns rc 1
        # ("setup worst-slack -8.830 / -1.710 ns at the sign-off (max-RC)
        # corner is VIOLATED") and `sta_corner_record_completeness_check`
        # returns rc 1 ("SIGN-OFF corner 'SS' ... setup -67.610 / -51.460 ns").
        # No root in the corpus moves step 23 from FAIL to PASS. If a future
        # root ever does, the fix is wrong and must be reverted, not waived.
        - program_exit_zero: "sta_report_check . --mode sta --under phase3/stage3/sta/post_route_timing.rpt --json reports/phase3/sta/post_route_summary.json"
        # #147 — the nominal-corner gate above never consumes the ABSOLUTE
        # worst-setup / worst-hold slack across ALL sign-off corners, so a slow
        # (max-RC) corner setup violation could ship as a PASS while the flow's
        # own TAPEOUT-SIGNOFF multicorner report showed `worst slack max -1.71`.
        # This OPTIONAL sub-gate FAILs Step 23 on a negative worst-slack at any
        # sign-off corner (setup @ max-RC / hold @ min-RC); it self-skips
        # (NOT_APPLICABLE rc 0) when no multicorner report was produced, so it is
        # backward-compatible. A reviewed acceptance goes through waivers.json.
        - optional_program_exit_zero:
            command: "post_route_signoff_corner_check . --json reports/phase3/sta/post_route_signoff_corner.json"
            condition_files_exist: ["phase3/stage3/sta/sta_spef_multicorner.rpt"]
            absent_condition_reason: >-
              SEMANTIC BACKSTOP, and stated as such. This condition IS the
              self-disabling shape (#210 instance 1): an absent multicorner
              report is exactly the defect. It was repaired not by changing
              this predicate but by adding the UNCONDITIONAL companion
              sta_corner_record_completeness_check to this same step, which
              starts from the corners the FLOW declared and FAILs when the
              record does not account for each of them. Keeping the condition
              here only avoids a duplicate failure.
        # The timing RECORD-completeness gate. The sub-gate above is
        # `condition_files_exist`-gated on the very report whose ABSENCE is the
        # defect: when no multicorner report exists the condition is false, the
        # gate never runs, and Step 23 passes — so an unreported corner is
        # indistinguishable from a met one. That is how a -4.33 ns slow-corner
        # setup violation reached a campaign ledger that carried no STA column
        # at all. This gate is therefore UNCONDITIONAL: it starts from the
        # corners the flow DECLARED (the mcorner-OCV / multi-corner-SPEF stance
        # files and pvt_matrix.json) and FAILs when the record does not account
        # for each declared sign-off corner in the role it was declared to
        # serve, when a reported corner is characterised only half-way, or when
        # any sign-off corner violates — a typ-only "MET" never carries the run.
        # A run that declares and records no corner at all self-reports
        # NOT_APPLICABLE (rc 0), so pre-phase3 and analog runs are unaffected.
        - program_exit_zero: "sta_corner_record_completeness_check . --json reports/phase3/sta/sta_corner_record_completeness.json"
        # vibe-ic#306 — a route promoted on its OWN in-session re-measurement
        # must be corroborated by the sign-off report it claims to improve
        # (#293: the promotion read 330->178 while this step's own
        # sta_mcorner_ocv.rpt went 4->219, and the reroute merged a spare-tie
        # net into an unrelated signal net). The gate declares
        # `ENFORCEMENT: blocking` and was wired NOWHERE — not here, not in a
        # runner — so it ran only by hand. It belongs on THIS step because it
        # reads the same sign-off report `sta_corner_record_completeness_check`
        # reads, from the same candidate paths, so the two cannot diverge.
        # Blocking slot: measured over the 15 published run-roots under
        # benchmark-data/ic it blocks 0 (every one VACUOUS_PASS — no promotion
        # happened), and rc=2/VACUOUS is the non-blocking tier by convention.
        # That measurement is RESTATED here, not dropped, because it is exactly
        # the measurement that motivates the wiring below: a clause that blocks
        # 0 of 15 while costing the whole step is the defect.
        #
        # ENFORCEMENT: BLOCKING, and still blocking after the rewiring below —
        # when a promotion DID happen the condition matches, the program runs,
        # and a contradicted or uncorroborated promotion still FAILs the step.
        #
        # OPTIONAL SLOT, not because the check is optional but because its
        # SUBJECT is. This gate corroborates a route promoted by
        # `signoff_spef_repair`; when no promotion happened there is no promoted
        # route to corroborate, and the gate says so itself — its own verdict
        # table makes `VACUOUS_PASS / no promotion happened this run` the normal
        # outcome, and `test_issue306_register_paydown` measures 0 of 15
        # published run-roots carrying the marker.
        #
        # Wired as a mandatory clause that normal outcome cost the whole step:
        # step 23 is a SIGN-OFF step (`_SIGNOFF_RE` matches "post-route STA"), so
        # one vacuous clause beside four substantive ones made the step
        # PARTIALLY-VACUOUS — a qualified-done tier — and
        # `_blocks_when_vacuous` then voided every downstream done-claim.
        # MEASURED on spm@1.14.30: steps 32, 34 and 35 landed
        # PASS_VOIDED_BY_DEPENDENCY naming this clause, on a run with FAIL=0.
        # The step's own `observed` line read
        #   "PARTIALLY-VACUOUS (1 of 5 gate clause(s) examined nothing):
        #    drv_promotion_corroboration_check ..."
        # A design cannot make that go away, so the flow could not reach PASS on
        # any run where no route promotion happened — which is the usual case.
        #
        # `absent_condition_reason` is the W4 declaration that BUYS the
        # not-applicable: the clause states at its own wiring site why an absent
        # input is genuine, is disclosed as
        # "NOT-APPLICABLE (declared, N of M gate clause(s) here examined
        # nothing)", and does not move the tier. Deleting the clause deletes its
        # exemption with it. Both `_PNR_DIRS` the gate itself searches are
        # listed for BOTH filenames, so the condition and the program can never
        # disagree about where either artefact lives.
        #
        # -- THE FOURTH AND FIFTH TRIGGER (vibe-ic#220) --------------------
        # `drv_promotion_not_run.json` is the producer's own "I did not promote,
        # and here is why" record. Adding it is what makes this clause REACHABLE
        # instead of self-disabling, and it is a PRODUCER change, not a label:
        # `step_signoff_spef_repair` now writes the record on every one of its
        # five non-promotion returns (no_base_route / tool_unsupported /
        # precondition_unmet / producer_execution_error / repair_declined) and
        # DELETES it on the promotion branch, so after the step has run exactly
        # one of {marker, record} exists. Before that change the non-promotion
        # branches wrote NOTHING, so "no promotion happened" and "the promotion
        # ran and died before `shutil.copy2`" left byte-identical evidence and
        # the gate called both VACUOUS_PASS. MEASURED over 45 real run roots on
        # a working host: `routed_base_prerepair.def` is present in 0 of them,
        # so the branch that left no evidence was not the corner case, it was
        # every run.
        #
        # WHY THIS DOES NOT RE-CREATE THE VACUITY DEFECT. The 2026-08-31
        # measurement (`measure(step23)`, v1.14.49) established that the T2
        # shape as usually prescribed -- arm on the record, let the clause run
        # -- made the clause return VACUOUS_PASS on the normal day, which
        # promoted step 23 to PARTIALLY-VACUOUS and voided 10 downstream steps.
        # That conclusion was correct ABOUT THE GATE AS IT THEN WAS. The gate is
        # now different: reading the producer's record is an EXAMINATION, and
        # `drv_promotion_corroboration_check` answers a real PASS on it, naming
        # the recorded reason. VACUOUS_PASS is now reserved for the one state
        # where nothing was examined -- neither marker nor record, i.e.
        # `step_signoff_spef_repair` never ran at all. So the clause runs, says
        # something true, and does not move the tier. Both landed doctrines
        # (reachability #210/#219; vacuity #901/#1115) are satisfied without
        # either giving way -- the collision was between the doctrines and a
        # gate that could only INFER, not between the doctrines.
        - optional_program_exit_zero:
            command: "drv_promotion_corroboration_check . --json reports/phase3/sta/drv_promotion_corroboration.json"
            condition_files_exist:
              - "phase3/stage3/pnr/routed_base_prerepair.def"
              - "pnr/routed_base_prerepair.def"
              - "phase3/stage3/pnr/drv_promotion_not_run.json"
              - "pnr/drv_promotion_not_run.json"
            absent_condition_reason: "no route promotion happened this run, so no promoted route exists whose claimed improvement the sign-off report could corroborate; the gate's own verdict table makes this its normal outcome and the marker is measured at 0 of 15 published run-roots"
    blocks_on: [22]

  - id: 24
    name: "🔁 IR Drop (static + dynamic)"
    stage: stage3
    required_inputs:
      - from: 21
        path: "phase3/stage3/pnr/routed.def"
      - from: 15
        path: "phase3/stage3/pnr/pdn.tcl OR phase3/stage3/pnr/pdn.done"
    closed_loop:
      fallback_to: 15
      trigger: "IR drop > 5%; PDN strengthen"
    skills: [ir-drop-triage]
    required_outputs:
      - "reports/phase3/ir_drop.rpt"
      - "reports/phase3/ir_drop.json"
      # The audit trail this step's own gate writes (below). Moving the audit
      # off the producer's `ir_drop.json` created a NEW undeclared artefact, in
      # a change whose whole subject is undeclared artefacts — so it is
      # declared here. It is satisfiable on the FIRST evaluation because
      # `flow_compliance_check` re-probes exactly those declared entries that
      # this step's own gate produces via `--json`, after the gate has run;
      # without that re-probe this entry would report MISSING on run 1 and PASS
      # on run 2, and a verdict that depends on how many times it has been
      # evaluated is not a measurement.
      - "reports/phase3/ir_drop_signoff.json"
      # The VECTORED DYNAMIC IR verdict, declared under #1215. This is the one
      # promotion of the four that BOTH adjudications of the write-record
      # tripwire agreed on: the closed #1077 named it "a real defect" and the
      # closed declare-camp PRs added the identical line.
      #
      # WHY THE AST COULD NOT SEE IT. `dynamic_ir_vectored_emit.py` writes it
      # at :567/:591/:608/:634 as `out_json.write_text(...)`, where `out_json`
      # is a FUNCTION PARAMETER — `matrix_d7_artifact_graph.RESOLUTION_LIMITS`
      # entry 1 exactly. A Python program really does write it and the AST
      # index cannot resolve the path, so W2 dropped it as "externally supplied
      # by design", which is a claim this flow's own gate contradicts one key
      # below: `dynamic_ir_drop_check` names the path POSITIONALLY and exits 1
      # when it is absent, so no passing run can lack it.
      #
      # BLAST RADIUS, `check_step` over the 10 manifest run roots that resolve
      # here, with and without: **3 move, all VACUOUS_PASS -> MISSING**
      # (`phase1_parity/espi`, `ic/caravel_user_project`, `ic/subservient`).
      # All three are already FAIL overall before this change (28, 23 and 40
      # FAIL/MISSING steps respectively, measured across all 63 steps), so no
      # root the flow currently calls whole is reddened. It RESOLVES in four
      # admissible run roots (caravel_user_project/v1.9.43_sky130A,
      # sha256/clean_run_v1427_20260715, spm/v1.5.58_ihp-sg13g2,
      # spm/v1.9.96_gf180mcuD), so declaring it closes the d7 finding without
      # opening a d3 one.
      - "reports/phase3/dynamic_ir.json"
    gate:
      all_of:
        # OUTPUT-PATH COLLISION (same shape as step 25's, fixed with it in
        # PR #473 and completed here). This declared
        # `--json reports/phase3/ir_drop.json`, which is the PRODUCER's file:
        # `step_canonicalize_artefacts` → `_emit_ir_em_reports` writes the PSM
        # measurement there (worst_ir_uv / budget_uv / verdict) and the runner
        # reads it back as this step's evidence — it is also this step's own
        # required_output above. It survived only because the wrapper discarded
        # the caller's argv; now that the flag is honoured, the audit verdict
        # goes to a SEPARATE file or the checker destroys what it audits.
        - program_exit_zero: "ir_drop_report_check . --mode ir_drop --json reports/phase3/ir_drop_signoff.json"
        # v1.3.96 — VCD-vectored DYNAMIC IR (OpenROAD PSM read_vcd + activity-
        # weighted analyze_power_grid). Blocks on a real budget when a design
        # VCD exists; a genuinely-absent VCD → SKIPPED_CONDITION rc 0 (never
        # blocks the pure-digital majority). Full di/dt transient stays a
        # documented commercial gap (ADVANCED_NODE_EXTENSION.md).
        - program_exit_zero: "dynamic_ir_drop_check reports/phase3/dynamic_ir.json --budget-pct 10"
    blocks_on: [22]

  - id: 25
    name: "🔁 EM check (electromigration lifetime)"
    stage: stage3
    required_inputs:
      - from: 21
        path: "phase3/stage3/pnr/routed.def"
      - from: 24
        outputs: all
    closed_loop:
      fallback_to: 21
      trigger: "EM violation; widen wire or re-route"
    # em-check never shipped. ir-drop-triage does, and it is the EM skill
    # under its shipped name: "Triage static and dynamic IR-drop and
    # electromigration (EM) reports from power signoff tools".
    skills: [ir-drop-triage]
    required_outputs:
      - "reports/phase3/em.rpt"
      # The MEASUREMENT (`verdict: MEASURED`, max_segment_current_A,
      # segments_analysed) the runner reads back as this step's sign-off
      # evidence — `_read_verdict(reports/phase3/em.json)`. It was produced on
      # every run and declared by nothing, so no gate ever verified the file the
      # step's own verdict is read from. `_emit_ir_em_reports` writes em.rpt and
      # em.json inside ONE `if has_em:` branch, so this entry is satisfiable
      # exactly whenever the already-declared em.rpt is.
      - "reports/phase3/em.json"
      # The AUDIT VERDICT, as opposed to the measurement above — the two are
      # deliberately separate files (see the gate note below). It is
      # cross-program load-bearing, not self-verifying gate bookkeeping:
      # `phase3_one_shot_runner._DECLARED_SIGNOFF_GATES` names this EXACT path
      # as the em sign-off gate's output and runs that gate inline, blocking on
      # its verdict — so the runner depends on a file no step declared, and its
      # absence changed which evidence the run had without changing any verdict.
      # It is this step's own gate `--json` target, the shape `check_step`
      # re-probes AFTER the gate has run, so declaring it cannot manufacture a
      # MISSING on a run whose gate produced it.
      #
      # CORRECTED 2026-07-28. This entry was first written up as turning "the
      # gate exited zero and wrote no verdict" into a red step. It does not,
      # and the claim was never measured: the post-gate re-probe credits the
      # copy this step's own gate wrote DURING the audit, so a run that never
      # produced the file still reports PASS on the auditor's output. MEASURED
      # on copies of all 12 tracked roots carrying the already-declared
      # `reports/phase3/em.rpt` — NONE carries em_signoff.json, all 12 report
      # PASS, and every one lists em_signoff.json among the files the audit
      # itself created. What the declaration DOES buy is the completeness of
      # the list (the runner reads this exact path in `_DECLARED_SIGNOFF_GATES`
      # and nothing declared it). If absent at audit start, the gate's recreated
      # copy is tagged audit_created and excluded by default; the step stays
      # MISSING until the owning runner supplies a pre-audit producer. The
      # population of other roots carrying the file cannot weaken that rule.
      - "reports/phase3/em_signoff.json"
      # THE AUTHORITY VERDICT — the same W1 shape as the entry above, missed
      # when the `em_peak_current_authority_check` clause was added to the gate
      # below. That clause DESIGNATES this path (`--json
      # reports/phase3/em_current_authority.json`) and `phase3_one_shot_runner`
      # READS it by name at three sites: an existence probe
      # (`em_auth_json = rpt_phase3 / "em_current_authority.json"`), and the
      # sign-off aggregate, which opens it and cites it as
      # `em_cat["evidence"] = "reports/phase3/em_current_authority.json"`.
      # Written by one thing, read by another, declared by nothing: dimension 7
      # charged step 25 `W1:gate_output_read_elsewhere` on it, and that cell was
      # the last ENFORCED-CONTRADICTED cell in the 63x8 matrix.
      #
      # DECLARING IT CANNOT MANUFACTURE A MISSING. `em_peak_current_authority_
      # check.main` writes the `--json` target BEFORE it branches on the
      # verdict, so the file exists on the FAIL and INCOMPLETE paths as well as
      # on PASS; the only earlier returns are argument errors, which fail the
      # `program_exit_zero` clause anyway. Same post-gate re-probe shape as
      # em_signoff.json above.
      #
      # This is the THIRD closure of W1 by declaration, after step 31's
      # `magic_illegal_overlap.json` (2026-08-20 R9) and `perc_sweep.json`
      # (`2ffa7a594` [v1.12.10]). Both are recorded in
      # `test_flow_matrix_ledger.py`, and the second one records that its
      # declaring commit did NOT carry the paired ledger pin, the d3 manifest
      # entry, or the anchored figures. All three move with this entry.
      - "reports/phase3/em_current_authority.json"
    gate:
      # OUTPUT-PATH COLLISION. This declared `--json reports/phase3/em.json`,
      # which is the PRODUCER's file: `step_canonicalize_artefacts` →
      # `_emit_ir_em_reports` writes the measurement there
      # (`verdict: MEASURED`, max_segment_current_A, segments_analysed) and
      # `phase3_one_shot_runner` reads it back as this step's sign-off
      # evidence. The audit verdict therefore goes to a SEPARATE file; had the
      # dropped `--json` ever been honoured, the checker would have destroyed
      # the measurement it was auditing.
      all_of:
        - program_exit_zero: "em_report_check . --mode em --json reports/phase3/em_signoff.json"
        # THE FIGURE HAD TO REACH A COMPARISON. The clause above establishes
        # that an EM analysis RAN and that its report is not vacuous; it never
        # reads the current against a limit, so no magnitude of current could
        # move it — `matrix_mutation_ledger.ART-EM-CURRENT-DENSITY` recorded a
        # 25000x peak-current mutation returning rc 0 with zero findings.
        #
        # This clause is where the number is compared. It delegates the REAL
        # per-layer J-vs-Jmax screen to `em_current_density_check` (which
        # existed, complete, with zero references in this file), and when that
        # authority is unresolvable it REFUSES — printing `INCOMPLETE:` and
        # naming the PDK reference it lacks — rather than passing. It also
        # screens the peak against the total current the report itself says the
        # net is supplied with, which is conservation of charge and therefore
        # a bound with nothing in it to tune.
        #
        # MEASURED before wiring, over every published run carrying an EM
        # report: 0 PASS->FAIL. Wiring `em_current_density_check` DIRECTLY was
        # measured and rejected — no published run carries a tech LEF, so its
        # honest rc 3 SKIP would have failed the step on all of them.
        - program_exit_zero: "em_peak_current_authority_check . --json reports/phase3/em_current_authority.json"
    blocks_on: [22, 24]

  - id: 26
    name: "🔁 Antenna check (gate-oxide protection)"
    stage: stage3
    required_inputs:
      - from: 21
        path: "phase3/stage3/pnr/routed.def"
    closed_loop:
      fallback_to: 21
      trigger: "Antenna violation; insert diode or re-route"
    programs:
      - antenna_report_check
      - gds_antenna_deck_check
    required_outputs:
      - "reports/phase3/antenna.rpt"
      # The MEASUREMENT (net_violations / pin_violations / clean / verdict) the
      # runner reads back as this step's evidence —
      # `_read_verdict(reports/phase3/antenna.json)`. Produced on every run,
      # declared by nothing. Both `_emit_antenna_report` branches write
      # antenna.rpt and antenna.json together and return True only there, so
      # this entry is satisfiable exactly whenever the declared antenna.rpt is.
      - "reports/phase3/antenna.json"
      # The audit trail this step's own gate writes (below) — same reasoning as
      # step 24's ir_drop_signoff.json: the collision fix created a new
      # artefact, and a new artefact nothing declares is the defect this change
      # is about. Satisfiable on the FIRST evaluation via the gate-produced
      # re-probe in flow_compliance_check.
      - "reports/phase3/antenna_signoff.json"
    gate:
      all_of:
        # Substance gate (was presence-only) — parses the OpenROAD check_antennas
        # violation count; FAILs on net/pin violations > 0, mirroring the EM (25)
        # and IR (24) report_check siblings. PDK-waiver aware; clean reports PASS.
        # This is a ROUTER-REPORT consumer: it can only repeat what the router
        # already believed. PRESERVED unchanged — the deck below ADDS a second
        # opinion, it does not replace this one.
        # OUTPUT-PATH COLLISION, same shape as steps 24/25: this declared
        # `--json reports/phase3/antenna.json`, the PRODUCER's measurement file
        # (and now this step's required_output above). The audit verdict goes to
        # a separate file. `eda_report_audit` also globs `*antenna*.json`, so
        # `_discover` was taught to skip its own verdict documents — measured
        # before that guard, a second run of this gate re-ingested its own
        # output and files_found went 1 -> 2.
        - program_exit_zero: "antenna_report_check . --mode antenna --json reports/phase3/antenna_signoff.json"
        # INDEPENDENT GDS-geometry antenna sign-off (the authoritative second
        # opinion the flow never had). Reconstructs the as-fabricated
        # connectivity from the streamed GDS and computes per-net
        # metal_area/gate_area with STAGED connectivity — at the layer-k etch
        # stage only layers 1..k exist, so an upper-metal jumper cannot relieve
        # a lower-stage antenna, a relief the router's final-netlist model DOES
        # credit. It also runs cumulative-antenna-area (CAA) charge sharing,
        # which a per-layer check structurally cannot see, and CROSS-CHECKS its
        # count against reports/phase3/antenna.rpt: a clean/dirty DISAGREEMENT
        # is a hard FAIL so a router-vs-geometry inconsistency is surfaced
        # rather than averaged away.
        #
        # OPT-IN by PDK: the layer stack and per-metal ratio bounds are foundry
        # data, so the gate runs only where the PDK integrator has placed a deck
        # config. Without one there is nothing to measure geometry against and
        # Step 26 keeps exactly its previous verdict. WITH one, the gate always
        # reports: if KLayout or the deck engine is unavailable it exits 2 with
        # a NAMED disclosure -> VACUOUS-PASS, never a bare PASS earned by a
        # checker that did not run. (`gds_antenna_deck_check --strict` turns
        # that disclosure into a hard FAIL for a production tapeout.)
        - optional_program_exit_zero:
            command: "gds_antenna_deck_check . --json reports/phase2/gates/gate_oxide_geom_deck.json"
            condition_files_exist: ["signoff/gate_oxide_deck.json", "input/pdk/bridge/gate_oxide_deck.json"]
            absent_condition_reason: >-
              Both triggers are PDK-PROVIDED sign-off decks -- inputs to this
              step, not results of it. Without a gate-oxide deck there is no
              geometry target to measure against and step 26 keeps exactly its
              previous verdict; no fill of the gap is being claimed. WITH a
              deck the gate always reports: an unavailable KLayout or deck
              engine exits 2 with a NAMED disclosure (VACUOUS-PASS), never a
              bare PASS earned by a checker that did not run.
    blocks_on: [21]

  # ── Step 27: Signal Integrity ────────────────────────────
  # Industry standard ⑭/⑮: Crosstalk, noise, and glitch analysis
  # on extracted parasitics. Critical for high-speed designs where
  # coupling capacitance between adjacent nets causes functional
  # failures or timing degradation.
  # ── chip/IC path only ────────────────────────────────────────────────
  - id: 26.5ic
    name: "Die Finishing — seal ring + die identification (chip/IC path only)"
    stage: stage3
    condition:
      # THE CHIP PATH, NOT THE SHUTTLE TEMPLATE. Same change and same reason as
      # 15.5ic above: this read `files_exist:
      # [input/submission_template/slots/*.yaml]`, the shuttle OPERATOR'S
      # template, so a chip doing its own tape-out skipped die finishing as
      # "not applicable" and shipped WITH NO SEAL RING. A seal ring is what
      # dicing damage and moisture get into a die through; it is a property of
      # being a DIE, not of being on a shuttle. Measured by the external
      # authority rather than by this repository's opinion: an open-MPW
      # precheck container refused a layout this flow published at ladder step
      # 3 of 16 with "requires a seal ring (guard ring) around the die", and
      # stages 4-16 never executed.
      #
      # `any_of`, and the entries are 37.5ic's chip-path marker verbatim — two
      # mutually exclusive router files, never both on one tree.
      any_of: true
      files_exist:
        - "input/submission_template/slots/*.yaml"
        - "input/submission_template/SELF_TAPEOUT.txt"
    # D6 (vibe-ic#1744). `design_dependent`, not `setup_required`: this
    # condition tests WHICH PATH the design is on, and step 0.5ic's
    # required_outputs is the OR of exactly the three router artefacts, so on
    # any run where 0.5ic itself passed, precisely one of them exists. The two
    # named above are the CHIP ones; the third (`NO_TEMPLATE.txt`) is the
    # IP/hardmacro terminal 37.5ip owns, and a hardmacro is placed inside
    # somebody else's die — it has no die edge of its own to seal — so a
    # design-derived N/A is correct ONLY after 0.5ic passed. A missing,
    # conflicting or failed owner remains a hard upstream blocker.
    condition_kind: design_dependent
    condition_owner:
      step: 0.5ic
      declaration: delivery_route
    required_inputs:
      - from: 21
        path: "phase3/stage3/pnr/routed.def"
      # WHERE THE SEAL-RING INPUTS COME FROM WHEN THERE IS NO OPERATOR. 0.5ic
      # writes this declaration on every route. Its section 2C is the three
      # inputs this step already takes — whether a ring is required, which PDK
      # script builds it, and which marker layer must carry geometry — and
      # `_tapeout_declaration.py` was written to supply exactly them. Until this
      # edge, nothing read them: `die_finishing_gen` resolved its script and its
      # marker layer from the PDK bridge config and the environment only, so a
      # self-tape-out that had ANSWERED all three was driven as though it had
      # answered none.
      - from: 0.5ic
        path: "input/submission_template/tapeout_declaration.json"
    # AFTER THE ANTENNA CHECK AND BEFORE PHYSICAL VERIFICATION, and the order
    # is the whole point. A seal ring is real metal. Adding it after step 31
    # would mean the die step 31 signed off is not the die that ships — the
    # ring would reach a foundry having passed no DRC or LVS. That is this
    # repository's own worst failure shape: the artefact changed after the
    # evidence. LibreLane places SealRing after Checker.KLayoutAntenna for
    # the same reason.
    #
    # TWO COMPONENTS, TWO SOURCES, REPORTED SEPARATELY. The gate must never
    # collapse them into one verdict:
    #   seal ring  the PDK ships its own generator and this step CALLS it,
    #              never reimplements it — sky130A, gf180mcuD and ihp-sg13g2
    #              each carry one. A PDK with no generator SKIPS with a
    #              stated reason (LibreLane does exactly this when
    #              KLAYOUT_SEALRING_SCRIPT is unset).
    #   die id     four shuttle-owned cells whose provenance is NOT YET
    #              DETERMINED — gf180mcu_ws_ip__{qrcode_id,shuttle_id,
    #              project_id,marker}, at coordinates their generate_id.py
    #              pins exactly. Until the source is established this half
    #              reports NOT DETERMINED; it must not report clean, and it
    #              must not fail the seal ring for its own absence.
    programs:
      - die_finishing_gen
    required_outputs:
      - "phase3/stage3/pnr/die_finished.def OR phase3/stage3/pnr/die_finishing.SKIPPED.txt"
      - "reports/phase3/die_finishing.json"
    gate:
      program_exit_zero: "die_finishing_check . --json reports/phase3/die_finishing.json"
    # 0.5ic writes the template this step's condition reads.
    blocks_on: [26, 0.5ic]
  - id: 27
    name: "🔁 Signal Integrity (Crosstalk / Noise / Glitch + MCF crosstalk-delay)"
    stage: stage3
    required_inputs:
      - from: 22
        path: "phase3/stage3/extracted/parasitic.spef OR phase3/stage3/extracted/*.spef"
    closed_loop:
      fallback_to: 21
      trigger: "Crosstalk/noise above limit; shielding/spacing"
    skills: [sta-review]
    programs:
      - si_mcf_sta_check
    required_outputs:
      # The NOISE/GLITCH axis. Emitted by the runner's SI screen; hard-gated
      # below by the `files_exist` any_of.
      - "reports/phase3/si_crosstalk.rpt OR reports/phase3/si_crosstalk.json"
      # The MCF crosstalk-DELAY verdict — and, since the tape-out SI blocking
      # condition began reading it, a CROSS-STEP fact rather than this gate's
      # private bookkeeping. `signoff_audit._classify_si` opens exactly this
      # path (`_SI_REPORT_REL`) and its answer is a VETO, not an evidence
      # slot: `si_state != SI_PROVED and not si_waived` sets `passed = False`
      # and the tape-out verdict tier to FAIL whatever the five evidence
      # pillars said. Absence is not the soft branch — it is `SI_ABSENT`,
      # whose own message says nothing ran, so there is no disclosure to
      # accept and no waiver can cover it.
      #
      # The read arrived with the SI-vacuity tape-out waiver and NO step's
      # list was updated: measured at 9dd8b0aab `signoff_audit.py` names this
      # path 0 times, on current main 1 time. Step 36's comment below names it
      # in PROSE ("this step refuses to certify unless `reports/phase3/
      # si_mcf_sta_check.json` PROVED something"). Prose is not a
      # declaration; nothing verified that the artefact step 27 owes step 36
      # was ever produced. This entry is the machine-readable half of that
      # sentence.
      #
      # ALL-of-N, DELIBERATELY, and what that costs is measured, not assumed.
      # `flow_compliance_check.check_step` run on a fresh copy of each of the
      # 12 run roots in `programs/tests/fixtures/matrix_d3_output_manifest
      # .json`, with and without this entry: THREE move PASS -> MISSING and
      # nine are unchanged (4 already carry the file — two FAIL, two
      # VACUOUS_PASS, all four for reasons this entry does not touch; 2 are
      # SKIPPED-CONDITION; 3 are already MISSING on the crosstalk entry
      # alone, carrying no SI report at all). Re-measured through a FULL
      # `--strict` audit of the same 12 roots rather than `check_step` alone,
      # the same three move and one of them lands on DEFERRED-BY-UPSTREAM
      # instead of MISSING — the cascade rule reassigns it to the first
      # mid-chain FAIL, which also takes that root's denominator from 26 to
      # 25. Three of 756 per-step verdicts across the corpus; no Overall
      # verdict moves (all 12 are FAIL before and after). On ALL THREE
      # that move, step 22 — the SPEF producer this step `blocks_on` — is
      # ALREADY MISSING on the same tree, and NO root whose step 22 passes
      # moves. That is structural, not a coincidence of this corpus: the MCF
      # sub-gate's `condition_files_exist` keys off `reports/phase3/
      # si_mcf_sta.json`, which the runner writes only when a
      # `phase3/stage3/extracted/*.spef` and `phase3/stage3/pnr/constraint.sdc`
      # both exist, so the common shape producing the crosstalk report and not
      # this one is a run with no usable parasitic extraction — which the flow
      # already reports as incomplete one step earlier. Across the 12-root
      # corpus, therefore, a plain second entry reddens no root the flow
      # currently calls whole.
      #
      # It is NOT the only shape, and the claim is scoped to that corpus
      # because the counterexample was BUILT rather than argued away. The
      # runner invokes si_mcf_sta.py best-effort, under `subprocess.run(...,
      # timeout=...)` with NO return-code check, so a missing EDA container,
      # an OpenSTA error or a timeout all leave si_mcf_sta.json absent while
      # the SPEF is present. MEASURED on a fresh copy of
      # benchmark-data/ic/spm/v1.5.58_ihp-sg13g2 with both MCF artefacts
      # deleted and the SPEF and constraint.sdc left intact: step 22 PASS on
      # both yamls, step 27 PASS (one entry) -> MISSING (two entries). MISSING
      # is the honest verdict there — step 36 vetoes such a run with SI_ABSENT
      # anyway — and making a silently non-producing NONFATAL producer visible
      # is the point of this dimension, not a regression. But it is a root the
      # flow would otherwise call whole, so "reddens nothing" is true of the
      # corpus and not of the flow.
      #
      # WHAT THIS ENTRY DOES NOT DO. `si_mcf_sta_check.py` is its ONLY writer
      # and it is this step's own gate `--json` target, so on a tree where the
      # MCF condition IS satisfied `check_step` re-probes after the gate and
      # credits the copy the audit just wrote. MEASURED on a tracked root with
      # the file deleted: the audit recreates it, tags it audit_created,
      # excludes it from evidence, removes it again, and returns MISSING. A
      # pre-existing independently produced copy remains admissible. What
      # closes the MISSING producer gap is a flow-WIRING change giving the
      # report a producer outside its own gate, as
      # `phase3_one_shot_runner._DECLARED_SIGNOFF_GATES` did for the four
      # STA/EM sign-off gates — not a checker change.
      #
      # THE ENTRY THE PARAGRAPHS ABOVE WERE WRITTEN FOR, LANDED UNDER #1215.
      # Everything from "The MCF crosstalk-DELAY verdict" down arrived at
      # 161851c9f (2026-07-29) — 73 lines of justification ending in "This
      # entry is the machine-readable half of that sentence" — and the entry
      # itself was never added. The reasoning shipped; the declaration did not,
      # and `git log -S` over this file finds no commit that ever added and
      # removed it. So step 27 has carried a measured, argued case for an
      # `required_outputs` line that does not exist, which is why the write
      # record's promotion of this path had no declaration to land against.
      #
      # THE COMPETING READING, AND WHY IT DOES NOT SURVIVE. The closed #1077
      # argued WAIVE: `si_mcf_sta.json` is step 27's own
      # `condition_files_exist` trigger below, so its absence is a state the
      # flow declares legal two keys down. That is true of the SUB-GATE and
      # says nothing about the step's contract — the paragraphs above measured
      # exactly this and concluded MISSING is the honest verdict, because
      # `signoff_audit._classify_si` reads the same path as a cross-step VETO
      # (`SI_ABSENT`), not as an optional evidence slot. A trigger whose
      # absence vetoes tape-out is not an optional output.
      #
      # BLAST RADIUS RE-MEASURED for #1215 rather than inherited: `check_step`
      # over the 10 manifest run roots that resolve in this repository today,
      # with and without this entry — **3 move, all PASS -> MISSING**
      # (`phase1_parity/espi`, `ic/caravel_user_project`, `ic/subservient`).
      # That reproduces the "THREE move PASS -> MISSING" measured above at 12
      # roots, two of which no longer resolve. All three are already FAIL
      # overall before this change (28, 23 and 40 FAIL/MISSING steps across the
      # 63, measured), so no root the flow currently calls whole is reddened.
      # It RESOLVES in four admissible run roots
      # (caravel_user_project/v1.9.43_sky130A,
      # sha256/clean_run_v1427_20260715, spm/v1.5.58_ihp-sg13g2,
      # spm/v1.9.96_gf180mcuD).
      - "reports/phase3/si_mcf_sta.json"
    gate:
      all_of:
        - files_exist: ["reports/phase3/si_crosstalk.rpt", "reports/phase3/si_crosstalk.json"]
          any_of: true
        - optional_program_exit_zero:
            command: "si_crosstalk_check . --json reports/phase2/gates/si_crosstalk.json"
            condition_files_exist: ["reports/phase3/si_crosstalk.rpt"]
            absent_condition_reason: >-
              The same gate OPENS with a hard any-of `files_exist` over
              reports/phase3/si_crosstalk.rpt and .json, so a run carrying NO
              crosstalk evidence at all FAILs step 27 at that predicate. This
              clause is scoped to the .rpt form of the evidence that predicate
              already requires one of.
        # MCF crosstalk-DELAY axis (complements the noise/glitch axis above):
        # the runner re-runs OpenSTA on an MCF-bounded SPEF (Cc*MCF folded per
        # the aggressor/victim timing-window overlap; setup MCF=2 / hold MCF=0)
        # and the gate independently RE-COUNTS the window-justified fold so a
        # silently-dropped or inflated Cc*MCF FAILs. It is a conservative BOUND
        # (not PrimeTime-SI's iterative coupled-waveform calc), so it VALIDATES
        # the emitted report (advisory) rather than hard-failing a negative
        # bounded slack — a negative bound is a WARNING watch-item for a
        # commercial SI tool. Self-skips when no MCF report was produced.
        - optional_program_exit_zero:
            command: "si_mcf_sta_check . --json reports/phase3/si_mcf_sta_check.json"
            condition_files_exist: ["reports/phase3/si_mcf_sta.json"]
            absent_condition_reason: >-
              Step 27 declares reports/phase3/si_mcf_sta.json in its
              required_outputs, so an absent MCF report resolves the step
              MISSING rather than PASS -- recorded as a measured result in
              flow_condition_reachability_check's allowlist entry for this
              same clause. The condition therefore cannot hide the absence it
              is conditioned on. As a GATE the MCF axis is a documented
              ADVISORY: it is a conservative BOUND, so it validates the
              emitted report rather than hard-failing a negative bound.
    blocks_on: [22]

  # ── Step 28: PERC / Reliability Sign-off ─────────────────
  # Industry standard: Calibre-PERC-class reliability verification is
  # its own sign-off deck beside DRC/LVS — ESD pad-ring presence +
  # discharge topology, latch-up well-tap coverage, and cross-voltage-
  # domain protection. The open flow's deterministic PERC-equivalent
  # (DEF-driven) already computes all of these; this step makes the
  # conclusive categories an ENFORCED gate instead of a memo
  # (ORGANIC-20260606 flow-completeness review). Device-physics sizing
  # (clamp W/L vs HBM target) stays a NAMED manual-review open item.
  - id: 28
    name: "🔁 PERC / Reliability sign-off (ESD + latch-up + cross-domain)"
    stage: stage3
    required_inputs:
      - from: 21
        path: "phase3/stage3/pnr/routed.def"
    closed_loop:
      fallback_to: 15
      trigger: "ESD ring/topology gap, well-tap gap, or unprotected cross-domain crossing"
    programs:
      - perc_signoff_check
    required_outputs:
      # `phase3_one_shot_runner._emit_perc_equivalent` writes ALL THREE of
      # these in one pass (perc_equivalent.json at the JSON writer, then the
      # human-readable .rpt, then `_emit_perc_signoff_memo` → the memo) and the
      # call site appends all three to `written`. Only the .json was declared,
      # so the .rpt and the sign-off memo — the two artefacts a human reviewer
      # actually reads — were produced by every run and verified by none.
      # They are emitted together or not at all (one early-return guards the
      # whole emitter on the routed DEF), so declaring them cannot manufacture
      # a MISSING that the already-declared .json would not also raise.
      - "reports/phase3/perc_equivalent.json"
      - "reports/phase3/perc_equivalent.rpt"
      - "reports/phase3/PERC_SIGNOFF_MEMO.md"
      # The PERC sign-off VERDICT, and a repair-trigger input. `postroute_timing_repair_decision`
      # reads this exact path in `_NON_TIMING_SIGNOFF_ARTEFACTS` and FAILS CLOSED
      # on it — but only on an EXPLICIT hard-failure token. Its own docstring
      # states the consequence of absence in as many words: "an absent or
      # unreadable sign-off artefact is Step 21-31's problem, and reading it as
      # failure would deadlock Step 32". That delegation is correct AND it was
      # unhonoured: no step declared the file, so nothing anywhere verified it
      # existed, and a missing PERC verdict silently became "no repair demanded"
      # instead of a red gate. Declaring it here is the missing half of that
      # contract — the half that puts the artefact on a list, so a reader of
      # the flow can see who owes it.
      #
      # WHAT IT DOES NOT DO, stated 2026-07-28 rather than implied: it is this
      # step's own gate `--json` target and NO producer outside that gate
      # writes it (`grep -rn perc_signoff programs/` reaches only
      # `perc_signoff_check` itself and `postroute_timing_repair_decision`, which READS
      # it), so `check_step` re-probes it after the gate runs and credits the
      # copy the audit just wrote. That audit-created copy is now excluded by
      # default and the producer gap is MISSING. MEASURED: of the 8 tracked roots that
      # carry this file, the one checked byte-for-byte
      # (benchmark-data/ic/caravel_user_project) holds
      # `{"program": "perc_signoff_check", ...}` — the gate's own verdict
      # document, i.e. audit output committed as run evidence. What would make
      # the absence red: wire `perc_signoff_check` into a runner, as
      # `phase3_one_shot_runner._DECLARED_SIGNOFF_GATES` did for the four STA/EM
      # sign-off gates on 2026-07-27.
      - "reports/phase2/gates/perc_signoff.json"
    gate:
      all_of:
        - files_exist: ["reports/phase3/perc_equivalent.json"]
        - program_exit_zero: "perc_signoff_check . --json reports/phase2/gates/perc_signoff.json"
    blocks_on: [21, 24, 25, 26, 27]

  # ── Step 29: Post-Layout Gate-Level Simulation ───────────
  # Industry standard ⑮: Gate-level netlist + SDF back-annotation
  # simulation. Verifies that the physical implementation preserves
  # RTL functional correctness after synthesis, DFT, CTS, and
  # routing transformations. This is *not* the same as pre-layout
  # RTL sim (Step 4) — it catches timing-induced functional failures
  # that only manifest with real parasitic delays.
  - id: 29
    name: "Post-Layout Gate-Level Simulation (Post-Sim + SDF)"
    stage: stage3
    required_inputs:
      - from: 12
        path: "phase2/stage2/synth/post_dft_netlist.v"
    mcp_tools: [eda_simulate]
    programs:
      - post_layout_sim_check
    required_outputs:
      - "phase3/stage3/sim_postlayout/results.log OR phase3/stage3/sim_postlayout/pass.flag"
      # The SUBSTANCE arm. Until now this step's only declared entry could be
      # satisfied by `pass.flag` alone, and that flag says of itself that it is
      # "the open-source-flow approximation" whose substance is checked
      # elsewhere: "Substance gate (post_layout_sim_check) verifies the
      # underlying RTL TB pass". The gate below already runs that check as a
      # BLOCKING `program_exit_zero` clause; the report it writes was simply
      # never declared, so no dimension could state that it had read it.
      #
      # MEASURED before declaring (vibe-ic#983):
      #   * the report is carried by 5 published run trees;
      #   * check_step over every published tree carrying a post-layout sim dir
      #     (6 discovered) returns the SAME status with and without this entry —
      #     0 of 6 moved, so declaring it re-grades no published run;
      #   * step 29 already declares a runner-produced entry, so the
      #     "every declared entry absent -> MISSING before the gate runs" early
      #     return cannot be newly triggered by adding this one. That early
      #     return is exactly why the same change is NOT made to FS1 — see the
      #     FS1 comment above, where it was measured to stop the producer.
      - "reports/phase2/gates/post_layout_sim.json"
    gate:
      all_of:
        - files_exist: ["phase3/stage3/sim_postlayout/results.log", "phase3/stage3/sim_postlayout/pass.flag"]
          any_of: true
        - program_exit_zero: "post_layout_sim_check . --json reports/phase2/gates/post_layout_sim.json"
        # ORPHANED, RE-HOMED (2026-08-25). Step 29 is the step that BUILDS
        # the SDF wrapper this reads; the check asks whether that wrapper
        # actually declares a module and instantiates the DUT, which
        # `post_layout_sim_check` above does not.
        #
        # ADVISORY, and it is red on a real completed project right now:
        # `NO_DUT_INST: [gl_sim/sdf_wrapper.v] No module instantiation`. That
        # is a genuine finding about a shipped project, not a plumbing error,
        # and it is exactly what a gate reachable from nothing lets through.
        # Reporting it is the first step; blocking on it belongs after somebody
        # has decided whether that wrapper is wrong or the check's expectation
        # is too narrow.
        - advisory_program_exit_zero:
              command: "synth_wrapper_check ."
              advisory_reason: "NOT-YET-CLEAN: this gate CAN refuse and is wired advisory as a ratchet position, not as a verdict. Notch measured rc 1 on a real spm run (2026-08-31): it REFUSES TODAY on real input; the advisory slot is currently swallowing a live finding. Promote to blocking once this run is clean. It reported: FAIL — {'wrappers_checked': 2, 'valid_wrappers': 0, 'errors': 2}"
    blocks_on: [22]

  # ── Step 30: Post-Layout SPICE Verification ──────────────────
  # Industry standard: transistor-level SPICE simulation is the only
  # way to verify that liberty timing models accurately represent
  # post-layout behavior. STA and gate-level SDF sim both rely on
  # the same liberty abstractions — if the model is wrong, both are
  # wrong together. SPICE catches model inaccuracies, analog block
  # failures, and timing correlation issues that no other step can.
  - id: 30
    name: "Post-Layout SPICE Verification (critical-path correlation + analog)"
    stage: stage3
    required_inputs:
      - from: external
        check: none
        what: >-
          the PDK device models / tech decks (PDK_ROOT — outside the project
          tree)
    skills: [ams-sim]
    mcp_tools: [eda_spice]
    programs:
      - spice_correlation_check
    required_outputs:
      - "phase3/stage3/spice/*.sp OR phase3/stage3/spice/*.spice OR sim_spice/*.sp"
      - "phase3/stage3/spice/correlation.json OR reports/phase3/spice_correlation.json"
    gate:
      all_of:
        - files_exist: ["phase3/stage3/spice/*.sp", "phase3/stage3/spice/*.spice", "sim_spice/*.sp"]
          any_of: true
        - program_exit_zero: "spice_correlation_check . --json reports/phase2/gates/spice_correlation.json"
    blocks_on: [22, 23]

  - id: 31
    name: "🔁 Physical Verification (DRC + LVS + ERC + Density)"
    stage: stage3
    required_inputs:
      - from: 21
        path: "phase3/stage3/pnr/routed.def"
    closed_loop:
      fallback_to: 32
      trigger: "DRC/LVS/ERC fail; repair and recheck required"
    # perc-check REMOVED. The comment on Step 31's PERC clause records the
    # history -- "the PERC skill was named with NO PERC program behind it".
    # The program half has since landed (perc_corpus_sweep /
    # perc_signoff_check); the SKILL half never did. drc-fix and lvs-triage
    # both ship and are this step's physical-verification triage.
    skills: [drc-fix, lvs-triage]
    mcp_tools: [eda_drc_klayout, eda_lvs]
    programs:
      # The runner executes this producer inline after extraction and before
      # LVS; the gate below first validates its record, then runs an
      # independent judge into reports/audit/.  Declaring the producer here is
      # what distinguishes a reader that names the path from its writer.
      - magic_illegal_overlap_check
      - erc_density_check
      # Issue #1980: these programs produce/classify evidence; none owns a
      # refusal predicate.  They are step programs, not gate denominator rows.
      - pnr_via_stack_completeness_check
      - perc_corpus_sweep
      - lvs_triage_classify
    program_outputs:
      - program: pnr_via_stack_completeness_check
        path: "reports/phase3/pnr_via_stack_completeness.json"
        verdict_field: verdict
      - program: perc_corpus_sweep
        path: "reports/phase3/perc_sweep.json"
        finding_fields:
          - "rows.*.welltap.status"
          - "rows.*.xdomain.status"
      - program: lvs_triage_classify
        path: "reports/phase3/lvs_triage.json"
    required_outputs:
      - "reports/phase3/drc_signoff.rpt"
      - "reports/phase3/lvs.rpt"
      - "reports/phase3/erc.rpt"
      # The two MACHINE-READABLE verdicts the three .rpt files above do not
      # carry, and both are repair-trigger inputs: `postroute_timing_repair_decision` reads
      # `reports/phase3/lvs.json` and `reports/phase2/gates/erc_density.json`
      # by name in `_NON_TIMING_SIGNOFF_ARTEFACTS` and withholds
      # `no_repair_needed.flag` only on an EXPLICIT hard-failure token in them.
      # Its docstring says what absence does — "an absent or unreadable
      # sign-off artefact is Step 21-31's problem" — and Step 31 is the step it
      # is delegating to, which had never declared either file. So an LVS or
      # ERC/density verdict that was never written read exactly like one that
      # said PASS, and Step 32 certified "no repair needed" over it. Both are
      # present in the tracked benchmark roots that carry the already-declared
      # lvs.rpt (lvs.json 7/7, erc_density.json 6/7 — the seventh, subservient,
      # is FAIL on this step before and after), and declaring them supplies the
      # evidence that lets this step's gate run on a root that has the JSONs
      # and not the .rpt files: MEASURED, benchmark-data/ic/sha256/
      # clean_run_v1461_0223 moves MISSING -> FAIL, from a blanket absence to a
      # named DRC/LVS defect.
      #
      # WHAT IT DOES NOT DO, stated 2026-07-28 rather than implied: both are
      # also this step's OWN gate `--json` targets and no producer outside that
      # gate writes either, so on a root that lacks them `check_step` re-probes
      # after the gate, tags the copy audit_created, excludes it from credited
      # evidence, and keeps the producer gap MISSING by default.
      - "reports/phase3/lvs.json"
      - "reports/phase2/gates/erc_density.json"
      # A THIRD machine-readable verdict of the same shape, and the same defect
      # one step later. `magic_illegal_overlap_check` is a BLOCKING clause of
      # this step's gate and writes `reports/phase3/magic_illegal_overlap.json`;
      # `phase3_one_shot_runner` then READS that path by name
      # (phase3_one_shot_runner.py:28496) and, on a non-zero gate, writes an
      # LVS FAIL verdict that cites the file in `illegal_overlap_report` and
      # aborts the step before netgen runs. So it is load-bearing outside its
      # own writer, which is exactly the class dimension 7 charges — and until
      # now Step 31 declared it nowhere:
      #   [W1:gate_output_read_elsewhere]
      #   'reports/phase3/magic_illegal_overlap.json' (written by
      #   magic_illegal_overlap_check; read by program:phase3_one_shot_runner)
      # An extraction that never wrote the file read exactly like one that
      # cleared the zero-illegal-overlap gate, which is the same failure mode
      # the lvs.json / erc_density.json paragraph above records.
      #
      # WHAT IT DOES NOT DO: no PUBLISHED corpus cell carries this path (`find`
      # over benchmark-data @ 146d665 returns nothing) — the gate postdates
