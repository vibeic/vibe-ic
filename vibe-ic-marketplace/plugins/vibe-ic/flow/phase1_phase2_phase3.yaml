        # v0.76 FPGA wrapper input-polluter check — generic across protocols.
        # Catches the sim-PASS hardware-FAIL trap where a wrapper ANDs/ORs
        # multiple inout pins to "hedge" against bench-cable uncertainty;
        # the floating ghost pins poison the input via weak-pullup noise.
        - optional_program_exit_zero:
