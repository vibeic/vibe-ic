        # producer was repaired and the record was never re-emitted. The root
        # still stays RED on its five other, real findings.
        #
        # NOT DONE, deliberately: no published artefact re-emitted (that is a
        # benchmark-data change with its own review), so the corpus sweep before
        # and after this PR is byte-identical at 17 RED / 90 CLEAN. Fixing the
        # producer does not retro-clean the record it already wrote.
        #
        # THE EASY (c) STORY THAT THE MEASUREMENT REFUSED. Nine of the 38
        # findings are an absence stated plainly and then FAILed (no TDF
        # measurement, unmeasurable DC, 0 PVT corners, no parseable DRC, a
        # vacuous CTS report). That is NOT this repo's non-failure: #785/#774
