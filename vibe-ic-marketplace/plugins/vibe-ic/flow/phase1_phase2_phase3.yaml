        #
        # THE GATE'S OWN HYGIENE, verified rather than assumed:
        #   * zero denominator REFUSES — an empty project returns rc 2
        #     "[CANNOT DETERMINE] … no reports/ tree … NOT a pass".
        #   * a PASS discloses its denominator — "PASS: 1 report(s) examined".
        #   * it EXCLUDES ITS OWN report: run with `--json` into `reports/` and
        #     re-run, and it does not cite the FAIL it just wrote. Measured on
        #     arm_aix (still cites only phase1_one_shot.json) and afdx (stays
        #     rc 0).
        #
        # THE CASCADE, stated because it constrains every row that writes a
        # report. This gate reads `reports/**/*.json` for `verdict`, so a gate
        # that writes a FAIL report manufactures a red here. That is CORRECT
        # for a gate the flow wired BLOCKING and WRONG for one it wired
        # ADVISORY — an advisory finding must not become blocking by
        # travelling through a file. The rule, and it is this gate's own
        # existing convention rather than a new one: EVERY GATE THAT WRITES A
        # VERDICT-BEARING REPORT DECLARES IN IT THE MODE IT IS WIRED AT. This
        # gate already honours `verdict_mode: ADVISES` (see its docstring), so
        # an advisory row that declares it does not cascade and needs no change
        # here.
        #
        # TWO MITIGATIONS, and which one a row needs depends on WHEN it writes:
        #   * a gate that writes ONLY under `--json` is protected by being
        #     wired BARE. That is l6 and l9 above, and the row below.
        #   * a gate that writes UNCONDITIONALLY is not — bare wiring does not
        #     help it, and it must declare its mode instead. MEASURED on
        #     `l20_dft_scan_topology_actionable_check`, which calls
        #     `write_report` with no `--json`: running it BARE flipped afdx and
        #     jtag from rc 0 to rc 1 on THIS gate. vibe-ic#1003 gave it a
        #     `--verdict-mode` and re-measured — jtag still FAILs and now
        #     leaves this gate at rc 0. l20 is STILL NOT WIRED, for the
        #     remaining reason recorded in its own issue: its F2 ruler counts a
        #     sentence DENYING a DFT requirement as evidence that one was
        #     stated, on at least 20 of its 25 remaining corpus reds.
        - program_exit_zero: "step_internal_fail_bubble_up_check ."
        # D9 Phase 2 — the process that RAN must be the process the design
        # DECLARED. Held back in #1006 (vibe-ic#1002) because 9 of its 10
        # corpus reds were a zero-denominator FAIL; the ruler is repaired and
        # this row is the promotion.
        #
        # BLOCKING, and the reds are the argument rather than a preference.
        # Re-measured with `tools/d9_corpus_baseline.py --only
        # declared_pdk_is_the_pdk_used_check`, unconditional per-cell
        # isolation, over 107 published run dirs:
        #
        #     origin/main @3fd65e72   RED 10 · CLEAN 4 · NO-INPUT 93
        #     with the repair         RED  1 · CLEAN 4 · NO-INPUT 102
        #
        # The 10 were reproduced EXACTLY from the issue's count, six PRs later,
        # so nothing in between moved this population. All 10 were opened by
        # hand before the change and the survivor was opened again after:
        # ONE root's own L19 declares one process while its PnR log names
        # another vendor's tech + stdcell LEF, and it carries no
        # `pdk_target_alternates` that would permit the substitution. That is
        # the exact defect this program was written for. It stays red, and it
        # is FILED rather than absorbed — no waiver, no baseline widened.
        #
        # THE NINE THAT LEFT ARE NOT A SOFTENING. Each printed
        # `0 librar(ies) across 0 log(s) — nothing to compare` and returned 1;
        # seven carried no `*.log` at all. `gate_zero_denominator_refuses_check`
        # is the house rule for that shape, and this repo REFUSED to promote
        # `behavioral_evidence_per_spec_item_check` for it. They are now rc 2
        # with the missing input NAMED, which is the other half of the rule.
        #
        # BLOCKING IS AFFORDABLE HERE SPECIFICALLY, by the same argument the
        # row above makes: Step 36 `blocks_on: [31,32,33,34]`, so only a
        # project that has reached physical sign-off is ever asked which
        # process it built. A Phase-1-only root is not.
        #
        # THE GATE'S OWN HYGIENE, verified rather than assumed:
        #   * zero denominator REFUSES — a declared target with no recorded
        #     library load is rc 2 NOT CHECKED naming what it lacked.
        #   * a PASS DISCLOSES its denominator — "N of M loaded librar(ies)
        #     match" — and says what it did NOT verify (foundry / process
        #     node are not derivable from a LEF filename).
        #   * it cannot cascade into the gate above: it writes no report of
        #     its own unless handed `--json`, and this row does not.
        #
        # LIMIT, STATED: the evidence channel is `*.log` only. Three of the
        # nine refusals carry a MAPPED gate-level netlist whose cell names
        # would answer the question, and all three CORROBORATE their own
        # declaration — so nothing is hidden today, but a run that keeps no
        # tool log is refused rather than judged. Closing that is a separate
        # measured change; it moves what the gate PASSES, not only what it
        # refuses.
        - program_exit_zero: "declared_pdk_is_the_pdk_used_check ."
        # vibe-ic#1121 — THIS GATE WAS NEVER WIRED, and it is the third time
        # this repo has found that shape (step 21's macro_obs geometry check,
        # step 37.5ic's shuttle precheck, now this). Measured on 46db01866:
        #     git grep -n "ppa_head_to_head" -- '*flow/*'   ->  ZERO lines
        # (the pathspec matters: `-- '*/flow/'` also returns zero, and returns
        # zero WITH the gate wired, because it matches no file in this repo at
        # all. A zero from a probe that cannot match is not a measurement.)
        # The program is complete and encodes #1121's four refusals, and no
        # step invoked it, so nothing it refuses could ever fail a run.
        #
        # WIRED HERE because this is the step that OWNS THE CLAIM. A PPA
        # head-to-head is not a design artefact, it is a SIGN-OFF assertion
        # ("given an identical spec and PDK, this flow produced better PPA than
        # theirs"), and this step is the flow's final sign-off confirmation. It
        # is also the first step whose blocks_on transitively carries all three
        # axes the record must declare — 31 PV, 32 post-route timing, 33 power,
        # 34 fill/area — so the triple exists by the time it is judged. And it
        # is UNCONDITIONAL, so it stands on both the chip and the IP path,
        # unlike 37.5ic / 37.5ip / 38. A refusal lands BEFORE stream-out,
        # because step 37 blocks_on 36: a false comparison never reaches a GDS.
        #
        # rc 2 SKIPS, AND THAT IS A DECISION, NOT AN OVERSIGHT.
        # `__check_program_exit_zero` reads rc 2 as VACUOUS_PASS, so a gate that
        # exits 2 on absence cannot go red — the v1.11.3 `tapeout_docs_gen`
        # defect. Checked what THIS invocation returns: `--corpus .` walks the
        # project for the checker's own record glob and exits 2 only when the
        # walk succeeded and found NOTHING. That skip is deliberate. The record
        # is a CAMPAIGN artefact, not a per-design one — nearly every design
        # this flow signs off will never carry one — so blocking on absence
        # would redden every ordinary tapeout to police a claim nobody made,
        # which is the "declare an undeclared artefact and relocate the red"
        # shape. What must NOT skip is a claim that was actually made, and after
        # the fix that ships with this change it cannot:
        #   * a record that EXISTS and cannot support itself is rc 1 -> FAIL;
        #   * a refusal is no longer softened by an undetermined record beside
        #     it (the aggregator used max(), and rc 2 is the larger integer and
        #     the weaker verdict, so ONE unmeasured axis defused a real refusal);
        #   * a corpus that cannot be READ is rc 1 CORPUS_ABSENT, not rc 2 —
        #     "I could not look" and "I looked and it was empty" are now two
        #     different answers.
        # So the only thing that skips here is a run that made no claim, and it
        # skips loudly: the denominator is printed on every run and the step is
        # promoted to the VACUOUS_PASS tier, never a bare PASS.
        #
        # NOT `advisory_program_exit_zero`: that slot records a finding and can
        # never fail the step, and a rigged baseline is a defect in a published
        # claim, so its verdict has to decide this step's.
        #
        # `optional_program_exit_zero` AND NOT THE UNCONDITIONAL SLOT, MEASURED.
        # Wired unconditionally, `--corpus .` returns rc 2 on every run that
        # files no record, and `check_step` reads ONE vacuous clause beside
        # substantive ones as "every clause was vacuous" — a substantive
        # sub-gate appends nothing, so silence and vacuity are the same to it:
        #     substantive ALONE       -> PASS
        #     vacuous ALONE           -> VACUOUS_PASS
        #     substantive + vacuous   -> VACUOUS_PASS
        # That would demote the TAPEOUT SIGN-OFF itself to VACUOUS_PASS on every
        # ordinary run, which is the mis-fire that withdrew v1.10.14 (step 2
        # Lint demoted on 1 vacuous clause out of 10 that ran).
        #
        # This is NOT step 21's "orphan with extra steps". That ruling is about
        # a trigger on an artefact THE FLOW ITSELF PRODUCES, where a
        # self-disabling glob hides a real defect. The condition below IS the
        # checker's own record glob over an artefact NO step produces, so
        # condition-unmet and corpus-empty are the SAME SET by construction and
        # no record can hide behind it. The skip is bought, not assumed: the
        # engine FAILs the clause outright unless the wiring site declares why
        # an absent input is genuinely not-applicable.
        - optional_program_exit_zero:
            command: "ppa_head_to_head_check --corpus ."
            condition_files_exist: ["**/*head_to_head*.json"]
            absent_condition_reason: >-
              The subject is a CLAIM, not a result. A PPA head-to-head record is
              produced by a comparison campaign against another flow -- vibe-ic
              against LibreLane against ORFS+AutoTuner -- and not by a design
              run, so nearly every sign-off legitimately files none. The failure
              this clause exists for, a comparison that cannot support the claim
              printed on it, REQUIRES the claim to exist. Absence is the normal
              case here, not the defect. The glob is the checker's OWN record
              glob, so a record that exists is always judged: there is no state
              in which a claim was filed and this clause did not look at it.
    blocks_on: [31, 32, 33, 34]

  - id: 37
    name: "GDSII output (only if Step 31 PV fully clean)"
    stage: stage4
    required_inputs:
      - from: 34
        path: "phase3/stage3/pnr/filled.def OR phase3/stage3/pnr/metal_fill.done"
    mcp_tools: [eda_gds]
    required_outputs:
      - "phase3/stage4/gds/*.gds"
      - "reports/phase3/gates/stage3_compliance.json"
    gate:
      all_of:
        # ── ON-PASS REVIEW of stage3 ─────────────────────────────────
        # Declared on the stage (`stages[].on_pass_review`), DISPATCHED here:
        # the step that already carries `stage3_compliance .`.
        # `advisory_`, NOT `program_exit_zero`, and that is the whole point:
        # the block declares `verdict: advisory` and the program declares
        # `DECLARED_ENFORCEMENT = "advisory"`. The blocking slot would make a
        # rejection stop the step -- turning "unverified" into "blocking",
        # which #1253 refuses -- and would additionally read the program's
        # rc=2 NOT CHECKED as VACUOUS_PASS. The advisory slot RUNS it and
        # RECORDS the verdict without changing the step's tier.
        # THE VERDICT SOURCE, PRODUCED HERE AND READ ON THE NEXT LINE.
        # It used to be `--compliance reports/flow_compliance.json`, which
        # ONLY the flow's `final_gate:` block declares -- and NOTHING
        # EXECUTES `final_gate`. Both runners invoke this program without
        # `--json` (design_one_shot_runner._build_final_audit_cmd,
        # phase3_one_shot_runner), `--json` has no default, and even when a
        # caller does pass it the report is written AFTER the step loop that
        # hosts these clauses. MEASURED: the review returned rc=2 NOT CHECKED
        # -- "[Errno 2] No such file or directory" -- on every real run, which
        # is v1.13.42's outcome reached through a different door.
        # A scoped pass run as the clause BEFORE the review is a verdict
        # source with an executed producer AND a defined order: `_evaluate_gate`
        # walks `all_of` in sequence, so the report exists when the next
        # clause reads it.
        # `stage3_compliance` was ALREADY in this `all_of`, last, with no `--json`.
        # It is the same clause, moved to the front and asked to write what
        # it measured. Nothing new runs.
        - advisory_program_exit_zero:
              command: "stage3_compliance . --json reports/phase3/gates/stage3_compliance.json"
              advisory_reason: "NOT-YET-CLEAN: this gate CAN refuse and is wired advisory as a ratchet position, not as a verdict. Notch measured rc 1 on a real spm run (2026-08-31): it REFUSES TODAY on real input; the advisory slot is currently swallowing a live finding. Promote to blocking once this run is clean. It reported: STRUCTURAL MEASUREMENT: registered=null invoked=null no_verdict=null — the structural-RTL umbrella was NOT ASKED to run in this invocation, so this re"
        - advisory_program_exit_zero:
              command: "stage_on_pass_review . --stage stage3 --json reports/phase3/gates/stage3_on_pass_review.json --compliance reports/phase3/gates/stage3_compliance.json"
              advisory_reason: "DEMOTED, not designed advisory: wired blocking until da6fcd7fe (2026-08-30), moved here in the change that made the declared command actually execute; that push used --no-verify because the full tier did not stamp. Restore blocking once the six on-pass stage commands run green. Re-pointed at the per-stage compliance report in v1.13.78; notch re-measured rc 2 on that invocation, unchanged in class."
        - files_exist: ["phase3/stage4/gds/*.gds"]
        - program_exit_zero: "gds_size_check --gds-file phase3/stage4/gds/*.gds --json reports/phase3/gds_size.json"
        # Substance, not just size. gds_size_check compares against a
        # flow-wide 100 KB constant and demotes a bad GDSII header to a
        # WARNING, so 150 KB of os.urandom() behind a 4-byte HEADER, and a
        # zero-padded library with no structures at all, both signed off
        # `pass: true, errors: 0, warnings: 0`. This gate walks the whole
        # record stream (HEADER..ENDLIB, no trailing padding) and requires
        # layout elements >= the design's OWN placed-instance count read
        # from phase3/stage3/pnr/routed.def — a derived floor, never a
        # per-design constant. Hard FAIL; VACUOUS_PASS before stream-out.
        - program_exit_zero: "gds_substance_check . --json reports/phase3/gds_substance.json"
        # vibe-ic#613 — substance is not nameability. A structurally valid,
        # substance-carrying sign-off GDS whose TOP CELL has no text labels
        # cannot be pin-matched by any top-level LVS: extraction emits
        # `.subckt <top>` with no ports at all, so every schematic port
        # resolves to an anonymous node and the comparison fails regardless of
        # whether the layout is correct. Measured on a real run: DEF `PINS 20 ;`
        # against 0 labels in the streamed top cell.
        # PER-STRUCTURE and BY NAME: a chip GDS carries the std cells' own pin
        # texts (sha256: 2,314 library labels), so a library-wide count is
        # non-zero for a top cell with none, and a count alone cannot say WHICH
        # port is unnamed. Pairs the DEF to the GDS by the DEF's own
        # `DESIGN <name> ;` — sha256's pnr dir holds DEFs for two designs.
        # VACUOUS_PASS (rc 2) when no DEF describes the layout; blocks only on a
        # PLACED port with no label. Flips 0 of the 4 real sign-off GDS here.
        - program_exit_zero: "gds_port_label_check . --json reports/phase3/gds_port_labels.json"
        # ORPHANED, RE-HOMED (2026-08-25). Step 37 is where a design publishes
        # its numbers, so it is the step that can ask whether every figure in
        # the final report is backed by an artefact on disk rather than typed
        # in. Conditioned on the report existing: a project that has not written
        # one has no claim to check, which is a different statement from "its
        # claims are backed".
        - advisory_program_exit_zero:
              command: "reported_figure_artifact_backing_check . --report FINAL_REPORT.md"
              advisory_reason: "DEMOTED from optional_program_exit_zero in 0291e92f1 (2026-08-25): the optional slot REFUSES when its inputs are present, and an unmet condition there still denied the step its PASS tier (test_matrix_d8). Enforcement was traded for the tier, not for a reason about this gate."
        # Provenance required: GDS must be produced by a real streamer
        # (KLayout def2gds, Magic gds write, etc.). This closes the
        # "rename old .def to .gds" loophole.
        #
        # It did not. `--require-entries 1` is the COARSE mode: it counts
        # exit-0 entries anywhere in provenance.jsonl with NO output-path and
        # NO tool filtering, so it passes on any run that logged a single
        # yosys/openroad/sta/netgen invocation — the GDS itself is never
        # looked at. Of the six provenance gates in this flow, this was the
        # ONLY coarse one; lines 701/1302/1330/1611/1612 all use the strict
        # `--output ... --tool ...` form. Measured on the real
        # spm x ihp-sg13g2 run: coarse -> `44 / 1 exit-0 entries OK`, rc=0;
        # strict -> rc=1, `hash mismatch: log=sha256:a5f4537a59e...
        # disk=sha256:b8cb431c24d...` — the shipped GDS post-dates the only
        # log entry that claims to describe it.
        #
        # `--output=`/`--tool=` (the `=` form) is deliberate: an argument
        # starting with `-` is NOT touched by flow_compliance_check's
        # `_expand_globs`, so the pattern reaches provenance_check intact and
        # is expanded by ITS glob branch, which FAILs "no file on disk matches
        # pattern" when nothing matches and checks EVERY match when several
        # do. The space-separated form would be pre-expanded with nullglob
        # semantics: zero matches drops the argument entirely and argparse
        # then exits 2, which this runner reads as VACUOUS_PASS.
        - program_exit_zero: "provenance_check . --output=phase3/stage4/gds/*.gds --tool=klayout,magic,openroad --require-measured"
        # TWO ORPHANED FINAL-STAGE GATES, RE-HOMED (2026-08-25). Step 37 is
        # where a design claims it is done, which is the only place these two
        # questions can be asked: does the stage evidence actually exist, and
        # does every gate a FINAL_REPORT calls PASS have an evidence file
        # behind it.
        #
        # ADVISORY. `flow_stage_check` is RED on a real completed project —
        # `stage_count 3, threshold 4, synth: False` — because that project has
        # no synthesis evidence directory. A gate nothing ran could not say so.
        # `gate_evidence_completeness_check` needs a FINAL_REPORT.md and says so
        # rather than passing when there is none.
        - advisory_program_exit_zero:
              command: "flow_stage_check ."
              advisory_reason: "NOT-YET-CLEAN: this gate CAN refuse and is wired advisory as a ratchet position, not as a verdict. Notch measured rc 0 on a real spm run (2026-08-31): it is already clean on real input, so blocking would cost nothing today; the only thing holding it advisory is that no other run has been measured."
        - advisory_program_exit_zero:
              command: "gate_evidence_completeness_check ."
              advisory_reason: "NOT-YET-CLEAN: this gate CAN refuse and is wired advisory as a ratchet position, not as a verdict. Notch measured rc 1 on a real spm run (2026-08-31): it REFUSES TODAY on real input; the advisory slot is currently swallowing a live finding. Promote to blocking once this run is clean. It reported: FAIL: nothing to audit"
        # ORPHANED, RE-HOMED. Step 37 is where the GDS is published, so it is
        # where "which of these polygons came from someone else's IP" can be
        # asked. `build-text` prints and writes nothing, so no required_outputs
        # change. Measured: rc=2 with no `plugin_output/declaration.json` (a
        # project reusing no catalogue IP — correctly vacuous), rc=0 on a
        # complete blob, rc=3 when the blob carries a REFUSED line.
        - advisory_program_exit_zero:
              command: "gds_ip_attribution build-text ."
              advisory_reason: "NOT-YET-CLEAN: this gate CAN refuse and is wired advisory as a ratchet position, not as a verdict. Notch measured rc 0 on a real spm run (2026-08-31): it is already clean on real input, so blocking would cost nothing today; the only thing holding it advisory is that no other run has been measured."
        # THE STAGE-3 BOUNDARY, ASKED BY THE STEP ITS OWN DOCSTRING NAMES.
        # `stage3_compliance` is the end-of-stage gate the README names for
        # stage3, and it does not merely say "run me after stage 3" — it names
        # its consumer: "GDS ... is in Stage 4 and is gated on Stage 3 being
        # fully clean — do NOT produce GDS if this gate fails." This is the
        # GDSII output step. No other step in this flow owns that sentence, and
        # until now nothing invoked the wrapper at all, so the prohibition was
        # published and never measured.
        #
        # ADVISORY. Step 37 already carries FOUR blocking clauses of its own on
        # the artefact it produces (size, substance, port labels, provenance);
        # the stage-3 verdict is a second opinion about upstream steps that
        # each have their own gate, and re-blocking here would refuse this
        # step's tier for a finding that already refused another step's. The
        # wrapper also hardcodes `--strict`, a stricter reading than the run's
        # own invocation may have chosen.
        #
        # NO RECURSION: `flow_compliance_check --stage 3` evaluates stage3
        # steps only, and step 37 is stage4 — outside the filter, so this
        # clause cannot re-enter itself. It would recurse without bound if
        # wired onto any stage3 step, which is why it is not.
    blocks_on: [34, 36]

  # ── the sign-off SUMMARY, and why it is its own step ─────────────────
  # MEASURED at v1.16.2: `phase3/final/metrics.json` had FIVE readers
  # (tapeout_docs_gen, ic_release_docs_gen, _ic_release_artefacts,
  # release_docs_check, and a comment in this file) and ZERO writers, and
  # `phase3/final/` was not a directory `_path_layout` defined. Its 18 keys are
  # OpenLane-2/LibreLane metric names; this flow drives OpenROAD, magic, netgen,
  # KLayout and OpenSTA directly and never runs LibreLane's Classic flow, which
  # is what would have written that file. So step 37.5ic could not produce ONE
  # of its six document outputs for ANY design, and no completed route could
  # change that: the missing artefact is not a layout, it is the summary of the
  # checks run ON the layout.
  #
  # It is its OWN step and not a clause of 37.5ic because it runs on EVERY
  # route: the IP arm's documents and the `_ic_release_artefacts` substance
  # check read the same record, and a summary of a run belongs to the run, not
  # to one of the two ways it can be delivered.
  - id: "37.4"
    name: "Sign-off metrics aggregation — the run's own checker verdicts, under the names the release documents read"
    stage: stage4
    required_inputs:
      - from: 37
        path: "phase3/stage4/gds/*.gds"
    required_outputs:
      - "phase3/final/metrics.json"
      - "reports/phase3/signoff_metrics_aggregate.json"
    gate:
      all_of:
        # BLOCKING, and it can really fail: `--check` refuses a tree with no
        # record and a tree whose record no longer states what its own reports
        # state. A clause that answered the same way for every design would be
        # the vacuous shape `test_step_37_5ic_gate_is_not_vacuous` refuses.
        - program_exit_zero: "signoff_metrics_aggregate . --check"
    blocks_on: [37]

  # ── cell/IP path — TERMINAL ──────────────────────────────────────────
  # Where the two paths part. An IP is delivered, not fabricated: it needs a
  # LEF so somebody else can place it, a Liberty so they can time it, and a
  # Verilog view so they can simulate it. It needs no pad ring, no seal ring
  # and no die id, because it is not a die. It therefore does NOT continue to
  # step 38 (foundry handoff) or to stage 5 (fabrication onwards).
  #
  # The analog path already had this terminal — A8 "Hardmacro Generation
  # (LEF + Liberty + GDS + Verilog)" — and the digital path never did, which
  # is why step 15 can place an analog hard macro and nothing this flow
  # produces digitally can be placed by anyone.
  - id: 37.5ip
    name: "Digital Hardmacro Generation — LEF + Liberty + GDS + Verilog (delivered on EVERY route)"
    stage: stage4
    condition:
      # `any_of` over ALL THREE routers — this step runs on every route a
      # design can take. OWNER RULING 2026-09-02: "an IC runs BOTH 37.5ic and
      # 37.5ip; only a pure-IP route skips 37.5ic." A chip ships its own IP
      # deliverable set — the four views plus the six integration documents —
      # ALONGSIDE its chip documents, because a die is also a block somebody
      # re-uses, characterises and hands on, and until this changed a design
      # that declared itself a die got NO `.lef`, NO `.lib` and NO datasheet
      # anywhere in its run.
      #
      # THE ROUTERS STAY MUTUALLY EXCLUSIVE. Nothing here relaxes that:
      # `tapeout_declaration_check` still refuses a tree carrying two of the
      # three, step 0.5ic's `required_outputs` is still their OR, and exactly
      # one still exists on any run where 0.5ic passed. What changed is only
      # WHICH of them this step accepts — all three instead of one — and the
      # asymmetry is deliberate and one-directional: 37.5ic below still names
      # the TWO chip routers and still excludes `NO_TEMPLATE.txt`, so a pure
      # IP is still not asked for a pad ring, a seal ring or a tape-out
      # precheck it has no die for.
      any_of: true
      files_exist:
        - "input/submission_template/NO_TEMPLATE.txt"
        - "input/submission_template/SELF_TAPEOUT.txt"
        - "input/submission_template/slots/*.yaml"
    # D6 (vibe-ic#1744). `design_dependent`, not `setup_required`: this
    # condition tests WHICH PATH the design is on, and step 0.5ic's
    # required_outputs declares the mutually-exclusive route artefacts, so on
    # any run where 0.5ic itself passed, precisely one of them exists — and
    # this step now accepts each of them. An IP legitimately has no pad ring,
    # seal ring or shuttle precheck; that N/A is 37.5ic's to record, and a
    # design-derived N/A is correct only after 0.5ic PASSes. The owner link
    # makes an unresolved/failed route a hard upstream blocker rather than the
    # chip path's apparent opposite.
    condition_kind: design_dependent
    condition_owner:
      step: 0.5ic
      declaration: delivery_route
    required_inputs:
      - from: 37
        path: "phase3/stage4/gds/*.gds"
    programs:
      - digital_hardmacro_gen
      # THE DOCUMENTS ARE AN OUTPUT OF THIS STEP, not a separate chore. Until
      # this producer existed, `required_outputs` here was the four views AND
      # NOTHING ELSE: a hard IP shipped with its LEF, Liberty, GDS and Verilog
      # and no statement of what it is, how to instantiate it, what the
      # integrating design MUST do, or what is known to be wrong with it. A chip
      # is fabricated and its facts survive in the run directory; an IP is
      # DELIVERED, and every fact not spelled by the four views reaches its
      # integrator in a document or does not reach them.
      #
      # WRITTEN BY THE RUNNER, NOT BY THE GATE, and 37.5ic's arrangement is
      # deliberately NOT copied: `step_digital_hardmacro_gen` already records
      # why (an auditor that writes a declared required_output into the project
      # it is auditing certifies its own output — A8's GDS producer was wired
      # into A8's gate and that was withdrawn on 2026-07-28 after the audit was
      # measured creating the very .gds its next clauses read). So this producer
      # is dispatched from `phase3_one_shot_runner.step_ip_release_docs_gen`,
      # and the gate below judges documents the audit did not touch.
      - ip_release_docs_gen
    required_outputs:
      - "phase3/stage4/hardmacro/*.lef"
      - "phase3/stage4/hardmacro/*.lib"
      - "phase3/stage4/hardmacro/*.gds"
      - "phase3/stage4/hardmacro/*.v"
      - "reports/phase3/digital_hardmacro.json"
      # ONE DIRECTORY PER DELIVERED PACKAGE, including the single-package case:
      # a kit with two macros has two datasheets, and a shape that collapses the
      # common case would make the shape exercised on every run different from
      # the shape a two-macro release takes. Named with the glob the producer
      # actually writes, for the reason 37.5ic's own note records: declaring a
      # bare filename no producer in this flow writes is "named nowhere the gate
      # can reach".
      - "phase3/stage4/documentation/ip/*/IP_DATASHEET.md"
      - "phase3/stage4/documentation/ip/*/IP_INTEGRATION_GUIDE.md"
      - "phase3/stage4/documentation/ip/*/RELEASE_NOTES.md"
      - "phase3/stage4/documentation/ip/*/ERRATA.md"
      - "phase3/stage4/documentation/ip/*/DELIVERABLES_MANIFEST.md"
      - "phase3/stage4/documentation/ip/*/documentation_manifest.yaml"
    gate:
      all_of:
        - program_exit_zero: "digital_hardmacro_check . --json reports/phase3/digital_hardmacro.json"
        # AND THE DOCUMENTS ARE JUDGED, NOT COUNTED. Existence is already
        # covered by `required_outputs` above, and existence is the weakest
        # thing that can be asked of a document: a datasheet with a hand-typed
        # pin count exists.
        #
        # This clause RE-DERIVES what the documents state and refuses a
        # disagreement with the tree — the stated signal pin count against the
        # delivered Verilog view (a different view, read by a different
        # program), every shipped-view sha256 against the file, every
        # quantitative field against the artefact path it cites, and the
        # manifest's own derived / NOT_MEASURED counts against a recount. It
        # also refuses a mandatory constraint that appears ONLY in an
        # Application Note, which is optional and is the first document dropped
        # from a delivery.
        #
        # rc 2 IS RESERVED AND IS NOT REACHABLE HERE ON A RUN THAT DELIVERS A
        # KIT. The gate answers rc 2 for exactly one state — no kit and no
        # documents, so there is no release to examine — and this step's own
        # condition means a run reaching it is on the IP path. A kit that EXISTS
        # with no documentation beside it is rc 1: crediting that to the vacuous
        # tier would reinstate the very defect this clause was added for. That
        # distinction is why this is a second clause and not a `files_exist`.
        - program_exit_zero: "release_docs_check . --arm ip --json reports/phase3/release_docs.json"
    # 0.5ic writes the NO_TEMPLATE.txt this step's condition reads.
    blocks_on: [37, 0.5ic]

  # ── chip/IC path only ────────────────────────────────────────────────
  # THE STEP WITH TWO ARMS, AND ONE OF THEM IS NOT OURS. Every other gate in
  # this tree we wrote, and a gate we wrote can be made to pass by editing it.
  # `tapeout_readiness_check` runs the SHUTTLE OPERATOR's own container and
  # reports its exit code — that is the one interface where somebody else's
  # refusal is the verdict.
  #
  # 2026-08-20 — `37.5self` IS RETIRED AS A STEP AND FOLDED IN HERE.
  # It used to be a THIRD ROUTE: `general_precheck`, our own ladder, reached
  # only by a design carrying `SELF_TAPEOUT.txt`. That made the two checks
  # ALTERNATIVES, and a design routed to one was never shown the other. It is
  # not an alternative. It is an ARM:
  #
  #   * OUR ladder (`general_precheck`) runs on EVERY design that reaches this
  #     step — shuttle or self tape-out, always, no condition.
  #   * The OPERATOR's container runs IN ADDITION, whenever the PDK ships a
  #     shuttle precheck AND that operator's template was actually fetched.
  #
  # This is strictly MORE checking than the three-route shape: a shuttle design
  # used to get only the operator's verdict, and now it gets two independent
  # authorities on the same GDS. A PDK with no shuttle precheck is NOT a
  # different route — it is this same step with one fewer arm.
  #
  # THE CONDITION IS `any_of`, AND THE REASON IS STRUCTURAL. `files_exist`
  # cannot express "and not", and `NO_TEMPLATE.txt` is ALREADY 37.5ip's
  # condition (the IP/hardmacro terminal), so this step cannot condition on
  # "chip and not IP" directly. `slots/*.yaml` OR `SELF_TAPEOUT.txt` — the two
  # chip-path router files 0.5ic writes — together ARE the chip-path marker.
  # `SELF_TAPEOUT.txt` survives as a FILE and keeps its meaning; only the STEP
  # that read it in isolation is gone.
  #
  # DISAGREEMENT IS THE MOST VALUABLE OUTCOME AND IT FAILS THIS STEP. When both
  # arms judge the same ladder step and reach opposite conclusive verdicts, one
  # of the two checks is wrong. `tapeout_precheck` records that as a finding of
  # its own and refuses; it never resolves it by preferring an arm, because
  # preferring one is how the wrong one survives.
  #
  # EVERY FINDING NAMES ITS AUTHORITY. The whole point of the operator's arm is
  # that its verdict is NOT one we wrote. Merging the arms into one step must
  # not blur that, so every line of the merged report carries the authority
  # that produced it and an `authority_is_ours` boolean beside it.
  - id: 37.5ic
    name: "Tape-out Precheck — our general ladder, plus the operator's own refusal where the PDK ships one (chip/IC path only)"
    stage: stage4
    condition:
      # `any_of`, not the default ALL-of: these are two MUTUALLY EXCLUSIVE
      # router files and no tree ever carries both (`tapeout_declaration_check`
      # refuses the tree that does). An ALL-of reading would make this step
      # unreachable for every design.
      any_of: true
      files_exist:
        - "input/submission_template/slots/*.yaml"
        - "input/submission_template/SELF_TAPEOUT.txt"
    # D6 (vibe-ic#1744). `design_dependent`, not `setup_required`: this
    # condition tests WHICH PATH the design is on, and step 0.5ic's
    # required_outputs is the OR of exactly the three router artefacts, so on
    # any run where 0.5ic itself passed, precisely one of them exists. The two
    # named here are the CHIP ones; the third (`NO_TEMPLATE.txt`) is the IP
    # terminal 37.5ip owns, and an IP legitimately has no pad ring, no seal
    # ring and no tape-out precheck — a design-derived N/A is correct only
    # after that PASS. The owner link makes an unresolved/failed route a hard
    # upstream blocker rather than the IP path's apparent opposite.
    condition_kind: design_dependent
    condition_owner:
      step: 0.5ic
      declaration: delivery_route
    required_inputs:
      - from: 37
        path: "phase3/stage4/gds/*.gds"
      # OUR arm compares the layout against what the design DECLARED about
      # itself. 0.5ic writes that declaration on every route, including the one
      # with no operator, so this input exists wherever this step runs.
      - from: 0.5ic
        path: "input/submission_template/tapeout_declaration.json"
    programs:
      - tapeout_docs_gen
      # THE PRODUCT DOCUMENTS ARE AN OUTPUT OF THIS STEP TOO, and they are NOT
      # what `tapeout_docs_gen` already writes. That generator emits SIGN-OFF
      # EVIDENCE — what was checked, what passed, what did not — for a reader
      # who already knows what the part is. It emits nothing that states what
      # the die IS: no interface, no outline, no mandatory operating
      # constraint, no errata, and no manifest binding the documents to the
      # artefacts they describe. `ic_release_docs_gen` writes that set, into a
      # different directory, for a different audience, on a different
      # lifecycle. The existing HTML stays exactly where it is at
      # `reports/phase3/docs/` — it is load-bearing in this step's blocking
      # `all_of`, and relocating it would be a change to 37.5ic's contract
      # dressed up as a documentation task.
      #
      # AND IT REFUSES WHAT THE SIGN-OFF GENERATOR CANNOT SEE. Every one of the
      # 17 properties `tapeout_docs_gen.release_blockers` decides is read from
      # `phase3/final/metrics.json`, which is a set of numbers ABOUT a layout
      # and not the layout: a run whose metrics state `route__drc_errors: 0`
      # and `timing__setup__ws: 0.42` gets a full sign-off report today while
      # its GDS carries ZERO geometry records. The new producer opens the
      # artefacts themselves and writes NOTHING when a class is hollow, naming
      # the rule — the chip-arm equivalent of the four `// stub` views step
      # 37.5ip already refuses.
      #
      # WRITTEN BY THE RUNNER, NOT BY THE GATE, exactly as 37.5ip's producer
      # is and for the reason `step_digital_hardmacro_gen` records: an auditor
      # that writes a declared required_output into the project it is auditing
      # certifies its own output. It is dispatched from
      # `phase3_one_shot_runner.step_ic_release_docs_gen`, and the gate clause
      # below judges documents the audit did not touch.
      - ic_release_docs_gen
    required_outputs:
      # THE MERGED RECORD — which arms ran, what each concluded, every finding
      # labelled with the authority that produced it, and every disagreement
      # between the two named rather than resolved.
      - "reports/phase3/tapeout_precheck.json"
      # OUR arm's own artefact, written by `general_precheck` itself. Declared
      # separately from the merge because a summary of a verdict and the
      # verdict are not the same document, and the arm's own report is the one
      # that carries its per-ladder-step evidence.
      - "reports/phase3/general_precheck.json"
      # THE OPERATOR's arm, written by `tapeout_readiness_check` itself. It is
      # written on EVERY path this step takes, including the paths where the
      # operator was never asked — a run that did not ask says so in this file
      # rather than leaving it absent, because an absent artefact and a
      # NOT_APPLICABLE one are read identically by everything downstream.
      - "reports/phase3/shuttle_precheck.json"
      # THE RELEASE DOCUMENTS ARE AN OUTPUT OF THIS STEP, not a separate chore.
      # Every fact they state -- per-checker verdict, per-corner slack, die
      # geometry, the precheck's own stage results -- is ALREADY produced here.
      # Leaving them as JSON in a run directory meant the only way to answer
      # "what did we actually sign off?" was to read a metrics file, and the
      # sign-off verdict existed nowhere as a sentence anyone could quote.
      # The generator computes that verdict FROM the table rather than being
      # told it, and writes NOT_MEASURED where an artefact is missing -- never
      # a default, because a plausible number hides the gap a hole would show.
      # Named with the glob the generator actually writes: it emits ONE pair per
      # (design, pdk) -- `SIGNOFF_<design>_<pdk>.html` -- so that two dies built
      # from the same tree cannot overwrite each other's sign-off. Declaring the
      # bare `SIGNOFF.html` named a file no producer in this flow writes, and
      # d4/criteria_match reported it as "named nowhere the gate can reach".
      - "reports/phase3/docs/SIGNOFF_*.html"
      - "reports/phase3/docs/BRIEF_*.html"
      # ONE DIRECTORY PER SIGN-OFF LAYOUT, including the single-layout case: a
      # tree with two sign-off streams has two datasheets, and a shape that
      # collapsed the common case would make the shape exercised on every run
      # different from the shape a two-die run takes. Named with the globs the
      # producer actually writes, for the reason this step's own note above
      # records about `SIGNOFF.html`: declaring a bare filename no producer in
      # this flow writes is "named nowhere the gate can reach".
      #
      # THE CONDITIONAL DOCUMENT IS NOT DECLARED HERE. `USER_REFERENCE_MANUAL.md`
      # is required only when the design is register-rich, which
      # `_release_docs_contract` decides from `L4_REGMAP` and the manifest
      # records; an UNCONDITIONAL claim over a conditionally-produced artefact
      # is the "declare an undeclared artefact and relocate the red" shape this
      # step's notes refuse. `release_docs_check` demands it on the runs that
      # owe it, from the manifest's own recorded decision.
      - "phase3/stage4/documentation/ic/*/PRELIMINARY_DATASHEET.md"
      - "phase3/stage4/documentation/ic/*/RELEASE_NOTES.md"
      - "phase3/stage4/documentation/ic/*/ERRATA.md"
      - "phase3/stage4/documentation/ic/*/documentation_manifest.yaml"
    gate:
      all_of:
        # ONE CLAUSE FOR BOTH ARMS, on purpose. Splitting them into two
        # `program_exit_zero` clauses was measured against the requirement and
        # fails it twice: `tapeout_readiness_check` alone cannot tell "this PDK
        # ships no shuttle precheck" (one fewer arm, legitimate) from "it ships
        # one and nobody fetched it" (NOT_DETERMINED), and nothing that sees
        # only one arm can report a disagreement between them.
        - program_exit_zero: "tapeout_precheck . --json reports/phase3/tapeout_precheck.json"
        - program_exit_zero: "tapeout_docs_gen --project . --out-dir reports/phase3/docs"
        # THE PRODUCT DOCUMENTS ARE JUDGED ON THEIR OWN EVIDENCE, not on the
        # producer's exit code. Nothing here trusts `ic_release_docs_gen`: this
        # gate RE-DERIVES every quantity the documents state, from a DIFFERENT
        # view where one exists — the signal pin count from the gate-level
        # netlist rather than the DEF the document was written off, the die
        # outline from `metrics.json` rather than that same DEF — and refuses a
        # disagreement naming both sides with both paths. It recomputes every
        # digest the manifest records, and it re-runs the artefact-substance
        # audit, because documents are FILES: an artefact hollowed out AFTER
        # generation leaves a beautiful set describing a die with nothing on it,
        # and a producer-side refusal alone would have run only at the one
        # moment the tree was known good.
        #
        # AND THE ONE THAT MAKES IT A GATE RATHER THAN A COMMENT: it derives
        # the releases it EXPECTS from `phase3/stage4/gds/*.gds` rather than
        # from the documentation directory, so "the die was signed off and
        # nobody documented it" is rc 1 with a name instead of an empty sweep
        # scored in a PASS tier. Until this landed the `ic` arm returned no
        # expected release at all and could only ever answer "nothing to
        # examine" — the v1.13.42 shape, inside the gate written to end it.
        - program_exit_zero: "release_docs_check . --arm ic --json reports/phase3/release_docs_ic.json"
        # `ppa_signoff_records` IS NOT WIRED HERE, AND THE ATTEMPT IS WHY THIS
        # NOTE EXISTS. It was added on 2026-08-25 with the reasoning that
        # 37.5ic is the first point where every axis it reads coexists —
        # drc_signoff.json, lvs_verdict.json, antenna, IR and spare_cells.json.
        # That part still holds. What did not is the consequence: one of the
        # files its source names, `reports/spare_preservation.json`, is written
        # by `spare_cell_preservation_check` under a CONDITIONAL clause at step
        # 34 and is declared in no step's `required_outputs`. Putting the
        # program in any gate therefore makes that path produced-consumed-
        # undeclared (d7 `W2`), and the repair reached for was a
        # `required_outputs` row at step 34 — an UNCONDITIONAL claim over a
        # conditionally-produced artefact, which is the "declare an undeclared
        # artefact and relocate the red" shape this step's own notes refuse
        # eight lines below. The red moved; nothing got measured.
        #
        # WHAT WOULD MAKE IT WIREABLE: a step that produces
        # `reports/spare_preservation.json` UNCONDITIONALLY and declares it. As
        # long as step 34's producer is conditional, no honest declaration
        # exists and no gate may read the path.
        #
        # NOTHING BELOW DEPENDS ON IT. `every_required_metric_key_has_a_
        # producer` was wired "immediately after its producer", but the argv
        # this clause carried had no `--json`, and `ppa_signoff_records` writes
        # its bundle ONLY when handed one (`if args.json: write_json(...)`) —
        # so it never wrote records for a sibling clause to read. The next
        # clause sweeps the run's already-emitted records and stands alone.
        # ORPHANED, RE-HOMED (2026-08-25). `every_required_metric_key_has_a_
        # producer` was authored, tested and merged and then invoked by nothing
        # but its own test. It reads the sign-off axis table
        # (`_ppa/feasibility.DEFAULT_AXES` — setup, hold, drv, drc, lvs,
        # antenna, ir, em, equivalence, eco_readiness) and asks the one
        # question that table cannot answer about itself: is every axis
        # actually PROVABLE from what this run emitted, or does an axis prove
        # from a metric name no producer here ever MEASURED?
        #
        # WIRED HERE AND NOWHERE EARLIER, AND NOT ON A SIBLING CLAUSE'S OUTPUT.
        # It is EMPIRICAL — it sweeps the `"metric":` names in the records a
        # run has already emitted, because a static scan of the producers'
        # source declared a whole working axis unprovable (the producers build
        # names by format, not by literal). So what it needs is a run whose
        # records exist, which is what makes 37.5ic the earliest honest home:
        # every axis it reads — drc_signoff.json, lvs_verdict.json, antenna,
        # IR — first coexists here. At step 36 the records do not exist yet
        # (37.5ic blocks_on 37, which blocks_on 36), so the same clause there
        # would be rc 2 on every run forever — a clause that never ran, which
        # is the shape #1121 and the `tapeout_docs_gen` v1.11.3 defect above
        # both name.
        #
        # ADVISORY, and the measurement is why. Driven over this repository's
        # own record trees it is rc 1: the `em` and `equivalence` axes have
        # 0 MEASURED against 370 NOT_MEASURED apiece, and `ppa-e2e` adds
        # `eco_readiness`. Those are REAL — a producer declares the name and no
        # run has ever measured it — but they are a producer-side gap that
        # predates this wiring, and blocking a tape-out precheck on it would be
        # the "declare an undeclared artefact and relocate the red" shape this
        # step's own notes refuse. The advisory slot RUNS it and RECORDS the
        # verdict on every real run, which is what its unit test could never do.
        #
        # NO `--json`: the gate writes nothing unless handed one, so it cannot
        # cascade into `step_internal_fail_bubble_up_check` at step 36 through a
        # verdict-bearing report, and this step's `required_outputs` needs no
        # new entry. Bare invocation, positional root — its parser takes
        # `root` positionally (`nargs="?"`), so `--root` would be
        # `unrecognized arguments` -> rc 3 on every arm.
        - advisory_program_exit_zero:
              command: "every_required_metric_key_has_a_producer ."
              advisory_reason: "NOT-YET-CLEAN: this gate CAN refuse and is wired advisory as a ratchet position, not as a verdict. Notch measured rc 2 on a real spm run (2026-08-31): NOT CHECKED on that run — no input reached it, so the notch is unmeasured and this clause is not yet evidence of anything."
        # AND THE SAME QUESTION ONE LAYER OUT. The clause above asks whether a
        # required METRIC has a producer. This one asks whether a declared
        # closed-loop EDGE has one — whether the step it falls back to can even
        # SEE the quantity its trigger names.
        #
        # `EXECUTABLE = 0` over 18 DECLARED_ONLY edges reads like a backlog and
        # is not. Measured on THIS tree at v1.12.30: 21 declared edges,
        # REACHABLE=0, UNREACHABLE=2, UNSTATED=19. Both edges that name a
        # metric are unreachable for the same reason — no producer at the
        # fallback step reads it — so re-entering the step would reproduce what
        # it produced before, and the loop would be inert by construction.
        #
        # Reading that number as a wiring backlog cost three separate attempts
        # to close the area edge in one session. This clause is the second.
        #
        # `--json` HERE, unlike the clause above, and deliberately: the sibling
        # withholds it because its verdict would cascade through
        # `step_internal_fail_bubble_up_check`. This report declares no
        # top-level `verdict` field at all — only a per-edge one whose values
        # are REACHABLE/UNREACHABLE/UNSTATED, none of which is FAIL or MISSING
        # — so it cannot bubble, and withholding it would leave an ADVISORY
        # census with nothing a reader can re-check.
        - advisory_program_exit_zero:
              command: "closed_loop_metric_reaches_its_producer . --json reports/phase3/closed_loop_metric_reach.json"
              advisory_reason: "CENSUS, correct permanently: it counts the flow's declared closed_loop edges and how many can reach a producer that reads the metric the trigger names. UNREACHABLE is a fact about the tree's capabilities, not a defect any one change owns."
        # THE SIBLING ABOVE IS ADVISORY AND CANNOT BE ANYTHING ELSE: its finding,
        # UNREACHABLE, is a fact about what this tree is CAPABLE of, inherited by
        # every landing and owned by none. This clause is the other half of that
        # question and it is BLOCKING, because its finding is a defect a change
        # INTRODUCES.
        #
        # It also measures a DIFFERENT POPULATION, which is the reason it exists.
        # The sibling reports REACHABLE over the flow's DECLARED edges. That
        # number is a true statement about the declarations and a false
        # impression of the flow: the declared edges and the re-entry loops the
        # runners actually execute are DISJOINT SETS. The area re-synthesis loop,
        # the routing-congestion loosen ladder, the over-utilisation die-upsize
        # retry and the RTL repair retry all run on real projects and appear in
        # none of the three declaration censuses — the last of them carrying its
        # own inertness detector, `FAIL_RTL_REPAIR_INERT`, and still invisible to
        # all three.
        #
        # `program_exit_zero`, not advisory, and the failing condition is
        # REACHABLE rather than notional: a re-entry site that can neither change
        # what it feeds in nor read back what came out (rc 1), or a recorded site
        # that has since lost one of those two signals. Both are proven reachable
        # by mutation in `test_closed_loop_executed_reentry_census.py`, which
        # breaks a running loop in two arms and holds two control loops still.
        #
        # SCOPE, MEASURED — and it is the DESIGN's, not the shipped tree's.
        #
        # This clause was briefly declared tree-scoped here, on the belief that
        # its answer was about the plugin's own re-entry loops and could not
        # move with the project. `test_every_tree_scoped_gate_clause_really_is_
        # tree_scoped`, written in the same change to PROVE that declaration,
        # REFUTED it: rc 2 on a tree carrying only a router file, rc 0 on one
        # carrying a floorplan, a routed DEF, a GDS, a netlist and a
        # declaration. The answer moved with the project, so the subject IS the
        # project. The key is removed and this clause is held to the design
        # standard like every other clause of this step.
        #
        # What it actually does, measured at v1.15.84: it REFUSES (rc 2) a
        # project that produced no phase-3 artefact — the guard v1.15.80 added
        # to `closed_loop_executed_reentry_census` — and answers (rc 0) once
        # there is something to grade. That is correct design-gate behaviour,
        # and `test_no_gate_of_a_running_path_step_passes_on_an_empty_tree`
        # covers it directly. The clause stays BLOCKING and its ratchet is
        # untouched.
        - program_exit_zero:
              command: "closed_loop_executed_reentry_census . --json reports/phase3/closed_loop_executed_reentry.json"
    # 0.5ic writes the router files this step's condition reads, the template
    # the operator's arm is run against, and the declaration our arm compares
    # the layout to.
    # 37.4 writes `phase3/final/metrics.json`, which THIS step's document
    # generators read and refuse without.
    blocks_on: [37, 0.5ic, "37.4"]
    notes: >-
      Three verdicts and no fourth, and the merge inherits them unchanged from
      both arms: PASS only when every arm that ran carries passing evidence for
      every one of its ladder steps; FAIL when either arm refuses or when the
      two arms disagree; NOT_DETERMINED when an arm could not reach a verdict —
      a declaration question left unanswered, a delegated checker that could not
      run, an operator container that could not be resolved, or a PDK whose
      shuttle precheck exists and was never fetched. NOT_DETERMINED exits 1, the
      same as a refusal: a silence credited as a pass is the defect this step
      exists for.
  - id: 38
    name: "Foundry Handoff (mask spec + WAT plan + scribe layout + corner test kit)"
    stage: stage4
    required_inputs:
      - from: 37
        path: "phase3/stage4/gds/*.gds"
    skills: [tapeout-checklist]
    programs:
      - foundry_handoff_package_check
    required_outputs:
      - "phase3/stage4/foundry_handoff/mask_spec.json"
      - "phase3/stage4/foundry_handoff/wat_plan.json"
      # The scribe-line PCM/alignment frame is FOUNDRY-SUPPLIED — this flow
      # cannot generate it, and the pack generator emits a `.PENDING_FOUNDRY.txt`
      # note in its place saying exactly that. Demanding the .gds
      # unconditionally required an artefact the flow never produces.
      # Either form satisfies the requirement; NEITHER present is still a real
      # gap, because then nothing states where the frame is coming from.
      # `foundry_handoff_package_check` enforces the SAME either-form rule (it
      # used to keep the member out of `_REQUIRED_FILES` entirely, which is why
      # a kit with no frame and no note still reported "all required artefacts
      # present"), and when the note is what satisfied it, the gate surfaces
      # PENDING_FOUNDRY_scribe_line_layout so the tapeout checklist tracks it.
      - "phase3/stage4/foundry_handoff/scribe_line_layout.gds OR phase3/stage4/foundry_handoff/scribe_line_layout.PENDING_FOUNDRY.txt"
      - "phase3/stage4/foundry_handoff/corner_test_vectors.json"
      - "reports/phase3/foundry_handoff_audit.json"
    gate:
      program_exit_zero: "foundry_handoff_package_check . --json reports/phase3/foundry_handoff_audit.json"
    blocks_on: [37]
    notes: |
      Final foundry-deliverable kit: mask reticle spec, WAT
      (Wafer Acceptance Test) probe plan, scribe-line PCM
      structures, corner-test ATE vector kit. Without this kit
      the foundry cannot accept the GDS for fab. Distinct from
      Step 36 tapeout_checklist which is internal sign-off.

  - id: 39
    name: "FPGA final sign-off (recompile + on-board test)"
    stage: stage4
    required_inputs:
      - from: 1
        path: "phase2/stage1/rtl/*.sv OR phase2/stage1/rtl/*.v"
      - from: external
        check: none
        what: "a physical FPGA board on the bench"
    # fpga-test-harness never shipped (see unbuilt_skills); fpga-signaltap
    # ships and is this step's AI half.
    skills: [fpga-signaltap]
    programs:
      # Wave 82 — `bringup_plan_gen` emits the bring-up plan from
      # L13_LAB_CALIBRATION before the on-board attestation runs;
      # gives the lab tech a deterministic checklist for the
      # board-up sequence (probe order / supply ramp / safe-states).
      - bringup_plan_gen
      - fpga_on_board_attestation_check
      # ── vibe-ic#693 — the two SignalTap gates: REGISTERED, NOT WIRED ──────
      #
      # Both are shipped, gate-shaped, and (as of 2026-08-03) referenced from
      # no executable location at all. Being listed HERE is the DISCLOSURE
      # #693 asks for, not permission: it puts them in an executable location's
      # `programs:` list with the reason recorded next to the step they belong
      # to, exactly as `fpga_test_harness_gen` and `debug_first_pass` are
      # registered at step 6. Neither appears in this step's `gate:` block, and
      # that is deliberate; the measurement is below. Both are driven EXPLICITLY
      # by the agent following skills/fpga-signaltap/SKILL.md with a board on
      # the bench.
      #
      # `_UNROUTED_INVENTORY` in gate_skip_routing_check.py is NOT the right
      # register for either, and putting them there was tried and measured:
      # that table counts UNROUTED SKIP PATHS, not unwired gates, and injecting
      # a gate makes the ratchet exit 1 ("[RATCHET-FIXED] ...: 1 -> 0; delete
      # the inventory entry"). After the rc 0 -> 2 repair in this same change
      # their skip paths are ROUTED, so they can never legitimately appear
      # there. `_SEMANTIC_ARGV_UNDRIVABLE` / `_NOT_A_PROJECT_GATE` /
      # `_UNDRIVABLE_BY_STRUCTURAL_UMBRELLA` are all wrong too: each carries a
      # parametrized test asserting membership in `_STRUCTURAL_RTL_GATES`, and
      # neither gate is registered there.
      #
      # signaltap_recompile_sequence_check
      #   ASSERTS: quartus_stp -> quartus_map -> quartus_fit -> quartus_asm all
      #   present, in canonical order, with --stp_file=<x>.stp. The defect is
      #   real and expensive: omit quartus_stp and you get a perfectly valid
      #   SOF containing NO logic analyzer, discovered only after programming
      #   the board.
      #   WHY NOT WIRED: the flow does not emit that sequence. Its only FPGA
      #   command line is `quartus_sh --flow compile <base>`
      #   (design_one_shot_runner), which contains none of the four tokens and
      #   returns SKIP. Repo-wide there are 0 compile.log, 0 *.map.rpt and 0
      #   *.sof files, and grep for `quartus_stp` outside docs returns only
      #   tools/signaltap_gen.py, the gate, and its test. Wired at step 6 or
      #   here it would be rc=2 NOT-CHECKED on 28/28 published run roots — a
      #   permanently silent gate. Its subject exists only when an engineer is
      #   re-fitting a SignalTap image at the bench.
      #
      # signaltap_stp_completeness_check
      #   ASSERTS: a generated .stp captures every DUT port plus the four
      #   BIST-engine signals, and defines a trigger, a positive sample depth
      #   and a capture clock.
      #   WHY NOT WIRED: no flow step produces a .stp, and 0 exist in the
      #   published corpus, so any automatic wiring is rc=2 on 28/28. It is
      #   ALSO not yet safe as a post-condition of its own producer: the MCP
      #   tool `eda_rtl_signaltap_autogen`, which this gate's header and
      #   skills/fpga-signaltap/SKILL.md both name as THE generator, fails it
      #   on its default invocation (measured against the published sha256 RTL:
      #   one signal emitted, 4 x MISSING_BIST_SIGNAL + 8 x MISSING_PORT +
      #   NO_TRIGGER). The other shipped producer, tools/signaltap_gen.py,
      #   PASSES it. Making the gate blocking before that producer split is
      #   settled would break the declared generator 100% of the time.
      - signaltap_recompile_sequence_check
      - signaltap_stp_completeness_check
    # WHAT IS NOT DECLARED HERE, AND WHY — reports/phase3/gates/stage4_compliance.json.
    # It was declared from v1.13.96 until this change, and it made this step a
    # PERMANENT MISSING: the only thing in the whole plugin that writes that path
    # is the FIRST CLAUSE OF THIS STEP'S OWN GATE, so no run can produce it and
    # only the auditor can. `flow_compliance_check` refuses exactly that —
    # "AUDIT-CREATED OUTPUT REFUSED: present, but written by this step's own gate
    # rather than by the run" — and it refuses it on every pass, by design. The
    # dimension-7 registry had already measured this shape on FS1 and spent a
    # waiver on it in those words ("a declaration cannot be satisfied by a run —
    # only by the auditor"); this step took the other branch and became the red
    # that waiver predicted. The artefact is not undeclared-and-unwatched: it is
    # written by clause 1 and READ by clause 2 of this same gate, inside one
    # `check_step` call, so its absence refuses on the spot — which is the
    # EVIDENCE class dimension 7 already defines for a report a gate writes and
    # checks in one invocation. See `matrix_d7_artifact_graph._consumers_of_output`.
    required_outputs:
      - "phase2/stage1/fpga/final/*.sof"
      - "reports/phase2/fpga/on_board_pass.json"
    # Hardened 2026-04-22: single-JSON self-attestation ("echo
    # all_scenarios_passed: true > on_board_pass.json") is rejected.
    # Requires: pass.json with hashed bitstream + scenarios list;
    # quartus_pgm.log with tool-marker; and at least one non-JSON
    # hardware evidence artefact (webcam / UART / scope).
    gate:
      all_of:
        # ── ON-PASS REVIEW of stage4 ─────────────────────────────────
        # Declared on the stage (`stages[].on_pass_review`), DISPATCHED here.
        # HERE, AND NOT ON STEP 40, and the difference is whether it runs at
        # all. Step 40's `condition:` names
        # `phase3/stage5_manufacturing/silicon_received.json`, a path that has
        # never existed in any run tree or any commit in this repository's
        # history, so the clause was SKIPPED-CONDITION on every project that has
        # ever executed this flow. Step 39 is the LAST step in the flow with no
        # `condition:` of any kind -- M1-M4 are conditioned on
        # phase1/analog/analog_block_list.json and 40-44 on silicon_received.json
        # -- and by the time it runs, steps 33-38 (power, fill, DFM, tapeout
        # checklist, GDSII, foundry handoff) are done and the die exists. That
        # is what "stage 4 passed" has to mean for a review of the die.
        #
        # `advisory_`, NOT `program_exit_zero`: the block declares
        # `verdict: advisory` and the program declares
        # `DECLARED_ENFORCEMENT = "advisory"`. The blocking slot would make a
        # rejection stop the step -- turning "unverified" into "blocking",
        # which #1253 refuses -- and would additionally read the program's
        # rc=2 NOT CHECKED as VACUOUS_PASS.
        #
        # `stage4_compliance` IS A STAGE-4 WRAPPER ON A STAGE-4 STEP, which is
        # exactly the wiring the old comment at step 40 called unbounded
        # recursion. `--exclude-step 39` is what bounds it, and it bounds it
        # STRUCTURALLY: the nested pass never evaluates the step whose gate
        # spawned it, so the cycle is not in the graph at all and termination
        # does not depend on anything surviving the trip into the child. It is
        # also the honest scope -- read from step 39, "did stage 4 pass" cannot
        # include step 39, which is the step still being evaluated.
        # `flow_compliance_check` additionally carries a scope stack
        # (`VIBEIC_FCC_ACTIVE_SCOPES`) as a BACKSTOP for a future self-scoping
        # clause wired without an exclusion; it is not what makes THIS clause
        # terminate, and it is not relied on here.
        - advisory_program_exit_zero:
              command: "stage4_compliance . --exclude-step 39 --json reports/phase3/gates/stage4_compliance.json"
              advisory_reason: "NOT-YET-CLEAN: this gate CAN refuse and is wired advisory as a ratchet position, not as a verdict. Notch measured rc 1 on a real spm run (2026-08-31): it REFUSES TODAY on real input; the advisory slot is currently swallowing a live finding. Promote to blocking once this run is clean. It reported: STRUCTURAL MEASUREMENT: registered=null invoked=null no_verdict=null — the structural-RTL umbrella was NOT ASKED to run in this invocation, so this re"
              condition_files_exist:
                - "phase3/stage4/gds/*.gds"
              absent_condition_reason: "Scoped to a run that produced a die. This clause and the one below review STAGE 4 — the die steps 33-38 — and this step's own comment above states the assumption they rest on: 'by the time it runs, steps 33-38 are done and the die exists'. The assumption was asserted and never checked, so on a run that exercised only the FPGA path (step 39's own required_inputs are RTL plus a board on the bench, and its blocks_on names 6 and 13 — no die step) stage4_compliance refuses with ZERO_DENOMINATOR and stage_on_pass_review refuses rc=2 'stage stage4 did not pass'. Both refusals are honest and both are DISCLOSED_INCOMPLETE, which made the board sign-off INCOMPLETE for the absence of a die it never claimed to have. phase3/stage4/gds/*.gds is step 37's declared output and the die itself: present, both clauses run exactly as before and can still refuse; absent, step 37 is already MISSING and stage 4 has already failed loudly, so nothing that was measured stops being measured. The step's own on-board attestation clauses still decide whether the board passed."
        - advisory_program_exit_zero:
              command: "stage_on_pass_review . --stage stage4 --json reports/phase3/gates/stage4_on_pass_review.json --compliance reports/phase3/gates/stage4_compliance.json"
              advisory_reason: "DEMOTED, not designed advisory: wired blocking until da6fcd7fe (2026-08-30), moved here in the change that made the declared command actually execute; that push used --no-verify because the full tier did not stamp. Restore blocking once the six on-pass stage commands run green. Re-pointed at the per-stage compliance report in v1.13.78; notch re-measured rc 2 on that invocation, unchanged in class."
              condition_files_exist:
                - "phase3/stage4/gds/*.gds"
              absent_condition_reason: "Scoped to a run that produced a die. This clause and the one above review STAGE 4 — the die steps 33-38 — and this step's own comment above states the assumption they rest on: 'by the time it runs, steps 33-38 are done and the die exists'. The assumption was asserted and never checked, so on a run that exercised only the FPGA path (step 39's own required_inputs are RTL plus a board on the bench, and its blocks_on names 6 and 13 — no die step) stage4_compliance refuses with ZERO_DENOMINATOR and stage_on_pass_review refuses rc=2 'stage stage4 did not pass'. Both refusals are honest and both are DISCLOSED_INCOMPLETE, which made the board sign-off INCOMPLETE for the absence of a die it never claimed to have. phase3/stage4/gds/*.gds is step 37's declared output and the die itself: present, both clauses run exactly as before and can still refuse; absent, step 37 is already MISSING and stage 4 has already failed loudly, so nothing that was measured stops being measured. The step's own on-board attestation clauses still decide whether the board passed."
        - json_field_true: {file: "reports/phase2/fpga/on_board_pass.json", field: "all_scenarios_passed", expect: true}
        - program_exit_zero: "fpga_on_board_attestation_check . --json reports/phase2/fpga/on_board_attestation.json --min-scenarios 1"
        # WHO IS BLOCKED, THE BOARD OR THE RTL — asked at the step that owns the
        # on-board verdict. `hw_vs_rtl_verdict_check` was authored in the v0.45
        # cycle from a measured mistake: "hardware blocked" was declared after
        # two RTL spins whose tester responses DIFFERED byte-for-byte, which is
        # proof the bug was still in the RTL. It was then reachable from
        # nothing — `flow_compliance_check`'s own exclusion list carries the
        # line `"hw_vs_rtl_verdict_check" — needs hardware verdict file`, which
        # named the reason it could not be auto-run and left it unwired.
        #
        # CONDITIONAL, on the same shape step 6's `fpga_led_probe_lint` uses:
        # the responses directory is written by whatever bench harness drove
        # the variants, so on a headless doc-to-GDS run there is nothing to
        # look at and the clause says so by name instead of running over an
        # empty dir. When a blame campaign HAS been recorded, the gate reads
        # every variant and refuses the hardware verdict unless at least three
        # of them returned a byte-identical FAIL.
        #
        # ADVISORY, not blocking: the step's own two clauses already decide
        # whether the board passed. This one judges the REASONING about a
        # failure, which is a finding to record, never a second pass/fail.
        # No `--json` sink, so it declares no artefact `required_outputs`
        # would then have to promise on every run.
        #
        # AND WHEN THE VARIANTS DIFFER, IN WHICH FIELD. `--layout` names the
        # project's OWN `frame_layout.json` -- the tester is the user's choice,
        # so the field table is a per-project fact this flow never synthesises.
        # With one present the differing frames are decoded field-by-field
        # through `tester_verdict_frame_decode` (header / opcode / payload / CRC
        # / verdict, plus the `frame_offset_shift` / `payload_truncated` /
        # `crc_mismatch` hints); without one the finding is exactly the bare
        # byte indices it was before, and the gate says which of the two
        # happened rather than decoding nothing quietly. The path is a SIBLING
        # of `hw_blame/`, never inside it: every `*.json` under the responses
        # dir is loaded as a variant, so a layout stored there would be read as
        # a malformed tester response (MEASURED: one INVALID_VARIANT finding).
        - advisory_program_exit_zero:
            command: "hw_vs_rtl_verdict_check --responses-dir reports/phase2/fpga/hw_blame --layout reports/phase2/fpga/frame_layout.json"
            advisory_reason: "NOT-YET-CLEAN: this gate CAN refuse and is wired advisory as a ratchet position, not as a verdict. Notch measured rc 2 on a real spm run (2026-08-31): NOT CHECKED on that run — no input reached it, so the notch is unmeasured and this clause is not yet evidence of anything."
            condition_files_exist:
              - "reports/phase2/fpga/hw_blame/*.json"
            absent_condition_reason: "Scoped to a run that actually ran a hardware-vs-RTL blame campaign. The per-variant tester responses are produced by the bench harness, never by this flow, so a run with no board and no variant sweep has nothing to compare; the gate would be reading an empty directory rather than judging a verdict. The step's own on-board attestation clauses still decide whether the board passed."
    # Step 6 is the ONLY step in this flow that compiles/burns an FPGA image
    # and the sole producer of any .sof (grep the file: 6 and 39 are the only
    # steps that name a .sof path, and 39's own programs — bringup_plan_gen,
    # fpga_on_board_attestation_check — produce none). It was absent from this
    # list both directly and transitively (39→13→12→…→1/2/3/7/8/9/10 never
    # reaches 6), so a final sign-off could be judged done while the step that
    # builds the bitstream it signs off had failed.
    #
    # DISCLOSED SECOND EFFECT — this is not only an ordering edge. `blocks_on`
    # is also the waiver-inheritance graph (#502): a MISSING step whose
    # blocks_on ancestry reaches a WAIVED step becomes DEFERRED-BY-UPSTREAM,
    # and `total_required` SUBTRACTS that bucket. So a waiver written for step
    # 6 alone now also removes step 39 from the required denominator. Measured
    # on an empty project with a waivers.json waiving step 6 only:
    #     without this edge   MISSING=39, Steps: 0/39
    #     with    this edge   MISSING=38, DEFERRED-BY-UPSTREAM=1, Steps: 0/38
    # That reading is the intended one — step 39 signs off the bitstream step 6
    # produces, so one waiver is one deduction rather than two — but it moves a
    # sign-off denominator, so it is stated here and pinned by
    # test_signoff_medlow_backlog_gaps.py rather than left to be discovered.
    # A step-6 FAIL still does NOT defer 39: real counter-evidence never
    # converts (#502), it only annotates (#503).
    #
    # 37 IS DECLARED BECAUSE IT IS READ. The two stage-4 review clauses above
    # are scoped on `phase3/stage4/gds/*.gds`, which is step 37's declared
    # output, and dimension 5 measures exactly that read: "step 39 reads
    # 'phase3/stage4/gds/*.gds', declared as a required_output of step 37, but
    # 37 is not in 39's blocks_on closure". The dependency was already real —
    # the comment beside those clauses rests on it ("by the time it runs, steps
    # 33-38 are done and the die exists") — and only the declaration was
    # missing. Same disclosed second effect as step 6 above, and no more: a
    # waiver on 37 now also removes 39 from the required denominator, while a
    # step-37 FAIL or MISSING still does not defer 39, so a run that never
    # reached the die is judged on its board exactly as before.
    blocks_on: [6, 13, 37]

# ─────────────────────────────────────────────────────────────────
# Wave 88 closed 4 assessment-report gaps (Mixed-Signal Integration
# M1-M4, Analog PV [now A6], Foundry Handoff [now 36], Manufacturing
# [now 38-41]). Wave 90 / v1.6.14 integerised the decimal ids; the
# Design-for-ECO Step 18 insert renumbered every id >= 18 by +1.
# All chip-AGNOSTIC.
# ─────────────────────────────────────────────────────────────────


  - id: M1
    name: "Mixed-Signal Top-Level Integration (A+D GDS merge + macro placement)"
    stage: stage_mixed_signal
    required_inputs:
      - from: 37
        path: "phase3/stage4/gds/*.gds"
      - from: A8
        outputs: all
    condition:
      files_exist: ["phase1/analog/analog_block_list.json"]
    # flow-orchestrate REMOVED: skills/_classification.json records it under
    # deprecated_skills. analog-flow-orchestrate ships and is the canonical
    # A1-A9 / mixed-signal reference this step needs.
    skills: [analog-flow-orchestrate]
    programs:
      # M1-d4 — the PRODUCER was missing here and from every runner.
      # mixed_signal_merge_check only PASSes when
      # reports/analog/mixed_signal/top_lvs.json says verdict PASS, and the
      # ONLY writer of that file (and of top_merged.gds, M1's own declared
      # output) is mixed_signal_top_lvs_run — which no runner, gate or MCP
      # tool ever invoked. Measured on a fixture holding every input the
      # producer needs: running everything M1 declared left top_lvs.json
      # absent and M1 FAILing MERGE_NOT_LVS_SUBSTANTIATED. Declared AND
      # invoked below.
      - mixed_signal_top_lvs_run
      - mixed_signal_merge_check
    required_outputs:
      - "phase3/mixed_signal/top_merged.gds"
      - "reports/analog/mixed_signal/merge.json"
    gate:
      all_of:
        # PRODUCER, advisory on purpose: producing is not a verdict. It runs
        # (KLayout merge -> Magic extract -> netgen compare) and writes
        # top_lvs.json + its own run record; a missing tool / PDK tech / input
        # is its documented rc=2 disclosed skip, and an environment failure
        # must not become a second blocking FAIL on top of the one the checker
        # below already reports. The BLOCKING verdict stays with
        # mixed_signal_merge_check, which reads what this writes — so M1 still
        # cannot PASS without a real top-level LVS PASS.
        - advisory_program_exit_zero:
              command: "mixed_signal_top_lvs_run . --json reports/analog/mixed_signal/top_lvs_run.json"
              advisory_reason: "NOT-YET-CLEAN: this gate CAN refuse and is wired advisory as a ratchet position, not as a verdict. Notch measured rc 2 on a real spm run (2026-08-31): NOT CHECKED on that run — no input reached it, so the notch is unmeasured and this clause is not yet evidence of anything."
        - program_exit_zero: "mixed_signal_merge_check . --json reports/analog/mixed_signal/merge.json"
    blocks_on: [A8, 15, 37]
    notes: |
      Merge each analog analog/hardmacro GDS into the digital top GDS at
      its assigned floorplan position. Verify no overlap, all macro
      pins land on routable tracks, and macro-halo / blockage rules
      from PDK are honoured.

      top_lvs_run.json is deliberately NOT a required_output: on the
      producer's honest rc=2 skip it still exists (carrying the named gap),
      so declaring it would let the gate's own side effect satisfy M1's
      artefact check. The two declared outputs are design artefacts.

      LIMIT OF THAT PRINCIPLE — stated here so it is not read as absolute.
      `reports/analog/mixed_signal/merge.json` IS declared above and IS a
      gate-member side effect, twice over: `mixed_signal_merge_check` writes
      it as its own `--json` report, and `mixed_signal_top_lvs_run` writes a
      second copy of it directly (mixed_signal_top_lvs_run.py:258). Both
      writes pre-date this wiring; naming the producer in the gate did not
      create the overlap, it only made the second writer reachable. It is
      left declared because `required_outputs` is ALL-of-N and the other
      entry, `phase3/mixed_signal/top_merged.gds`, is a real design artefact
      no checker fabricates — so merge.json alone can never satisfy M1 — and
      because the BLOCKING verdict belongs to `mixed_signal_merge_check`,
      which reads `top_lvs.json`, a file no checker writes. Aligning it
      properly (dropping merge.json from required_outputs, or moving the
      checker's report off the declared path) is a separate change with its
      own blast radius and is NOT done here.

      REACHABILITY LIMIT. The producer is dispatched from exactly one place,
      `vibe_ic_one_shot_runner` (:813); `phase3_one_shot_runner` and
      `phase23_one_shot_runner` do not dispatch it. Since `check_step`
      returns MISSING on absent `required_outputs` before it ever evaluates
      this gate, M1 becomes reachable on a fresh project only via
      `/vibe-ic-all`. `/vibe-ic-phase3` and `/vibe-ic-phase23` still never
      reach it. Widening that is a runner change, not a declaration change.

  - id: M2
    name: "Mixed-Signal Power Domain + Level Shifter / Isolation Verification"
    stage: stage_mixed_signal
    required_inputs:
      - from: M1
        path: "phase3/mixed_signal/top_merged.gds"
    condition:
      files_exist: ["phase1/analog/analog_block_list.json"]
    skills: [ir-drop-triage]
    programs:
      - power_domain_crossing_check
      - level_shifter_required_check
      - isolation_cell_required_check
      - power_domain_signal_crossing_check
    # M2-d4 — KNOWN GAP, deliberately left declared and RED.
    # These three are the power intent + the cells the UPF-driven
    # implementation flow actually inserted. No program in this plugin writes
    # any of them (verified across the whole tree: every hit is a consumer, a
    # checker or a test fixture), so on a real mixed-signal run all three are
    # absent, check_step returns MISSING before the gate below ever runs, and
    # M2 cannot be certified. That MISSING is TRUE — M2's substance genuinely
    # is not established — and it stays.
    # What must NOT be done to make it green: swapping these for the four
    # `--json` paths the gate members below write would let the audit's own
    # side effect satisfy M2's artefact check on the next invocation, and
    # emitting a power_domain.json with an empty `crossings` list would make
    # power_domain_crossing_check report "0 crossings audited; all protected".
    # Both are vacuous PASSes. Closing this needs a real emitter that reads the
    # UPF *and* the post-PnR netlist for INSERTED protection cells — an owner
    # decision, not a declaration edit.
    # vibe-ic#600 — the paragraph above has said "KNOWN GAP, deliberately left
    # declared and RED" since M2-d4, and a COMMENT is not machine-readable, so
    # the cascade could not see it: M2's `blocks_on` ancestry reaches step 13's
    # LEC waiver and M2/M3/M4 were reported DEFERRED-BY-UPSTREAM(13). That is a
    # softer verdict carrying an implicit roadmap — close 13 and these return —
    # and closing 13 would move none of them. The gap is stated here instead.
    known_gap: "no program in this plugin writes M2's required_outputs; closing
      this needs a real emitter that reads the UPF and the post-PnR netlist for
      INSERTED protection cells — an owner decision, not a declaration edit"
    required_outputs:
      - "reports/analog/mixed_signal/power_domain.json"
      - "reports/analog/mixed_signal/level_shifter.json"
      - "reports/analog/mixed_signal/isolation.json"
    gate:
      all_of:
        - program_exit_zero: "power_domain_crossing_check . --json reports/analog/mixed_signal/power_domain_crossing_audit.json"
        - program_exit_zero: "level_shifter_required_check . --json reports/analog/mixed_signal/level_shifter_audit.json"
        - program_exit_zero: "isolation_cell_required_check . --json reports/analog/mixed_signal/isolation_audit.json"
        # v1.3.96 — cross-power-domain SIGNAL crossing: derives the isolation/
        # level-shifter REQUIREMENT from the UPF power-domain definitions +
        # power states (which the three sibling gates do not parse) and audits
        # the UPF STRATEGY covers it. Self-guards: single/zero-domain →
        # NOT_APPLICABLE, no power intent → SKIP rc 0.
        - program_exit_zero: "power_domain_signal_crossing_check . --json reports/phase2/gates/power_domain_signal_crossing.json"
    blocks_on: [M1]
    notes: |
      For each net crossing analog/digital power domain boundary:
      level shifter required when source/sink Vdd differ; isolation
      cell required when one domain can be powered down. Audit
      against `analog/<block>/spec.json#power_domain` declarations.

  - id: M3
    name: "Mixed-Signal Verification (AMS co-sim + RNM + interface signal integrity)"
    stage: stage_mixed_signal
    required_inputs:
      - from: M1
        path: "phase3/mixed_signal/top_merged.gds"
    condition:
      files_exist: ["phase1/analog/analog_block_list.json"]
    skills: [mixed-signal-cosim, ams-sim]
    programs:
      - mixed_signal_cosim_check
      - mixed_signal_interface_si_check
    required_outputs:
      - "phase3/mixed_signal/cosim/mixed_signal_results.json"
      - "reports/analog/mixed_signal/interface_si.json"
    gate:
      all_of:
        - program_exit_zero: "mixed_signal_cosim_check . --json reports/analog/mixed_signal/cosim_audit.json"
        - program_exit_zero: "mixed_signal_interface_si_check . --json reports/analog/mixed_signal/interface_si_audit.json"
    blocks_on: [M2]

  - id: M4
    name: "Mixed-Signal Sign-Off (top-level PV + final verdict)"
    stage: stage_mixed_signal
    # prose says "the merged, co-sim-verified top (M1-M3)"; the only named
    #  artefact is M1's merged top.
    required_inputs:
      - from: M1
        path: "phase3/mixed_signal/top_merged.gds"
    condition:
      files_exist: ["phase1/analog/analog_block_list.json"]
    skills: [tapeout-checklist]
    programs:
      - mixed_signal_signoff_check
    required_outputs:
      - "reports/analog/mixed_signal/signoff.json"
    gate:
      program_exit_zero: "mixed_signal_signoff_check . --json reports/analog/mixed_signal/signoff_audit.json"
    blocks_on: [M3]


  - id: 40
    name: "Fabrication (foundry mask-set + wafer fab — external)"
    stage: stage5_manufacturing
    required_inputs:
      - from: 38
        outputs: all
    condition:
      files_exist: ["phase3/stage5_manufacturing/silicon_received.json"]
    programs:
      - manufacturing_fab_intake_check
    required_outputs:
      - "phase3/stage5_manufacturing/mask_set_received.json"
      - "phase3/stage5_manufacturing/wafer_lot_received.json"
    gate:
      all_of:
        # THE ON-PASS REVIEW OF STAGE 4 USED TO BE DECLARED HERE, AND HERE IS
        # A STEP NO RUN HAS EVER REACHED. This step's `condition:` is
        # `files_exist: [phase3/stage5_manufacturing/silicon_received.json]`.
        # MEASURED at v1.13.70: `find` over the tree returns 0 such files and
        # `git log --all --diff-filter=A -- '*silicon_received.json'` is EMPTY --
        # no commit in the repository's history has ever added that path. A step
        # whose condition is unmet is SKIPPED-CONDITION and ITS GATE IS NOT RUN,
        # so R4_DIE_IS_NOT_THE_DESIGN -- the one rule that reads the artefact
        # that actually LEAVES -- had never executed inside the flow and could
        # not until silicon is physically received.
        #
        # The comment this replaces named the reason it was put here: "Wired
        # onto any stage4 step (37.5ic, 38, 39 are the tempting ones) it would
        # re-enter itself without bound, which is why it is not." That was true
        # and it is now false: `flow_compliance_check` refuses to re-enter a
        # stage scope an outer pass already has open (`_SCOPE_STACK_ENV`), so
        # `stage4_compliance` is safe on a stage-4 step. Both the review and the
        # wrapper now live on step 39, the LAST step in this flow that carries
        # no `condition:` at all -- every step after it (M1-M4, 40-44) is
        # conditioned on an artefact a doc-to-GDS run does not produce.
        - program_exit_zero: "manufacturing_fab_intake_check . --json reports/manufacturing/fab_intake.json"
        # THE STAGE-4 BOUNDARY, ASKED BY THE STEP THAT SPENDS THE MASK SET.
        # `stage4_compliance` is the end-of-stage gate the README names for
        # stage4 (power analysis, metal fill, DFM, tapeout checklist, GDSII,
        # foundry handoff, FPGA sign-off). Stage 4 is the last stage a design
        # can still be fixed in; step 40 is the first step after it and this
        # step's own notes say "Not waivable for production tape-out". Masks
        # are cut here, so this is the last moment at which "was stage 4
        # actually finished" is a question anyone can act on. Nothing invoked
        # the wrapper before, so the boundary was documented and unmeasured.
        #
        # ADVISORY. Step 40 records what the FOUNDRY shipped back; a stage-4
        # finding is upstream of that intake and each stage-4 step already
        # carries its own blocking gate. Re-blocking here would refuse the
        # intake record for a defect the intake did not cause. The wrapper also
        # hardcodes `--strict`.
        #
        # MOVED TO STEP 39 with the review it produces the verdict for. The
        # recursion this paragraph used to fear is now refused by name rather
        # than avoided by placement, and placement was costing the whole review.
    blocks_on: [38]
    notes: |
      External step. Plugin records lot id, mask set version, and
      foundry status; verifies wafer-lot file lands when foundry
      ships. Not waivable for production tape-out.

  - id: 41
    name: "Wafer Sort / Probe Test (ATE + probe card)"
    stage: stage5_manufacturing
    required_inputs:
      - from: 40
        path: "phase3/stage5_manufacturing/wafer_lot_received.json"
    condition:
      files_exist: ["phase3/stage5_manufacturing/silicon_received.json"]
    programs:
      - wafer_sort_yield_check
    required_outputs:
      - "phase3/stage5_manufacturing/wafer_sort_yield.json"
      - "phase3/stage5_manufacturing/wafer_map.csv"
    gate:
      program_exit_zero: "wafer_sort_yield_check . --json reports/manufacturing/wafer_sort.json"
    blocks_on: [40]

  - id: 42
    name: "Packaging (assembly: wirebond / FC-CSP / WLCSP)"
    stage: stage5_manufacturing
    required_inputs:
      - from: 41
        outputs: all
    condition:
      files_exist: ["phase3/stage5_manufacturing/silicon_received.json"]
    programs:
      - packaging_intake_check
    required_outputs:
      - "phase3/stage5_manufacturing/packaging_log.json"
    gate:
      program_exit_zero: "packaging_intake_check . --json reports/manufacturing/packaging.json"
    blocks_on: [41]

  - id: 43
    name: "Final Test (ATE: functional + parametric + burn-in)"
    stage: stage5_manufacturing
    required_inputs:
      - from: 42
        path: "phase3/stage5_manufacturing/packaging_log.json"
    condition:
      files_exist: ["phase3/stage5_manufacturing/silicon_received.json"]
    programs:
      - final_test_attestation_check
    required_outputs:
      - "phase3/stage5_manufacturing/final_test_yield.json"
      - "phase3/stage5_manufacturing/burn_in_results.json"
    gate:
      program_exit_zero: "final_test_attestation_check . --json reports/manufacturing/final_test.json"
    blocks_on: [42]
    notes: |
      Final-test sign-off before product ship. Functional test
      across PVT corners, parametric trim, optional burn-in for
      automotive / medical grades. Burn-in here is the production
      infant-mortality SCREEN; long-duration reliability qual is the
      separate Step 44 (HTOL).

  # ── Step 44: Reliability Qualification (HTOL) ────────────────────
  # v2.3 — HTOL (High-Temperature Operating Life) / reliability
  # qualification is a distinct long-duration stress qual (cumulative
  # device-hours at elevated T/V → FIT rate), NOT the same thing as
  # the Step-42 burn-in screen. Data originates from external burn-in
  # / HTOL chambers; the gate verifies the attestation artifact is
  # substantive (device-hours, failures, derived FIT), never
  # fabricates reliability numbers.
  - id: 44
    name: "Reliability qualification (HTOL / FIT attestation)"
    stage: stage5_manufacturing
    required_inputs:
      - from: 43
        outputs: all
    condition:
      # vibe-ic#220 — scope on the SILICON INTAKE declaration, not on this
      # step's own output.
      #
      # This condition used to name `htol_results.json`, which is also this
      # step's required_output. Missing HTOL results are the defect the
      # attestation exists to catch, so the gate was disarmed by exactly the
      # situation it was written for — and worse than the predicate-level
      # cases, because `check_step` evaluates a step-level condition
      # (flow_compliance_check.py:5200) and returns SKIPPED-CONDITION at :5219
      # BEFORE the required_outputs check at :5253. Listing the artefact as a
      # required_output therefore never made its absence loud: the step
      # returned long before that line. A chip with silicon and no reliability
      # qual at all reported nothing wrong.
      #
      # `silicon_received.json` is the same intake declaration steps 40-43 use.
      # Pre-silicon runs still skip (correct scoping — you cannot HTOL a design
      # that was never fabricated), but once silicon exists an absent
      # htol_results.json now reaches the required_outputs check and reports
      # MISSING instead of vanishing.
      files_exist: ["phase3/stage5_manufacturing/silicon_received.json"]
    programs:
      - htol_attestation_check
    required_outputs:
      - "phase3/stage5_manufacturing/htol_results.json"
    gate:
      program_exit_zero: "htol_attestation_check . --json reports/manufacturing/htol.json"
    blocks_on: [43]
    notes: |
      Optional / grade-driven: required for automotive (AEC-Q100) /
      medical / industrial qualification; consumer MPW runs may skip
      (the condition gate keeps it dormant until htol_results.json
      exists).

  # ── P0 (Wave 91 / v1.6.15): structural-RTL umbrella ─────────────
  # Renamed from synthetic Step -1. Aggregates all _STRUCTURAL_RTL_GATES
  # registered in `flow_compliance_check.py` and emits a single
  # PASS/FAIL umbrella verdict that flow-orchestrate consumes before
  # stage1 begins. Stage-class marker (P*-prefix), like A*/M*. Skipped
  # automatically when --stage 3/4 is requested or when no RTL is
  # present in the project.
  # DO NOT hardcode the gate count here. Both this comment and the step
  # name below carried the v1.6.15-era count long after the registry had
  # grown past 240, so the flow's own documentation understated P0's
  # scope by roughly 3x for anyone reading the yaml. The count is
  # emitted live at runtime from len(_STRUCTURAL_RTL_GATES) — see the
  # umbrella's own step name in the report, or
  # `flow_compliance_check.py --list-structural-gates`.
  - id: P0
    name: "Structural-RTL pre-flight (chip-AGNOSTIC structural gates)"
    stage: stage1
    # vibe-ic#923 — the ORDERING edge, written down to match the DATA edge one
    # line below. P0 reads step 1's RTL, so it cannot precede step 1, and step
    # 1 blocks on D1; without this edge P0 was a stage1 step whose ancestry did
    # not reach Phase 1, so a FAILED Phase 1 would not have redded it. This was
    # invisible while `stages[].steps` was a second membership declaration:
    # that roster never listed P0, so the guard that checks stage1 ancestry
    # never looked at it. Deleting the roster made the guard see it.
    blocks_on: [1]
    required_inputs:
      - from: 1
        path: "phase2/stage1/rtl/*.sv OR phase2/stage1/rtl/*.v"
    # NO required_outputs — DELIBERATE, and NOT the same case as a step whose
    # declaration is merely missing (vibe-ic#983 ruling 3). P0 owns no artefact
    # at all: it is a SYNTHETIC preflight whose verdict is emitted directly by
    # `flow_compliance_check._run_structural_rtl_gates(...)` into the audit's
    # own `reports/audit/phase23_completion_audit.json`, under the `gates:`
    # array (see `notes:` below).
    #
    # That file belongs to the AUDIT, not to P0. Declaring it here would make
    # P0's dimension-3 cell judge a file P0 does not produce — the step would
    # be certified by an artefact whose producer is the very program doing the
    # certifying. That is the same pathology vibe-ic#984 names for the Step 9
    # netlist split, and the one the withdrawn FS1 closure demonstrated (see
    # the FS1 comment above, where declaring an auditor-produced path was
    # MEASURED to stop the producer from ever running).
    #
    # So the 63x8 matrix must publish P0 as NA for the artefact dimensions
    # rather than as a gap awaiting a declaration. It already does: d3, d7 and
    # d8 all read NA today, and d3's NA branch asserts the precondition LIVE
    # (`assert not F.declares_required_outputs(sid)`), so if anyone ever adds
    # required_outputs here the NA self-invalidates and the suite goes red
    # instead of silently re-grading the cell. This comment is that ruling
    # written down at the point of decision, which is the only place a future
    # reader looks.
    notes: |
      Synthetic preflight stage; the verdict is emitted directly by
      flow_compliance_check.py's `_run_structural_rtl_gates(...)` and
      surfaces in reports/audit/phase23_completion_audit.json under the
      `gates:` array. Individual gate names (e.g. `cdc_async_input_check`,
      `bram_pdob_combinational_check`) appear there with PASS/FAIL.

# Final gate — runs after all 41 main-track integer steps + A1-A9
# + M1-M4 (54 entities total) + P0 structural-RTL umbrella.
#
# `--json reports/flow_compliance.json` IS LOAD-BEARING, not a convenience.
# Every `on_pass_review:` gate above reads this exact path with `--compliance`
# to establish the stage verdict it fires on. Until v1.13.40 this ran with no
# `--json` at all and the six gates named no verdict source, so
# `stage_on_pass_review.stage_passed()` returned UNESTABLISHED and the review
# exited 2 NOT CHECKED before consulting a rule — on every input, forever.
# Nine rules across six stages had therefore never refused anything.
# `on_pass_review_answerable_check.py` keeps the two halves in agreement: it
# FAILS if a gate names a report this line does not write, or names none.
final_gate:
  program: flow_compliance_check
  args: ". --flow phase1_phase2_phase3 --strict --json reports/flow_compliance.json"
  exit_zero_required: true
