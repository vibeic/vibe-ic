        #   a  ibex           phase-1 completeness 149/182, 33 tokens missing
        #   a  opentitan_aes  phase-1 completeness 288/328, 40 tokens missing
        #   a  sha256/<first run>
        #                     the TDF coverage measurement was never produced;
        #                     FMEDA baseline invalid so DC is unmeasurable
        #   a  sha256/<second run>
        #                     post-route sign-off corner setup worst-slack
        #                     -8.830 ns VIOLATED; TDF coverage 0.0% vs floor 90%
