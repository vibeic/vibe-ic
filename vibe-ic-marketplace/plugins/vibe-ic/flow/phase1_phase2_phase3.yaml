        #
        #   a  arm_aix        phase1_one_shot.json — the Phase-1 runner's own
        #                     published verdict, delegated_rc 1; no waivers.json
        #                     and no reports/orchestrator/ anywhere in the root
        #   a  espi           spare preservation x3 — 12 inserted, 12 survived,
