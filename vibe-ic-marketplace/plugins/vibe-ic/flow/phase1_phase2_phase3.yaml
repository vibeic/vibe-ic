        # What is left for L3 is the case the artefact cannot see — a manifest
        # that EXISTS and does not record these two steps, or records them
        # stale or FAIL. No `--out-dir`, so this clause writes nothing either.
        #
        # THE PROSE BELOW DOES NOT SPELL THOSE TWO CLAUSES' PROGRAM NAME, and
        # that is a wiring constraint rather than a style choice. The #470
        # dead-gate regression joins EVERY value of every clause mapping in
        # this gate into one string and COUNTS that spelling, so it must equal
        # the number of provenance sub-gates the gate actually carries. An
        # `absent_condition_reason` is one of those values, so naming the
        # program in a sentence reads to that test as a THIRD provenance
        # sub-gate — a gate the flow does not have. The reason says which
        # clauses it means by what they do; the count stays the truth.
        - advisory_program_exit_zero:
            command: "mcp_execution_verify --manifest latest_results.jsonl --require-steps drc,lvs"
            advisory_reason: "NOT-YET-CLEAN: this gate CAN refuse and is wired advisory as a ratchet position, not as a verdict. Notch measured rc 1 on a real spm run (2026-08-31): it REFUSES TODAY on real input; the advisory slot is currently swallowing a live finding. Promote to blocking once this run is clean."
            condition_files_exist: ["latest_results.jsonl"]
            absent_condition_reason: >-
              Scoped to a run that drove the MCP-EDA server: the manifest is
              written by the MCP tools themselves and by nothing in this flow,
              so a program-only run has no execution record to read and this
              gate would be reporting on an absence rather than judging one.
              The DRC and LVS artefacts, and the two blocking provenance slots
              above that require those artefacts to name the tool that made
              them, are what evidence a tool run on that path.
    blocks_on: [23, 24, 25, 26, 27, 29, 30]

  # ── Step 32: Post-route timing repair pass ───────────────────
  # RENAMED (owner call). This step was called "ECO (Engineering Change Order)"
  # and the line here claimed it was industry standard. Both were wrong, and the
  # name was doing real damage.
  #
  # What it MEASURABLY does, read off the OpenROAD script it generates:
  #   read_def(routed) -> read_liberty(ss/tt/ff) -> estimate_parasitics
  #   -> repair_design -> repair_timing -setup -> global_route
  #   -> detailed_route -> write_def/write_verilog
  #
  # It RE-ROUTES THE WHOLE DESIGN. An ECO is by definition incremental and
  # PRESERVES the existing implementation — that preservation is the entire
  # point, because it is what makes a metal-only mask revision possible. A step
  # that re-runs detailed_route is not an ECO under any definition; it is a
  # second optimisation pass. And an "Engineering Change Order" is a change
  # order against a RELEASED design: this flow has no tapeout, no mask set and
  # no frozen revision, so there is nothing for an order to change.
  #
  # WHY THE NAME MATTERED, not just cosmetics: an ECO is assumed incremental,
  # safe and improving, so the step inherited that trust. That is why nobody
  # ever compared its own before/after — `repair_before` and `repair_after` sat
  # adjacent in one JSON record and were never subtracted, and a pass that made
  # setup 12x WORSE was recorded as applied (fixed v1.8.62). Same defect family
  # as naming an ATPG cut netlist a "scan netlist": a name asserting a property
  # the thing does not have.
  #
  # The rename is complete across the executable contract: module names, Python
  # identifiers, decision keys, gate names, directory names and artefact names
  # all use `postroute_timing_repair` / `repair`. There is no `eco_*` alias;
  # accepting both vocabularies would recreate the ambiguity at the API edge.
  #
  # CORRECTLY named and untouched: Step 18 "Spare-cell + ECO-prep insertion
  # (Design-for-ECO)" — inserting spares pre-tapeout so a FUTURE ECO is
  # possible is exactly what Design-for-ECO means; and `metal_eco` /
  # `base_layer_eco` in yield_fix_cost_rank, which are genuine post-tapeout
  # remediation classes sitting alongside `respin`.
  #
  # FIXED 2026-07-31 (was: KNOWN MISMATCH, recorded not fixed). This step used
  # to list `skills: [eco-plan]`, whose premise is "minimise disruption to an
  # already-placed-and-routed netlist, prefer metal-only" — the exact opposite of
  # what the automated path does, which is re-route everything. `eco-plan` is
  # correctly named for what IT does; it was simply not the thing this step needs.
  #
  # It now lists `sta-review`, which reads STA reports, triages setup/hold/
  # recovery/removal violations and proposes fixes. That IS the question a human
  # or agent faces when this repair pass fails to close: not "how do I plan a
  # change order against a released design" (there is no released design) but
  # "which paths did not close, and what would close them".
  #
  # `eco-plan` and `design-for-eco` remain, unchanged, for the case they were
  # written for: a real post-tapeout change against a frozen revision.
  # A timing failure can fire this whole-design repair and reroute pass. A hard
  # failure in a non-timing sign-off domain withholds the no-repair certificate
  # and leaves the named domain red; Step 32 does not pretend its timing deck
  # can repair IR, EM, SI or PV. If all sign-off domains pass, the step records
  # `no_repair_needed` and passes through.
  #
  # v1.7.64 — what the AUTO-trigger actually does vs what the skill does.
  # `postroute_timing_repair_decision.decide()` is the single shared policy used
  # by `phase3_one_shot_runner` and `postroute_timing_repair_status_gen`. It:
  #   * DECIDES ON TIMING from the multi-corner OCV sign-off (ss/ff), falling
  #     back to single-corner tt when the PDK exposes one corner (§4.05), and
  #     AUTO-RUNS `postroute_timing_repair.tcl` for a timing violation;
  #   * FAILS CLOSED on the NON-timing domains — it reads the sign-off
  #     verdicts this run already wrote (reports/phase3/{ir_drop,em,
  #     si_crosstalk,lvs,lvs_verdict,erc,antenna}.json,
  #     reports/phase2/gates/{erc_density,perc_signoff}.json) and REFUSES to
  #     write `no_repair_needed.flag` while any of them reports a HARD failure.
  #     It does NOT auto-repair those domains: the flag is withheld, this
  #     step's gate goes red (NO_REPAIR_ARTIFACT), and `sta-review` owns
  #     the repair. Before v1.7.64 the decision read STA alone, so a run with
  #     a failed IR-drop / EM / SI / PV sign-off still certified "no repair
  #     needed" and `postroute_timing_repair_audit` short-circuited to PASS.
  #   Only explicit hard-fail signals count (verdict/status/result FAIL,
  #   VIOLATED, MISMATCH…, or passed/pass/summary.pass == false). Missing,
  #   unparseable, advisory and review-tier artefacts do NOT demand repair.
  - id: 32
    name: "🔁 Post-route timing repair pass (multi-corner repair_design + repair_timing + reroute)"
    stage: stage3
    closed_loop:
      fallback_to: 32
      trigger: "Aggregator: re-run #21-#28 after post-route timing repair"
    skills: [sta-review]
    required_outputs:
      - "phase3/stage3/postroute_timing_repair/repair_log.json OR phase3/stage3/postroute_timing_repair/no_repair_needed.flag"
      # The trigger DECISION itself is a durable §4.05 audit-trail artefact and
      # is written on EVERY branch of the repair block (no repair needed,
      # repair fired, and the single-corner required-but-not-auto-run fallback —
      # the one branch that writes NEITHER repair_log.json NOR
      # no_repair_needed.flag). It records the basis, whether multi-corner OCV was available, and the
      # violated corners; without it a reviewer cannot tell WHY repair did or
      # did not fire. Nothing verified it before.
      # NOT declared here, deliberately: no_repair_summary.json (postroute_timing_repair_status_gen
      # writes it only on the no-repair branch) and postroute_timing_repair.tcl (a
      # best-effort pre-stage inside try/except) — both are branch-conditional,
      # so declaring them would manufacture a MISSING on a legitimate run.
      - "phase3/stage3/postroute_timing_repair/postroute_timing_repair_decision.json"
    gate:
      all_of:
        - files_exist: ["phase3/stage3/postroute_timing_repair/repair_log.json", "phase3/stage3/postroute_timing_repair/no_repair_needed.flag"]
          any_of: true
        # `condition_files_exist` is ANY-of: the program runs when at least one
        # listed path exists. It used to list repair_log.json ALONE, which made
        # the gate unreachable in precisely the state the audit exists to
        # judge — a run that wrote `no_repair_needed.flag` has no repair log, so the
        # audit was skipped and the flag certified the step by itself. That is
        # the false-clean the decision record's fail-close was written to
        # prevent, one artefact downstream: measured on a project holding
        # the flag next to a decision record saying `repair_needed: true` with a
        # hard IR-drop failure, `postroute_timing_repair_audit` returned rc=1 while
        # `_evaluate_gate` returned passed=True with no reasons.
        #
        # The decision record is what is added, and only it: it is the artefact
        # the cross-check reads, and `phase3_one_shot_runner` writes it on
        # EVERY canonicalize pass regardless of which repair branch was taken, so
        # the gate is now reachable on both branches of a real run — including
        # the no-repair branch, where the contradiction can appear.
        #
        # `no_repair_needed.flag` is deliberately NOT listed. Adding it would only
        # cover a tree holding the flag and NO decision record, where the audit
        # has nothing to cross-check and exits 0 anyway — and it would cost
        # something real: `test_matrix_d2_falsifiable` proves each blocking
        # clause can FAIL by materialising every `condition_files_exist` path
        # as a substanceless file, so listing the flag hands the audit a
        # flag-certified no-repair run and the clause stops being reddenable at
        # all. Listing only the record keeps the clause falsifiable and loses
        # no reachable state.
        - optional_program_exit_zero:
            command: "postroute_timing_repair_audit . --json reports/phase2/gates/postroute_timing_repair_audit.json"
            condition_files_exist:
              - "phase3/stage3/postroute_timing_repair/repair_log.json"
              - "phase3/stage3/postroute_timing_repair/postroute_timing_repair_decision.json"
            absent_condition_reason: >-
              Step 32's required_outputs is the single any-of pattern
              `repair_log.json OR no_repair_needed.flag`, so a repair that ran and
              wrote no log leaves NEITHER and the step resolves MISSING,
              loudly. The condition's false branch therefore coincides with an
              honestly declared no-repair run, not with a silent loss of a repair
              that happened.
    blocks_on: [23, 24, 25, 26, 27, 29, 30, 31]

  - id: 33
    name: "Power analysis (pre/post-layout)"
    stage: stage4
    # THE POWER AXIS HAD A COMPARISON AND NO EDGE.
    # `power_total_vs_budget_check` (below) computes the verdict and, until this
    # declaration, handed it to nobody: 19 closed_loop edges existed in this
    # flow and FOUR of them served timing (10->7, 20->19, 23->32, 32->32) while
    # power had exactly ONE (24->15, IR drop) and area had NONE. Step 33
    # measured total power and the number was recorded and then dropped.
    #
    # 17 is the fallback because PLACEMENT is the first lever that moves total
    # power: switching power is dominated by the capacitance the placer decides,
    # and 17 is a transitive blocks_on ancestor of 33, so the edge re-enters
    # this step (`closed_loop_edge_check.CL-NOT-A-LOOP`).
    #
    # The trigger names the DECLARED budget and nothing else. When L19 declares
    # no `power_budget_uw` the gate below REFUSES (rc 2, INCOMPLETE) and this
    # edge is not taken — it is not taken on a derived ceiling either, because a
    # threshold nobody declared is a ruler fitted to the answer
    # (`matrix_mutation_ledger.ART-POWER-FIGURES-X1000`).
    closed_loop:
      fallback_to: 17
      trigger: "power__total above the design's DECLARED budget (L19.power_budget_uw); re-place to cut switching capacitance"
    required_inputs:
      - from: 22
        path: "phase3/stage3/extracted/parasitic.spef OR phase3/stage3/extracted/*.spef"
    # power-analysis never shipped. ppa-measure does, and it is the reader
    # of exactly this step's artefact: "Read PPA artefacts that the tools
    # already wrote -- STA reports, power reports, area reports".
    skills: [ppa-measure]
    required_outputs:
      - "reports/phase3/power.rpt"
      - "reports/phase3/power.json"
    gate:
      # The audit trail goes to the gates/ directory, NOT to
      # reports/phase3/power.json. That path is this step's declared
      # required_output and holds the RUNNER's power summary
      # ({tool: opensta, source, analysis_mode, verdict}); the checker writes a
      # different schema ({program: eda_report_audit:power, passed, findings}),
      # so pointing --json at it would overwrite the power data with the audit
      # of that data. It never actually did, because power_report_check.py
      # rebuilt its own argv and dropped every flag after the project dir — the
      # declared --json was dead, and no audit trail was written anywhere. The
      # wrapper now forwards its flags (same fix lvs_report_check got in #507),
      # so this path had to become a real, separate one at the same time.
      all_of:
        - program_exit_zero: "power_report_check . --mode power --json reports/phase2/gates/power_report.json"
        # THE FIGURES WERE NEVER COMPARED TO ANYTHING. The clause above proves
        # the report came from a real power tool and carries leakage plus
        # dynamic categories; it never reads the numbers.
        # `matrix_mutation_ledger.ART-POWER-FIGURES-X1000` recorded a 1000x
        # rewrite of all 12 non-zero figures staying green.
        #
        # This clause carries the comparison — total power against L19's
        # `power_budget_uw`. MEASURED over the corpus: 0 of the 17 published
        # runs carrying a power report declare that budget (3 of 195 L19 copies
        # do, and that design has no power report), so on today's corpus this
        # clause REFUSES: it prints `INCOMPLETE:` naming the budget it lacks
        # and exits 0. That is the honest verdict and it is not a green — a
        # budget is a REQUIREMENT that has to arrive in the design's own input
        # documents, and deriving one from die area or supply voltage would be
        # a threshold nobody declared. Corpus blast radius: 0 PASS->FAIL.
        - program_exit_zero: "power_total_vs_budget_check . --json reports/phase2/gates/power_budget.json"
        # ORPHANED, RE-HOMED (2026-08-25). Step 33 owns power, and UPF is the
        # power-intent format, so this is the step that can hold a UPF file to
        # its syntax. Its producer is step 7's `l21_to_upf_emit`, which writes
        # `phase2/stage2/constraints/<top>.upf` and declares nothing
        # unconditionally, so this consumer is scoped to the same population.
        #
        # THE CONDITION IS MEASURED, not decorative: run against a directory
        # with no `.upf` the program returns rc 1, not a skip
        # (`return 0 if result.passed else 1`, and `UPF_FILE_EXISTS` is the
        # failing sub-check). Wired unconditionally it is a finding on every
        # design with no power intent — forever, on the majority of them —
        # which is the shape that trains a reader to stop reading advisories.
        #
        # `--json` IS LOAD-BEARING AND ITS PATH IS NOT ONE OF THIS STEP'S
        # DECLARED OUTPUTS. The step declares `reports/phase3/power.rpt` and
        # `reports/phase3/power.json`, and the second holds the RUNNER's power
        # summary; a checker pointed at it would overwrite that summary with an
        # audit of it, which is why every arm of this gate writes into
        # `reports/phase2/gates/` instead — the same footing as the two
        # blocking arms above. Without a sink the program prints its report and
        # keeps no audit trail at all, so a gate arm that ran and a gate arm
        # that did not are indistinguishable afterwards. The report is written
        # on both branches (the write precedes the verdict), and nothing else
        # in the flow reads it, so it stays evidence and adds no
        # `required_outputs` row.
        - advisory_program_exit_zero:
            command: "upf_syntax_check . --json reports/phase2/gates/upf_syntax.json"
            advisory_reason: "DEMOTED from optional_program_exit_zero in 0291e92f1 (2026-08-25): the optional slot REFUSES when its inputs are present, and an unmet condition there still denied the step its PASS tier (test_matrix_d8). Enforcement was traded for the tier, not for a reason about this gate."
            condition_files_exist:
              - "phase2/stage2/constraints/*.upf"
            absent_condition_reason: >-
              Scoped to a design that declares power intent. Step 7's UPF emit
              SKIPs whenever L21 declares no power domains, so a design without
              them carries no `.upf` and there is no power-intent file to hold
              to its syntax — a state this program reports as a FAILING
              `UPF_FILE_EXISTS` sub-check rather than as a skip. The condition
              keeps the finding on the designs the question is about; on a
              design that does carry power intent the clause cannot be
              silenced, because the emit that writes the file is what turns it
              on.
    blocks_on: [23]

  # ── Step 34: Metal Fill (ECO-aware density fill insertion) ───
  # Industry standard (pre-GDS): Insert dummy metal fill to meet
  # foundry density requirements. Without metal fill, CMP
  # (Chemical-Mechanical Polishing) causes uneven planarization and
  # the foundry rejects the tapeout.
  # ECO-AWARE: when Step 18 inserted spare cells, the metal fill MUST
  # use ECO-swappable (removable / non-merged) filler cells and MUST
  # NOT overlap or delete the dont_touch-protected spare instances —
  # otherwise a future metal-only ECO that re-wires a spare would
  # collide with fixed fill. Fill is placed around the spare halos;
  # spares stay reserved as the ECO budget through tapeout. After
  # fill, spare_cell_preservation_check re-confirms every spare from
  # phase3/stage3/pnr/spare_cells.json survives in filled.def / GDS
  # with its keep attribute intact.
  - id: 34
    name: "Metal Fill (ECO-aware density fill insertion)"
    stage: stage4
    required_inputs:
      - from: 21
        path: "phase3/stage3/pnr/routed.def"
      - from: 18
        path: "phase3/stage3/pnr/spare_cells.json"
    mcp_tools: [eda_pnr]
    programs:
      - metal_fill_density_check
      # ECO-aware: re-confirm spares survive fill (no overlap / removal).
      - spare_cell_preservation_check
      # Per-layer DENSITY-TARGETED metal fill on the streamed GDS. The
      # checks above only MEASURE density; OpenROAD filler_placement fills
      # std-cell ROWS. Neither computes how much metal a sparse LAYER needs,
      # so a die under the foundry CMP floor was flagged and left sparse.
      # The emitter runs inside streamout (phase3_one_shot_runner.step_gds),
      # before the density checks and sign-off DRC consume the GDS; the gate
      # below only VERIFIES its report so an audit never mutates the layout.
      - metal_fill_emit
    required_outputs:
      - "phase3/stage3/pnr/filled.def OR phase3/stage3/pnr/metal_fill.done"
      # The density report is STEP 34's artefact — `_emit_metal_fill` writes
      # reports/density.{rpt,json} on the same success path that produces
      # filled.def, and returns False (writing neither) on every failure path.
      # Two gates READ it — metal_fill_density_check here and erc_density_check
      # at Step 31 — and until now NO step declared it, so a run that lost the
      # density report would have both gates degrade silently instead of any
      # step reporting MISSING. `report_path` routes the canonical name to
      # reports/phase3/ while the runner writes reports/ root, and BOTH readers
      # accept either location, so both are accepted here too.
      - "reports/density.json OR reports/phase3/density.json"
      - "reports/density.rpt OR reports/phase3/density.rpt"
      # `reports/spare_preservation.json` IS NOT DECLARED HERE, and the attempt
      # to declare it is what this note replaces. It was added on 2026-08-25
      # because a newly-wired consumer at step 37.5ic began READING it and d7
      # named the pair (`W2:produced_consumed_undeclared`). The declaration
      # cannot stand: this step's only producer of that file is the
      # `optional_program_exit_zero` clause below, which runs only when
      # `phase3/stage3/pnr/spare_cells.json` is present, while
      # `required_outputs` is UNCONDITIONAL — `flow_compliance_check` returns
      # MISSING for a declared entry that is absent, on every project, with no
      # escape. Declaring it asserts a production the same gate denies four
      # lines down, and reds every spare-less design over an artefact nobody
      # owes. Step 7's `.upf` note above refuses the identical shape.
      #
      # The consumer went with it rather than the declaration being kept: this
      # step's own sign-off notes name "declare an undeclared artefact and
      # relocate the red" as a shape to refuse, and that is exactly what the
      # pair amounted to. See the step-37.5ic note for what is required before
      # that consumer can be wired again.
    gate:
      all_of:
        - files_exist: ["phase3/stage3/pnr/filled.def", "phase3/stage3/pnr/metal_fill.done"]
          any_of: true
        - program_exit_zero: "metal_fill_density_check . --json reports/phase2/gates/metal_fill_density.json"
        # Spares must survive ECO-aware fill (fillers swappable, no
        # overlap / removal of dont_touch spares). No-op when Step 18
        # was skipped (no spare_cells.json).
        - optional_program_exit_zero:
            command: "spare_cell_preservation_check . --json reports/phase2/gates/spare_preservation_postfill.json"
            condition_files_exist: ["phase3/stage3/pnr/spare_cells.json"]
            absent_condition_reason: >-
              Scoped to a design that inserted spares at step 18: with no
              spare_cells.json there is no spare pool for ECO-aware fill to
              preserve. A design that DID insert spares carries the manifest,
              because step 18's gate hard-requires it through files_exist, so
              this clause cannot be silenced on the runs it is about.
        # Density-targeted fill VERDICT. `--verify-only` re-reports what the
        # streamout emitter already wrote — it never re-runs the fill, so
        # auditing a finished project cannot mutate its GDS. PARTIAL (a layer
        # that never reached its target) FAILs with the achieved worst-window
        # density disclosed; a missing report exits 2 with a NAMED disclosure
        # (VACUOUS-PASS), never a silent "filled". Opt-in per PDK, same as the
        # Step-26 geometry deck: no fill config, no claim.
        - optional_program_exit_zero:
            command: "metal_fill_emit . --verify-only --json reports/phase2/gates/cmp_fill_emit.json"
            condition_files_exist: ["signoff/cmp_fill_targets.json", "input/pdk/bridge/cmp_fill_targets.json"]
            absent_condition_reason: >-
              Both triggers are PDK-PROVIDED fill-target decks -- opt-in
              inputs, not results of this step: no fill config, no claim. A
              filled design is still judged without them by the UNCONDITIONAL
              metal_fill_density_check clause in this same gate. When the deck
              IS present and the report is missing, this gate exits 2 with a
              NAMED disclosure (VACUOUS-PASS), never a silent 'filled'.
    blocks_on: [32]

  # ── Step 35: DFM screen ──────────────────────────────────────────
  # v2.3 — Design-for-Manufacturability, scoped HONESTLY for an
  # open-source 130-180nm flow: the designer-side measurables run
  # (per-layer CMP density window, redundant-via ratio counted from
  # the routed DEF, litho/min-width margins cross-referenced to the
  # Step-31 DRC deck); the foundry-side mask-synthesis items
  # (OPC / RET / SRAF / PSM) are NAMED FOUNDRY_SIDE disclosure items —
  # they appear at their correct flow position without pretending the
  # designer executes them. At <=28nm they become designer-collaboration
  # items (conditional note in the report).
  - id: 35
    name: "DFM screen (CMP density + redundant-via ratio + foundry-side OPC/RET disclosure)"
    stage: stage4
    required_inputs:
      - from: 34
        outputs: all
    programs:
      - dfm_screen_check
    program_outputs:
      - program: dfm_screen_check
        path: "reports/phase3/dfm_screen.json"
        verdict_field: verdict
    required_outputs:
      - "reports/phase3/dfm_screen.json"
    gate:
      all_of:
        # AUDIT NOTE (by-design, not a gap): this step's only blocking
        # predicate is producer artefact presence. dfm_screen_check is declared
        # in program_outputs above because it classifies PASS/advisory/skip but
        # owns no refusal predicate; Issue #1980 deliberately keeps that
        # producer record out of the gate denominator.
        # BLOCKING half: the screen must have produced its artefact. A step
        # that never ran cannot be certified done.
        - files_exist: ["reports/phase3/dfm_screen.json"]
        # dfm_screen_check is a producer/classifier with PASS,
        # PASS_WITH_ADVISORIES and SKIP outputs but no refusal predicate.
        # Issue #1980 keeps its structured output above and excludes it from
        # the gate denominator. Presence remains the blocking predicate.
    blocks_on: [34]

  - id: 36
    name: "Tapeout checklist (final sign-off confirmation)"
    stage: stage4
    skills: [tapeout-checklist]
    programs:
      - tapeout_signoff_check
    required_outputs:
      - "reports/audit/tapeout_checklist.json"
    # #651 — `tapeout_signoff_check` (= signoff_audit --mode tapeout) carries
    # the PASS_WITH_WAIVERS verdict tier in its EXIT CODE, not only inside the
    # summary JSON: rc 0 = bare/absolute PASS, rc 1 = FAIL, rc 3 (+ a
    # `PASS_WITH_WAIVERS` stdout sentinel) = PASS_WITH_WAIVERS. The rc-3 path
    # is recognised by flow_compliance_check._check_program_exit_zero and
    # promotes THIS step to WAIVED-DEFERRED, so a DRC-waived tapeout reports
    # Overall: PASS_WITH_WAIVERS and never collapses onto a bare PASS
    # (CLAUDE.md rule 11).
    #
    # SI (crosstalk-delay) BLOCKS HERE, and only here. Step 27's MCF sub-gate
    # is `optional_program_exit_zero`, and rc 2 (`VACUOUS_PASS` — the SI gate
    # re-derived NOTHING and says so in writing, ending "Read this as NOT
    # CHECKED") is credited as a pass repo-wide. That is right during
    # development and wrong at a mask order: "SI was checked and is clean" and
    # "SI was never checked" would otherwise be the same green light on the
    # step that commits the design to a mask set.
    #
    # So this step refuses to certify unless `reports/phase3/si_mcf_sta_check
    # .json` PROVED something, or the SPECIFIC vacuity is accepted through the
    # governed waiver channel — a `waivers.json` `waived_steps` entry with
    # `id: 36`, a human `approver`, a reason, and
    # `si_vacuity_accepted: ["<the report's own vacuity_code>"]`. An accepted
    # vacuity demotes this step to WAIVED-DEFERRED (rc 3), never a bare PASS.
    # A waiver can NEVER launder a genuine SI FAIL, an absent or unparseable
    # report, or a PASS carrying no denominator. See the "Tape-out SI" section
    # of `programs/signoff_audit.py`.
    #
    # #587 — a runner report must be ABOUT the project it sits in. A carried-
    # forward `*_one_shot.json` keeps the `project` path AND the verdict of the
    # run it came from, and this is the step where that contaminates the answer
    # that matters. Wired HERE because it is the first point at which every
    # runner report exists.
    #
    # ADVISORY, not blocking. Measured over the tracked corpus: 364 reports
    # found, 303 attributed, 61 FOREIGN — 20%. Wiring a 20%-red gate as
    # blocking fails #492's bar and would make it a gate people route around.
    # Advisory publishes the count on every real run, which is what its own
    # unit test could never do: before this the checker had NOTHING but that
    # test running it, so it had zero coverage of production artefacts and was
    # a fix cited for #587 that never saw one.
    #
    # `all_of`, NOT two keys on one mapping. `_evaluate_gate` returns inside the
    # `program_exit_zero` branch, so a sibling `advisory_program_exit_zero` on
    # the same mapping is unreachable — declared, never executed, and the wiring
    # audit (which reads the flow, not the run) would have called it wired.
    # Measured: with both keys on one mapping, a real project's step 36 FAILed
    # and `reports/audit/report_belongs_to_project.json` was never written.
    # `all_of` evaluates each sub-gate, and deliberately keeps running the
    # advisory ones after a failure (#306/#297).
    gate:
      all_of:
        - program_exit_zero: "tapeout_signoff_check . --mode tapeout --json reports/audit/tapeout_checklist.json"
        - advisory_program_exit_zero:
              command: "report_belongs_to_project_check . --json reports/audit/report_belongs_to_project.json"
              advisory_reason: "NOT-YET-CLEAN: this gate CAN refuse and is wired advisory as a ratchet position, not as a verdict. Notch measured rc 0 on a real spm run (2026-08-31): it is already clean on real input, so blocking would cost nothing today; the only thing holding it advisory is that no other run has been measured."
        # D9 Phase 1 — doctrine rule #4 at the step that signs off. A
        # step-internal `verdict: FAIL` must be ACKNOWLEDGED (waivered, or the
        # parent step's pass.flag dropped); silently keeping pass.flag while a
        # `reports/**/*.json` declares FAIL is the fabrication shape.
        #
        # BLOCKING — the only one of this PR's three, and the reds are why.
        # Re-measured on 2ec8fc2f with `tools/d9_corpus_baseline.py --only
        # step_internal_fail_bubble_up_check`: 17 of 107 red, 90 CLEAN,
        # 0 NO-INPUT, 0 ERROR. Identical to the Phase-0 baseline.
        #
        # ADJUDICATED BY HAND: 6 of the 17 roots opened (arm_aix, lpc, ibex,
        # opentitan_aes, interlaken, espi) and the CONTENT of 4 cited reports
        # read. All REAL, none a ruler artefact:
        #   * interlaken `reports/phase3/antenna.json` — OpenROAD's own
        #     `net_violations: 1, pin_violations: 1, clean: false`. espi and lpc
        #     carry the same file at PASS, so the gate is not firing on presence.
        #   * lpc `reports/spare_preservation.json` — 7 spare cells inserted,
        #     `all_keep_attr_intact: false`. A Design-for-ECO defect.
        #   * arm_aix `reports/phase1_one_shot.json` — the Phase-1 runner's own
        #     `verdict: FAIL`, published.
        # EVERY cited file was checked with `git ls-files --error-unmatch`
        # before being believed, because the Phase-0 baseline had to RETRACT an
        # adjudication built on a file its own sweep had created (§4.4). The 17
        # span 21 DISTINCT report kinds across phase1/2/3 — spare cells, antenna,
        # LEC, STA, DFT, FMEDA, foundry handoff — so this is a population of real
        # defects, not one systemic shape.
        #
        # #1001 — ALL 17 ROOTS NOW ADJUDICATED, not 6. Re-measured on
        # 3fd65e72e: 107 published run roots, 17 RED / 90 CLEAN / 0 NO-INPUT /
