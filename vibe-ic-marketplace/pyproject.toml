# Marketplace-root pytest configuration.
#
# BACKLOG-v13 Wave 6 (v0.119.38). Before this fix, running
# `cd vibe-ic-marketplace && pytest -q` produced 229 collection errors
# because:
#
#   1. multiple plugins ship test files with identical basenames
#      (e.g. every skill has its own `tests/test_compliance.py`),
#      which pytest's default `prepend` import-mode cannot
#      disambiguate without `--import-mode=importlib`;
#   2. some tests in plugins/vibe-ic-d/tests/ use the import form
#      `from programs.<x> import <y>`, which only resolves when the
#      plugin's own `programs/` directory is on `sys.path` — that is
#      handled by per-plugin `conftest.py` (see
#      plugins/vibe-ic-d/conftest.py).
#
# Settings:
#   testpaths    — scopes discovery to per-plugin test dirs, avoiding
#                  duplicate-collection of skill compliance tests via
#                  the rootdir path AND a redundant plugin-rooted path.
#   addopts      — `--import-mode=importlib` lets pytest tolerate
#                  identically-named test modules across plugins.
#   pythonpath   — implicit; per-plugin conftest.py prepends the
#                  needed directories.

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = [
    "plugins/vibe-ic-d/tests",
    "plugins/vibe-ic-d/programs/tests",
    "plugins/vibe-ic-d/skills",
    "plugins/vibe-ic-d/_shared",
]
