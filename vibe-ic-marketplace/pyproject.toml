# Marketplace-root pytest configuration.
#
# BACKLOG-v13 Wave 6 (v0.119.38). Before that fix, running
# `cd vibe-ic-marketplace && pytest -q` produced 229 collection errors
# because:
#
#   1. multiple plugins ship test files with identical basenames
#      (e.g. every skill has its own `tests/test_compliance.py`),
#      which pytest's default `prepend` import-mode cannot
#      disambiguate without `--import-mode=importlib`;
#   2. some tests use the import form `from programs.<x> import <y>`,
#      which only resolves when the plugin's own
#      plugins/vibe-ic/programs/ directory is on `sys.path` — that is
#      handled by the per-plugin conftest.
#
# EVERY testpath HERE NAMED A DIRECTORY THAT HAS NEVER EXISTED, from this file's
# first commit to `ebccf100a0` (v1.13.77).
# The plugin directory is `plugins/vibe-ic/`; all four entries named a
# subdirectory of the RETIRED deterministic-edition plugin instead, and so did
# the prose above them. That retired token is deliberately NOT SPELLED here,
# nor in `test_pytest_ini_paths_exist.py` which narrates the same defect:
# `dead_plugin_path_check` reads a prose mention as dead doctrine, because a
# reader copies a literal out of an explanation as readily as out of an
# instruction. It is readable in full at `ebccf100a0`. pytest does not error
# on a testpath that is not there — it falls back to collecting the rootdir,
# which here hits `plugins/vibe-ic/conftest.py` and dies on
# `Defining 'pytest_plugins' in a non-top-level conftest`. MEASURED on
# `ebccf100a0` (v1.13.77), from this directory:
#
#     as shipped                     no tests collected, 1 error in 0.08 s
#     the paths below                44025 tests collected in 81 s
#
# So the config was not merely stale, it was inoperable — and deleting it does
# not help, which is why it is repaired rather than removed.
#
# THE LIST IS ALSO NO LONGER SHORTER THAN THE SUITE. It now names the same five
# trees `plugins/vibe-ic/run_tests.sh` discovers (44025 and 44024; the one
# node of difference is pytest's own rootdir conftest, collected once). Two
# rosters that can disagree are the defect one layer up from a stale path;
# `test_pytest_ini_paths_exist.py` is parameterised BY CONFIG PATH and holds
# both files to the rule that every directory a config names must resolve.
#
# Settings:
#   testpaths    — scopes discovery to the plugin's test trees, avoiding
#                  duplicate-collection of skill compliance tests via
#                  the rootdir path AND a redundant plugin-rooted path.
#   addopts      — `--import-mode=importlib` lets pytest tolerate
#                  identically-named test modules across plugins.
#   pythonpath   — implicit; per-plugin conftest.py prepends the
#                  needed directories.

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = [
    "plugins/vibe-ic/programs/tests",
    "plugins/vibe-ic/tools/phase1_engine/tests",
    "plugins/vibe-ic/mcp-eda/test",
    "plugins/vibe-ic/skills",
    "plugins/vibe-ic/_shared",
]
