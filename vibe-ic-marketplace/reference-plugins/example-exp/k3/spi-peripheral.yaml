spi-peripheral:
  reference: "Generic SPI peripheral — open contributor pattern set"
  public_source: "https://example.org/ic-design/spi-experience"
  typical_top_module: spi_peripheral_top
  typical_pin_count: 8
  typical_clock_mhz: 50

  typical_structure:
    L1_datasheet:
      typical_pin_roles: [SCK, MOSI, MISO, CSn, IRQn, RSTn, VDD, VSS]
      typical_supply_range: "1.8 V to 3.3 V"
      typical_max_freq: "50 MHz quad mode, 25 MHz standard"

    L3_cmd_protocol:
      typical_command_count: "8-32 (read-dominant)"
      typical_addressing: "16- or 24-bit byte address"
      typical_modes: ["mode 0 (CPOL=0,CPHA=0)", "mode 3 (CPOL=1,CPHA=1)"]

    L4_regmap:
      typical_runtime_reg_count: "8-16"
      typical_status_reg_bits: ["BUSY", "TX_EMPTY", "RX_FULL", "OVERRUN"]
