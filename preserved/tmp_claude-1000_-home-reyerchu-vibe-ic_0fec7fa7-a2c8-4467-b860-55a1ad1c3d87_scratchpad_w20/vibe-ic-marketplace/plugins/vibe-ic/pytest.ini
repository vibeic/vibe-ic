[pytest]
addopts = --import-mode=importlib
# ONE TESTPATH, DELIBERATELY. `single_testpath_guard.py` and
# `test_single_testpath_guard.py::test_current_repo_is_single_tree` pin
# `testpaths == ["programs/tests"]` exactly, and the reason is named there: a
# second testpath is the green-local/red-CI footgun. Do not add one here.
#
# The previous comment on this line was the opposite of that rule. It said the
# full suite is "BOTH test trees" and told the reader to validate with a bare
# `pytest` so "BOTH run" — while this setting listed one, and while the second
# tree it named, `tests/`, DOES NOT EXIST in this repo. I believed the comment
# over the guard and added a second testpath; it reddened
# `test_current_repo_is_single_tree` and `test_shipped_plugin_d2_clean`
# immediately (vibe-ic#1391).
#
# So the comment is corrected to describe the setting, and the coverage hole it
# was papering over is fixed where it belongs: `run_tests.sh` discovers every
# tree, and that is the full suite. Trees NOT collected by bare `pytest`, by
# design, and covered there instead:
#
#   tools/phase1_engine/tests/   the Phase-1 gap/render engine
#   mcp-eda/test/                the MCP EDA server sub-project
#   skills/*/tests/              per-skill compliance
testpaths = programs/tests
