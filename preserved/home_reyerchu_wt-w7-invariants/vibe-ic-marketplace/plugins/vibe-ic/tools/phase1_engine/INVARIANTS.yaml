package: vibe-ic-marketplace/plugins/vibe-ic/tools/phase1_engine
purpose: >-
  The plugin-bundled copy of the Phase-1 gap/render engine. This is the copy
  that ships to installed plugins.
owns:
  - "*.py"
tests:
  root: vibe-ic-marketplace/plugins/vibe-ic/tools/phase1_engine/tests
  collected_by: vibe-ic-marketplace/plugins/vibe-ic/run_tests.sh
  collected_by_kind: named
  note: >-
    Tier 3 of the full suite. Collected by NOTHING before vibe-ic#1391 — not by
    run_tests.sh and not by pytest.ini, which declares one testpath by design.
invariants:
  - id: I_only_stdlib_and_relative_siblings
    statement: >-
      Import stdlib, or a sibling module through a package-relative import.
      Never an absolute import of a repo top-level package.
    rule: forbid_regex
    pattern: '^\s*(?:from|import)\s+(?:programs|tools|skills|benchmark)\b'
    applies_to: ["*.py"]
    severity: BLOCKING
    why: >-
      This engine exists as TWO copies — tools/phase1_engine and the plugin's
      bundled tools/phase1_engine — and gap_detect.py is asserted byte-identical
      between them (test_typical_scaffolds_retired.py::test_both_engine_copies_agree),
      because a change applied to only one ships a stale engine to installed
      plugins. An absolute import binds a module to ONE of the two trees: it
      resolves where that tree is on sys.path and raises where it is not, so the
      copies stop being interchangeable while still looking identical. Every
      import here is stdlib or `.sibling` today; this keeps it that way.
