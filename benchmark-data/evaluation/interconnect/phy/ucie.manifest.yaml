target: UCIe (Universal Chiplet Interconnect Express)
layer: PHY/D2D            # physical + D2D adapter + protocol; FDI/RDI interfaces
role: golden-for-PPA      # digital-controller equivalence + generated PPA
spec:
  public: yes-free        # click-through Evaluation Copy Agreement, no membership
  url: https://www.uciexpress.org/specifications
  versions: ["1.0 (2022)", "1.1 (2023)", "2.0 (2024)", "3.0 (2025)"]
  license_note: eval-only (non-commercial internal eval; no modify/implement rights)
open_rtl:
  repo: https://github.com/ucb-bar/uciedigital
  commit: db57f8f6a85b20690b512ecdbd76069f401dc076   # default branch: main, pinned 2026-06-03
  language: Chisel/Scala (NOT Verilog — needs FIRRTL->Verilog elaboration)
  license: BSD-3-Clause
  targets_spec: UCIe 1.1
  golden_paths:               # full digital stack present (gh-tree verified)
    - d2dadapter/   # LinkManagementController, LinkInit/Reset/Disabled FSMs, parity
    - logphy/       # LinkTrainingFSM, Scrambler, MBTrainer, RdiDataMapper, PatternGen
    - protocol/     # HammingCode, FDI
    - sideband/     # msg encoding, channel/switcher
    - mbafe/        # mainband AFE (analog WIP)
  caveat: analog AFE / schematics explicitly WIP; repo ships NO PPA numbers
golden_usable: yes (digital controller)
measurement_data:
  open_repo_ppa: none (must be GENERATED via synth/PnR on an open PDK)
  spec_target_kpis: ["32 GT/s (1.x)", "48-64 GT/s (3.0)", "~0.5 pJ/bit", "1.35 TB/s/mm^2 @45um"]
  vendor_silicon: ISSCC'26 Rebellions Rebel100 (~4 TB/s, ~11 ns FDI latency) — proprietary
gen_difficulty: 5   # Chisel-vs-Verilog, multi-layer, eval-only spec, analog-AFE PPA gap
vibeic_role: >-
  Elaborate uciedigital to Verilog -> use as GOLDEN for LEC/equivalence of
  vibe-IC-generated D2D-adapter/protocol blocks; synth+PnR (sky130/open PDK) to
  GENERATE digital-stack area/timing. Headline analog KPIs are out of scope.
nvlink_c2c_relation: open public-spec analog of the closed NVLink-C2C die-to-die fabric
confidence: high
sources:
  - https://www.uciexpress.org/2-0-spec-download
  - https://github.com/ucb-bar/uciedigital
  - https://en.wikipedia.org/wiki/UCIe
  - https://www.nvidia.com/en-us/data-center/nvlink-fusion/
  - https://www.tomshardware.com/tech-industry/semiconductors/isscc-2026-rebellions-ucie-rebel-100
