target: AIB / AIB 2.0 (Advanced Interface Bus)
layer: PHY/D2D            # chiplet die-to-die parallel-bus PHY (UCIe can map onto AIB bumps)
role: anchor              # PHY silicon-PPA reference (golden is mixed-signal/partial)
spec:
  public: yes-free
  url: https://github.com/chipsalliance/AIB-specification
  license_note: OWFa 1.0 (royalty-free; contributors sign before PR)
open_rtl:
  repo: https://github.com/chipsalliance/aib-phy-hardware
  commit: a0295cd2b90768c6cfd0795e5754e86dc2b6f747   # default branch: master, pinned 2026-06-03
  license: Apache-2.0
  caveat: value-bearing parts are mixed-signal (DDR forwarded-clock Tx/Rx, microbump
          driver/receiver, DLL/phase, redundancy shift) — not a pure-digital golden
golden_usable: partial (mixed-signal PHY)
measurement_data:
  open: yes — peer-reviewed SILICON
  papers:
    - "CICC 2021 / IEEE 9431555: 256 Gb/s/mm shoreline, 0.83 pJ/b @0.9V/1GHz, 16nm FinFET, 3 ch x 20 pairs, 55um microbumps"
    - "Stratix 10 MX: 1.2 pJ/b/die, 1.5 Mb/s/um^2"
  note: AIB 2.0 = >6x edge bandwidth density of 1.0 (stated as ratios; 2.0 measured silicon not found in primary source)
gen_difficulty: 5   # mixed-signal PHY; open RTL not synthesizable to the headline silicon numbers
vibeic_role: >-
  Use as the PHY-layer SILICON-PPA REFERENCE (real measured pJ/b + bandwidth density)
  to sanity-bound UCIe-class generated-PPA. Not a from-scratch spec->RTL golden.
confidence: high
sources:
  - https://github.com/chipsalliance/aib-phy-hardware
  - https://github.com/chipsalliance/AIB-specification
  - https://ieeexplore.ieee.org/document/9431555
