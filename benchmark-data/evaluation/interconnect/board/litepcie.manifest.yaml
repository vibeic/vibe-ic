target: OpenPCIe / LitePCIe
layer: board-level-ref    # control group (board/FPGA-level, not die-to-die)
role: board-ref
spec:
  public: members-only    # PCI-SIG spec is members-only
  url: https://pcisig.com/specifications
open_rtl:
  repo: https://github.com/enjoy-digital/litepcie
  commit: d1cea9294a7064fdfd777de94627657d53e2198a   # default branch: master, pinned 2026-06-03
  language: Migen/LiteX (Python-generated Verilog)
  license: BSD-2-Clause   # permits closed-source proprietary use
  companion: https://github.com/isomoye-msu/pcie_datalink_layer  # open data-link-layer with measured results
golden_usable: partial
measurement_data:
  open: yes — published FPGA-MEASURED results
  papers:
    - "FPGA 2026 / MDPI Applied Sciences 16(7):3409 (isomoye-msu/pcie_datalink_layer): measured FPGA bandwidth/latency"
gen_difficulty: 5
vibeic_role: >-
  Board-level CONTROL GROUP: a serial-link reference with published FPGA-measured
  bandwidth/latency, to contrast against the die-to-die (UCIe/AIB) results. NOT a
  die-to-die golden — included to bound the comparison.
confidence: high
sources:
  - https://github.com/enjoy-digital/litepcie
  - https://github.com/isomoye-msu/pcie_datalink_layer
