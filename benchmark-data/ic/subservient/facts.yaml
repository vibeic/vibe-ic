# Honest IC-class facts (human-asserted escapes for l_doc_structured_field_count).
# subservient is a REUSED-IP RISC-V SoC (SERV core). Its chip-integration spec:
#  - has NO opcode command protocol (firmware drives the CPU via RISC-V
#    instructions; control is register/datapath, not a chip command protocol)
#  - defines NO chip-level FSM — the control FSM lives inside the reused SERV
#    core (reference_serv), delegated per "內部 sub-module 階層由 Plugin 自選"
#  - has NO calibration / trimming / OTP (pure-digital)
no_command_protocol: true
no_fsm: true
no_calibration: true
